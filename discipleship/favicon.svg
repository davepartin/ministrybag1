<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="gt-app-title">
  <title id="gt-app-title">Growing Together</title>
  <defs>
    <style>
      .sprout {
        fill: none;
        stroke: #FFFFFF;
        stroke-width: 3.1;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .leaf { fill: #FFFFFF; stroke: none; }
    </style>
  </defs>
  <rect width="512" height="512" rx="108" fill="#18263F"/>
  <g>
    <circle cx="320" cy="288" r="110" fill="#EE7B6C" fill-opacity="0.72"/>
    <circle cx="192" cy="288" r="110" fill="#86AE88" fill-opacity="0.72"/>
    <circle cx="256" cy="178" r="110" fill="#7DB6E6" fill-opacity="0.72"/>
  </g>
  <!-- Same 45-degree almond leaves as the logo sprout. Local height 48.3, scale 4.24 => 40% of 512. Centered on the triple-overlap (~256,251). -->
  <g transform="translate(256 258) scale(4.24)">
    <path class="sprout" d="M0 20 C-2 10 1 0 0 -6"/>
    <path class="leaf" d="M-0.8 -6.0 C-0.9 -14.0 -12.5 -24.5 -20.9 -28.3 C-20.9 -17.0 -10.6 -5.2 -0.8 -6.0 Z"/>
    <path class="leaf" d="M0.8 -6.0 C11.8 -4.2 21.9 -16.1 20.9 -28.3 C13.4 -23.7 2.1 -12.9 0.8 -6.0 Z"/>
  </g>
</svg>
