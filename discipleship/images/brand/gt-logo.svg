<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 248" role="img" aria-labelledby="gt-logo-title gt-logo-desc">
  <title id="gt-logo-title">Growing Together</title>
  <desc id="gt-logo-desc">Three overlapping circles: a sprout, a young tree, and an orchard.</desc>
  <defs>
    <style>
      .blend { isolation: isolate; }
      .icon {
        fill: none;
        stroke: #2A2F36;
        stroke-width: 3.35;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fruit { fill: #2A2F36; stroke: none; }
    </style>
  </defs>
  <g class="blend">
    <circle cx="114" cy="124" r="102" fill="#8AB0D6" style="mix-blend-mode:multiply"/>
    <circle cx="270" cy="124" r="102" fill="#93BD8E" style="mix-blend-mode:multiply"/>
    <circle cx="426" cy="124" r="102" fill="#F0928A" style="mix-blend-mode:multiply"/>
  </g>

  <!-- Sprout: two almond leaves, ground line, small roots -->
  <g class="icon" transform="translate(114 124)">
    <line x1="-36" y1="10" x2="36" y2="10"/>
    <line x1="0" y1="10" x2="0" y2="-12"/>
    <ellipse cx="-13" cy="-24" rx="9.5" ry="17" transform="rotate(-38 -13 -24)"/>
    <ellipse cx="13" cy="-26" rx="9.5" ry="17.5" transform="rotate(32 13 -26)"/>
    <path d="M0 10 C-7 18 -16 24 -24 28"/>
    <path d="M0 10 C-1 20 -3 28 -5 34"/>
    <path d="M0 10 C7 18 16 24 24 28"/>
  </g>

  <!-- Young tree: circle canopy, branching trunk, fuller roots -->
  <g class="icon" transform="translate(270 124)">
    <line x1="-44" y1="10" x2="44" y2="10"/>
    <circle cx="0" cy="-32" r="29"/>
    <path d="M0 10 V-8"/>
    <path d="M0 -6 L-15 -28"/>
    <path d="M0 -6 L15 -28"/>
    <path d="M0 10 C-12 20 -26 26 -36 30"/>
    <path d="M0 10 C-5 22 -11 30 -15 36"/>
    <path d="M0 10 V38"/>
    <path d="M0 10 C5 22 11 30 15 36"/>
    <path d="M0 10 C12 20 26 26 36 30"/>
  </g>

  <!-- Orchard: three separate round trees, shared ground, fruit dots -->
  <g class="icon" transform="translate(426 124)">
    <line x1="-54" y1="10" x2="54" y2="10"/>
    <circle cx="-33" cy="-8" r="13.5"/>
    <line x1="-33" y1="5.5" x2="-33" y2="10"/>
    <circle cx="0" cy="-16" r="18"/>
    <line x1="0" y1="2" x2="0" y2="10"/>
    <circle cx="33" cy="-8" r="13.5"/>
    <line x1="33" y1="5.5" x2="33" y2="10"/>
  </g>
  <g class="fruit" transform="translate(426 124)">
    <circle cx="-38" cy="-10" r="1.65"/>
    <circle cx="-28" cy="-6" r="1.65"/>
    <circle cx="-6" cy="-20" r="1.65"/>
    <circle cx="6" cy="-24" r="1.65"/>
    <circle cx="0" cy="-12" r="1.65"/>
    <circle cx="8" cy="-16" r="1.65"/>
    <circle cx="28" cy="-6" r="1.65"/>
    <circle cx="38" cy="-10" r="1.65"/>
  </g>
</svg>
