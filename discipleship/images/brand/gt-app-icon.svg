<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="gt-app-title">
  <title id="gt-app-title">Growing Together</title>
  <defs>
    <style>
      .blend { isolation: isolate; }
      .sprout {
        fill: none;
        stroke: #FFFFFF;
        stroke-width: 5.25;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>
  <rect width="512" height="512" rx="108" fill="#18263F"/>
  <g class="blend">
    <circle cx="320" cy="288" r="110" fill="#EE7B6C" fill-opacity="0.84"/>
    <circle cx="192" cy="288" r="110" fill="#86AE88" fill-opacity="0.84"/>
    <circle cx="256" cy="178" r="110" fill="#7DB6E6" fill-opacity="0.84"/>
  </g>
  <g class="sprout">
    <line x1="256" y1="292" x2="256" y2="242"/>
    <ellipse cx="238" cy="228" rx="13" ry="24" transform="rotate(-36 238 228)"/>
    <ellipse cx="274" cy="226" rx="13" ry="25" transform="rotate(32 274 226)"/>
