<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 756" role="img" aria-labelledby="fp-title fp-desc">
  <title id="fp-title">The FIGHT Plan</title>
  <desc id="fp-desc">Fighting from grace, not for it. F: Flee early. Leave at the first step (1 Corinthians 6:18). I: Identity. You belong to Jesus (1 Corinthians 6:19-20). G: Grace. Run to God, not away (Hebrews 4:16). H: Help. Let a believer help you (James 5:16). T: Treasure. Jesus is the better joy (Psalm 16:11). Five letters, five fingers: count them when temptation knocks.</desc>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>
  <rect x="0" y="0" width="360" height="756" rx="20" fill="#FBF8F1"/>
  <text x="180" y="44" text-anchor="middle" class="serif" font-size="30" fill="#1D6B3F">The FIGHT Plan</text>
  <text x="180" y="74" text-anchor="middle" class="sans" font-size="18" fill="#5E5A52">Fighting from grace, not for it</text>

  <g>
    <rect x="16" y="94" width="328" height="108" rx="14" fill="#FFFFFF" stroke="#D1EDD9" stroke-width="2"/>
    <circle cx="50" cy="148" r="24" fill="#1D6B3F"/>
    <text x="50" y="158" text-anchor="middle" class="serif" font-size="28" font-weight="700" fill="#FFFFFF">F</text>
    <text x="88" y="130" class="serif" font-size="24" fill="#155030">Flee early</text>
    <text x="88" y="158" class="sans" font-size="18" fill="#3E3B35">Leave at the first step.</text>
    <text x="88" y="186" class="sans" font-size="18" fill="#1D6B3F">1 Corinthians 6:18</text>
  </g>
  <g>
    <rect x="16" y="212" width="328" height="108" rx="14" fill="#FFFFFF" stroke="#D1EDD9" stroke-width="2"/>
    <circle cx="50" cy="266" r="24" fill="#1D6B3F"/>
    <text x="50" y="276" text-anchor="middle" class="serif" font-size="28" font-weight="700" fill="#FFFFFF">I</text>
    <text x="88" y="248" class="serif" font-size="24" fill="#155030">Identity</text>
    <text x="88" y="276" class="sans" font-size="18" fill="#3E3B35">You belong to Jesus.</text>
    <text x="88" y="304" class="sans" font-size="18" fill="#1D6B3F">1 Corinthians 6:19-20</text>
  </g>
  <g>
    <rect x="16" y="330" width="328" height="108" rx="14" fill="#FFFFFF" stroke="#D1EDD9" stroke-width="2"/>
    <circle cx="50" cy="384" r="24" fill="#1D6B3F"/>
    <text x="50" y="394" text-anchor="middle" class="serif" font-size="28" font-weight="700" fill="#FFFFFF">G</text>
    <text x="88" y="366" class="serif" font-size="24" fill="#155030">Grace</text>
    <text x="88" y="394" class="sans" font-size="18" fill="#3E3B35">Run to God, not away.</text>
    <text x="88" y="422" class="sans" font-size="18" fill="#1D6B3F">Hebrews 4:16</text>
  </g>
  <g>
    <rect x="16" y="448" width="328" height="108" rx="14" fill="#FFFFFF" stroke="#D1EDD9" stroke-width="2"/>
    <circle cx="50" cy="502" r="24" fill="#1D6B3F"/>
    <text x="50" y="512" text-anchor="middle" class="serif" font-size="28" font-weight="700" fill="#FFFFFF">H</text>
    <text x="88" y="484" class="serif" font-size="24" fill="#155030">Help</text>
    <text x="88" y="512" class="sans" font-size="18" fill="#3E3B35">Let a believer help you.</text>
    <text x="88" y="540" class="sans" font-size="18" fill="#1D6B3F">James 5:16</text>
  </g>
  <g>
    <rect x="16" y="566" width="328" height="108" rx="14" fill="#FFFFFF" stroke="#D1EDD9" stroke-width="2"/>
    <circle cx="50" cy="620" r="24" fill="#1D6B3F"/>
    <text x="50" y="630" text-anchor="middle" class="serif" font-size="28" font-weight="700" fill="#FFFFFF">T</text>
    <text x="88" y="602" class="serif" font-size="24" fill="#155030">Treasure</text>
    <text x="88" y="630" class="sans" font-size="18" fill="#3E3B35">Jesus is the better joy.</text>
    <text x="88" y="658" class="sans" font-size="18" fill="#1D6B3F">Psalm 16:11</text>
  </g>

  <text x="180" y="708" text-anchor="middle" class="sans" font-size="18" font-style="italic" fill="#5E5A52">Five letters, five fingers.</text>
  <text x="180" y="734" text-anchor="middle" class="sans" font-size="18" font-style="italic" fill="#5E5A52">Count them when temptation knocks.</text>
</svg>
