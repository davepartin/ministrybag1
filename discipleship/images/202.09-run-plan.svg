<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="rp-title rp-desc">
  <title id="rp-title">The RUN Plan</title>
  <desc id="rp-desc">Flee from sexual immorality (1 Corinthians 6:18). Run from sin, run to Jesus. R: Remember the price. You were bought by Jesus (1 Corinthians 6:20). U: United with Christ. His life is in you (1 Corinthians 6:17). N: Need others. Do not run alone (2 Timothy 2:22).</desc>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>
  <rect x="0" y="0" width="360" height="560" rx="20" fill="#FBF8F1"/>
  <text x="180" y="44" text-anchor="middle" class="serif" font-size="30" fill="#1D6B3F">The RUN Plan</text>
  <text x="180" y="74" text-anchor="middle" class="sans" font-size="18" fill="#5E5A52">Run from sin. Run to Jesus.</text>

  <g>
    <rect x="16" y="94" width="328" height="108" rx="14" fill="#FFFFFF" stroke="#D1EDD9" stroke-width="2"/>
    <circle cx="50" cy="148" r="24" fill="#1D6B3F"/>
    <text x="50" y="158" text-anchor="middle" class="serif" font-size="28" font-weight="700" fill="#FFFFFF">R</text>
    <text x="88" y="130" class="serif" font-size="24" fill="#155030">Remember the price</text>
    <text x="88" y="158" class="sans" font-size="18" fill="#3E3B35">You were bought by Jesus.</text>
    <text x="88" y="186" class="sans" font-size="18" fill="#1D6B3F">1 Corinthians 6:20</text>
  </g>
  <g>
    <rect x="16" y="212" width="328" height="108" rx="14" fill="#FFFFFF" stroke="#D1EDD9" stroke-width="2"/>
    <circle cx="50" cy="266" r="24" fill="#1D6B3F"/>
    <text x="50" y="276" text-anchor="middle" class="serif" font-size="28" font-weight="700" fill="#FFFFFF">U</text>
    <text x="88" y="248" class="serif" font-size="24" fill="#155030">United with Christ</text>
    <text x="88" y="276" class="sans" font-size="18" fill="#3E3B35">His life is in you.</text>
    <text x="88" y="304" class="sans" font-size="18" fill="#1D6B3F">1 Corinthians 6:17</text>
  </g>
  <g>
    <rect x="16" y="330" width="328" height="108" rx="14" fill="#FFFFFF" stroke="#D1EDD9" stroke-width="2"/>
    <circle cx="50" cy="384" r="24" fill="#1D6B3F"/>
    <text x="50" y="394" text-anchor="middle" class="serif" font-size="28" font-weight="700" fill="#FFFFFF">N</text>
    <text x="88" y="366" class="serif" font-size="24" fill="#155030">Need others</text>
    <text x="88" y="394" class="sans" font-size="18" fill="#3E3B35">Do not run alone.</text>
    <text x="88" y="422" class="sans" font-size="18" fill="#1D6B3F">2 Timothy 2:22</text>
  </g>

  <rect x="16" y="454" width="328" height="90" rx="14" fill="#1D6B3F"/>
  <text x="180" y="490" text-anchor="middle" class="serif" font-size="22" fill="#FFFFFF">"Flee from sexual immorality."</text>
  <text x="180" y="522" text-anchor="middle" class="sans" font-size="18" fill="#D1EDD9">1 Corinthians 6:18</text>
</svg>
