<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" role="img" aria-labelledby="ts-title ts-desc">
  <title id="ts-title">Your Three Spaces</title>
  <desc id="ts-desc">Jesus is Lord of every space. 1st Space: home and close friends. 2nd Space, the focus of this lesson: work and school, where most of your week is spent. 3rd Space: everywhere else, like hobbies, gatherings and strangers. In your 2nd Space: nothing to find but faith (Daniel 6:4-5).</desc>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>
  <rect x="0" y="0" width="360" height="600" rx="20" fill="#FBF8F1"/>
  <text x="180" y="44" text-anchor="middle" class="serif" font-size="30" fill="#1A5C38">Your Three Spaces</text>
  <text x="180" y="72" text-anchor="middle" class="sans" font-size="17" fill="#5E5A52">Jesus is Lord of every space</text>

  <g>
    <rect x="16" y="92" width="328" height="96" rx="14" fill="#FFFFFF" stroke="#CCE6D4" stroke-width="2"/>
    <circle cx="52" cy="140" r="24" fill="#CCE6D4"/>
    <text x="52" y="150" text-anchor="middle" class="serif" font-size="28" font-weight="700" fill="#1A5C38">1</text>
    <text x="90" y="130" class="serif" font-size="23" fill="#134528">1st Space</text>
    <text x="90" y="158" class="sans" font-size="16" fill="#3E3B35">Home and close friends</text>
  </g>

  <g>
    <rect x="16" y="204" width="328" height="138" rx="14" fill="#1A5C38"/>
    <rect x="224" y="216" width="108" height="26" rx="13" fill="#CCE6D4"/>
    <text x="278" y="234" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#134528">THIS LESSON</text>
    <circle cx="52" cy="272" r="24" fill="#FFFFFF"/>
    <text x="52" y="282" text-anchor="middle" class="serif" font-size="28" font-weight="700" fill="#1A5C38">2</text>
    <text x="90" y="266" class="serif" font-size="25" fill="#FFFFFF">2nd Space</text>
    <text x="90" y="294" class="sans" font-size="17" fill="#FFFFFF">Work and school</text>
    <text x="90" y="318" class="sans" font-size="15" fill="#E6F3EA">Where most of your week is spent</text>
  </g>

  <g>
    <rect x="16" y="358" width="328" height="96" rx="14" fill="#FFFFFF" stroke="#CCE6D4" stroke-width="2"/>
    <circle cx="52" cy="406" r="24" fill="#CCE6D4"/>
    <text x="52" y="416" text-anchor="middle" class="serif" font-size="28" font-weight="700" fill="#1A5C38">3</text>
    <text x="90" y="396" class="serif" font-size="23" fill="#134528">3rd Space</text>
    <text x="90" y="424" class="sans" font-size="16" fill="#3E3B35">Hobbies, gatherings, strangers</text>
  </g>

  <text x="180" y="500" text-anchor="middle" class="sans" font-size="16" fill="#5E5A52">In your 2nd Space:</text>
  <text x="180" y="536" text-anchor="middle" class="serif" font-size="26" font-weight="700" fill="#1A5C38">Nothing to find but faith</text>
  <text x="180" y="566" text-anchor="middle" class="sans" font-size="15" fill="#5E5A52">Daniel 6:4-5</text>
</svg>
