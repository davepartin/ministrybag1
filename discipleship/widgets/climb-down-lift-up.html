<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climb Down to Lift Others Up</title>
<style>
:root {
  --ink: #2C2416;
  --muted: #6E6559;
  --tray: #F6F4EE;
  --border: #EBE5D9;
  --step-color: #2C2416;
  --step-dark: #2C2416;
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  padding: 0;
  margin: 0;
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.widget-outer {
  background: #FFFFFF;
  border-radius: 0;
  overflow: hidden;
  box-shadow: none;
  border: none;
  max-width: 100%;
  width: 100%;
  margin: 0;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
    border: 1px solid #EBE5D9;
    max-width: 460px;
    margin: 0 auto;
  }
}

.title-bar {
  background: #2C2416;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  margin: 0;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  position: relative;
  background: #FFFFFF;
  padding: 2px 10px 0;
  border-bottom: 1px solid var(--border);
  content-visibility: auto;
  contain-intrinsic-size: auto none auto 238px;
}

.opening-cue {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  padding: 18px;
  pointer-events: none;
  opacity: 1;
}

.opening-cue p {
  margin: 0;
  max-width: 290px;
  padding: 16px 20px;
  border: 1px solid #E6DECF;
  border-radius: 14px;
  background: #FFFFFF;
  box-shadow: 0 10px 28px rgba(44, 36, 22, 0.10);
  color: #2C2416;
  text-align: center;
  font: 600 17px/1.3 Georgia, 'Times New Roman', serif;
}

.opening-cue.is-hidden {
  opacity: 0;
}

.climb-svg {
  display: block;
  width: 100%;
  height: auto;
}

.fade-part {
  opacity: 0;
  pointer-events: none;
}

.fade-part.is-visible {
  opacity: 1;
}

/* Left-side Greatness Scale (rotates 180deg around 72,124.5 when flipping to Kingdom Scale) */
#flip-group {
  transform-origin: 72px 124.5px;
  transform: rotate(0deg);
}

#flip-group.is-flipped {
  transform: rotate(180deg);
}

/* Counter-rotating pill carriages keep GREATEST and LEAST 100% upright while swinging 180deg */
#spec-badge-high {
  transform-origin: 72px 48px;
  transform: rotate(0deg);
}

#spec-badge-low {
  transform-origin: 72px 201px;
  transform: rotate(0deg);
}

#flip-group.is-flipped #spec-badge-high,
#flip-group.is-flipped #spec-badge-low {
  transform: rotate(-180deg);
}

.wb-label {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1px;
  paint-order: stroke;
  stroke: #FFFFFF;
  stroke-width: 4px;
  stroke-linejoin: round;
}

.wb-sub {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.6px;
  paint-order: stroke;
  stroke: #FFFFFF;
  stroke-width: 3.5px;
  stroke-linejoin: round;
}

.spec-pill-text {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.7px;
}

/* Calm repeating highlight pulse on Step 5 (compositor-only opacity + scale, pauses offscreen) */
.loop-pulse {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  pointer-events: none;
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 4px;
  background: var(--tray);
  border-bottom: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  min-inline-size: 28px;
  min-block-size: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
}

.step-dot-fill {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2.5px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
}

.step-dot.passed .step-dot-fill {
  background: rgba(31, 104, 74, 0.18);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.12);
}

.card-area {
  background: var(--tray);
  padding: 6px 12px 9px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(44, 36, 22, 0.06);
  border: 1px solid var(--border);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 14px 10px;
  min-height: var(--card-h, 118px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-heading {
  font: 700 15.5px/1.22 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 4px;
}

.card-verse {
  font: 400 13px/1.38 Georgia, Cambria, serif;
  color: var(--ink);
  margin: 0 0 4px;
}

.verse-ref {
  font: 600 11.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  margin-left: 4px;
  white-space: nowrap;
}

.card-note {
  font: 400 12.5px/1.36 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #463D2F;
  margin: 0;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  appearance: none;
  min-block-size: 44px;
  min-inline-size: 104px;
  padding: 10px 14px;
  border-radius: 10px;
  font: 600 14px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: var(--ink);
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FFFFFF;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.step-count {
  font: 600 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (prefers-reduced-motion: no-preference) {
  .opening-cue {
    transition: opacity 0.32s ease;
  }
  .widget-outer:not(.is-instant) .fade-part {
    transition: opacity 0.36s ease;
  }
  .widget-outer:not(.is-instant) #flip-group,
  .widget-outer:not(.is-instant) #spec-badge-high,
  .widget-outer:not(.is-instant) #spec-badge-low {
    transition: transform 1.25s cubic-bezier(0.32, 0.08, 0.24, 1);
  }
  .widget-outer .step-dot-fill {
    transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
  }
  .widget-outer .nav-btn.primary,
  .widget-outer .verse-card-bar,
  .widget-outer .card-heading {
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease;
  }

  /* Calm repeating highlight wave on Step 5 (5.2s cycle with quiet pause; pauses offscreen) */
  .widget-outer.loop-active:not(.loop-paused) #pulse-you {
    animation: service-wave-1 5.2s ease-in-out infinite;
  }
  .widget-outer.loop-active:not(.loop-paused) #pulse-scale {
    animation: service-wave-2 5.2s ease-in-out infinite;
  }
  .widget-outer.loop-active.loop-paused .loop-pulse {
    animation-play-state: paused;
  }
}

@keyframes service-wave-1 {
  0%, 100% { opacity: 0; transform: scale(0.92); }
  18% { opacity: 0.65; transform: scale(1.18); }
  42%, 70% { opacity: 0; transform: scale(1.26); }
}

@keyframes service-wave-2 {
  0%, 12%, 100% { opacity: 0; transform: scale(0.96); }
  28% { opacity: 0.55; transform: scale(1.08); }
  52%, 70% { opacity: 0; transform: scale(1.12); }
}

#measure-host {
  position: absolute;
  left: -9999px;
  top: 0;
  visibility: hidden;
  pointer-events: none;
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" data-step="0" data-step-dur="0" data-loop-state="stopped">
  <header class="title-bar">
    <h1>Climb Down to Lift Others Up</h1>
    <span class="course-tag">203-04</span>
  </header>

  <div class="stage" id="stage">
    <div class="opening-cue" id="opening-cue" aria-hidden="false"><p>What does greatness look like?</p></div>

    <svg class="climb-svg" id="climb-svg" viewBox="0 0 440 264" width="100%" role="img" aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Climb Down to Lift Others Up</title>
      <desc id="svg-desc">Clean whiteboard stage with the opening question What does greatness look like?</desc>

      <!-- Step 5 crisp Studio Wash double-hairline frame -->
      <g id="finish-frame" class="fade-part" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="6" width="424" height="252" rx="13" stroke="#1F684A" stroke-width="2" stroke-opacity="0.48" />
        <rect x="12.5" y="10.5" width="415" height="243" rx="9.5" stroke="#A8760A" stroke-width="0.9" stroke-opacity="0.38" />
      </g>

      <!-- Step 5 gentle band connecting GREATEST at the bottom of the Kingdom Scale to the bottom serving row -->
      <g id="serving-row-band" class="fade-part">
        <rect x="18" y="179" width="380" height="44" rx="22" fill="#EAF5EF" fill-opacity="0.85" stroke="#1F684A" stroke-width="1.5" stroke-dasharray="5 4" />
      </g>

      <!-- LEFT SIDE: THE FLIPPABLE GREATNESS SCALE (Flips 180deg on Step 2!) -->
      <g id="spectrum-area" class="fade-part">
        <text id="spec-mode-label" class="wb-sub" x="72" y="23" text-anchor="middle" fill="#5A4E3C">WORLD'S SCALE</text>

        <g id="flip-group">
          <!-- Single clean vertical arrow shaft from LEAST to GREATEST -->
          <line id="spec-shaft" x1="72" y1="74" x2="72" y2="181" stroke="#5A4E3C" stroke-width="3" stroke-linecap="round" />
          <polygon id="spec-arrow" points="72,63 64,77 80,77" fill="#5A4E3C" />

          <!-- GREATEST pill: sits at TOP (y=48) on World's Scale, swings 180deg to BOTTOM (y=201) on Kingdom Scale! -->
          <g id="spec-badge-high">
            <rect id="spec-high-rect" x="24" y="35" width="96" height="26" rx="13" fill="#5A4E3C" stroke="#2C2416" stroke-width="1.5" />
            <text id="spec-high-txt" class="spec-pill-text" x="72" y="52" text-anchor="middle" fill="#FFFFFF">GREATEST</text>
          </g>

          <!-- LEAST pill: sits at BOTTOM (y=201) on World's Scale, swings 180deg to TOP (y=48) on Kingdom Scale! -->
          <g id="spec-badge-low">
            <rect id="spec-low-rect" x="28" y="188" width="88" height="26" rx="13" fill="#F6F3EC" stroke="#8E8475" stroke-width="1.4" />
            <text id="spec-low-txt" class="spec-pill-text" x="72" y="205" text-anchor="middle" fill="#5A4E3C">LEAST</text>
          </g>
        </g>
      </g>

      <!-- STEP 5 CALM COMPOSITOR PULSES (pauses offscreen) -->
      <g id="service-pulses" fill="none">
        <circle id="pulse-you" class="loop-pulse" cx="306" cy="201" r="22" stroke="#1F684A" stroke-width="2.2" />
        <rect id="pulse-scale" class="loop-pulse" x="21" y="185" width="102" height="32" rx="16" stroke="#1F684A" stroke-width="2" />
      </g>

      <!-- RIGHT SIDE: THE 4 - 3 - 2 - 1 PYRAMID OF 10 COLORED DOTS (NO TRIANGLE SIDES, NO CLUTTER ARROWS!) -->
      <!-- 9 Distinctly Colored Peer Dots so you can easily track each person as they switch places -->
      <g id="peers-layer" class="fade-part">
        <!-- peer-0: starts at Row 1 top (276,48) - Warm Amber-Gold -->
        <g id="peer-0" class="peer-group"><circle cx="0" cy="0" r="15" fill="#F3D58D" stroke="#B8861B" stroke-width="2" /></g>
        <!-- peer-1: Row 2 left (246,99) - Soft Sage-Teal -->
        <g id="peer-1" class="peer-group"><circle cx="0" cy="0" r="15" fill="#C2E0D8" stroke="#467A6D" stroke-width="2" /></g>
        <!-- peer-2: starts at Row 2 right (306,99) - Sky Blue -->
        <g id="peer-2" class="peer-group"><circle cx="0" cy="0" r="15" fill="#BDD9F2" stroke="#3B6E9C" stroke-width="2" /></g>
        <!-- peer-3: Row 3 left (216,150) - Soft Lavender -->
        <g id="peer-3" class="peer-group"><circle cx="0" cy="0" r="15" fill="#DCD0EC" stroke="#6E568F" stroke-width="2" /></g>
        <!-- peer-4: starts at Row 3 middle (276,150) - Warm Coral-Terracotta -->
        <g id="peer-4" class="peer-group"><circle cx="0" cy="0" r="15" fill="#F2C6B6" stroke="#B55D43" stroke-width="2" /></g>
        <!-- peer-5: Row 3 right (336,150) - Soft Olive-Moss -->
        <g id="peer-5" class="peer-group"><circle cx="0" cy="0" r="15" fill="#D5E2B8" stroke="#657C3B" stroke-width="2" /></g>
        <!-- peer-6: Row 4, 1st spot (186,201) - Dusty Rose -->
        <g id="peer-6" class="peer-group"><circle cx="0" cy="0" r="15" fill="#ECC8D6" stroke="#9B526E" stroke-width="2" /></g>
        <!-- peer-7: Row 4, 2nd spot (246,201) - Warm Apricot -->
        <g id="peer-7" class="peer-group"><circle cx="0" cy="0" r="15" fill="#F5DEC2" stroke="#A6733A" stroke-width="2" /></g>
        <!-- peer-8: Row 4, 4th spot (366,201) - Cool Periwinkle -->
        <g id="peer-8" class="peer-group"><circle cx="0" cy="0" r="15" fill="#C8D3EE" stroke="#4D6094" stroke-width="2" /></g>
      </g>

      <!-- HERO DOT ("You" - bold dark circle with crisp white You label; starts in Row 4, 3rd spot to the right!) -->
      <g id="hero-group" class="fade-part">
        <circle id="node-you" cx="0" cy="0" r="16.5" fill="#2C2416" stroke="#151009" stroke-width="2.3" />
        <text id="lbl-you" class="wb-label" x="0" y="4.2" text-anchor="middle" fill="#FFFFFF" style="stroke:none;">You</text>
      </g>

      <!-- Single clean bottom caption -->
      <text id="stage-caption" class="fade-part wb-label" x="276" y="242" text-anchor="middle" fill="#5A4E3C"></text>
    </svg>
  </div>

  <div class="step-strip" role="group" aria-label="Greatness steps">
    <button type="button" class="step-dot active" data-step="0" aria-label="Start: What does greatness look like?" aria-pressed="true" style="--dot-color: #2C2416;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="1" aria-label="Step 1: The World's Way" aria-pressed="false" style="--dot-color: #5A4E3C;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="2" aria-label="Step 2: Jesus Came Down First" aria-pressed="false" style="--dot-color: #A8760A;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="3" aria-label="Step 3: Greatness Turns Over" aria-pressed="false" style="--dot-color: #1F684A;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="4" aria-label="Step 4: Climb Down to Lift Others Up" aria-pressed="false" style="--dot-color: #2A5B7C;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="5" aria-label="Step 5: A Life That Builds Others Up" aria-pressed="false" style="--dot-color: #1F684A;"><span class="step-dot-fill"></span></button>
  </div>

  <div class="card-area">
    <div class="verse-card">
      <div class="verse-card-bar"></div>
      <div class="verse-card-content" id="card-content" aria-live="polite" aria-atomic="true">
        <h2 class="card-heading" id="card-heading"></h2>
        <p class="card-verse"><span id="card-verse-text"></span><span class="verse-ref" id="card-ref"></span></p>
        <p class="card-note" id="card-note"></p>
      </div>
    </div>

    <div class="nav-bar">
      <button type="button" class="nav-btn secondary" id="prev-btn" disabled>&larr; Back</button>
      <span class="step-count" id="step-count">Ready</span>
      <button type="button" class="nav-btn primary" id="next-btn">Begin &rarr;</button>
    </div>
  </div>
</main>

<div id="measure-host" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  var STEPS = [
    {
      heading: 'Climb Down to Lift Others Up',
      verse: '"Whoever would be great among you must be your servant."',
      ref: 'Mark 10:43',
      note: 'Watch how the world\'s climb to the top compares with serving at the bottom in God\'s upside-down kingdom.',
      accent: '#2C2416',
      accentDark: '#2C2416',
      countLabel: 'Ready',
      nextLabel: 'Begin \u2192',
      caption: '',
      captionColor: '#5A4E3C',
      title: 'Climb Down to Lift Others Up: Start',
      desc: 'Clean whiteboard stage displaying the opening question: What does greatness look like?'
    },
    {
      heading: '1. The World\'s Way',
      verse: '"How high can I get?"',
      ref: 'Mark 10:42',
      note: 'Starting in the bottom row, you pull others down and take their spot to reach the top of the world\'s scale.',
      accent: '#5A4E3C',
      accentDark: '#3F3629',
      countLabel: 'Step 1 of 5',
      nextLabel: 'Next \u2192',
      caption: 'Pulling others down to reach the top',
      captionColor: '#5A4E3C',
      title: 'Step 1: The World\'s Way',
      desc: 'In a 4-3-2-1 pyramid of colored circles, your dark circle starts in the 3rd spot of the bottom row and switches places row by row to reach the top.'
    },
    {
      heading: '2. Jesus Came Down First',
      verse: '"Even the Son of Man came not to be served but to serve, and to give his life as a ransom for many."',
      ref: 'Mark 10:45',
      note: 'Jesus left the highest place and took the lowest place to serve you first. His kingdom turns the scale upside down.',
      accent: '#A8760A',
      accentDark: '#7D5604',
      countLabel: 'Step 2 of 5',
      nextLabel: 'Next \u2192',
      caption: 'In God\'s kingdom, the scale turns upside down',
      captionColor: '#7D5604',
      title: 'Step 2: Jesus Came Down First',
      desc: 'The scale on the left flips 180 degrees from World\'s Scale to Kingdom Scale, putting Greatest at the bottom and Least at the top.'
    },
    {
      heading: '3. Greatness Turns Over',
      verse: '"Whoever would be great among you must be your servant, and whoever would be first among you must be slave of all."',
      ref: 'Mark 10:43-44',
      note: 'Instead of holding on to the top spot, you switch places and help someone else move up.',
      accent: '#1F684A',
      accentDark: '#164E37',
      countLabel: 'Step 3 of 5',
      nextLabel: 'Next \u2192',
      caption: 'Stepping down to help someone else move up',
      captionColor: '#164E37',
      title: 'Step 3: Greatness Turns Over',
      desc: 'At the top of the pyramid, your circle switches places with the circle below, helping them move up into the top spot.'
    },
    {
      heading: '4. Climb Down to Lift Others Up',
      verse: '"Who can I help?"',
      ref: 'John 13:14-15',
      note: 'You keep climbing down row by row, helping others move up past you until you reach the serving row at the bottom.',
      accent: '#2A5B7C',
      accentDark: '#1E435C',
      countLabel: 'Step 4 of 5',
      nextLabel: 'Next \u2192',
      caption: 'Helping others move up past you',
      captionColor: '#1E435C',
      title: 'Step 4: Climb Down to Lift Others Up',
      desc: 'Your circle continues switching places downward through the 3rd row and into the bottom row as each person moves up past you.'
    },
    {
      heading: '5. A Life That Builds Others Up',
      verse: '"The greatest among you shall be your servant."',
      ref: 'Matthew 23:11',
      note: 'The serving role at the bottom is high on the kingdom scale. Greatness is climbing down to lift others up.',
      accent: '#1F684A',
      accentDark: '#164E37',
      countLabel: 'Step 5 of 5',
      nextLabel: 'Start Over',
      caption: 'The serving row is Greatest on the Kingdom Scale',
      captionColor: '#164E37',
      captionX: 210,
      title: 'Step 5: A Life That Builds Others Up',
      desc: 'Your circle stands in the bottom serving row, aligned directly with Greatest at the bottom of the Kingdom Scale.'
    }
  ];

  // 10 Slots of the 4 - 3 - 2 - 1 pyramid (no triangle outline lines)
  // 0: Row 1 top; 1..2: Row 2; 3..5: Row 3; 6..9: Row 4 (slot 8 is 3rd spot from left!)
  var SLOTS = [
    { x: 276, y: 48 },  // 0: Top (Row 1, spot 1)
    { x: 246, y: 99 },  // 1: Row 2, spot 1
    { x: 306, y: 99 },  // 2: Row 2, spot 2
    { x: 216, y: 150 }, // 3: Row 3, spot 1
    { x: 276, y: 150 }, // 4: Row 3, spot 2 (middle)
    { x: 336, y: 150 }, // 5: Row 3, spot 3
    { x: 186, y: 201 }, // 6: Row 4, spot 1
    { x: 246, y: 201 }, // 7: Row 4, spot 2
    { x: 306, y: 201 }, // 8: Row 4, spot 3 (3rd spot to the right - Hero's home!)
    { x: 366, y: 201 }  // 9: Row 4, spot 4
  ];

  // 30% of the previous 360ms swap speed -> 1200ms per swap + 260ms pause between swaps
  var SWAP_DUR = 1200;
  var SWAP_PAUSE = 260;

  var widget = document.getElementById('widget');
  var stage = document.getElementById('stage');
  var openingCue = document.getElementById('opening-cue');
  var svgTitle = document.getElementById('svg-title');
  var svgDesc = document.getElementById('svg-desc');
  var cardContent = document.getElementById('card-content');
  var cardHeading = document.getElementById('card-heading');
  var cardVerseText = document.getElementById('card-verse-text');
  var cardRef = document.getElementById('card-ref');
  var cardNote = document.getElementById('card-note');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  var stepCount = document.getElementById('step-count');
  var dotBtns = Array.prototype.slice.call(document.querySelectorAll('.step-dot'));
  var measureHost = document.getElementById('measure-host');

  var spectrumArea = document.getElementById('spectrum-area');
  var specModeLabel = document.getElementById('spec-mode-label');
  var flipGroup = document.getElementById('flip-group');
  var specShaft = document.getElementById('spec-shaft');
  var specArrow = document.getElementById('spec-arrow');
  var specHighRect = document.getElementById('spec-high-rect');
  var specLowRect = document.getElementById('spec-low-rect');
  var specLowTxt = document.getElementById('spec-low-txt');

  var finishFrame = document.getElementById('finish-frame');
  var servingRowBand = document.getElementById('serving-row-band');
  var stageCaption = document.getElementById('stage-caption');

  var peersLayer = document.getElementById('peers-layer');
  var peerGroups = [];
  for (var pi = 0; pi < 9; pi++) {
    peerGroups.push(document.getElementById('peer-' + pi));
  }

  var heroGroup = document.getElementById('hero-group');

  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) {
    widget.classList.add('is-instant');
  }

  var currentStep = 0;
  var introTimer = null;
  var activeRaf = 0;
  var activeTimers = [];
  var lastMeasuredWidth = 0;

  // Offscreen pause tracking (contentvisibilityautostatechange + IntersectionObserver + visibilitychange)
  var isOnScreen = true;
  var isContentSkipped = false;
  var isDocHidden = typeof document.hidden === 'boolean' ? document.hidden : false;

  function syncLoopPlayback() {
    var shouldLoop = (currentStep === 5 && !reducedMotion);
    var paused = !shouldLoop || !isOnScreen || isContentSkipped || isDocHidden;
    widget.classList.toggle('loop-active', shouldLoop);
    widget.classList.toggle('loop-paused', shouldLoop && paused);
    widget.setAttribute('data-loop-state', !shouldLoop ? 'stopped' : (paused ? 'paused' : 'running'));
  }

  window.CLIMB_DOWN_LOOP = {
    state: function () {
      return {
        step: currentStep,
        active: widget.classList.contains('loop-active'),
        paused: widget.classList.contains('loop-paused'),
        onScreen: isOnScreen,
        skipped: isContentSkipped,
        docHidden: isDocHidden,
        loopState: widget.getAttribute('data-loop-state')
      };
    }
  };

  stage.addEventListener('contentvisibilityautostatechange', function (e) {
    isContentSkipped = !!e.skipped;
    syncLoopPlayback();
  });

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      isOnScreen = entries[entries.length - 1].isIntersecting;
      syncLoopPlayback();
    }, { threshold: 0.01 }).observe(stage);
  }

  document.addEventListener('visibilitychange', function () {
    isDocHidden = !!document.hidden;
    syncLoopPlayback();
  });

  function cancelAnim() {
    if (activeRaf) {
      cancelAnimationFrame(activeRaf);
      activeRaf = 0;
    }
    while (activeTimers.length) {
      clearTimeout(activeTimers.pop());
    }
  }

  function placeGroup(g, x, y) {
    g.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')');
  }

  // Layout the 9 colored peer circles and Hero ("You") for each settled step:
  // Start (before swaps):
  //   peer 0 (Amber-Gold) -> slot 0 (Row 1 top)
  //   peer 1 (Sage)       -> slot 1 (Row 2 left)
  //   peer 2 (Sky Blue)   -> slot 2 (Row 2 right)
  //   peer 3 (Lavender)   -> slot 3 (Row 3 left)
  //   peer 4 (Coral)      -> slot 4 (Row 3 middle)
  //   peer 5 (Olive)      -> slot 5 (Row 3 right)
  //   peer 6 (Rose)       -> slot 6 (Row 4, 1st)
  //   peer 7 (Apricot)    -> slot 7 (Row 4, 2nd)
  //   Hero   (Dark "You") -> slot 8 (Row 4, 3rd spot to the right!)
  //   peer 8 (Periwinkle) -> slot 9 (Row 4, 4th)
  function layoutNodesForStep(idx) {
    var peerSlots;
    var heroSlot;

    if (idx <= 0) {
      peerSlots = [0, 1, 2, 3, 4, 5, 6, 7, 9];
      heroSlot = 8;
    } else if (idx === 1 || idx === 2) {
      // Hero climbed to top (slot 0); Coral (peer 4) pulled to slot 8, Sky Blue (peer 2) pulled to slot 4, Amber-Gold (peer 0) pulled to slot 2
      peerSlots = [2, 1, 4, 3, 8, 5, 6, 7, 9];
      heroSlot = 0;
    } else if (idx === 3) {
      // Hero lifted Amber-Gold (peer 0) back up to slot 0 (top) and stepped down to slot 2 (Row 2)
      peerSlots = [0, 1, 4, 3, 8, 5, 6, 7, 9];
      heroSlot = 2;
    } else {
      // Steps 4 & 5: Hero lifted Sky Blue (peer 2) up to slot 2 and Coral (peer 4) up to slot 4, returning to slot 8 (Row 4, 3rd spot!)
      peerSlots = [0, 1, 2, 3, 4, 5, 6, 7, 9];
      heroSlot = 8;
    }

    for (var i = 0; i < 9; i++) {
      var s = SLOTS[peerSlots[i]];
      placeGroup(peerGroups[i], s.x, s.y);
    }
    var hs = SLOTS[heroSlot];
    placeGroup(heroGroup, hs.x, hs.y);
  }

  function updateSpectrumAppearance(flipped) {
    flipGroup.classList.toggle('is-flipped', flipped);
    specModeLabel.textContent = flipped ? 'KINGDOM SCALE' : 'WORLD\'S SCALE';
    specModeLabel.setAttribute('fill', flipped ? '#164E37' : '#5A4E3C');
    specShaft.setAttribute('stroke', flipped ? '#1F684A' : '#5A4E3C');
    specArrow.setAttribute('fill', flipped ? '#1F684A' : '#5A4E3C');
    specHighRect.setAttribute('fill', flipped ? '#1F684A' : '#5A4E3C');
    specHighRect.setAttribute('stroke', flipped ? '#164E37' : '#2C2416');
    specLowRect.setAttribute('fill', '#F6F3EC');
    specLowRect.setAttribute('stroke', '#8E8475');
    specLowTxt.setAttribute('fill', '#5A4E3C');
    specLowTxt.textContent = 'LEAST';
  }

  function setStaticState(idx) {
    var showStage = idx >= 1;
    var flipped = idx >= 2;

    spectrumArea.classList.toggle('is-visible', showStage);
    peersLayer.classList.toggle('is-visible', showStage);
    heroGroup.classList.toggle('is-visible', showStage);

    updateSpectrumAppearance(flipped);
    layoutNodesForStep(idx);

    servingRowBand.classList.toggle('is-visible', idx === 5);
    finishFrame.classList.toggle('is-visible', idx === 5);

    var s = STEPS[idx];
    stageCaption.textContent = s.caption || '';
    stageCaption.setAttribute('x', String(s.captionX || 276));
    stageCaption.setAttribute('fill', s.captionColor || '#5A4E3C');
    stageCaption.classList.toggle('is-visible', showStage && !!s.caption);

    syncLoopPlayback();
  }

  // Smooth sine ease-in-out pair swap so two dots glide around each other at 30% speed (1200ms per swap)
  function interpolateSwap(fromA, toA, p, sideSign) {
    var e = 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, p)));
    var arc = Math.sin(Math.PI * e) * 18 * sideSign;
    return {
      x: fromA.x + (toA.x - fromA.x) * e + arc,
      y: fromA.y + (toA.y - fromA.y) * e
    };
  }

  function animateStep(idx) {
    cancelAnim();

    if (idx === 1) {
      // Hero starts at bottom row, 3rd spot (slot 8) and slowly swaps up with Coral (slot 4), Sky Blue (slot 2), Amber-Gold (slot 0)
      setStaticState(1);
      var startSlots = [0, 1, 2, 3, 4, 5, 6, 7, 9];
      for (var i = 0; i < 9; i++) {
        placeGroup(peerGroups[i], SLOTS[startSlots[i]].x, SLOTS[startSlots[i]].y);
      }
      placeGroup(heroGroup, SLOTS[8].x, SLOTS[8].y);

      var s1End = SWAP_DUR;
      var s2Start = s1End + SWAP_PAUSE;
      var s2End = s2Start + SWAP_DUR;
      var s3Start = s2End + SWAP_PAUSE;
      var s3End = s3Start + SWAP_DUR;
      widget.setAttribute('data-step-dur', String(s3End));

      var t0 = 0;
      function f1(now) {
        if (!t0) t0 = now;
        var el = now - t0;

        if (el <= s1End) {
          // Swap 1: Hero (slot 8) <-> Coral (peer 4 at slot 4)
          var p1 = Math.min(1, el / SWAP_DUR);
          var h1 = interpolateSwap(SLOTS[8], SLOTS[4], p1, -1);
          var c1 = interpolateSwap(SLOTS[4], SLOTS[8], p1, 1);
          placeGroup(heroGroup, h1.x, h1.y);
          placeGroup(peerGroups[4], c1.x, c1.y);
        } else if (el <= s2Start) {
          placeGroup(heroGroup, SLOTS[4].x, SLOTS[4].y);
          placeGroup(peerGroups[4], SLOTS[8].x, SLOTS[8].y);
        } else if (el <= s2End) {
          // Swap 2: Hero (slot 4) <-> Sky Blue (peer 2 at slot 2)
          placeGroup(peerGroups[4], SLOTS[8].x, SLOTS[8].y);
          var p2 = Math.min(1, (el - s2Start) / SWAP_DUR);
          var h2 = interpolateSwap(SLOTS[4], SLOTS[2], p2, 1);
          var c2 = interpolateSwap(SLOTS[2], SLOTS[4], p2, -1);
          placeGroup(heroGroup, h2.x, h2.y);
          placeGroup(peerGroups[2], c2.x, c2.y);
        } else if (el <= s3Start) {
          placeGroup(heroGroup, SLOTS[2].x, SLOTS[2].y);
          placeGroup(peerGroups[2], SLOTS[4].x, SLOTS[4].y);
        } else if (el <= s3End) {
          // Swap 3: Hero (slot 2) <-> Amber-Gold (peer 0 at slot 0)
          placeGroup(peerGroups[2], SLOTS[4].x, SLOTS[4].y);
          var p3 = Math.min(1, (el - s3Start) / SWAP_DUR);
          var h3 = interpolateSwap(SLOTS[2], SLOTS[0], p3, -1);
          var c3 = interpolateSwap(SLOTS[0], SLOTS[2], p3, 1);
          placeGroup(heroGroup, h3.x, h3.y);
          placeGroup(peerGroups[0], c3.x, c3.y);
        } else {
          activeRaf = 0;
          setStaticState(1);
          return;
        }
        activeRaf = requestAnimationFrame(f1);
      }
      activeRaf = requestAnimationFrame(f1);
      return;
    }

    if (idx === 2) {
      // Scale flips 180 degrees from World's Scale to Kingdom Scale (GREATEST moves to the bottom!)
      setStaticState(2);
      widget.setAttribute('data-step-dur', '1280');
      return;
    }

    if (idx === 3) {
      // Hero at top (slot 0) slowly switches places with Amber-Gold (peer 0 at slot 2), helping them move UP to top!
      setStaticState(3);
      placeGroup(heroGroup, SLOTS[0].x, SLOTS[0].y);
      placeGroup(peerGroups[0], SLOTS[2].x, SLOTS[2].y);
      widget.setAttribute('data-step-dur', String(SWAP_DUR));

      var t3 = 0;
      function f3(now) {
        if (!t3) t3 = now;
        var el = now - t3;
        var p = Math.min(1, el / SWAP_DUR);
        var hPos = interpolateSwap(SLOTS[0], SLOTS[2], p, 1);
        var pPos = interpolateSwap(SLOTS[2], SLOTS[0], p, -1);
        placeGroup(heroGroup, hPos.x, hPos.y);
        placeGroup(peerGroups[0], pPos.x, pPos.y);
        if (el < SWAP_DUR) activeRaf = requestAnimationFrame(f3);
        else { activeRaf = 0; setStaticState(3); }
      }
      activeRaf = requestAnimationFrame(f3);
      return;
    }

    if (idx === 4) {
      // Hero in Row 2 (slot 2) slowly climbs down through Row 3 (slot 4) into Row 4 spot 3 (slot 8),
      // helping Sky Blue (peer 2) and Coral (peer 4) move UP past You!
      setStaticState(4);
      placeGroup(heroGroup, SLOTS[2].x, SLOTS[2].y);
      placeGroup(peerGroups[2], SLOTS[4].x, SLOTS[4].y);
      placeGroup(peerGroups[4], SLOTS[8].x, SLOTS[8].y);

      var aEnd = SWAP_DUR;
      var bStart = aEnd + SWAP_PAUSE;
      var bEnd = bStart + SWAP_DUR;
      widget.setAttribute('data-step-dur', String(bEnd));

      var t4 = 0;
      function f4(now) {
        if (!t4) t4 = now;
        var el = now - t4;
        if (el <= aEnd) {
          // Swap A: Hero (slot 2) steps down to slot 4 while Sky Blue (peer 2 at slot 4) moves UP to slot 2
          var pA = Math.min(1, el / SWAP_DUR);
          var hA = interpolateSwap(SLOTS[2], SLOTS[4], pA, -1);
          var peerA = interpolateSwap(SLOTS[4], SLOTS[2], pA, 1);
          placeGroup(heroGroup, hA.x, hA.y);
          placeGroup(peerGroups[2], peerA.x, peerA.y);
        } else if (el <= bStart) {
          placeGroup(heroGroup, SLOTS[4].x, SLOTS[4].y);
          placeGroup(peerGroups[2], SLOTS[2].x, SLOTS[2].y);
        } else if (el <= bEnd) {
          // Swap B: Hero (slot 4) steps down to slot 8 while Coral (peer 4 at slot 8) moves UP to slot 4
          placeGroup(peerGroups[2], SLOTS[2].x, SLOTS[2].y);
          var pB = Math.min(1, (el - bStart) / SWAP_DUR);
          var hB = interpolateSwap(SLOTS[4], SLOTS[8], pB, 1);
          var peerB = interpolateSwap(SLOTS[8], SLOTS[4], pB, -1);
          placeGroup(heroGroup, hB.x, hB.y);
          placeGroup(peerGroups[4], peerB.x, peerB.y);
        } else {
          activeRaf = 0;
          setStaticState(4);
          return;
        }
        activeRaf = requestAnimationFrame(f4);
      }
      activeRaf = requestAnimationFrame(f4);
      return;
    }

    if (idx === 5) {
      setStaticState(5);
      widget.setAttribute('data-step-dur', '420');
      return;
    }

    widget.setAttribute('data-step-dur', '0');
    setStaticState(idx);
  }

  function updateCardAndChrome(idx) {
    var s = STEPS[idx];
    widget.setAttribute('data-step', String(idx));
    widget.style.setProperty('--step-color', s.accent);
    widget.style.setProperty('--step-dark', s.accentDark);

    cardHeading.textContent = s.heading;
    cardVerseText.textContent = s.verse;
    cardRef.textContent = s.ref;
    cardNote.textContent = s.note;

    svgTitle.textContent = s.title;
    svgDesc.textContent = s.desc;

    stepCount.textContent = s.countLabel;
    nextBtn.textContent = s.nextLabel;
    prevBtn.disabled = (idx === 0);

    dotBtns.forEach(function (btn, i) {
      btn.classList.toggle('active', i === idx);
      btn.classList.toggle('passed', i < idx);
      btn.setAttribute('aria-pressed', i === idx ? 'true' : 'false');
    });
  }

  function goToStep(idx, animateForward, introFinished) {
    if (introTimer !== null) {
      if (idx !== 0) return;
      clearTimeout(introTimer);
      introTimer = null;
    }
    if (currentStep === 0 && idx > 0 && !introFinished && !reducedMotion) {
      openingCue.classList.add('is-hidden');
      openingCue.setAttribute('aria-hidden', 'true');
      introTimer = setTimeout(function () {
        introTimer = null;
        goToStep(idx, animateForward, true);
      }, 340);
      return;
    }
    if (idx < 0 || idx >= STEPS.length) return;
    cancelAnim();
    currentStep = idx;
    openingCue.classList.toggle('is-hidden', idx !== 0);
    openingCue.setAttribute('aria-hidden', idx === 0 ? 'false' : 'true');
    updateCardAndChrome(idx);

    var instant = reducedMotion || !animateForward || idx === 0;
    if (instant) {
      widget.classList.add('is-instant');
      widget.setAttribute('data-step-dur', '0');
      setStaticState(idx);
      if (!reducedMotion) {
        void widget.offsetWidth;
        widget.classList.remove('is-instant');
      }
    } else {
      widget.classList.remove('is-instant');
      animateStep(idx);
    }
  }

  function fitCardHeight() {
    var w = cardContent.clientWidth;
    if (!w) return;
    lastMeasuredWidth = w;
    var clone = cardContent.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('aria-live');
    clone.style.width = w + 'px';
    clone.style.minHeight = '0';
    clone.style.height = 'auto';

    var h = clone.querySelector('#card-heading');
    var v = clone.querySelector('#card-verse-text');
    var r = clone.querySelector('#card-ref');
    var n = clone.querySelector('#card-note');
    if (h) h.removeAttribute('id');
    if (v) v.removeAttribute('id');
    if (r) r.removeAttribute('id');
    if (n) n.removeAttribute('id');

    measureHost.innerHTML = '';
    measureHost.appendChild(clone);

    var maxH = 0;
    for (var i = 0; i < STEPS.length; i++) {
      if (h) h.textContent = STEPS[i].heading;
      if (v) v.textContent = STEPS[i].verse;
      if (r) r.textContent = STEPS[i].ref;
      if (n) n.textContent = STEPS[i].note;
      var measured = Math.ceil(clone.getBoundingClientRect().height);
      if (measured > maxH) maxH = measured;
    }
    measureHost.innerHTML = '';
    if (maxH > 0) {
      widget.style.setProperty('--card-h', maxH + 'px');
    }
  }

  nextBtn.addEventListener('click', function () {
    if (currentStep < STEPS.length - 1) {
      goToStep(currentStep + 1, true);
    } else {
      goToStep(0, false);
    }
  });

  prevBtn.addEventListener('click', function () {
    if (currentStep > 0) {
      goToStep(currentStep - 1, false);
    }
  });

  dotBtns.forEach(function (btn, i) {
    btn.addEventListener('click', function () {
      if (i === currentStep && introTimer === null) return;
      goToStep(i, i === currentStep + 1);
    });
  });

  window.addEventListener('resize', function () {
    var w = cardContent.clientWidth;
    if (w && Math.abs(w - lastMeasuredWidth) > 1) {
      fitCardHeight();
    }
  });

  fitCardHeight();
  goToStep(0, false, true);
})();
</script>
</body>
</html>
