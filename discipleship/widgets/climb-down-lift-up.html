<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climb Down to Lift Others Up</title>
<style>
:root {
  --ink: #2C2416;
  --muted: #6E6559;
  --tray: #F6F4EE;
  --border: #EBE5D9;
  --step-color: #2C2416;
  --step-dark: #2C2416;
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  padding: 0;
  margin: 0;
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.widget-outer {
  background: #FFFFFF;
  border-radius: 0;
  overflow: hidden;
  box-shadow: none;
  border: none;
  max-width: 100%;
  width: 100%;
  margin: 0;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
    border: 1px solid #EBE5D9;
    max-width: 460px;
    margin: 0 auto;
  }
}

.title-bar {
  background: #2C2416;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  margin: 0;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  position: relative;
  background: #FFFFFF;
  padding: 2px 10px 0;
  border-bottom: 1px solid var(--border);
  content-visibility: auto;
  contain-intrinsic-size: auto none auto 246px;
}

.opening-cue {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  padding: 18px;
  pointer-events: none;
  opacity: 1;
}

.opening-cue p {
  margin: 0;
  max-width: 290px;
  padding: 16px 20px;
  border: 1px solid #E6DECF;
  border-radius: 14px;
  background: #FFFFFF;
  box-shadow: 0 10px 28px rgba(44, 36, 22, 0.10);
  color: #2C2416;
  text-align: center;
  font: 600 17px/1.3 Georgia, 'Times New Roman', serif;
}

.opening-cue.is-hidden {
  opacity: 0;
}

.climb-svg {
  display: block;
  width: 100%;
  height: auto;
}

.fade-part {
  opacity: 0;
  pointer-events: none;
}

.fade-part.is-visible {
  opacity: 1;
}

/* Left-side Greatness Spectrum (rotates 180deg around 68,121 on Step 3!) */
#flip-group {
  transform-origin: 68px 121px;
  transform: rotate(0deg);
}

#flip-group.is-flipped {
  transform: rotate(180deg);
}

/* Counter-rotating badge carriages stay 100% upright while swinging 180deg */
#spec-badge-high {
  transform-origin: 68px 46px;
  transform: rotate(0deg);
}

#spec-badge-low {
  transform-origin: 68px 196px;
  transform: rotate(0deg);
}

#spec-badge-mid {
  transform-origin: 68px 121px;
  transform: rotate(0deg);
}

#flip-group.is-flipped #spec-badge-high,
#flip-group.is-flipped #spec-badge-low,
#flip-group.is-flipped #spec-badge-mid {
  transform: rotate(-180deg);
}

/* Circle visual states */
.node-fill-world {
  fill: #EFEBE2;
  stroke: #8E8475;
}

.node-pulled-down {
  fill: #E6DFD1;
  stroke: #7A6E5D;
}

.node-you-world {
  fill: #5A4E3C;
  stroke: #2C2416;
}

.node-you-gospel {
  fill: #FCF2D6;
  stroke: #A8760A;
}

.node-you-servant {
  fill: #1F684A;
  stroke: #164E37;
}

.node-lifted-mid {
  fill: #E2EEF6;
  stroke: #2A5B7C;
}

.node-lifted-top {
  fill: #EDE7F6;
  stroke: #5F4684;
}

.wb-label {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1px;
  paint-order: stroke;
  stroke: #FFFFFF;
  stroke-width: 4px;
  stroke-linejoin: round;
}

.wb-sub {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 10.5px;
  font-weight: 700;
  paint-order: stroke;
  stroke: #FFFFFF;
  stroke-width: 3.5px;
  stroke-linejoin: round;
}

.spec-pill-text {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.6px;
}

/* Calm repeating life-of-service rhythm on Step 5 (compositor-only opacity + scale, pauses offscreen) */
.loop-pulse {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  pointer-events: none;
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 4px;
  background: var(--tray);
  border-bottom: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  min-inline-size: 28px;
  min-block-size: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
}

.step-dot-fill {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2.5px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
}

.step-dot.passed .step-dot-fill {
  background: rgba(31, 104, 74, 0.18);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.12);
}

.card-area {
  background: var(--tray);
  padding: 6px 12px 9px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(44, 36, 22, 0.06);
  border: 1px solid var(--border);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 14px 10px;
  min-height: var(--card-h, 118px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-heading {
  font: 700 15.5px/1.22 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 4px;
}

.card-verse {
  font: 400 13px/1.38 Georgia, Cambria, serif;
  color: var(--ink);
  margin: 0 0 4px;
}

.verse-ref {
  font: 600 11.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  margin-left: 4px;
  white-space: nowrap;
}

.card-note {
  font: 400 12.5px/1.36 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #463D2F;
  margin: 0;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  appearance: none;
  min-block-size: 44px;
  min-inline-size: 104px;
  padding: 10px 14px;
  border-radius: 10px;
  font: 600 14px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: var(--ink);
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FFFFFF;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.step-count {
  font: 600 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (prefers-reduced-motion: no-preference) {
  .opening-cue {
    transition: opacity 0.32s ease;
  }
  .widget-outer:not(.is-instant) .fade-part {
    transition: opacity 0.34s ease;
  }
  .widget-outer:not(.is-instant) #flip-group,
  .widget-outer:not(.is-instant) #spec-badge-high,
  .widget-outer:not(.is-instant) #spec-badge-low,
  .widget-outer:not(.is-instant) #spec-badge-mid {
    transition: transform 0.92s cubic-bezier(0.32, 0.08, 0.24, 1);
  }
  .widget-outer:not(.is-instant) .person-circle {
    transition: fill 0.36s ease, stroke 0.36s ease;
  }
  .widget-outer .step-dot-fill {
    transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
  }
  .widget-outer .nav-btn.primary,
  .widget-outer .verse-card-bar,
  .widget-outer .card-heading {
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease;
  }

  /* Calm repeating service wave on Step 5 (5.2s cycle with ~1.8s quiet rest) */
  .widget-outer.loop-active:not(.loop-paused) #pulse-row4 {
    animation: service-wave-1 5.2s ease-in-out infinite;
  }
  .widget-outer.loop-active:not(.loop-paused) #pulse-row3 {
    animation: service-wave-2 5.2s ease-in-out infinite;
  }
  .widget-outer.loop-active:not(.loop-paused) #pulse-row21 {
    animation: service-wave-3 5.2s ease-in-out infinite;
  }
  .widget-outer.loop-active.loop-paused .loop-pulse {
    animation-play-state: paused;
  }
}

@keyframes service-wave-1 {
  0%, 100% { opacity: 0; transform: scale(0.92); }
  12% { opacity: 0.72; transform: scale(1.16); }
  28%, 68% { opacity: 0; transform: scale(1.24); }
}

@keyframes service-wave-2 {
  0%, 18%, 100% { opacity: 0; transform: scale(0.92); }
  32% { opacity: 0.68; transform: scale(1.16); }
  48%, 68% { opacity: 0; transform: scale(1.24); }
}

@keyframes service-wave-3 {
  0%, 36%, 100% { opacity: 0; transform: scale(0.92); }
  52% { opacity: 0.64; transform: scale(1.16); }
  68% { opacity: 0; transform: scale(1.24); }
}

#measure-host {
  position: absolute;
  left: -9999px;
  top: 0;
  visibility: hidden;
  pointer-events: none;
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" data-step="0" data-step-dur="0" data-loop-state="stopped">
  <header class="title-bar">
    <h1>Climb Down to Lift Others Up</h1>
    <span class="course-tag">203-04</span>
  </header>

  <div class="stage" id="stage">
    <div class="opening-cue" id="opening-cue" aria-hidden="false"><p>What does greatness look like?</p></div>

    <svg class="climb-svg" id="climb-svg" viewBox="0 0 440 278" width="100%" role="img" aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Climb Down to Lift Others Up</title>
      <desc id="svg-desc">Clean whiteboard stage with the opening question What does greatness look like?</desc>

      <!-- Step 5 crisp Studio Wash double-hairline frame -->
      <g id="finish-frame" class="fade-part" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="10" y="7" width="420" height="264" rx="13" stroke="#1F684A" stroke-width="2" stroke-opacity="0.48" />
        <rect x="14.5" y="11.5" width="411" height="255" rx="9.5" stroke="#A8760A" stroke-width="0.9" stroke-opacity="0.38" />
      </g>

      <!-- LEFT SIDE: THE FLIPPABLE GREATNESS SPECTRUM (Flips 180deg on Step 3!) -->
      <g id="spectrum-area" class="fade-part">
        <text id="spec-mode-label" class="wb-sub" x="68" y="24" text-anchor="middle" fill="#5A4E3C">WORLD'S SCALE</text>

        <g id="flip-group">
          <!-- Vertical spectrum shaft + directional arrowhead -->
          <line id="spec-shaft" x1="68" y1="67" x2="68" y2="177" stroke="#5A4E3C" stroke-width="2.8" stroke-linecap="round" />
          <polygon id="spec-arrow" points="68,59 61,72 75,72" fill="#5A4E3C" />

          <!-- Center GREATNESS badge (counter-rotates so text stays upright) -->
          <g id="spec-badge-mid">
            <rect x="26" y="111" width="84" height="20" rx="10" fill="#FFFFFF" stroke="#B7AEA0" stroke-width="1.3" />
            <text class="spec-pill-text" x="68" y="124.5" text-anchor="middle" fill="#463D2F">GREATNESS</text>
          </g>

          <!-- GREATEST badge: sits at TOP (y=46) in World's Way, swings 180deg to BOTTOM (y=196) in Upside-Down Kingdom! -->
          <g id="spec-badge-high">
            <rect id="spec-high-rect" x="22" y="34" width="92" height="24" rx="12" fill="#5A4E3C" stroke="#2C2416" stroke-width="1.5" />
            <text id="spec-high-txt" class="spec-pill-text" x="68" y="49.5" text-anchor="middle" fill="#FFFFFF">GREATEST</text>
          </g>

          <!-- LEAST / SERVANT end: sits at BOTTOM (y=196) in World's Way, swings 180deg to TOP (y=46) in Kingdom Way -->
          <g id="spec-badge-low">
            <rect id="spec-low-rect" x="24" y="184" width="88" height="24" rx="12" fill="#F6F3EC" stroke="#8E8475" stroke-width="1.4" />
            <text id="spec-low-txt" class="spec-pill-text" x="68" y="199.5" text-anchor="middle" fill="#5A4E3C">LEAST</text>
          </g>
        </g>

        <!-- Upright Kingdom caption under the bottom GREATEST badge after 180deg flip -->
        <text id="lbl-kingdom-high" class="fade-part wb-sub" x="68" y="225" text-anchor="middle" fill="#164E37">High in Heaven</text>
      </g>

      <!-- STEP 1 PULL-DOWN SWAP TRAILS (Shows how You pulled 3 people down from Row 3, Row 2, Row 1) -->
      <g id="world-pull-trails" class="fade-part" fill="none" stroke="#7A6E5D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <!-- Trail 1: pulled Row 3 (272,146) down into Row 4 spot 3 (300,196) -->
        <path d="M256,154 Q252,184 281,195" stroke-dasharray="3.5 3" />
        <polyline points="274,191 282,195 276,200" />
        <!-- Trail 2: pulled Row 2 (300,96) down into Row 3 (272,146) -->
        <path d="M316,104 Q320,134 291,145" stroke-dasharray="3.5 3" />
        <polyline points="298,141 290,145 296,150" />
        <!-- Trail 3: pulled Row 1 (272,46) down into Row 2 (300,96) -->
        <path d="M256,54 Q252,84 281,95" stroke-dasharray="3.5 3" />
        <polyline points="274,91 282,95 276,100" />
      </g>

      <!-- STEPS 3 & 4 LIFT-UP SWAP TRAILS (Shows how You lifted people up past you as you climbed down) -->
      <g id="step3-lift-trail" class="fade-part" fill="none" stroke="#2A5B7C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Lifted Row 2 (300,96) up into Row 1 top spot (272,46) -->
        <path d="M316,88 Q320,56 291,46" />
        <polyline points="298,42 290,46 296,52" />
      </g>
      <g id="low-ghost" class="fade-part" fill="none" stroke="#2A5B7C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Lifted Row 3 (272,146) up into Row 2 (300,96) -->
        <path id="reach-down-path" d="M256,138 Q252,106 281,96" />
        <polyline id="reach-down-head" class="fade-part" points="274,92 282,96 276,102" />
        <!-- Lifted Row 4 spot 3 (300,196) up into Row 3 (272,146) -->
        <path id="lift-up-path" d="M316,188 Q320,156 291,146" />
        <polyline id="lift-up-head" class="fade-part" points="298,142 290,146 296,152" />
      </g>

      <!-- STEP 5 COMMUNITY LIFTING BONDS (Everyone lifting the row above them in the 4-3-2-1 pyramid!) -->
      <g id="kingdom-links" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Row 4 lifting Row 3 -->
        <line id="link-s-1" class="fade-part" x1="188" y1="181" x2="210" y2="161" stroke="#1F684A" stroke-width="2.1" />
        <line id="link-s-2" class="fade-part" x1="300" y1="180" x2="278" y2="161" stroke="#1F684A" stroke-width="2.4" />
        <line id="link-m-1" class="fade-part" x1="244" y1="181" x2="222" y2="161" stroke="#1F684A" stroke-width="2.1" />
        <line id="link-m-2" class="fade-part" x1="244" y1="181" x2="266" y2="161" stroke="#1F684A" stroke-width="2.1" />
        <line id="link-m-3" class="fade-part" x1="300" y1="180" x2="322" y2="161" stroke="#1F684A" stroke-width="2.4" />
        <line id="link-m-4" class="fade-part" x1="356" y1="181" x2="334" y2="161" stroke="#1F684A" stroke-width="2.1" />
        <!-- Row 3 lifting Row 2 & Row 2 lifting Row 1 -->
        <path id="link-h-mid" class="fade-part" d="M216,131 L238,111 M272,131 L250,111 M272,131 L294,111 M328,131 L306,111" stroke="#2A5B7C" stroke-width="2.1" />
        <path id="link-h-top" class="fade-part" d="M244,81 L266,61 M300,81 L278,61" stroke="#5F4684" stroke-width="2.2" />
      </g>

      <!-- Upward-cradling support palms directly under lifted rows on Step 5 -->
      <g id="peer-lift-hands" class="fade-part" fill="none" stroke-width="2.1" stroke-linecap="round">
        <!-- Cradles under Row 3 circles -->
        <path d="M207,163 Q216,168 225,163" stroke="#1F684A" />
        <path d="M263,163 Q272,168 281,163" stroke="#1F684A" />
        <path d="M319,163 Q328,168 337,163" stroke="#1F684A" />
        <!-- Cradles under Row 2 circles -->
        <path d="M235,113 Q244,118 253,113" stroke="#2A5B7C" />
        <path d="M291,113 Q300,118 309,113" stroke="#2A5B7C" />
        <!-- Cradle under Row 1 top circle -->
        <path d="M263,63 Q272,68 281,63" stroke="#5F4684" />
      </g>

      <!-- STEP 5 CALM COMPOSITOR PULSES (Cross -> Row 4 -> Row 3 -> Row 2 & 1; pauses offscreen) -->
      <g id="service-pulses" fill="none">
        <circle id="pulse-row4" class="loop-pulse" cx="300" cy="196" r="22" stroke="#C48F10" stroke-width="2.2" />
        <g id="pulse-row3" class="loop-pulse">
          <circle cx="216" cy="146" r="19" stroke="#2A5B7C" stroke-width="2" />
          <circle cx="272" cy="146" r="19" stroke="#2A5B7C" stroke-width="2" />
          <circle cx="328" cy="146" r="19" stroke="#2A5B7C" stroke-width="2" />
        </g>
        <g id="pulse-row21" class="loop-pulse">
          <circle cx="244" cy="96" r="19" stroke="#5F4684" stroke-width="2" />
          <circle cx="300" cy="96" r="19" stroke="#5F4684" stroke-width="2" />
          <circle cx="272" cy="46" r="19" stroke="#5F4684" stroke-width="2" />
        </g>
      </g>

      <!-- STEP 2: JESUS MEETS YOU AT THE TOP & CAME DOWN FIRST TO THE LOWEST PLACE -->
      <!-- Golden path showing Jesus came down from the highest place to the servant foundation -->
      <path id="jesus-down-arc" fill="none" stroke="#C48F10" stroke-width="2.4" stroke-linecap="round"
        d="M366,46 C408,92 406,204 348,238 C334,246 322,248 317,248" />
      <polyline id="jesus-down-head" class="fade-part" fill="none" stroke="#C48F10" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
        points="324,242 316,248 324,254" />

      <!-- Golden reach where Jesus meets You at the top peak on Step 2 -->
      <g id="jesus-top-meet" class="fade-part">
        <path id="grace-tether-up" fill="none" stroke="#C48F10" stroke-width="2.4" stroke-linecap="round"
          d="M332,46 C318,36 302,36 290,43" />
        <polyline id="grace-tether-head" fill="none" stroke="#C48F10" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"
          points="297,37 289,43 297,48" />
        <circle cx="348" cy="46" r="15.5" fill="#FCF2D6" stroke="#A8760A" stroke-width="1.9" />
        <path d="M348,37 L348,55 M341,43.5 L355,43.5" fill="none" stroke="#8B1A2B" stroke-width="2.5" stroke-linecap="round" />
        <text class="wb-sub" x="348" y="74" text-anchor="middle" fill="#7D5604">Jesus meets you</text>
      </g>

      <!-- Steady golden anchor stem connecting Jesus' cross foundation to You in the bottom row (300,196) -->
      <line id="anchor-stem" class="fade-part" x1="300" y1="231" x2="300" y2="213" stroke="#C48F10" stroke-width="3" stroke-linecap="round" />

      <!-- Crisp Cross-Marked Anchor Foundation below Row 4, 3rd spot (Mark 10:45) -->
      <g id="cross-anchor" class="fade-part">
        <circle cx="300" cy="248" r="16.5" fill="#FCF2D6" stroke="#A8760A" stroke-width="1.8" />
        <path d="M300,238 L300,258 M293,245 L307,245" fill="none" stroke="#8B1A2B" stroke-width="2.6" stroke-linecap="round" />
      </g>

      <!-- THE 4 - 3 - 2 - 1 PYRAMID OF 10 CIRCLES (NO TRIANGLE SIDES!) -->
      <!-- 9 Peer Circles (positioned dynamically at their slot coordinates so any pair can swap smoothly!) -->
      <g id="peers-layer" class="fade-part">
        <g id="peer-0" class="peer-group"><circle class="person-circle node-fill-world" cx="0" cy="0" r="14.5" stroke-width="1.9" /></g>
        <g id="peer-1" class="peer-group"><circle class="person-circle node-fill-world" cx="0" cy="0" r="14.5" stroke-width="1.9" /></g>
        <g id="peer-2" class="peer-group"><circle class="person-circle node-fill-world" cx="0" cy="0" r="14.5" stroke-width="1.9" /></g>
        <g id="peer-3" class="peer-group"><circle class="person-circle node-fill-world" cx="0" cy="0" r="14.5" stroke-width="1.9" /></g>
        <g id="peer-4" class="peer-group"><circle class="person-circle node-fill-world" cx="0" cy="0" r="14.5" stroke-width="1.9" /></g>

<script>
(function () {
  'use strict';

  var STEPS = [
    {
      heading: 'Climb Down to Lift Others Up',

    {

      note: 'Starting in the bottom row, you pull others down and take their spot to climb the world\'s greatness scale.',

    {

      note: 'At the top, you meet Jesus. He left the highest place and came all the way down to the cross to serve you first.',
      accent: '#A8760A',

      nextLabel: 'Next \u2192',

    },
    {
      heading: '3. Greatness Turns Over',
      verse: '"Whoever would be great among you must be your servant, and whoever would be first among you must be slave of all."',
      ref: 'Mark 10:43-44',
      note: 'In God\'s upside-down kingdom, the greatness scale flips. You switch places at the top and lift someone else up.',
      accent: '#1F684A',
      accentDark: '#164E37',
      countLabel: 'Step 3 of 5',
      nextLabel: 'Next \u2192',
      title: 'Step 3: Greatness Turns Over',
      desc: 'The Greatness scale on the side flips 180 degrees so Greatest is at the bottom, and you switch places from the top by lifting another person up.'
    },
    {
      heading: '4. Climb Down to Lift Others Up',
      verse: '"Who can I help?"',
      ref: 'John 13:14-15',
      note: 'Anchored to Jesus, you keep climbing down and lifting people past you until you take the servant\'s place at the bottom.',
      accent: '#2A5B7C',
      accentDark: '#1E435C',
      countLabel: 'Step 4 of 5',
      nextLabel: 'Next \u2192',
      title: 'Step 4: Climb Down to Lift Others Up',
      desc: 'With open lifting arms, your circle climbs down row by row, helping others move up past you until you stand in the bottom row anchored to Jesus.'
    },
    {
      heading: '5. A Life That Builds Others Up',
      verse: '"Humble yourselves before the Lord, and he will exalt you."',
      ref: 'James 4:10',
      note: 'In God\'s kingdom, the bottom row is high honor. Held by Jesus, you help others rise and pass His love on.',
      accent: '#1F684A',
      accentDark: '#164E37',
      countLabel: 'Step 5 of 5',
      nextLabel: 'Start Over',
      title: 'Step 5: A Life That Builds Others Up',
      desc: 'Anchored to Jesus at the Greatest end of the upside-down Kingdom scale, your circle and the whole 4-3-2-1 community lift one another upward.'
    }
  ];

  // 10 Slots of the 4 - 3 - 2 - 1 pyramid (no triangle outline lines)
  // 0: Row 1 top; 1..2: Row 2; 3..5: Row 3; 6..9: Row 4 (slot 8 is 3rd spot from left!)
  var SLOTS = [
    { x: 272, y: 46 },  // 0: Top (Row 1, spot 1)
    { x: 244, y: 96 },  // 1: Row 2, spot 1
    { x: 300, y: 96 },  // 2: Row 2, spot 2
    { x: 216, y: 146 }, // 3: Row 3, spot 1
    { x: 272, y: 146 }, // 4: Row 3, spot 2 (middle)
    { x: 328, y: 146 }, // 5: Row 3, spot 3
    { x: 188, y: 196 }, // 6: Row 4, spot 1
    { x: 244, y: 196 }, // 7: Row 4, spot 2
    { x: 300, y: 196 }, // 8: Row 4, spot 3 (3rd spot to the right - Hero's home!)
    { x: 356, y: 196 }  // 9: Row 4, spot 4
  ];

  var widget = document.getElementById('widget');
  var stage = document.getElementById('stage');
  var openingCue = document.getElementById('opening-cue');
  var svgTitle = document.getElementById('svg-title');
  var svgDesc = document.getElementById('svg-desc');
  var cardContent = document.getElementById('card-content');
  var cardHeading = document.getElementById('card-heading');
  var cardVerseText = document.getElementById('card-verse-text');
  var cardRef = document.getElementById('card-ref');
  var cardNote = document.getElementById('card-note');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  var stepCount = document.getElementById('step-count');
  var dotBtns = Array.prototype.slice.call(document.querySelectorAll('.step-dot'));
  var measureHost = document.getElementById('measure-host');

  var spectrumArea = document.getElementById('spectrum-area');
  var specModeLabel = document.getElementById('spec-mode-label');
  var flipGroup = document.getElementById('flip-group');
  var specShaft = document.getElementById('spec-shaft');
  var specArrow = document.getElementById('spec-arrow');
  var specHighRect = document.getElementById('spec-high-rect');
  var specLowRect = document.getElementById('spec-low-rect');
  var specLowTxt = document.getElementById('spec-low-txt');
  var lblKingdomHigh = document.getElementById('lbl-kingdom-high');

  var finishFrame = document.getElementById('finish-frame');
  var worldPullTrails = document.getElementById('world-pull-trails');
  var step3LiftTrail = document.getElementById('step3-lift-trail');
  var lowGhost = document.getElementById('low-ghost');
  var reachDownPath = document.getElementById('reach-down-path');
  var reachDownHead = document.getElementById('reach-down-head');
  var liftUpPath = document.getElementById('lift-up-path');
  var liftUpHead = document.getElementById('lift-up-head');
  var peerLiftHands = document.getElementById('peer-lift-hands');

  var jesusDownArc = document.getElementById('jesus-down-arc');
  var jesusDownHead = document.getElementById('jesus-down-head');
  var jesusTopMeet = document.getElementById('jesus-top-meet');
  var anchorStem = document.getElementById('anchor-stem');
  var crossAnchor = document.getElementById('cross-anchor');

  var peersLayer = document.getElementById('peers-layer');
  var peerGroups = [];
  var peerCircles = [];
  for (var pi = 0; pi < 9; pi++) {
    var pg = document.getElementById('peer-' + pi);
    peerGroups.push(pg);
    peerCircles.push(pg.querySelector('circle'));
  }

  var heroGroup = document.getElementById('hero-group');
  var nodeYou = document.getElementById('node-you');
  var lblYou = document.getElementById('lbl-you');
  var heroArmPull = document.getElementById('hero-arm-pull');
  var pullArmPath = document.getElementById('pull-arm-path');
  var pullArmHand = document.getElementById('pull-arm-hand');
  var heroArmLift = document.getElementById('hero-arm-lift');
  var liftArmPath = document.getElementById('lift-arm-path');
  var liftArmPalm = document.getElementById('lift-arm-palm');

  var kingdomLinks = [
    document.getElementById('link-s-1'),
    document.getElementById('link-s-2'),
    document.getElementById('link-m-1'),
    document.getElementById('link-m-2'),
    document.getElementById('link-m-3'),
    document.getElementById('link-m-4'),
    document.getElementById('link-h-mid'),
    document.getElementById('link-h-top')
  ];

  var lblWorld = document.getElementById('lbl-world');
  var lblJesus = document.getElementById('lbl-jesus');
  var lblHeld = document.getElementById('lbl-held');
  var lblFlip = document.getElementById('lbl-flip');
  var lblHelp = document.getElementById('lbl-help');
  var lblGrow = document.getElementById('lbl-grow');

  function pathLen(el) {
    try {
      return Math.ceil(el.getTotalLength());
    } catch (e) {
      return 120;
    }
  }

  var jesusLen = pathLen(jesusDownArc);
  var reachLen = pathLen(reachDownPath);
  var liftLen = pathLen(liftUpPath);

  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) {
    widget.classList.add('is-instant');
  }

  var currentStep = 0;
  var introTimer = null;
  var activeRaf = 0;
  var activeTimers = [];
  var lastMeasuredWidth = 0;

  // Offscreen pause tracking (contentvisibilityautostatechange + IntersectionObserver + visibilitychange)
  var isOnScreen = true;
  var isContentSkipped = false;
  var isDocHidden = typeof document.hidden === 'boolean' ? document.hidden : false;

  function syncLoopPlayback() {
    var shouldLoop = (currentStep === 5 && !reducedMotion);
    var paused = !shouldLoop || !isOnScreen || isContentSkipped || isDocHidden;
    widget.classList.toggle('loop-active', shouldLoop);
    widget.classList.toggle('loop-paused', shouldLoop && paused);
    widget.setAttribute('data-loop-state', !shouldLoop ? 'stopped' : (paused ? 'paused' : 'running'));
  }

  window.CLIMB_DOWN_LOOP = {
    state: function () {
      return {
        step: currentStep,
        active: widget.classList.contains('loop-active'),
        paused: widget.classList.contains('loop-paused'),
        onScreen: isOnScreen,
        skipped: isContentSkipped,
        docHidden: isDocHidden,
        loopState: widget.getAttribute('data-loop-state')
      };
    }
  };

  stage.addEventListener('contentvisibilityautostatechange', function (e) {
    isContentSkipped = !!e.skipped;
    syncLoopPlayback();
  });

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      isOnScreen = entries[entries.length - 1].isIntersecting;
      syncLoopPlayback();
    }, { threshold: 0.01 }).observe(stage);
  }

  document.addEventListener('visibilitychange', function () {
    isDocHidden = !!document.hidden;
    syncLoopPlayback();
  });

  function scheduleTimer(fn, ms) {
    var id = setTimeout(function () {
      var pos = activeTimers.indexOf(id);
      if (pos !== -1) activeTimers.splice(pos, 1);
      fn();
    }, ms);
    activeTimers.push(id);
    return id;
  }

  function cancelAnim() {
    if (activeRaf) {
      cancelAnimationFrame(activeRaf);
      activeRaf = 0;
    }
    while (activeTimers.length) {
      clearTimeout(activeTimers.pop());
    }
  }

  function setPathProgress(el, len, p) {
    var c = Math.max(0, Math.min(1, p));
    if (c <= 0) {
      el.style.strokeDasharray = String(len);
      el.style.strokeDashoffset = String(len);
      el.style.opacity = '0';
    } else if (c >= 1) {
      el.style.strokeDasharray = 'none';
      el.style.strokeDashoffset = '0';
      el.style.opacity = '';
    } else {
      el.style.strokeDasharray = String(len);
      el.style.strokeDashoffset = String((1 - c) * len);
      el.style.opacity = '';
    }
  }

  function setCircleStyle(el, cls) {
    el.classList.remove(
      'node-fill-world',
      'node-pulled-down',
      'node-you-world',
      'node-you-gospel',
      'node-you-servant',
      'node-lifted-mid',
      'node-lifted-top'
    );
    el.classList.add(cls);
  }

  function placeGroup(g, x, y) {
    g.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')');
  }

  function setPullArmPose(mode) {
    if (mode === 'up-left') {
      // Reaching up-left to grab the person in the row above and pull them down
      pullArmPath.setAttribute('d', 'M -10,-11 C -22,-22 -22,-34 -13,-40');
      pullArmHand.setAttribute('points', '-19,-37 -12,-41 -11,-33');
    } else if (mode === 'up-right') {
      // Reaching up-right to grab the person in the row above and pull them down
      pullArmPath.setAttribute('d', 'M 10,-11 C 22,-22 22,-34 13,-40');
      pullArmHand.setAttribute('points', '19,-37 12,-41 11,-33');
    } else {
      // Settled at top: arm pressing down-right toward the person pulled down into Row 2
      pullArmPath.setAttribute('d', 'M 12,10 C 24,18 26,28 21,36');
      pullArmHand.setAttribute('points', '14,34 21,37 26,31');
    }
  }

  function setLiftArmPose(mode) {
    if (mode === 'up-right') {
      liftArmPath.setAttribute('d', 'M 13,-7 C 23,-16 26,-24 25,-31');
      liftArmPalm.setAttribute('d', 'M 34,-33 Q 26,-28 18,-33');
    } else {
      liftArmPath.setAttribute('d', 'M -13,-7 C -23,-16 -26,-24 -25,-31');
      liftArmPalm.setAttribute('d', 'M -34,-33 Q -26,-28 -18,-33');
    }
  }
  // Peer mapping at start (before any swaps):
  // peer 0 -> slot 0 (272,46)
  // peer 1 -> slot 1 (244,96), peer 2 -> slot 2 (300,96)
  // peer 3 -> slot 3 (216,146), peer 4 -> slot 4 (272,146), peer 5 -> slot 5 (328,146)
  // peer 6 -> slot 6 (188,196), peer 7 -> slot 7 (244,196), peer 8 -> slot 9 (356,196)
  // Hero starts at slot 8 (300,196 - Row 4, 3rd spot to the right!)
  //
  // During Step 1 (World's Way climb: slot 8 -> 4 -> 2 -> 0):
  // - Swap 1 (Hero 8 <-> peer 4 at slot 4): peer 4 is pulled down to slot 8; Hero takes slot 4
  // - Swap 2 (Hero 4 <-> peer 2 at slot 2): peer 2 is pulled down to slot 4; Hero takes slot 2
  // - Swap 3 (Hero 2 <-> peer 0 at slot 0): peer 0 is pulled down to slot 2; Hero takes slot 0
  //
  // During Step 3 (First Kingdom reversal swap at top: Hero 0 <-> peer 0 at slot 2):
  // - Hero lifts peer 0 UP into slot 0 (top); Hero steps down to slot 2
  //
  // During Step 4 (Climb down & lift up: Hero 2 -> 4 -> 8):
  // - Swap 2 (Hero 2 <-> peer 2 at slot 4): Hero lifts peer 2 UP into slot 2; Hero steps down to slot 4
  // - Swap 3 (Hero 4 <-> peer 4 at slot 8): Hero lifts peer 4 UP into slot 4; Hero steps down to slot 8
  function layoutNodesForStep(idx) {
    var peerSlots;
    var heroSlot;

    if (idx <= 0) {
      peerSlots = [0, 1, 2, 3, 4, 5, 6, 7, 9];
      heroSlot = 8;
    } else if (idx === 1 || idx === 2) {
      // Hero climbed to top (slot 0); peer 0 pulled to slot 2, peer 2 pulled to slot 4, peer 4 pulled to slot 8
      peerSlots = [2, 1, 4, 3, 8, 5, 6, 7, 9];
      heroSlot = 0;
    } else if (idx === 3) {
      // Hero lifted peer 0 back up to slot 0 and stepped down to slot 2
      peerSlots = [0, 1, 4, 3, 8, 5, 6, 7, 9];
      heroSlot = 2;
    } else {
      // Steps 4 & 5: Hero lifted peer 2 up to slot 2 and peer 4 up to slot 4, returning to slot 8 (bottom row, 3rd spot!)
      peerSlots = [0, 1, 2, 3, 4, 5, 6, 7, 9];
      heroSlot = 8;
    }

    for (var i = 0; i < 9; i++) {
      var s = SLOTS[peerSlots[i]];
      placeGroup(peerGroups[i], s.x, s.y);
      var c = peerCircles[i];
      if (idx === 1 && (i === 0 || i === 2 || i === 4)) {
        setCircleStyle(c, 'node-pulled-down');
      } else if (idx === 3 && i === 0) {
        setCircleStyle(c, 'node-lifted-mid');
      } else if (idx === 4 && (i === 0 || i === 2 || i === 4)) {
        setCircleStyle(c, 'node-lifted-mid');
      } else if (idx === 5) {
        if (peerSlots[i] <= 2) {
          setCircleStyle(c, 'node-lifted-top');
        } else {
          setCircleStyle(c, 'node-lifted-mid');
        }
      } else {
        setCircleStyle(c, 'node-fill-world');
      }
    }

    var hs = SLOTS[heroSlot];
    placeGroup(heroGroup, hs.x, hs.y);
  }

  function updateSpectrumAppearance(flipped) {
    flipGroup.classList.toggle('is-flipped', flipped);
    specModeLabel.textContent = flipped ? 'KINGDOM SCALE' : 'WORLD\'S SCALE';
    specModeLabel.setAttribute('fill', flipped ? '#164E37' : '#5A4E3C');
    specShaft.setAttribute('stroke', flipped ? '#1F684A' : '#5A4E3C');
    specArrow.setAttribute('fill', flipped ? '#1F684A' : '#5A4E3C');
    specHighRect.setAttribute('fill', flipped ? '#1F684A' : '#5A4E3C');
    specHighRect.setAttribute('stroke', flipped ? '#164E37' : '#2C2416');
    specLowRect.setAttribute('fill', flipped ? '#E2EEF6' : '#F6F3EC');
    specLowRect.setAttribute('stroke', flipped ? '#2A5B7C' : '#8E8475');
    specLowTxt.setAttribute('fill', flipped ? '#1E435C' : '#5A4E3C');
    specLowTxt.textContent = flipped ? 'LIFTED UP' : 'LEAST';
    lblKingdomHigh.classList.toggle('is-visible', flipped);
  }

  function setStaticState(idx) {
    var showStage = idx >= 1;
    var flipped = idx >= 3;

    spectrumArea.classList.toggle('is-visible', showStage);
    peersLayer.classList.toggle('is-visible', showStage);
    heroGroup.classList.toggle('is-visible', showStage);

    updateSpectrumAppearance(flipped);
    layoutNodesForStep(idx);

    // Hero circle & reaching arm state
    if (idx <= 1) {
      setCircleStyle(nodeYou, 'node-you-world');
      lblYou.setAttribute('fill', '#FFFFFF');
      setPullArmPose('down-press');
      heroArmPull.classList.toggle('is-visible', idx === 1);
      heroArmLift.classList.toggle('is-visible', false);
    } else if (idx === 2) {
      setCircleStyle(nodeYou, 'node-you-gospel');
      lblYou.setAttribute('fill', '#7D5604');
      heroArmPull.classList.toggle('is-visible', false);
      heroArmLift.classList.toggle('is-visible', false);
    } else {
      setCircleStyle(nodeYou, 'node-you-servant');
      lblYou.setAttribute('fill', '#FFFFFF');
      setLiftArmPose('up-left');
      heroArmPull.classList.toggle('is-visible', false);
      heroArmLift.classList.toggle('is-visible', true);
    }

    // Step 1 pull-down trails
    worldPullTrails.classList.toggle('is-visible', idx === 1);

    // Step 2 Jesus meets You at the top and came down first to the cross
    jesusTopMeet.classList.toggle('is-visible', idx === 2);
    setPathProgress(jesusDownArc, jesusLen, idx === 2 ? 1 : 0);
    jesusDownHead.classList.toggle('is-visible', idx === 2);
    crossAnchor.classList.toggle('is-visible', idx >= 2);
    anchorStem.classList.toggle('is-visible', idx >= 4);

    // Step 3 & Step 4 lift-up trails
    step3LiftTrail.classList.toggle('is-visible', idx === 3 || idx === 4);
    var showStep4 = (idx === 4);
    lowGhost.classList.toggle('is-visible', showStep4);
    setPathProgress(reachDownPath, reachLen, showStep4 ? 1 : 0);
    reachDownHead.classList.toggle('is-visible', showStep4);
    setPathProgress(liftUpPath, liftLen, showStep4 ? 1 : 0);
    liftUpHead.classList.toggle('is-visible', showStep4);

    // Step 5 shows all 8 community links + upward cradling hands + frame
    kingdomLinks.forEach(function (ln) {
      ln.classList.toggle('is-visible', idx === 5);
    });
    peerLiftHands.classList.toggle('is-visible', idx === 5);
    finishFrame.classList.toggle('is-visible', idx === 5);

    // Upright minimal labels
    lblWorld.classList.toggle('is-visible', idx === 1);
    lblJesus.classList.toggle('is-visible', idx === 2);
    lblHeld.classList.toggle('is-visible', idx >= 4);
    lblFlip.classList.toggle('is-visible', idx === 3);
    lblHelp.classList.toggle('is-visible', idx === 4);
    lblGrow.classList.toggle('is-visible', idx === 5);

    syncLoopPlayback();
  }

  // Helper to interpolate a pair swap with opposing side-arc offsets so circles swing past each other
  function interpolateSwap(fromA, toA, p, sideSign) {
    var e = 1 - Math.pow(1 - p, 2);
    var arc = Math.sin(Math.PI * e) * 14 * sideSign;
    return {
      x: fromA.x + (toA.x - fromA.x) * e + arc,
      y: fromA.y + (toA.y - fromA.y) * e
    };
  }

  function animateStep(idx) {
    cancelAnim();

    if (idx === 1) {
      // Hero starts at bottom row, 3rd spot (slot 8) and pulls down peer 4 (slot 4), peer 2 (slot 2), peer 0 (slot 0)
      setStaticState(1);
      worldPullTrails.classList.remove('is-visible');
      lblWorld.classList.remove('is-visible');

      // Reset all 9 peers to starting slots [0,1,2,3,4,5,6,7,9] and Hero to slot 8
      var startSlots = [0, 1, 2, 3, 4, 5, 6, 7, 9];
      for (var i = 0; i < 9; i++) {
        placeGroup(peerGroups[i], SLOTS[startSlots[i]].x, SLOTS[startSlots[i]].y);
        setCircleStyle(peerCircles[i], 'node-fill-world');
      }
      placeGroup(heroGroup, SLOTS[8].x, SLOTS[8].y);
      heroArmPull.classList.add('is-visible');
      setPullArmPose('up-left');

      var hopDur = 360;
      var total1 = hopDur * 3 + 120;
      widget.setAttribute('data-step-dur', String(total1));

      var t0 = 0;
      function f1(now) {
        if (!t0) t0 = now;
        var el = now - t0;

        if (el < hopDur) {
          // Hop 1: Hero (slot 8) pulls down peer 4 (slot 4)
          setPullArmPose('up-left');
          var p1 = Math.min(1, el / hopDur);
          var hPos1 = interpolateSwap(SLOTS[8], SLOTS[4], p1, -1);
          var pPos1 = interpolateSwap(SLOTS[4], SLOTS[8], p1, 1);
          placeGroup(heroGroup, hPos1.x, hPos1.y);
          placeGroup(peerGroups[4], pPos1.x, pPos1.y);
          if (p1 >= 0.7) setCircleStyle(peerCircles[4], 'node-pulled-down');
        } else if (el < hopDur * 2) {
          // Hop 2: Hero (slot 4) pulls down peer 2 (slot 2)
          placeGroup(peerGroups[4], SLOTS[8].x, SLOTS[8].y);
          setCircleStyle(peerCircles[4], 'node-pulled-down');
          setPullArmPose('up-right');
          var p2 = Math.min(1, (el - hopDur) / hopDur);
          var hPos2 = interpolateSwap(SLOTS[4], SLOTS[2], p2, 1);
          var pPos2 = interpolateSwap(SLOTS[2], SLOTS[4], p2, -1);
          placeGroup(heroGroup, hPos2.x, hPos2.y);
          placeGroup(peerGroups[2], pPos2.x, pPos2.y);
          if (p2 >= 0.7) setCircleStyle(peerCircles[2], 'node-pulled-down');
        } else if (el < hopDur * 3) {
          // Hop 3: Hero (slot 2) pulls down peer 0 (slot 0)
          placeGroup(peerGroups[2], SLOTS[4].x, SLOTS[4].y);
          setCircleStyle(peerCircles[2], 'node-pulled-down');
          setPullArmPose('up-left');
          var p3 = Math.min(1, (el - hopDur * 2) / hopDur);
          var hPos3 = interpolateSwap(SLOTS[2], SLOTS[0], p3, -1);
          var pPos3 = interpolateSwap(SLOTS[0], SLOTS[2], p3, 1);
          placeGroup(heroGroup, hPos3.x, hPos3.y);
          placeGroup(peerGroups[0], pPos3.x, pPos3.y);
          if (p3 >= 0.7) setCircleStyle(peerCircles[0], 'node-pulled-down');
        } else {
          setStaticState(1);
          activeRaf = 0;
          return;
        }

        activeRaf = requestAnimationFrame(f1);
      }
      activeRaf = requestAnimationFrame(f1);
      return;
    }

    if (idx === 2) {
      // Hero at top meets Jesus (348,46), then Jesus' golden path sweeps down to the cross foundation (300,248)
      setStaticState(2);
      setPathProgress(jesusDownArc, jesusLen, 0);
      jesusDownHead.classList.remove('is-visible');
      crossAnchor.classList.remove('is-visible');
      lblJesus.classList.remove('is-visible');
      setCircleStyle(nodeYou, 'node-you-world');
      lblYou.setAttribute('fill', '#FFFFFF');

      var dMeet = 260;
      var dDown = 620;
      var total2 = dMeet + dDown;
      widget.setAttribute('data-step-dur', String(total2));

      scheduleTimer(function () {
        setCircleStyle(nodeYou, 'node-you-gospel');
        lblYou.setAttribute('fill', '#7D5604');
      }, 180);

      var t2 = 0;
      var crossShown = false;
      function f2(now) {
        if (!t2) t2 = now;
        var el = now - t2;
        if (el > dMeet) {
          var p = Math.min(1, (el - dMeet) / dDown);
          setPathProgress(jesusDownArc, jesusLen, 1 - Math.pow(1 - p, 1.4));
          if (!crossShown && p >= 0.84) {
            crossShown = true;
            jesusDownHead.classList.add('is-visible');
            crossAnchor.classList.add('is-visible');
            lblJesus.classList.add('is-visible');
          }
        }
        if (el < total2) activeRaf = requestAnimationFrame(f2);
        else { activeRaf = 0; setStaticState(2); }
      }
      activeRaf = requestAnimationFrame(f2);
      return;
    }

    if (idx === 3) {
      // Greatness Spectrum flips 180deg AND Hero at top (slot 0) switches places with peer 0 (slot 2), lifting them to top!
      setStaticState(3);
      step3LiftTrail.classList.remove('is-visible');
      lblFlip.classList.remove('is-visible');
      placeGroup(heroGroup, SLOTS[0].x, SLOTS[0].y);
      placeGroup(peerGroups[0], SLOTS[2].x, SLOTS[2].y);
      setCircleStyle(peerCircles[0], 'node-fill-world');

      var dWaitFlip = 260;
      var dSwap1 = 560;
      var total3 = dWaitFlip + dSwap1;
      widget.setAttribute('data-step-dur', String(total3));

      var t3 = 0;
      function f3(now) {
        if (!t3) t3 = now;
        var el = now - t3;
        if (el > dWaitFlip) {
          var p = Math.min(1, (el - dWaitFlip) / dSwap1);
          var hPos = interpolateSwap(SLOTS[0], SLOTS[2], p, 1);
          var pPos = interpolateSwap(SLOTS[2], SLOTS[0], p, -1);
          placeGroup(heroGroup, hPos.x, hPos.y);
          placeGroup(peerGroups[0], pPos.x, pPos.y);
          if (p >= 0.65) {
            setCircleStyle(peerCircles[0], 'node-lifted-mid');
            step3LiftTrail.classList.add('is-visible');
            lblFlip.classList.add('is-visible');
          }
        }
        if (el < total3) activeRaf = requestAnimationFrame(f3);
        else { activeRaf = 0; setStaticState(3); }
      }
      activeRaf = requestAnimationFrame(f3);
      return;
    }

    if (idx === 4) {
      // Hero climbs down from Row 2 (slot 2) -> Row 3 (slot 4) -> Row 4 spot 3 (slot 8), lifting peer 2 and peer 4 UP past You!
      setStaticState(4);
      placeGroup(heroGroup, SLOTS[2].x, SLOTS[2].y);
      placeGroup(peerGroups[2], SLOTS[4].x, SLOTS[4].y);
      placeGroup(peerGroups[4], SLOTS[8].x, SLOTS[8].y);
      setCircleStyle(peerCircles[2], 'node-fill-world');
      setCircleStyle(peerCircles[4], 'node-fill-world');
      setPathProgress(reachDownPath, reachLen, 0);
      reachDownHead.classList.remove('is-visible');
      setPathProgress(liftUpPath, liftLen, 0);
      liftUpHead.classList.remove('is-visible');
      kingdomLinks[1].classList.remove('is-visible');
      anchorStem.classList.remove('is-visible');
      lblHeld.classList.remove('is-visible');

      var dLiftA = 440;
      var dLiftB = 460;
      var total4 = dLiftA + dLiftB + 80;
      widget.setAttribute('data-step-dur', String(total4));

      var t4 = 0;
      function f4(now) {
        if (!t4) t4 = now;
        var el = now - t4;
        if (el < dLiftA) {
          // Lift-Swap 2: Hero (slot 2) steps down to slot 4 while lifting peer 2 (slot 4) up to slot 2
          setLiftArmPose('up-right');
          var pA = Math.min(1, el / dLiftA);
          var hA = interpolateSwap(SLOTS[2], SLOTS[4], pA, -1);
          var peerA = interpolateSwap(SLOTS[4], SLOTS[2], pA, 1);
          placeGroup(heroGroup, hA.x, hA.y);
          placeGroup(peerGroups[2], peerA.x, peerA.y);
          setPathProgress(reachDownPath, reachLen, pA);
          if (pA >= 0.72) {
            setCircleStyle(peerCircles[2], 'node-lifted-mid');
            reachDownHead.classList.add('is-visible');
          }
        } else if (el < dLiftA + dLiftB) {
          placeGroup(peerGroups[2], SLOTS[2].x, SLOTS[2].y);
          setCircleStyle(peerCircles[2], 'node-lifted-mid');
          setPathProgress(reachDownPath, reachLen, 1);
          reachDownHead.classList.add('is-visible');

          // Lift-Swap 3: Hero (slot 4) steps down to slot 8 while lifting peer 4 (slot 8) up to slot 4
          setLiftArmPose('up-left');
          var pB = Math.min(1, (el - dLiftA) / dLiftB);
          var hB = interpolateSwap(SLOTS[4], SLOTS[8], pB, 1);
          var peerB = interpolateSwap(SLOTS[8], SLOTS[4], pB, -1);
          placeGroup(heroGroup, hB.x, hB.y);
          placeGroup(peerGroups[4], peerB.x, peerB.y);
          setPathProgress(liftUpPath, liftLen, pB);
          if (pB >= 0.72) {
            setCircleStyle(peerCircles[4], 'node-lifted-mid');
            liftUpHead.classList.add('is-visible');
            anchorStem.classList.add('is-visible');
            lblHeld.classList.add('is-visible');
          }
        } else {
          activeRaf = 0;
          setStaticState(4);
          return;
        }
        activeRaf = requestAnimationFrame(f4);
      }
      activeRaf = requestAnimationFrame(f4);
      return;
    }

    if (idx === 5) {
      setStaticState(5);
      kingdomLinks.forEach(function (ln) { ln.classList.remove('is-visible'); });
      peerLiftHands.classList.remove('is-visible');
      finishFrame.classList.remove('is-visible');
      lblGrow.classList.remove('is-visible');
      widget.classList.remove('loop-active');
      widget.setAttribute('data-step-dur', '720');

      scheduleTimer(function () {
        for (var i = 0; i < 6; i++) kingdomLinks[i].classList.add('is-visible');
        peerLiftHands.classList.add('is-visible');
      }, 120);
      scheduleTimer(function () {
        kingdomLinks[6].classList.add('is-visible');
        kingdomLinks[7].classList.add('is-visible');
      }, 360);
      scheduleTimer(function () {
        finishFrame.classList.add('is-visible');
        lblGrow.classList.add('is-visible');
        syncLoopPlayback();
      }, 580);
      return;
    }

    widget.setAttribute('data-step-dur', '0');
    setStaticState(idx);
  }

  function updateCardAndChrome(idx) {
    var s = STEPS[idx];
    widget.setAttribute('data-step', String(idx));
    widget.style.setProperty('--step-color', s.accent);
    widget.style.setProperty('--step-dark', s.accentDark);

    cardHeading.textContent = s.heading;
    cardVerseText.textContent = s.verse;
    cardRef.textContent = s.ref;
    cardNote.textContent = s.note;

    svgTitle.textContent = s.title;
    svgDesc.textContent = s.desc;

    stepCount.textContent = s.countLabel;
    nextBtn.textContent = s.nextLabel;
    prevBtn.disabled = (idx === 0);

    dotBtns.forEach(function (btn, i) {
      btn.classList.toggle('active', i === idx);
      btn.classList.toggle('passed', i < idx);
      btn.setAttribute('aria-pressed', i === idx ? 'true' : 'false');
    });
  }

  function goToStep(idx, animateForward, introFinished) {
    if (introTimer !== null) {
      if (idx !== 0) return;
      clearTimeout(introTimer);
      introTimer = null;
    }
    if (currentStep === 0 && idx > 0 && !introFinished && !reducedMotion) {
      openingCue.classList.add('is-hidden');
      openingCue.setAttribute('aria-hidden', 'true');
      introTimer = setTimeout(function () {
        introTimer = null;
        goToStep(idx, animateForward, true);
      }, 340);
      return;
    }
    if (idx < 0 || idx >= STEPS.length) return;
    cancelAnim();
    currentStep = idx;
    openingCue.classList.toggle('is-hidden', idx !== 0);
    openingCue.setAttribute('aria-hidden', idx === 0 ? 'false' : 'true');
    updateCardAndChrome(idx);

    var instant = reducedMotion || !animateForward || idx === 0;
    if (instant) {
      widget.classList.add('is-instant');
      widget.setAttribute('data-step-dur', '0');
      setStaticState(idx);
      if (!reducedMotion) {
        void widget.offsetWidth;
        widget.classList.remove('is-instant');
      }
    } else {
      widget.classList.remove('is-instant');
      animateStep(idx);
    }
  }

  function fitCardHeight() {
    var w = cardContent.clientWidth;
    if (!w) return;
    lastMeasuredWidth = w;
    var clone = cardContent.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('aria-live');
    clone.style.width = w + 'px';
    clone.style.minHeight = '0';
    clone.style.height = 'auto';

    var h = clone.querySelector('#card-heading');
    var v = clone.querySelector('#card-verse-text');
    var r = clone.querySelector('#card-ref');
    var n = clone.querySelector('#card-note');
    if (h) h.removeAttribute('id');
    if (v) v.removeAttribute('id');
    if (r) r.removeAttribute('id');
    if (n) n.removeAttribute('id');

    measureHost.innerHTML = '';
    measureHost.appendChild(clone);

    var maxH = 0;
    for (var i = 0; i < STEPS.length; i++) {
      if (h) h.textContent = STEPS[i].heading;
      if (v) v.textContent = STEPS[i].verse;
      if (r) r.textContent = STEPS[i].ref;
      if (n) n.textContent = STEPS[i].note;
      var measured = Math.ceil(clone.getBoundingClientRect().height);
      if (measured > maxH) maxH = measured;
    }
    measureHost.innerHTML = '';
    if (maxH > 0) {
      widget.style.setProperty('--card-h', maxH + 'px');
    }
  }

  nextBtn.addEventListener('click', function () {
    if (currentStep < STEPS.length - 1) {
      goToStep(currentStep + 1, true);
    } else {
      goToStep(0, false);
    }
  });

  prevBtn.addEventListener('click', function () {
    if (currentStep > 0) {
      goToStep(currentStep - 1, false);
    }
  });

  dotBtns.forEach(function (btn, i) {
    btn.addEventListener('click', function () {
      if (i === currentStep && introTimer === null) return;
      goToStep(i, i === currentStep + 1);
    });
  });

  window.addEventListener('resize', function () {
    var w = cardContent.clientWidth;
    if (w && Math.abs(w - lastMeasuredWidth) > 1) {
      fitCardHeight();
    }
  });

  fitCardHeight();
  goToStep(0, false, true);
})();
</script>
</body>
</html>
