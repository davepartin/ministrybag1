<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climb Down to Lift Others Up</title>
<style>
:root {
  --ink: #2C2416;
  --muted: #6E6559;
  --tray: #F6F4EE;
  --border: #EBE5D9;
  --step-color: #2C2416;
  --step-dark: #2C2416;
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  padding: 0;
  margin: 0;
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.widget-outer {
  background: #FFFFFF;
  border-radius: 0;
  overflow: hidden;
  box-shadow: none;
  border: none;
  max-width: 100%;
  width: 100%;
  margin: 0;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
    border: 1px solid #EBE5D9;
    max-width: 460px;
    margin: 0 auto;
  }
}

.title-bar {
  background: #2C2416;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  margin: 0;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  position: relative;
  background: #FFFFFF;
  padding: 2px 10px 0;
  border-bottom: 1px solid var(--border);
  content-visibility: auto;
  contain-intrinsic-size: auto none auto 238px;
}

.opening-cue {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  padding: 18px;
  pointer-events: none;
  opacity: 1;
}

.opening-cue p {
  margin: 0;
  max-width: 290px;
  padding: 16px 20px;
  border: 1px solid #E6DECF;
  border-radius: 14px;
  background: #FFFFFF;
  box-shadow: 0 10px 28px rgba(44, 36, 22, 0.10);
  color: #2C2416;
  text-align: center;
  font: 600 17px/1.3 Georgia, 'Times New Roman', serif;
}

.opening-cue.is-hidden {
  opacity: 0;
}

.climb-svg {
  display: block;
  width: 100%;
  height: auto;
}

.fade-part {
  opacity: 0;
  pointer-events: none;
}

.fade-part.is-visible {
  opacity: 1;
}

/* Left-side Greatness Scale (rotates 180deg around 72,119.5 when flipping from THE WORLD to THE KINGDOM) */
#flip-group {
  transform-origin: 72px 119.5px;
  transform: rotate(0deg);
}

#flip-group.is-flipped {
  transform: rotate(180deg);
}

/* Counter-rotating pill carriages keep GREATEST and LEAST 100% upright while swinging 180deg */
#spec-badge-high {
  transform-origin: 72px 46px;
  transform: rotate(0deg);
}

#spec-badge-low {
  transform-origin: 72px 193px;
  transform: rotate(0deg);
}

#flip-group.is-flipped #spec-badge-high,
#flip-group.is-flipped #spec-badge-low {
  transform: rotate(-180deg);
}

.wb-label {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1px;
  paint-order: stroke;
  stroke: #FFFFFF;
  stroke-width: 4px;
  stroke-linejoin: round;
}

.wb-sub {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.7px;
  paint-order: stroke;
  stroke: #FFFFFF;
  stroke-width: 3.5px;
  stroke-linejoin: round;
}

.spec-pill-text {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.7px;
}

/* Calm repeating highlight pulse on Step 4 (compositor-only opacity + scale, pauses offscreen) */
.loop-pulse {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  pointer-events: none;
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 4px;
  background: var(--tray);
  border-bottom: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  min-inline-size: 28px;
  min-block-size: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
}

.step-dot-fill {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2.5px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
}

.step-dot.passed .step-dot-fill {
  background: rgba(31, 104, 74, 0.18);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.12);
}

.card-area {
  background: var(--tray);
  padding: 6px 12px 9px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(44, 36, 22, 0.06);
  border: 1px solid var(--border);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 14px 10px;
  min-height: var(--card-h, 118px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-heading {
  font: 700 15.5px/1.22 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 4px;
}

.card-verse {
  font: 400 13px/1.38 Georgia, Cambria, serif;
  color: var(--ink);
  margin: 0 0 4px;
}

.verse-ref {
  font: 600 11.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  margin-left: 4px;
  white-space: nowrap;
}

.card-note {
  font: 400 12.5px/1.36 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #463D2F;
  margin: 0;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  appearance: none;
  min-block-size: 44px;
  min-inline-size: 104px;
  padding: 10px 14px;
  border-radius: 10px;
  font: 600 14px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: var(--ink);
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FFFFFF;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.step-count {
  font: 600 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (prefers-reduced-motion: no-preference) {
  .opening-cue {
    transition: opacity 0.32s ease;
  }
  .widget-outer:not(.is-instant) .fade-part {
    transition: opacity 0.36s ease;
  }
  .widget-outer:not(.is-instant) #flip-group,
  .widget-outer:not(.is-instant) #spec-badge-high,
  .widget-outer:not(.is-instant) #spec-badge-low {
    transition: transform 1.25s cubic-bezier(0.32, 0.08, 0.24, 1);
  }
  .widget-outer .step-dot-fill {
    transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
  }
  .widget-outer .nav-btn.primary,
  .widget-outer .verse-card-bar,
  .widget-outer .card-heading {
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease;
  }

  /* Calm repeating highlight wave on Step 4 (5.2s cycle with quiet pause; pauses offscreen) */
  .widget-outer.loop-active:not(.loop-paused) #pulse-you {
    animation: service-wave-1 5.2s ease-in-out infinite;
  }
  .widget-outer.loop-active:not(.loop-paused) #pulse-scale {
    animation: service-wave-2 5.2s ease-in-out infinite;
  }
  .widget-outer.loop-active.loop-paused .loop-pulse {
    animation-play-state: paused;
  }
}

@keyframes service-wave-1 {
  0%, 100% { opacity: 0; transform: scale(0.92); }
  18% { opacity: 0.65; transform: scale(1.18); }
  42%, 70% { opacity: 0; transform: scale(1.26); }
}

@keyframes service-wave-2 {
  0%, 12%, 100% { opacity: 0; transform: scale(0.96); }
  28% { opacity: 0.55; transform: scale(1.08); }
  52%, 70% { opacity: 0; transform: scale(1.12); }
}

#measure-host {
  position: absolute;
  left: -9999px;
  top: 0;
  visibility: hidden;
  pointer-events: none;
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" data-step="0" data-step-dur="0" data-loop-state="stopped">
  <header class="title-bar">
    <h1>Climb Down to Lift Others Up</h1>
    <span class="course-tag">203-04</span>
  </header>

  <div class="stage" id="stage">
    <div class="opening-cue" id="opening-cue" aria-hidden="false"><p>What does greatness look like?</p></div>

    <svg class="climb-svg" id="climb-svg" viewBox="0 0 440 258" width="100%" role="img" aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Climb Down to Lift Others Up</title>
      <desc id="svg-desc">Clean whiteboard stage with the opening question What does greatness look like?</desc>

      <!-- Step 3 & Step 4 crisp Studio Wash double-hairline frame -->
      <g id="finish-frame" class="fade-part" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="6" width="424" height="246" rx="13" stroke="#1F684A" stroke-width="2" stroke-opacity="0.48" />
        <rect x="12.5" y="10.5" width="415" height="237" rx="9.5" stroke="#A8760A" stroke-width="0.9" stroke-opacity="0.38" />
      </g>

      <!-- Step 3 & Step 4 gentle band connecting GREATEST at the bottom of THE KINGDOM scale to the bottom serving row -->
      <g id="serving-row-band" class="fade-part">
        <rect x="18" y="171" width="380" height="44" rx="22" fill="#EAF5EF" fill-opacity="0.85" stroke="#1F684A" stroke-width="1.5" stroke-dasharray="5 4" />
      </g>

      <!-- LEFT SIDE: THE FLIPPABLE SCALE (THE WORLD -> THE KINGDOM) -->
      <g id="spectrum-area" class="fade-part">
        <text id="spec-mode-label" class="wb-sub" x="72" y="22" text-anchor="middle" fill="#5A4E3C">THE WORLD</text>

        <g id="flip-group">
          <!-- Single clean vertical arrow shaft from LEAST to GREATEST -->
          <line id="spec-shaft" x1="72" y1="71" x2="72" y2="174" stroke="#5A4E3C" stroke-width="3" stroke-linecap="round" />
          <polygon id="spec-arrow" points="72,60 64,74 80,74" fill="#5A4E3C" />

          <!-- GREATEST pill: sits at TOP (y=46) on THE WORLD scale, swings 180deg to BOTTOM (y=193) on THE KINGDOM scale! -->
          <g id="spec-badge-high">
            <rect id="spec-high-rect" x="24" y="33" width="96" height="26" rx="13" fill="#5A4E3C" stroke="#2C2416" stroke-width="1.5" />
            <text id="spec-high-txt" class="spec-pill-text" x="72" y="50" text-anchor="middle" fill="#FFFFFF">GREATEST</text>
          </g>

          <!-- LEAST pill: sits at BOTTOM (y=193) on THE WORLD scale, swings 180deg to TOP (y=46) on THE KINGDOM scale! -->
          <g id="spec-badge-low">
            <rect id="spec-low-rect" x="28" y="180" width="88" height="26" rx="13" fill="#F6F3EC" stroke="#8E8475" stroke-width="1.4" />
            <text id="spec-low-txt" class="spec-pill-text" x="72" y="197" text-anchor="middle" fill="#5A4E3C">LEAST</text>
          </g>
        </g>
      </g>

      <!-- STEP 4 CALM COMPOSITOR PULSES (pauses offscreen) -->
      <g id="service-pulses" fill="none">
        <circle id="pulse-you" class="loop-pulse" cx="306" cy="193" r="22" stroke="#A8760A" stroke-width="2.2" />
        <rect id="pulse-scale" class="loop-pulse" x="21" y="177" width="102" height="32" rx="16" stroke="#1F684A" stroke-width="2" />
      </g>

      <!-- RIGHT SIDE: THE 4 - 3 - 2 - 1 PYRAMID OF 10 COLORED DOTS (NO TRIANGLE SIDES, NO SENTENCES!) -->
      <g id="peers-layer" class="fade-part">
        <!-- peer-0: starts at Row 1 top (276,46) - Warm Amber-Gold -->
        <g id="peer-0" class="peer-group"><circle cx="0" cy="0" r="15" fill="#F3D58D" stroke="#B8861B" stroke-width="2" /></g>
        <!-- peer-1: Row 2 left (246,95) - Soft Sage-Teal -->
        <g id="peer-1" class="peer-group"><circle cx="0" cy="0" r="15" fill="#C2E0D8" stroke="#467A6D" stroke-width="2" /></g>
        <!-- peer-2: starts at Row 2 right (306,95) - Sky Blue -->
        <g id="peer-2" class="peer-group"><circle cx="0" cy="0" r="15" fill="#BDD9F2" stroke="#3B6E9C" stroke-width="2" /></g>
        <!-- peer-3: Row 3 left (216,144) - Soft Lavender -->
        <g id="peer-3" class="peer-group"><circle cx="0" cy="0" r="15" fill="#DCD0EC" stroke="#6E568F" stroke-width="2" /></g>
        <!-- peer-4: starts at Row 3 middle (276,144) - Warm Coral-Terracotta -->
        <g id="peer-4" class="peer-group"><circle cx="0" cy="0" r="15" fill="#F2C6B6" stroke="#B55D43" stroke-width="2" /></g>
        <!-- peer-5: Row 3 right (336,144) - Soft Olive-Moss -->
        <g id="peer-5" class="peer-group"><circle cx="0" cy="0" r="15" fill="#D5E2B8" stroke="#657C3B" stroke-width="2" /></g>
        <!-- peer-6: Row 4, 1st spot (186,193) - Dusty Rose -->
        <g id="peer-6" class="peer-group"><circle cx="0" cy="0" r="15" fill="#ECC8D6" stroke="#9B526E" stroke-width="2" /></g>
        <!-- peer-7: Row 4, 2nd spot (246,193) - Warm Apricot -->
        <g id="peer-7" class="peer-group"><circle cx="0" cy="0" r="15" fill="#F5DEC2" stroke="#A6733A" stroke-width="2" /></g>
        <!-- peer-8: Row 4, 4th spot (366,193) - Cool Periwinkle -->
        <g id="peer-8" class="peer-group"><circle cx="0" cy="0" r="15" fill="#C8D3EE" stroke="#4D6094" stroke-width="2" /></g>
      </g>

      <!-- HERO DOT ("You" - bold dark circle with crisp white You label; starts in Row 4, 3rd spot to the right!) -->
      <g id="hero-group" class="fade-part">
        <circle id="node-you" cx="0" cy="0" r="16.5" fill="#2C2416" stroke="#151009" stroke-width="2.3" />
        <text id="lbl-you" class="wb-label" x="0" y="4.2" text-anchor="middle" fill="#FFFFFF" style="stroke:none;">You</text>
      </g>

      <!-- STEP 4 GOLD PILL DIRECTLY UNDER "You" IN THE BOTTOM SERVING ROW (306,193) -->
      <g id="faithful-servant-pill" class="fade-part">
        <rect x="234" y="217" width="144" height="24" rx="12" fill="#A8760A" stroke="#7D5604" stroke-width="1.5" />
        <text id="faithful-pill-txt" class="spec-pill-text" x="306" y="233" text-anchor="middle" fill="#FFFFFF">FAITHFUL SERVANT</text>
      </g>
    </svg>
  </div>

  <div class="step-strip" role="group" aria-label="Greatness steps">
    <button type="button" class="step-dot active" data-step="0" aria-label="Start: Title or Towel" aria-pressed="true" style="--dot-color: #2C2416;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="1" aria-label="Step 1: Climbing for the Title" aria-pressed="false" style="--dot-color: #5A4E3C;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="2" aria-label="Step 2: Jesus Served You First" aria-pressed="false" style="--dot-color: #A8760A;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="3" aria-label="Step 3: Taking Up the Towel" aria-pressed="false" style="--dot-color: #1F684A;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="4" aria-label="Step 4: Well Done" aria-pressed="false" style="--dot-color: #A8760A;"><span class="step-dot-fill"></span></button>
  </div>

  <div class="card-area">
    <div class="verse-card">
      <div class="verse-card-bar"></div>
      <div class="verse-card-content" id="card-content" aria-live="polite" aria-atomic="true">
        <h2 class="card-heading" id="card-heading"></h2>
        <p class="card-verse"><span id="card-verse-text"></span><span class="verse-ref" id="card-ref"></span></p>
        <p class="card-note" id="card-note"></p>
      </div>
    </div>

    <div class="nav-bar">
      <button type="button" class="nav-btn secondary" id="prev-btn" disabled>&larr; Back</button>
      <span class="step-count" id="step-count">Ready</span>
      <button type="button" class="nav-btn primary" id="next-btn">Begin &rarr;</button>
    </div>
  </div>
</main>

<div id="measure-host" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  var STEPS = [
    {
      heading: 'Title or Towel',
      verse: '"But many who are first will be last, and the last first."',
      ref: 'Mark 10:31',
      note: 'There are two ways to measure greatness.',
      accent: '#2C2416',
      accentDark: '#2C2416',
      countLabel: 'Ready',
      nextLabel: 'Begin \u2192',
      title: 'Title or Towel',
      desc: 'Clean whiteboard stage displaying the opening question: What does greatness look like?'
    },
    {
      heading: 'Climbing for the Title',
      verse: '"they love the place of honor at feasts and the best seats in the synagogues."',
      ref: 'Matthew 23:6',
      note: 'The world says that to climb the ladder of success, you will have to step on some people on the way up.',
      accent: '#5A4E3C',
      accentDark: '#3F3629',
      countLabel: 'Step 1 of 4',
      nextLabel: 'Next \u2192',
      title: 'Climbing for the Title',
      desc: 'In a 4-3-2-1 pyramid of colored circles alongside THE WORLD scale, your dark circle starts in the 3rd spot of the bottom row and switches places row by row to reach the top.'
    },
    {
      heading: 'Jesus Served You First',
      verse: '"For even the Son of Man came not to be served but to serve, and to give his life as a ransom for many."',
      ref: 'Mark 10:45',
      note: 'The King took the towel, and the scale turned over.',
      accent: '#A8760A',
      accentDark: '#7D5604',
      countLabel: 'Step 2 of 4',
      nextLabel: 'Next \u2192',
      title: 'Jesus Served You First',
      desc: 'The scale on the left flips 180 degrees from THE WORLD to THE KINGDOM, putting Greatest at the bottom and Least at the top.'
    },
    {
      heading: 'Taking Up the Towel',
      verse: '"The greatest among you shall be your servant. Whoever exalts himself will be humbled, and whoever humbles himself will be exalted."',
      ref: 'Matthew 23:11-12',
      note: 'Climbing down to lift others up displays the gospel to the world.',
      accent: '#1F684A',
      accentDark: '#164E37',
      countLabel: 'Step 3 of 4',
      nextLabel: 'Next \u2192',
      title: 'Taking Up the Towel',
      desc: 'Your circle switches places downward row by row, helping each person move up past you until you stand in the bottom serving row aligned with Greatest on THE KINGDOM scale.'
    },
    {
      heading: 'Well Done',
      verse: '"Well done, good and faithful servant."',
      ref: 'Matthew 25:21',
      note: 'The world gives its titles to those at the top. God gives His to servants.',
      accent: '#A8760A',
      accentDark: '#7D5604',
      countLabel: 'Step 4 of 4',
      nextLabel: 'Start Over',
      title: 'Well Done',
      desc: 'In the bottom serving row aligned with Greatest on THE KINGDOM scale, a gold FAITHFUL SERVANT pill fades in directly under your circle.'
    }
  ];

  // 10 Slots of the 4 - 3 - 2 - 1 pyramid (no triangle outline lines)
  // 0: Row 1 top; 1..2: Row 2; 3..5: Row 3; 6..9: Row 4 (slot 8 is 3rd spot from left!)
  var SLOTS = [
    { x: 276, y: 46 },  // 0: Top (Row 1, spot 1)
    { x: 246, y: 95 },  // 1: Row 2, spot 1
    { x: 306, y: 95 },  // 2: Row 2, spot 2
    { x: 216, y: 144 }, // 3: Row 3, spot 1
    { x: 276, y: 144 }, // 4: Row 3, spot 2 (middle)
    { x: 336, y: 144 }, // 5: Row 3, spot 3
    { x: 186, y: 193 }, // 6: Row 4, spot 1
    { x: 246, y: 193 }, // 7: Row 4, spot 2
    { x: 306, y: 193 }, // 8: Row 4, spot 3 (3rd spot to the right - Hero's home!)
    { x: 366, y: 193 }  // 9: Row 4, spot 4
  ];

  // 30% of the previous 360ms swap speed -> 1200ms per swap + 260ms pause between swaps
  var SWAP_DUR = 1200;
  var SWAP_PAUSE = 260;

  var widget = document.getElementById('widget');
  var stage = document.getElementById('stage');
  var openingCue = document.getElementById('opening-cue');
  var svgTitle = document.getElementById('svg-title');
  var svgDesc = document.getElementById('svg-desc');
  var cardContent = document.getElementById('card-content');
  var cardHeading = document.getElementById('card-heading');
  var cardVerseText = document.getElementById('card-verse-text');
  var cardRef = document.getElementById('card-ref');
  var cardNote = document.getElementById('card-note');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  var stepCount = document.getElementById('step-count');
  var dotBtns = Array.prototype.slice.call(document.querySelectorAll('.step-dot'));
  var measureHost = document.getElementById('measure-host');

  var spectrumArea = document.getElementById('spectrum-area');
  var specModeLabel = document.getElementById('spec-mode-label');
  var flipGroup = document.getElementById('flip-group');
  var specShaft = document.getElementById('spec-shaft');
  var specArrow = document.getElementById('spec-arrow');
  var specHighRect = document.getElementById('spec-high-rect');
  var specLowRect = document.getElementById('spec-low-rect');
  var specLowTxt = document.getElementById('spec-low-txt');

  var finishFrame = document.getElementById('finish-frame');
  var servingRowBand = document.getElementById('serving-row-band');
  var faithfulServantPill = document.getElementById('faithful-servant-pill');

  var peersLayer = document.getElementById('peers-layer');
  var peerGroups = [];
  for (var pi = 0; pi < 9; pi++) {
    peerGroups.push(document.getElementById('peer-' + pi));
  }

  var heroGroup = document.getElementById('hero-group');

  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) {
    widget.classList.add('is-instant');
  }

  var currentStep = 0;
  var introTimer = null;
  var activeRaf = 0;
  var activeTimers = [];
  var lastMeasuredWidth = 0;

  // Offscreen pause tracking (contentvisibilityautostatechange + IntersectionObserver + visibilitychange)
  var isOnScreen = true;
  var isContentSkipped = false;
  var isDocHidden = typeof document.hidden === 'boolean' ? document.hidden : false;

  function syncLoopPlayback() {
    var shouldLoop = (currentStep === 4 && !reducedMotion && activeRaf === 0);
    var paused = !shouldLoop || !isOnScreen || isContentSkipped || isDocHidden;
    widget.classList.toggle('loop-active', shouldLoop);
    widget.classList.toggle('loop-paused', shouldLoop && paused);
    widget.setAttribute('data-loop-state', !shouldLoop ? 'stopped' : (paused ? 'paused' : 'running'));
  }

  window.CLIMB_DOWN_LOOP = {
    state: function () {
      return {
        step: currentStep,
        active: widget.classList.contains('loop-active'),
        paused: widget.classList.contains('loop-paused'),
        onScreen: isOnScreen,
        skipped: isContentSkipped,
        docHidden: isDocHidden,
        loopState: widget.getAttribute('data-loop-state')
      };
    }
  };

  stage.addEventListener('contentvisibilityautostatechange', function (e) {
    isContentSkipped = !!e.skipped;
    syncLoopPlayback();
  });

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      isOnScreen = entries[entries.length - 1].isIntersecting;
      syncLoopPlayback();
    }, { threshold: 0.01 }).observe(stage);
  }

  document.addEventListener('visibilitychange', function () {
    isDocHidden = !!document.hidden;
    syncLoopPlayback();
  });

  function cancelAnim() {
    if (activeRaf) {
      cancelAnimationFrame(activeRaf);
      activeRaf = 0;
    }
    while (activeTimers.length) {
      clearTimeout(activeTimers.pop());
    }
  }

  function placeGroup(g, x, y) {
    g.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')');
  }

  function layoutNodesForStep(idx) {
    var peerSlots;
    var heroSlot;

    if (idx <= 0 || idx >= 3) {
      // At Start and settled Step 3 & Step 4, Hero is in Row 4, 3rd spot (slot 8) and all 9 peers are in their natural slots
      peerSlots = [0, 1, 2, 3, 4, 5, 6, 7, 9];
      heroSlot = 8;
    } else {
      // On settled Step 1 and Step 2, Hero is at top (slot 0); Coral (peer 4) is at slot 8, Sky Blue (peer 2) at slot 4, Amber-Gold (peer 0) at slot 2
      peerSlots = [2, 1, 4, 3, 8, 5, 6, 7, 9];
      heroSlot = 0;
    }

    for (var i = 0; i < 9; i++) {
      var s = SLOTS[peerSlots[i]];
      placeGroup(peerGroups[i], s.x, s.y);
    }
    var hs = SLOTS[heroSlot];
    placeGroup(heroGroup, hs.x, hs.y);
  }

  function updateSpectrumAppearance(flipped) {
    flipGroup.classList.toggle('is-flipped', flipped);
    specModeLabel.textContent = flipped ? 'THE KINGDOM' : 'THE WORLD';
    specModeLabel.setAttribute('fill', flipped ? '#164E37' : '#5A4E3C');
    specShaft.setAttribute('stroke', flipped ? '#1F684A' : '#5A4E3C');
    specArrow.setAttribute('fill', flipped ? '#1F684A' : '#5A4E3C');
    specHighRect.setAttribute('fill', flipped ? '#1F684A' : '#5A4E3C');
    specHighRect.setAttribute('stroke', flipped ? '#164E37' : '#2C2416');
    specLowRect.setAttribute('fill', '#F6F3EC');
    specLowRect.setAttribute('stroke', '#8E8475');
    specLowTxt.setAttribute('fill', '#5A4E3C');
    specLowTxt.textContent = 'LEAST';
  }

  function setStaticState(idx) {
    var showStage = idx >= 1;
    var flipped = idx >= 2;

    spectrumArea.classList.toggle('is-visible', showStage);
    peersLayer.classList.toggle('is-visible', showStage);
    heroGroup.classList.toggle('is-visible', showStage);

    updateSpectrumAppearance(flipped);
    layoutNodesForStep(idx);

    servingRowBand.classList.toggle('is-visible', idx >= 3);
    finishFrame.classList.toggle('is-visible', idx >= 3);
    faithfulServantPill.classList.toggle('is-visible', idx === 4);

    syncLoopPlayback();
  }

  // Smooth sine ease-in-out pair swap so two dots glide around each other at 30% speed (1200ms per swap)
  function interpolateSwap(fromA, toA, p, sideSign) {
    var e = 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, p)));
    var arc = Math.sin(Math.PI * e) * 18 * sideSign;
    return {
      x: fromA.x + (toA.x - fromA.x) * e + arc,
      y: fromA.y + (toA.y - fromA.y) * e
    };
  }

  function animateStep(idx) {
    cancelAnim();

    if (idx === 1) {
      // Hero starts at bottom row, 3rd spot (slot 8) and slowly swaps up with Coral (slot 4), Sky Blue (slot 2), Amber-Gold (slot 0)
      setStaticState(1);
      var startSlots = [0, 1, 2, 3, 4, 5, 6, 7, 9];
      for (var i = 0; i < 9; i++) {
        placeGroup(peerGroups[i], SLOTS[startSlots[i]].x, SLOTS[startSlots[i]].y);
      }
      placeGroup(heroGroup, SLOTS[8].x, SLOTS[8].y);

      var s1End = SWAP_DUR;
      var s2Start = s1End + SWAP_PAUSE;
      var s2End = s2Start + SWAP_DUR;
      var s3Start = s2End + SWAP_PAUSE;
      var s3End = s3Start + SWAP_DUR;
      widget.setAttribute('data-step-dur', String(s3End));

      var t0 = 0;
      function f1(now) {
        if (!t0) t0 = now;
        var el = now - t0;

        if (el <= s1End) {
          var p1 = Math.min(1, el / SWAP_DUR);
          var h1 = interpolateSwap(SLOTS[8], SLOTS[4], p1, -1);
          var c1 = interpolateSwap(SLOTS[4], SLOTS[8], p1, 1);
          placeGroup(heroGroup, h1.x, h1.y);
          placeGroup(peerGroups[4], c1.x, c1.y);
        } else if (el <= s2Start) {
          placeGroup(heroGroup, SLOTS[4].x, SLOTS[4].y);
          placeGroup(peerGroups[4], SLOTS[8].x, SLOTS[8].y);
        } else if (el <= s2End) {
          placeGroup(peerGroups[4], SLOTS[8].x, SLOTS[8].y);
          var p2 = Math.min(1, (el - s2Start) / SWAP_DUR);
          var h2 = interpolateSwap(SLOTS[4], SLOTS[2], p2, 1);
          var c2 = interpolateSwap(SLOTS[2], SLOTS[4], p2, -1);
          placeGroup(heroGroup, h2.x, h2.y);
          placeGroup(peerGroups[2], c2.x, c2.y);
        } else if (el <= s3Start) {
          placeGroup(heroGroup, SLOTS[2].x, SLOTS[2].y);
          placeGroup(peerGroups[2], SLOTS[4].x, SLOTS[4].y);
        } else if (el <= s3End) {
          placeGroup(peerGroups[2], SLOTS[4].x, SLOTS[4].y);
          var p3 = Math.min(1, (el - s3Start) / SWAP_DUR);
          var h3 = interpolateSwap(SLOTS[2], SLOTS[0], p3, -1);
          var c3 = interpolateSwap(SLOTS[0], SLOTS[2], p3, 1);
          placeGroup(heroGroup, h3.x, h3.y);
          placeGroup(peerGroups[0], c3.x, c3.y);
        } else {
          activeRaf = 0;
          setStaticState(1);
          return;
        }
        activeRaf = requestAnimationFrame(f1);
      }
      activeRaf = requestAnimationFrame(f1);
      return;
    }

    if (idx === 2) {
      // Scale flips 180 degrees from THE WORLD to THE KINGDOM (GREATEST moves to the bottom!)
      setStaticState(2);
      widget.setAttribute('data-step-dur', '1280');
      return;
    }

    if (idx === 3) {
      // Hero at top (slot 0) slowly climbs down row by row (slot 0 -> slot 2 -> slot 4 -> slot 8),
      // helping Amber-Gold (peer 0), Sky Blue (peer 2), and Coral (peer 4) move UP past You!
      setStaticState(3);
      servingRowBand.classList.remove('is-visible');
      finishFrame.classList.remove('is-visible');

      placeGroup(heroGroup, SLOTS[0].x, SLOTS[0].y);
      placeGroup(peerGroups[0], SLOTS[2].x, SLOTS[2].y);
      placeGroup(peerGroups[2], SLOTS[4].x, SLOTS[4].y);
      placeGroup(peerGroups[4], SLOTS[8].x, SLOTS[8].y);

      var d1End = SWAP_DUR;
      var d2Start = d1End + SWAP_PAUSE;
      var d2End = d2Start + SWAP_DUR;
      var d3Start = d2End + SWAP_PAUSE;
      var d3End = d3Start + SWAP_DUR;
      widget.setAttribute('data-step-dur', String(d3End));

      var t3 = 0;
      function f3(now) {
        if (!t3) t3 = now;
        var el = now - t3;

        if (el <= d1End) {
          var pA = Math.min(1, el / SWAP_DUR);
          var hA = interpolateSwap(SLOTS[0], SLOTS[2], pA, 1);
          var cA = interpolateSwap(SLOTS[2], SLOTS[0], pA, -1);
          placeGroup(heroGroup, hA.x, hA.y);
          placeGroup(peerGroups[0], cA.x, cA.y);
        } else if (el <= d2Start) {
          placeGroup(heroGroup, SLOTS[2].x, SLOTS[2].y);
          placeGroup(peerGroups[0], SLOTS[0].x, SLOTS[0].y);
        } else if (el <= d2End) {
          placeGroup(peerGroups[0], SLOTS[0].x, SLOTS[0].y);
          var pB = Math.min(1, (el - d2Start) / SWAP_DUR);
          var hB = interpolateSwap(SLOTS[2], SLOTS[4], pB, -1);
          var cB = interpolateSwap(SLOTS[4], SLOTS[2], pB, 1);
          placeGroup(heroGroup, hB.x, hB.y);
          placeGroup(peerGroups[2], cB.x, cB.y);
        } else if (el <= d3Start) {
          placeGroup(heroGroup, SLOTS[4].x, SLOTS[4].y);
          placeGroup(peerGroups[2], SLOTS[2].x, SLOTS[2].y);
        } else if (el <= d3End) {
          placeGroup(peerGroups[2], SLOTS[2].x, SLOTS[2].y);
          var pC = Math.min(1, (el - d3Start) / SWAP_DUR);
          var hC = interpolateSwap(SLOTS[4], SLOTS[8], pC, 1);
          var cC = interpolateSwap(SLOTS[8], SLOTS[4], pC, -1);
          placeGroup(heroGroup, hC.x, hC.y);
          placeGroup(peerGroups[4], cC.x, cC.y);
        } else {
          activeRaf = 0;
          setStaticState(3);
          return;
        }
        activeRaf = requestAnimationFrame(f3);
      }
      activeRaf = requestAnimationFrame(f3);
      return;
    }

    if (idx === 4) {
      // Nothing moves: keep Step 3 end state and fade in the gold FAITHFUL SERVANT pill directly under "You"
      setStaticState(4);
      widget.setAttribute('data-step-dur', '400');
      return;
    }

    widget.setAttribute('data-step-dur', '0');
    setStaticState(idx);
  }

  function updateCardAndChrome(idx) {
    var s = STEPS[idx];
    widget.setAttribute('data-step', String(idx));
    widget.style.setProperty('--step-color', s.accent);
    widget.style.setProperty('--step-dark', s.accentDark);

    cardHeading.textContent = s.heading;
    cardVerseText.textContent = s.verse;
    cardRef.textContent = s.ref;
    cardNote.textContent = s.note;

    svgTitle.textContent = s.title;
    svgDesc.textContent = s.desc;

    stepCount.textContent = s.countLabel;
    nextBtn.textContent = s.nextLabel;
    prevBtn.disabled = (idx === 0);

    dotBtns.forEach(function (btn, i) {
      btn.classList.toggle('active', i === idx);
      btn.classList.toggle('passed', i < idx);
      btn.setAttribute('aria-pressed', i === idx ? 'true' : 'false');
    });
  }

  function goToStep(idx, animateForward, introFinished) {
    if (introTimer !== null) {
      if (idx !== 0) return;
      clearTimeout(introTimer);
      introTimer = null;
    }
    if (currentStep === 0 && idx > 0 && !introFinished && !reducedMotion) {
      openingCue.classList.add('is-hidden');
      openingCue.setAttribute('aria-hidden', 'true');
      introTimer = setTimeout(function () {
        introTimer = null;
        goToStep(idx, animateForward, true);
      }, 340);
      return;
    }
    if (idx < 0 || idx >= STEPS.length) return;
    cancelAnim();
    currentStep = idx;
    openingCue.classList.toggle('is-hidden', idx !== 0);
    openingCue.setAttribute('aria-hidden', idx === 0 ? 'false' : 'true');
    updateCardAndChrome(idx);

    var instant = reducedMotion || !animateForward || idx === 0;
    if (instant) {
      widget.classList.add('is-instant');
      widget.setAttribute('data-step-dur', '0');
      setStaticState(idx);
      if (!reducedMotion) {
        void widget.offsetWidth;
        widget.classList.remove('is-instant');
      }
    } else {
      widget.classList.remove('is-instant');
      animateStep(idx);
    }
  }

  function fitCardHeight() {
    var w = cardContent.clientWidth;
    if (!w) return;
    lastMeasuredWidth = w;
    var clone = cardContent.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('aria-live');
    clone.style.width = w + 'px';
    clone.style.minHeight = '0';
    clone.style.height = 'auto';

    var h = clone.querySelector('#card-heading');
    var v = clone.querySelector('#card-verse-text');
    var r = clone.querySelector('#card-ref');
    var n = clone.querySelector('#card-note');
    if (h) h.removeAttribute('id');
    if (v) v.removeAttribute('id');
    if (r) r.removeAttribute('id');
    if (n) n.removeAttribute('id');

    measureHost.innerHTML = '';
    measureHost.appendChild(clone);

    var maxH = 0;
    for (var i = 0; i < STEPS.length; i++) {
      if (h) h.textContent = STEPS[i].heading;
      if (v) v.textContent = STEPS[i].verse;
      if (r) r.textContent = STEPS[i].ref;
      if (n) n.textContent = STEPS[i].note;
      var measured = Math.ceil(clone.getBoundingClientRect().height);
      if (measured > maxH) maxH = measured;
    }
    measureHost.innerHTML = '';
    if (maxH > 0) {
      widget.style.setProperty('--card-h', maxH + 'px');
    }
  }

  nextBtn.addEventListener('click', function () {
    if (currentStep < STEPS.length - 1) {
      goToStep(currentStep + 1, true);
    } else {
      goToStep(0, false);
    }
  });

  prevBtn.addEventListener('click', function () {
    if (currentStep > 0) {
      goToStep(currentStep - 1, false);
    }
  });

  dotBtns.forEach(function (btn, i) {
    btn.addEventListener('click', function () {
      if (i === currentStep && introTimer === null) return;
      goToStep(i, i === currentStep + 1);
    });
  });

  window.addEventListener('resize', function () {
    var w = cardContent.clientWidth;
    if (w && Math.abs(w - lastMeasuredWidth) > 1) {
      fitCardHeight();
    }
  });

  fitCardHeight();
  goToStep(0, false, true);
})();
</script>
</body>
</html>
