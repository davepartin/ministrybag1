<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflect His Glory</title>
<style>
:root {
  --ink: #1C1A17;
  --charcoal: #2B2824;
  --muted: #656058;
  --tray: #F6F4EE;
  --border: #E6E1D6;
  --gold: #9A6E08;
  --gold-btn: #875F05;
  --gold-dark: #6E4C03;
  --gold-bright: #F4CE5C;
  --step-color: #1C1A17;
  --step-dark: #1C1A17;
  --card-h: 132px;
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  padding: 0;
  margin: 0;
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.widget-outer {
  background: #FFFFFF;
  border-radius: 0;
  overflow: hidden;
  max-width: 100%;
  width: 100%;
  margin: 0;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(28, 26, 23, 0.09);
    border: 1px solid #E6E1D6;
    max-width: 460px;
    margin: 0 auto;
  }
}

.title-bar {
  background: #1C1A17;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  margin: 0;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E4DFD4;
  white-space: nowrap;
}

.stage {
  background: #141311;
  padding: 0;
  border-bottom: 1px solid var(--border);
}

.scene-svg {
  display: block;
  width: 100%;
  height: auto;
}

.reveal-layer {
  opacity: 0;
}

.reveal-layer.is-visible {
  opacity: 1;
}

.stars-layer {
  opacity: 1;
}

.stars-layer.is-faded {
  opacity: 0.14;
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  padding: 5px 12px 4px;
  background: var(--tray);
  border-bottom: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  min-width: 28px;
  min-height: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
}

.step-dot-fill {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2.5px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 24%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.12);
}

.card-area {
  background: var(--tray);
  padding: 6px 12px 9px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #E6E1D6;
  box-shadow: 0 2px 10px rgba(28, 26, 23, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 13px;
  min-height: var(--card-h, 132px);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 4px;
}

.card-heading {
  font: 700 15px/1.2 system-ui, -apple-system, sans-serif;
  color: var(--step-dark);
  margin: 0;
}

.card-quote {
  font: 12.8px/1.34 Georgia, Cambria, serif;
  color: #1C1A17;
  margin: 0;
}

.card-ref {
  font: 600 11.5px/1.2 system-ui, -apple-system, sans-serif;
  color: var(--muted);
  margin-left: 4px;
  white-space: nowrap;
}

.card-note {
  font: 12.2px/1.34 system-ui, -apple-system, sans-serif;
  color: #46423C;
  margin: 0;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #CFCAC0;
  background: #FFFFFF;
  color: var(--ink);
  font: 700 13.5px/1 system-ui, -apple-system, sans-serif;
  cursor: pointer;
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FFFFFF;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.step-count {
  font: 600 12px system-ui, -apple-system, sans-serif;
  color: var(--muted);
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (prefers-reduced-motion: no-preference) {
  .widget-outer:not(.is-instant) .reveal-layer,
  .widget-outer:not(.is-instant) .stars-layer {
    transition: opacity 0.65s ease;
  }
  .widget-outer .step-dot-fill {
    transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
  }
  .widget-outer .nav-btn.primary,
  .widget-outer .verse-card-bar,
  .widget-outer .card-heading {
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease;
  }
}

@media (max-width: 395px) {
  .card-area {
    padding: 6px 10px 8px;
  }
  .verse-card-content {
    padding: 8px 11px;
  }
  .card-heading {
    font-size: 14.5px;
  }
  .card-quote {
    font-size: 12.4px;
  }
  .card-note {
    font-size: 11.8px;
  }
}

@media (forced-colors: active) {
  .step-dot-fill {
    border-color: ButtonText;
    background: Canvas;
  }
  .step-dot.active .step-dot-fill {
    background: Highlight;
    border-color: Highlight;
  }
  .nav-btn.primary {
    border: 2px solid Highlight;
  }
}
</style>
</head>
<body>
<main class="widget-outer" id="scene-root" aria-label="Reflect His Glory"></main>

<script>
(function () {
  'use strict';

  var SVG_NS = 'http://www.w3.org/2000/svg';

  // Black, white, and yellow palette only
  var COLORS = {
    black: '#1C1A17',
    charcoal: '#4A453E',
    charcoalDark: '#2E2B26',
    goldDeep: '#7C5604',
    goldBtn: '#8E6406',
    goldDark: '#6B4903'
  };

  var STEPS = [
    {
      id: 'turn',
      dotLabel: 'Slide 1: Turn Toward His Glory',
      color: COLORS.charcoal,
      dark: COLORS.charcoalDark,
      heading: 'Turn Toward His Glory',
      verse: '"We all, with unveiled faces, are looking as in a mirror at the glory of the Lord..."',
      ref: '2 Corinthians 3:18',
      line: 'Just as Moses\' face shone after being with God, worship turns our attention toward Him.',
      desc: 'Soft yellow light reaches over the distant dark charcoal hills toward a dim cratered moon above a quiet village at night.'
    },
    {
      id: 'changed',
      dotLabel: 'Slide 2: Changed by His Presence',
      color: COLORS.goldBtn,
      dark: COLORS.goldDark,
      heading: 'Changed by His Presence',
      verse: '"...are being transformed into the same image from glory to glory..."',
      ref: '2 Corinthians 3:18',
      line: 'Like a mirror receiving His light, we are changed by His Spirit to become more like Jesus.',
      desc: 'The cratered moon brightens into luminous warm yellow and white as it receives light from the golden glow beyond the distant hills.'
    },
    {
      id: 'reaches-others',
      dotLabel: 'Slide 3: His Light Reaches Others',
      color: COLORS.goldBtn,
      dark: COLORS.goldDark,
      heading: 'His Light Reaches Others',
      verse: '"Let your light shine before others, so that they may see your good works and give glory to your Father..."',
      ref: 'Matthew 5:16',
      line: 'What we receive in worship becomes love people can see.',
      desc: 'Soft moonlight gently reveals the winding village road and rooftops while warm yellow lights come on inside the homes.'
    },
    {
      id: 'whole-earth',
      dotLabel: 'Slide 4: The Whole Earth Filled',
      color: COLORS.goldDeep,
      dark: COLORS.goldDark,
      heading: 'The Whole Earth Filled',
      verse: '"For the earth will be filled with the knowledge of the glory of the LORD as the waters cover the sea."',
      ref: 'Habakkuk 2:14',
      line: 'We reflect His glory now, looking forward to the day it fills the earth.',
      desc: 'The full golden sun rises over the distant hill and rests at the horizon, flooding the sky, hills, road, and village with warm morning light while the moon remains visible above.'
    }
  ];

  // One fixed charcoal-white-yellow composition on 440 x 260 canvas
  var GEO = {
    W: 440,
    H: 260,
    horizonSunX: 88,
    horizonSunY: 152, // Full r=21 sun rests right at the y=172 horizon ridge (152 + 21 = 173)
    horizonSunR: 21,
    moonX: 294,
    moonY: 66,
    moonR: 24
  };

  function el(tag, attrs, parent) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'text') node.textContent = attrs[k];
        else if (k === 'class') node.className = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    if (parent) parent.appendChild(node);
    return node;
  }

  function svgEl(tag, attrs, parent) {
    var node = document.createElementNS(SVG_NS, tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'text') node.textContent = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    if (parent) parent.appendChild(node);
    return node;
  }

  function addLinearGrad(defs, id, x1, y1, x2, y2, stops) {
    var grad = svgEl('linearGradient', { id: id, x1: x1, y1: y1, x2: x2, y2: y2 }, defs);
    stops.forEach(function (s) {
      var attrs = { offset: s[0], 'stop-color': s[1] };
      if (s[2] !== undefined) attrs['stop-opacity'] = String(s[2]);
      svgEl('stop', attrs, grad);
    });
    return grad;
  }

  function addRadialGrad(defs, id, cx, cy, r, stops) {
    var grad = svgEl('radialGradient', { id: id, cx: cx, cy: cy, r: r }, defs);
    stops.forEach(function (s) {
      var attrs = { offset: s[0], 'stop-color': s[1] };
      if (s[2] !== undefined) attrs['stop-opacity'] = String(s[2]);
      svgEl('stop', attrs, grad);
    });
    return grad;
  }

  function drawHouse(parent, x, y, w, h, roofH, opts) {
    var g = svgEl('g', {}, parent);
    var wallFill = (opts && opts.wallFill) || '#24221F';
    var roofFill = (opts && opts.roofFill) || '#191815';
    var stroke = (opts && opts.stroke) || '#0E0D0B';
    svgEl('rect', {
      x: x,
      y: y,
      width: w,
      height: h,
      fill: wallFill,
      stroke: stroke,
      'stroke-width': '1.2',
      'stroke-linejoin': 'round'
    }, g);
    svgEl('polygon', {
      points: (x - 3) + ',' + y + ' ' + (x + w / 2) + ',' + (y - roofH) + ' ' + (x + w + 3) + ',' + y,
      fill: roofFill,
      stroke: stroke,
      'stroke-width': '1.2',
      'stroke-linejoin': 'round'
    }, g);
    return g;
  }

  function drawTree(parent, cx, baseY, h, w, fill, stroke) {
    var g = svgEl('g', {}, parent);
    svgEl('line', {
      x1: cx,
      y1: baseY,
      x2: cx,
      y2: baseY - h * 0.35,
      stroke: stroke,
      'stroke-width': '1.4',
      'stroke-linecap': 'round'
    }, g);
    svgEl('ellipse', {
      cx: cx,
      cy: baseY - h * 0.62,
      rx: w * 0.5,
      ry: h * 0.42,
      fill: fill,
      stroke: stroke,
      'stroke-width': '1.1'
    }, g);
    return g;
  }

  function drawMoonCraters(parent, cx, cy, lit) {
    // Rich, distinct, painterly lunar craters (clearly readable on mobile without looking muddy)
    var craters = [
      { dx: 7, dy: -8, r: 5.2 },
      { dx: -9, dy: -6, r: 3.6 },
      { dx: -3, dy: 6, r: 4.5 },
      { dx: 10, dy: 5, r: 3.3 },
      { dx: 1, dy: -1, r: 2.3 },
      { dx: -12, dy: 4, r: 2.1 },
      { dx: 5, dy: 12, r: 2.4 },
      { dx: -2, dy: -13, r: 2.0 },
      { dx: 13, dy: -2, r: 1.7 }
    ];
    craters.forEach(function (c) {
      var x = cx + c.dx;
      var y = cy + c.dy;
      if (lit) {
        // Subtle inner basin wash + crisp rim crescent shadow on the sun-opposite (top-right) inside wall
        svgEl('circle', {
          cx: x,
          cy: y,
          r: c.r,
          fill: '#CFA74D',
          opacity: '0.32'
        }, parent);
        svgEl('circle', {
          cx: x,
          cy: y,
          r: c.r,
          fill: 'none',
          stroke: '#B68C32',
          'stroke-width': '0.9',
          opacity: '0.52'
        }, parent);
        // Tiny warm sunlit rim highlight on the lower-left edge of larger craters
        if (c.r >= 3.2) {
          svgEl('path', {
            d: 'M ' + (x - c.r * 0.65).toFixed(1) + ' ' + (y - c.r * 0.35).toFixed(1) +
               ' A ' + c.r + ' ' + c.r + ' 0 0 0 ' + (x + c.r * 0.4).toFixed(1) + ' ' + (y + c.r * 0.65).toFixed(1),
            fill: 'none',
            stroke: '#FFFDF2',
            'stroke-width': '0.8',
            'stroke-linecap': 'round',
            opacity: '0.55'
          }, parent);
        }
      } else {
        // Subtle dark charcoal craters visible even on the unlit night moon
        svgEl('circle', {
          cx: x,
          cy: y,
          r: c.r,
          fill: '#171614',
          stroke: '#3D3A34',
          'stroke-width': '0.7',
          opacity: '0.65'
        }, parent);
      }
    });
  }

  function buildStage(parent) {
    var stage = el('div', { class: 'stage' }, parent);
    var svg = svgEl('svg', {
      class: 'scene-svg',
      viewBox: '0 0 440 260',
      width: '100%',
      role: 'img',
      'aria-labelledby': 'glory-svg-title glory-svg-desc'
    }, stage);

    var svgTitle = svgEl('title', { id: 'glory-svg-title', text: 'Reflect His Glory' }, svg);
    var svgDesc = svgEl('desc', { id: 'glory-svg-desc', text: STEPS[0].desc }, svg);

    var defs = svgEl('defs', {}, svg);

    // Deep dark charcoal night sky (black/charcoal tones, zero blue!)
    addLinearGrad(defs, 'sky-night', '0%', '0%', '0%', '100%', [
      ['0%', '#11100E'],
      ['58%', '#1B1916'],
      ['100%', '#282520']
    ]);

    // Step 1: Soft golden-yellow glow growing behind the distant left hills (sun still hidden)
    addRadialGrad(defs, 'hidden-horizon-glow', '50%', '52%', '50%', [
      ['0%', '#FCE08A', 0.72],
      ['40%', '#E5B749', 0.32],
      ['74%', '#8C7235', 0.09],
      ['100%', '#1B1916', 0]
    ]);

    // Step 2: Feathered warm yellow skylight veil reaching diagonally toward the moon
    addRadialGrad(defs, 'sky-bridge-glow', '50%', '50%', '50%', [
      ['0%', '#FBE6A2', 0.14],
      ['56%', '#E9C25B', 0.06],
      ['100%', '#1B1916', 0]
    ]);

    // Step 1: Dim Moon (soft natural charcoal surface, no outline ring)
    addLinearGrad(defs, 'moon-dim-grad', '14%', '82%', '88%', '18%', [
      ['0%', '#36322C'],
      ['55%', '#2B2823'],
      ['100%', '#211F1B']
    ]);

    // Step 2: Illuminated Moon (warm white + golden yellow, brightest on lower-left horizon-facing limb)
    addLinearGrad(defs, 'moon-lit-grad', '14%', '82%', '88%', '18%', [
      ['0%', '#FFFDF5'],
      ['46%', '#FCF0C4'],
      ['82%', '#ECC96E'],
      ['100%', '#D6AC4C']
    ]);
    addRadialGrad(defs, 'moon-aura-grad', '50%', '50%', '50%', [
      ['0%', '#FFF7D6', 0.44],
      ['48%', '#F8DA7A', 0.18],
      ['78%', '#B59648', 0.05],
      ['100%', '#1B1916', 0]
    ]);

    // Step 3: Seamless feathered moonlight pool over the dark charcoal village (50%/50% center so zero clip edge!)
    addRadialGrad(defs, 'moonlight-pool-grad', '50%', '50%', '50%', [
      ['0%', '#FFF8DF', 0.18],
      ['45%', '#F7E5AE', 0.09],
      ['76%', '#968A6E', 0.03],
      ['100%', '#1B1916', 0]
    ]);
    addLinearGrad(defs, 'road-moon-grad', '50%', '0%', '50%', '100%', [
      ['0%', '#E4DFD3', 0.74],
      ['55%', '#F5EBCB', 0.64],
      ['100%', '#DCD6C6', 0.46]
    ]);
    addRadialGrad(defs, 'window-warm-halo', '50%', '50%', '50%', [
      ['0%', '#FDE388', 0.62],
      ['55%', '#E8B844', 0.2],
      ['100%', '#24221F', 0]
    ]);

    // Step 4: Full horizon sunrise bringing the whole scene to light (strict charcoal, white, and yellow palette)
    addLinearGrad(defs, 'dawn-sky-full', '50%', '0%', '50%', '100%', [
      ['0%', '#4E473A', 0.94],
      ['38%', '#8D7A4F', 0.95],
      ['74%', '#DFC276', 0.97],
      ['100%', '#FFF5D1', 1]
    ]);
    addRadialGrad(defs, 'dawn-edge-glow', '50%', '50%', '50%', [
      ['0%', '#FFFFFF', 0.96],
      ['26%', '#FFF1B5', 0.78],
      ['56%', '#F6D068', 0.36],
      ['100%', '#DFC276', 0]
    ]);
    addRadialGrad(defs, 'rising-sun-disc', '50%', '45%', '58%', [
      ['0%', '#FFFFFF'],
      ['48%', '#FFF2B3'],
      ['84%', '#F6CA52'],
      ['100%', '#E0AA2A']
    ]);
    addRadialGrad(defs, 'sun-inner-halo', '50%', '50%', '50%', [
      ['0%', '#FFFFFF', 0.85],
      ['56%', '#FFF6CE', 0.42],
      ['100%', '#FFF6CE', 0]
    ]);
    addLinearGrad(defs, 'dawn-hill-far', '18%', '0%', '88%', '100%', [
      ['0%', '#AE955B'],
      ['52%', '#847350'],
      ['100%', '#6B5F47']
    ]);
    addLinearGrad(defs, 'dawn-hill-mid-l', '15%', '0%', '85%', '100%', [
      ['0%', '#8A7852'],
      ['100%', '#665A43']
    ]);
    addLinearGrad(defs, 'dawn-hill-mid-r', '10%', '0%', '95%', '100%', [
      ['0%', '#786A4D'],
      ['100%', '#5B513E']
    ]);
    addLinearGrad(defs, 'dawn-meadow', '25%', '0%', '75%', '100%', [
      ['0%', '#6A5D46'],
      ['100%', '#494133']
    ]);
    addLinearGrad(defs, 'dawn-road-grad', '50%', '0%', '50%', '100%', [
      ['0%', '#FFF5D4'],
      ['55%', '#EFE2BA'],
      ['100%', '#D8CBA4']
    ]);

    // 1) Fixed Dark Charcoal Night Sky
    svgEl('rect', { x: 0, y: 0, width: 440, height: 260, fill: 'url(#sky-night)' }, svg);

    // 2) Crisp White Starfield
    var starsLayer = svgEl('g', { id: 'layer-stars', class: 'stars-layer' }, svg);
    var starCoords = [
      [36, 34, 1.1], [74, 24, 1.3], [116, 48, 1.0], [154, 28, 1.4],
      [196, 44, 1.1], [232, 24, 1.2], [354, 30, 1.4], [392, 46, 1.1],
      [414, 28, 1.3], [364, 78, 1.0], [404, 92, 1.1], [134, 92, 1.0],
      [212, 98, 0.95], [338, 108, 1.0]
    ];
    starCoords.forEach(function (st) {
      svgEl('circle', { cx: st[0], cy: st[1], r: st[2], fill: '#FAF8F3', opacity: '0.68' }, starsLayer);
    });
    svgEl('path', {
      d: 'M 154 22 L 154 34 M 148 28 L 160 28',
      stroke: '#FAF8F3',
      'stroke-width': '0.95',
      'stroke-linecap': 'round',
      opacity: '0.5'
    }, starsLayer);
    svgEl('path', {
      d: 'M 354 24 L 354 36 M 348 30 L 360 30',
      stroke: '#FAF8F3',
      'stroke-width': '0.95',
      'stroke-linecap': 'round',
      opacity: '0.5'
    }, starsLayer);

    // 3) Step 1: Soft Yellow-Gold Glow growing behind the distant left hills (sun STILL hidden!)
    var horizonGlowLayer = svgEl('g', { id: 'layer-horizon-glow', class: 'reveal-layer' }, svg);
    svgEl('ellipse', {
      cx: GEO.horizonSunX,
      cy: 176,
      rx: 128,
      ry: 64,
      fill: 'url(#hidden-horizon-glow)'
    }, horizonGlowLayer);

    // 4) Step 2: Feathered atmospheric skylight veil bridging hidden horizon toward the moon
    var skyBridgeLayer = svgEl('g', { id: 'layer-sky-bridge', class: 'reveal-layer' }, svg);
    svgEl('ellipse', {
      cx: 186,
      cy: 122,
      rx: 155,
      ry: 58,
      transform: 'rotate(-27 186 122)',
      fill: 'url(#sky-bridge-glow)'
    }, skyBridgeLayer);

    // 5) Step 4: Full Horizon Sunrise bringing the whole sky to warm golden light!
    var dawnHorizonLayer = svgEl('g', { id: 'layer-dawn-horizon', class: 'reveal-layer' }, svg);
    svgEl('rect', {
      x: 0,
      y: 0,
      width: 440,
      height: 204,
      fill: 'url(#dawn-sky-full)'
    }, dawnHorizonLayer);
    svgEl('ellipse', {
      cx: GEO.horizonSunX,
      cy: GEO.horizonSunY + 4,
      rx: 230,
      ry: 132,
      fill: 'url(#dawn-edge-glow)'
    }, dawnHorizonLayer);
    // Full glowing sun rises from behind the far ridge to rest right on the y=172 horizon
    var sunEdgeGroup = svgEl('g', { id: 'rising-sun-edge', transform: 'translate(0, 36)' }, dawnHorizonLayer);
    svgEl('circle', {
      cx: GEO.horizonSunX,
      cy: GEO.horizonSunY,
      r: GEO.horizonSunR + 18,
      fill: 'url(#sun-inner-halo)'
    }, sunEdgeGroup);
    svgEl('circle', {
      cx: GEO.horizonSunX,
      cy: GEO.horizonSunY,
      r: GEO.horizonSunR,
      fill: 'url(#rising-sun-disc)',
      stroke: '#E4B030',
      'stroke-width': '1.3'
    }, sunEdgeGroup);

    // 6) Step 3: Soft Feathered Moonlight Pool descending gently over the charcoal village
    var moonlightPoolLayer = svgEl('g', { id: 'layer-moonlight-pool', class: 'reveal-layer' }, svg);
    svgEl('ellipse', {
      cx: 266,
      cy: 174,
      rx: 196,
      ry: 112,
      fill: 'url(#moonlight-pool-grad)'
    }, moonlightPoolLayer);

    // 7) THE MOON (Fixed high-right at 294, 66 with richer craters and no outer ring lines)
    var moonBaseLayer = svgEl('g', { id: 'layer-moon-base' }, svg);
    svgEl('circle', {
      cx: GEO.moonX,
      cy: GEO.moonY,
      r: GEO.moonR,
      fill: 'url(#moon-dim-grad)'
    }, moonBaseLayer);
    drawMoonCraters(moonBaseLayer, GEO.moonX, GEO.moonY, false);

    var moonLitLayer = svgEl('g', { id: 'layer-moon-lit', class: 'reveal-layer' }, svg);
    svgEl('circle', {
      cx: GEO.moonX,
      cy: GEO.moonY,
      r: GEO.moonR + 24,
      fill: 'url(#moon-aura-grad)'
    }, moonLitLayer);
    svgEl('circle', {
      cx: GEO.moonX,
      cy: GEO.moonY,
      r: GEO.moonR,
      fill: 'url(#moon-lit-grad)'
    }, moonLitLayer);
    // Rich lunar craters sculpted in warm golden-ochre & white highlights
    drawMoonCraters(moonLitLayer, GEO.moonX, GEO.moonY, true);
    // Bright sunlit crescent edge facing the hidden horizon sun
    svgEl('path', {
      d: 'M ' + (GEO.moonX - 18) + ' ' + (GEO.moonY - 8) + ' A 20 20 0 0 0 ' + (GEO.moonX + 8) + ' ' + (GEO.moonY + 18),
      fill: 'none',
      stroke: '#FFFFFF',
      'stroke-width': '1.5',
      'stroke-linecap': 'round',
      opacity: '0.68'
    }, moonLitLayer);

    // 8) FIXED DARK CHARCOAL NIGHTTIME VILLAGE (Houses, church, road, hills, trees)
    var landBase = svgEl('g', { id: 'layer-landscape-base' }, svg);

    // Far charcoal hills (saddle at x=88 is y=172, hiding the sun until Step 4 rises above!)
    svgEl('path', {
      d: 'M 0 183 Q 44 176 88 172 Q 134 168 184 179 Q 256 192 336 175 Q 388 166 440 176 L 440 260 L 0 260 Z',
      fill: '#262420',
      stroke: '#161512',
      'stroke-width': '1.2'
    }, landBase);

    // Mid-ground left & right valley slopes
    svgEl('path', {
      d: 'M 0 198 Q 92 186 184 203 Q 222 210 250 206 L 250 260 L 0 260 Z',
      fill: '#1E1D1A',
      stroke: '#12110F',
      'stroke-width': '1.2'
    }, landBase);
    svgEl('path', {
      d: 'M 222 210 Q 306 191 380 201 Q 414 206 440 198 L 440 260 L 222 260 Z',
      fill: '#1B1A17',
      stroke: '#12110F',
      'stroke-width': '1.2'
    }, landBase);

    // Foreground village meadow
    svgEl('path', {
      d: 'M 0 227 Q 118 216 230 225 Q 334 234 440 220 L 440 260 L 0 260 Z',
      fill: '#151412',
      stroke: '#0C0B0A',
      'stroke-width': '1.2'
    }, landBase);

    // Winding quiet village road
    svgEl('path', {
      d: 'M 248 205 C 234 215 224 224 239 234 C 256 244 261 252 249 260 L 269 260 C 279 250 273 240 254 232 C 238 225 246 215 258 205 Z',
      fill: '#24221E',
      stroke: '#131210',
      'stroke-width': '1'
    }, landBase);

    // Quiet countryside trees (dark charcoal)
    drawTree(landBase, 46, 224, 24, 14, '#1D1C19', '#0E0D0B');
    drawTree(landBase, 78, 218, 28, 16, '#1D1C19', '#0E0D0B');
    drawTree(landBase, 166, 218, 20, 12, '#201F1B', '#0E0D0B');
    drawTree(landBase, 282, 217, 22, 13, '#201F1B', '#0E0D0B');
    drawTree(landBase, 336, 223, 20, 12, '#1D1C19', '#0E0D0B');
    drawTree(landBase, 396, 222, 26, 15, '#1D1C19', '#0E0D0B');

    // Cozy village homes + small country church (preserved shapes, dark charcoal tones)
    drawHouse(landBase, 112, 214, 30, 18, 12, { wallFill: '#24221F', roofFill: '#181714' });
    drawHouse(landBase, 184, 204, 26, 22, 14, { wallFill: '#282622', roofFill: '#1A1916' });
    svgEl('path', {
      d: 'M 197 183 L 197 190 M 194.5 185.5 L 199.5 185.5',
      stroke: '#8D887E',
      'stroke-width': '1.2',
      'stroke-linecap': 'round'
    }, landBase);
    drawHouse(landBase, 296, 211, 28, 18, 11, { wallFill: '#252320', roofFill: '#181714' });
    drawHouse(landBase, 348, 218, 30, 17, 11, { wallFill: '#22201D', roofFill: '#171613' });

    // Unlit quiet windows (base night state)
    var windowCoords = [
      [119, 220, 5, 6], [130, 220, 5, 6],
      [192, 211, 4, 7], [199, 211, 4, 7],
      [303, 217, 5, 6], [313, 217, 5, 6],
      [355, 223, 5, 5], [366, 223, 5, 5]
    ];
    windowCoords.forEach(function (w) {
      svgEl('rect', { x: w[0], y: w[1], width: w[2], height: w[3], rx: 1, fill: '#35322D' }, landBase);
    });

    // Subtle golden ridge rim on Steps 1 & 2 where hidden light kisses the far left hill
    var farRidgeRimStep1 = svgEl('g', { id: 'layer-far-rim-step1', class: 'reveal-layer' }, svg);
    svgEl('path', {
      d: 'M 18 180 Q 54 174 88 172 Q 124 169 162 175',
      fill: 'none',
      stroke: '#F9DC82',
      'stroke-width': '1.4',
      'stroke-linecap': 'round',
      opacity: '0.7'
    }, farRidgeRimStep1);

    // 9) Step 3: Soft moonlight reveals the winding road, rooftops, and warm yellow house windows!
    var landMoonlit = svgEl('g', { id: 'layer-landscape-moonlit', class: 'reveal-layer' }, svg);

    // Moonlit winding road
    svgEl('path', {
      d: 'M 249 206 C 236 215 226 224 241 234 C 256 244 261 252 250 260 L 266 260 C 276 250 270 240 252 232 C 238 225 247 215 257 206 Z',
      fill: 'url(#road-moon-grad)',
      opacity: '0.8'
    }, landMoonlit);
    // Open hillside moonlit crests (clear of roofs)
    svgEl('path', {
      d: 'M 218 206 Q 234 208 248 206 M 260 204 Q 276 199 292 197 M 332 197 Q 358 198 384 201',
      fill: 'none',
      stroke: '#FAF0CA',
      'stroke-width': '1.25',
      'stroke-linecap': 'round',
      opacity: '0.6'
    }, landMoonlit);
    // Moonlit rooftops catching warm pale light
    svgEl('path', {
      d: 'M 109 214 L 127 202 L 145 214 M 181 204 L 197 190 L 213 204 M 293 211 L 310 200 L 327 211 M 345 218 L 363 207 L 381 218',
      fill: 'none',
      stroke: '#FCE8A8',
      'stroke-width': '1.45',
      'stroke-linecap': 'round',
      'stroke-linejoin': 'round',
      opacity: '0.88'
    }, landMoonlit);
    // Church cross catches soft light
    svgEl('path', {
      d: 'M 197 183 L 197 190 M 194.5 185.5 L 199.5 185.5',
      stroke: '#FCE8A8',
      'stroke-width': '1.4',
      'stroke-linecap': 'round'
    }, landMoonlit);
    // Warm yellow glowing home & church windows
    windowCoords.forEach(function (w) {
      svgEl('circle', {
        cx: w[0] + w[2] / 2,
        cy: w[1] + w[3] / 2,
        r: 7.5,
        fill: 'url(#window-warm-halo)'
      }, landMoonlit);
      svgEl('rect', {
        x: w[0],
        y: w[1],
        width: w[2],
        height: w[3],
        rx: 1,
        fill: '#FDE48E'
      }, landMoonlit);
    });

    // 10) Step 4: Whole village & hills brought into warm morning light (charcoal, white, and yellow only)
    var landDawnRim = svgEl('g', { id: 'layer-landscape-dawn', class: 'reveal-layer' }, svg);
    // Lit far hills
    svgEl('path', {
      d: 'M 0 183 Q 44 176 88 172 Q 134 168 184 179 Q 256 192 336 175 Q 388 166 440 176 L 440 260 L 0 260 Z',
      fill: 'url(#dawn-hill-far)',
      stroke: '#584E3B',
      'stroke-width': '1.1'
    }, landDawnRim);
    // Bright sunlit rim along the far horizon ridge
    svgEl('path', {
      d: 'M 0 183 Q 44 176 88 172 Q 134 168 184 179 Q 256 192 336 175 Q 388 166 440 176',
      fill: 'none',
      stroke: '#FFF8D8',
      'stroke-width': '2',
      'stroke-linecap': 'round',
      opacity: '0.96'
    }, landDawnRim);
    // Lit mid-ground valley slopes
    svgEl('path', {
      d: 'M 0 198 Q 92 186 184 203 Q 222 210 250 206 L 250 260 L 0 260 Z',
      fill: 'url(#dawn-hill-mid-l)',
      stroke: '#4B4333',
      'stroke-width': '1.1'
    }, landDawnRim);
    svgEl('path', {
      d: 'M 0 198 Q 92 186 184 203 Q 222 210 250 206',
      fill: 'none',
      stroke: '#FDEAA8',
      'stroke-width': '1.3',
      opacity: '0.68'
    }, landDawnRim);
    svgEl('path', {
      d: 'M 222 210 Q 306 191 380 201 Q 414 206 440 198 L 440 260 L 222 260 Z',
      fill: 'url(#dawn-hill-mid-r)',
      stroke: '#474032',
      'stroke-width': '1.1'
    }, landDawnRim);
    svgEl('path', {
      d: 'M 222 210 Q 306 191 380 201 Q 414 206 440 198',
      fill: 'none',
      stroke: '#FBE6A0',
      'stroke-width': '1.25',
      opacity: '0.6'
    }, landDawnRim);
    // Lit foreground meadow
    svgEl('path', {
      d: 'M 0 227 Q 118 216 230 225 Q 334 234 440 220 L 440 260 L 0 260 Z',
      fill: 'url(#dawn-meadow)',
      stroke: '#3A3429',
      'stroke-width': '1.1'
    }, landDawnRim);
    // Sunlit winding road
    svgEl('path', {
      d: 'M 248 205 C 234 215 224 224 239 234 C 256 244 261 252 249 260 L 269 260 C 279 250 273 240 254 232 C 238 225 246 215 258 205 Z',
      fill: 'url(#dawn-road-grad)',
      stroke: '#7A6C4F',
      'stroke-width': '0.9'
    }, landDawnRim);
    // Sunlit countryside trees
    drawTree(landDawnRim, 46, 224, 24, 14, '#5A503E', '#332E25');
    drawTree(landDawnRim, 78, 218, 28, 16, '#5F5440', '#332E25');
    drawTree(landDawnRim, 166, 218, 20, 12, '#625642', '#332E25');
    drawTree(landDawnRim, 282, 217, 22, 13, '#5C513E', '#332E25');
    drawTree(landDawnRim, 336, 223, 20, 12, '#554B3A', '#332E25');
    drawTree(landDawnRim, 396, 222, 26, 15, '#524939', '#332E25');
    // Sunlit cozy village homes + country church (warm white walls, charcoal roofs, golden highlights)
    drawHouse(landDawnRim, 112, 214, 30, 18, 12, { wallFill: '#F2EBDC', roofFill: '#443E34', stroke: '#2A261F' });
    drawHouse(landDawnRim, 184, 204, 26, 22, 14, { wallFill: '#F7F1E3', roofFill: '#4A4338', stroke: '#2A261F' });
    svgEl('path', {
      d: 'M 197 183 L 197 190 M 194.5 185.5 L 199.5 185.5',
      stroke: '#FFF6D0',
      'stroke-width': '1.6',
      'stroke-linecap': 'round'
    }, landDawnRim);
    drawHouse(landDawnRim, 296, 211, 28, 18, 11, { wallFill: '#EDE6D6', roofFill: '#423C32', stroke: '#2A261F' });
    drawHouse(landDawnRim, 348, 218, 30, 17, 11, { wallFill: '#E9E1D0', roofFill: '#3F3A30', stroke: '#2A261F' });
    // Sunlit golden roofline glints facing the morning sun
    svgEl('path', {
      d: 'M 109 214 L 127 202 L 145 214 M 181 204 L 197 190 L 213 204 M 293 211 L 310 200 L 327 211 M 345 218 L 363 207 L 381 218',
      fill: 'none',
      stroke: '#FFF5CC',
      'stroke-width': '1.4',
      'stroke-linecap': 'round',
      'stroke-linejoin': 'round',
      opacity: '0.9'
    }, landDawnRim);
    // Warm glowing windows in the morning village
    windowCoords.forEach(function (w) {
      svgEl('rect', {
        x: w[0],
        y: w[1],
        width: w[2],
        height: w[3],
        rx: 1,
        fill: '#FAD975',
        stroke: '#5E533E',
        'stroke-width': '0.6'
      }, landDawnRim);
    });

    return {
      svgTitle: svgTitle,
      svgDesc: svgDesc,
      starsLayer: starsLayer,
      horizonGlowLayer: horizonGlowLayer,
      farRidgeRimStep1: farRidgeRimStep1,
      skyBridgeLayer: skyBridgeLayer,
      moonLitLayer: moonLitLayer,
      moonlightPoolLayer: moonlightPoolLayer,
      landMoonlit: landMoonlit,
      dawnHorizonLayer: dawnHorizonLayer,
      sunEdgeGroup: sunEdgeGroup,
      landDawnRim: landDawnRim
    };
  }

  function init() {
    var host = document.getElementById('scene-root');
    if (!host) return;

    var bar = el('div', { class: 'title-bar' }, host);
    el('h1', { text: 'Reflect His Glory' }, bar);
    el('span', { class: 'course-tag', text: '202-06' }, bar);

    var bundle = buildStage(host);

    var strip = el('div', { class: 'step-strip', role: 'group', 'aria-label': 'Reflect His Glory steps' }, host);
    var dotButtons = STEPS.map(function (st, idx) {
      var btn = el('button', {
        type: 'button',
        class: 'step-dot',
        'data-step': String(idx),
        'aria-label': st.dotLabel,
        'aria-pressed': 'false'
      }, strip);
      btn.style.setProperty('--dot-color', st.color);
      el('span', { class: 'step-dot-fill' }, btn);
      return btn;
    });

    var cardArea = el('div', { class: 'card-area' }, host);
    var cardBox = el('div', { class: 'verse-card' }, cardArea);
    el('div', { class: 'verse-card-bar' }, cardBox);
    var contentEl = el('div', {
      id: 'card-content',
      class: 'verse-card-content',
      'aria-live': 'polite'
    }, cardBox);
    var headingEl = el('h2', { class: 'card-heading' }, contentEl);
    var quoteWrap = el('p', { class: 'card-quote' }, contentEl);
    var quoteTextEl = el('span', {}, quoteWrap);
    var refEl = el('span', { class: 'card-ref' }, quoteWrap);
    var noteEl = el('p', { class: 'card-note' }, contentEl);

    var navBar = el('div', { class: 'nav-bar' }, cardArea);
    var prevBtn = el('button', { id: 'prev-btn', type: 'button', class: 'nav-btn', text: '\u2190 Back' }, navBar);
    var countEl = el('span', { class: 'step-count', text: 'Ready' }, navBar);
    var nextBtn = el('button', { id: 'next-btn', type: 'button', class: 'nav-btn primary', text: 'Begin \u2192' }, navBar);

    var currentStep = 0;
    var activeRaf = null;
    var reducedMotionQuery = window.matchMedia
      ? window.matchMedia('(prefers-reduced-motion: reduce)')
      : { matches: false };

    function stopAnim() {
      if (activeRaf !== null) {
        cancelAnimationFrame(activeRaf);
        activeRaf = null;
      }
    }

    function applyStaticLayers(stepIdx) {
      // Night stars soften as morning light fills the sky on Slide 4
      bundle.starsLayer.classList.toggle('is-faded', stepIdx >= 3);
      // Slide 0 (1 of 4): Light reaches over the hills toward a dim moon
      bundle.horizonGlowLayer.classList.toggle('is-visible', true);
      bundle.farRidgeRimStep1.classList.toggle('is-visible', stepIdx < 3);
      bundle.skyBridgeLayer.classList.toggle('is-visible', true);
      // Slide 1 (2 of 4): Moon brightens as it receives the light
      bundle.moonLitLayer.classList.toggle('is-visible', stepIdx >= 1);
      // Slide 2 (3 of 4): Moonlight reveals road, rooftops, and warm home windows
      bundle.moonlightPoolLayer.classList.toggle('is-visible', stepIdx >= 2);
      bundle.landMoonlit.classList.toggle('is-visible', stepIdx >= 2);
      // Slide 3 (4 of 4): Full sun rises onto the horizon and brings the whole scene to light
      bundle.dawnHorizonLayer.classList.toggle('is-visible', stepIdx >= 3);
      bundle.landDawnRim.classList.toggle('is-visible', stepIdx >= 3);
    }

    function snapFinalMotion(stepIdx) {
      bundle.sunEdgeGroup.setAttribute('transform', stepIdx >= 3 ? 'translate(0, 0)' : 'translate(0, 36)');
    }

    function animateStep(stepIdx) {
      if (stepIdx < 3) {
        host.setAttribute('data-step-dur', '0');
        snapFinalMotion(stepIdx);
        return;
      }

      // Slide 4: Gently lift the full sun over the distant ridge to rest at the horizon
      var t0 = performance.now();
      var dur = 760;
      host.setAttribute('data-step-dur', String(dur));
      bundle.sunEdgeGroup.setAttribute('transform', 'translate(0, 36)');
      var frame = function (now) {
        var p = Math.min(1, (now - t0) / dur);
        var eased = 1 - Math.pow(1 - p, 2);
        var dy = (36 * (1 - eased)).toFixed(2);
        bundle.sunEdgeGroup.setAttribute('transform', 'translate(0, ' + dy + ')');
        if (p < 1) {
          activeRaf = requestAnimationFrame(frame);
        } else {
          snapFinalMotion(3);
          activeRaf = null;
        }
      };
      activeRaf = requestAnimationFrame(frame);
    }

    function goTo(nextIdx) {
      stopAnim();
      var prevIdx = currentStep;
      var goingForwardOne = nextIdx === prevIdx + 1;
      var instant = reducedMotionQuery.matches || !goingForwardOne || nextIdx === 0;

      host.classList.toggle('is-instant', instant);
      applyStaticLayers(nextIdx);

      if (instant) {
        host.setAttribute('data-step-dur', '0');
        snapFinalMotion(nextIdx);
      } else {
        animateStep(nextIdx);
      }

      currentStep = nextIdx;
      var step = STEPS[currentStep];
      host.setAttribute('data-step', String(currentStep));
      host.style.setProperty('--step-color', step.color);
      host.style.setProperty('--step-dark', step.dark);
      bundle.svgDesc.textContent = step.desc;

      headingEl.textContent = step.heading;
      quoteTextEl.textContent = step.verse;
      refEl.textContent = '(' + step.ref + ')';
      noteEl.textContent = step.line;

      dotButtons.forEach(function (btn, idx) {
        btn.classList.toggle('active', idx === currentStep);
        btn.classList.toggle('passed', idx < currentStep);
        btn.setAttribute('aria-pressed', idx === currentStep ? 'true' : 'false');
      });

      countEl.textContent = 'Step ' + (currentStep + 1) + ' of ' + STEPS.length;
      prevBtn.disabled = currentStep === 0;
      if (currentStep === STEPS.length - 1) {
        nextBtn.textContent = '\u21BB Start Over';
      } else {
        nextBtn.textContent = 'Next \u2192';
      }
    }

    dotButtons.forEach(function (btn, idx) {
      btn.addEventListener('click', function () {
        goTo(idx);
      });
    });

    prevBtn.addEventListener('click', function () {
      if (currentStep > 0) goTo(currentStep - 1);
    });
    nextBtn.addEventListener('click', function () {
      goTo(currentStep === STEPS.length - 1 ? 0 : currentStep + 1);
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowRight' && currentStep < STEPS.length - 1) {
        goTo(currentStep + 1);
      } else if (event.key === 'ArrowLeft' && currentStep > 0) {
        goTo(currentStep - 1);
      }
    });

    var lastWidth = window.innerWidth;
    var measuredWidth = 0;
    function fitCardHeight() {
      if (!contentEl || contentEl.clientWidth === measuredWidth) return;
      measuredWidth = contentEl.clientWidth;
      var keepH = headingEl.textContent;
      var keepQ = quoteTextEl.textContent;
      var keepR = refEl.textContent;
      var keepN = noteEl.textContent;
      var tallest = 0;
      document.documentElement.style.setProperty('--card-h', '0px');
      STEPS.forEach(function (st) {
        headingEl.textContent = st.heading;
        quoteTextEl.textContent = st.verse;
        refEl.textContent = '(' + st.ref + ')';
        noteEl.textContent = st.line;
        tallest = Math.max(tallest, contentEl.offsetHeight);
      });
      headingEl.textContent = keepH;
      quoteTextEl.textContent = keepQ;
      refEl.textContent = keepR;
      noteEl.textContent = keepN;
      document.documentElement.style.setProperty('--card-h', Math.max(100, tallest) + 'px');
    }

    var resizeTimer = null;
    window.addEventListener('resize', function () {
      if (window.innerWidth === lastWidth) return;
      lastWidth = window.innerWidth;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(fitCardHeight, 120);
    });

    goTo(0);
    fitCardHeight();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
