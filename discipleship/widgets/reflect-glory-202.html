<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflect His Glory</title>
<style>
:root {
  --ink: #2C2416;
  --muted: #6E6559;
  --tray: #F6F4EE;
  --border: #EBE5D9;
  --night: #233852;
  --night-dark: #19293D;
  --gold: #A8760A;
  --gold-btn: #8E6206;
  --gold-dark: #7D5604;
  --gold-wash: #FCF2D6;
  --blue: #2A5B7C;
  --blue-dark: #1E435C;
  --green: #1F684A;
  --green-dark: #164E37;
  --crimson: #8B1A2B;
  --crimson-dark: #6D1422;
  --step-color: #233852;
  --step-dark: #19293D;
  --card-h: 132px;
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  padding: 0;
  margin: 0;
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.widget-outer {
  background: #FFFFFF;
  border-radius: 0;
  overflow: hidden;
  max-width: 100%;
  width: 100%;
  margin: 0;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
    border: 1px solid #EBE5D9;
    max-width: 460px;
    margin: 0 auto;
  }
}

.title-bar {
  background: #2C2416;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  margin: 0;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  background: #132236;
  padding: 0;
  border-bottom: 1px solid var(--border);
}

.scene-svg {
  display: block;
  width: 100%;
  height: auto;
}

.reveal-layer {
  opacity: 0;
}

.reveal-layer.is-visible {
  opacity: 1;
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  padding: 5px 12px 4px;
  background: var(--tray);
  border-bottom: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  min-width: 28px;
  min-height: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
}

.step-dot-fill {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2.5px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 22%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.12);
}

.card-area {
  background: var(--tray);
  padding: 6px 12px 9px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #EBE5D9;
  box-shadow: 0 2px 10px rgba(44, 36, 22, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 13px;
  min-height: var(--card-h, 132px);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 4px;
}

.card-heading {
  font: 700 15px/1.2 system-ui, -apple-system, sans-serif;
  color: var(--step-dark);
  margin: 0;
}

.card-quote {
  font: 12.8px/1.34 Georgia, Cambria, serif;
  color: #2C2416;
  margin: 0;
}

.card-ref {
  font: 600 11.5px/1.2 system-ui, -apple-system, sans-serif;
  color: var(--muted);
  margin-left: 4px;
  white-space: nowrap;
}

.card-note {
  font: 12.2px/1.34 system-ui, -apple-system, sans-serif;
  color: #4A4238;
  margin: 0;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: var(--ink);
  font: 700 13.5px/1 system-ui, -apple-system, sans-serif;
  cursor: pointer;
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FFFFFF;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.step-count {
  font: 600 12px system-ui, -apple-system, sans-serif;
  color: var(--muted);
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (prefers-reduced-motion: no-preference) {
  .widget-outer:not(.is-instant) .reveal-layer {
    transition: opacity 0.65s ease;
  }
  .widget-outer .step-dot-fill {
    transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
  }
  .widget-outer .nav-btn.primary,
  .widget-outer .verse-card-bar,
  .widget-outer .card-heading {
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease;
  }
}

@media (max-width: 395px) {
  .card-area {
    padding: 6px 10px 8px;
  }
  .verse-card-content {
    padding: 8px 11px;
  }
  .card-heading {
    font-size: 14.5px;
  }
  .card-quote {
    font-size: 12.4px;
  }
  .card-note {
    font-size: 11.8px;
  }
}

@media (forced-colors: active) {
  .step-dot-fill {
    border-color: ButtonText;
    background: Canvas;
  }
  .step-dot.active .step-dot-fill {
    background: Highlight;
    border-color: Highlight;
  }
  .nav-btn.primary {
    border: 2px solid Highlight;
  }
}
</style>
</head>
<body>
<main class="widget-outer" id="scene-root" aria-label="Reflect His Glory"></main>

<script>
(function () {
  'use strict';

  var SVG_NS = 'http://www.w3.org/2000/svg';

  var COLORS = {
    night: '#233852',
    nightDark: '#19293D',
    gold: '#A8760A',
    goldBtn: '#8E6206',
    goldDark: '#7D5604',
    goldWash: '#FCF2D6',
    blue: '#2A5B7C',
    blueDark: '#1E435C',
    green: '#1F684A',
    greenDark: '#164E37',
    crimson: '#8B1A2B',
    crimsonDark: '#6D1422'
  };

  var STEPS = [
    {
      id: 'night',
      dotLabel: 'Start: Reflect His Glory',
      color: COLORS.night,
      dark: COLORS.nightDark,
      heading: 'Reflect His Glory',
      verse: '"The heavens declare the glory of God, and the sky above proclaims his handiwork."',
      ref: 'Psalm 19:1',
      line: 'A quiet village rests under the night sky. You were made to carry light that does not begin with you.',
      desc: 'A quiet village at night with rolling dark hills, a dark winding road, unlit homes, a village church, stars, and a quiet unlit moon high in the sky.'
    },
    {
      id: 'source',
      dotLabel: 'Step 1: God Is the Source',
      color: COLORS.goldBtn,
      dark: COLORS.goldDark,
      heading: 'God Is the Source',
      verse: '"For with you is the fountain of life; in your light do we see light."',
      ref: 'Psalm 36:9',
      line: 'Before we see Him face to face, His glory already shines beyond the hills. All true light begins in God.',
      desc: 'A soft golden glow grows behind the distant left hills while the sun remains hidden below the horizon and the night sky stays dark.'
    },
    {
      id: 'beholding',
      dotLabel: 'Step 2: Beholding and Being Changed',
      color: COLORS.blue,
      dark: COLORS.blueDark,
      heading: 'Beholding and Being Changed',
      verse: '"And we all, with unveiled face, beholding the glory of the Lord, are being transformed into the same image from one degree of glory to another. For this comes from the Lord who is the Spirit."',
      ref: '2 Corinthians 3:18',
      line: 'As you behold Jesus, His Spirit steadily brightens your life with a glory you could never make on your own.',
      desc: 'Soft light from beyond the distant hills reaches across the night sky and brightens the moon into a warm luminous ivory-gold orb.'
    },
    {
      id: 'ordinary-life',
      dotLabel: 'Step 3: Shining in Everyday Life',
      color: COLORS.green,
      dark: COLORS.greenDark,
      heading: 'Shining in Everyday Life',
      verse: '"In the same way, let your light shine before others, so that they may see your good works and give glory to your Father who is in heaven."',
      ref: 'Matthew 5:16',
      line: 'Reflected light reaches ordinary roads, rooftops, and homes in the night, pointing hearts back to your Father.',
      desc: 'Soft moonlight gently reveals the winding village road, catches the rooftops and church steeple, and warms the glowing windows of the homes below.'
    },
    {
      id: 'dawn-hope',
      dotLabel: 'Step 4: Until Day Breaks',
      color: COLORS.crimson,
      dark: COLORS.crimsonDark,
      heading: 'Until Day Breaks',
      verse: '"For the earth will be filled with the knowledge of the glory of the LORD as the waters cover the sea."',
      ref: 'Habakkuk 2:14',
      line: 'We carry His reflected light through the night, living in hope as the first edge of dawn promises Christ\'s return.',
      desc: 'Just the radiant upper edge of the sun appears behind the distant hills, brightening the low horizon with the coming dawn while the moon continues to shine over the dark night sky and lit village.'
    }
  ];

  // One fixed poetic nocturne composition on 440 x 260 canvas
  var GEO = {
    W: 440,
    H: 260,
    horizonSunX: 88,
    horizonSunY: 183, // Hidden below y=172 ridge; only the top ~10px crown peeks above on Step 4
    horizonSunR: 21,
    moonX: 294,
    moonY: 66,
    moonR: 24
  };

  function el(tag, attrs, parent) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'text') node.textContent = attrs[k];
        else if (k === 'class') node.className = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    if (parent) parent.appendChild(node);
    return node;
  }

  function svgEl(tag, attrs, parent) {
    var node = document.createElementNS(SVG_NS, tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'text') node.textContent = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    if (parent) parent.appendChild(node);
    return node;
  }

  function addLinearGrad(defs, id, x1, y1, x2, y2, stops) {
    var grad = svgEl('linearGradient', { id: id, x1: x1, y1: y1, x2: x2, y2: y2 }, defs);
    stops.forEach(function (s) {
      var attrs = { offset: s[0], 'stop-color': s[1] };
      if (s[2] !== undefined) attrs['stop-opacity'] = String(s[2]);
      svgEl('stop', attrs, grad);
    });
    return grad;
  }

  function addRadialGrad(defs, id, cx, cy, r, stops) {
    var grad = svgEl('radialGradient', { id: id, cx: cx, cy: cy, r: r }, defs);
    stops.forEach(function (s) {
      var attrs = { offset: s[0], 'stop-color': s[1] };
      if (s[2] !== undefined) attrs['stop-opacity'] = String(s[2]);
      svgEl('stop', attrs, grad);
    });
    return grad;
  }

  function drawHouse(parent, x, y, w, h, roofH, opts) {
    var g = svgEl('g', {}, parent);
    var wallFill = (opts && opts.wallFill) || '#1A2B3F';
    var roofFill = (opts && opts.roofFill) || '#132030';
    var stroke = (opts && opts.stroke) || '#0C1624';
    svgEl('rect', {
      x: x,
      y: y,
      width: w,
      height: h,
      fill: wallFill,
      stroke: stroke,
      'stroke-width': '1.2',
      'stroke-linejoin': 'round'
    }, g);
    svgEl('polygon', {
      points: (x - 3) + ',' + y + ' ' + (x + w / 2) + ',' + (y - roofH) + ' ' + (x + w + 3) + ',' + y,
      fill: roofFill,
      stroke: stroke,
      'stroke-width': '1.2',
      'stroke-linejoin': 'round'
    }, g);
    return g;
  }

  function drawTree(parent, cx, baseY, h, w, fill, stroke) {
    var g = svgEl('g', {}, parent);
    svgEl('line', {
      x1: cx,
      y1: baseY,
      x2: cx,
      y2: baseY - h * 0.35,
      stroke: stroke,
      'stroke-width': '1.4',
      'stroke-linecap': 'round'
    }, g);
    svgEl('ellipse', {
      cx: cx,
      cy: baseY - h * 0.62,
      rx: w * 0.5,
      ry: h * 0.42,
      fill: fill,
      stroke: stroke,
      'stroke-width': '1.1'
    }, g);
    return g;
  }

  function buildStage(parent) {
    var stage = el('div', { class: 'stage' }, parent);
    var svg = svgEl('svg', {
      class: 'scene-svg',
      viewBox: '0 0 440 260',
      width: '100%',
      role: 'img',
      'aria-labelledby': 'glory-svg-title glory-svg-desc'
    }, stage);

    var svgTitle = svgEl('title', { id: 'glory-svg-title', text: 'Reflect His Glory' }, svg);
    var svgDesc = svgEl('desc', { id: 'glory-svg-desc', text: STEPS[0].desc }, svg);

    var defs = svgEl('defs', {}, svg);

    // Deep, serene night sky (stays mostly dark even at Step 4 so the moon's role remains clear)
    addLinearGrad(defs, 'sky-night', '0%', '0%', '0%', '100%', [
      ['0%', '#0F1C2E'],
      ['56%', '#192C44'],
      ['100%', '#243C58']
    ]);

    // Step 1: Soft golden glow behind the distant left hills (sun still hidden)
    addRadialGrad(defs, 'hidden-horizon-glow', '50%', '52%', '50%', [
      ['0%', '#FBE094', 0.72],
      ['38%', '#E8B364', 0.34],
      ['72%', '#9B7558', 0.1],
      ['100%', '#192C44', 0]
    ]);

    // Step 2: Subtle atmospheric veil of golden skylight reaching diagonally from hidden horizon up toward the moon
    addRadialGrad(defs, 'sky-bridge-glow', '50%', '50%', '50%', [
      ['0%', '#FCE8B2', 0.14],
      ['55%', '#F4CF82', 0.06],
      ['100%', '#192C44', 0]
    ]);

    // Step 2: Moon illuminated brightly from its lower-left limb (facing the hidden sun beyond the hills!)
    addLinearGrad(defs, 'moon-lit-grad', '14%', '82%', '88%', '18%', [
      ['0%', '#FFFDF5'],
      ['46%', '#FCEEC6'],
      ['82%', '#E9CB87'],
      ['100%', '#D3B06B']
    ]);
    addRadialGrad(defs, 'moon-aura-grad', '50%', '50%', '50%', [
      ['0%', '#FFF7DC', 0.44],
      ['48%', '#FCE6A4', 0.18],
      ['78%', '#C5B07F', 0.05],
      ['100%', '#192C44', 0]
    ]);

    // Step 3: Soft, wide, feathered moonlight pool bathing the night village (centered at 50%/50% so gradient fades smoothly to 0 before any edge)
    addRadialGrad(defs, 'moonlight-pool-grad', '50%', '50%', '50%', [
      ['0%', '#FFF8E2', 0.2],
      ['42%', '#FCEBC0', 0.1],
      ['76%', '#B8C4D4', 0.03],
      ['100%', '#192C44', 0]
    ]);
    addLinearGrad(defs, 'road-moon-grad', '50%', '0%', '50%', '100%', [
      ['0%', '#E9DCBC', 0.72],
      ['55%', '#F7E7BD', 0.62],
      ['100%', '#DFCFA8', 0.45]
    ]);
    addRadialGrad(defs, 'window-warm-halo', '50%', '50%', '50%', [
      ['0%', '#FDE394', 0.55],
      ['55%', '#F2BA59', 0.18],
      ['100%', '#1A2B3F', 0]
    ]);

    // Step 4: Restrained dawn brightening ONLY along the low horizon (keeps upper sky dark!)
    addRadialGrad(defs, 'dawn-edge-glow', '50%', '55%', '50%', [
      ['0%', '#FFF7DB', 0.94],
      ['32%', '#FAD782', 0.62],
      ['64%', '#DE9B6B', 0.22],
      ['100%', '#192C44', 0]
    ]);
    addLinearGrad(defs, 'dawn-horizon-band', '50%', '100%', '50%', '0%', [
      ['0%', '#FBE096', 0.56],
      ['42%', '#E3A472', 0.24],
      ['100%', '#192C44', 0]
    ]);
    addRadialGrad(defs, 'rising-sun-disc', '50%', '35%', '60%', [
      ['0%', '#FFFDF2'],
      ['55%', '#FCE298'],
      ['100%', '#E4AF3E']
    ]);

    // 1) Fixed Deep Night Sky
    svgEl('rect', { x: 0, y: 0, width: 440, height: 260, fill: 'url(#sky-night)' }, svg);

    // 2) Quiet Starfield (stays visible even at Step 4 because the upper sky stays dark!)
    var starsLayer = svgEl('g', { id: 'layer-stars' }, svg);
    var starCoords = [
      [36, 34, 1.1], [74, 24, 1.3], [116, 48, 1.0], [154, 28, 1.4],
      [196, 44, 1.1], [232, 24, 1.2], [354, 30, 1.4], [392, 46, 1.1],
      [414, 28, 1.3], [364, 78, 1.0], [404, 92, 1.1], [134, 92, 1.0],
      [212, 98, 0.95], [338, 108, 1.0]
    ];
    starCoords.forEach(function (st) {
      svgEl('circle', { cx: st[0], cy: st[1], r: st[2], fill: '#FAF4E2', opacity: '0.66' }, starsLayer);
    });
    // Two delicate 4-point star glints
    svgEl('path', {
      d: 'M 154 22 L 154 34 M 148 28 L 160 28',
      stroke: '#FAF4E2',
      'stroke-width': '0.95',
      'stroke-linecap': 'round',
      opacity: '0.48'
    }, starsLayer);
    svgEl('path', {
      d: 'M 354 24 L 354 36 M 348 30 L 360 30',
      stroke: '#FAF4E2',
      'stroke-width': '0.95',
      'stroke-linecap': 'round',
      opacity: '0.48'
    }, starsLayer);

    // 3) Step 1: Soft Golden Glow growing behind the distant left hills (sun STILL hidden!)
    var horizonGlowLayer = svgEl('g', { id: 'layer-horizon-glow', class: 'reveal-layer' }, svg);
    svgEl('ellipse', {
      cx: GEO.horizonSunX,
      cy: 176,
      rx: 126,
      ry: 62,
      fill: 'url(#hidden-horizon-glow)'
    }, horizonGlowLayer);

    // 4) Step 2: Feathered atmospheric skylight hint bridging hidden horizon toward the moon (no lines, no arrows)
    var skyBridgeLayer = svgEl('g', { id: 'layer-sky-bridge', class: 'reveal-layer' }, svg);
    svgEl('ellipse', {
      cx: 186,
      cy: 122,
      rx: 155,
      ry: 58,
      transform: 'rotate(-27 186 122)',
      fill: 'url(#sky-bridge-glow)'
    }, skyBridgeLayer);

    // 5) Step 4: Low Dawn Horizon Glow + JUST the upper edge of the rising sun peeking behind the distant hill!
    var dawnHorizonLayer = svgEl('g', { id: 'layer-dawn-horizon', class: 'reveal-layer' }, svg);
    // Restrained low horizon warmth (keeps upper sky dark indigo!)
    svgEl('rect', {
      x: 0,
      y: 112,
      width: 440,
      height: 82,
      fill: 'url(#dawn-horizon-band)'
    }, dawnHorizonLayer);
    svgEl('ellipse', {
      cx: GEO.horizonSunX,
      cy: 174,
      rx: 156,
      ry: 66,
      fill: 'url(#dawn-edge-glow)'
    }, dawnHorizonLayer);
    // Rising Sun upper edge (placed BEHIND the distant hills so ONLY its top ~10px crown peeks over!)
    var sunEdgeGroup = svgEl('g', { id: 'rising-sun-edge', transform: 'translate(0, 10)' }, dawnHorizonLayer);
    svgEl('circle', {
      cx: GEO.horizonSunX,
      cy: GEO.horizonSunY,
      r: GEO.horizonSunR,
      fill: 'url(#rising-sun-disc)',
      stroke: '#E4AF3E',
      'stroke-width': '1.4'
    }, sunEdgeGroup);

    // 6) Step 3: Soft Feathered Moonlight Pool descending gently onto the village below (zero hard edges/triangles)
    var moonlightPoolLayer = svgEl('g', { id: 'layer-moonlight-pool', class: 'reveal-layer' }, svg);
    svgEl('ellipse', {
      cx: 266,
      cy: 174,
      rx: 196,
      ry: 112,
      fill: 'url(#moonlight-pool-grad)'
    }, moonlightPoolLayer);

    // 7) THE MOON (Fixed high-right at 294, 66: quiet silhouette on Steps 0-1, luminous golden-ivory on Steps 2-4)
    var moonBaseLayer = svgEl('g', { id: 'layer-moon-base' }, svg);
    svgEl('circle', {
      cx: GEO.moonX,
      cy: GEO.moonY,
      r: GEO.moonR,
      fill: '#1A2D44',
      stroke: '#5B7898',
      'stroke-width': '1.4'
    }, moonBaseLayer);

    var moonLitLayer = svgEl('g', { id: 'layer-moon-lit', class: 'reveal-layer' }, svg);
    svgEl('circle', {
      cx: GEO.moonX,
      cy: GEO.moonY,
      r: GEO.moonR + 24,
      fill: 'url(#moon-aura-grad)'
    }, moonLitLayer);
    svgEl('circle', {
      cx: GEO.moonX,
      cy: GEO.moonY,
      r: GEO.moonR + 4.5,
      fill: 'none',
      stroke: '#FCE6A4',
      'stroke-width': '1',
      opacity: '0.42'
    }, moonLitLayer);
    svgEl('circle', {
      cx: GEO.moonX,
      cy: GEO.moonY,
      r: GEO.moonR,
      fill: 'url(#moon-lit-grad)',
      stroke: '#D9A73B',
      'stroke-width': '1.6'
    }, moonLitLayer);
    // Soft bright crescent highlight hugging the lower-left limb facing the hidden sun beyond the hills
    svgEl('path', {
      d: 'M ' + (GEO.moonX - 18) + ' ' + (GEO.moonY - 8) + ' A 20 20 0 0 0 ' + (GEO.moonX + 8) + ' ' + (GEO.moonY + 18),
      fill: 'none',
      stroke: '#FFFFFF',
      'stroke-width': '1.5',
      'stroke-linecap': 'round',
      opacity: '0.68'
    }, moonLitLayer);
    // Delicate painterly lunar texture washes
    svgEl('circle', { cx: GEO.moonX + 6, cy: GEO.moonY - 6, r: 5.2, fill: '#DFB96E', opacity: '0.2' }, moonLitLayer);
    svgEl('circle', { cx: GEO.moonX - 3, cy: GEO.moonY + 7, r: 3.8, fill: '#DFB96E', opacity: '0.16' }, moonLitLayer);

    // 8) FIXED QUIET NIGHTTIME VILLAGE LANDSCAPE (Drawn IN FRONT of the horizon glow & rising sun!)
    var landBase = svgEl('g', { id: 'layer-landscape-base' }, svg);

    // Far horizon hills (saddle at x=88 is y=172, hiding the sun until Step 4's top crown peeks above!)
    svgEl('path', {
      d: 'M 0 183 Q 44 176 88 172 Q 134 168 184 179 Q 256 192 336 175 Q 388 166 440 176 L 440 260 L 0 260 Z',
      fill: '#1D3046',
      stroke: '#122032',
      'stroke-width': '1.2'
    }, landBase);

    // Mid-ground left & right valley slopes
    svgEl('path', {
      d: 'M 0 198 Q 92 186 184 203 Q 222 210 250 206 L 250 260 L 0 260 Z',
      fill: '#18283B',
      stroke: '#101C2B',
      'stroke-width': '1.2'
    }, landBase);
    svgEl('path', {
      d: 'M 222 210 Q 306 191 380 201 Q 414 206 440 198 L 440 260 L 222 260 Z',
      fill: '#162536',
      stroke: '#101C2B',
      'stroke-width': '1.2'
    }, landBase);

    // Foreground village meadow
    svgEl('path', {
      d: 'M 0 227 Q 118 216 230 225 Q 334 234 440 220 L 440 260 L 0 260 Z',
      fill: '#132030',
      stroke: '#0C1522',
      'stroke-width': '1.2'
    }, landBase);

    // Winding quiet village road curving gently from the valley pass down to the foreground
    svgEl('path', {
      d: 'M 248 205 C 234 215 224 224 239 234 C 256 244 261 252 249 260 L 269 260 C 279 250 273 240 254 232 C 238 225 246 215 258 205 Z',
      fill: '#1D2F43',
      stroke: '#111D2C',
      'stroke-width': '1'
    }, landBase);

    // Quiet countryside trees
    drawTree(landBase, 46, 224, 24, 14, '#162738', '#0D1825');
    drawTree(landBase, 78, 218, 28, 16, '#162738', '#0D1825');
    drawTree(landBase, 166, 218, 20, 12, '#182A3D', '#0D1825');
    drawTree(landBase, 282, 217, 22, 13, '#182A3D', '#0D1825');
    drawTree(landBase, 336, 223, 20, 12, '#162738', '#0D1825');
    drawTree(landBase, 396, 222, 26, 15, '#162738', '#0D1825');

    // Ordinary village homes + small country church
    drawHouse(landBase, 112, 214, 30, 18, 12, { wallFill: '#1C2E42', roofFill: '#132132' });
    drawHouse(landBase, 184, 204, 26, 22, 14, { wallFill: '#1F3349', roofFill: '#142334' });
    // Simple church roof cross
    svgEl('path', {
      d: 'M 197 183 L 197 190 M 194.5 185.5 L 199.5 185.5',
      stroke: '#7E97B3',
      'stroke-width': '1.2',
      'stroke-linecap': 'round'
    }, landBase);
    drawHouse(landBase, 296, 211, 28, 18, 11, { wallFill: '#1D2F44', roofFill: '#132132' });
    drawHouse(landBase, 348, 218, 30, 17, 11, { wallFill: '#1B2D40', roofFill: '#122030' });

    // Unlit quiet windows (base night state)
    var windowCoords = [
      [119, 220, 5, 6], [130, 220, 5, 6],
      [192, 211, 4, 7], [199, 211, 4, 7],
      [303, 217, 5, 6], [313, 217, 5, 6],
      [355, 223, 5, 5], [366, 223, 5, 5]
    ];
    windowCoords.forEach(function (w) {
      svgEl('rect', { x: w[0], y: w[1], width: w[2], height: w[3], rx: 1, fill: '#263B52' }, landBase);
    });

    // Subtle warm ridge rim on Step 1 & 2 where the hidden glow touches the distant left hill
    var farRidgeRimStep1 = svgEl('g', { id: 'layer-far-rim-step1', class: 'reveal-layer' }, svg);
    svgEl('path', {
      d: 'M 18 180 Q 54 174 88 172 Q 124 169 162 175',
      fill: 'none',
      stroke: '#F9DC8E',
      'stroke-width': '1.4',
      'stroke-linecap': 'round',
      opacity: '0.68'
    }, farRidgeRimStep1);

    // 9) Step 3: Moonlight gently reveals the winding road, rooftops, and warm glowing home windows!
    var landMoonlit = svgEl('g', { id: 'layer-landscape-moonlit', class: 'reveal-layer' }, svg);

    // Gentle moonlit road winding through the quiet valley
    svgEl('path', {
      d: 'M 249 206 C 236 215 226 224 241 234 C 256 244 261 252 250 260 L 266 260 C 276 250 270 240 252 232 C 238 225 247 215 257 206 Z',
      fill: 'url(#road-moon-grad)',
      opacity: '0.78'
    }, landMoonlit);
    // Soft moonlit highlights on open hillside crests (clear of roofs)
    svgEl('path', {
      d: 'M 218 206 Q 234 208 248 206 M 260 204 Q 276 199 292 197 M 332 197 Q 358 198 384 201',
      fill: 'none',
      stroke: '#FBE8B0',
      'stroke-width': '1.25',
      'stroke-linecap': 'round',
      opacity: '0.58'
    }, landMoonlit);
    // Moonlit rooftops catching gentle silver-gold light (brightest on moon-facing slopes)
    svgEl('path', {
      d: 'M 109 214 L 127 202 L 145 214 M 181 204 L 197 190 L 213 204 M 293 211 L 310 200 L 327 211 M 345 218 L 363 207 L 381 218',
      fill: 'none',
      stroke: '#FCE8B2',
      'stroke-width': '1.45',
      'stroke-linecap': 'round',
      'stroke-linejoin': 'round',
      opacity: '0.86'
    }, landMoonlit);
    // Church cross catches soft moonlight
    svgEl('path', {
      d: 'M 197 183 L 197 190 M 194.5 185.5 L 199.5 185.5',
      stroke: '#FCE8B2',
      'stroke-width': '1.4',
      'stroke-linecap': 'round'
    }, landMoonlit);
    // Warm golden house windows + subtle cozy glow halos giving the village warmth and life
    windowCoords.forEach(function (w) {
      svgEl('circle', {
        cx: w[0] + w[2] / 2,
        cy: w[1] + w[3] / 2,
        r: 7.5,
        fill: 'url(#window-warm-halo)'
      }, landMoonlit);
      svgEl('rect', {
        x: w[0],
        y: w[1],
        width: w[2],
        height: w[3],
        rx: 1,
        fill: '#FDE69E'
      }, landMoonlit);
    });

    // 10) Step 4: Golden Dawn Rim along the distant ridge + Crisp Studio Wash Double-Hairline Frame
    var landDawnRim = svgEl('g', { id: 'layer-landscape-dawn', class: 'reveal-layer' }, svg);
    svgEl('path', {
      d: 'M 14 181 Q 50 175 88 172 Q 134 168 184 179 Q 256 192 336 175 Q 388 166 426 175',
      fill: 'none',
      stroke: '#FFF4CE',
      'stroke-width': '1.9',
      'stroke-linecap': 'round',
      opacity: '0.9'
    }, landDawnRim);

    // Step 4 crisp Studio Wash double-hairline climax border (zero fuzzy glow)
    var frameLayer = svgEl('g', { id: 'layer-climax-frame', class: 'reveal-layer' }, svg);
    var outerFrame = svgEl('rect', {
      x: 8,
      y: 8,
      width: 424,
      height: 244,
      rx: 10,
      fill: 'none',
      stroke: '#D9A73B',
      'stroke-width': '2.6'
    }, frameLayer);
    var innerFrame = svgEl('rect', {
      x: 13,
      y: 13,
      width: 414,
      height: 234,
      rx: 7,
      fill: 'none',
      stroke: '#FFF4CE',
      'stroke-width': '1',
      opacity: '0.5'
    }, frameLayer);
    var framePerim = 2 * (424 + 244);
    outerFrame.style.strokeDasharray = String(framePerim);
    outerFrame.style.strokeDashoffset = String(framePerim);

    return {
      svgTitle: svgTitle,
      svgDesc: svgDesc,
      horizonGlowLayer: horizonGlowLayer,
      farRidgeRimStep1: farRidgeRimStep1,
      skyBridgeLayer: skyBridgeLayer,
      moonLitLayer: moonLitLayer,
      moonlightPoolLayer: moonlightPoolLayer,
      landMoonlit: landMoonlit,
      dawnHorizonLayer: dawnHorizonLayer,
      sunEdgeGroup: sunEdgeGroup,
      landDawnRim: landDawnRim,
      frameLayer: frameLayer,
      outerFrame: outerFrame,
      innerFrame: innerFrame,
      framePerim: framePerim
    };
  }

  function init() {
    var host = document.getElementById('scene-root');
    if (!host) return;

    var bar = el('div', { class: 'title-bar' }, host);
    el('h1', { text: 'Reflect His Glory' }, bar);
    el('span', { class: 'course-tag', text: '202-06' }, bar);

    var bundle = buildStage(host);

    var strip = el('div', { class: 'step-strip', role: 'group', 'aria-label': 'Reflect His Glory steps' }, host);
    var dotButtons = STEPS.map(function (st, idx) {
      var btn = el('button', {
        type: 'button',
        class: 'step-dot',
        'data-step': String(idx),
        'aria-label': st.dotLabel,
        'aria-pressed': 'false'
      }, strip);
      btn.style.setProperty('--dot-color', st.color);
      el('span', { class: 'step-dot-fill' }, btn);
      return btn;
    });

    var cardArea = el('div', { class: 'card-area' }, host);
    var cardBox = el('div', { class: 'verse-card' }, cardArea);
    el('div', { class: 'verse-card-bar' }, cardBox);
    var contentEl = el('div', {
      id: 'card-content',
      class: 'verse-card-content',
      'aria-live': 'polite'
    }, cardBox);
    var headingEl = el('h2', { class: 'card-heading' }, contentEl);
    var quoteWrap = el('p', { class: 'card-quote' }, contentEl);
    var quoteTextEl = el('span', {}, quoteWrap);
    var refEl = el('span', { class: 'card-ref' }, quoteWrap);
    var noteEl = el('p', { class: 'card-note' }, contentEl);

    var navBar = el('div', { class: 'nav-bar' }, cardArea);
    var prevBtn = el('button', { id: 'prev-btn', type: 'button', class: 'nav-btn', text: '\u2190 Back' }, navBar);
    var countEl = el('span', { class: 'step-count', text: 'Ready' }, navBar);
    var nextBtn = el('button', { id: 'next-btn', type: 'button', class: 'nav-btn primary', text: 'Begin \u2192' }, navBar);

    var currentStep = 0;
    var activeRaf = null;
    var reducedMotionQuery = window.matchMedia
      ? window.matchMedia('(prefers-reduced-motion: reduce)')
      : { matches: false };

    function stopAnim() {
      if (activeRaf !== null) {
        cancelAnimationFrame(activeRaf);
        activeRaf = null;
      }
    }

    function setDash(node, len, progress) {
      var t = Math.max(0, Math.min(1, progress));
      node.style.strokeDashoffset = (len * (1 - t)).toFixed(2);
    }

    function applyStaticLayers(stepIdx) {
      bundle.horizonGlowLayer.classList.toggle('is-visible', stepIdx >= 1);
      bundle.farRidgeRimStep1.classList.toggle('is-visible', stepIdx >= 1 && stepIdx < 4);
      bundle.skyBridgeLayer.classList.toggle('is-visible', stepIdx >= 2);
      bundle.moonLitLayer.classList.toggle('is-visible', stepIdx >= 2);
      bundle.moonlightPoolLayer.classList.toggle('is-visible', stepIdx >= 3);
      bundle.landMoonlit.classList.toggle('is-visible', stepIdx >= 3);
      bundle.dawnHorizonLayer.classList.toggle('is-visible', stepIdx >= 4);
      bundle.landDawnRim.classList.toggle('is-visible', stepIdx >= 4);
      bundle.frameLayer.classList.toggle('is-visible', stepIdx >= 4);
    }

    function snapFinalMotion(stepIdx) {
      bundle.sunEdgeGroup.setAttribute('transform', stepIdx >= 4 ? 'translate(0, 0)' : 'translate(0, 10)');
      setDash(bundle.outerFrame, bundle.framePerim, stepIdx >= 4 ? 1 : 0);
      bundle.innerFrame.style.opacity = stepIdx >= 4 ? '0.5' : '0';
    }

    function animateStep(stepIdx) {
      if (stepIdx < 4) {
        // Steps 1, 2, 3 reveal via calm CSS opacity washes with zero idle timers
        host.setAttribute('data-step-dur', '0');
        snapFinalMotion(stepIdx);
        return;
      }

      // Step 4: Gently lift just the upper edge of the sun above the distant hill & trace climax hairline
      var t0 = performance.now();
      var dur = 680;
      host.setAttribute('data-step-dur', String(dur));
      bundle.sunEdgeGroup.setAttribute('transform', 'translate(0, 10)');
      setDash(bundle.outerFrame, bundle.framePerim, 0);
      bundle.innerFrame.style.opacity = '0';
      var frame = function (now) {
        var p = Math.min(1, (now - t0) / dur);
        var eased = 1 - Math.pow(1 - p, 2);
        var dy = (10 * (1 - eased)).toFixed(2);
        bundle.sunEdgeGroup.setAttribute('transform', 'translate(0, ' + dy + ')');
        setDash(bundle.outerFrame, bundle.framePerim, eased);
        bundle.innerFrame.style.opacity = (0.5 * eased).toFixed(2);
        if (p < 1) {
          activeRaf = requestAnimationFrame(frame);
        } else {
          snapFinalMotion(4);
          activeRaf = null;
        }
      };
      activeRaf = requestAnimationFrame(frame);
    }

    function goTo(nextIdx) {
      stopAnim();
      var prevIdx = currentStep;
      var goingForwardOne = nextIdx === prevIdx + 1;
      var instant = reducedMotionQuery.matches || !goingForwardOne || nextIdx === 0;

      host.classList.toggle('is-instant', instant);
      applyStaticLayers(nextIdx);

      if (instant) {
        host.setAttribute('data-step-dur', '0');
        snapFinalMotion(nextIdx);
      } else {
        animateStep(nextIdx);
      }

      currentStep = nextIdx;
      var step = STEPS[currentStep];
      host.setAttribute('data-step', String(currentStep));
      host.style.setProperty('--step-color', step.color);
      host.style.setProperty('--step-dark', step.dark);
      bundle.svgDesc.textContent = step.desc;

      headingEl.textContent = step.heading;
      quoteTextEl.textContent = step.verse;
      refEl.textContent = '(' + step.ref + ')';
      noteEl.textContent = step.line;

      dotButtons.forEach(function (btn, idx) {
        btn.classList.toggle('active', idx === currentStep);
        btn.classList.toggle('passed', idx > 0 && idx < currentStep);
        btn.setAttribute('aria-pressed', idx === currentStep ? 'true' : 'false');
      });

      countEl.textContent = currentStep === 0 ? 'Ready' : ('Step ' + currentStep + ' of ' + (STEPS.length - 1));
      prevBtn.disabled = currentStep === 0;
      if (currentStep === 0) {
        nextBtn.textContent = 'Begin \u2192';
      } else if (currentStep === STEPS.length - 1) {
        nextBtn.textContent = '\u21BB Start Over';
      } else {
        nextBtn.textContent = 'Next \u2192';
      }
    }

    dotButtons.forEach(function (btn, idx) {
      btn.addEventListener('click', function () {
        goTo(idx);
      });
    });

    prevBtn.addEventListener('click', function () {
      if (currentStep > 0) goTo(currentStep - 1);
    });
    nextBtn.addEventListener('click', function () {
      goTo(currentStep === STEPS.length - 1 ? 0 : currentStep + 1);
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowRight' && currentStep < STEPS.length - 1) {
        goTo(currentStep + 1);
      } else if (event.key === 'ArrowLeft' && currentStep > 0) {
        goTo(currentStep - 1);
      }
    });

    var lastWidth = window.innerWidth;
    var measuredWidth = 0;
    function fitCardHeight() {
      if (!contentEl || contentEl.clientWidth === measuredWidth) return;
      measuredWidth = contentEl.clientWidth;
      var keepH = headingEl.textContent;
      var keepQ = quoteTextEl.textContent;
      var keepR = refEl.textContent;
      var keepN = noteEl.textContent;
      var tallest = 0;
      document.documentElement.style.setProperty('--card-h', '0px');
      STEPS.forEach(function (st) {
        headingEl.textContent = st.heading;
        quoteTextEl.textContent = st.verse;
        refEl.textContent = '(' + st.ref + ')';
        noteEl.textContent = st.line;
        tallest = Math.max(tallest, contentEl.offsetHeight);
      });
      headingEl.textContent = keepH;
      quoteTextEl.textContent = keepQ;
      refEl.textContent = keepR;
      noteEl.textContent = keepN;
      document.documentElement.style.setProperty('--card-h', Math.max(100, tallest) + 'px');
    }

    var resizeTimer = null;
    window.addEventListener('resize', function () {
      if (window.innerWidth === lastWidth) return;
      lastWidth = window.innerWidth;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(fitCardHeight, 120);
    });

    goTo(0);
    fitCardHeight();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
