<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEST Self-Rating</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background: transparent;
            font-family: 'Inter', 'Trebuchet MS', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .slider-card {
            background: #FCFAF1;
            border: 1px solid #E8DFD0;
            border-radius: 12px;
            padding: 10px 14px 12px;
            max-width: 460px;
            margin: 0 auto;
            box-shadow: 0 3px 10px rgba(44, 36, 22, 0.06);
        }

        .row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            gap: 10px;
        }

        .role-title {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.13em;
            color: var(--accent, #2A2820);
            text-transform: uppercase;
            line-height: 1.1;
        }

        .prompt-text {
            font-size: 10.5px;
            font-weight: 600;
            color: #8B7F6B;
            letter-spacing: 0.04em;
            text-align: right;
            line-height: 1.2;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .slider-pill {
            flex: 1;
            min-height: 34px;
            border: 1.8px solid rgba(44, 36, 22, 0.18);
            border-radius: 9px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            color: #5A4F42;
            cursor: pointer;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
        }

        .slider-pill:hover {
            border-color: var(--accent, #2A2820);
        }

        .slider-pill:active {
            transform: translateY(1px);
        }

        .slider-pill.selected {
            background: var(--accent, #2A2820);
            border-color: var(--accent, #2A2820);
            color: white;
            box-shadow: 0 4px 9px rgba(44, 36, 22, 0.14);
        }

        .labels-row {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 10px;
            font-weight: 600;
            color: #8B7F6B;
            letter-spacing: 0.04em;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
<div class="slider-card" id="card" role="radiogroup" aria-label="Self-rating slider">
    <div class="row-top">
        <div class="role-title" id="title"></div>
        <div class="prompt-text">Rate yourself 1 to 5</div>
    </div>
    <div class="slider-row" id="sliderRow"></div>
    <div class="labels-row">
        <span>Not me</span>
        <span>Strongly me</span>
    </div>
</div>

<script>
(function () {
    var roles = {
        'apostle': { name: 'Apostle / Plower', color: '#9C6F44' },
        'prophet': { name: 'Prophet / Watcher', color: '#C9A23A' },
        'evangelist': { name: 'Evangelist / Planter', color: '#5C8A3C' },
        'shepherd': { name: 'Shepherd / Waterer', color: '#4D88B8' },
        'teacher': { name: 'Teacher / Pruner', color: '#C85A56' }
    };

    var roleKey = (window.location.hash || '#apostle').replace('#', '').toLowerCase();
    var role = roles[roleKey] || roles.apostle;
    var storageKey = 'apest-rating-' + roleKey;

    var card = document.getElementById('card');
    card.style.setProperty('--accent', role.color);

    document.getElementById('title').textContent = role.name;
    card.setAttribute('aria-label', 'Rate yourself 1 to 5 on ' + role.name);

    var sliderRow = document.getElementById('sliderRow');
    var saved = parseInt(localStorage.getItem(storageKey), 10);

    for (var i = 1; i <= 5; i++) {
        (function (val) {
            var pill = document.createElement('button');
            pill.type = 'button';
            pill.className = 'slider-pill';
            pill.textContent = val;
            pill.setAttribute('role', 'radio');
            pill.setAttribute('aria-checked', val === saved ? 'true' : 'false');
            pill.setAttribute('aria-label', 'Rating ' + val + ' of 5 for ' + role.name);
            if (val === saved) pill.classList.add('selected');

            pill.addEventListener('click', function () {
                localStorage.setItem(storageKey, val);
                var allPills = sliderRow.querySelectorAll('.slider-pill');
                allPills.forEach(function (p) {
                    p.classList.remove('selected');
                    p.setAttribute('aria-checked', 'false');
                });
                pill.classList.add('selected');
                pill.setAttribute('aria-checked', 'true');
            });

            sliderRow.appendChild(pill);
        })(i);
    }
}());
</script>
</body>
</html>
