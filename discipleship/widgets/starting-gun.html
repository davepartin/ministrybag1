<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUN from Sin</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Georgia', 'Cambria', serif; background: #F8F6F1; color: #2C2416; -webkit-font-smoothing: antialiased; padding: 0; margin: 0; }
        .widget-outer { background: #FFFFFF; border-radius: 0; overflow: hidden; box-shadow: none; border: none; max-width: 100%; width: 100%; margin: 0; position: relative; }
        @media (min-width: 560px) {
            body { padding: 16px; background: #F8F6F1; }
            .widget-outer { border-radius: 12px; box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08); border: 1px solid #EBE5D9; max-width: 460px; margin: 0 auto; }
        }
        button { -webkit-tap-highlight-color: transparent; font-family: 'Trebuchet MS', sans-serif; }
        button:focus-visible { outline: 3px solid #2C2416; outline-offset: 2px; }
        .title-bar { background: #1D6B3F; padding: 10px 16px; text-align: center; }
        .title-bar h1 { font-size: 19px; font-weight: 700; color: #FFFFFF; margin: 0; line-height: 1.2; font-family: 'Trebuchet MS', 'Inter', sans-serif; }
        .diagram-wrapper { padding: 6px 6px 0; }
        svg#scene { display: block; width: 100%; height: auto; max-height: 290px; }
        .lbl { font-family: 'Trebuchet MS', sans-serif; font-weight: 700; }
        #bang { transition: opacity 0.25s ease; }
        .flag rect { transition: fill 0.4s ease; }
        .buddy { transition: opacity 0.5s ease; }
        #runner circle, #runner line { transition: fill 0.4s ease, stroke 0.4s ease; }
        #runner.in-pit circle { fill: #F2EDE3; }
        #runner.in-pit line { stroke: #F2EDE3; }
        @media (prefers-reduced-motion: reduce) { #bang, .flag rect, .buddy, #runner circle, #runner line { transition: none; } }

        #card-area { background-color: #F6F4EE; border-top: 1px solid #EBE5D9; padding-top: 8px; }
        .verse-card-wrapper { margin: 0 auto; padding: 0 12px 10px; max-width: 460px; }
        .verse-card { background: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 14px rgba(44,36,22,0.06); }
        .verse-card-bar { height: 4px; }
        .verse-card-content { padding: 10px 16px; min-height: var(--card-h, 112px); }
        .card-title { font-family: 'Trebuchet MS', sans-serif; font-size: 16px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
        .card-text { font-size: 15px; line-height: 1.4; color: #3D3426; }
        .card-ref { font-family: 'Trebuchet MS', sans-serif; font-size: 13px; color: #6B6358; margin-top: 4px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 0 2px; gap: 8px; }
        .nav-btn { background: transparent; border: 1.5px solid #D4CFC4; border-radius: 10px; padding: 10px 12px; min-height: 44px; min-width: 124px; text-align: center; font-size: 14px; color: #5A4E3C; cursor: pointer; font-weight: 600; }
        .nav-btn.primary { color: #FFFFFF; border: none; background: #1D6B3F; }
        .nav-btn.danger { color: #6B3A2E; border-color: #D8B8AE; background: #FBF1EE; }
        .step-count { font-family: 'Trebuchet MS', sans-serif; font-size: 13px; color: #6B6358; }
        .begin-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 16px 16px; }
        .begin-text { font-size: 16px; line-height: 1.4; text-align: center; color: #3D3426; max-width: 340px; }
        .begin-btn { background: #9B3B2A; color: #FFFFFF; border: none; border-radius: 10px; padding: 12px 28px; min-height: 44px; font-size: 16px; font-weight: 700; cursor: pointer; }
        #measure { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
</head>
<body>
<div class="widget-outer">
    <div class="title-bar"><h1>RUN from Sin</h1></div>
    <div class="diagram-wrapper">
        <svg id="scene" viewBox="0 0 360 280" role="img" aria-labelledby="scene-desc">
            <desc id="scene-desc">A runner at a starting line. To the left is a pit. To the right a path climbs a hill to a cross.</desc>
            <!-- hill and path to the cross -->
            <polygon points="196,214 344,214 344,96" fill="#E8F3EB"/>
            <line x1="196" y1="214" x2="332" y2="104" stroke="#9CC7A9" stroke-width="4" stroke-linecap="round"/>
            <g id="cross" opacity="0.5">
                <rect x="327" y="46" width="8" height="58" rx="2" fill="#6B5232"/>
                <rect x="313" y="60" width="36" height="8" rx="2" fill="#6B5232"/>
            </g>
            <text id="life" x="331" y="36" text-anchor="middle" class="lbl" font-size="15" fill="#1D6B3F" opacity="0">Life</text>
            <!-- R U N flags along the path -->
            <g class="flag" id="flag-r"><rect x="230" y="193" width="24" height="22" rx="4" fill="#CFC9BD"/><text x="242" y="209" text-anchor="middle" class="lbl" font-size="15" fill="#FFFFFF">R</text></g>
            <g class="flag" id="flag-u"><rect x="266" y="164" width="24" height="22" rx="4" fill="#CFC9BD"/><text x="278" y="180" text-anchor="middle" class="lbl" font-size="15" fill="#FFFFFF">U</text></g>
            <g class="flag" id="flag-n"><rect x="302" y="135" width="24" height="22" rx="4" fill="#CFC9BD"/><text x="314" y="151" text-anchor="middle" class="lbl" font-size="15" fill="#FFFFFF">N</text></g>
            <!-- ground and start line -->
            <line x1="112" y1="214" x2="200" y2="214" stroke="#B9B4A8" stroke-width="4"/>
            <line x1="152" y1="208" x2="152" y2="220" stroke="#FFFFFF" stroke-width="3"/>
            <text x="152" y="236" text-anchor="middle" class="lbl" font-size="13" fill="#8C877C">START</text>
            <!-- the pit -->
            <path d="M 14 214 L 112 214 L 104 272 L 22 272 Z" fill="#3E3B35"/>
            <text x="60" y="204" text-anchor="middle" class="lbl" font-size="15" fill="#3E3B35">The Pit</text>
            <!-- temptation arrives -->
            <g id="bang" opacity="0">
                <circle cx="152" cy="116" r="17" fill="#9B3B2A"/>
                <text x="152" y="124" text-anchor="middle" class="lbl" font-size="22" fill="#FFFFFF">!</text>
                <text x="152" y="88" text-anchor="middle" class="lbl" font-size="14" fill="#9B3B2A">Temptation</text>
            </g>
            <!-- a running partner -->
            <g id="buddy1" class="buddy" opacity="0"><circle cx="0" cy="-40" r="7.5" fill="#4A6B8B"/><line x1="0" y1="-32" x2="0" y2="-15" stroke="#4A6B8B" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-27" x2="-8" y2="-19" stroke="#4A6B8B" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-27" x2="8" y2="-19" stroke="#4A6B8B" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-15" x2="-7" y2="0" stroke="#4A6B8B" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-15" x2="7" y2="0" stroke="#4A6B8B" stroke-width="5" stroke-linecap="round"/></g>
                        <!-- the runner -->
            <g id="runner">
                <circle cx="0" cy="-40" r="7.5" fill="#1D6B3F"/>
                <line x1="0" y1="-32" x2="0" y2="-15" stroke="#1D6B3F" stroke-width="5" stroke-linecap="round"/>
                <line x1="0" y1="-27" x2="-8" y2="-19" stroke="#1D6B3F" stroke-width="4" stroke-linecap="round"/>
                <line x1="0" y1="-27" x2="8" y2="-19" stroke="#1D6B3F" stroke-width="4" stroke-linecap="round"/>
                <line x1="0" y1="-15" x2="-7" y2="0" stroke="#1D6B3F" stroke-width="5" stroke-linecap="round"/>
                <line x1="0" y1="-15" x2="7" y2="0" stroke="#1D6B3F" stroke-width="5" stroke-linecap="round"/>
            </g>
            <text id="you" class="lbl" font-size="14" fill="#1D6B3F" text-anchor="middle">You</text>
        </svg>
    </div>
    <div id="card-area" aria-live="polite"></div>
    <p class="sr-only" id="status" aria-live="polite"></p>
</div>
<script>
    var GREEN = '#1D6B3F', RUST = '#9B3B2A', GOLD = '#B8892B', GREY = '#8C877C';
    var START = { x: 152, y: 214 };

    var tempted = {
        pos: START, bang: true, lit: 0, buddies: false, life: false, fallen: false,
        color: RUST,
        title: 'Temptation arrives.',
        text: 'A tempting thought just knocked. Every second you wait makes running harder. What will you do?',
        ref: '“I made a covenant with my eyes not to look lustfully at a young woman.” (Job 31:1, NIV)',
        desc: 'Temptation appears beside the runner. The pit is to the left and the path to the cross is to the right.'
    };
    var stay = [
        { pos: { x: 128, y: 214 }, color: GREY, title: 'A look.', text: 'You do not walk away. You keep looking, and the thought grows. This is where David stood on the roof.', ref: '2 Samuel 11:2', desc: 'The runner steps toward the pit.' },
        { pos: { x: 108, y: 214 }, color: GREY, title: 'The wrong decision.', text: 'The look becomes a choice. Each step makes the next one easier, and you are standing on the edge.', ref: '2 Samuel 11:4', desc: 'The runner stands at the edge of the pit.' },
        { pos: { x: 88, y: 262 }, tilt: -35, color: GREY, fallen: true, title: 'Hiding.', text: 'Now you want to cover it up. Sin grows best in the dark, and the pit gets deeper.', ref: 'Psalm 32:3', desc: 'The runner tumbles down into the pit.' },
        { pos: { x: 63, y: 268 }, color: GOLD, fallen: true, title: 'The pit is not the end.', text: 'Stop hiding and confess it, like David did. God forgives and lifts you out. It is never too late to turn around and run.', ref: '“I acknowledged my sin to you … and you forgave the iniquity of my sin” (Psalm 32:5)', desc: 'The runner is at the bottom of the pit, but confession brings forgiveness and God can lift them out.' }
    ];
    var run = [
        { pos: { x: 222, y: 193 }, lit: 1, color: GREEN, title: 'R: Remember the Cross.', text: 'You were bought with a price, the life of God\'s own Son. Grace is free, but it is never cheap.', ref: '1 Corinthians 6:19-20', desc: 'The runner sprints up the path and lights the R flag.' },
        { pos: { x: 258, y: 164 }, lit: 2, color: GREEN, title: 'U: United with God.', text: 'You are joined to the Lord, and your body is a temple of the Holy Spirit. God Himself runs with you.', ref: '1 Corinthians 6:17, 19', desc: 'The runner climbs higher and lights the U flag.' },
        { pos: { x: 294, y: 135 }, lit: 3, buddies: true, color: GREEN, title: 'N: Need others.', text: 'Do not run alone. Nathan was David\'s other. Run with another believer beside you.', ref: '“flee youthful passions … along with those who call on the Lord” (2 Timothy 2:22)', desc: 'A running partner joins the runner as the N flag lights.' },
        { pos: { x: 306, y: 125 }, lit: 3, buddies: true, life: true, color: GOLD, title: 'You ran toward life.', text: 'Joseph ran, and you can too. The thief comes to destroy, but Jesus came to give you life.', ref: '“I came that they may have life and have it abundantly.” (John 10:10)', desc: 'The runner and a partner reach the cross at the top of the hill.' }
    ];
    run.forEach(function (s) { s.bang = false; s.fallen = false; s.buddies = !!s.buddies; s.life = !!s.life; });
    stay.forEach(function (s) { s.bang = false; s.lit = 0; s.buddies = false; s.life = false; s.fallen = !!s.fallen; });

    var mode = 'intro', idx = 0, pendingFocus = null, cur = { x: START.x, y: START.y }, anim = null;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function el(id) { return document.getElementById(id); }

    function place(p) {
        el('runner').setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')' + (tilt ? ' rotate(' + tilt + ')' : ''));
        el('you').setAttribute('x', p.x); el('you').setAttribute('y', p.y - 54);
        el('buddy1').setAttribute('transform', 'translate(' + (p.x - 24) + ',' + (p.y + 19) + ')');
        cur = { x: p.x, y: p.y };
    }
    function moveTo(p) {
        if (anim) cancelAnimationFrame(anim);
        if (reduceMotion) { place(p); return; }
        var from = { x: cur.x, y: cur.y }, t0 = null, dur = 700;
        function frame(ts) {
            if (t0 === null) t0 = ts;
            var k = Math.min((ts - t0) / dur, 1), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
            place({ x: from.x + (p.x - from.x) * e, y: from.y + (p.y - from.y) * e });
            if (k < 1) anim = requestAnimationFrame(frame);
        }
        anim = requestAnimationFrame(frame);
    }
    var tilt = 0;
    function paint(s) {
        tilt = s && s.tilt ? s.tilt : 0;
        el('runner').classList.toggle('in-pit', !!(s && s.fallen));
        el('bang').setAttribute('opacity', s && s.bang ? '1' : '0');
        ['flag-r', 'flag-u', 'flag-n'].forEach(function (id, i) {
            el(id).querySelector('rect').setAttribute('fill', s && s.lit > i ? GREEN : '#CFC9BD');
        });
        el('buddy1').setAttribute('opacity', s && s.buddies ? '1' : '0');
        el('life').setAttribute('opacity', s && s.life ? '1' : '0');
        el('cross').setAttribute('opacity', s && s.life ? '1' : '0.5');
        el('runner').setAttribute('opacity', '1');
        el('you').setAttribute('opacity', s && (s.fallen || s.life) ? '0' : '1');
        el('scene-desc').textContent = s ? s.desc : 'A runner at a starting line. To the left is a pit. To the right a path climbs a hill to a cross.';
        moveTo(s ? s.pos : START);
    }

    function setFocus(n) { pendingFocus = n; }
    function applyFocus() {
        if (!pendingFocus) return;
        var t = document.querySelector('[data-control="' + pendingFocus + '"]');
        pendingFocus = null;
        if (t) t.focus();
    }
    function button(label, control, cls, onClick) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = cls; b.setAttribute('data-control', control);
        b.textContent = label; b.addEventListener('click', onClick);
        return b;
    }
    function buildCard(s) {
        var vc = document.createElement('div'); vc.className = 'verse-card';
        var bar = document.createElement('div'); bar.className = 'verse-card-bar'; bar.style.background = s.color; vc.appendChild(bar);
        var c = document.createElement('div'); c.className = 'verse-card-content';
        var t = document.createElement('p'); t.className = 'card-title'; t.style.color = s.color === GREY ? '#5A4E3C' : s.color; t.textContent = s.title; c.appendChild(t);
        var x = document.createElement('p'); x.className = 'card-text'; x.textContent = s.text; c.appendChild(x);
        if (s.ref) { var r = document.createElement('p'); r.className = 'card-ref'; r.textContent = s.ref; c.appendChild(r); }
        vc.appendChild(c);
        return vc;
    }
    // Size every card to the tallest one so the buttons never move.
    function fitCards() {
        var area = el('card-area'), m = document.createElement('div'), max = 0;
        m.id = 'measure'; m.style.width = area.clientWidth + 'px';
        document.documentElement.style.setProperty('--card-h', '0px');
        [tempted].concat(stay, run).forEach(function (s) {
            var w = document.createElement('div'); w.className = 'verse-card-wrapper'; w.appendChild(buildCard(s)); m.appendChild(w);
        });
        document.body.appendChild(m);
        m.querySelectorAll('.verse-card-content').forEach(function (c) { max = Math.max(max, c.offsetHeight); });
        document.body.removeChild(m);
        document.documentElement.style.setProperty('--card-h', Math.max(max, 112) + 'px');
    }

    function go(newMode, newIdx, focus) { mode = newMode; idx = newIdx || 0; if (focus) setFocus(focus); render(); }

    function render() {
        var area = el('card-area');
        area.innerHTML = '';

        if (mode === 'intro') {
            paint(null);
            var wrap = document.createElement('div'); wrap.className = 'begin-wrapper';
            var intro = document.createElement('p'); intro.className = 'begin-text';
            intro.textContent = 'You are on the starting line. When temptation comes, which way will you run?';
            wrap.appendChild(intro);
            wrap.appendChild(button('Begin \u2192', 'begin', 'begin-btn', function () { go('tempted', 0, 'run'); }));
            area.appendChild(wrap);
            el('status').textContent = '';
            applyFocus();
            return;
        }

        var s = mode === 'tempted' ? tempted : (mode === 'stay' ? stay[idx] : run[idx]);
        paint(s);
        var wrapper = document.createElement('div'); wrapper.className = 'verse-card-wrapper';
        wrapper.appendChild(buildCard(s));
        var nav = document.createElement('div'); nav.className = 'nav-bar';
        var count = document.createElement('span'); count.className = 'step-count';

        if (mode === 'tempted') {
            nav.appendChild(button('Stay and look', 'stay', 'nav-btn danger', function () { go('stay', 0, 'next'); }));
            count.textContent = 'Choose';
            nav.appendChild(count);
            nav.appendChild(button('RUN →', 'run', 'nav-btn primary', function () { go('run', 0, 'next'); }));
        } else {
            var list = mode === 'stay' ? stay : run;
            nav.appendChild(button('← Back', 'back', 'nav-btn', function () {
                if (idx === 0) go('tempted', 0, mode === 'stay' ? 'stay' : 'run'); else go(mode, idx - 1, 'back');
            }));
            count.textContent = (idx + 1) + ' of ' + list.length;
            nav.appendChild(count);
            if (idx < list.length - 1) nav.appendChild(button('Next →', 'next', 'nav-btn primary', function () { go(mode, idx + 1, 'next'); }));
            else if (mode === 'stay') nav.appendChild(button('Run this time', 'retry', 'nav-btn primary', function () { go('tempted', 0, 'run'); }));
            else nav.appendChild(button('↻ Restart', 'restart', 'nav-btn primary', function () { go('intro', 0, 'begin'); }));
        }
        wrapper.appendChild(nav);
        area.appendChild(wrapper);
        el('status').textContent = s.title;
        applyFocus();
    }

    place(START);
    fitCards();
    render();
    var rt = null;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(fitCards, 150); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCards);
</script>
</body>
</html>
