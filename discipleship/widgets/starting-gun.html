<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUN from Sin</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Georgia', 'Cambria', serif; background: #F8F6F1; color: #2C2416; -webkit-font-smoothing: antialiased; padding: 0; margin: 0; }
        .widget-outer { background: #FFFFFF; border-radius: 0; overflow: hidden; box-shadow: none; border: none; max-width: 100%; width: 100%; margin: 0; position: relative; }
        @media (min-width: 560px) {
            body { padding: 16px; background: #F8F6F1; }
            .widget-outer { border-radius: 12px; box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08); border: 1px solid #EBE5D9; max-width: 460px; margin: 0 auto; }
        }
        button { -webkit-tap-highlight-color: transparent; font-family: 'Trebuchet MS', sans-serif; }
        button:focus-visible { outline: 3px solid #2C2416; outline-offset: 2px; }
        .title-bar { background: #1D6B3F; padding: 10px 16px; text-align: center; }
        .title-bar h1 { font-size: 19px; font-weight: 700; color: #FFFFFF; margin: 0; line-height: 1.2; font-family: 'Trebuchet MS', 'Inter', sans-serif; }
        .diagram-wrapper { padding: 6px 6px 0; }
        svg#scene { display: block; width: 100%; height: auto; max-height: 290px; }
        .lbl { font-family: 'Trebuchet MS', sans-serif; font-weight: 700; }
        #bang { transition: opacity 0.25s ease; }
        .flag rect { transition: fill 0.4s ease; }
        .buddy { transition: opacity 0.5s ease; }
        #runner circle, #runner line { transition: fill 0.4s ease, stroke 0.4s ease; }
        #post { transition: stroke-dashoffset 0.9s ease, opacity 0.2s ease; }
        #beam { transition: stroke-dashoffset 0.4s ease 0.7s, opacity 0.2s ease 0.7s; }
        #glow { transition: opacity 0.8s ease; }
        #runner.in-pit circle { fill: #F2EDE3; }
        #runner.in-pit line { stroke: #F2EDE3; }
        @media (prefers-reduced-motion: reduce) { #bang, .flag rect, .buddy, #runner circle, #runner line, #post, #beam, #glow { transition: none; } }

        #card-area { background-color: #F6F4EE; border-top: 1px solid #EBE5D9; padding-top: 8px; }
        .verse-card-wrapper { margin: 0 auto; padding: 0 12px 10px; max-width: 460px; }
        .verse-card { background: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 14px rgba(44,36,22,0.06); }
        .verse-card-bar { height: 4px; }
        .verse-card-content { padding: 10px 16px; min-height: var(--card-h, 112px); }
        .card-title { font-family: 'Trebuchet MS', sans-serif; font-size: 16px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
        .card-text { font-size: 15px; line-height: 1.4; color: #3D3426; }
        .card-ref { font-family: 'Trebuchet MS', sans-serif; font-size: 13px; color: #6B6358; margin-top: 4px; white-space: pre-line; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 0 2px; gap: 8px; }
        .nav-btn { background: transparent; border: 1.5px solid #D4CFC4; border-radius: 10px; padding: 10px 12px; min-height: 44px; min-width: 124px; text-align: center; font-size: 14px; color: #5A4E3C; cursor: pointer; font-weight: 600; }
        .nav-btn.primary { color: #FFFFFF; border: none; background: #1D6B3F; }
        .nav-btn.danger { color: #6B3A2E; border-color: #D8B8AE; background: #FBF1EE; }
        .step-count { font-family: 'Trebuchet MS', sans-serif; font-size: 13px; color: #6B6358; }
        .begin-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 16px 16px; }
        .begin-text { font-size: 16px; line-height: 1.4; text-align: center; color: #3D3426; max-width: 340px; }
        .begin-btn { background: #9B3B2A; color: #FFFFFF; border: none; border-radius: 10px; padding: 12px 28px; min-height: 44px; font-size: 16px; font-weight: 700; cursor: pointer; }
        #measure { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
</head>
<body>
<div class="widget-outer">
    <div class="title-bar"><h1>RUN from Sin</h1></div>
    <div class="diagram-wrapper">
        <svg id="scene" viewBox="0 0 360 280" role="img" aria-labelledby="scene-desc">
            <desc id="scene-desc">A runner on a slope. The pit is below to the left. Full Life is at the top of the hill to the right.</desc>
            <!-- Full Life at the top of the hill -->
            <g id="glow" opacity="0.75">
                <circle cx="350" cy="14" r="36" fill="#F3D98B" opacity="0.35"/>
                <circle cx="350" cy="14" r="20" fill="#F3D98B"/>
            </g>
            <text x="322" y="21" text-anchor="end" class="lbl" font-size="15" fill="#9A7222">Full Life</text>
            <!-- the hill: one slope from the pit up to Full Life -->
            <polygon id="hill" fill="#E8F3EB"/>
            <polyline id="slope" fill="none" stroke="#9CC7A9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
            <!-- R U N markers below the slope -->
            <g class="flag" id="flag-r"><rect width="32" height="30" rx="6" fill="#CFC9BD"/><text text-anchor="middle" class="lbl" font-size="20" fill="#FFFFFF">R</text></g>
            <g class="flag" id="flag-u"><rect width="32" height="30" rx="6" fill="#CFC9BD"/><text text-anchor="middle" class="lbl" font-size="20" fill="#FFFFFF">U</text></g>
            <g class="flag" id="flag-n"><rect width="32" height="30" rx="6" fill="#CFC9BD"/><text text-anchor="middle" class="lbl" font-size="20" fill="#FFFFFF">N</text></g>
            <!-- the pit -->
            <path d="M 8 226 L 96 226 L 88 276 L 16 276 Z" fill="#3E3B35"/>
            <text x="52" y="205" text-anchor="middle" class="lbl" font-size="15" fill="#3E3B35">The Pit</text>
            <!-- the cross lies along the slope, its base reaching down into the pit -->
            <line id="post" stroke="#8A5A2B" stroke-width="14" stroke-linecap="round" opacity="0"/>
            <line id="beam" stroke="#8A5A2B" stroke-width="14" stroke-linecap="round" opacity="0"/>
            <!-- temptation arrives -->
            <g id="bang" opacity="0">
                <circle cx="140" cy="102" r="17" fill="#9B3B2A"/>
                <text x="140" y="110" text-anchor="middle" class="lbl" font-size="22" fill="#FFFFFF">!</text>
                <text x="140" y="74" text-anchor="middle" class="lbl" font-size="14" fill="#9B3B2A">Temptation</text>
            </g>
            <!-- a running partner -->
            <g id="buddy1" class="buddy" opacity="0"><circle cx="0" cy="-40" r="7.5" fill="#4A6B8B"/><line x1="0" y1="-32" x2="0" y2="-15" stroke="#4A6B8B" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-27" x2="-8" y2="-19" stroke="#4A6B8B" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-27" x2="8" y2="-19" stroke="#4A6B8B" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-15" x2="-7" y2="0" stroke="#4A6B8B" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-15" x2="7" y2="0" stroke="#4A6B8B" stroke-width="5" stroke-linecap="round"/></g>
            <!-- the runner -->
            <g id="runner"><circle cx="0" cy="-40" r="7.5" fill="#1D6B3F"/><line x1="0" y1="-32" x2="0" y2="-15" stroke="#1D6B3F" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-27" x2="-8" y2="-19" stroke="#1D6B3F" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-27" x2="8" y2="-19" stroke="#1D6B3F" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="-15" x2="-7" y2="0" stroke="#1D6B3F" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-15" x2="7" y2="0" stroke="#1D6B3F" stroke-width="5" stroke-linecap="round"/></g>
            <text id="you" class="lbl" font-size="14" fill="#1D6B3F" text-anchor="middle">You</text>
        </svg>
    </div>
    <div id="card-area" aria-live="polite"></div>
    <p class="sr-only" id="status" aria-live="polite"></p>
</div>
<script>
    var GREEN = '#1D6B3F', RUST = '#9B3B2A', GOLD = '#B8892B', GREY = '#8C877C';
    // The slope runs from the pit's lip A up to the crest B. pt(t, off) is a point t of the way
    // along it, lifted off pixels above the surface (negative is below, into the hill).
    var A = { x: 96, y: 226 }, B = { x: 318, y: 70 };
    var DX = B.x - A.x, DY = B.y - A.y, LEN = Math.sqrt(DX * DX + DY * DY);
    var U = { x: DX / LEN, y: DY / LEN }, N_UP = { x: U.y, y: -U.x };
    function pt(t, off) { off = off || 0; return { x: A.x + DX * t + N_UP.x * off, y: A.y + DY * t + N_UP.y * off }; }
    var ON_CROSS = 14;
    var START = pt(0.2);

    var tempted = {
        pos: START, bang: true, lit: 0, cross: false,
        color: RUST,
        title: 'Temptation Arrives',
        text: 'You feel the pull of sin. What will you do?',
        ref: '“Watch and pray that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.” (Matthew 26:41)',
        desc: 'Temptation appears above the runner. The pit is below to the left and Full Life is up the hill to the right.'
    };
    var stay = [
        { pos: pt(0.09), color: RUST, title: 'Look and Linger', text: 'You choose to not RUN away and the sinful thoughts begin to grow.', ref: '“Keep your way far from her [the forbidden woman], and do not go near the door of her house.” (Proverbs 5:8)', desc: 'The runner steps down toward the pit.' },
        { pos: { x: A.x, y: A.y }, color: RUST, title: 'Sinful Action', text: 'The look becomes a choice.', ref: '“Each person is tempted when he is lured and enticed by his own desire. Then desire when it has conceived gives birth to sin.” (James 1:14-15)', desc: 'The runner stands at the edge of the pit.' },
        { pos: { x: 74, y: 266 }, tilt: -35, fallen: true, color: RUST, title: 'Hide in Shame', text: 'Now you want to cover it up. Sin grows best in the dark, and the pit gets deeper.', ref: '“For everyone who does wicked things hates the light and does not come to the light, lest his works should be exposed.” (John 3:20)', desc: 'The runner tumbles down into the pit.' },
        { pos: pt(-0.27, ON_CROSS), fallen: true, cross: true, color: GOLD, title: 'There Is Still Hope in the Pit', text: 'Jesus died for us while we were still in our sin. Will you respond in humble repentance?', ref: '“I acknowledged my sin to you … and you forgave the iniquity of my sin.” ~ King David\nPsalm 32:5', desc: 'The cross reaches down into the pit, and the runner stands on it, ready to climb out.' }
    ];
    var run = [
        { pos: pt(0.36, ON_CROSS), lit: 1, cross: true, color: GREEN, title: 'R: Remember the Cross', text: 'The cross comes to you. You were bought with a price, the life of God\'s own Son. Grace is free, but it is never cheap.', ref: '1 Corinthians 6:19-20', desc: 'The cross forms along the slope, and the runner steps onto it at the R marker.' },
        { pos: pt(0.53, ON_CROSS), lit: 2, cross: true, color: GREEN, title: 'U: United with God', text: 'Christ is in you, and your body is a temple of the Holy Spirit. Remember He is always with you.', ref: '1 Corinthians 6:19', desc: 'The runner climbs the cross past the U marker.' },
        { pos: pt(0.70, ON_CROSS), buddy: pt(0.61, ON_CROSS), lit: 3, cross: true, color: GREEN, title: 'N: Need Others', text: 'Do not run alone. Run with another believer beside you.', ref: '“flee youthful passions … along with those who call on the Lord” (2 Timothy 2:22)', desc: 'A running partner joins the runner on the cross at the N marker.' },
        { pos: { x: 328, y: 70 }, buddy: { x: 306, y: 78 }, lit: 3, cross: true, life: true, color: GOLD, title: 'Full Life', text: '“The thief comes only to steal and kill and destroy. I came that they may have life and have it abundantly.”', ref: 'John 10:10', desc: 'The runner and a partner reach Full Life at the top of the hill.' }
    ];

    // Build the scene from the slope.
    (function () {
        function set(id, a) { var e = document.getElementById(id); for (var k in a) e.setAttribute(k, a[k]); }
        set('hill', { points: [A.x + ',' + A.y, B.x + ',' + B.y, '360,' + B.y, '360,280', A.x + ',280'].join(' ') });
        set('slope', { points: [A.x + ',' + A.y, B.x + ',' + B.y, '360,' + B.y].join(' ') });
        [['flag-r', 0.36], ['flag-u', 0.53], ['flag-n', 0.70]].forEach(function (f) {
            var c = pt(f[1], -31), g = document.getElementById(f[0]);
            g.querySelector('rect').setAttribute('x', (c.x - 16).toFixed(1)); g.querySelector('rect').setAttribute('y', (c.y - 15).toFixed(1));
            g.querySelector('text').setAttribute('x', c.x.toFixed(1)); g.querySelector('text').setAttribute('y', (c.y + 7).toFixed(1));
        });
        // The post is drawn from the top down, so it reaches down to you.
        var top = pt(1.0, 7), base = pt(-0.32, 7), mid = pt(0.88, 7);
        set('post', { x1: top.x, y1: top.y, x2: base.x, y2: base.y });
        set('beam', { x1: mid.x + N_UP.x * 38, y1: mid.y + N_UP.y * 38, x2: mid.x - N_UP.x * 38, y2: mid.y - N_UP.y * 38 });
        ['post', 'beam'].forEach(function (id) {
            var e = document.getElementById(id), l = Math.hypot(e.x2.baseVal.value - e.x1.baseVal.value, e.y2.baseVal.value - e.y1.baseVal.value);
            e.setAttribute('stroke-dasharray', l.toFixed(1)); e.setAttribute('stroke-dashoffset', l.toFixed(1)); e.dataset.len = l.toFixed(1);
        });
    })();

    var mode = 'intro', idx = 0, pendingFocus = null, anim = null, tilt = 0;
    var cur = { x: START.x, y: START.y }, curB = { x: START.x, y: START.y };
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function el(id) { return document.getElementById(id); }

    function place(p, b) {
        el('runner').setAttribute('transform', 'translate(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ')' + (tilt ? ' rotate(' + tilt + ')' : ''));
        el('you').setAttribute('x', p.x.toFixed(1)); el('you').setAttribute('y', (p.y - 54).toFixed(1));
        el('buddy1').setAttribute('transform', 'translate(' + b.x.toFixed(1) + ',' + b.y.toFixed(1) + ')');
        cur = { x: p.x, y: p.y }; curB = { x: b.x, y: b.y };
    }
    function moveTo(p, b) {
        if (anim) cancelAnimationFrame(anim);
        if (reduceMotion) { place(p, b); return; }
        var from = { x: cur.x, y: cur.y }, fromB = { x: curB.x, y: curB.y }, t0 = null, dur = 700;
        function frame(ts) {
            if (t0 === null) t0 = ts;
            var k = Math.min((ts - t0) / dur, 1), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
            place({ x: from.x + (p.x - from.x) * e, y: from.y + (p.y - from.y) * e }, { x: fromB.x + (b.x - fromB.x) * e, y: fromB.y + (b.y - fromB.y) * e });
            if (k < 1) anim = requestAnimationFrame(frame);
        }
        anim = requestAnimationFrame(frame);
    }
    function showCross(on) {
        ['post', 'beam'].forEach(function (id) {
            var e = el(id);
            e.setAttribute('stroke-dashoffset', on ? '0' : e.dataset.len);
            e.setAttribute('opacity', on ? '1' : '0');
        });
    }
    function paint(s) {
        tilt = s && s.tilt ? s.tilt : 0;
        el('runner').classList.toggle('in-pit', !!(s && s.fallen));
        el('bang').setAttribute('opacity', s && s.bang ? '1' : '0');
        ['flag-r', 'flag-u', 'flag-n'].forEach(function (id, i) {
            el(id).querySelector('rect').setAttribute('fill', s && s.lit > i ? GREEN : '#CFC9BD');
        });
        showCross(!!(s && s.cross));
        el('buddy1').setAttribute('opacity', s && s.buddy ? '1' : '0');
        el('glow').setAttribute('opacity', s && s.life ? '1' : '0.75');
        el('you').setAttribute('opacity', s && (s.fallen || s.life) ? '0' : '1');
        el('scene-desc').textContent = s ? s.desc : 'A runner on a slope. The pit is below to the left. Full Life is at the top of the hill to the right.';
        var p = s ? s.pos : START;
        moveTo(p, s && s.buddy ? s.buddy : pt(0.1, ON_CROSS));
    }
    function setFocus(n) { pendingFocus = n; }
    function applyFocus() {
        if (!pendingFocus) return;
        var t = document.querySelector('[data-control="' + pendingFocus + '"]');
        pendingFocus = null;
        if (t) t.focus();
    }
    function button(label, control, cls, onClick) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = cls; b.setAttribute('data-control', control);
        b.textContent = label; b.addEventListener('click', onClick);
        return b;
    }
    function buildCard(s) {
        var vc = document.createElement('div'); vc.className = 'verse-card';
        var bar = document.createElement('div'); bar.className = 'verse-card-bar'; bar.style.background = s.color; vc.appendChild(bar);
        var c = document.createElement('div'); c.className = 'verse-card-content';
        var t = document.createElement('p'); t.className = 'card-title'; t.style.color = s.color === GREY ? '#5A4E3C' : s.color; t.textContent = s.title; c.appendChild(t);
        var x = document.createElement('p'); x.className = 'card-text'; x.textContent = s.text; c.appendChild(x);
        if (s.ref) { var r = document.createElement('p'); r.className = 'card-ref'; r.textContent = s.ref; c.appendChild(r); }
        vc.appendChild(c);
        return vc;
    }
    // Size every card to the tallest one so the buttons never move.
    function fitCards() {
        var area = el('card-area'), m = document.createElement('div'), max = 0;
        m.id = 'measure'; m.style.width = area.clientWidth + 'px';
        document.documentElement.style.setProperty('--card-h', '0px');
        [tempted].concat(stay, run).forEach(function (s) {
            var w = document.createElement('div'); w.className = 'verse-card-wrapper'; w.appendChild(buildCard(s)); m.appendChild(w);
        });
        document.body.appendChild(m);
        m.querySelectorAll('.verse-card-content').forEach(function (c) { max = Math.max(max, c.offsetHeight); });
        document.body.removeChild(m);
        document.documentElement.style.setProperty('--card-h', Math.max(max, 112) + 'px');
    }

    function go(newMode, newIdx, focus) { mode = newMode; idx = newIdx || 0; if (focus) setFocus(focus); render(); }

    function render() {
        var area = el('card-area');
        area.innerHTML = '';

        if (mode === 'intro') {
            paint(null);
            var wrap = document.createElement('div'); wrap.className = 'begin-wrapper';
            var intro = document.createElement('p'); intro.className = 'begin-text';
            intro.textContent = 'When temptation comes, which way will you go?';
            wrap.appendChild(intro);
            wrap.appendChild(button('Begin \u2192', 'begin', 'begin-btn', function () { go('tempted', 0, 'run'); }));
            area.appendChild(wrap);
            el('status').textContent = '';
            applyFocus();
            return;
        }

        var s = mode === 'tempted' ? tempted : (mode === 'stay' ? stay[idx] : run[idx]);
        paint(s);
        var wrapper = document.createElement('div'); wrapper.className = 'verse-card-wrapper';
        wrapper.appendChild(buildCard(s));
        var nav = document.createElement('div'); nav.className = 'nav-bar';
        var count = document.createElement('span'); count.className = 'step-count';

        if (mode === 'tempted') {
            nav.appendChild(button('Stay and look', 'stay', 'nav-btn danger', function () { go('stay', 0, 'next'); }));
            count.textContent = 'Choose';
            nav.appendChild(count);
            nav.appendChild(button('RUN →', 'run', 'nav-btn primary', function () { go('run', 0, 'next'); }));
        } else if (mode === 'stay') {
            // The pit is on the left, so the stay path moves forward from the left,
            // right where "Stay and look" was tapped. Back sits on the right.
            if (idx < stay.length - 1) nav.appendChild(button('\u2190 Next', 'next', 'nav-btn danger', function () { go('stay', idx + 1, 'next'); }));
            else nav.appendChild(button('Climb out on the cross', 'retry', 'nav-btn primary', function () { go('run', 0, 'next'); }));
            count.textContent = (idx + 1) + ' of ' + stay.length;
            nav.appendChild(count);
            nav.appendChild(button('Back \u2192', 'back', 'nav-btn', function () {
                if (idx === 0) go('tempted', 0, 'stay'); else go('stay', idx - 1, 'back');
            }));
        } else {
            nav.appendChild(button('\u2190 Back', 'back', 'nav-btn', function () {
                if (idx === 0) go('tempted', 0, 'run'); else go('run', idx - 1, 'back');
            }));
            count.textContent = (idx + 1) + ' of ' + run.length;
            nav.appendChild(count);
            if (idx < run.length - 1) nav.appendChild(button('Next \u2192', 'next', 'nav-btn primary', function () { go('run', idx + 1, 'next'); }));
            else nav.appendChild(button('\u21BB Restart', 'restart', 'nav-btn primary', function () { go('intro', 0, 'begin'); }));
        }
        wrapper.appendChild(nav);
        area.appendChild(wrapper);
        el('status').textContent = s.title;
        applyFocus();
    }

    place(START, pt(0.1, ON_CROSS));
    fitCards();
    render();
    var rt = null;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(fitCards, 150); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCards);
</script>
</body>
</html>
