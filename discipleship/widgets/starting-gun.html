<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUN from Sin</title>
<style>
:root {
  --ink: #2C2416;
  --muted: #6E6559;
  --tray: #F6F4EE;
  --border: #EBE5D9;
  --gold: #A8760A;
  --gold-dark: #7D5604;
  --gold-wash: #FCF2D6;
  --green: #1F684A;
  --green-dark: #164E37;
  --green-wash: #E1F1E9;
  --blue: #2A5B7C;
  --blue-dark: #1E435C;
  --blue-wash: #E2EEF6;
  --crimson: #8B1A2B;
  --crimson-dark: #6D1422;
  --crimson-wash: #FBECEF;
  --step-color: #2C2416;
  --step-dark: #2C2416;
  --card-h: 120px;
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.widget-outer {
  background: #FFFFFF;
  border-radius: 0;
  overflow: hidden;
  max-width: 100%;
  width: 100%;
  margin: 0;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
    border: 1px solid var(--border);
    max-width: 460px;
    margin: 0 auto;
  }
}

.title-bar {
  background: #2C2416;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  margin: 0;
  text-align: left;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
  flex-shrink: 0;
}

.stage {
  background: #F4EFE4;
  padding: 4px 5px;
  border-bottom: 1px solid var(--border);
}

svg#scene {
  display: block;
  width: 100%;
  height: auto;
}

.svg-sans {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.flag-btn {
  cursor: pointer;
}

.flag-btn:focus-visible .flag-focus {
  opacity: 1;
}

.flag-focus {
  opacity: 0;
  pointer-events: none;
}

@media (prefers-reduced-motion: no-preference) {
  .widget-outer:not(.is-instant) #sky-shadow,
  .widget-outer:not(.is-instant) #sun-rays,
  .widget-outer:not(.is-instant) #bang,
  .widget-outer:not(.is-instant) #buddy1,
  .widget-outer:not(.is-instant) #you-tag,
  .widget-outer:not(.is-instant) #speed-lines,
  .widget-outer:not(.is-instant) #cross-post,
  .widget-outer:not(.is-instant) #life-aura {
    transition: opacity 0.36s ease;
  }
  .widget-outer:not(.is-instant) .flag-board,
  .widget-outer:not(.is-instant) .flag-badge {
    transition: fill 0.28s ease, stroke 0.28s ease;
  }
  .widget-outer:not(.is-instant) .flag-letter,
  .widget-outer:not(.is-instant) .flag-word {
    transition: fill 0.28s ease;
  }
  .widget-outer:not(.is-instant) #cross-reveal-rect {
    transition: width 0.56s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .widget-outer .step-dot-fill {
    transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }
  .widget-outer .nav-btn.primary,
  .widget-outer .verse-card-bar,
  .widget-outer .card-heading {
    transition: background-color 0.22s ease, border-color 0.22s ease, color 0.22s ease;
  }
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0;
  padding: 4px 4px;
  background: var(--tray);
  border-bottom: 1px solid var(--border);
}

.strip-cue {
  font: 700 9px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  padding: 0 3px;
  user-select: none;
  flex-shrink: 0;
  white-space: nowrap;
}

.strip-cue.pit {
  color: var(--crimson-dark);
}

.strip-cue.run {
  color: var(--green-dark);
}

.strip-divider {
  width: 1px;
  height: 15px;
  background: #D8D1C4;
  margin: 0 2px;
  flex-shrink: 0;
}

.step-dot {
  appearance: none;
  min-width: 28px;
  min-height: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
}

.step-dot-fill {
  width: 12.5px;
  height: 12.5px;
  border-radius: 50%;
  border: 2.2px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
  display: block;
}

.step-dot.is-choice .step-dot-fill {
  width: 14.5px;
  height: 14.5px;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 25%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.18);
}

.card-area {
  background: var(--tray);
  padding: 7px 12px 10px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 2px 12px rgba(44, 36, 22, 0.06);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 10px 13px;
  min-height: var(--card-h, 120px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
}

.card-heading {
  font: 700 15px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0;
}

.card-quote {
  font: 13.5px/1.38 Georgia, Cambria, serif;
  color: var(--ink);
  margin: 0;
}

.card-quote b {
  color: var(--step-dark);
  font-weight: 700;
}

.card-note {
  font: 600 12px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  margin: 0;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  min-height: 44px;
  min-width: 104px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: var(--ink);
  font: 700 13.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FFFFFF;
}

.nav-btn.danger {
  background: var(--crimson-wash);
  border-color: #C9828D;
  color: var(--crimson-dark);
}

.nav-btn.single-begin {
  margin-left: auto;
}

.step-count {
  font: 600 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  text-align: center;
}

button:focus-visible,
[role="button"]:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="widget-outer" id="widget">
  <div class="title-bar">
    <h1>RUN from Sin</h1>
    <span class="course-tag">202-09</span>
  </div>

  <div class="stage">
    <svg id="scene" viewBox="0 0 440 238" role="img" aria-labelledby="scene-title scene-desc">
      <title id="scene-title">RUN from Sin Illustrated Path</title>
      <desc id="scene-desc">A traveler stands on a hillside trail between a dark stone pit on the left and sunrise Full Life at the summit on the right.</desc>
      <defs>
        <clipPath id="stage-clip">
          <rect x="0" y="0" width="440" height="238" rx="8"/>
        </clipPath>
        <clipPath id="cross-reveal-clip">
          <rect id="cross-reveal-rect" x="440" y="0" width="0" height="238"/>
        </clipPath>
        <linearGradient id="sky-warm" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FAF7EE"/>
          <stop offset="65%" stop-color="#FDF8E8"/>
          <stop offset="100%" stop-color="#FFF2CC"/>
        </linearGradient>
        <linearGradient id="sky-dusk" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#DDD6C9"/>
          <stop offset="55%" stop-color="#EAE4D7"/>
          <stop offset="100%" stop-color="#EFEAD9"/>
        </linearGradient>
        <linearGradient id="hill-meadow" x1="0" y1="0" x2="0.8" y2="1">
          <stop offset="0%" stop-color="#E3F2E9"/>
          <stop offset="55%" stop-color="#D7EBDF"/>
          <stop offset="100%" stop-color="#EDF4EF"/>
        </linearGradient>
        <linearGradient id="pit-chasm" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4A4236"/>
          <stop offset="45%" stop-color="#2F281F"/>
          <stop offset="100%" stop-color="#19140E"/>
        </linearGradient>
        <linearGradient id="wood-timber" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C88B49"/>
          <stop offset="45%" stop-color="#8F5C2C"/>
          <stop offset="100%" stop-color="#6B421B"/>
        </linearGradient>
        <radialGradient id="sunrise-halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FCE08B" stop-opacity="0.92"/>
          <stop offset="52%" stop-color="#FCF2D6" stop-opacity="0.52"/>
          <stop offset="100%" stop-color="#FCF2D6" stop-opacity="0"/>
        </radialGradient>
        <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="130%">
          <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#2C2416" flood-opacity="0.16"/>
        </filter>
      </defs>

      <g clip-path="url(#stage-clip)">
        <!-- Base warm sky + dusk shadow sky overlay for Pit path -->
        <rect x="0" y="0" width="440" height="238" fill="url(#sky-warm)"/>
        <rect id="sky-shadow" x="0" y="0" width="440" height="238" fill="url(#sky-dusk)" opacity="0"/>

        <!-- Distant pastoral ridge silhouettes -->
        <path d="M 0 152 Q 66 132 136 144 T 282 104 T 440 72 L 440 238 L 0 238 Z" fill="#EAE3D3" stroke="#C8BFA9" stroke-width="1" opacity="0.72"/>
        <path d="M 110 176 Q 210 138 308 110 Q 372 90 440 82 L 440 238 L 110 238 Z" fill="#DCE8DF" opacity="0.55"/>

        <!-- Full Life Sunrise Crest at top-right -->
        <g id="life-aura" opacity="0.82">
          <circle cx="408" cy="40" r="64" fill="url(#sunrise-halo)"/>
          <g id="sun-rays" stroke="#C48F10" stroke-linecap="round" opacity="0.48">
            <line x1="408" y1="6" x2="408" y2="13" stroke-width="1.8"/>
            <line x1="383" y1="15" x2="388" y2="20" stroke-width="1.6"/>
            <line x1="373" y1="40" x2="380" y2="40" stroke-width="1.8"/>
            <line x1="433" y1="15" x2="428" y2="20" stroke-width="1.6"/>
          </g>
          <circle cx="408" cy="40" r="21" fill="#FCF2D6" stroke="#C48F10" stroke-width="1.3"/>
          <circle cx="408" cy="40" r="13.5" fill="#F2C85B"/>
        </g>

        <!-- Summit olive grove silhouettes -->
        <g opacity="0.72">
          <line x1="422" y1="54" x2="422" y2="42" stroke="#5E4D36" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="422" cy="39" r="6.5" fill="#BBD6C3" stroke="#2E7D5B" stroke-width="1"/>
          <line x1="376" y1="54" x2="376" y2="45" stroke="#5E4D36" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="376" cy="42.5" r="5" fill="#C9DFCF" stroke="#2E7D5B" stroke-width="0.9"/>
        </g>

        <!-- Full Life Crest Herald Badge -->
        <g transform="translate(316, 18)" filter="url(#card-shadow)">
          <rect x="-42" y="-11" width="84" height="22" rx="11" fill="#FCF2D6" stroke="#C48F10" stroke-width="1.4"/>
          <text x="0" y="3.5" text-anchor="middle" class="svg-sans" font-weight="800" font-size="10.2" letter-spacing="0.9" fill="#7D5604">FULL LIFE</text>
        </g>

        <!-- Rising Green Meadow Hill & Trail -->
        <polygon id="hill" fill="url(#hill-meadow)"/>
        <path d="M 122 238 Q 252 156 440 100 L 440 238 Z" fill="#C7E0D0" opacity="0.45"/>

        <!-- Organic meadow tufts on slope -->
        <g fill="none" stroke="#3F8564" stroke-width="1.2" stroke-linecap="round" opacity="0.48">
          <path d="M 164 198 L 162 192 M 164 198 L 166 193"/>
          <path d="M 288 188 L 286 182 M 288 188 L 291 183"/>
          <path d="M 380 124 L 378 118 M 380 124 L 383 119"/>
        </g>

        <!-- Rugged Rocky Pit Chasm on Left -->
        <g id="pit-landscape">
          <!-- Outer stone cliff strata around chasm -->
          <path d="M 0 166 L 14 166 L 26 218 L 100 218 L 122 174 L 122 238 L 0 238 Z" fill="#D5CCB9"/>
          <path d="M 0 184 L 18 222 L 104 222 L 122 194 L 122 238 L 0 238 Z" fill="#BEB39D"/>
          <!-- Deep Pit Interior -->
          <path d="M 10 168 L 23 216 L 99 216 L 119 174 L 114 168 L 106 173 L 100 169 Z" fill="url(#pit-chasm)"/>
          <!-- Craggy inner cavern ledges and depth lines -->
          <path d="M 16 182 L 32 186 L 44 182 M 86 188 L 106 184 M 28 202 L 94 202" fill="none" stroke="#53493B" stroke-width="1.1" opacity="0.65" stroke-linecap="round"/>
          <!-- Crumbling pit edge cracks & dry bramble on left rim -->
          <path d="M 4 166 L 15 166 L 20 173 M 114 173 L 122 174 L 126 172" fill="none" stroke="#5E5447" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 118 175 L 113 181 M 119 175 L 122 182" fill="none" stroke="#5E5447" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
          <path d="M 8 166 Q 5 159 10 155 M 8 166 Q 12 160 14 157" fill="none" stroke="#7A6D5B" stroke-width="1.2" stroke-linecap="round"/>
        </g>

        <!-- THE PIT Pill Anchor cleanly above rocky chasm -->
        <g transform="translate(50, 138)" filter="url(#card-shadow)">
          <rect x="-32" y="-10.5" width="64" height="21" rx="10.5" fill="#FFFFFF" stroke="#9C9283" stroke-width="1.2"/>
          <text x="0" y="3.5" text-anchor="middle" class="svg-sans" font-weight="800" font-size="10.2" letter-spacing="0.8" fill="#4A4238">THE PIT</text>
        </g>

        <!-- Meadow Trail Line from Pit Rim A=(122, 174) up to Summit B=(358, 54) .. (440, 54) -->
        <polyline id="slope-trail" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.78"/>
        <polyline id="slope" fill="none" stroke="#1F684A" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- R, U, N Trailside Milepost Signboards planted below the hillside -->
        <g class="flag-btn" id="flag-r" tabindex="0" role="button" aria-label="Jump to R: Remember the Cross">
          <line class="flag-stem" stroke="#9E9484" stroke-width="1.8" stroke-linecap="round"/>
          <rect class="flag-focus" width="74" height="30" rx="10" fill="none" stroke="#E0A526" stroke-width="2.5"/>
          <rect class="flag-board" width="68" height="24" rx="8" fill="#FFFFFF" stroke="#B8AFA0" stroke-width="1.5"/>
          <circle class="flag-badge" cx="0" cy="0" r="8.5" fill="#EDE9E0"/>
          <text class="flag-letter svg-sans" text-anchor="middle" font-weight="800" font-size="10.5" fill="#6E6559">R</text>
          <text class="flag-word svg-sans" text-anchor="middle" font-weight="700" font-size="8.2" letter-spacing="0.4" fill="#6E6559">GRACE</text>
        </g>

        <g class="flag-btn" id="flag-u" tabindex="0" role="button" aria-label="Jump to U: United with God">
          <line class="flag-stem" stroke="#9E9484" stroke-width="1.8" stroke-linecap="round"/>
          <rect class="flag-focus" width="74" height="30" rx="10" fill="none" stroke="#E0A526" stroke-width="2.5"/>
          <rect class="flag-board" width="68" height="24" rx="8" fill="#FFFFFF" stroke="#B8AFA0" stroke-width="1.5"/>
          <circle class="flag-badge" cx="0" cy="0" r="8.5" fill="#EDE9E0"/>
          <text class="flag-letter svg-sans" text-anchor="middle" font-weight="800" font-size="10.5" fill="#6E6559">U</text>
          <text class="flag-word svg-sans" text-anchor="middle" font-weight="700" font-size="8.2" letter-spacing="0.4" fill="#6E6559">SPIRIT</text>
        </g>

        <g class="flag-btn" id="flag-n" tabindex="0" role="button" aria-label="Jump to N: Need Others">
          <line class="flag-stem" stroke="#9E9484" stroke-width="1.8" stroke-linecap="round"/>
          <rect class="flag-focus" width="74" height="30" rx="10" fill="none" stroke="#E0A526" stroke-width="2.5"/>
          <rect class="flag-board" width="68" height="24" rx="8" fill="#FFFFFF" stroke="#B8AFA0" stroke-width="1.5"/>
          <circle class="flag-badge" cx="0" cy="0" r="8.5" fill="#EDE9E0"/>
          <text class="flag-letter svg-sans" text-anchor="middle" font-weight="800" font-size="10.5" fill="#6E6559">N</text>
          <text class="flag-word svg-sans" text-anchor="middle" font-weight="700" font-size="8.2" letter-spacing="0.4" fill="#6E6559">OTHERS</text>
        </g>

        <!-- Handcrafted Timber Cross Bridge reaching from Summit down into The Pit -->
        <g clip-path="url(#cross-reveal-clip)">
          <g id="cross-post" opacity="0">
            <!-- Luminous Gold Double Hairline Aura -->
            <line id="cross-glow" stroke="#F6DC92" stroke-width="15" stroke-linecap="round" opacity="0.7"/>
            <line id="cross-beam-glow" stroke="#F6DC92" stroke-width="15" stroke-linecap="round" opacity="0.7"/>
            <!-- Outer timber frame & warm oak beams -->
            <line id="cross-upright-rim" stroke="#5C3717" stroke-width="9.5" stroke-linecap="round"/>
            <line id="cross-arm-rim" stroke="#5C3717" stroke-width="9.5" stroke-linecap="round"/>
            <line id="cross-upright-wood" stroke="url(#wood-timber)" stroke-width="6.6" stroke-linecap="round"/>
            <line id="cross-arm-wood" stroke="#9B6735" stroke-width="6.6" stroke-linecap="round"/>
            <!-- Sunlit top edge highlight along bridge beam -->
            <line id="cross-upright-hi" stroke="#DFAC68" stroke-width="1.8" stroke-linecap="round" opacity="0.88"/>
            <line id="cross-arm-hi" stroke="#DFAC68" stroke-width="1.6" stroke-linecap="round" opacity="0.72"/>
            <!-- Timber joinery cap at intersection -->
            <circle id="cross-joint" r="4.8" fill="#7D5026" stroke="#5C3717" stroke-width="1.2"/>
          </g>
        </g>

        <!-- Temptation Knock Callout -->
        <g id="bang" opacity="0" filter="url(#card-shadow)">
          <line x1="154" y1="68" x2="154" y2="96" stroke="#A32D3F" stroke-width="1.8" stroke-dasharray="3 3" stroke-linecap="round"/>
          <rect x="92" y="42" width="126" height="26" rx="13" fill="#FBECEF" stroke="#8B1A2B" stroke-width="1.8"/>
          <circle cx="107" cy="55" r="8" fill="#8B1A2B"/>
          <text x="107" y="59" text-anchor="middle" class="svg-sans" font-weight="800" font-size="11.5" fill="#FFFFFF">!</text>
          <text x="163" y="59" text-anchor="middle" class="svg-sans" font-weight="700" font-size="11.5" fill="#6D1422">Temptation</text>
        </g>

        <!-- Motion Streak Trails behind runner during RUN path -->
        <g id="speed-lines" opacity="0" fill="none" stroke="#1F684A" stroke-width="1.6" stroke-linecap="round">
          <line x1="-26" y1="-22" x2="-15" y2="-22" opacity="0.55"/>
          <line x1="-30" y1="-15" x2="-17" y2="-15" opacity="0.38"/>
          <line x1="-24" y1="-8" x2="-14" y2="-8" opacity="0.45"/>
        </g>

        <!-- Running Partner (Harbour Blue illustrated runner, feet anchored at (0,0)) -->
        <g id="buddy1" opacity="0">
          <ellipse cx="0" cy="1.5" rx="9" ry="2.5" fill="#2C2416" opacity="0.18"/>
          <!-- Back leg + front stride leg -->
          <path d="M -2 -14 L -7 -5 L -11 -2" fill="none" stroke="#1E435C" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 2 -14 L 7 -6 L 6 0" fill="none" stroke="#2A5B7C" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Back arm + front arm -->
          <path d="M -1 -23 L -7 -16" fill="none" stroke="#1E435C" stroke-width="3.2" stroke-linecap="round"/>
          <!-- Sculpted leaning tunic torso -->
          <path d="M -4 -26 C -1 -27 4 -26 6 -23 L 4 -12 L -3 -12 Z" fill="#2A5B7C" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M 3 -23 L 10 -17" fill="none" stroke="#3B6F91" stroke-width="3.2" stroke-linecap="round"/>
          <!-- Head + hair crest -->
          <circle cx="3" cy="-32" r="5" fill="#2A5B7C" stroke="#FFFFFF" stroke-width="1.3"/>
        </g>

        <!-- Primary Traveler ("YOU", feet anchored at (0,0), poses dynamically swap) -->
        <g id="runner">
          <ellipse cx="0" cy="1.5" rx="9.5" ry="2.7" fill="#2C2416" opacity="0.2"/>
          <!-- Pose A: Forward Stride / Running -->
          <g id="pose-run">
            <path class="r-leg-back" d="M -2 -14 L -8 -5 L -12 -2" fill="none" stroke="#164E37" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round"/>

<script>
(function () {
  var GREEN = '#1F684A', GREEN_DARK = '#164E37';
  var CRIMSON = '#8B1A2B', CRIMSON_DARK = '#6D1422';
  var GOLD = '#A8760A', GOLD_DARK = '#7D5604';
  var INK = '#2C2416';

  var A = { x: 122, y: 174 };
  var B = { x: 358, y: 54 };
  var DX = B.x - A.x, DY = B.y - A.y;
  var LEN = Math.hypot(DX, DY);
  var U = { x: DX / LEN, y: DY / LEN };
  var N_UP = { x: U.y, y: -U.x };

  function pt(t, off) {
    off = off || 0;
    return { x: A.x + DX * t + N_UP.x * off, y: A.y + DY * t + N_UP.y * off };
  }

  var ON_CROSS = 7;
  var START = pt(0.14);

  var INTRO = {
    mode: 'intro', idx: 0,
    pos: START, bang: false, lit: 0, cross: false, buddy: null, life: false, fallen: false,
    darkSky: false, speed: false, crouch: false,
    tint: GREEN, shade: GREEN_DARK,
    color: INK, dark: INK,
    heading: 'When Temptation Knocks',
    quoteHtml: '<b>A tempting thought knocks at the door.</b> Lust opens it and invites it to stay. Trace both paths in the moment of choice.',
    note: 'Matthew 5:27-28  |  1 Corinthians 6:18-20',
    desc: 'You stand near the bottom of a hillside trail between The Pit on the left and sunrise Full Life at the summit.'
  };

  var TEMPTED = {
    mode: 'tempted', idx: 0,
    pos: START, bang: true, lit: 0, cross: false, buddy: null, life: false, fallen: false,
    darkSky: true, speed: false, crouch: false,
    tint: CRIMSON, shade: CRIMSON_DARK,
    color: CRIMSON, dark: CRIMSON_DARK,
    heading: 'Temptation Arrives',
    quoteHtml: '"<b>Watch and pray</b> that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak."',
    note: 'Matthew 26:41  |  What will you do at the first knock?',
    desc: 'Temptation knocks above you on the trail. Stay and look toward The Pit, or RUN up the hill toward Full Life.'
  };

  var STAY = [
    {
      mode: 'stay', idx: 0,
      pos: pt(0.06), bang: false, lit: 0, cross: false, buddy: null, life: false, fallen: false,
      darkSky: true, speed: false, crouch: false,
      tint: CRIMSON, shade: CRIMSON_DARK,
      color: CRIMSON, dark: CRIMSON_DARK,
      heading: '1. Look and Linger',
      quoteHtml: '"<b>Keep your way far from her,</b> and do not go near the door of her house."',
      note: 'Proverbs 5:8  |  Staying near the door lets sinful thoughts grow.',
      desc: 'Instead of running, you step closer toward the edge of The Pit.'
    },
    {
      mode: 'stay', idx: 1,
      pos: { x: A.x - 4, y: A.y + 1 }, bang: false, lit: 0, cross: false, buddy: null, life: false, fallen: false,
      darkSky: true, speed: false, crouch: false,
      tint: CRIMSON, shade: CRIMSON_DARK,
      color: CRIMSON, dark: CRIMSON_DARK,
      heading: '2. Sinful Action',
      quoteHtml: '"Each person is tempted when he is lured and enticed by his own desire. Then desire when it has conceived <b>gives birth to sin.</b>"',
      note: 'James 1:14-15  |  The lingering look becomes a choice.',
      desc: 'You stand on the crumbling lip of The Pit.'
    },
    {
      mode: 'stay', idx: 2,
      pos: { x: 65, y: 211 }, bang: false, lit: 0, cross: false, buddy: null, life: false, fallen: true,
      darkSky: true, speed: false, crouch: true,
      tint: CRIMSON, shade: CRIMSON_DARK,
      color: CRIMSON, dark: CRIMSON_DARK,
      heading: '3. Hide in Shame',
      quoteHtml: '"For everyone who does wicked things <b>hates the light and does not come to the light,</b> lest his works should be exposed."',
      note: 'John 3:20  |  Sin grows best in secrecy, and The Pit gets deeper.',
      desc: 'You crouch down in the dark shadow of The Pit and try to hide.'
    },
    {
      mode: 'stay', idx: 3,
      pos: pt(-0.22, ON_CROSS), bang: false, lit: 0, cross: true, buddy: null, life: false, fallen: true,
      darkSky: false, speed: false, crouch: false,
      tint: GOLD, shade: GOLD_DARK,
      color: GOLD, dark: GOLD_DARK,
      heading: '4. Still Hope in the Pit',
      quoteHtml: '"<b>I acknowledged my sin to you,</b> and I did not cover my iniquity ... and you forgave the iniquity of my sin."',
      note: 'Psalm 32:5  |  Jesus came down into The Pit. Step onto the Cross.',
      desc: 'The Cross bridge reaches down into The Pit, ready to lift you out.'
    }
  ];

  var RUN = [
    {
      mode: 'run', idx: 0,
      pos: pt(0.24, ON_CROSS), bang: false, lit: 1, cross: true, buddy: null, life: false, fallen: false,
      darkSky: false, speed: true, crouch: false,
      tint: GREEN, shade: GREEN_DARK,
      color: GREEN, dark: GREEN_DARK,
      heading: 'R: Remember the Cross',
      quoteHtml: '"<b>You are not your own, for you were bought with a price.</b> So glorify God in your body."',
      note: '1 Corinthians 6:19-20  |  Grace sets you free to run, not stay in sin.',
      desc: 'The Cross spans the slope and lifts you past the R (Grace) signpost.'
    },
    {
      mode: 'run', idx: 1,
      pos: pt(0.42, ON_CROSS), bang: false, lit: 2, cross: true, buddy: null, life: false, fallen: false,
      darkSky: false, speed: true, crouch: false,
      tint: GREEN, shade: GREEN_DARK,
      color: GREEN, dark: GREEN_DARK,
      heading: 'U: United with God',
      quoteHtml: '"Do you not know that <b>your body is a temple of the Holy Spirit within you,</b> whom you have from God?"',
      note: '1 Corinthians 6:19  |  You never fight alone. God\'s power lives in you.',
      desc: 'Strengthened by the Spirit within, you stride past the U signpost.'
    },
    {
      mode: 'run', idx: 2,
      pos: pt(0.60, ON_CROSS), bang: false, lit: 3, cross: true, buddy: pt(0.50, ON_CROSS), life: false, fallen: false,
      darkSky: false, speed: true, crouch: false,
      tint: GREEN, shade: GREEN_DARK,
      color: GREEN, dark: GREEN_DARK,
      heading: 'N: Need Others',
      quoteHtml: '"So flee youthful passions and pursue righteousness, faith, love, and peace, <b>along with those who call on the Lord</b> from a pure heart."',
      note: '2 Timothy 2:22  |  Do not run in secret. Run beside a trusted believer.',
      desc: 'A trusted running partner joins beside you past the N signpost.'
    },
    {
      mode: 'run', idx: 3,
      pos: { x: 394, y: 54 }, bang: false, lit: 3, cross: true, buddy: { x: 370, y: 56 }, life: true, fallen: false,
      darkSky: false, speed: false, crouch: false,
      tint: GOLD, shade: GOLD_DARK,
      color: GOLD, dark: GOLD_DARK,
      heading: 'Full Life in Christ',
      quoteHtml: '"The thief comes only to steal and kill and destroy. I came that they may <b>have life and have it abundantly.</b>"',
      note: 'John 10:10  |  Purity protects a heart that already belongs to Him.',
      desc: 'You and your running partner arrive together in Full Life at sunrise.'
    }
  ];

  var ALL_STATES = [INTRO, TEMPTED].concat(STAY, RUN);
  var host = document.getElementById('widget');
  var reducedMotionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

  function el(id) { return document.getElementById(id); }

  function setAttrs(elem, attrs) {
    for (var k in attrs) elem.setAttribute(k, attrs[k]);
  }

  // Build hillside trail, planted signposts, and timber Cross geometry from slope coordinates
  (function initGeometry() {
    setAttrs(el('hill'), {
      points: [A.x + ',' + A.y, B.x + ',' + B.y, '440,' + B.y, '440,238', A.x + ',238'].join(' ')
    });
    var trailPts = [A.x + ',' + A.y, B.x + ',' + B.y, '440,' + B.y].join(' ');
    setAttrs(el('slope-trail'), { points: trailPts });
    setAttrs(el('slope'), { points: trailPts });

    [['flag-r', 0.21, -34], ['flag-u', 0.415, -34], ['flag-n', 0.62, -34]].forEach(function (spec) {
      var g = el(spec[0]);
      var ground = pt(spec[1], 0);
      var c = pt(spec[1], spec[2]);
      setAttrs(g.querySelector('.flag-stem'), {
        x1: ground.x.toFixed(1), y1: (ground.y + 1).toFixed(1),
        x2: (c.x - 4).toFixed(1), y2: (c.y - 11).toFixed(1)
      });
      setAttrs(g.querySelector('.flag-focus'), { x: (c.x - 37).toFixed(1), y: (c.y - 15).toFixed(1) });
      setAttrs(g.querySelector('.flag-board'), { x: (c.x - 34).toFixed(1), y: (c.y - 12).toFixed(1) });
      setAttrs(g.querySelector('.flag-badge'), { cx: (c.x - 20.5).toFixed(1), cy: c.y.toFixed(1) });
      setAttrs(g.querySelector('.flag-letter'), { x: (c.x - 20.5).toFixed(1), y: (c.y + 3.6).toFixed(1) });
      setAttrs(g.querySelector('.flag-word'), { x: (c.x + 10.5).toFixed(1), y: (c.y + 2.9).toFixed(1) });
    });

    var top = pt(0.95, 3), base = pt(-0.26, 3), mid = pt(0.77, 3);
    var topHi = pt(0.95, 5.1), baseHi = pt(-0.26, 5.1);
    var arm1 = { x: mid.x + N_UP.x * 32, y: mid.y + N_UP.y * 32 };
    var arm2 = { x: mid.x - N_UP.x * 32, y: mid.y - N_UP.y * 32 };
    var armHi1 = { x: arm1.x + U.x * 1.6, y: arm1.y + U.y * 1.6 };
    var armHi2 = { x: arm2.x + U.x * 1.6, y: arm2.y + U.y * 1.6 };

    ['cross-glow', 'cross-upright-rim', 'cross-upright-wood'].forEach(function (id) {
      setAttrs(el(id), { x1: top.x.toFixed(1), y1: top.y.toFixed(1), x2: base.x.toFixed(1), y2: base.y.toFixed(1) });
    });
    ['cross-beam-glow', 'cross-arm-rim', 'cross-arm-wood'].forEach(function (id) {
      setAttrs(el(id), { x1: arm1.x.toFixed(1), y1: arm1.y.toFixed(1), x2: arm2.x.toFixed(1), y2: arm2.y.toFixed(1) });
    });
    setAttrs(el('cross-upright-hi'), { x1: topHi.x.toFixed(1), y1: topHi.y.toFixed(1), x2: baseHi.x.toFixed(1), y2: baseHi.y.toFixed(1) });
    setAttrs(el('cross-arm-hi'), { x1: armHi1.x.toFixed(1), y1: armHi1.y.toFixed(1), x2: armHi2.x.toFixed(1), y2: armHi2.y.toFixed(1) });
    setAttrs(el('cross-joint'), { cx: mid.x.toFixed(1), cy: mid.y.toFixed(1) });
  })();

  var curPos = { x: START.x, y: START.y };
  var curBuddy = { x: START.x, y: START.y };
  var anim = null;
  var pendingFocus = null;

  function place(p, b) {
    el('runner').setAttribute('transform', 'translate(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ')');
    el('speed-lines').setAttribute('transform', 'translate(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ')');
    el('you-tag').setAttribute('transform', 'translate(' + p.x.toFixed(1) + ',' + (p.y - 42).toFixed(1) + ')');
    el('buddy1').setAttribute('transform', 'translate(' + b.x.toFixed(1) + ',' + b.y.toFixed(1) + ')');
    curPos = { x: p.x, y: p.y };
    curBuddy = { x: b.x, y: b.y };
  }

  function stopAnim() {
    if (anim) {
      cancelAnimationFrame(anim);
      anim = null;
    }
  }

  function moveTo(targetPos, targetBuddy, instant) {
    stopAnim();
    if (instant || reducedMotionQuery.matches) {
      place(targetPos, targetBuddy);
      return;
    }
    var fromP = { x: curPos.x, y: curPos.y };
    var fromB = { x: curBuddy.x, y: curBuddy.y };
    var t0 = null;
    var dur = 500;
    function frame(ts) {
      if (t0 === null) t0 = ts;
      var k = Math.min((ts - t0) / dur, 1);
      var e = 1 - Math.pow(1 - k, 3);
      place(
        { x: fromP.x + (targetPos.x - fromP.x) * e, y: fromP.y + (targetPos.y - fromP.y) * e },
        { x: fromB.x + (targetBuddy.x - fromB.x) * e, y: fromB.y + (targetBuddy.y - fromB.y) * e }
      );
      if (k < 1) {
        anim = requestAnimationFrame(frame);
      } else {
        anim = null;
      }
    }
    anim = requestAnimationFrame(frame);
  }

  function paintScene(s, instant) {
    host.classList.toggle('is-instant', !!(instant || reducedMotionQuery.matches));

    var poseRun = el('pose-run');
    var poseCrouch = el('pose-crouch');
    poseRun.setAttribute('opacity', s.crouch ? '0' : '1');
    poseCrouch.setAttribute('opacity', s.crouch ? '1' : '0');

    poseRun.querySelector('.r-torso').setAttribute('fill', s.tint);
    poseRun.querySelector('.r-head').setAttribute('fill', s.tint);
    poseRun.querySelector('.r-leg-front').setAttribute('stroke', s.tint);
    poseRun.querySelector('.r-leg-back').setAttribute('stroke', s.shade);
    poseRun.querySelector('.r-arm-back').setAttribute('stroke', s.shade);
    poseRun.querySelector('.r-arm-front').setAttribute('stroke', s.tint);

    el('sky-shadow').setAttribute('opacity', s.darkSky ? '0.68' : '0');
    el('sun-rays').setAttribute('opacity', s.life ? '0.95' : (s.darkSky ? '0.18' : '0.52'));
    el('life-aura').setAttribute('opacity', s.life ? '1' : (s.darkSky ? '0.42' : '0.82'));

    el('bang').setAttribute('opacity', s.bang ? '1' : '0');
    el('buddy1').setAttribute('opacity', s.buddy ? '1' : '0');
    el('speed-lines').setAttribute('opacity', s.speed ? '0.85' : '0');
    el('you-tag').setAttribute('opacity', (s.fallen || s.life) ? '0' : '1');
    el('you-tag').querySelector('rect').setAttribute('stroke', s.tint);
    el('you-tag').querySelector('text').setAttribute('fill', s.shade);

    ['flag-r', 'flag-u', 'flag-n'].forEach(function (id, i) {
      var lit = s.lit > i;
      var g = el(id);
      g.querySelector('.flag-board').setAttribute('fill', lit ? '#E1F1E9' : '#FFFFFF');
      g.querySelector('.flag-board').setAttribute('stroke', lit ? GREEN : '#B8AFA0');
      g.querySelector('.flag-badge').setAttribute('fill', lit ? GREEN : '#EDE9E0');
      g.querySelector('.flag-letter').setAttribute('fill', lit ? '#FFFFFF' : '#6E6559');
      g.querySelector('.flag-word').setAttribute('fill', lit ? GREEN_DARK : '#6E6559');
    });

    el('cross-post').setAttribute('opacity', s.cross ? '1' : '0');
    setAttrs(el('cross-reveal-rect'), s.cross ? { x: '0', width: '440' } : { x: '440', width: '0' });

    el('scene-desc').textContent = s.desc;
    var bPos = s.buddy ? s.buddy : pt(0.24, ON_CROSS);
    moveTo(s.pos, bPos, instant);
  }

  var strip = el('step-strip');
  var dotRefs = [];

  var cuePit = document.createElement('span');
  cuePit.className = 'strip-cue pit';
  cuePit.textContent = '\u2190 Pit';
  strip.appendChild(cuePit);

  function addDot(state, label, color, extraClass) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'step-dot' + (extraClass ? ' ' + extraClass : '');
    btn.style.setProperty('--dot-color', color);
    btn.setAttribute('aria-label', label);
    btn.setAttribute('aria-pressed', 'false');
    var fill = document.createElement('span');
    fill.className = 'step-dot-fill';
    btn.appendChild(fill);
    btn.addEventListener('click', function () {
      go(state, null, false);
    });
    strip.appendChild(btn);
    dotRefs.push({ btn: btn, state: state });
  }

  for (var si = STAY.length - 1; si >= 0; si--) {
    addDot(STAY[si], STAY[si].heading, STAY[si].color);
  }
  var divL = document.createElement('span');
  divL.className = 'strip-divider';
  strip.appendChild(divL);

  addDot(TEMPTED, 'Choice: Temptation Arrives', CRIMSON, 'is-choice');

  var divR = document.createElement('span');
  divR.className = 'strip-divider';
  strip.appendChild(divR);

  for (var ri = 0; ri < RUN.length; ri++) {
    addDot(RUN[ri], RUN[ri].heading, RUN[ri].color);
  }

  var cueRun = document.createElement('span');
  cueRun.className = 'strip-cue run';
  cueRun.textContent = 'RUN \u2192';
  strip.appendChild(cueRun);

  function updateDots(s) {
    dotRefs.forEach(function (ref) {
      var active = ref.state === s;
      var passed = false;
      if (s.mode === 'stay' && ref.state.mode === 'stay' && ref.state.idx < s.idx) passed = true;
      if (s.mode === 'run' && ref.state.mode === 'run' && ref.state.idx < s.idx) passed = true;
      if ((s.mode === 'stay' || s.mode === 'run') && ref.state === TEMPTED) passed = true;
      ref.btn.classList.toggle('active', active);
      ref.btn.classList.toggle('passed', passed);
      ref.btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
  }

  function makeBtn(label, control, cls, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = cls;
    b.setAttribute('data-control', control);
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  var cardArea = el('card-area');
  var cardEl = document.createElement('div');
  cardEl.className = 'verse-card';
  var barEl = document.createElement('div');
  barEl.className = 'verse-card-bar';
  var contentEl = document.createElement('div');
  contentEl.className = 'verse-card-content';
  var headingEl = document.createElement('p');
  headingEl.className = 'card-heading';
  var quoteEl = document.createElement('p');
  quoteEl.className = 'card-quote';
  var noteEl = document.createElement('p');
  noteEl.className = 'card-note';
  contentEl.appendChild(headingEl);
  contentEl.appendChild(quoteEl);
  contentEl.appendChild(noteEl);
  cardEl.appendChild(barEl);
  cardEl.appendChild(contentEl);

  var navEl = document.createElement('div');
  navEl.className = 'nav-bar';

  cardArea.appendChild(cardEl);
  cardArea.appendChild(navEl);

  var measuredWidth = 0;
  function fitCardHeight() {
    if (!contentEl || contentEl.clientWidth === measuredWidth) return;
    measuredWidth = contentEl.clientWidth;
    var keepH = headingEl.textContent;
    var keepQ = quoteEl.innerHTML;
    var keepN = noteEl.textContent;
    var tallest = 0;
    document.documentElement.style.setProperty('--card-h', '0px');
    ALL_STATES.forEach(function (st) {
      headingEl.textContent = st.heading;
      quoteEl.innerHTML = st.quoteHtml;
      noteEl.textContent = st.note;
      tallest = Math.max(tallest, contentEl.offsetHeight);
    });
    headingEl.textContent = keepH;
    quoteEl.innerHTML = keepQ;
    noteEl.textContent = keepN;
    document.documentElement.style.setProperty('--card-h', Math.max(tallest, 116) + 'px');
  }

  function renderNav(s) {
    navEl.innerHTML = '';
    var count = document.createElement('span');
    count.className = 'step-count';

    if (s.mode === 'intro') {
      count.textContent = 'Moment of Choice';
      navEl.appendChild(count);
      navEl.appendChild(makeBtn('Begin \u2192', 'begin', 'nav-btn primary begin-btn single-begin', function () {
        go(TEMPTED, 'run', false);
      }));
    } else if (s.mode === 'tempted') {
      navEl.appendChild(makeBtn('Stay and look', 'stay', 'nav-btn danger', function () {
        go(STAY[0], 'next', false);
      }));
      count.textContent = 'Choose';
      navEl.appendChild(count);
      navEl.appendChild(makeBtn('RUN \u2192', 'run', 'nav-btn primary', function () {
        go(RUN[0], 'next', false);
      }));
    } else if (s.mode === 'stay') {
      if (s.idx < STAY.length - 1) {
        navEl.appendChild(makeBtn('\u2190 Next', 'next', 'nav-btn danger', function () {
          go(STAY[s.idx + 1], 'next', false);
        }));
      } else {
        navEl.appendChild(makeBtn('Climb out \u2192', 'retry', 'nav-btn primary', function () {
          go(RUN[0], 'next', false);
        }));
      }
      count.textContent = 'Pit ' + (s.idx + 1) + ' of ' + STAY.length;
      navEl.appendChild(count);
      navEl.appendChild(makeBtn('Back \u2192', 'back', 'nav-btn', function () {
        if (s.idx === 0) go(TEMPTED, 'stay', false);
        else go(STAY[s.idx - 1], 'back', false);
      }));
    } else {
      navEl.appendChild(makeBtn('\u2190 Back', 'back', 'nav-btn', function () {
        if (s.idx === 0) go(TEMPTED, 'run', false);
        else go(RUN[s.idx - 1], 'back', false);
      }));
      count.textContent = 'RUN ' + (s.idx + 1) + ' of ' + RUN.length;
      navEl.appendChild(count);
      if (s.idx < RUN.length - 1) {
        navEl.appendChild(makeBtn('Next \u2192', 'next', 'nav-btn primary', function () {
          go(RUN[s.idx + 1], 'next', false);
        }));
      } else {
        navEl.appendChild(makeBtn('\u21BB Start Over', 'restart', 'nav-btn primary', function () {
          go(INTRO, 'begin', false);
        }));
      }
    }
  }

  function applyFocus() {
    if (!pendingFocus) return;
    var target = navEl.querySelector('[data-control="' + pendingFocus + '"]');
    pendingFocus = null;
    if (target) target.focus();
  }

  function go(nextState, focusControl, instant) {
    pendingFocus = focusControl || null;
    document.documentElement.style.setProperty('--step-color', nextState.color);
    document.documentElement.style.setProperty('--step-dark', nextState.dark);
    headingEl.textContent = nextState.heading;
    quoteEl.innerHTML = nextState.quoteHtml;
    noteEl.textContent = nextState.note;
    paintScene(nextState, instant);
    updateDots(nextState);
    renderNav(nextState);
    el('status').textContent = nextState.heading;
    applyFocus();
  }

  [['flag-r', 0], ['flag-u', 1], ['flag-n', 2]].forEach(function (item) {
    var flag = el(item[0]);
    var target = RUN[item[1]];
    flag.addEventListener('click', function () { go(target, 'next', false); });
    flag.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        go(target, 'next', false);
      }
    });
  });

  var resizeTimer = null;
  var lastWidth = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastWidth) return;
    lastWidth = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCardHeight, 120);
  });

  place(START, pt(0.24, ON_CROSS));
  go(INTRO, null, true);
  fitCardHeight();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitCardHeight);
  }
})();
</script>
</body>
</html>
