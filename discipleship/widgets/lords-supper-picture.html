<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What the Table Pictures</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --ink: #2C2416;
  --muted: #6E6557;
  --border: #EBE5D9;
  --tray: #F6F4EE;
  --bg: #F8F6F1;

  /* Exact Monochrome Ink State */
  --bw-hi: #FAF9F6;
  --bw-light: #EDEBE5;
  --bw-mid: #D3CFC6;
  --bw-dark: #8A8479;
  --bw-stroke: #2C2416;

  /* Color Pair 1: Broken Bread = Given Body */
  --flesh-hi: #F4D7B5;
  --flesh-light: #E2B484;
  --flesh-mid: #C78950;
  --flesh-stroke: #7E481D;
  --bread-accent: #A96224;
  --bread-dark: #874C19;

  /* Color Pair 2: Poured Wine = Shed Blood */
  --crimson: #9B1C2E;
  --crimson-hi: #BD2C41;
  --crimson-dark: #6D1220;

  /* Finale Union Accent */
  --union: #2C2416;
}

body {
  font-family: Georgia, Cambria, serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  margin: 0;
  padding: 0;
}

.widget-outer {
  background: #FFFFFF;
  width: 100%;
  max-width: 100%;
  margin: 0;
  overflow: hidden;
  border: none;
  border-radius: 0;
  box-shadow: none;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: var(--bg);
  }
  .widget-outer {
    max-width: 460px;
    margin: 0 auto;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
  }
}

.title-bar {
  background: var(--ink);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  text-align: left;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  background: #FFFFFF;
  padding: 6px 6px 2px;
}

#supper-svg {
  display: block;
  width: 100%;
  height: auto;
}

.svg-sans {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* Selective-color SVG transitions (right side stays completely still!) */
.hand-light {
  fill: var(--bw-light);
  stroke: var(--bw-stroke);
  transition: fill 0.45s ease, stroke 0.45s ease;
}
.hand-mid {
  fill: var(--bw-mid);
  transition: fill 0.45s ease;
}
.hand-hi {
  fill: var(--bw-hi);
  transition: fill 0.45s ease;
}
.hand-line {
  stroke: var(--bw-stroke);
  transition: stroke 0.45s ease;
}

#supper-svg.color-body .hand-light {
  fill: var(--flesh-light);
  stroke: var(--flesh-stroke);
}
#supper-svg.color-body .hand-mid {
  fill: var(--flesh-mid);
}
#supper-svg.color-body .hand-hi {
  fill: var(--flesh-hi);
}
#supper-svg.color-body .hand-line {
  stroke: var(--flesh-stroke);
}

.blood-main {
  fill: #4A443C;
  transition: fill 0.45s ease;
}
.blood-hi {
  fill: #7B7469;
  transition: fill 0.45s ease;
}
#supper-svg.color-blood .blood-main {
  fill: var(--crimson);
}
#supper-svg.color-blood .blood-hi {
  fill: var(--crimson-hi);
}

/* Bread color toggle & ragged break motion */
.bread-light {
  fill: var(--bw-light);
  stroke: var(--bw-stroke);
  transition: fill 0.45s ease, stroke 0.45s ease;
}
.bread-mid {
  fill: var(--bw-mid);
  stroke: var(--bw-stroke);
  transition: fill 0.45s ease, stroke 0.45s ease;
}
.bread-crumb {
  fill: var(--bw-hi);
  stroke: var(--bw-mid);
  transition: fill 0.45s ease, stroke 0.45s ease, opacity 0.35s ease;
}
.bread-score {
  stroke: var(--bw-dark);
  transition: stroke 0.45s ease;
}

#supper-svg.color-body .bread-light {
  fill: var(--flesh-light);
  stroke: var(--flesh-stroke);
}
#supper-svg.color-body .bread-mid {
  fill: var(--flesh-mid);
  stroke: var(--flesh-stroke);
}
#supper-svg.color-body .bread-crumb {
  fill: var(--flesh-hi);
  stroke: var(--flesh-mid);
}
#supper-svg.color-body .bread-score {
  stroke: var(--flesh-stroke);
}

#bread-group,
#cup-group,
#bread-whole-loaf,
#bread-broken-halves,
#bread-left-half,
#bread-right-half,
#bread-crumbs,
#cup-tilter,
#cup-pour-stream,
#cup-upright-wine {
  transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
}

@media (prefers-reduced-motion: reduce) {
  .hand-light,
  .hand-mid,
  .hand-hi,
  .hand-line,
  .blood-main,
  .blood-hi,
  .bread-light,
  .bread-mid,
  .bread-crumb,
  .bread-score,
  #bread-group,
  #cup-group,
  #bread-whole-loaf,
  #bread-broken-halves,
  #bread-left-half,
  #bread-right-half,
  #bread-crumbs,
  #cup-tilter,
  #cup-pour-stream,
  #cup-upright-wine,
  .step-dot-fill,
  .nav-btn {
    transition: none;
  }
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 6px;
  background: var(--tray);
  border-top: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  border: 0;
  background: transparent;
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
}

.step-dot-fill {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2.4px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 22%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.14);
}

#card-area {
  background: var(--tray);
  padding: 6px 12px 10px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(44, 36, 22, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 13px;
  min-height: var(--card-h, 110px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  --accent-color: var(--step-dark);
}

.verse-card-title {
  font: 700 15px/1.25 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 4px;
}

.verse-card-text {
  font: 13.5px/1.42 Georgia, Cambria, serif;
  color: #3D3426;
  margin: 0;
}

.verse-card-text b {
  color: var(--accent-color, var(--ink));
  font-weight: 700;
}

.verse-card-ref {
  font: 600 11.5px/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  margin: 5px 0 0;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  appearance: none;
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: #4D4334;
  font: 600 13.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.nav-btn.primary {
  background: var(--step-color, var(--ink));
  border-color: var(--step-color, var(--ink));
  color: #FFFFFF;
}

.nav-btn.ghost {
  visibility: hidden;
  pointer-events: none;
}

.step-count {
  font: 600 12.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  text-align: center;
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (max-width: 395px) {
  #card-area {
    padding: 5px 10px 8px;
  }
  .verse-card-content {
    padding: 8px 11px;
  }
  .verse-card-title {
    font-size: 14.5px;
  }
  .verse-card-text {
    font-size: 13px;
  }
  .nav-btn {
    min-width: 88px;
    padding: 10px 12px;
  }
}

#measure {
  position: fixed;
  left: -9999px;
  top: 0;
  visibility: hidden;
  pointer-events: none;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" role="region" aria-label="Interactive Lord's Supper Analogy">
  <header class="title-bar">
    <h1>What the Table Pictures</h1>
    <span class="course-tag">202-10</span>
  </header>

  <div class="stage">
    <svg id="supper-svg" viewBox="0 0 380 264" width="100%" role="img" aria-labelledby="supper-title supper-desc">
      <title id="supper-title">What the Table Pictures</title>
      <desc id="supper-desc">Side-by-side scene showing bread and a cup on the left matching Jesus' hand and blood on the crossbeam on the right.</desc>

      <defs>
        <clipPath id="cupBowlClip">
          <path d="M 118 110 L 164 110 C 163 134 154 148 141 150 C 128 148 119 134 118 110 Z"/>
        </clipPath>
      </defs>

      <!-- Top Column Pills -->
      <g id="column-headers">
        <rect x="24" y="7" width="140" height="23" rx="11.5" fill="#F8F3E8" stroke="#DDD1BC" stroke-width="1"/>
        <text class="svg-sans" x="94" y="22.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6D4D25">At the Table</text>

        <rect x="216" y="7" width="140" height="23" rx="11.5" fill="#F5EFE3" stroke="#DFD4BE" stroke-width="1"/>
        <text class="svg-sans" x="286" y="22.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6F4C24">At the Cross</text>

        <line x1="190" y1="36" x2="190" y2="232" stroke="#E4DED2" stroke-width="1.3" stroke-dasharray="4 4"/>

        <g id="link-badge">
          <circle id="link-badge-bg" cx="190" cy="18.5" r="10.5" fill="#FFFFFF" stroke="#D4CFC4" stroke-width="1.5"/>
          <text id="link-badge-txt" class="svg-sans" x="190" y="22.5" text-anchor="middle" font-size="12" font-weight="800" fill="#6E6557">=</text>
        </g>
      </g>

      <!-- ===================== LEFT SIDE: AT THE TABLE ===================== -->
      <g id="table-side">
        <!-- Quiet Table Surface -->
        <rect x="14" y="192" width="166" height="16" rx="3" fill="#F3F1EC" stroke="#CCC6BA" stroke-width="1.2"/>
        <ellipse cx="62" cy="193" rx="40" ry="4.5" fill="#E8E4DC" stroke="#CFC9BD" stroke-width="1"/>
        <ellipse cx="141" cy="193" rx="22" ry="3.8" fill="#E8E4DC"/>

        <!-- LOAF OF BREAD (starts genuinely whole, tears unevenly on Step 1+) -->
        <g id="bread-group">
          <!-- Whole Unbroken Loaf (visible on Ready only) -->
          <g id="bread-whole-loaf" opacity="1">
            <path class="bread-light"
                  d="M 27 189 L 97 189 C 95 168 80 155 62 155 C 44 155 29 168 27 189 Z"
                  stroke-width="1.6" stroke-linejoin="round"/>
            <path class="bread-mid" d="M 30 183 L 94 183 L 97 189 L 27 189 Z" stroke="none" opacity="0.48"/>
            <path class="bread-score" d="M 36 173 C 44 163 54 160 62 160" fill="none" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
            <path class="bread-score" d="M 44 172 L 54 177 M 63 169 L 74 175 M 78 172 L 86 177" fill="none" stroke-width="1.3" stroke-linecap="round" opacity="0.72"/>
          </g>

          <!-- Broken Torn Halves (visible on Step 1+) -->
          <g id="bread-broken-halves" opacity="0">
            <!-- Left Torn Loaf Piece -->
            <g id="bread-left-half">
              <path class="bread-light"
                    d="M 27 189
                       L 63 189
                       L 60 183 L 64 176 L 59 169 L 63 163 L 60 156
                       C 43 157 29 170 27 189 Z"
                    stroke-width="1.6" stroke-linejoin="round"/>
              <path class="bread-score" d="M 35 174 C 40 165 48 162 56 161" fill="none" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
              <path class="bread-score" d="M 42 174 L 52 179" fill="none" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
              <path id="crumb-l" class="bread-crumb"
                    d="M 60 156 L 63 163 L 59 169 L 64 176 L 60 183 L 63 189 C 57 188 55 182 57 174 C 57 167 56 161 60 156 Z"
                    stroke-width="1"/>
            </g>

            <!-- Right Torn Loaf Piece -->
            <g id="bread-right-half">
              <path class="bread-light"
                    d="M 60 156
                       L 63 163 L 59 169 L 64 176 L 60 183 L 63 189
                       L 97 189
                       C 95 170 81 156 60 156 Z"
                    stroke-width="1.6" stroke-linejoin="round"/>
              <path class="bread-mid" d="M 62 183 L 96 183 L 97 189 L 63 189 Z" stroke="none" opacity="0.55"/>
              <path class="bread-score" d="M 69 163 C 77 166 84 172 88 179" fill="none" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
              <path class="bread-score" d="M 71 174 L 83 179" fill="none" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
              <path id="crumb-r" class="bread-crumb"
                    d="M 60 156 C 65 162 66 169 65 176 C 67 183 66 187 63 189 L 60 183 L 64 176 L 59 169 L 63 163 Z"
                    stroke-width="1"/>
            </g>

            <!-- Uneven torn crumbs when broken -->
            <g id="bread-crumbs">
              <polygon class="bread-crumb" points="60,185 63,187 61,189 58,187" stroke-width="0.7"/>
              <circle class="bread-crumb" cx="66" cy="190" r="1.6" stroke-width="0.7"/>
              <polygon class="bread-crumb" points="56,190 58,191 57,193 55,192" stroke-width="0.6"/>
              <circle class="bread-crumb" cx="63" cy="194" r="1.2" stroke-width="0.6"/>
            </g>
          </g>
        </g>

        <!-- CUP (stands calm & B&W initially, TILTS & POURS OUT wine on Step 2!) -->
        <g id="cup-group">
          <!-- Poured stream & shallow poured pool aligned cleanly to tilted left lip at (87, 123)! -->
          <g id="cup-pour-stream" opacity="0">
            <path d="M 86 123 C 79 138 78 162 80 189 L 85 189 C 84 164 85 140 90 125 Z"
                  fill="var(--crimson)"/>
            <path d="M 86 126 C 81 141 80 163 82 186"
                  fill="none" stroke="var(--crimson-hi)" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
            <ellipse cx="83" cy="190" rx="14" ry="2.8" fill="var(--crimson)"/>
            <ellipse cx="82.5" cy="189.5" rx="8" ry="1.3" fill="var(--crimson-hi)" opacity="0.6"/>
          </g>

          <!-- Tilting Cup Body -->
          <g id="cup-tilter" style="transform-origin: 141px 168px;">
            <!-- Stem & Foot -->
            <path d="M 137 150 L 137 180 L 126 189 L 156 189 L 145 180 L 145 150 Z"
                  fill="#F1EFEA" stroke="#2C2416" stroke-width="1.5" stroke-linejoin="round"/>
            <ellipse cx="141" cy="189" rx="15" ry="2.8" fill="#E3E0D8" stroke="#2C2416" stroke-width="1.3"/>

            <!-- Clear Crystal Goblet Bowl -->
            <path d="M 116 108 L 166 108 C 165 135 155 150 141 152 C 127 150 117 135 116 108 Z"
                  fill="#FAFBFD" fill-opacity="0.78" stroke="#2C2416" stroke-width="1.5" stroke-linejoin="round"/>

            <!-- Upright/Tilted Wine Fill clipped cleanly inside goblet -->
            <g clip-path="url(#cupBowlClip)">
              <!-- Upright wine fill (Step 3) -->
              <g id="cup-upright-wine" opacity="0">
                <rect x="114" y="122" width="54" height="32" fill="var(--crimson)"/>
                <ellipse cx="141" cy="122" rx="22" ry="4.2" fill="var(--crimson-hi)"/>
                <path d="M 120 135 C 125 145 134 150 141 150 C 149 150 157 145 162 135 L 162 152 L 120 152 Z"
                      fill="var(--crimson-dark)" opacity="0.5"/>
              </g>
              <!-- Gravity-level pouring wine surface (+32deg compensates -32deg cup tilt so meniscus stays horizontal!) -->
              <g id="cup-tilted-wine" opacity="0">
                <g transform="rotate(32 134 128)">
                  <rect x="104" y="123" width="66" height="42" fill="var(--crimson)"/>
                  <ellipse cx="136" cy="123" rx="28" ry="4.2" fill="var(--crimson-hi)"/>
                </g>
              </g>
            </g>

            <!-- Specular Rim & Glass Highlight -->
            <path d="M 122 114 C 122 126 125 137 130 143" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
            <ellipse cx="141" cy="108" rx="25" ry="4.2" fill="none" stroke="#2C2416" stroke-width="1.5"/>
          </g>
        </g>
      </g>

      <!-- ===================== RIGHT SIDE: STATIC PEN-AND-INK SCENE (HAND ON THE BEAM) ===================== -->
      <!-- Notice: Nothing moves here! Only selective skin color OR selective blood color turns ON. -->
      <g id="cross-beam-scene">

        <!-- Heavy 3/4 Squared Wooden Crossbeam (Always crisp monochrome ink) -->
        <g id="timber-beam">
          <!-- Top Plane of Beam -->
          <polygon points="196,105 268,81 364,132 296,158"
                   fill="#ECE9E2" stroke="#2C2416" stroke-width="1.6" stroke-linejoin="round"/>
          <!-- Woodgrain lines along top plane -->
          <path d="M 212 103 L 266 86 M 206 109 L 278 144 M 224 118 L 298 152 M 310 112 L 348 132"
                stroke="#6E675C" stroke-width="1" stroke-linecap="round" opacity="0.65"/>

          <!-- Left Vertical Side Face of Beam -->
          <polygon points="196,105 296,158 296,214 196,156"
                   fill="#DDD9D0" stroke="#2C2416" stroke-width="1.6" stroke-linejoin="round"/>
          <!-- Clean ink hatching & woodgrain on shaded beam side -->
          <path d="M 204 120 L 288 166 M 204 134 L 288 182 M 204 146 L 288 196"
                stroke="#5A5349" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
          <path d="M 206 155 L 210 162 M 216 161 L 220 168 M 226 167 L 230 174 M 256 184 L 260 192 M 266 190 L 270 198 M 276 196 L 280 204"
                stroke="#4D473E" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>

          <!-- Front-Right Cut End of Timber Beam -->
          <polygon points="296,158 364,132 364,186 296,214"
                   fill="#CECAC0" stroke="#2C2416" stroke-width="1.6" stroke-linejoin="round"/>
          <!-- Timber end-grain rings -->
          <path d="M 310 172 C 322 162 342 156 352 164 C 352 178 326 192 310 190 Z"
                fill="none" stroke="#5A5349" stroke-width="1" opacity="0.55"/>
          <path d="M 322 174 C 330 168 340 166 344 171" fill="none" stroke="#5A5349" stroke-width="1" opacity="0.5"/>
        </g>

        <!-- Blood Trickle Over Left Edge of Beam & Under Wrist Nail (Selective Color Pair 2!) -->
        <g id="beam-blood">
          <!-- Small quiet wrist stain + slow trickle down beam side face -->
          <path class="blood-main"
                d="M 225 99
                   C 221 103 219 108 220 116
                   C 221 124 222 134 221 146
                   C 221 151 224 153 226 149
                   C 227 142 227 132 229 124
                   C 231 129 232 136 232 141
                   C 232 145 235 146 236 142
                   C 237 134 236 121 236 113
                   C 235 106 232 101 225 99 Z"
                stroke="#2C2416" stroke-width="1" stroke-linejoin="round"/>
          <path class="blood-hi"
                d="M 224 114 C 224 123 224 134 223 142"
                stroke="none" opacity="0.65"/>
          <circle class="blood-main" cx="223" cy="159" r="2.2" stroke="#2C2416" stroke-width="0.8"/>
        </g>

        <!-- Jesus' Open Upturned Hand & Wrist Resting on Top of the Beam (Selective Color Pair 1!) -->
        <g id="jesus-hand">
          <!-- Forearm + Wrist + Open Palm + Soft Thumb + 4 Gently Curled Fingers -->
          <path class="hand-light"
                d="M 197 96
                   L 229 88
                   C 242 84 256 80 272 80
                   C 288 80 301 82 313 84
                   C 319 85 322 89 318 93
                   C 313 96 303 95 296 94
                   C 291 93 288 94 286 96
                   C 296 98 310 100 322 102
                   C 327 103 328 108 323 110
                   C 327 112 326 116 320 116
                   C 313 116 304 114 297 113
                   C 305 117 314 119 316 122
                   C 317 125 313 128 307 127
                   C 309 130 306 133 300 132
                   C 294 131 286 128 280 126
                   C 272 132 259 134 246 131
                   C 235 127 230 120 227 114
                   L 197 116 Z"
                stroke-width="1.6" stroke-linejoin="round"/>

          <!-- Heel of palm & shadowed side of upturned curled fingers -->
          <path class="hand-mid"
                d="M 244 128
                   C 258 132 272 130 280 124
                   C 287 127 298 130 304 130
                   C 308 130 310 127 306 125
                   L 285 118
                   C 276 116 266 121 253 122
                   C 242 122 234 116 230 110
                   L 228 114
                   C 231 120 236 126 244 128 Z"
                opacity="0.72"/>

          <!-- Soft highlight on upturned thumb pad & center palm -->
          <path class="hand-hi"
                d="M 272 84 C 288 83 302 85 312 88 C 306 91 294 90 284 90 C 276 90 270 87 272 84 Z"
                opacity="0.8"/>

          <!-- Clean anatomical palm & finger-fold ink lines (echoing sketch clarity) -->
          <path class="hand-line" d="M 255 96 C 266 99 275 104 282 112" fill="none" stroke-width="1.2" stroke-linecap="round"/>
          <path class="hand-line" d="M 252 108 C 263 111 273 114 284 115" fill="none" stroke-width="1.1" stroke-linecap="round"/>
          <path class="hand-line" d="M 284 97 C 294 99 306 101 317 104" fill="none" stroke-width="1.2" stroke-linecap="round"/>
          <path class="hand-line" d="M 288 107 C 299 109 309 112 318 115" fill="none" stroke-width="1.2" stroke-linecap="round"/>
          <path class="hand-line" d="M 282 117 C 292 119 303 122 310 125" fill="none" stroke-width="1.2" stroke-linecap="round"/>
          <!-- Knuckle / fingertip curl details -->
          <path class="hand-line" d="M 314 86 C 316 87 316 90 314 91" fill="none" stroke-width="1" stroke-linecap="round"/>
          <path class="hand-line" d="M 320 104 C 322 106 321 109 318 110" fill="none" stroke-width="1" stroke-linecap="round"/>
          <path class="hand-line" d="M 311 120 C 313 122 312 125 309 125" fill="none" stroke-width="1" stroke-linecap="round"/>

          <!-- Blood pooling slightly right around entry of spike at wrist -->
          <ellipse class="blood-main" cx="231" cy="94" rx="5.5" ry="3.2" stroke="#2C2416" stroke-width="0.9"/>
        </g>

        <!-- Forged Iron Nail Spike Driven Through Wrist (Always crisp dark charcoal ink) -->
        <g id="wrist-nail">
          <!-- Spike shaft -->
          <polygon points="229,63 234,63 233,95 229.5,95" fill="#46413A" stroke="#2C2416" stroke-width="1.3" stroke-linejoin="round"/>
          <line x1="230.5" y1="65" x2="230.5" y2="93" stroke="#9B9489" stroke-width="0.9"/>
          <!-- Faceted square iron nail head -->
          <polygon points="223,58 232,55 240,59 235,64 225,63" fill="#5E584F" stroke="#2C2416" stroke-width="1.3" stroke-linejoin="round"/>
          <polygon points="223,58 232,55 234,59 225,61" fill="#8C857A" opacity="0.65"/>
        </g>
      </g>

      <!-- Bottom Labels -->
      <g id="stage-labels">
        <text id="left-caption" class="svg-sans" x="94" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#6E6557">Bread and Cup</text>
        <text id="right-caption" class="svg-sans" x="286" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#6E6557">Body and Blood</text>
      </g>
    </svg>
  </div>

  <!-- Wordless Interactive Step Strip -->
  <div class="step-strip" id="step-strip" role="group" aria-label="Lord's Supper steps"></div>

  <!-- Bottom Card & Accessible Controls -->
  <div id="card-area" aria-live="polite"></div>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
(function () {
  'use strict';

  var steps = [
    {
      dotLabel: 'Start: A Meal That Points to the Cross',
      color: '#2C2416',
      dark: '#2C2416',
      accent: '#2C2416',
      title: 'A Meal That Points to the Cross',
      text: 'Jesus gave His church bread and a cup so we would never forget His cross.',
      ref: 'Luke 22:19-20',
      leftCap: 'Bread and Cup',
      leftCapColor: '#6E6557',
      rightCap: 'Hand on the Beam',
      rightCapColor: '#6E6557',
      colorBody: false,
      colorBlood: false,
      splitBread: false,
      breadOpacity: 1,
      cupOpacity: 1,
      tiltCup: false,
      uprightWine: false,
      linkBg: '#FFFFFF',
      linkBorder: '#D4CFC4',
      linkText: '#6E6557',
      desc: 'In black and white, one whole loaf of bread and an upright empty cup sit at the table on the left. On the right rests Jesus\' open nailed hand on a wooden beam.'
    },
    {
      dotLabel: 'Step 1: The Bread and His Body',
      color: '#A96224',
      dark: '#874C19',
      accent: '#874C19',
      title: '1. The Bread: His Body',
      text: '<b>"This is my body, which is given for you."</b> The broken bread matches the warm color of His body.',
      ref: 'Luke 22:19 | 1 Corinthians 11:24',
      leftCap: 'Bread Broken',
      leftCapColor: '#874C19',
      rightCap: 'His Body Given',
      rightCapColor: '#874C19',
      colorBody: true,
      colorBlood: false,
      splitBread: true,
      breadOpacity: 1,
      cupOpacity: 0.35,
      tiltCup: false,
      uprightWine: false,
      linkBg: '#A96224',
      linkBorder: '#A96224',
      linkText: '#FFFFFF',
      desc: 'The loaf tears apart with a rough broken edge in warm bread color, while only Jesus\' hand on the beam lights up in the exact same color.'
    },
    {
      dotLabel: 'Step 2: The Cup and His Blood',
      color: '#9B1C2E',
      dark: '#6D1220',
      accent: '#9B1C2E',
      title: '2. The Cup: His Blood',
      text: '<b>"This cup is the new covenant in my blood, poured out for you."</b> The poured wine matches the color of His blood.',
      ref: 'Luke 22:20 | Matthew 26:28',
      leftCap: 'Cup Poured Out',
      leftCapColor: '#9B1C2E',
      rightCap: 'His Blood Shed',
      rightCapColor: '#9B1C2E',
      colorBody: false,
      colorBlood: true,
      splitBread: true,
      breadOpacity: 0.38,
      cupOpacity: 1,
      tiltCup: true,
      uprightWine: false,
      linkBg: '#9B1C2E',
      linkBorder: '#9B1C2E',
      linkText: '#FFFFFF',
      desc: 'The cup tilts and pours crimson wine on the left. On the right, Jesus\' hand returns to black and white while only the blood turns the exact same crimson.'
    },
    {
      dotLabel: 'Step 3: Remember Until He Comes',
      color: '#2C2416',
      dark: '#2C2416',
      accent: '#2C2416',
      title: '3. Remember Until He Comes',
      text: '<b>"As often as you eat this bread and drink the cup, you proclaim the Lord\'s death until he comes."</b>',
      ref: '1 Corinthians 11:24-26',
      leftCap: 'Eat and Drink',
      leftCapColor: '#2C2416',
      rightCap: 'Do This in Remembrance',
      rightCapColor: '#2C2416',
      colorBody: true,
      colorBlood: true,
      splitBread: true,
      breadOpacity: 1,
      cupOpacity: 1,
      tiltCup: false,
      uprightWine: true,
      linkBg: '#2C2416',
      linkBorder: '#2C2416',
      linkText: '#FFFFFF',
      desc: 'Broken bread and the filled cup stand together on the table while both the hand and the blood glow together in color on the crossbeam.'
    }
  ];

  var step = 0;
  var pendingFocus = null;

  function el(id) { return document.getElementById(id); }

  function setFocus(name) { pendingFocus = name; }

  function applyFocus() {
    if (!pendingFocus) return;
    var t = document.querySelector('[data-control="' + pendingFocus + '"]');
    pendingFocus = null;
    if (t) t.focus();
  }

  function button(label, control, cls, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = cls;
    b.setAttribute('data-control', control);
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function buildCard(s) {
    var vc = document.createElement('div');
    vc.className = 'verse-card';

    var bar = document.createElement('div');
    bar.className = 'verse-card-bar';
    bar.style.background = s.color;
    vc.appendChild(bar);

    var content = document.createElement('div');
    content.className = 'verse-card-content';
    content.style.setProperty('--accent-color', s.accent || s.dark);

    var title = document.createElement('h2');
    title.className = 'verse-card-title';
    title.style.color = s.dark || s.color;
    title.textContent = s.title;
    content.appendChild(title);

    var text = document.createElement('p');
    text.className = 'verse-card-text';
    text.innerHTML = s.text;
    content.appendChild(text);

    if (s.ref) {
      var ref = document.createElement('p');
      ref.className = 'verse-card-ref';
      ref.textContent = s.ref;
      content.appendChild(ref);
    }

    vc.appendChild(content);
    return vc;
  }

  function fitCardHeight() {
    var area = el('card-area');
    var cs = getComputedStyle(area);
    var w = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var m = document.createElement('div');
    m.id = 'measure';
    m.style.width = Math.max(w, 240) + 'px';
    document.documentElement.style.setProperty('--card-h', '0px');
    var max = 0;
    steps.forEach(function (s) {
      m.appendChild(buildCard(s));
    });
    document.body.appendChild(m);
    m.querySelectorAll('.verse-card-content').forEach(function (node) {
      max = Math.max(max, node.offsetHeight);
    });
    document.body.removeChild(m);
    document.documentElement.style.setProperty('--card-h', Math.max(max, 110) + 'px');
  }

  var strip = el('step-strip');
  var dots = [];
  steps.forEach(function (s, idx) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'step-dot';
    btn.style.setProperty('--dot-color', s.color);
    btn.setAttribute('aria-label', s.dotLabel);
    btn.setAttribute('aria-pressed', 'false');
    var fill = document.createElement('span');
    fill.className = 'step-dot-fill';
    btn.appendChild(fill);
    btn.addEventListener('click', function () {
      goTo(idx, true);
    });
    strip.appendChild(btn);
    dots.push(btn);
  });

  function updateDots() {
    dots.forEach(function (btn, idx) {
      var isCurrent = idx === step;
      var isPassed = idx < step;
      btn.classList.toggle('active', isCurrent);
      btn.classList.toggle('passed', isPassed);
      btn.setAttribute('aria-pressed', isCurrent ? 'true' : 'false');
    });
  }

  function paintScene(s) {
    var svg = el('supper-svg');
    svg.classList.toggle('color-body', !!s.colorBody);
    svg.classList.toggle('color-blood', !!s.colorBlood);

    el('bread-group').style.opacity = String(s.breadOpacity);
    el('cup-group').style.opacity = String(s.cupOpacity);

    if (s.splitBread) {
      el('bread-whole-loaf').style.opacity = '0';
      el('bread-broken-halves').style.opacity = '1';
      el('bread-left-half').style.transform = 'translate(-7px, 1px) rotate(-7deg)';
      el('bread-left-half').style.transformOrigin = '56px 186px';
      el('bread-right-half').style.transform = 'translate(7px, 1px) rotate(6deg)';
      el('bread-right-half').style.transformOrigin = '68px 186px';
    } else {
      el('bread-whole-loaf').style.opacity = '1';
      el('bread-broken-halves').style.opacity = '0';
      el('bread-left-half').style.transform = 'translate(0, 0) rotate(0deg)';
      el('bread-right-half').style.transform = 'translate(0, 0) rotate(0deg)';
    }

    if (s.tiltCup) {
      el('cup-tilter').style.transform = 'translate(-5px, -8px) rotate(-32deg)';
      el('cup-pour-stream').style.opacity = '1';
      el('cup-tilted-wine').style.opacity = '1';
      el('cup-upright-wine').style.opacity = '0';
    } else {
      el('cup-tilter').style.transform = 'translate(0, 0) rotate(0deg)';
      el('cup-pour-stream').style.opacity = '0';
      el('cup-tilted-wine').style.opacity = '0';
      el('cup-upright-wine').style.opacity = s.uprightWine ? '1' : '0';
    }

    el('link-badge-bg').setAttribute('fill', s.linkBg);
    el('link-badge-bg').setAttribute('stroke', s.linkBorder);
    el('link-badge-txt').setAttribute('fill', s.linkText);

    el('left-caption').textContent = s.leftCap;
    el('left-caption').setAttribute('fill', s.leftCapColor);
    el('right-caption').textContent = s.rightCap;
    el('right-caption').setAttribute('fill', s.rightCapColor);

    el('supper-title').textContent = s.title;
    el('supper-desc').textContent = s.desc;
  }

  function goTo(idx, fromDot) {
    step = Math.max(0, Math.min(steps.length - 1, idx));
    if (!fromDot && step === 0) {
      setFocus('next');
    }
    render();
  }

  function render() {
    var s = steps[step];
    document.documentElement.style.setProperty('--step-color', s.color);
    document.documentElement.style.setProperty('--step-dark', s.dark);

    paintScene(s);
    updateDots();

    var area = el('card-area');
    area.innerHTML = '';
    area.appendChild(buildCard(s));

    var nav = document.createElement('div');
    nav.className = 'nav-bar';

    if (step === 0) {
      nav.appendChild(button('\u2190 Back', 'back', 'nav-btn ghost', function () {}));
    } else {
      nav.appendChild(button('\u2190 Back', 'back', 'nav-btn', function () {
        setFocus(step === 1 ? 'next' : 'back');
        goTo(step - 1, true);
      }));
    }

    var count = document.createElement('span');
    count.className = 'step-count';
    count.textContent = step === 0 ? 'Ready' : (step + ' of ' + (steps.length - 1));
    nav.appendChild(count);

    if (step === 0) {
      nav.appendChild(button('Begin \u2192', 'next', 'nav-btn primary', function () {
        setFocus('next');
        goTo(1, true);
      }));
    } else if (step < steps.length - 1) {
      nav.appendChild(button('Next \u2192', 'next', 'nav-btn primary', function () {
        setFocus('next');
        goTo(step + 1, true);
      }));
    } else {
      nav.appendChild(button('\u21BB Start Over', 'restart', 'nav-btn primary', function () {
        setFocus('next');
        goTo(0, true);
      }));
    }

    area.appendChild(nav);
    el('status').textContent = step === 0
      ? s.title
      : ('Step ' + step + ' of ' + (steps.length - 1) + ': ' + s.title);
    applyFocus();
  }

  fitCardHeight();
  render();

  var rt = null;
  var lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(rt);
    rt = setTimeout(fitCardHeight, 150);
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitCardHeight);
  }
})();
</script>
</body>
</html>
