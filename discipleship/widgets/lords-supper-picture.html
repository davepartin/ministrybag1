<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What the Table Pictures</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --ink: #2C2416;
  --muted: #6E6557;
  --border: #EBE5D9;
  --tray: #F6F4EE;
  --bg: #F8F6F1;

  /* Exact Monochrome Ink State */
  --bw-hi: #FAF9F6;
  --bw-light: #EDEBE5;
  --bw-mid: #D3CFC6;
  --bw-dark: #8A8479;
  --bw-stroke: #2C2416;

  /* Color Pair 1: Broken Bread = Given Body */
  --flesh-hi: #F4D7B5;
  --flesh-light: #E2B484;
  --flesh-mid: #C78950;
  --flesh-stroke: #7E481D;
  --bread-accent: #A96224;
  --bread-dark: #874C19;

  /* Color Pair 2: Poured Wine = Shed Blood */
  --crimson: #9B1C2E;
  --crimson-hi: #BD2C41;
  --crimson-dark: #6D1220;

  /* Finale Union Accent */
  --union: #2C2416;
}

body {
  font-family: Georgia, Cambria, serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  margin: 0;
  padding: 0;
}

.widget-outer {
  background: #FFFFFF;
  width: 100%;
  max-width: 100%;
  margin: 0;
  overflow: hidden;
  border: none;
  border-radius: 0;
  box-shadow: none;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: var(--bg);
  }
  .widget-outer {
    max-width: 460px;
    margin: 0 auto;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
  }
}

.title-bar {
  background: var(--ink);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  text-align: left;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  background: #FFFFFF;
  padding: 6px 6px 2px;
}

#supper-svg {
  display: block;
  width: 100%;
  height: auto;
}

.svg-sans {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* Selective-color SVG transitions (right side stays completely still!) */
.hand-light {
  fill: #FFFFFF;
  stroke: none;
  transition: fill 0.45s ease;
}
.nail-shield {
  fill: #FFFFFF;
  transition: fill 0.45s ease;
}

#supper-svg.color-body .hand-light {
  fill: var(--flesh-light);
}
#supper-svg.color-body .nail-shield {
  fill: #DCD8CE;
}

.blood-main {
  fill: #FFFFFF;
  opacity: 0;
  transition: fill 0.45s ease, opacity 0.45s ease;
}
#supper-svg.color-blood .blood-main {
  fill: var(--crimson);
  opacity: 0.92;
}

/* Bread color toggle & ragged break motion */
.bread-light {
  fill: var(--bw-light);
  stroke: var(--bw-stroke);
  transition: fill 0.45s ease, stroke 0.45s ease;
}
.bread-mid {
  fill: var(--bw-mid);
  stroke: var(--bw-stroke);
  transition: fill 0.45s ease, stroke 0.45s ease;
}
.bread-crumb {
  fill: var(--bw-hi);
  stroke: var(--bw-mid);
  transition: fill 0.45s ease, stroke 0.45s ease, opacity 0.35s ease;
}
.bread-score {
  stroke: var(--bw-dark);
  transition: stroke 0.45s ease;
}

#supper-svg.color-body .bread-light {
  fill: var(--flesh-light);
  stroke: var(--flesh-stroke);
}
#supper-svg.color-body .bread-mid {
  fill: var(--flesh-mid);
  stroke: var(--flesh-stroke);
}
#supper-svg.color-body .bread-crumb {
  fill: var(--flesh-hi);
  stroke: var(--flesh-mid);
}
#supper-svg.color-body .bread-score {
  stroke: var(--flesh-stroke);
}

#bread-group,
#cup-group,
#bread-whole-loaf,
#bread-broken-halves,
#bread-left-half,
#bread-right-half,
#bread-crumbs,
#cup-tilter,
#cup-tilted-wine,
#cup-pour-stream,
#cup-upright-wine {
  transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.38s ease;
}

@media (prefers-reduced-motion: reduce) {
  .hand-light,
  .blood-main,
  .bread-light,
  .bread-mid,
  .bread-crumb,
  .bread-score,
  #bread-group,
  #cup-group,
  #bread-whole-loaf,
  #bread-broken-halves,
  #bread-left-half,
  #bread-right-half,
  #bread-crumbs,
  #cup-tilter,
  #cup-tilted-wine,
  #cup-pour-stream,
  #cup-upright-wine,
  .nail-shield,
  .step-dot-fill,
  .nav-btn {
    transition: none;
  }
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 6px;
  background: var(--tray);
  border-top: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  border: 0;
  background: transparent;
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
}

.step-dot-fill {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2.4px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 22%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.14);
}

#card-area {
  background: var(--tray);
  padding: 6px 12px 10px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(44, 36, 22, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 13px;
  min-height: var(--card-h, 110px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  --accent-color: var(--step-dark);
}

.verse-card-title {
  font: 700 15px/1.25 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 4px;
}

.verse-card-text {
  font: 13.5px/1.42 Georgia, Cambria, serif;
  color: #3D3426;
  margin: 0;
}

.verse-card-text b {
  color: var(--accent-color, var(--ink));
  font-weight: 700;
}

.verse-card-ref {
  font: 600 11.5px/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  margin: 5px 0 0;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  appearance: none;
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: #4D4334;
  font: 600 13.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.nav-btn.primary {
  background: var(--step-color, var(--ink));
  border-color: var(--step-color, var(--ink));
  color: #FFFFFF;
}

.nav-btn.ghost {
  visibility: hidden;
  pointer-events: none;
}

.step-count {
  font: 600 12.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  text-align: center;
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (max-width: 395px) {
  #card-area {
    padding: 5px 10px 8px;
  }
  .verse-card-content {
    padding: 8px 11px;
  }
  .verse-card-title {
    font-size: 14.5px;
  }
  .verse-card-text {
    font-size: 13px;
  }
  .nav-btn {
    min-width: 88px;
    padding: 10px 12px;
  }
}

#measure {
  position: fixed;
  left: -9999px;
  top: 0;
  visibility: hidden;
  pointer-events: none;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" role="region" aria-label="Interactive Lord's Supper Analogy">
  <header class="title-bar">
    <h1>What the Table Pictures</h1>
    <span class="course-tag">202-10</span>
  </header>

  <div class="stage">
    <svg id="supper-svg" viewBox="0 0 380 264" width="100%" role="img" aria-labelledby="supper-title supper-desc">
      <title id="supper-title">What the Table Pictures</title>
      <desc id="supper-desc">Side-by-side scene showing bread and a cup on the left matching Jesus' pierced hand on the crossbeam on the right.</desc>

      <defs>
        <clipPath id="cupBowlClip">
          <path d="M 130 110 L 174 110 C 173 134 164 148 152 150 C 140 148 131 134 130 110 Z"/>
        </clipPath>
      </defs>

      <!-- Top Column Pills -->
      <g id="column-headers">
        <rect x="20" y="7" width="144" height="23" rx="11.5" fill="#F8F3E8" stroke="#DDD1BC" stroke-width="1"/>
        <text class="svg-sans" x="92" y="22.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6D4D25">At the Table</text>

        <rect x="216" y="7" width="144" height="23" rx="11.5" fill="#F5EFE3" stroke="#DFD4BE" stroke-width="1"/>
        <text class="svg-sans" x="288" y="22.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6F4C24">At the Cross</text>

        <line x1="190" y1="36" x2="190" y2="232" stroke="#E4DED2" stroke-width="1.3" stroke-dasharray="4 4"/>

        <g id="link-badge">
          <circle id="link-badge-bg" cx="190" cy="18.5" r="10.5" fill="#FFFFFF" stroke="#D4CFC4" stroke-width="1.5"/>
          <text id="link-badge-txt" class="svg-sans" x="190" y="22.5" text-anchor="middle" font-size="12" font-weight="800" fill="#6E6557">=</text>
        </g>
      </g>

      <!-- ===================== LEFT SIDE: AT THE TABLE ===================== -->
      <g id="table-side">
        <!-- Quiet Table Surface -->
        <rect x="10" y="190" width="170" height="14" rx="3" fill="#F3F1EC" stroke="#CCC6BA" stroke-width="1.2"/>
        <ellipse cx="42" cy="191" rx="30" ry="3.8" fill="#E8E4DC" stroke="#CFC9BD" stroke-width="1"/>
        <ellipse cx="152" cy="191" rx="20" ry="3.5" fill="#E8E4DC"/>

        <!-- LOAF OF BREAD (positioned cleanly on left so sideways pour never hits it!) -->
        <g id="bread-group">
          <!-- Whole Unbroken Loaf (Ready only) -->
          <g id="bread-whole-loaf" opacity="1">
            <path class="bread-light"
                  d="M 16 187 L 68 187 C 66 168 55 157 42 157 C 29 157 18 168 16 187 Z"
                  stroke-width="1.6" stroke-linejoin="round"/>
            <path class="bread-mid" d="M 18 182 L 66 182 L 68 187 L 16 187 Z" stroke="none" opacity="0.48"/>
            <path class="bread-score" d="M 23 173 C 29 164 36 161 42 161" fill="none" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
            <path class="bread-score" d="M 29 172 L 36 177 M 43 169 L 51 174 M 54 172 L 60 177" fill="none" stroke-width="1.2" stroke-linecap="round" opacity="0.72"/>
          </g>

          <!-- Broken Torn Halves (Step 1+) -->
          <g id="bread-broken-halves" opacity="0">
            <!-- Left Torn Loaf Piece -->
            <g id="bread-left-half">
              <path class="bread-light"
                    d="M 16 187
                       L 43 187
                       L 40 181 L 44 175 L 39 169 L 43 163 L 40 158
                       C 28 159 18 170 16 187 Z"
                    stroke-width="1.6" stroke-linejoin="round"/>
              <path class="bread-score" d="M 22 173 C 26 166 32 163 38 162" fill="none" stroke-width="1.35" stroke-linecap="round" opacity="0.65"/>
              <path class="bread-score" d="M 28 173 L 35 178" fill="none" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
              <path id="crumb-l" class="bread-crumb"
                    d="M 40 158 L 43 163 L 39 169 L 44 175 L 40 181 L 43 187 C 38 186 36 180 38 173 C 38 167 37 162 40 158 Z"
                    stroke-width="1"/>
            </g>

            <!-- Right Torn Loaf Piece -->
            <g id="bread-right-half">
              <path class="bread-light"
                    d="M 40 158
                       L 43 163 L 39 169 L 44 175 L 40 181 L 43 187
                       L 68 187
                       C 66 170 55 158 40 158 Z"
                    stroke-width="1.6" stroke-linejoin="round"/>
              <path class="bread-mid" d="M 42 182 L 67 182 L 68 187 L 43 187 Z" stroke="none" opacity="0.55"/>
              <path class="bread-score" d="M 47 164 C 53 166 58 171 61 177" fill="none" stroke-width="1.35" stroke-linecap="round" opacity="0.6"/>
              <path class="bread-score" d="M 49 173 L 58 178" fill="none" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
              <path id="crumb-r" class="bread-crumb"
                    d="M 40 158 C 44 163 45 169 44 175 C 46 181 45 185 43 187 L 40 181 L 44 175 L 39 169 L 43 163 Z"
                    stroke-width="1"/>
            </g>

            <!-- Uneven torn crumbs when broken -->
            <g id="bread-crumbs">
              <polygon class="bread-crumb" points="40,184 43,186 41,188 38,186" stroke-width="0.7"/>
              <circle class="bread-crumb" cx="45" cy="189" r="1.4" stroke-width="0.7"/>
              <polygon class="bread-crumb" points="37,189 39,190 38,192 36,191" stroke-width="0.6"/>
              <circle class="bread-crumb" cx="42" cy="192" r="1.1" stroke-width="0.6"/>
            </g>
          </g>
        </g>

        <!-- CUP (reverted to clean sideways tilt at -32deg, pouring onto open table clear of bread!) -->
        <g id="cup-group">
          <!-- Sideways pour stream aligned cleanly to tilted lip (95, 122), clear of bread at x=16..71 -->
          <g id="cup-pour-stream" opacity="0">
            <path d="M 95 122 C 89 138 89 162 90 189 L 95 189 C 94 164 94 140 99 124 Z"
                  fill="var(--crimson)"/>
            <path d="M 95 125 C 91 140 91 163 92 186"
                  fill="none" stroke="var(--crimson-hi)" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
            <ellipse cx="92" cy="190" rx="10.5" ry="2.5" fill="var(--crimson)"/>
            <ellipse cx="91.5" cy="189.5" rx="6" ry="1.2" fill="var(--crimson-hi)" opacity="0.62"/>
          </g>

          <!-- Tilting Cup Body -->
          <g id="cup-tilter" style="transform-origin: 152px 168px;">
            <!-- Stem & Foot -->
            <path d="M 148 150 L 148 180 L 138 189 L 166 189 L 156 180 L 156 150 Z"
                  fill="#F1EFEA" stroke="#2C2416" stroke-width="1.5" stroke-linejoin="round"/>
            <ellipse cx="152" cy="189" rx="14.5" ry="2.8" fill="#E3E0D8" stroke="#2C2416" stroke-width="1.3"/>

            <!-- Clear Crystal Goblet Bowl -->
            <path d="M 128 108 L 176 108 C 175 135 165 150 152 152 C 139 150 129 135 128 108 Z"
                  fill="#FAFBFD" fill-opacity="0.78" stroke="#2C2416" stroke-width="1.5" stroke-linejoin="round"/>

            <!-- Upright/Tilted Wine Fill clipped cleanly inside goblet -->
            <g clip-path="url(#cupBowlClip)">
              <!-- Upright wine fill (Step 3) -->
              <g id="cup-upright-wine" opacity="0">
                <rect x="126" y="122" width="52" height="32" fill="var(--crimson)"/>
                <ellipse cx="152" cy="122" rx="21.5" ry="4.1" fill="var(--crimson-hi)"/>
                <path d="M 132 135 C 137 145 145 150 152 150 C 159 150 167 145 172 135 L 172 152 L 132 152 Z"
                      fill="var(--crimson-dark)" opacity="0.5"/>
              </g>
              <!-- Gravity-level pouring wine surface (+32deg compensates -32deg cup tilt so meniscus stays horizontal!) -->
              <g id="cup-tilted-wine" opacity="0">
                <g transform="rotate(32 145 128)">
                  <rect x="116" y="123" width="64" height="42" fill="var(--crimson)"/>
                  <ellipse cx="147" cy="123" rx="26" ry="4.2" fill="var(--crimson-hi)"/>
                </g>
              </g>
            </g>

            <!-- Specular Rim & Glass Highlight -->
            <path d="M 134 114 C 134 126 137 137 142 143" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
            <ellipse cx="152" cy="108" rx="24" ry="4.2" fill="none" stroke="#2C2416" stroke-width="1.5"/>
          </g>
        </g>
      </g>

      <!-- ===================== RIGHT SIDE: PENCIL ARTWORK + SELECTIVE COLOR LAYERS ===================== -->
      <!-- Nothing moves here! Only selective skin color OR selective blood color turns ON. -->
      <svg id="cross-beam-scene" x="194" y="34" width="182" height="198" viewBox="0 55 438 478">
        <!-- Selective Color Pair 1: Jesus' Hand Skin Wash (pure white when B&W, warm #E2B484 when color-body is active) -->
        <g id="jesus-hand">
          <path class="hand-light"
                d="M 2 340
                   C 36 318 68 292 86 254
                   C 104 214 134 176 168 148
                   C 192 126 212 118 228 120
                   C 241 122 244 136 236 154
                   C 226 176 206 196 184 212
                   C 172 222 168 232 170 242
                   C 194 242 228 242 260 228
                   C 280 216 296 196 306 168
                   C 312 142 314 104 324 84
                   C 330 74 342 74 348 84
                   C 352 94 349 124 348 146
                   C 350 132 362 92 384 86
                   C 396 86 398 112 396 138
                   C 394 150 392 160 392 168
                   C 398 182 396 210 395 234
                   C 395 248 390 264 385 280
                   C 380 302 368 328 344 346
                   C 306 378 250 404 182 408
                   C 138 412 88 432 2 486 Z"/>
        </g>

        <!-- Forged Iron Nail Shield (transparent/white in B&W so zero halo; cool neutral grey under color-body) -->
        <g id="wrist-nail">
          <path class="nail-shield"
                d="M 168 246
                   C 168 228 228 228 228 248
                   C 228 260 218 266 208 269
                   L 216 324
                   L 198 324
                   L 186 268
                   C 176 264 168 258 168 246 Z"/>
        </g>

        <!-- Selective Color Pair 2: Delicate Blood Trickles (transparent in B&W, exact #9B1C2E crimson when color-blood is active) -->
        <g id="beam-blood">
          <!-- Entry wound pool -->
          <ellipse class="blood-main" cx="212" cy="322" rx="14" ry="6"/>
          <!-- Lower-left tiny streak + droplet -->
          <path class="blood-main" d="M 136 353 L 122 375 L 126 378 L 139 356 Z"/>
          <circle class="blood-main" cx="122.5" cy="381" r="4.8"/>
          <!-- Main vertical twin blood trickles below nail -->
          <path class="blood-main" d="M 213 326 C 216 346 219 370 219 393 L 225 393 C 225 370 222 346 218 326 Z"/>
          <circle class="blood-main" cx="222" cy="394" r="4.8"/>
          <path class="blood-main" d="M 224 330 C 228 348 232 366 234 384 L 239 384 C 237 366 233 348 228 330 Z"/>
          <circle class="blood-main" cx="236.5" cy="385" r="4.2"/>
        </g>

        <!-- Crisp Transparent Charcoal Pencil Artwork on Top -->
        <image id="hand-ink-layer" href="202-10-hand-beam-ink.png" x="0" y="0" width="438" height="552" preserveAspectRatio="xMidYMid meet"/>
      </svg>

      <!-- Bottom Labels -->
      <g id="stage-labels">
        <text id="left-caption" class="svg-sans" x="92" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#6E6557">Bread and Cup</text>
        <text id="right-caption" class="svg-sans" x="288" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#6E6557">Hand on the Beam</text>
      </g>
    </svg>
  </div>

  <!-- Wordless Interactive Step Strip -->
  <div class="step-strip" id="step-strip" role="group" aria-label="Lord's Supper steps"></div>

  <!-- Bottom Card & Accessible Controls -->
  <div id="card-area" aria-live="polite"></div>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
(function () {
  'use strict';

  var steps = [
    {
      dotLabel: 'Start: A Meal That Points to the Cross',

    },
    {
      dotLabel: 'Step 1: The Bread and His Body',
      color: '#A96224',
      dark: '#874C19',
      accent: '#874C19',
      title: '1. The Bread: His Body',

      ref: 'Luke 22:19 | 1 Corinthians 11:24',
      leftCap: 'Bread Broken',

      rightCap: 'His Body Given',
      rightCapColor: '#874C19',
      colorBody: true,

      splitBread: true,
      breadOpacity: 1,
      cupOpacity: 0.35,
      tiltCup: false,
      uprightWine: false,
      linkBg: '#A96224',
      linkBorder: '#A96224',
      linkText: '#FFFFFF',
      desc: 'The loaf tears apart with a rough broken edge in warm bread color, while only Jesus\' hand on the beam lights up in the exact same color.'
    },
    {
      dotLabel: 'Step 2: The Cup and His Blood',
      color: '#9B1C2E',
      dark: '#6D1220',
      accent: '#9B1C2E',
      title: '2. The Cup: His Blood',
      text: '<b>"This cup is the new covenant in my blood, poured out for you."</b> The poured wine matches the color of His blood.',
      ref: 'Luke 22:20 | Matthew 26:28',
      leftCap: 'Cup Poured Out',
      leftCapColor: '#9B1C2E',
      rightCap: 'His Blood Shed',
      rightCapColor: '#9B1C2E',
      colorBody: false,
      colorBlood: true,
      splitBread: true,
      breadOpacity: 0.38,
      cupOpacity: 1,
      tiltCup: true,
      uprightWine: false,
      linkBg: '#9B1C2E',
      linkBorder: '#9B1C2E',
      linkText: '#FFFFFF',
      desc: 'The cup tips forward toward the viewer and pours crimson wine clear of the bread. On the right, Jesus\' hand returns to black and white while only the blood turns the exact same crimson.'
    },
    {
      dotLabel: 'Step 3: Remember Until He Comes',
      color: '#2C2416',
      dark: '#2C2416',
      accent: '#2C2416',
      title: '3. Remember Until He Comes',
      text: '<b>"As often as you eat this bread and drink the cup, you proclaim the Lord\'s death until he comes."</b>',
      ref: '1 Corinthians 11:24-26',
      leftCap: 'Eat and Drink',
      leftCapColor: '#2C2416',
      rightCap: 'Do This in Remembrance',
      rightCapColor: '#2C2416',
      colorBody: true,
      colorBlood: true,
      splitBread: true,
      breadOpacity: 1,
      cupOpacity: 1,
      tiltCup: false,
      uprightWine: true,
      linkBg: '#2C2416',
      linkBorder: '#2C2416',
      linkText: '#FFFFFF',
      desc: 'Broken bread and the filled cup stand together on the table while both the hand and the blood glow together in color on the crossbeam.'
    }
  ];

  var step = 0;
  var pendingFocus = null;

  function el(id) { return document.getElementById(id); }

  function setFocus(name) { pendingFocus = name; }

  function applyFocus() {
    if (!pendingFocus) return;
    var t = document.querySelector('[data-control="' + pendingFocus + '"]');
    pendingFocus = null;
    if (t) t.focus();
  }

  function button(label, control, cls, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = cls;
    b.setAttribute('data-control', control);
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function buildCard(s) {
    var vc = document.createElement('div');
    vc.className = 'verse-card';

    var bar = document.createElement('div');
    bar.className = 'verse-card-bar';
    bar.style.background = s.color;
    vc.appendChild(bar);

    var content = document.createElement('div');
    content.className = 'verse-card-content';
    content.style.setProperty('--accent-color', s.accent || s.dark);

    var title = document.createElement('h2');
    title.className = 'verse-card-title';
    title.style.color = s.dark || s.color;
    title.textContent = s.title;
    content.appendChild(title);

    var text = document.createElement('p');
    text.className = 'verse-card-text';
    text.innerHTML = s.text;
    content.appendChild(text);

    if (s.ref) {
      var ref = document.createElement('p');
      ref.className = 'verse-card-ref';
      ref.textContent = s.ref;
      content.appendChild(ref);
    }

    vc.appendChild(content);
    return vc;
  }

  function fitCardHeight() {
    var area = el('card-area');
    var cs = getComputedStyle(area);
    var w = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var m = document.createElement('div');
    m.id = 'measure';
    m.style.width = Math.max(w, 240) + 'px';
    document.documentElement.style.setProperty('--card-h', '0px');
    var max = 0;
    steps.forEach(function (s) {
      m.appendChild(buildCard(s));
    });
    document.body.appendChild(m);
    m.querySelectorAll('.verse-card-content').forEach(function (node) {
      max = Math.max(max, node.offsetHeight);
    });
    document.body.removeChild(m);
    document.documentElement.style.setProperty('--card-h', Math.max(max, 110) + 'px');
  }

  var strip = el('step-strip');
  var dots = [];
  steps.forEach(function (s, idx) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'step-dot';
    btn.style.setProperty('--dot-color', s.color);
    btn.setAttribute('aria-label', s.dotLabel);
    btn.setAttribute('aria-pressed', 'false');
    var fill = document.createElement('span');
    fill.className = 'step-dot-fill';
    btn.appendChild(fill);
    btn.addEventListener('click', function () {
      goTo(idx, true);
    });
    strip.appendChild(btn);
    dots.push(btn);
  });

  function updateDots() {
    dots.forEach(function (btn, idx) {
      var isCurrent = idx === step;
      var isPassed = idx < step;
      btn.classList.toggle('active', isCurrent);
      btn.classList.toggle('passed', isPassed);
      btn.setAttribute('aria-pressed', isCurrent ? 'true' : 'false');
    });
  }

  function paintScene(s) {
    var svg = el('supper-svg');
    svg.classList.toggle('color-body', !!s.colorBody);
    svg.classList.toggle('color-blood', !!s.colorBlood);

    el('bread-group').style.opacity = String(s.breadOpacity);
    el('cup-group').style.opacity = String(s.cupOpacity);

    if (s.splitBread) {
      el('bread-whole-loaf').style.opacity = '0';
      el('bread-broken-halves').style.opacity = '1';
      el('bread-left-half').style.transform = 'translate(-4px, 1px) rotate(-6deg)';
      el('bread-left-half').style.transformOrigin = '38px 185px';
      el('bread-right-half').style.transform = 'translate(4px, 1px) rotate(5deg)';
      el('bread-right-half').style.transformOrigin = '46px 185px';
    } else {
      el('bread-whole-loaf').style.opacity = '1';
      el('bread-broken-halves').style.opacity = '0';
      el('bread-left-half').style.transform = 'translate(0, 0) rotate(0deg)';
      el('bread-right-half').style.transform = 'translate(0, 0) rotate(0deg)';
    }

    if (s.tiltCup) {
      el('cup-tilter').style.transform = 'translate(-4px, -8px) rotate(-32deg)';
      el('cup-pour-stream').style.opacity = '1';
      el('cup-tilted-wine').style.opacity = '1';
      el('cup-upright-wine').style.opacity = '0';
    } else {
      el('cup-tilter').style.transform = 'translate(0, 0) rotate(0deg)';
      el('cup-pour-stream').style.opacity = '0';
      el('cup-tilted-wine').style.opacity = '0';
      el('cup-upright-wine').style.opacity = s.uprightWine ? '1' : '0';
    }

    el('link-badge-bg').setAttribute('fill', s.linkBg);
    el('link-badge-bg').setAttribute('stroke', s.linkBorder);
    el('link-badge-txt').setAttribute('fill', s.linkText);

    el('left-caption').textContent = s.leftCap;
    el('left-caption').setAttribute('fill', s.leftCapColor);
    el('right-caption').textContent = s.rightCap;
    el('right-caption').setAttribute('fill', s.rightCapColor);

    el('supper-title').textContent = s.title;
    el('supper-desc').textContent = s.desc;
  }

  function goTo(idx, fromDot) {
    step = Math.max(0, Math.min(steps.length - 1, idx));
    if (!fromDot && step === 0) {
      setFocus('next');
    }
    render();
  }

  function render() {
    var s = steps[step];
    document.documentElement.style.setProperty('--step-color', s.color);
    document.documentElement.style.setProperty('--step-dark', s.dark);

    paintScene(s);
    updateDots();

    var area = el('card-area');
    area.innerHTML = '';
    area.appendChild(buildCard(s));

    var nav = document.createElement('div');
    nav.className = 'nav-bar';

    if (step === 0) {
      nav.appendChild(button('\u2190 Back', 'back', 'nav-btn ghost', function () {}));
    } else {
      nav.appendChild(button('\u2190 Back', 'back', 'nav-btn', function () {
        setFocus(step === 1 ? 'next' : 'back');
        goTo(step - 1, true);
      }));
    }

    var count = document.createElement('span');
    count.className = 'step-count';
    count.textContent = step === 0 ? 'Ready' : (step + ' of ' + (steps.length - 1));
    nav.appendChild(count);

    if (step === 0) {
      nav.appendChild(button('Begin \u2192', 'next', 'nav-btn primary', function () {
        setFocus('next');
        goTo(1, true);
      }));
    } else if (step < steps.length - 1) {
      nav.appendChild(button('Next \u2192', 'next', 'nav-btn primary', function () {
        setFocus('next');
        goTo(step + 1, true);
      }));
    } else {
      nav.appendChild(button('\u21BB Start Over', 'restart', 'nav-btn primary', function () {
        setFocus('next');
        goTo(0, true);
      }));
    }

    area.appendChild(nav);
    el('status').textContent = step === 0
      ? s.title
      : ('Step ' + step + ' of ' + (steps.length - 1) + ': ' + s.title);
    applyFocus();
  }

  fitCardHeight();
  render();

  var rt = null;
  var lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(rt);
    rt = setTimeout(fitCardHeight, 150);
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitCardHeight);
  }
})();
</script>
</body>
</html>
