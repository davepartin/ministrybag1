<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What the Table Pictures</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --ink: #2C2416;
  --muted: #6E6557;
  --border: #EBE5D9;
  --tray: #F6F4EE;
  --bg: #F8F6F1;

  /* Exact Monochrome Ink State */
  --bw-hi: #FAF9F6;
  --bw-light: #EDEBE5;
  --bw-mid: #D3CFC6;
  --bw-dark: #8A8479;
  --bw-stroke: #2C2416;

  /* Color Pair 1: Broken Bread = Given Body */
  --flesh-hi: #F4D7B5;
  --flesh-light: #E2B484;
  --flesh-mid: #C78950;
  --flesh-stroke: #7E481D;
  --bread-accent: #A96224;
  --bread-dark: #874C19;

  /* Color Pair 2: Poured Wine = Shed Blood */
  --crimson: #9B1C2E;
  --crimson-hi: #BD2C41;
  --crimson-dark: #6D1220;

  /* Finale Union Accent */
  --union: #2C2416;
}

body {
  font-family: Georgia, Cambria, serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  margin: 0;
  padding: 0;
}

.widget-outer {
  background: #FFFFFF;
  width: 100%;
  max-width: 100%;
  margin: 0;
  overflow: hidden;
  border: none;
  border-radius: 0;
  box-shadow: none;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: var(--bg);
  }
  .widget-outer {
    max-width: 460px;
    margin: 0 auto;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
  }
}

.title-bar {
  background: var(--ink);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  text-align: left;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  background: #FFFFFF;
  padding: 6px 6px 2px;
}

#supper-svg {
  display: block;
  width: 100%;
  height: auto;
}

.svg-sans {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* Selective-color SVG transitions (right side stays completely still!) */
.hand-light {
  fill: var(--bw-light);
  stroke: var(--bw-stroke);
  transition: fill 0.45s ease, stroke 0.45s ease;
}
.hand-mid {
  fill: var(--bw-mid);
  transition: fill 0.45s ease;
}
.hand-hi {
  fill: var(--bw-hi);
  transition: fill 0.45s ease;
}
.hand-shade {
  fill: #9A9388;
  opacity: 0.22;
  transition: fill 0.45s ease, opacity 0.45s ease;
}
.hand-line {
  stroke: var(--bw-stroke);
  transition: stroke 0.45s ease;
}
.hand-hatch {
  stroke: #4D463D;
  transition: stroke 0.45s ease;
}

#supper-svg.color-body .hand-light {
  fill: var(--flesh-light);
  stroke: var(--flesh-stroke);
}
#supper-svg.color-body .hand-mid {
  fill: var(--flesh-mid);
}
#supper-svg.color-body .hand-hi {
  fill: var(--flesh-hi);
}
#supper-svg.color-body .hand-shade {
  fill: #8E4E1B;
  opacity: 0.28;
}
#supper-svg.color-body .hand-line {
  stroke: var(--flesh-stroke);
}
#supper-svg.color-body .hand-hatch {
  stroke: #7A4318;
}

.blood-main {
  fill: #4A443C;
  transition: fill 0.45s ease;
}
.blood-hi {
  fill: #7B7469;
  transition: fill 0.45s ease;
}
#supper-svg.color-blood .blood-main {
  fill: var(--crimson);
}
#supper-svg.color-blood .blood-hi {
  fill: var(--crimson-hi);
}

/* Bread color toggle & ragged break motion */
.bread-light {
  fill: var(--bw-light);
  stroke: var(--bw-stroke);
  transition: fill 0.45s ease, stroke 0.45s ease;
}
.bread-mid {
  fill: var(--bw-mid);
  stroke: var(--bw-stroke);
  transition: fill 0.45s ease, stroke 0.45s ease;
}
.bread-crumb {
  fill: var(--bw-hi);
  stroke: var(--bw-mid);
  transition: fill 0.45s ease, stroke 0.45s ease, opacity 0.35s ease;
}
.bread-score {
  stroke: var(--bw-dark);
  transition: stroke 0.45s ease;
}

#supper-svg.color-body .bread-light {
  fill: var(--flesh-light);
  stroke: var(--flesh-stroke);
}
#supper-svg.color-body .bread-mid {
  fill: var(--flesh-mid);
  stroke: var(--flesh-stroke);
}
#supper-svg.color-body .bread-crumb {
  fill: var(--flesh-hi);
  stroke: var(--flesh-mid);
}
#supper-svg.color-body .bread-score {
  stroke: var(--flesh-stroke);
}

#bread-group,
#cup-group,
#bread-whole-loaf,
#bread-broken-halves,
#bread-left-half,
#bread-right-half,
#bread-crumbs,
#cup-upright,
#cup-pouring-forward,
#cup-pour-stream,
#cup-upright-wine {
  transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.38s ease;
}

@media (prefers-reduced-motion: reduce) {
  .hand-light,
  .hand-mid,
  .hand-hi,
  .hand-shade,
  .hand-line,
  .hand-hatch,
  .blood-main,
  .blood-hi,
  .bread-light,
  .bread-mid,
  .bread-crumb,
  .bread-score,
  #bread-group,
  #cup-group,
  #bread-whole-loaf,
  #bread-broken-halves,
  #bread-left-half,
  #bread-right-half,
  #bread-crumbs,
  #cup-upright,
  #cup-pouring-forward,
  #cup-pour-stream,
  #cup-upright-wine,
  .step-dot-fill,
  .nav-btn {
    transition: none;
  }
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 6px;
  background: var(--tray);
  border-top: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  border: 0;
  background: transparent;
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
}

.step-dot-fill {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2.4px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 22%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.14);
}

#card-area {
  background: var(--tray);
  padding: 6px 12px 10px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(44, 36, 22, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 13px;
  min-height: var(--card-h, 110px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  --accent-color: var(--step-dark);
}

.verse-card-title {
  font: 700 15px/1.25 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 4px;
}

.verse-card-text {
  font: 13.5px/1.42 Georgia, Cambria, serif;
  color: #3D3426;
  margin: 0;
}

.verse-card-text b {
  color: var(--accent-color, var(--ink));
  font-weight: 700;
}

.verse-card-ref {
  font: 600 11.5px/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  margin: 5px 0 0;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  appearance: none;
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: #4D4334;
  font: 600 13.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.nav-btn.primary {
  background: var(--step-color, var(--ink));
  border-color: var(--step-color, var(--ink));
  color: #FFFFFF;
}

.nav-btn.ghost {
  visibility: hidden;
  pointer-events: none;
}

.step-count {
  font: 600 12.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  text-align: center;
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (max-width: 395px) {
  #card-area {
    padding: 5px 10px 8px;
  }
  .verse-card-content {
    padding: 8px 11px;
  }
  .verse-card-title {
    font-size: 14.5px;
  }
  .verse-card-text {
    font-size: 13px;
  }
  .nav-btn {
    min-width: 88px;
    padding: 10px 12px;
  }
}

#measure {
  position: fixed;
  left: -9999px;
  top: 0;
  visibility: hidden;
  pointer-events: none;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" role="region" aria-label="Interactive Lord's Supper Analogy">
  <header class="title-bar">
    <h1>What the Table Pictures</h1>
    <span class="course-tag">202-10</span>
  </header>

  <div class="stage">
    <svg id="supper-svg" viewBox="0 0 380 264" width="100%" role="img" aria-labelledby="supper-title supper-desc">
      <title id="supper-title">What the Table Pictures</title>
      <desc id="supper-desc">Side-by-side scene showing bread and a cup on the left matching Jesus' pierced hand on the crossbeam on the right.</desc>

      <defs>
        <clipPath id="cupBowlClip">
          <path d="M 120 108 L 164 108 C 163 132 154 146 142 148 C 130 146 121 132 120 108 Z"/>
        </clipPath>
        <clipPath id="cupPourRimClip">
          <ellipse cx="142" cy="118" rx="23.5" ry="12.5"/>
        </clipPath>
        <linearGradient id="woodFadeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
          <stop offset="16%" stop-color="#FFFFFF" stop-opacity="1"/>
          <stop offset="84%" stop-color="#FFFFFF" stop-opacity="1"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <mask id="rightEdgeFade">
          <rect x="195" y="40" width="180" height="190" fill="url(#woodFadeGrad)"/>
        </mask>
        <linearGradient id="winePourGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#BD2C41"/>
          <stop offset="45%" stop-color="#9B1C2E"/>
          <stop offset="100%" stop-color="#6D1220"/>
        </linearGradient>
      </defs>

      <!-- Top Column Pills -->
      <g id="column-headers">
        <rect x="20" y="7" width="144" height="23" rx="11.5" fill="#F8F3E8" stroke="#DDD1BC" stroke-width="1"/>
        <text class="svg-sans" x="92" y="22.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6D4D25">At the Table</text>

        <rect x="216" y="7" width="144" height="23" rx="11.5" fill="#F5EFE3" stroke="#DFD4BE" stroke-width="1"/>
        <text class="svg-sans" x="288" y="22.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6F4C24">At the Cross</text>

        <line x1="190" y1="36" x2="190" y2="232" stroke="#E4DED2" stroke-width="1.3" stroke-dasharray="4 4"/>

        <g id="link-badge">
          <circle id="link-badge-bg" cx="190" cy="18.5" r="10.5" fill="#FFFFFF" stroke="#D4CFC4" stroke-width="1.5"/>
          <text id="link-badge-txt" class="svg-sans" x="190" y="22.5" text-anchor="middle" font-size="12" font-weight="800" fill="#6E6557">=</text>
        </g>
      </g>

      <!-- ===================== LEFT SIDE: AT THE TABLE ===================== -->
      <g id="table-side">
        <!-- Quiet Table Surface -->
        <rect x="12" y="190" width="166" height="14" rx="3" fill="#F3F1EC" stroke="#CCC6BA" stroke-width="1.2"/>
        <ellipse cx="52" cy="191" rx="35" ry="4" fill="#E8E4DC" stroke="#CFC9BD" stroke-width="1"/>
        <ellipse cx="142" cy="191" rx="20" ry="3.5" fill="#E8E4DC"/>

        <!-- LOAF OF BREAD (left side of table, well clear of cup) -->
        <g id="bread-group">
          <!-- Whole Unbroken Loaf (Ready only) -->
          <g id="bread-whole-loaf" opacity="1">
            <path class="bread-light"
                  d="M 20 187 L 84 187 C 82 166 68 153 52 153 C 36 153 22 166 20 187 Z"
                  stroke-width="1.6" stroke-linejoin="round"/>
            <path class="bread-mid" d="M 23 181 L 81 181 L 84 187 L 20 187 Z" stroke="none" opacity="0.48"/>
            <path class="bread-score" d="M 29 171 C 36 161 45 158 52 158" fill="none" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
            <path class="bread-score" d="M 36 170 L 45 175 M 53 167 L 63 173 M 67 170 L 74 175" fill="none" stroke-width="1.3" stroke-linecap="round" opacity="0.72"/>
          </g>

          <!-- Broken Torn Halves (Step 1+) -->
          <g id="bread-broken-halves" opacity="0">
            <!-- Left Torn Loaf Piece -->
            <g id="bread-left-half">
              <path class="bread-light"
                    d="M 20 187
                       L 53 187
                       L 50 181 L 54 174 L 49 167 L 53 161 L 50 154
                       C 35 155 22 168 20 187 Z"
                    stroke-width="1.6" stroke-linejoin="round"/>
              <path class="bread-score" d="M 28 172 C 33 163 40 160 47 159" fill="none" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
              <path class="bread-score" d="M 35 172 L 43 177" fill="none" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
              <path id="crumb-l" class="bread-crumb"
                    d="M 50 154 L 53 161 L 49 167 L 54 174 L 50 181 L 53 187 C 47 186 45 180 47 172 C 47 165 46 159 50 154 Z"
                    stroke-width="1"/>
            </g>

            <!-- Right Torn Loaf Piece -->
            <g id="bread-right-half">
              <path class="bread-light"
                    d="M 50 154
                       L 53 161 L 49 167 L 54 174 L 50 181 L 53 187
                       L 84 187
                       C 82 168 69 154 50 154 Z"
                    stroke-width="1.6" stroke-linejoin="round"/>
              <path class="bread-mid" d="M 52 181 L 83 181 L 84 187 L 53 187 Z" stroke="none" opacity="0.55"/>
              <path class="bread-score" d="M 58 161 C 66 164 72 170 76 177" fill="none" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
              <path class="bread-score" d="M 60 172 L 71 177" fill="none" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
              <path id="crumb-r" class="bread-crumb"
                    d="M 50 154 C 55 160 56 167 55 174 C 57 181 56 185 53 187 L 50 181 L 54 174 L 49 167 L 53 161 Z"
                    stroke-width="1"/>
            </g>

            <!-- Uneven torn crumbs when broken -->
            <g id="bread-crumbs">
              <polygon class="bread-crumb" points="50,183 53,185 51,187 48,185" stroke-width="0.7"/>
              <circle class="bread-crumb" cx="56" cy="188" r="1.5" stroke-width="0.7"/>
              <polygon class="bread-crumb" points="46,188 48,189 47,191 45,190" stroke-width="0.6"/>
              <circle class="bread-crumb" cx="52" cy="192" r="1.1" stroke-width="0.6"/>
            </g>
          </g>
        </g>

        <!-- CUP (upright on Ready/Step 1/Step 3; tips FORWARD TOWARD THE CAMERA on Step 2, completely clear of bread) -->
        <g id="cup-group">
          <!-- UPRIGHT CHALICE (Ready, Step 1, Step 3) -->
          <g id="cup-upright" opacity="1">
            <!-- Stem & Foot -->
            <path d="M 138.5 148 L 138.5 178 L 128 187 L 156 187 L 145.5 178 L 145.5 148 Z"
                  fill="#F1EFEA" stroke="#2C2416" stroke-width="1.5" stroke-linejoin="round"/>
            <ellipse cx="142" cy="187" rx="14.5" ry="2.7" fill="#E3E0D8" stroke="#2C2416" stroke-width="1.3"/>

            <!-- Clear Crystal Goblet Bowl -->
            <path d="M 118 106 L 166 106 C 165 133 155 148 142 150 C 129 148 119 133 118 106 Z"
                  fill="#FAFBFD" fill-opacity="0.78" stroke="#2C2416" stroke-width="1.5" stroke-linejoin="round"/>

            <!-- Upright Wine Fill (Step 3) -->
            <g clip-path="url(#cupBowlClip)">
              <g id="cup-upright-wine" opacity="0">
                <rect x="116" y="120" width="52" height="32" fill="var(--crimson)"/>
                <ellipse cx="142" cy="120" rx="21.5" ry="4" fill="var(--crimson-hi)"/>
                <path d="M 122 133 C 127 143 135 148 142 148 C 149 148 157 143 162 133 L 162 150 L 122 150 Z"
                      fill="var(--crimson-dark)" opacity="0.5"/>
              </g>
            </g>

            <!-- Specular Rim & Glass Highlight -->
            <path d="M 124 112 C 124 124 127 135 132 141" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
            <ellipse cx="142" cy="106" rx="24" ry="4.2" fill="none" stroke="#2C2416" stroke-width="1.5"/>
          </g>

          <!-- FORWARD-POURING CHALICE (Step 2: pitched forward toward the camera, pouring over front lip away from bread) -->
          <g id="cup-pouring-forward" opacity="0">
            <!-- Tilted cup body pitched toward viewer with stem angled back-right so stream never reads like a stem -->
            <g transform="rotate(16 142 118)">
              <!-- Foreshortened foot & stem angled upward/back-right behind the tilted crystal belly -->
              <ellipse cx="142" cy="69" rx="13" ry="4" fill="#E3E0D8" stroke="#2C2416" stroke-width="1.3"/>
              <path d="M 138.8 72 L 137.5 94 L 146.5 94 L 145.2 72 Z"
                    fill="#F1EFEA" stroke="#2C2416" stroke-width="1.4" stroke-linejoin="round"/>

              <!-- Back crystal belly receding behind open forward-facing rim -->
              <path d="M 118 117 C 120 89 164 89 166 117 Z"
                    fill="#F5F6F8" stroke="#2C2416" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M 124 110 C 127 97 136 92 142 92" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" opacity="0.88"/>
            </g>

            <!-- Wide elliptical open mouth facing the camera -->
            <ellipse cx="142" cy="118" rx="24.5" ry="12.5" fill="#FAFBFD" stroke="#2C2416" stroke-width="1.5"/>

            <!-- Crimson wine brimming inside open forward-tilted bowl -->
            <g clip-path="url(#cupPourRimClip)">
              <path d="M 116 114 C 126 111 158 111 168 114 L 168 134 L 116 134 Z" fill="var(--crimson)"/>
              <ellipse cx="142" cy="115" rx="22" ry="4.4" fill="var(--crimson-hi)" opacity="0.92"/>
              <path d="M 122 123 C 130 129 154 129 162 123 L 162 133 L 122 133 Z" fill="var(--crimson-dark)" opacity="0.42"/>
            </g>

            <!-- Crisp outer rim & inner upper glass lip -->
            <ellipse cx="142" cy="118" rx="24.5" ry="12.5" fill="none" stroke="#2C2416" stroke-width="1.5"/>
            <path d="M 119.5 115 C 124 108 160 108 164.5 115" fill="none" stroke="#8C857A" stroke-width="0.9" opacity="0.65"/>

            <!-- Wine Pouring Forward OVER the Front Crystal Lip Toward Camera (drawn ON TOP of rim so it clearly spills out!) -->
            <g id="cup-pour-stream" opacity="0">
              <!-- Smooth narrowing fluid sheet spilling out over front lower lip (y=127..131) toward front foreground (y=204) -->
              <path d="M 135 127.5
                       C 138 128 145 128 149 127
                       C 149 144 146 168 145 190
                       C 144.8 197 146 202 147.5 204.5
                       L 135 204.5
                       C 136.5 201 137.5 194 137.5 186
                       C 137.5 164 136 144 135 127.5 Z"
                    fill="url(#winePourGrad)"/>
              <!-- Soft curved meniscus rolling right over the front rim thickness -->
              <ellipse cx="142" cy="129" rx="6.8" ry="2.2" fill="var(--crimson-hi)" opacity="0.88"/>
              <!-- Specular gleam streaks inside pouring stream -->
              <path d="M 139.5 132 C 139.8 154 139.5 178 139 201"
                    fill="none" stroke="#E5687A" stroke-width="1.4" stroke-linecap="round" opacity="0.68"/>
              <path d="M 143.2 138 C 143 158 142.5 178 142.8 196"
                    fill="none" stroke="#BD2C41" stroke-width="0.95" stroke-linecap="round" opacity="0.48"/>
              <!-- Organic foreground wine splash & droplets (asymmetrical puddle, never mimicking a cup base) -->
              <path d="M 124 205.5
                       C 124 202.2 133 200.5 142 201
                       C 152 201.5 161 203.2 160.5 206
                       C 160 208.8 150 209.5 140 209.2
                       C 130 208.9 124 207.8 124 205.5 Z"
                    fill="var(--crimson)"/>
              <ellipse cx="141.5" cy="204.6" rx="10.5" ry="1.8" fill="var(--crimson-hi)" opacity="0.65"/>
              <ellipse cx="120.5" cy="206.5" rx="3.2" ry="1.2" fill="var(--crimson)" opacity="0.85"/>
              <circle cx="163" cy="204.5" r="1.4" fill="var(--crimson)" opacity="0.8"/>
            </g>
          </g>
        </g>
      </g>

      <!-- ===================== RIGHT SIDE: STATIC ARTWORK (OPEN HAND ON WOOD) ===================== -->
      <!-- Nothing moves here! Only selective skin color OR selective blood color turns ON. -->
      <g id="cross-beam-scene" mask="url(#rightEdgeFade)">

        <!-- Subtle Horizontal Weathered Timber Surface Underneath (lowered so open palm rises cleanly in white space) -->
        <g id="timber-beam">
          <path d="M 196 168 L 372 163 L 372 205 L 196 205 Z" fill="#F2EFE8"/>
          <path d="M 198 168 L 370 163" stroke="#6E675C" stroke-width="1.15" opacity="0.58"/>

          <!-- Woodgrain contours -->
          <path d="M 202 176 C 232 174 268 176 306 173 M 316 172 C 338 170 354 172 368 171"

          <!-- Soft grounded cast shadow directly beneath wrist and hypothenar heel -->

          <!-- Subtle diagonal ink hatching inside cast shadow under palm heel -->
          <path d="M 244 186 L 252 196 M 253 185 L 261 195 M 262 184 L 270 194 M 271 182 L 279 192 M 280 181 L 288 191 M 289 179 L 297 189 M 298 176 L 306 186 M 307 172 L 314 182"
                stroke="#4A443C" stroke-width="0.8" stroke-linecap="round" opacity="0.44"/>

        <!-- Jesus' Open Upturned Pierced Hand (True sculptural anatomy modeled on reference sketch!) -->
        <g id="jesus-hand">
          <!-- Back-plane Upright Middle Finger (extended deeply into palm web to guarantee zero gaps!) -->

            <path class="hand-mid"

            <path class="hand-line" d="M 322 90 C 327 91 331 92 334 94" fill="none" stroke-width="0.95" stroke-linecap="round"/>
            <path class="hand-hatch" d="M 331 64 L 336 66 M 330 78 L 335 80 M 328 96 L 333 98" fill="none" stroke-width="0.7" opacity="0.5"/>

          <!-- Main Hand Silhouette: Forearm + Wrist + Open Cupped Palm + Arched Thumb + Index Finger -->
          <g id="palm-and-thumb">
            <path class="hand-light"

                     C 265 120 264 126 266 128
                     C 272 121 282 110 291 93

                     C 336 154 326 168 308 174
                     C 289 180 266 181 245 186
                     C 228 190 212 198 196 205 Z"

            <!-- Soft Tonal Palm Volume & Undercarriage Shading -->
            <path class="hand-mid"
                  d="M 197 192
                     C 214 185 232 178 249 174

                     C 323 155 329 148 331 142
                     C 334 152 325 166 307 172
                     C 288 178 265 180 244 185

            <!-- Cupped hollow shadow around palm center & thumb web -->
            <path class="hand-shade"
                  d="M 248 148 C 254 134 268 124 282 124 C 296 124 306 132 308 144 C 302 154 286 158 270 156 C 256 154 248 152 248 148 Z"/>
            <!-- Soft light highlights on thenar pad, thumb tip, and index upper edge -->
            <path class="hand-hi"
                  d="M 244 144 C 242 132 246 116 256 104 C 264 95 274 90 280 92 C 278 99 268 108 260 118 C 254 127 254 140 244 144 Z"
                  opacity="0.78"/>
            <path class="hand-hi"
                  d="M 304 82 C 309 68 313 58 317 57 C 319 63 316 77 310 92 C 306 96 302 90 304 82 Z"
                  opacity="0.65"/>

            <!-- Anatomical Palm, Wrist, Thumb & Index Contour Ink Details -->

            <path class="hand-line" d="M 206 180 C 219 172 232 164 243 156" fill="none" stroke-width="1.05" stroke-linecap="round" opacity="0.7"/>
            <path class="hand-line" d="M 230 144 C 234 152 238 161 243 169" fill="none" stroke-width="0.95" stroke-linecap="round" opacity="0.55"/>
            <!-- Life line curving gently around thenar mound -->
            <path class="hand-line" d="M 263 128 C 257 137 255 150 258 161" fill="none" stroke-width="1.15" stroke-linecap="round" opacity="0.82"/>
            <!-- Palm transverse creases -->
            <path class="hand-line" d="M 284 122 C 294 123 305 127 312 132" fill="none" stroke-width="1.05" stroke-linecap="round" opacity="0.75"/>
            <path class="hand-line" d="M 286 135 C 296 136 306 140 314 146" fill="none" stroke-width="0.95" stroke-linecap="round" opacity="0.6"/>
            <!-- Thumb joint fold & thumbnail edge -->
            <path class="hand-line" d="M 259 107 C 264 109 269 111 271 114" fill="none" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
            <path class="hand-line" d="M 268 92 C 272 89 278 88 281 91 C 279 94 273 95 268 92 Z" fill="none" stroke-width="0.9" opacity="0.6"/>
            <!-- Index finger joint creases -->
            <path class="hand-line" d="M 304 75 C 309 76 315 78 318 80" fill="none" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
            <path class="hand-line" d="M 297 93 C 303 95 310 97 314 99" fill="none" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
            <path class="hand-line" d="M 289 109 C 296 111 303 114 307 117" fill="none" stroke-width="0.95" stroke-linecap="round" opacity="0.68"/>

            <!-- Delicate Graphite Cross-Hatching Shading -->
            <path class="hand-hatch"
                  d="M 205 190 L 214 196 M 214 185 L 224 192 M 223 181 L 233 188 M 233 177 L 243 184 M 244 174 L 254 182 M 256 172 L 265 180 M 268 171 L 276 179 M 280 169 L 288 177 M 292 166 L 299 174 M 303 162 L 310 170"
                  fill="none" stroke-width="0.75" stroke-linecap="round" opacity="0.52"/>
            <path class="hand-hatch"
                  d="M 239 138 L 246 143 M 241 131 L 248 136 M 244 124 L 250 128 M 249 116 L 255 120"
                  fill="none" stroke-width="0.7" stroke-linecap="round" opacity="0.42"/>
          </g>

          <!-- Foreground Curled Ring Finger (tucking cleanly in front of palm web with zero gaps) -->
          <g id="finger-ring">
            <path class="hand-light"
                  d="M 306 142
                     C 319 124 329 99 334 80
                     C 336 72 343 70 347 75
                     C 350 81 346 99 341 117
                     C 336 132 330 144 322 152 Z"
                  stroke-width="1.4" stroke-linejoin="round"/>
            <path class="hand-mid"
                  d="M 342 75 C 347 78 346 94 341 114 C 336 130 330 142 322 149 L 316 144 C 327 128 336 106 340 86 Z"
                  opacity="0.56"/>
            <path class="hand-line" d="M 332 95 C 337 97 341 99 344 101" fill="none" stroke-width="0.95" stroke-linecap="round"/>
            <path class="hand-line" d="M 326 115 C 331 117 336 119 339 121" fill="none" stroke-width="0.95" stroke-linecap="round"/>
            <!-- Subtle curved fingertip nail sliver -->
            <path class="hand-line" d="M 339 74 C 343 74 345 77 345 81" fill="none" stroke-width="0.85" stroke-linecap="round" opacity="0.65"/>
            <path class="hand-hatch" d="M 336 104 L 342 106 M 332 120 L 338 123 M 326 135 L 332 138" fill="none" stroke-width="0.7" opacity="0.5"/>
          </g>

          <!-- Foreground Curled Little Finger / Pinky on Outer Right Contour -->
          <g id="finger-pinky">
            <path class="hand-light"
                  d="M 317 166
                     C 329 156 341 139 348 119
                     C 351 110 353 98 352 93
                     C 351 89 345 89 342 95
                     C 339 103 335 120 326 135
                     C 320 145 314 152 308 158"
                  stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
            <path class="hand-mid"
                  d="M 350 93 C 353 96 351 112 345 127 C 339 143 329 156 318 164 L 312 158 C 325 147 336 132 342 114 Z"
                  opacity="0.62"/>
            <path class="hand-line" d="M 339 112 C 343 114 347 116 349 118" fill="none" stroke-width="0.95" stroke-linecap="round"/>
            <path class="hand-line" d="M 331 131 C 336 134 340 136 342 138" fill="none" stroke-width="0.9" stroke-linecap="round"/>
            <path class="hand-hatch" d="M 341 122 L 346 125 M 335 137 L 341 141 M 327 151 L 333 155" fill="none" stroke-width="0.7" opacity="0.52"/>
          </g>
        </g>

        <!-- Delicate Blood Trickles Down From Center Palm Nail (Selective Color Pair 2!) -->
        <g id="beam-blood">
          <!-- Small quiet stain right where iron spike pierces center palm -->
          <ellipse class="blood-main" cx="275" cy="135" rx="4.5" ry="2.6" stroke="#2C2416" stroke-width="0.75"/>
          <!-- Three slender solemn trickles with tiny droplets (matching reference restraint) -->
          <path class="blood-main"
                d="M 272 136 C 270 141 267 146 264 150 C 263 152 265 153 266 151 C 268 147 271 142 273 137 Z"
                stroke="#2C2416" stroke-width="0.65"/>
          <path class="blood-main"
                d="M 275.5 137 C 275 144 275.5 153 275 160 C 275 163 277.8 163 277.8 160 C 277.8 153 277.5 144 277.2 137 Z"
                stroke="#2C2416" stroke-width="0.65"/>
          <path class="blood-main"
                d="M 278.5 136 C 280 142 281 148 282 153 C 282.3 155 284.4 154.5 284 152 C 283 147 281.5 141 279.8 136 Z"
                stroke="#2C2416" stroke-width="0.65"/>
          <circle class="blood-main" cx="264.5" cy="153.5" r="1.4" stroke="#2C2416" stroke-width="0.6"/>
          <circle class="blood-main" cx="276.4" cy="162.2" r="1.6" stroke="#2C2416" stroke-width="0.6"/>
          <path class="blood-hi" d="M 276 142 C 276 148 276 153 276 157" fill="none" stroke-width="0.8" opacity="0.6"/>
        </g>

        <!-- Forged Iron Nail Spike Driven Through Center Palm (Always crisp dark iron charcoal) -->
        <g id="wrist-nail">
          <!-- Palm entry crease depression -->
          <path d="M 269 133 C 273 137 279 137 282 133" fill="none" stroke="#2C2416" stroke-width="1.2" stroke-linecap="round"/>
          <!-- Tapered forged iron shaft -->
          <polygon points="265,107 272,107 277,135 272.5,135" fill="#46413A" stroke="#2C2416" stroke-width="1.2" stroke-linejoin="round"/>
          <line x1="267" y1="109" x2="273.5" y2="133" stroke="#9E978C" stroke-width="0.9"/>
          <!-- Rough hammered beveled circular/faceted iron head -->
          <ellipse cx="268" cy="105.5" rx="9.5" ry="4.8" fill="#3E3932" stroke="#2C2416" stroke-width="1.2"/>
          <ellipse cx="268" cy="102.5" rx="9.8" ry="4.8" fill="#635C52" stroke="#2C2416" stroke-width="1.2"/>
          <path d="M 261 102 C 264 99.5 272 99.5 275 102" fill="none" stroke="#A69F93" stroke-width="0.95" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Bottom Labels -->
      <g id="stage-labels">
        <text id="left-caption" class="svg-sans" x="92" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#6E6557">Bread and Cup</text>
        <text id="right-caption" class="svg-sans" x="288" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#6E6557">Hand on the Beam</text>
      </g>
    </svg>
  </div>

  <!-- Wordless Interactive Step Strip -->
  <div class="step-strip" id="step-strip" role="group" aria-label="Lord's Supper steps"></div>

  <!-- Bottom Card & Accessible Controls -->
  <div id="card-area" aria-live="polite"></div>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
(function () {
  'use strict';

  var steps = [
    {
      dotLabel: 'Start: A Meal That Points to the Cross',
      color: '#2C2416',
      dark: '#2C2416',
      accent: '#2C2416',
      title: 'A Meal That Points to the Cross',
      text: 'Jesus gave His church bread and a cup so we would never forget His cross.',
      ref: 'Luke 22:19-20',
      leftCap: 'Bread and Cup',
      leftCapColor: '#6E6557',
      rightCap: 'Hand on the Beam',
      rightCapColor: '#6E6557',
      colorBody: false,
      colorBlood: false,
      splitBread: false,
      breadOpacity: 1,
      cupOpacity: 1,
      tiltCup: false,
      uprightWine: false,
      linkBg: '#FFFFFF',
      linkBorder: '#D4CFC4',
      linkText: '#6E6557',
      desc: 'In black and white, one whole loaf of bread and an upright empty cup sit at the table on the left. On the right rests Jesus\' open nailed hand on a wooden beam.'
    },
    {
      dotLabel: 'Step 1: The Bread and His Body',
      color: '#A96224',
      dark: '#874C19',
      accent: '#874C19',
      title: '1. The Bread: His Body',
      text: '<b>"This is my body, which is given for you."</b> The broken bread matches the warm color of His body.',
      ref: 'Luke 22:19 | 1 Corinthians 11:24',
      leftCap: 'Bread Broken',
      leftCapColor: '#874C19',
      rightCap: 'His Body Given',
      rightCapColor: '#874C19',
      colorBody: true,
      colorBlood: false,
      splitBread: true,
      breadOpacity: 1,
      cupOpacity: 0.35,
      tiltCup: false,
      uprightWine: false,
      linkBg: '#A96224',
      linkBorder: '#A96224',
      linkText: '#FFFFFF',
      desc: 'The loaf tears apart with a rough broken edge in warm bread color, while only Jesus\' hand on the beam lights up in the exact same color.'
    },
    {
      dotLabel: 'Step 2: The Cup and His Blood',
      color: '#9B1C2E',
      dark: '#6D1220',
      accent: '#9B1C2E',
      title: '2. The Cup: His Blood',
      text: '<b>"This cup is the new covenant in my blood, poured out for you."</b> The poured wine matches the color of His blood.',
      ref: 'Luke 22:20 | Matthew 26:28',
      leftCap: 'Cup Poured Out',
      leftCapColor: '#9B1C2E',
      rightCap: 'His Blood Shed',
      rightCapColor: '#9B1C2E',
      colorBody: false,
      colorBlood: true,
      splitBread: true,
      breadOpacity: 0.38,
      cupOpacity: 1,
      tiltCup: true,
      uprightWine: false,
      linkBg: '#9B1C2E',
      linkBorder: '#9B1C2E',
      linkText: '#FFFFFF',
      desc: 'The cup tips forward toward the viewer and pours crimson wine clear of the bread. On the right, Jesus\' hand returns to black and white while only the blood turns the exact same crimson.'
    },
    {
      dotLabel: 'Step 3: Remember Until He Comes',
      color: '#2C2416',
      dark: '#2C2416',
      accent: '#2C2416',
      title: '3. Remember Until He Comes',
      text: '<b>"As often as you eat this bread and drink the cup, you proclaim the Lord\'s death until he comes."</b>',
      ref: '1 Corinthians 11:24-26',
      leftCap: 'Eat and Drink',
      leftCapColor: '#2C2416',
      rightCap: 'Do This in Remembrance',
      rightCapColor: '#2C2416',
      colorBody: true,
      colorBlood: true,
      splitBread: true,
      breadOpacity: 1,
      cupOpacity: 1,
      tiltCup: false,
      uprightWine: true,
      linkBg: '#2C2416',
      linkBorder: '#2C2416',
      linkText: '#FFFFFF',
      desc: 'Broken bread and the filled cup stand together on the table while both the hand and the blood glow together in color on the crossbeam.'
    }
  ];

  var step = 0;
  var pendingFocus = null;

  function el(id) { return document.getElementById(id); }

  function setFocus(name) { pendingFocus = name; }

  function applyFocus() {
    if (!pendingFocus) return;
    var t = document.querySelector('[data-control="' + pendingFocus + '"]');
    pendingFocus = null;
    if (t) t.focus();
  }

  function button(label, control, cls, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = cls;
    b.setAttribute('data-control', control);
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function buildCard(s) {
    var vc = document.createElement('div');
    vc.className = 'verse-card';

    var bar = document.createElement('div');
    bar.className = 'verse-card-bar';
    bar.style.background = s.color;
    vc.appendChild(bar);

    var content = document.createElement('div');
    content.className = 'verse-card-content';
    content.style.setProperty('--accent-color', s.accent || s.dark);

    var title = document.createElement('h2');
    title.className = 'verse-card-title';
    title.style.color = s.dark || s.color;
    title.textContent = s.title;
    content.appendChild(title);

    var text = document.createElement('p');
    text.className = 'verse-card-text';
    text.innerHTML = s.text;
    content.appendChild(text);

    if (s.ref) {
      var ref = document.createElement('p');
      ref.className = 'verse-card-ref';
      ref.textContent = s.ref;
      content.appendChild(ref);
    }

    vc.appendChild(content);
    return vc;
  }

  function fitCardHeight() {
    var area = el('card-area');
    var cs = getComputedStyle(area);
    var w = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var m = document.createElement('div');
    m.id = 'measure';
    m.style.width = Math.max(w, 240) + 'px';
    document.documentElement.style.setProperty('--card-h', '0px');
    var max = 0;
    steps.forEach(function (s) {
      m.appendChild(buildCard(s));
    });
    document.body.appendChild(m);
    m.querySelectorAll('.verse-card-content').forEach(function (node) {
      max = Math.max(max, node.offsetHeight);
    });
    document.body.removeChild(m);
    document.documentElement.style.setProperty('--card-h', Math.max(max, 110) + 'px');
  }

  var strip = el('step-strip');
  var dots = [];
  steps.forEach(function (s, idx) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'step-dot';
    btn.style.setProperty('--dot-color', s.color);
    btn.setAttribute('aria-label', s.dotLabel);
    btn.setAttribute('aria-pressed', 'false');
    var fill = document.createElement('span');
    fill.className = 'step-dot-fill';
    btn.appendChild(fill);
    btn.addEventListener('click', function () {
      goTo(idx, true);
    });
    strip.appendChild(btn);
    dots.push(btn);
  });

  function updateDots() {
    dots.forEach(function (btn, idx) {
      var isCurrent = idx === step;
      var isPassed = idx < step;
      btn.classList.toggle('active', isCurrent);
      btn.classList.toggle('passed', isPassed);
      btn.setAttribute('aria-pressed', isCurrent ? 'true' : 'false');
    });
  }

  function paintScene(s) {
    var svg = el('supper-svg');
    svg.classList.toggle('color-body', !!s.colorBody);
    svg.classList.toggle('color-blood', !!s.colorBlood);

    el('bread-group').style.opacity = String(s.breadOpacity);
    el('cup-group').style.opacity = String(s.cupOpacity);

    if (s.splitBread) {
      el('bread-whole-loaf').style.opacity = '0';
      el('bread-broken-halves').style.opacity = '1';
      el('bread-left-half').style.transform = 'translate(-5px, 1px) rotate(-6deg)';
      el('bread-left-half').style.transformOrigin = '46px 185px';
      el('bread-right-half').style.transform = 'translate(5px, 1px) rotate(5deg)';
      el('bread-right-half').style.transformOrigin = '58px 185px';
    } else {
      el('bread-whole-loaf').style.opacity = '1';
      el('bread-broken-halves').style.opacity = '0';
      el('bread-left-half').style.transform = 'translate(0, 0) rotate(0deg)';
      el('bread-right-half').style.transform = 'translate(0, 0) rotate(0deg)';
    }

    if (s.tiltCup) {
      el('cup-upright').style.opacity = '0';
      el('cup-upright-wine').style.opacity = '0';
      el('cup-pouring-forward').style.opacity = '1';
      el('cup-pouring-forward').style.transform = 'translate(0px, 2px) scale(1.03)';
      el('cup-pouring-forward').style.transformOrigin = '142px 124px';
      el('cup-pour-stream').style.opacity = '1';
    } else {
      el('cup-upright').style.opacity = '1';
      el('cup-upright-wine').style.opacity = s.uprightWine ? '1' : '0';
      el('cup-pouring-forward').style.opacity = '0';
      el('cup-pouring-forward').style.transform = 'translate(0px, -4px) scale(0.96)';
      el('cup-pouring-forward').style.transformOrigin = '142px 124px';
      el('cup-pour-stream').style.opacity = '0';
    }

    el('link-badge-bg').setAttribute('fill', s.linkBg);
    el('link-badge-bg').setAttribute('stroke', s.linkBorder);
    el('link-badge-txt').setAttribute('fill', s.linkText);

    el('left-caption').textContent = s.leftCap;
    el('left-caption').setAttribute('fill', s.leftCapColor);
    el('right-caption').textContent = s.rightCap;
    el('right-caption').setAttribute('fill', s.rightCapColor);

    el('supper-title').textContent = s.title;
    el('supper-desc').textContent = s.desc;
  }

  function goTo(idx, fromDot) {
    step = Math.max(0, Math.min(steps.length - 1, idx));
    if (!fromDot && step === 0) {
      setFocus('next');
    }
    render();
  }

  function render() {
    var s = steps[step];
    document.documentElement.style.setProperty('--step-color', s.color);
    document.documentElement.style.setProperty('--step-dark', s.dark);

    paintScene(s);
    updateDots();

    var area = el('card-area');
    area.innerHTML = '';
    area.appendChild(buildCard(s));

    var nav = document.createElement('div');
    nav.className = 'nav-bar';

    if (step === 0) {
      nav.appendChild(button('\u2190 Back', 'back', 'nav-btn ghost', function () {}));
    } else {
      nav.appendChild(button('\u2190 Back', 'back', 'nav-btn', function () {
        setFocus(step === 1 ? 'next' : 'back');
        goTo(step - 1, true);
      }));
    }

    var count = document.createElement('span');
    count.className = 'step-count';
    count.textContent = step === 0 ? 'Ready' : (step + ' of ' + (steps.length - 1));
    nav.appendChild(count);

    if (step === 0) {
      nav.appendChild(button('Begin \u2192', 'next', 'nav-btn primary', function () {
        setFocus('next');
        goTo(1, true);
      }));
    } else if (step < steps.length - 1) {
      nav.appendChild(button('Next \u2192', 'next', 'nav-btn primary', function () {
        setFocus('next');
        goTo(step + 1, true);
      }));
    } else {
      nav.appendChild(button('\u21BB Start Over', 'restart', 'nav-btn primary', function () {
        setFocus('next');
        goTo(0, true);
      }));
    }

    area.appendChild(nav);
    el('status').textContent = step === 0
      ? s.title
      : ('Step ' + step + ' of ' + (steps.length - 1) + ': ' + s.title);
    applyFocus();
  }

  fitCardHeight();
  render();

  var rt = null;
  var lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(rt);
    rt = setTimeout(fitCardHeight, 150);
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitCardHeight);
  }
})();
</script>
</body>
</html>
