<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What the Table Pictures</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --ink: #2C2416;
  --muted: #6E6557;
  --border: #EBE5D9;
  --tray: #F6F4EE;
  --bg: #F8F6F1;

  /* Shared Color 1: Unleavened Bread & Christ's Given Body */
  --flesh-hi: #F3D4B0;
  --flesh-light: #E2B484;
  --flesh-mid: #C98A52;
  --flesh-stroke: #8C5324;
  --bread-accent: #A96224;
  --bread-dark: #874C19;

  /* Shared Color 2: Cup of Wine & Christ's Shed Blood */
  --crimson: #9B1C2E;
  --crimson-hi: #BD2C41;
  --crimson-dark: #6D1220;

  /* Remembrance & Hope Accents */
  --slate: #2A5B7C;
  --slate-dark: #1E435C;
  --gold: #946B06;
  --gold-dark: #755304;
}

body {
  font-family: Georgia, Cambria, serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  margin: 0;
  padding: 0;
}

.widget-outer {
  background: #FFFFFF;
  width: 100%;
  max-width: 100%;
  margin: 0;
  overflow: hidden;
  border: none;
  border-radius: 0;
  box-shadow: none;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: var(--bg);
  }
  .widget-outer {
    max-width: 460px;
    margin: 0 auto;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
  }
}

.title-bar {
  background: var(--ink);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  text-align: left;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  background: #FFFFFF;
  padding: 6px 6px 2px;
}

#supper-svg {
  display: block;
  width: 100%;
  height: auto;
}

.svg-sans {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.svg-serif {
  font-family: Georgia, Cambria, serif;
}

.fade-part {
  opacity: 0;
  transition: opacity 0.35s ease;
}

.fade-part.is-on {
  opacity: 1;
}

#bread-group,
#cup-group,
#hand-group,
#blood-group,
#cross-base,
#bridge-wash,
#dawn-glow,
#remember-arc,
#fellowship-table {
  transition: opacity 0.42s ease;
}

#bread-left,
#bread-right,
#cup-wine {
  transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.42s ease;
}

@media (prefers-reduced-motion: reduce) {
  .fade-part,
  #bread-group,
  #cup-group,
  #hand-group,
  #blood-group,
  #cross-base,
  #bridge-wash,
  #dawn-glow,
  #remember-arc,
  #fellowship-table,
  #bread-left,
  #bread-right,
  #cup-wine,
  .step-dot-fill,
  .nav-btn {
    transition: none;
  }
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 6px;
  background: var(--tray);
  border-top: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  border: 0;
  background: transparent;
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
}

.step-dot-fill {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2.4px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 22%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.14);
}

#card-area {
  background: var(--tray);
  padding: 6px 12px 10px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(44, 36, 22, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 13px;
  min-height: var(--card-h, 118px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  --accent-color: var(--step-dark);
}

.verse-card-title {
  font: 700 15px/1.25 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 4px;
}

.verse-card-text {
  font: 13.5px/1.42 Georgia, Cambria, serif;
  color: #3D3426;
  margin: 0;
}

.verse-card-text b {
  color: var(--accent-color, var(--ink));
  font-weight: 700;
}

.verse-card-ref {
  font: 600 11.5px/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  margin: 5px 0 0;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  appearance: none;
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: #4D4334;
  font: 600 13.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.nav-btn.primary {
  background: var(--step-color, var(--ink));
  border-color: var(--step-color, var(--ink));
  color: #FFFFFF;
}

.nav-btn.ghost {
  visibility: hidden;
  pointer-events: none;
}

.step-count {
  font: 600 12.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  text-align: center;
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (max-width: 395px) {
  #card-area {
    padding: 5px 10px 8px;
  }
  .verse-card-content {
    padding: 8px 11px;
  }
  .verse-card-title {
    font-size: 14.5px;
  }
  .verse-card-text {
    font-size: 13px;
  }
  .nav-btn {
    min-width: 88px;
    padding: 10px 12px;
  }
}

#measure {
  position: fixed;
  left: -9999px;
  top: 0;
  visibility: hidden;
  pointer-events: none;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" role="region" aria-label="Interactive Lord's Supper Analogy">
  <header class="title-bar">
    <h1>What the Table Pictures</h1>
    <span class="course-tag">202-10</span>
  </header>

  <div class="stage">
    <svg id="supper-svg" viewBox="0 0 380 272" width="100%" role="img" aria-labelledby="supper-title supper-desc">
      <title id="supper-title">What the Table Pictures</title>
      <desc id="supper-desc">Side-by-side illustration showing bread and a cup on the left matching Jesus' body and blood on the cross on the right.</desc>

      <defs>
        <radialGradient id="bodyHaloGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#E2B484" stop-opacity="0.48"/>
          <stop offset="65%" stop-color="#C98A52" stop-opacity="0.16"/>
          <stop offset="100%" stop-color="#E2B484" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="bloodHaloGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#9B1C2E" stop-opacity="0.24"/>
          <stop offset="65%" stop-color="#BD2C41" stop-opacity="0.08"/>
          <stop offset="100%" stop-color="#9B1C2E" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="dawnHaloGrad" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#FAF0C8" stop-opacity="0.98"/>
          <stop offset="50%" stop-color="#F3D98B" stop-opacity="0.56"/>
          <stop offset="100%" stop-color="#E0A526" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="breadBridgeGrad" x1="100%" y1="0%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#C98A52" stop-opacity="0.28"/>
          <stop offset="50%" stop-color="#E2B484" stop-opacity="0.34"/>
          <stop offset="100%" stop-color="#C98A52" stop-opacity="0.22"/>
        </linearGradient>
        <linearGradient id="bloodBridgeGrad" x1="100%" y1="0%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#9B1C2E" stop-opacity="0.22"/>
          <stop offset="50%" stop-color="#BD2C41" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#9B1C2E" stop-opacity="0.18"/>
        </linearGradient>
        <linearGradient id="hopeBridgeGrad" x1="100%" y1="0%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#E0A526" stop-opacity="0.34"/>
          <stop offset="50%" stop-color="#F3D98B" stop-opacity="0.30"/>
          <stop offset="100%" stop-color="#E0A526" stop-opacity="0.16"/>
        </linearGradient>
        <clipPath id="cupBowlClip">
          <path d="M 118 118 L 166 118 C 165 144 156 158 142 160 C 128 158 119 144 118 118 Z"/>
        </clipPath>
      </defs>

      <!-- Top Parallel Column Headers + Center Equals Link Badge -->
      <g id="column-headers">
        <rect x="24" y="7" width="140" height="23" rx="11.5" fill="#F8F3E8" stroke="#DDD1BC" stroke-width="1"/>
        <text class="svg-sans" x="94" y="22.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6D4D25">At the Table</text>

        <rect x="216" y="7" width="140" height="23" rx="11.5" fill="#F5EFE3" stroke="#DFD4BE" stroke-width="1"/>
        <text class="svg-sans" x="286" y="22.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6F4C24">At the Cross</text>

        <line x1="190" y1="36" x2="190" y2="236" stroke="#E4DED2" stroke-width="1.4" stroke-dasharray="4 4"/>

        <g id="link-badge">
          <circle id="link-badge-bg" cx="190" cy="18.5" r="10.5" fill="#FFFFFF" stroke="#D4CFC4" stroke-width="1.5"/>
          <text id="link-badge-txt" class="svg-sans" x="190" y="22.5" text-anchor="middle" font-size="12" font-weight="800" fill="#6E6557">=</text>
        </g>
      </g>

      <!-- Soft color-match connecting wash across the center divider -->
      <g id="bridge-wash" opacity="0">
        <path id="bridge-path" d="M 52 150 L 252 96 L 266 138 L 76 194 Z" fill="url(#breadBridgeGrad)"/>
      </g>

      <!-- Golden Dawn Horizon Behind Right Cross (Step 4) -->
      <g id="dawn-glow" opacity="0">
        <circle cx="292" cy="126" r="76" fill="url(#dawnHaloGrad)"/>
        <line x1="292" y1="54" x2="292" y2="64" stroke="#E0A526" stroke-width="2" stroke-linecap="round" opacity="0.72"/>
        <line x1="252" y1="68" x2="260" y2="76" stroke="#E0A526" stroke-width="2" stroke-linecap="round" opacity="0.62"/>
        <line x1="332" y1="68" x2="324" y2="76" stroke="#E0A526" stroke-width="2" stroke-linecap="round" opacity="0.62"/>
        <line x1="236" y1="96" x2="246" y2="99" stroke="#E0A526" stroke-width="2" stroke-linecap="round" opacity="0.52"/>
        <line x1="348" y1="96" x2="338" y2="99" stroke="#E0A526" stroke-width="2" stroke-linecap="round" opacity="0.52"/>
      </g>

      <!-- ===================== LEFT SIDE: AT THE TABLE ===================== -->
      <g id="table-side">
        <!-- Warm linen table runner & wood table surface -->
        <rect x="14" y="196" width="166" height="24" rx="4" fill="#F2ECE0" stroke="#DDD3C0" stroke-width="1.2"/>
        <path d="M 14 210 L 180 210 L 180 220 C 180 222 178 224 176 224 L 18 224 C 16 224 14 222 14 220 Z" fill="#C9B396"/>
        <ellipse cx="64" cy="197" rx="40" ry="5" fill="#E3DAC8" stroke="#CBBFA7" stroke-width="1"/>
        <ellipse cx="142" cy="197" rx="22" ry="4" fill="#E3DAC8"/>

        <!-- Golden fellowship halo & look-forward arc (Step 4) -->
        <g id="fellowship-table" opacity="0">
          <ellipse cx="98" cy="170" rx="74" ry="42" fill="url(#dawnHaloGrad)" opacity="0.52"/>
          <path d="M 130 66 C 166 48 212 48 248 64"
                fill="none" stroke="#946B06" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round"/>
          <path d="M 244 56 L 252 65 L 240 67"
                fill="none" stroke="#946B06" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="144" y="38" width="92" height="17" rx="8.5" fill="#FDF5DC" stroke="#E5CF8B" stroke-width="1"/>
          <text class="svg-sans" x="190" y="50" text-anchor="middle" font-size="9.5" font-weight="700" fill="#755304">Look Forward</text>
        </g>

        <!-- UNLEAVENED BREAD (uses EXACT --flesh-light / --flesh-mid / --flesh-stroke palette) -->
        <g id="bread-group">
          <ellipse id="bread-halo" cx="64" cy="176" rx="42" ry="24" fill="url(#bodyHaloGrad)" opacity="0"/>

          <!-- Left Half of Loaf -->
          <g id="bread-left">
            <path d="M 28 193 L 64 193 L 64 158 C 44 158 29 170 28 193 Z"
                  fill="var(--flesh-light)" stroke="var(--flesh-stroke)" stroke-width="1.6" stroke-linejoin="round"/>
            <!-- Soft top crust highlight & scored line -->
            <path d="M 35 178 C 41 167 51 163 61 163" fill="none" stroke="var(--flesh-hi)" stroke-width="2" stroke-linecap="round"/>
            <path d="M 43 175 L 55 182" fill="none" stroke="var(--flesh-mid)" stroke-width="1.4" stroke-linecap="round"/>
            <!-- Cut crumb face visible when split -->
            <path id="crumb-face-l" class="fade-part" d="M 64 159 L 64 192 C 59 191 58 184 60 176 C 61 168 60 162 64 159 Z"
                  fill="var(--flesh-hi)" stroke="var(--flesh-mid)" stroke-width="1"/>
          </g>

          <!-- Right Half of Loaf -->
          <g id="bread-right">
            <path d="M 64 193 L 100 193 C 99 170 84 158 64 158 Z"
                  fill="var(--flesh-mid)" stroke="var(--flesh-stroke)" stroke-width="1.6" stroke-linejoin="round"/>
            <!-- Match inner light tone on right shoulder -->
            <path d="M 64 159 C 78 159 90 168 94 184 L 64 184 Z"
                  fill="var(--flesh-light)" opacity="0.88"/>
            <path d="M 68 164 C 77 166 84 171 88 179" fill="none" stroke="var(--flesh-hi)" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M 73 175 L 85 181" fill="none" stroke="var(--flesh-stroke)" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
            <path id="crumb-face-r" class="fade-part" d="M 64 159 C 68 163 67 171 67 177 C 67 185 69 191 64 192 Z"
                  fill="var(--flesh-hi)" stroke="var(--flesh-mid)" stroke-width="1"/>
          </g>

          <!-- Falling Crumbs when broken -->
          <g id="bread-crumbs" class="fade-part">
            <circle cx="62" cy="187" r="1.8" fill="var(--flesh-mid)"/>
            <circle cx="66" cy="191" r="1.5" fill="var(--flesh-stroke)" opacity="0.75"/>
            <circle cx="63.5" cy="195" r="1.4" fill="var(--flesh-light)" stroke="var(--flesh-stroke)" stroke-width="0.6"/>
          </g>
        </g>

        <!-- CHALICE / CUP OF WINE (uses EXACT --crimson / --crimson-hi / --crimson-dark palette) -->
        <g id="cup-group">
          <ellipse id="cup-halo" cx="142" cy="146" rx="34" ry="38" fill="url(#bloodHaloGrad)" opacity="0"/>

          <!-- Clear Chalice Stem & Foot -->
          <path d="M 138 159 L 138 186 L 127 195 L 157 195 L 146 186 L 146 159 Z"
                fill="#EAE4D7" stroke="#6E6557" stroke-width="1.5" stroke-linejoin="round"/>
          <ellipse cx="142" cy="195" rx="16" ry="3" fill="#DDD5C5" stroke="#6E6557" stroke-width="1.3"/>

          <!-- Outer Crystal Glass Bowl -->
          <path d="M 116 116 L 168 116 C 167 144 157 160 142 162 C 127 160 117 144 116 116 Z"
                fill="#F7FAFC" fill-opacity="0.72" stroke="#6E6557" stroke-width="1.6" stroke-linejoin="round"/>

          <!-- Deep Crimson Wine Inside Bowl (clipped to glass bowl, slides/fades in on Step 2+) -->
          <g clip-path="url(#cupBowlClip)">
            <g id="cup-wine" opacity="0">
              <rect x="114" y="131" width="56" height="34" fill="var(--crimson)"/>
              <!-- Subtle deep base crescent -->
              <path d="M 120 144 C 126 155 135 160 142 160 C 150 160 158 155 164 144 L 164 162 L 120 162 Z"
                    fill="var(--crimson-dark)" opacity="0.55"/>
              <!-- Surface meniscus highlight matching shed blood sheen -->
              <ellipse cx="142" cy="131" rx="23.5" ry="4.6" fill="var(--crimson-hi)"/>
              <ellipse cx="142" cy="131" rx="17" ry="2.2" fill="#D94D61" opacity="0.45"/>
            </g>
          </g>

          <!-- Glass Specular Gleam + Rim -->
          <path d="M 122 122 C 122 135 126 146 131 152" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.88"/>
          <ellipse cx="142" cy="116" rx="26" ry="4.5" fill="none" stroke="#6E6557" stroke-width="1.5"/>
        </g>
      </g>

      <!-- ===================== RIGHT SIDE: AT THE CROSS ===================== -->
      <g id="cross-side">
        <!-- Timber Cross + Crown of Thorns -->
        <g id="cross-base">
          <!-- Vertical post -->
          <rect x="281" y="44" width="30" height="178" rx="3" fill="#6E5338" stroke="#4D3824" stroke-width="1.5"/>
          <path d="M 303 45 L 310 45 L 310 221 L 303 221 Z" fill="#5A422B" opacity="0.65"/>
          <line x1="289" y1="54" x2="289" y2="210" stroke="#533D28" stroke-width="1" opacity="0.45"/>

          <!-- Horizontal crossbeam (spanning left-to-right for outstretched hand) -->
          <rect x="206" y="102" width="160" height="28" rx="3" fill="#775A3E" stroke="#4D3824" stroke-width="1.5"/>
          <path d="M 207 123 L 365 123 L 365 129 L 207 129 Z" fill="#5B422B" opacity="0.65"/>
          <line x1="216" y1="110" x2="356" y2="110" stroke="#533D28" stroke-width="1" opacity="0.4"/>

          <!-- Stylized Crown of Thorns resting across top post -->
          <g id="thorns-crown">
            <ellipse cx="296" cy="79" rx="23" ry="8.5" fill="none" stroke="#4E3823" stroke-width="3"/>
            <path d="M 274 79 C 284 71 308 87 318 78" fill="none" stroke="#65492F" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M 276 76 C 288 86 304 71 317 81" fill="none" stroke="#3F2C1B" stroke-width="1.8" stroke-linecap="round"/>
            <!-- Small clean thorns -->
            <path d="M 279 73 L 274 68 M 292 70 L 290 64 M 305 71 L 309 65 M 316 76 L 322 72 M 286 87 L 283 93 M 303 87 L 307 93"
                  stroke="#3F2C1B" stroke-width="1.5" stroke-linecap="round"/>
          </g>
        </g>

        <!-- CLOSE-UP OUTSTRETCHED HAND & NAIL (uses EXACT --flesh-light / --flesh-mid / --flesh-stroke as the Bread!) -->
        <g id="hand-group">
          <circle id="hand-halo" cx="284" cy="116" r="44" fill="url(#bodyHaloGrad)" opacity="0"/>

          <!-- Sculptural Tapered Wrist + Open Palm + Thumb + Four Soft Fingers along Crossbeam -->
          <path d="M 218 110
                   C 234 109.5 248 108 258 107
                   C 264 105.5 270 100 274.5 95
                   C 277.5 92 282 93.5 281.5 97.5
                   C 280.5 101.5 276 104.5 274.5 106.5
                   L 293 105.5
                   C 300 105 313 104.5 316.5 106
                   C 319.5 107 319.5 111 315.5 112
                   L 299 112.5
                   L 320.5 112.5
                   C 324.5 113 324.5 117 320.5 118
                   L 299 118.5
                   L 318.5 119
                   C 322 119.5 322 123 318.5 123.5
                   L 297 123.8
                   L 311 124.2
                   C 314.5 124.8 314 128.5 310 128.5
                   L 266 127.5
                   C 259 127.5 253 125 246 124.2
                   C 235 123.5 224 123 218 122.5 Z"
                fill="var(--flesh-light)" stroke="var(--flesh-stroke)" stroke-width="1.5" stroke-linejoin="round"/>

          <!-- Subtle forearm / palm shading matching the darker bread half -->
          <path d="M 219 119 C 234 119.5 246 120 255 120.5 C 262 123 270 125.8 286 125.8 L 308 126.8 L 266 127.5 C 259 127.5 253 125 246 124.2 C 235 123.5 224 123 219 122.5 Z"
                fill="var(--flesh-mid)" opacity="0.65"/>
          <path d="M 271 112 C 273 120 280 124 289 124" fill="none" stroke="var(--flesh-mid)" stroke-width="1.3" stroke-linecap="round"/>

          <!-- Iron Nail Head in center of palm -->
          <circle cx="282" cy="117" r="4.5" fill="#46413C" stroke="#2C2416" stroke-width="1.2"/>
          <circle cx="280.8" cy="115.8" r="1.4" fill="#857E74"/>
        </g>

        <!-- SHED BLOOD STREAM & DROPS (uses EXACT --crimson / --crimson-hi / --crimson-dark as the Wine!) -->
        <g id="blood-group" opacity="0">
          <circle cx="292" cy="156" r="44" fill="url(#bloodHaloGrad)"/>

          <!-- Subtle crimson mark around the nail -->
          <circle cx="282" cy="121" r="3.4" fill="var(--crimson)"/>
          <!-- Clean flowing crimson stream down the upright timber -->
          <path d="M 282 122 C 282 140 287 148 287 166 C 287 180 285 192 288 208"
                fill="none" stroke="var(--crimson)" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M 282 125 C 282 140 286 148 286 164"
                fill="none" stroke="var(--crimson-hi)" stroke-width="1.1" stroke-linecap="round" opacity="0.75"/>

          <!-- Clean stylized droplets -->
          <path d="M 297 148 C 297 148 301 154 301 157 C 301 159.5 299.2 161.2 297 161.2 C 294.8 161.2 293 159.5 293 157 C 293 154 297 148 297 148 Z"
                fill="var(--crimson)"/>
          <circle cx="296" cy="156.5" r="1.1" fill="var(--crimson-hi)"/>

          <path d="M 277 175 C 277 175 280.5 180.5 280.5 183 C 280.5 185 278.9 186.6 277 186.6 C 275.1 186.6 273.5 185 273.5 183 C 273.5 180.5 277 175 277 175 Z"
                fill="var(--crimson)"/>

          <!-- Covenant Crimson Pool at Cross Base -->
          <ellipse cx="296" cy="222" rx="34" ry="5.5" fill="var(--crimson)"/>
          <ellipse cx="294" cy="221" rx="22" ry="2.2" fill="var(--crimson-hi)" opacity="0.55"/>
        </g>

        <!-- Remembrance Directional Arc (Step 3: Look Back from Cross to Table) -->
        <g id="remember-arc" opacity="0">
          <path d="M 248 64 C 212 48 166 48 130 66"
                fill="none" stroke="#2A5B7C" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round"/>
          <path d="M 134 58 L 126 67 L 138 69"
                fill="none" stroke="#2A5B7C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="150" y="38" width="80" height="17" rx="8.5" fill="#E9F2F7" stroke="#BFD6E4" stroke-width="1"/>
          <text class="svg-sans" x="190" y="50" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1E435C">Look Back</text>
        </g>
      </g>

      <!-- Clean Bottom Pair Labels -->
      <g id="stage-labels">
        <text id="left-caption" class="svg-sans" x="94" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#6E6557">Bread and Cup</text>
        <text id="right-caption" class="svg-sans" x="286" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#6E6557">Cross of Christ</text>
      </g>
    </svg>
  </div>

  <!-- Wordless Interactive Step Strip -->
  <div class="step-strip" id="step-strip" role="group" aria-label="Lord's Supper steps"></div>

  <!-- Bottom Card & Accessible Controls -->
  <div id="card-area" aria-live="polite"></div>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
(function () {
  'use strict';

  var steps = [
    {
      dotLabel: 'Start: A Meal That Points to the Cross',
      color: '#2C2416',
      dark: '#2C2416',
      accent: '#2C2416',
      title: 'A Meal That Points to the Cross',
      text: 'Jesus left us bread and a cup so we would never forget His cross.',
      ref: 'Luke 22:15, 19-20',
      leftCap: 'Bread and Cup',
      leftCapColor: '#6E6557',
      rightCap: 'Cross of Christ',
      rightCapColor: '#6E6557',
      splitBread: false,
      breadOpacity: 0.78,
      cupWine: false,
      cupOpacity: 0.78,
      handOpacity: 0,
      handHalo: false,
      breadHalo: false,
      cupHalo: false,
      showBlood: false,
      crossOpacity: 0.72,
      bridge: 'none',
      linkBg: '#FFFFFF',
      linkBorder: '#D4CFC4',
      linkText: '#6E6557',
      dawn: false,
      rememberArc: false,
      fellowship: false,
      desc: 'Whole loaf of bread and an empty chalice sit on a table on the left. On the right stands Jesus\' wooden cross with a crown of thorns.'
    },
    {
      dotLabel: 'Step 1: The Bread and His Body',
      color: '#A96224',
      dark: '#874C19',
      accent: '#874C19',
      title: '1. The Bread: His Body',
      text: '<b>"This is my body, which is given for you."</b> Broken bread, same color as His body on the cross.',
      ref: 'Luke 22:19 | 1 Corinthians 11:24',
      leftCap: 'Bread Broken',
      leftCapColor: '#874C19',
      rightCap: 'Body Given',
      rightCapColor: '#874C19',
      splitBread: true,
      breadOpacity: 1,
      cupWine: false,
      cupOpacity: 0.20,
      handOpacity: 1,
      handHalo: true,
      breadHalo: true,
      cupHalo: false,
      showBlood: false,
      crossOpacity: 0.96,
      bridge: 'bread',
      linkBg: '#A96224',
      linkBorder: '#A96224',
      linkText: '#FFFFFF',
      dawn: false,
      rememberArc: false,
      fellowship: false,
      desc: 'The bread splits cleanly into two halves in warm golden-sand color, matching the exact color of Jesus\' nailed open hand on the crossbeam.'
    },
    {
      dotLabel: 'Step 2: The Cup and His Blood',
      color: '#9B1C2E',
      dark: '#6D1220',
      accent: '#9B1C2E',
      title: '2. The Cup: His Blood',
      text: '<b>"This cup is the new covenant in my blood."</b> Crimson wine, same color as His blood shed for you.',
      ref: 'Luke 22:20 | Matthew 26:28',
      leftCap: 'Cup Poured',
      leftCapColor: '#9B1C2E',
      rightCap: 'Blood Shed',
      rightCapColor: '#9B1C2E',
      splitBread: true,
      breadOpacity: 0.20,
      cupWine: true,
      cupOpacity: 1,
      handOpacity: 0.56,
      handHalo: false,
      breadHalo: false,
      cupHalo: true,
      showBlood: true,
      crossOpacity: 0.96,
      bridge: 'blood',
      linkBg: '#9B1C2E',
      linkBorder: '#9B1C2E',
      linkText: '#FFFFFF',
      dawn: false,
      rememberArc: false,
      fellowship: false,
      desc: 'The chalice fills with deep crimson wine on the left, matching the exact crimson blood flowing down the cross from Jesus\' pierced hand on the right.'
    },
    {
      dotLabel: 'Step 3: Do This in Remembrance',
      color: '#2A5B7C',
      dark: '#1E435C',
      accent: '#1E435C',
      title: '3. Look Back: Remember Me',
      text: '<b>"Do this in remembrance of me."</b> Come honestly, look back to Jesus, and give thanks.',
      ref: '1 Corinthians 11:24-25',
      leftCap: 'Eat and Drink',
      leftCapColor: '#1E435C',
      rightCap: 'Look Back to Cross',
      rightCapColor: '#1E435C',
      splitBread: true,
      breadOpacity: 1,
      cupWine: true,
      cupOpacity: 1,
      handOpacity: 0.92,
      handHalo: false,
      breadHalo: false,
      cupHalo: false,
      showBlood: true,
      crossOpacity: 1,
      bridge: 'none',
      linkBg: '#2A5B7C',
      linkBorder: '#2A5B7C',
      linkText: '#FFFFFF',
      dawn: false,
      rememberArc: true,
      fellowship: false,
      desc: 'Broken bread and the filled cup stand together on the table while an arrow traces back from the cross, showing the meal reminds us of Jesus.'
    },
    {
      dotLabel: 'Step 4: Proclaim Until He Comes',
      color: '#946B06',
      dark: '#755304',
      accent: '#755304',
      title: '4. Look Forward: Until He Comes',
      text: '<b>"You proclaim the Lord\'s death until he comes."</b> One table together until we eat with Jesus face to face.',
      ref: '1 Corinthians 11:26 | Luke 22:18',
      leftCap: 'One Shared Table',
      leftCapColor: '#755304',
      rightCap: 'Until He Comes',
      rightCapColor: '#755304',
      splitBread: true,
      breadOpacity: 1,
      cupWine: true,
      cupOpacity: 1,
      handOpacity: 0.58,
      handHalo: false,
      breadHalo: false,
      cupHalo: false,
      showBlood: true,
      crossOpacity: 0.96,
      bridge: 'hope',
      linkBg: '#946B06',
      linkBorder: '#946B06',
      linkText: '#FFFFFF',
      dawn: true,
      rememberArc: false,
      fellowship: true,
      desc: 'Golden morning light rises behind the cross while broken bread and wine are shared together at one table, looking forward to Christ\'s return.'
    }
  ];

  var step = 0;
  var pendingFocus = null;

  function el(id) { return document.getElementById(id); }

  function setFocus(name) { pendingFocus = name; }

  function applyFocus() {
    if (!pendingFocus) return;
    var t = document.querySelector('[data-control="' + pendingFocus + '"]');
    pendingFocus = null;
    if (t) t.focus();
  }

  function button(label, control, cls, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = cls;
    b.setAttribute('data-control', control);
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function buildCard(s) {
    var vc = document.createElement('div');
    vc.className = 'verse-card';

    var bar = document.createElement('div');
    bar.className = 'verse-card-bar';
    bar.style.background = s.color;
    vc.appendChild(bar);

    var content = document.createElement('div');
    content.className = 'verse-card-content';
    content.style.setProperty('--accent-color', s.accent || s.dark);

    var title = document.createElement('h2');
    title.className = 'verse-card-title';
    title.style.color = s.dark || s.color;
    title.textContent = s.title;
    content.appendChild(title);

    var text = document.createElement('p');
    text.className = 'verse-card-text';
    text.innerHTML = s.text;
    content.appendChild(text);

    if (s.ref) {
      var ref = document.createElement('p');
      ref.className = 'verse-card-ref';
      ref.textContent = s.ref;
      content.appendChild(ref);
    }

    vc.appendChild(content);
    return vc;
  }

  function fitCardHeight() {
    var area = el('card-area');
    var cs = getComputedStyle(area);
    var w = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var m = document.createElement('div');
    m.id = 'measure';
    m.style.width = Math.max(w, 240) + 'px';
    document.documentElement.style.setProperty('--card-h', '0px');
    var max = 0;
    steps.forEach(function (s) {
      m.appendChild(buildCard(s));
    });
    document.body.appendChild(m);
    m.querySelectorAll('.verse-card-content').forEach(function (node) {
      max = Math.max(max, node.offsetHeight);
    });
    document.body.removeChild(m);
    document.documentElement.style.setProperty('--card-h', Math.max(max, 118) + 'px');
  }

  var strip = el('step-strip');
  var dots = [];
  steps.forEach(function (s, idx) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'step-dot';
    btn.style.setProperty('--dot-color', s.color);
    btn.setAttribute('aria-label', s.dotLabel);
    btn.setAttribute('aria-pressed', 'false');
    var fill = document.createElement('span');
    fill.className = 'step-dot-fill';
    btn.appendChild(fill);
    btn.addEventListener('click', function () {
      goTo(idx, true);
    });
    strip.appendChild(btn);
    dots.push(btn);
  });

  function updateDots() {
    dots.forEach(function (btn, idx) {
      var isCurrent = idx === step;
      var isPassed = idx < step;
      btn.classList.toggle('active', isCurrent);
      btn.classList.toggle('passed', isPassed);
      btn.setAttribute('aria-pressed', isCurrent ? 'true' : 'false');
    });
  }

  function paintScene(s) {
    el('bread-group').style.opacity = String(s.breadOpacity);
    el('cup-group').style.opacity = String(s.cupOpacity);
    el('hand-group').style.opacity = String(s.handOpacity);
    el('cross-base').style.opacity = String(s.crossOpacity);

    el('bread-halo').style.opacity = s.breadHalo ? '1' : '0';
    el('hand-halo').style.opacity = s.handHalo ? '1' : '0';
    el('cup-halo').style.opacity = s.cupHalo ? '1' : '0';

    if (s.splitBread) {
      el('bread-left').style.transform = 'translate(-8px, 1px) rotate(-7deg)';
      el('bread-left').style.transformOrigin = '56px 190px';
      el('bread-right').style.transform = 'translate(8px, 1px) rotate(7deg)';
      el('bread-right').style.transformOrigin = '72px 190px';
      el('crumb-face-l').classList.add('is-on');
      el('crumb-face-r').classList.add('is-on');
      el('bread-crumbs').classList.add('is-on');
    } else {
      el('bread-left').style.transform = 'translate(0, 0) rotate(0deg)';
      el('bread-right').style.transform = 'translate(0, 0) rotate(0deg)';
      el('crumb-face-l').classList.remove('is-on');
      el('crumb-face-r').classList.remove('is-on');
      el('bread-crumbs').classList.remove('is-on');
    }

    el('cup-wine').style.opacity = s.cupWine ? '1' : '0';
    el('blood-group').style.opacity = s.showBlood ? '1' : '0';

    var bridge = el('bridge-wash');
    var bridgePath = el('bridge-path');
    if (s.bridge === 'bread') {
      bridgePath.setAttribute('fill', 'url(#breadBridgeGrad)');
      bridgePath.setAttribute('d', 'M 48 156 L 266 95 L 278 136 L 78 192 Z');
      bridge.style.opacity = '1';
    } else if (s.bridge === 'blood') {
      bridgePath.setAttribute('fill', 'url(#bloodBridgeGrad)');
      bridgePath.setAttribute('d', 'M 122 122 L 298 118 L 302 186 L 122 158 Z');
      bridge.style.opacity = '1';
    } else if (s.bridge === 'hope') {
      bridgePath.setAttribute('fill', 'url(#hopeBridgeGrad)');
      bridgePath.setAttribute('d', 'M 48 142 L 296 104 L 296 168 L 48 192 Z');
      bridge.style.opacity = '1';
    } else {
      bridge.style.opacity = '0';
    }

    el('dawn-glow').style.opacity = s.dawn ? '1' : '0';
    el('remember-arc').style.opacity = s.rememberArc ? '1' : '0';
    el('fellowship-table').style.opacity = s.fellowship ? '1' : '0';

    el('link-badge-bg').setAttribute('fill', s.linkBg);
    el('link-badge-bg').setAttribute('stroke', s.linkBorder);
    el('link-badge-txt').setAttribute('fill', s.linkText);

    el('left-caption').textContent = s.leftCap;
    el('left-caption').setAttribute('fill', s.leftCapColor);
    el('right-caption').textContent = s.rightCap;
    el('right-caption').setAttribute('fill', s.rightCapColor);

    el('supper-title').textContent = s.title;
    el('supper-desc').textContent = s.desc;
  }

  function goTo(idx, fromDot) {
    step = Math.max(0, Math.min(steps.length - 1, idx));
    if (!fromDot) {
      if (step === 0) setFocus('next');
    }
    render();
  }

  function render() {
    var s = steps[step];
    document.documentElement.style.setProperty('--step-color', s.color);
    document.documentElement.style.setProperty('--step-dark', s.dark);

    paintScene(s);
    updateDots();

    var area = el('card-area');
    area.innerHTML = '';
    area.appendChild(buildCard(s));

    var nav = document.createElement('div');
    nav.className = 'nav-bar';

    if (step === 0) {
      nav.appendChild(button('\u2190 Back', 'back', 'nav-btn ghost', function () {}));
    } else {
      nav.appendChild(button('\u2190 Back', 'back', 'nav-btn', function () {
        setFocus(step === 1 ? 'next' : 'back');
        goTo(step - 1, true);
      }));
    }

    var count = document.createElement('span');
    count.className = 'step-count';
    count.textContent = step === 0 ? 'Ready' : (step + ' of ' + (steps.length - 1));
    nav.appendChild(count);

    if (step === 0) {
      nav.appendChild(button('Begin \u2192', 'next', 'nav-btn primary', function () {
        setFocus('next');
        goTo(1, true);
      }));
    } else if (step < steps.length - 1) {
      nav.appendChild(button('Next \u2192', 'next', 'nav-btn primary', function () {
        setFocus('next');
        goTo(step + 1, true);
      }));
    } else {
      nav.appendChild(button('\u21BB Start Over', 'restart', 'nav-btn primary', function () {
        setFocus('next');
        goTo(0, true);
      }));
    }

    area.appendChild(nav);
    el('status').textContent = step === 0
      ? s.title
      : ('Step ' + step + ' of ' + (steps.length - 1) + ': ' + s.title);
    applyFocus();
  }

  fitCardHeight();
  render();

  var rt = null;
  var lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(rt);
    rt = setTimeout(fitCardHeight, 150);
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitCardHeight);
  }
})();
</script>
</body>
</html>
