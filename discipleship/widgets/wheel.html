<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wheel</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Georgia', 'Cambria', serif;
            background: #F8F6F1;
            color: #2C2416;
            -webkit-font-smoothing: antialiased;
            padding: 0;
            margin: 0;
        }

        .widget-outer {
            background: #FFFFFF;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
            border: none;
            max-width: 100%;
            width: 100%;
            margin: 0;
            position: relative;
        }

        @media (min-width: 560px) {
            body { padding: 16px; background: #F8F6F1; }
            .widget-outer {
                border-radius: 12px;
                box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
                border: 1px solid #EBE5D9;
                max-width: 460px;
                margin: 0 auto;
            }
        }

        button { -webkit-tap-highlight-color: transparent; font-family: 'Trebuchet MS', sans-serif; }
        button:focus-visible { outline: 3px solid #2C2416; outline-offset: 2px; }

        .title-bar { background: #1D6B3F; padding: 10px 16px; text-align: center; }
        .title-bar h1 {
            font-size: 19px; font-weight: 700; color: #FFFFFF; margin: 0; line-height: 1.2;
            font-family: 'Trebuchet MS', 'Inter', sans-serif;
        }

        .diagram-wrapper { padding: 8px 8px 0; }
        svg#scene { display: block; width: 100%; height: auto; max-height: 300px; }
        .label { font-family: 'Trebuchet MS', sans-serif; font-size: 16px; font-weight: 700; }
        .phrase { font-family: 'Georgia', serif; font-size: 17px; font-style: italic; }

        #card-area { background-color: #F6F4EE; border-top: 1px solid #EBE5D9; padding-top: 8px; }
        .verse-card-wrapper { margin: 0 auto; padding: 0 12px 8px; max-width: 460px; }
        .verse-card { background: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 14px rgba(44,36,22,0.06); }
        .verse-card-bar { height: 4px; }
        .verse-card-content { padding: 10px 16px; min-height: var(--card-h, 112px); display: flex; flex-direction: column; justify-content: flex-start; }
        .card-title { font-family: 'Trebuchet MS', sans-serif; font-size: 16px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
        .card-text { font-size: 15px; line-height: 1.4; color: #3D3426; }
        .card-ref { font-family: 'Trebuchet MS', sans-serif; font-size: 13px; color: #6B6358; margin-top: 4px; }

        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 0 2px; gap: 8px; }
        .nav-btn {
            background: transparent; border: 1.5px solid #D4CFC4; border-radius: 10px;
            padding: 10px 16px; min-height: 44px; font-size: 14px; color: #5A4E3C; cursor: pointer; font-weight: 600;
        }
        .nav-bar .nav-btn { min-width: 112px; text-align: center; }
        .nav-btn.primary { color: #FFFFFF; border: none; background: #1D6B3F; }
        .nav-btn[disabled] { opacity: 0.35; cursor: default; }
        .step-count { font-family: 'Trebuchet MS', sans-serif; font-size: 13px; color: #6B6358; }

        .begin-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 16px 16px; }
        .begin-text { font-size: 16px; line-height: 1.4; text-align: center; color: #3D3426; max-width: 340px; }
        .begin-btn {
            background: #1D6B3F; color: #FFFFFF; border: none; border-radius: 10px;
            padding: 12px 28px; min-height: 44px; font-size: 16px; font-weight: 700; cursor: pointer;
        }
        .overview-btn {
            background: transparent; border: 1.5px solid #D4CFC4; border-radius: 10px;
            padding: 10px 16px; min-height: 44px; font-size: 14px; color: #5A4E3C; cursor: pointer; font-weight: 600;
        }
        .overview-panel { padding: 0 12px 12px; max-width: 460px; margin: 0 auto; }
        .overview-caption { font-size: 16px; line-height: 1.4; text-align: center; color: #3D3426; margin: 2px 0 6px; }
        .item { transition: opacity 0.5s ease, fill 0.5s ease, stroke 0.5s ease; }
        @media (prefers-reduced-motion: reduce) { .item { transition: none; } }
        #measure { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
</head>
<body>
<div class="widget-outer">
    <div class="title-bar"><h1>The Wheel</h1></div>
    <div class="diagram-wrapper">
        <svg id="scene" viewBox="0 0 360 290" role="img" aria-labelledby="scene-desc">
            <desc id="scene-desc">A wheel with Christ at the hub.</desc>
            <line x1="12" y1="249" x2="348" y2="249" stroke="#CFC9BD" stroke-width="3" stroke-linecap="round"/>
            <g id="wheel">
                <circle id="rim" class="item" cx="150" cy="136" r="108" fill="none" stroke="#1D6B3F" stroke-width="10" opacity="0.12"/>
                <line id="sp-word" class="item" x1="150" y1="104" x2="150" y2="33" stroke="#1D6B3F" stroke-width="6" stroke-linecap="round" opacity="0.12"/>
                <line id="sp-prayer" class="item" x1="150" y1="168" x2="150" y2="239" stroke="#1D6B3F" stroke-width="6" stroke-linecap="round" opacity="0.12"/>
                <line id="sp-fellow" class="item" x1="118" y1="136" x2="47" y2="136" stroke="#1D6B3F" stroke-width="6" stroke-linecap="round" opacity="0.12"/>
                <line id="sp-witness" class="item" x1="182" y1="136" x2="253" y2="136" stroke="#1D6B3F" stroke-width="6" stroke-linecap="round" opacity="0.12"/>
                <g id="lb-word" class="item" opacity="0"><text x="150" y="74" text-anchor="middle" class="label" font-size="14" fill="#155030" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">Word</text></g>
                <g id="lb-prayer" class="item" opacity="0"><text x="150" y="208" text-anchor="middle" class="label" font-size="14" fill="#155030" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">Prayer</text></g>
                <g id="lb-fellow" class="item" opacity="0"><text x="82" y="129" text-anchor="middle" class="label" font-size="12" fill="#155030" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">Fellowship</text></g>
                <g id="lb-witness" class="item" opacity="0"><text x="218" y="129" text-anchor="middle" class="label" font-size="14" fill="#155030" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">Witness</text></g>
                <g id="hub" class="item" opacity="0.2">
                    <circle cx="150" cy="136" r="32" fill="#1D6B3F"/>
                    <text x="150" y="141" text-anchor="middle" class="label" font-size="14" fill="#FFFFFF">Christ</text>
                </g>
            </g>
            <text id="lb-rim" class="item label" x="232" y="36" font-size="14" fill="#155030" opacity="0">Obedience</text>
            <g id="wheel2" class="item" opacity="0">
                <circle cx="310" cy="211" r="34" fill="none" stroke="#B8892B" stroke-width="5"/>
                <line x1="310" y1="200" x2="310" y2="180" stroke="#B8892B" stroke-width="3" stroke-linecap="round"/>
                <line x1="310" y1="222" x2="310" y2="242" stroke="#B8892B" stroke-width="3" stroke-linecap="round"/>
                <line x1="299" y1="211" x2="279" y2="211" stroke="#B8892B" stroke-width="3" stroke-linecap="round"/>
                <line x1="321" y1="211" x2="341" y2="211" stroke="#B8892B" stroke-width="3" stroke-linecap="round"/>
                <circle cx="310" cy="211" r="10" fill="#B8892B"/>
                <text x="310" y="166" text-anchor="middle" class="label" font-size="13" fill="#9A7222">Pass it on</text>
            </g>
        </svg>
    </div>
    <div id="card-area" aria-live="polite"></div>
    <p class="sr-only" id="status" aria-live="polite"></p>
</div>
<script>
    var GREEN = '#1D6B3F', GOLD = '#B8892B';
    var INTRO = ['What keeps a follower of Jesus', 'moving forward?'];
    var steps = [
        { show: 1, color: GREEN, title: 'Christ at the Center', text: 'Everything turns on Him. A disciple is built around a Person, not a program.', ref: '“It is no longer I who live, but Christ who lives in me” (Galatians 2:20)' },
        { show: 2, color: GREEN, title: 'The Word', text: 'You hear from God as you read Scripture and do what it says.', ref: '“Man shall not live by bread alone, but by every word that comes from the mouth of God” (Matthew 4:4)' },
        { show: 3, color: GREEN, title: 'Prayer', text: 'You talk with God, honestly and often.', ref: '“pray without ceasing” (1 Thessalonians 5:17)' },
        { show: 4, color: GREEN, title: 'Fellowship', text: 'You grow with other believers, not on your own.', ref: '“not neglecting to meet together” (Hebrews 10:25)' },
        { show: 5, color: GREEN, title: 'Witness', text: 'You share the hope of Jesus with people who do not know Him yet.', ref: '“you will be my witnesses” (Acts 1:8)' },
        { show: 6, color: GREEN, title: 'Obedience', text: 'The rim is where the wheel meets the road. Faith that obeys is faith that moves.', ref: '“If you love me, you will keep my commandments” (John 14:15)' },
        { show: 7, color: GOLD, title: 'Pass It On', text: 'A wheel that rolls leaves a track for someone else. Help another person build theirs.', ref: '“entrust to faithful men, who will be able to teach others also” (2 Timothy 2:2)' }
    ];
    var ORDER = [['hub'], ['sp-word', 'lb-word'], ['sp-prayer', 'lb-prayer'], ['sp-fellow', 'lb-fellow'], ['sp-witness', 'lb-witness'], ['rim', 'lb-rim']];
    var roll = null, lastShow = 0;
    function spin() {
        if (roll) cancelAnimationFrame(roll);
        var w = el('wheel');
        if (reduceMotion) { w.setAttribute('transform', ''); return; }
        var t0 = null, dur = 1400;
        function frame(ts) {
            if (t0 === null) t0 = ts;
            var k = Math.min((ts - t0) / dur, 1), e = 1 - Math.pow(1 - k, 3);
            w.setAttribute('transform', k < 1 ? 'rotate(' + (360 * e).toFixed(1) + ' 150 136)' : '');
            if (k < 1) roll = requestAnimationFrame(frame); else roll = null;
        }
        roll = requestAnimationFrame(frame);
    }
    function paint(i) {
        var show = i < 0 ? 0 : steps[i].show;
        ORDER.forEach(function (ids, k) {
            ids.forEach(function (id) {
                var on = show > k, isLabel = id.indexOf('lb-') === 0;
                el(id).setAttribute('opacity', on ? '1' : (isLabel ? '0' : (id === 'hub' ? '0.2' : '0.12')));
            });
        });
        el('wheel2').setAttribute('opacity', show >= 7 ? '1' : '0');
        if (show >= 7 && lastShow < 7) spin();
        if (show < 7 && roll) { cancelAnimationFrame(roll); roll = null; el('wheel').setAttribute('transform', ''); }
        lastShow = show;
        el('scene-desc').textContent = i < 0 ? 'A wheel with Christ at the hub.' : 'The wheel so far: ' + steps.slice(0, i + 1).map(function (s) { return s.title; }).join(', ') + '.';
    }

    var step = -1, pendingFocus = null;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function el(id) { return document.getElementById(id); }
    function setFocus(n) { pendingFocus = n; }
    function applyFocus() { if (!pendingFocus) return; var t = document.querySelector('[data-control="' + pendingFocus + '"]'); pendingFocus = null; if (t) t.focus(); }
    function button(label, control, cls, onClick) { var b = document.createElement('button'); b.type = 'button'; b.className = cls; b.setAttribute('data-control', control); b.textContent = label; b.addEventListener('click', onClick); return b; }
    function buildCard(s) {
        var vc = document.createElement('div'); vc.className = 'verse-card';
        var bar = document.createElement('div'); bar.className = 'verse-card-bar'; bar.style.background = s.color; vc.appendChild(bar);
        var c = document.createElement('div'); c.className = 'verse-card-content';
        var t = document.createElement('p'); t.className = 'card-title'; t.style.color = s.color; t.textContent = s.title; c.appendChild(t);
        var x = document.createElement('p'); x.className = 'card-text'; x.textContent = s.text; c.appendChild(x);
        if (s.ref) { var r = document.createElement('p'); r.className = 'card-ref'; r.textContent = s.ref; c.appendChild(r); }
        vc.appendChild(c); return vc;
    }
    // Size every card to the tallest one so the buttons never move.
    function fitCards() {
        var area = el('card-area'), m = document.createElement('div'), max = 0;
        m.id = 'measure'; m.style.width = area.clientWidth + 'px';
        document.documentElement.style.setProperty('--card-h', '0px');
        steps.forEach(function (s) { var w = document.createElement('div'); w.className = 'verse-card-wrapper'; w.appendChild(buildCard(s)); m.appendChild(w); });
        document.body.appendChild(m);
        m.querySelectorAll('.verse-card-content').forEach(function (c) { max = Math.max(max, c.offsetHeight); });
        document.body.removeChild(m);
        document.documentElement.style.setProperty('--card-h', Math.max(max, 112) + 'px');
    }
    function go(i) { step = i; render(); }
    function render() {
        var card = el('card-area'); card.innerHTML = '';
        if (step === -1) {
            paint(-1);
            var wrap = document.createElement('div'); wrap.className = 'begin-wrapper';
            var intro = document.createElement('p'); intro.className = 'begin-text';
            INTRO.forEach(function (line, i) { if (i) intro.appendChild(document.createElement('br')); intro.appendChild(document.createTextNode(line)); });
            wrap.appendChild(intro);
            wrap.appendChild(button('Begin →', 'begin', 'begin-btn', function () { setFocus('next'); go(0); }));
            card.appendChild(wrap); el('status').textContent = ''; applyFocus(); return;
        }
        var s = steps[step]; paint(step);
        var wrapper = document.createElement('div'); wrapper.className = 'verse-card-wrapper';
        wrapper.appendChild(buildCard(s));
        var nav = document.createElement('div'); nav.className = 'nav-bar';
        nav.appendChild(button('← Back', 'back', 'nav-btn', function () { setFocus(step === 0 ? 'begin' : 'back'); go(step - 1); }));
        var count = document.createElement('span'); count.className = 'step-count'; count.textContent = (step + 1) + ' of ' + steps.length; nav.appendChild(count);
        if (step < steps.length - 1) nav.appendChild(button('Next →', 'next', 'nav-btn primary', function () { setFocus('next'); go(step + 1); }));
        else nav.appendChild(button('↻ Restart', 'restart', 'nav-btn primary', function () { setFocus('begin'); go(-1); }));
        wrapper.appendChild(nav); card.appendChild(wrapper);
        el('status').textContent = 'Step ' + (step + 1) + ' of ' + steps.length + ': ' + s.title; applyFocus();
    }
    fitCards(); render();
    var rt = null, lastWidth = window.innerWidth;
    // Refit only when the width changes. The page briefly resizes this frame's height to measure it,
    // and refitting on that would start a measure-resize loop that jolts the page while scrolling.
    window.addEventListener('resize', function () {
        if (window.innerWidth === lastWidth) return;
        lastWidth = window.innerWidth;
        clearTimeout(rt); rt = setTimeout(fitCards, 150);
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCards);
</script>
</body>
</html>
