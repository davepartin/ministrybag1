<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Romans Road</title>
<style>
:root {
  --ink: #2C2416;
  --muted: #655f55;
  --ghost: #c5bdb0;
  --line-soft: #e3ddd1;
  --paper: #fdfdfb;
  --sun-orb: #FFE79A;
  --sun-orb-warm: #FAD866;
  --sun-halo: #FFF7DA;
  --sun-stroke: #B8892B;
  --blue: #1E6FA0;
  --blue-dark: #16557B;
  --blue-soft: #DFEEF7;
  --blue-glow: #F2F8FC;
  --red: #A63A32;
  --red-dark: #842B24;
  --red-soft: #F7DEDC;
  --red-glow: #FDF4F3;
  --green: #1D6B3F;
  --green-dark: #155030;
  --green-soft: #DCEEE3;
  --green-glow: #F2F9F5;
  --wood: #7C4D25;
  --wood-dark: #5C3717;
  --wood-soft: #EFE2D2;
  --wood-glow: #FAF4EC;
  --step-color: #2C2416;
  --step-dark: #2C2416;
  --step-soft: #F2EFE9;
  --card-h: 108px;
}

.widget-outer[data-step="1"] {
  --step-color: var(--blue);
  --step-dark: var(--blue-dark);
  --step-soft: var(--blue-soft);
}

.widget-outer[data-step="2"] {
  --step-color: var(--red);
  --step-dark: var(--red-dark);
  --step-soft: var(--red-soft);
}

.widget-outer[data-step="3"] {
  --step-color: var(--green);
  --step-dark: var(--green-dark);
  --step-soft: var(--green-soft);
}

.widget-outer[data-step="4"] {
  --step-color: var(--wood);
  --step-dark: var(--wood-dark);
  --step-soft: var(--wood-soft);
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  padding: 0;
  margin: 0;
  font-family: Georgia, Cambria, serif;
  background: #f8f6f1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.widget-outer {
  background: #ffffff;
  border-radius: 0;
  overflow: hidden;
  box-shadow: none;
  border: none;
  max-width: 100%;
  width: 100%;
  margin: 0;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #f8f6f1;
  }
  .widget-outer {
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
    border: 1px solid #ebe5d9;
    max-width: 460px;
    margin: 0 auto;
  }
}

.title-bar {
  background: var(--ink);
  padding: 8px 14px;
  text-align: center;
}

.title-bar h1 {
  font: 700 17px/1.2 system-ui, -apple-system, sans-serif;
  color: #faf8f3;
  margin: 0;
  letter-spacing: 0.2px;
}

/* Perspective Gravel Road & Sunset Stage */
.stage {
  position: relative;
  aspect-ratio: 380 / 226;
  background: var(--paper);
  border-bottom: 1px solid #eee9df;
  overflow: hidden;
}

.stage svg {
  width: 100%;
  height: 100%;
  display: block;
}

svg .ink-line {
  fill: none;
  stroke: var(--ink);
  stroke-linecap: round;
  stroke-linejoin: round;
}

svg .horizon-ridge-tan {
  fill: #f3ede2;
  stroke: var(--ink);
  stroke-width: 1.4;
  stroke-linejoin: round;
  transition: opacity 0.6s ease;
}

svg .horizon-ridge-wood {
  fill: url(#ridge-wood-grad);
  stroke: #684323;
  stroke-width: 1.5;
  stroke-linejoin: round;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.widget-outer.is-cross svg .horizon-ridge-tan {
  opacity: 0;
}

.widget-outer.is-cross svg .horizon-ridge-wood {
  opacity: 1;
}

svg .sun-halo {
  fill: var(--sun-halo);
  opacity: 0.95;
  transition: fill 0.45s ease, opacity 0.45s ease;
}

.widget-outer.is-cross svg .sun-halo {
  fill: var(--sun-orb);
  opacity: 0.48;
}

svg .sun-orb {
  fill: var(--sun-orb);
  stroke: var(--sun-stroke);
  stroke-width: 2;
  transition: fill 0.45s ease;
}

.widget-outer.is-cross svg .sun-orb {
  fill: var(--sun-orb-warm);
}

svg .sun-ray {
  stroke: var(--sun-stroke);
  stroke-linecap: round;
  opacity: 0.78;
  transition: opacity 0.45s ease;
}

.widget-outer.is-cross svg .sun-ray {
  opacity: 1;
}

svg .sun-ray-crown {
  stroke: var(--sun-stroke);
  stroke-linecap: round;
  opacity: 0.78;
  transition: opacity 0.45s ease, stroke-width 0.45s ease;
}

.widget-outer.is-cross svg .sun-ray-crown {
  opacity: 1;
  stroke-width: 2.5;
}

svg .horizon-seam {
  stroke: var(--ink);
  stroke-width: 1.8;
  stroke-linecap: round;
  transition: opacity 0.55s ease;
}

.widget-outer.is-cross svg .horizon-seam {
  opacity: 0;
}

svg .road-base {
  fill: #f4efe6;
  stroke: none;
  transition: fill 0.6s ease;
}

.widget-outer.is-cross svg .road-base {
  fill: #AE7C50;
}

svg .road-edge {
  fill: none;
  stroke: var(--ink);
  stroke-width: 2.1;
  stroke-linecap: round;
  transition: stroke 0.6s ease;
}

.widget-outer.is-cross svg .road-edge {
  stroke: #684323;
}

svg .wood-grain {
  fill: none;
  stroke: #7F542F;
  stroke-width: 1.1;
  stroke-linecap: round;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.widget-outer.is-cross svg .wood-grain {
  opacity: 0.42;
}

svg .pebble {
  fill: #9b9283;
  opacity: 0.65;
  transition: fill 0.6s ease, opacity 0.6s ease;
}

.widget-outer.is-cross svg .pebble {
  fill: #6E4726;
  opacity: 0.34;
}

svg .shrub {
  fill: none;
  stroke: #7a7265;
  stroke-width: 1.4;
  stroke-linecap: round;
}

/* Road Signs (A, B, C) with per-step natural color theme & sky-drop entry */
@keyframes signFallStick {
  0% { transform: translateY(-230px); }
  76% { transform: translateY(4px); }
  90% { transform: translateY(-1.5px); }
  100% { transform: translateY(0); }
}

svg .sign-group {
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 280ms ease;
}

svg .sign-group.planted {
  opacity: 1;
  pointer-events: auto;
}

svg .sign-drop {
  transform: translateY(-56px);
  transition: transform 280ms ease-in;
}

svg .sign-group.planted .sign-drop {
  transform: translateY(0);
  animation: signFallStick 460ms cubic-bezier(0.22, 1, 0.36, 1) var(--drop-delay, 0ms) both;
}

svg .sign-group[data-step="1"] {
  --sign-color: var(--blue);
  --sign-dark: var(--blue-dark);
  --sign-glow: var(--blue-glow);
}

svg .sign-group[data-step="2"] {
  --sign-color: var(--red);
  --sign-dark: var(--red-dark);
  --sign-glow: var(--red-glow);
}

svg .sign-group[data-step="3"] {
  --sign-color: var(--green);
  --sign-dark: var(--green-dark);
  --sign-glow: var(--green-glow);
}

svg .sign-shadow {
  fill: #e0d9cb;
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  transform: scale(0.35);
  transition: opacity 180ms ease, transform 220ms ease;
}

svg .sign-group.planted .sign-shadow {
  opacity: 1;
  transform: scale(1);
  transition-delay: calc(var(--drop-delay, 0ms) + 270ms);
}

svg .sign-post {
  stroke: var(--ink);
  stroke-width: 3.4;
  stroke-linecap: round;
}

svg .sign-board {
  fill: #ffffff;
  stroke: var(--sign-color, var(--ink));
  stroke-width: 1.9;
  transition: fill 0.25s ease, stroke 0.25s ease, stroke-width 0.25s ease;
}

svg .sign-badge {
  fill: var(--sign-color, var(--ink));
  transition: fill 0.25s ease;
}

svg .sign-letter {
  font: 800 13px system-ui, -apple-system, sans-serif;
  fill: #ffffff;
  text-anchor: middle;
  dominant-baseline: central;
}

svg .sign-title {
  font: 700 12px system-ui, -apple-system, sans-serif;
  fill: var(--ink);
  text-anchor: middle;
  dominant-baseline: central;
}

svg .sign-sub {
  font: 600 10.5px system-ui, -apple-system, sans-serif;
  fill: var(--muted);
  text-anchor: middle;
  dominant-baseline: central;
}

svg .sign-icon {
  fill: none;
  stroke: var(--sign-color, var(--ink));
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke 0.25s ease, fill 0.25s ease;
}

svg .sign-icon.filled {
  fill: var(--sign-color, var(--ink));
}

/* Passed vs Active road sign state */
svg .sign-group.passed .sign-badge {
  fill: var(--sign-dark);
}

svg .sign-group.passed .sign-board {
  stroke: var(--sign-dark);
}

svg .sign-group.active .sign-board {
  fill: var(--sign-glow);
  stroke: var(--sign-color);
  stroke-width: 2.8;
}

svg .sign-group.active .sign-title {
  fill: var(--sign-dark);
}

/* Step pills bar */
.step-strip {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  padding: 6px 10px;
  background: #f8f6f1;
  border-bottom: 1px solid #eee9df;
}

.step-pill {
  --pill-color: var(--ink);
  --pill-soft: #f2efe9;
  min-height: 34px;
  padding: 4px 4px;
  border-radius: 8px;
  border: 1.5px solid #d4cfc4;
  background: #ffffff;
  color: var(--ink);
  font: 700 13px/1 system-ui, -apple-system, sans-serif;
  text-align: center;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 0.2s, border-color 0.2s, color 0.2s;
}

.step-pill[data-step="1"] {
  --pill-color: var(--blue);
  --pill-soft: var(--blue-glow);
  border-color: rgba(30, 111, 160, 0.45);
  color: var(--blue-dark);
}

.step-pill[data-step="2"] {
  --pill-color: var(--red);
  --pill-soft: var(--red-glow);
  border-color: rgba(166, 58, 50, 0.45);
  color: var(--red-dark);
}

.step-pill[data-step="3"] {
  --pill-color: var(--green);
  --pill-soft: var(--green-glow);
  border-color: rgba(29, 107, 63, 0.45);
  color: var(--green-dark);
}

.step-pill[data-step="4"] {
  --pill-color: var(--wood);
  --pill-soft: var(--wood-glow);
  border-color: rgba(124, 77, 37, 0.5);
  color: var(--wood-dark);
}

.step-pill.passed {
  background: var(--pill-soft);
  border-color: var(--pill-color);
}

.step-pill.active {
  background: var(--pill-color);
  border-color: var(--pill-color);
  color: #ffffff;
}

/* Verse card + Navigation */
.card-area {
  background: #f6f4ee;
  padding: 7px 12px 8px;
}

.verse-card {
  background: #ffffff;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #ebe5d9;
  box-shadow: 0 2px 12px rgba(44, 36, 22, 0.06);
}

.verse-card-bar {
  height: 4px;
  background: var(--ink);
}

.verse-card-content {
  padding: 8px 13px;
  min-height: var(--card-h, 100px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-heading {
  font: 700 15px/1.22 system-ui, -apple-system, sans-serif;
  color: var(--step-dark);
  margin: 0 0 3px;
  transition: color 0.25s ease;
}

.card-verse {
  font: 13.5px/1.36 Georgia, Cambria, serif;
  color: #3d3426;
  margin: 0;
}

.card-verse b {
  color: var(--step-dark);
}

.verse-ref {
  font: 600 11.5px/1.2 system-ui, -apple-system, sans-serif;
  color: var(--muted);
  white-space: nowrap;
  margin-left: 3px;
}

.card-note {
  display: block;
  margin-top: 5px;
  font: 12px/1.32 system-ui, -apple-system, sans-serif;
  color: #4a4238;
}

.card-note b {
  color: var(--step-dark);
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}

.nav-btn {
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #d4cfc4;
  background: #ffffff;
  color: var(--ink);
  font: 700 13.5px/1 system-ui, -apple-system, sans-serif;
  cursor: pointer;
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #ffffff;
  transition: background-color 0.25s ease, border-color 0.25s ease;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.step-count {
  font: 600 12px system-ui, -apple-system, sans-serif;
  color: var(--muted);
}

button:focus-visible {
  outline: 3px solid #e0a526;
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  svg .sun-halo,
  svg .sun-orb,
  svg .sun-ray,
  svg .sun-ray-crown,
  svg .horizon-ridge-tan,
  svg .horizon-ridge-wood,
  svg .horizon-seam,
  svg .road-base,
  svg .road-edge,
  svg .wood-grain,
  svg .pebble,
  svg .sign-group,
  svg .sign-drop,
  svg .sign-shadow,
  svg .sign-board,
  svg .sign-badge,
  svg .sign-icon,
  .step-pill,
  .card-heading,
  .nav-btn.primary {
    transition: none !important;
    animation: none !important;
  }
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" aria-label="The Romans Road: forward gravel road into a Nevada sunset over thin rolling hills, with three roadside signs A Admit Sin, B Believe in Jesus as Savior, C Confess Jesus as Lord, and a fourth stop D Disciple revealing the wooden cross">
  <header class="title-bar">
    <h1>The Romans Road</h1>
  </header>

  <div class="stage" id="stage" role="img" aria-label=""></div>

  <div class="step-strip" id="step-strip" role="group" aria-label="Romans Road stops"></div>

  <section class="card-area" id="card-area" aria-live="polite">
    <div class="verse-card">
      <div class="verse-card-bar" aria-hidden="true"></div>
      <div class="verse-card-content" id="card-content">
        <h2 class="card-heading" id="card-heading"></h2>
        <p class="card-verse" id="card-verse"></p>
        <span class="card-note" id="card-note"></span>
      </div>
    </div>
    <div class="nav-bar">
      <button class="nav-btn" id="prev-btn" type="button">&larr; Back</button>
      <span class="step-count" id="step-count"></span>
      <button class="nav-btn primary" id="next-btn" type="button">Begin &rarr;</button>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';

  var steps = [
    {
      pill: 'Start',
      pillLabel: 'Start: The ABCs of Salvation',
      heading: 'The ABCs of Salvation',
      verse: 'These verses from the book of Romans show us the road of faith to a relationship with God. <span class="verse-ref">Romans 3:23; 5:8; 6:23; 10:9; Luke 9:23</span>',
      note: '',
      aria: 'An open desert gravel road stretches forward toward thin horizon hills and a golden sun, ready for roadside signs.'
    },
    {
      pill: 'A',
      pillLabel: 'A: Admit Sin',
      heading: 'A. Admit Sin',
      verse: '"For <b>all have sinned</b> and fall short of the glory of God." <span class="verse-ref">Romans 3:23</span> "The <b>wages of sin is death</b>, but the free gift of God is eternal life in Christ Jesus our Lord." <span class="verse-ref">Romans 6:23</span>',
      note: '<b>Your part:</b> Admit your need of salvation. <b>God\'s part:</b> He has already provided salvation in Jesus.',
      aria: 'Blue roadside sign A drops into the left foreground: Admit SIN.'
    },
    {
      pill: 'B',
      pillLabel: 'B: Believe in Jesus as Savior',
      heading: 'B. Believe in Jesus as Savior',
      verse: '"God shows his love for us in that <b>while we were still sinners</b>, Christ died for us." <span class="verse-ref">Romans 5:8</span>',
      note: '<b>Your part:</b> Believe that Jesus died on a cross for you. <b>God\'s part:</b> Jesus was crucified to save you from your sins.',
      aria: 'Red roadside sign B with the cross drops into the right shoulder: Believe in Jesus as Savior.'
    },
    {
      pill: 'C',
      pillLabel: 'C: Confess Jesus as Lord',
      heading: 'C. Confess Jesus as Lord',
      verse: '"If you <b>confess with your mouth</b> that Jesus is Lord and <b>believe in your heart</b> that God raised him from the dead, you will be saved... Everyone who calls on the name of the Lord will be saved." <span class="verse-ref">Romans 10:9, 13</span>',
      note: '<b>Your part:</b> Confess Jesus as your Lord and give Him the throne of your life. <b>God\'s part:</b> Jesus rose from the dead to show He was the Son of God sent to save the world through faith in Him.',
      aria: 'Green roadside sign C with the crown drops onto the left roadside ahead of A: Confess Jesus as Lord.'
    },
    {
      pill: 'D',
      pillLabel: 'D: Discipleship: Follow Jesus',
      heading: 'D. Discipleship: Follow Jesus',
      verse: '"If anyone would come after me, let him <b>deny himself</b> and <b>take up his cross daily</b> and <b>follow me</b>." <span class="verse-ref">Luke 9:23</span>',
      note: '<b>Your part:</b> Live in dependence on the Spirit of God by fighting sin and following the ways of Jesus. <b>God\'s part:</b> Jesus will be with you every day.',
      aria: 'Warm wood brown sweeps across the gravel road as the vertical post and the thin mountain ridge with its small center rise as the crossbeam and top of a wooden cross beneath the golden sun.'
    }
  ];

  function el(name, attrs, parent) {
    var node = document.createElementNS(NS, name);
    Object.keys(attrs || {}).forEach(function (k) {
      node.setAttribute(k, attrs[k]);
    });
    if (parent) parent.appendChild(node);
    return node;
  }

  // Horizon at y = 78, vanishing center at x = 190
  var HY = 78;
  var VH = 226;
  var VX = 190;

  var svg = el('svg', {
    xmlns: NS,
    'aria-hidden': 'true',
    viewBox: '0 0 380 ' + VH,
    preserveAspectRatio: 'xMidYMid meet'
  });

  // 1. Desert paper sky + setting sun glow at vanishing horizon
  var defs = el('defs', {}, svg);
  var skyClip = el('clipPath', { id: 'above-horizon' }, defs);
  el('rect', { x: 0, y: 0, width: 380, height: HY }, skyClip);

  // Subtle cross-wood gradient across the mountain range (ends drop onto horizon at x=48 and x=332)
  var woodFillGrad = el('linearGradient', { id: 'ridge-wood-grad', x1: '0%', y1: '0%', x2: '100%', y2: '0%' }, defs);
  el('stop', { offset: '0%', 'stop-color': '#AE7C50' }, woodFillGrad);
  el('stop', { offset: '50%', 'stop-color': '#9E6C40' }, woodFillGrad);
  el('stop', { offset: '100%', 'stop-color': '#AE7C50' }, woodFillGrad);

  el('rect', { x: 0, y: 0, width: 380, height: VH, fill: '#fdfdfb' }, svg);

  // Original horizon sunset sized to match road width (26px at HY=78 -> r=13) + rays clipped cleanly above horizon
  var sunLayer = el('g', { 'clip-path': 'url(#above-horizon)' }, svg);
  var sunCy = HY - 2.5;
  el('circle', { cx: VX, cy: sunCy, r: 40, class: 'sun-halo' }, sunLayer);
  [-72, -52, -34, -18, 0, 18, 34, 52, 72].forEach(function (deg) {
    var rad = ((deg - 90) * Math.PI) / 180;
    var r1 = 17;
    var r2 = deg === 0 ? 37 : (deg % 36 === 0 ? 32 : 26);
    el('line', {
      x1: (VX + Math.cos(rad) * r1).toFixed(1),
      y1: (sunCy + Math.sin(rad) * r1).toFixed(1),
      x2: (VX + Math.cos(rad) * r2).toFixed(1),
      y2: (sunCy + Math.sin(rad) * r2).toFixed(1),
      class: deg === 0 ? 'sun-ray-crown' : 'sun-ray',
      'stroke-width': deg % 36 === 0 ? 1.8 : 1.3
    }, sunLayer);
  });
  el('circle', { cx: VX, cy: sunCy, r: 13, class: 'sun-orb' }, sunLayer);
  // Crisp minimalist desert cloud streaks flanking the sunset
  el('path', { d: 'M 42 40 H 96 M 60 48 H 106', stroke: '#d6cfc2', 'stroke-width': 1.5, 'stroke-linecap': 'round' }, sunLayer);
  el('path', { d: 'M 276 38 H 338 M 288 46 H 326', stroke: '#d6cfc2', 'stroke-width': 1.5, 'stroke-linecap': 'round' }, sunLayer);

  // Subtle undulating horizon mountain range (x=48..332, organic 2px hills & ~2.4px center rise around sun)
  var ridgePath = 'M 48 ' + HY + ' L 57 74.0 L 76 72.7 L 98 74.4 L 122 72.9 L 148 74.6 L 175 73.6 L 182 71.7 L 190 71.3 L 198 71.7 L 205 73.7 L 230 74.5 L 256 72.8 L 282 74.3 L 304 72.6 L 323 74.0 L 332 ' + HY + ' Z';
  el('path', { d: ridgePath, class: 'horizon-ridge-tan' }, svg);
  el('path', { d: ridgePath, class: 'horizon-ridge-wood' }, svg);

  // Outer horizon wings always anchored in ink; center road-top seam dissolves smoothly into the brown crossbeam on Step D
  el('line', { x1: 0, y1: HY, x2: 177, y2: HY, class: 'ink-line', 'stroke-width': 1.8 }, svg);
  el('line', { x1: 203, y1: HY, x2: 380, y2: HY, class: 'ink-line', 'stroke-width': 1.8 }, svg);
  el('line', { x1: 177, y1: HY, x2: 203, y2: HY, class: 'horizon-seam' }, svg);

  // 2. Widened perspective road trapezoid: foreground (112..268 at y=226) -> horizon beam (177..203 at y=78)
  var roadPoly = '177,' + HY + ' 203,' + HY + ' 268,' + VH + ' 112,' + VH;
  el('polygon', { points: roadPoly, class: 'road-base' }, svg);

  // Perspective wood-grain lines (hidden in tan gravel steps; softly visible when wood-brown cross appears)
  [
    'M 154 220 L 172 162',
    'M 189 216 L 190 132',
    'M 225 220 L 209 166',
    'M 178 136 L 184 96',
    'M 203 142 L 197 94'
  ].forEach(function (dStr) {
    el('path', { d: dStr, class: 'wood-grain' }, svg);
  });

  // Crisp road edges (ink on Steps 0..3 -> warm dark wood brown on Step 4)
  el('path', {
    d: 'M 112 ' + VH + ' L 177 ' + HY + ' M 268 ' + VH + ' L 203 ' + HY,
    class: 'road-edge'
  }, svg);

  // Perspective gravel stones/pebbles across the road (staying inside 112..268 -> 177..203)
  var pebbles = [
    [138, 218, 2.2, 1.1], [176, 212, 1.8, 1.0], [218, 220, 2.3, 1.1], [244, 210, 1.9, 1.0],
    [154, 198, 1.8, 0.9], [198, 200, 1.7, 0.9], [230, 194, 1.7, 0.9], [142, 186, 1.6, 0.8],
    [168, 174, 1.5, 0.8], [212, 176, 1.6, 0.8], [188, 162, 1.4, 0.7], [158, 154, 1.3, 0.7],
    [214, 150, 1.3, 0.7], [178, 138, 1.2, 0.6], [202, 134, 1.2, 0.6], [186, 122, 1.0, 0.55],
    [196, 114, 1.0, 0.5], [189, 102, 0.85, 0.45]
  ];
  pebbles.forEach(function (p) {
    el('ellipse', { cx: p[0], cy: p[1], rx: p[2], ry: p[3], class: 'pebble' }, svg);
  });

  // Minimal desert sage tufts on open ground
  [
    [154, 92, 0.55], [228, 96, 0.6], [312, 196, 0.95], [22, 132, 0.72], [344, 92, 0.6]
  ].forEach(function (t) {
    var sg = el('g', { transform: 'translate(' + t[0] + ',' + t[1] + ') scale(' + t[2] + ')' }, svg);
    el('path', { d: 'M -7 0 L -11 -7 M 0 0 L -1 -9 M 6 0 L 10 -6 M -9 0 H 9', class: 'shrub' }, sg);
  });

  // 3. Progressive Two-Legged Roadside Signs (big left letter badge + right text + icon)
  var signGroups = [];

  // Sign C: Pulled closer to Sign A on Left so horizon line HY=78 stays unobstructed - C | Confess / Jesus as / Lord + Crown
  (function () {
    var g = el('g', { class: 'sign-group', 'data-step': '3' }, svg);
    el('ellipse', { cx: 63, cy: 136, rx: 6.5, ry: 1.8, class: 'sign-shadow' }, g);
    el('ellipse', { cx: 129, cy: 136, rx: 6.5, ry: 1.8, class: 'sign-shadow' }, g);
    var d = el('g', { class: 'sign-drop' }, g);
    el('line', { x1: 63, y1: 125, x2: 63, y2: 136, class: 'sign-post', 'stroke-width': 2 }, d);
    el('line', { x1: 129, y1: 125, x2: 129, y2: 136, class: 'sign-post', 'stroke-width': 2 }, d);
    el('rect', { x: 44, y: 88, width: 104, height: 38, rx: 5.5, class: 'sign-board' }, d);
    el('rect', { x: 48, y: 92, width: 26, height: 30, rx: 4.5, class: 'sign-badge' }, d);
    el('text', { x: 61, y: 107, class: 'sign-letter', style: 'font-size:20px' }, d).textContent = 'C';
    el('text', { x: 80, y: 97, class: 'sign-title', style: 'font-size:9.6px;text-anchor:start' }, d).textContent = 'Confess';
    el('text', { x: 80, y: 106.5, class: 'sign-sub', style: 'font-size:9.2px;text-anchor:start' }, d).textContent = 'Jesus as';
    el('text', { x: 80, y: 118, class: 'sign-title', style: 'font-size:9.8px;text-anchor:start' }, d).textContent = 'Lord';
    el('path', {
      d: 'M 114 121 L 112.5 115 L 117 117.5 L 121 113 L 125 117.5 L 129.5 115 L 128 121 Z',
      class: 'sign-icon',
      'stroke-width': 1.4
    }, d);
    signGroups[3] = g;
  })();

  // Sign B: ~40% up from bottom on Right (Medium perspective) - B | Believe / in Jesus / as Savior + Cross
  (function () {
    var g = el('g', { class: 'sign-group', 'data-step': '2' }, svg);
    el('ellipse', { cx: 264, cy: 172, rx: 8, ry: 2.3, class: 'sign-shadow' }, g);
    el('ellipse', { cx: 348, cy: 172, rx: 8, ry: 2.3, class: 'sign-shadow' }, g);
    var d = el('g', { class: 'sign-drop' }, g);
    el('line', { x1: 264, y1: 152, x2: 264, y2: 172, class: 'sign-post', 'stroke-width': 2.6 }, d);
    el('line', { x1: 348, y1: 152, x2: 348, y2: 172, class: 'sign-post', 'stroke-width': 2.6 }, d);
    el('rect', { x: 242, y: 102, width: 128, height: 50, rx: 7, class: 'sign-board' }, d);
    el('rect', { x: 247, y: 107, width: 34, height: 40, rx: 5.5, class: 'sign-badge' }, d);
    el('text', { x: 264, y: 127, class: 'sign-letter', style: 'font-size:25px' }, d).textContent = 'B';
    el('text', { x: 289, y: 115, class: 'sign-title', style: 'font-size:11.5px;text-anchor:start' }, d).textContent = 'Believe';
    el('text', { x: 289, y: 128, class: 'sign-sub', style: 'font-size:10.8px;text-anchor:start' }, d).textContent = 'in Jesus';
    el('text', { x: 289, y: 141, class: 'sign-title', style: 'font-size:10.8px;text-anchor:start' }, d).textContent = 'as Savior';
    el('path', {
      d: 'M 350 133 V 146 M 345 137.5 H 355',
      class: 'sign-icon',
      'stroke-width': 2.1
    }, d);
    signGroups[2] = g;
  })();

  // Sign A: Bottom-Left Foreground (Largest perspective) - A | Admit / SIN
  (function () {
    var g = el('g', { class: 'sign-group', 'data-step': '1' }, svg);
    el('ellipse', { cx: 26, cy: 222, rx: 9, ry: 2.4, class: 'sign-shadow' }, g);
    el('ellipse', { cx: 98, cy: 222, rx: 9, ry: 2.4, class: 'sign-shadow' }, g);
    var d = el('g', { class: 'sign-drop' }, g);
    el('line', { x1: 26, y1: 199, x2: 26, y2: 222, class: 'sign-post', 'stroke-width': 3.2 }, d);
    el('line', { x1: 98, y1: 199, x2: 98, y2: 222, class: 'sign-post', 'stroke-width': 3.2 }, d);
    el('rect', { x: 8, y: 145, width: 108, height: 54, rx: 8, class: 'sign-board' }, d);
    el('rect', { x: 14, y: 151, width: 38, height: 42, rx: 6, class: 'sign-badge' }, d);
    el('text', { x: 33, y: 172, class: 'sign-letter', style: 'font-size:27px' }, d).textContent = 'A';
    el('text', { x: 83, y: 164, class: 'sign-title', style: 'font-size:14px' }, d).textContent = 'Admit';
    el('text', { x: 83, y: 181, class: 'sign-title', style: 'font-size:14px' }, d).textContent = 'SIN';
    signGroups[1] = g;
  })();

  // Allow clicking road signs directly on the whiteboard stage
  [1, 2, 3].forEach(function (idx) {
    signGroups[idx].addEventListener('click', function () {
      goTo(idx);
    });
  });

  document.getElementById('stage').appendChild(svg);

  // Build step pills bar
  var stripEl = document.getElementById('step-strip');
  var pillButtons = steps.map(function (st, idx) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'step-pill' + (idx > 0 ? ' is-abc' : '');
    btn.setAttribute('data-step', String(idx));
    btn.setAttribute('aria-label', st.pillLabel);
    btn.textContent = st.pill;
    btn.addEventListener('click', function () {
      goTo(idx);
    });
    stripEl.appendChild(btn);
    return btn;
  });

  var widgetEl = document.getElementById('widget');
  var stageEl = document.getElementById('stage');
  var headingEl = document.getElementById('card-heading');
  var verseEl = document.getElementById('card-verse');
  var noteEl = document.getElementById('card-note');
  var countEl = document.getElementById('step-count');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');

  var step = 0;

  function goTo(nextStep) {
    step = Math.max(0, Math.min(steps.length - 1, nextStep));
    var st = steps[step];

    widgetEl.setAttribute('data-step', String(step));
    widgetEl.classList.toggle('has-step', step >= 1);
    widgetEl.classList.toggle('is-complete', step >= 3);
    widgetEl.classList.toggle('is-cross', step === 4);

    // Signs fall from the sky & stick when step >= idx; dissolve upward when going back/starting over
    var dropIdx = 0;
    [1, 2, 3].forEach(function (idx) {
      var sg = signGroups[idx];
      var shouldPlant = step >= idx;
      var wasPlanted = sg.classList.contains('planted');
      if (shouldPlant && !wasPlanted) {
        sg.style.setProperty('--drop-delay', (dropIdx * 90) + 'ms');
        dropIdx++;
      } else if (!shouldPlant) {
        sg.style.setProperty('--drop-delay', '0ms');
      }
      sg.classList.toggle('planted', shouldPlant);
      sg.classList.toggle('active', step === idx);
      sg.classList.toggle('passed', step > idx);
    });

    pillButtons.forEach(function (btn, idx) {
      btn.classList.toggle('active', idx === step);
      btn.classList.toggle('passed', idx > 0 && idx < step);
      btn.setAttribute('aria-pressed', idx === step ? 'true' : 'false');
    });

    stageEl.setAttribute('aria-label', st.aria);
    headingEl.textContent = st.heading;
    verseEl.innerHTML = st.verse;
    noteEl.innerHTML = st.note;
    noteEl.style.display = st.note ? 'block' : 'none';
    countEl.textContent = step === 0 ? 'Ready' : ('Step ' + step + ' of 4');

    prevBtn.disabled = step === 0;
    if (step === 0) {
      nextBtn.innerHTML = 'Begin &rarr;';
    } else if (step === steps.length - 1) {
      nextBtn.innerHTML = '&#8635; Start Over';
    } else {
      nextBtn.innerHTML = 'Next &rarr;';
    }
  }

  prevBtn.addEventListener('click', function () {
    if (step > 0) goTo(step - 1);
  });

  nextBtn.addEventListener('click', function () {
    if (step === steps.length - 1) {
      goTo(0);
    } else {
      goTo(step + 1);
    }
  });

  // Measure tallest card text once at load and only on width changes (never on height-only resize)
  var contentEl = document.getElementById('card-content');
  var lastWidth = window.innerWidth;
  var measuredAtWidth = 0;

  function fitCardHeight() {
    if (!contentEl || contentEl.clientWidth === measuredAtWidth) return;
    measuredAtWidth = contentEl.clientWidth;
    var keepH = headingEl.textContent;
    var keepV = verseEl.innerHTML;
    var keepN = noteEl.innerHTML;
    var keepND = noteEl.style.display;
    var tallest = 0;
    document.documentElement.style.setProperty('--card-h', '0px');
    steps.forEach(function (st) {
      headingEl.textContent = st.heading;
      verseEl.innerHTML = st.verse;
      noteEl.innerHTML = st.note;
      noteEl.style.display = st.note ? 'block' : 'none';
      tallest = Math.max(tallest, contentEl.offsetHeight);
    });
    headingEl.textContent = keepH;
    verseEl.innerHTML = keepV;
    noteEl.innerHTML = keepN;
    noteEl.style.display = keepND;
    document.documentElement.style.setProperty('--card-h', Math.max(100, tallest) + 'px');
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastWidth) return;
    lastWidth = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCardHeight, 120);
  });

  goTo(0);
  fitCardHeight();
})();
</script>
</body>
</html>
