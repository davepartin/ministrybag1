<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closer to God, Closer to Each Other</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Georgia', 'Cambria', serif;
            background: #F8F6F1;
            color: #2C2416;
            -webkit-font-smoothing: antialiased;
            padding: 0;
            margin: 0;
        }

        .widget-outer {
            background: #FFFFFF;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
            border: none;
            max-width: 100%;
            width: 100%;
            margin: 0;
            position: relative;
        }

        @media (min-width: 560px) {
            body { padding: 16px; background: #F8F6F1; }
            .widget-outer {
                border-radius: 12px;
                box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
                border: 1px solid #EBE5D9;
                max-width: 460px;
                margin: 0 auto;
            }
        }

        button { -webkit-tap-highlight-color: transparent; font-family: 'Trebuchet MS', sans-serif; }
        button:focus-visible { outline: 3px solid #2C2416; outline-offset: 2px; }

        .title-bar { background: #1D6B3F; padding: 10px 16px; text-align: center; }
        .title-bar h1 {
            font-size: 19px; font-weight: 700; color: #FFFFFF; margin: 0; line-height: 1.2;
            font-family: 'Trebuchet MS', 'Inter', sans-serif;
        }

        .diagram-wrapper { padding: 8px 8px 0; }
        svg#tri { display: block; width: 100%; height: auto; max-height: 300px; }
        .label { font-family: 'Trebuchet MS', sans-serif; font-size: 16px; font-weight: 700; }
        .phrase { font-family: 'Georgia', serif; font-size: 17px; font-style: italic; }

        #card-area { background-color: #F6F4EE; border-top: 1px solid #EBE5D9; padding-top: 8px; }
        .verse-card-wrapper { margin: 0 auto; padding: 0 12px 8px; max-width: 460px; }
        .verse-card { background: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 14px rgba(44,36,22,0.06); }
        .verse-card-bar { height: 4px; }
        .verse-card-content { padding: 10px 16px; min-height: var(--card-h, 112px); display: flex; flex-direction: column; justify-content: flex-start; }
        .card-title { font-family: 'Trebuchet MS', sans-serif; font-size: 16px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
        .card-text { font-size: 15px; line-height: 1.4; color: #3D3426; }
        .card-ref { font-family: 'Trebuchet MS', sans-serif; font-size: 13px; color: #6B6358; margin-top: 4px; }

        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 0 2px; gap: 8px; }
        .nav-btn {
            background: transparent; border: 1.5px solid #D4CFC4; border-radius: 10px;
            padding: 10px 16px; min-height: 44px; font-size: 14px; color: #5A4E3C; cursor: pointer; font-weight: 600;
        }
        .nav-bar .nav-btn { min-width: 112px; text-align: center; }
        .nav-btn.primary { color: #FFFFFF; border: none; background: #1D6B3F; }
        .nav-btn[disabled] { opacity: 0.35; cursor: default; }
        .step-count { font-family: 'Trebuchet MS', sans-serif; font-size: 13px; color: #6B6358; }

        .begin-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 16px 16px; }
        .begin-text { font-size: 16px; line-height: 1.4; text-align: center; color: #3D3426; max-width: 340px; }
        .begin-btn {
            background: #1D6B3F; color: #FFFFFF; border: none; border-radius: 10px;
            padding: 12px 28px; min-height: 44px; font-size: 16px; font-weight: 700; cursor: pointer;
        }
        .overview-btn {
            background: transparent; border: 1.5px solid #D4CFC4; border-radius: 10px;
            padding: 10px 16px; min-height: 44px; font-size: 14px; color: #5A4E3C; cursor: pointer; font-weight: 600;
        }
        .overview-panel { padding: 0 12px 12px; max-width: 460px; margin: 0 auto; }
        .overview-caption { font-size: 16px; line-height: 1.4; text-align: center; color: #3D3426; margin: 2px 0 6px; }
        .link { transition: stroke-dashoffset 0.9s ease; }
        @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
        #measure { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
</head>
<body>
<div class="widget-outer">
    <div class="title-bar"><h1>Closer to God, Closer to Each Other</h1></div>
    <div class="diagram-wrapper">
        <svg id="tri" viewBox="0 0 360 290" role="img" aria-labelledby="tri-desc">
            <desc id="tri-desc">God at the top and two people at the bottom, far apart.</desc>
            <line id="link-a" class="link" stroke="#E3CD95" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
            <line id="link-b" class="link" stroke="#E3CD95" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
            <line id="gap" stroke="#8C877C" stroke-width="3" stroke-dasharray="6 6"/>
            <circle id="god-glow" cx="180" cy="46" r="34" fill="#E9C46A" opacity="0"/>
            <circle id="god" cx="180" cy="46" r="26"/>
            <text id="god-label" x="180" y="52" text-anchor="middle" class="label" fill="#FFFFFF">God</text>
            <circle id="dot-a" r="12" fill="#1D6B3F"/>
            <circle id="dot-b" r="12" fill="#8B4A5E"/>
            <text id="label-a" class="label" text-anchor="end" fill="#1D6B3F">You</text>
            <text id="label-b" class="label" text-anchor="start" fill="#8B4A5E">Them</text>
            <text id="phrase" x="180" y="278" text-anchor="middle" class="phrase"></text>
        </svg>
    </div>
    <div id="card-area" aria-live="polite"></div>
    <p class="sr-only" id="status" aria-live="polite"></p>
</div>
<script>
    var APEX = { x: 180, y: 46 }, LEFT = { x: 94, y: 240 }, RIGHT = { x: 266, y: 240 };
    var GREEN = '#1D6B3F', GOLD = '#B8892B', GREY = '#CFC9BD';

    var steps = [
        {
            t: 0, godLit: false, linked: false, phrase: 'I will, if you will.', phraseColor: '#6B6358',
            color: '#8C877C',
            title: 'Contract: I will, if you will.',
            text: 'When each person keeps score, love lasts only as long as the other one performs. The distance grows.',
            ref: '',
            desc: 'God is faint at the top. The two people stand alone and far apart at the bottom, with nothing connecting them to God.'
        },
        {
            t: 0, godLit: true, linked: true, phrase: 'God loved us first.', phraseColor: GOLD,
            color: GOLD,
            title: 'God came down to us.',
            text: 'God came to us in Jesus. When each person accepts His love, a line of grace connects them to Him.',
            ref: '“We love because he first loved us.” (1 John 4:19)',
            desc: 'God lights up, and a line of grace comes down from God to each person as they accept His love.'
        },
        {
            t: 0.45, godLit: true, linked: true, phrase: 'I will, even when.', phraseColor: GREEN,
            color: GREEN,
            title: 'Covenant: I will, even when.',
            text: 'Each person turns toward God. As you move closer to Him, you move closer to each other.',
            ref: '“Draw near to God, and he will draw near to you.” (James 4:8)',
            desc: 'Both people move up their lines toward God, and the gap between them shrinks.'
        },
        {
            t: 0.7, godLit: true, linked: true, phrase: 'I will, even when.', phraseColor: GREEN,
            color: GREEN,
            title: 'Closer to God, closer to each other.',
            text: 'Christ’s love is the center that holds you together, whether they are your spouse, fiancé, or someone you are dating.',
            ref: '“as Christ loved the church and gave himself up for her” (Ephesians 5:25)',
            desc: 'Both people are near the top, close to God and close to each other.'
        }
    ];

    var step = -1, mode = 'guide', resumeStep = -1, pendingFocus = null;
    var currentT = 0, animFrame = null;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function lerp(a, b, t) { return a + (b - a) * t; }
    function el(id) { return document.getElementById(id); }

    function placeDots(t) {
        var ax = lerp(LEFT.x, APEX.x, t), ay = lerp(LEFT.y, APEX.y, t);
        var bx = lerp(RIGHT.x, APEX.x, t), by = lerp(RIGHT.y, APEX.y, t);
        el('dot-a').setAttribute('cx', ax); el('dot-a').setAttribute('cy', ay);
        el('dot-b').setAttribute('cx', bx); el('dot-b').setAttribute('cy', by);
        el('label-a').setAttribute('x', ax - 18); el('label-a').setAttribute('y', ay + 6);
        el('label-b').setAttribute('x', bx + 18); el('label-b').setAttribute('y', by + 6);
        el('gap').setAttribute('x1', ax + 13); el('gap').setAttribute('y1', ay);
        el('gap').setAttribute('x2', bx - 13); el('gap').setAttribute('y2', by);
        [['link-a', ax, ay], ['link-b', bx, by]].forEach(function (l) {
            var line = el(l[0]);
            line.setAttribute('x1', APEX.x); line.setAttribute('y1', APEX.y);
            line.setAttribute('x2', l[1]); line.setAttribute('y2', l[2]);
        });
        currentT = t;
    }

    function moveTo(target) {
        if (animFrame) cancelAnimationFrame(animFrame);
        if (reduceMotion || Math.abs(target - currentT) < 0.001) { placeDots(target); return; }
        var start = currentT, t0 = null, dur = 800;
        function frame(ts) {
            if (t0 === null) t0 = ts;
            var p = Math.min((ts - t0) / dur, 1);
            var e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
            placeDots(lerp(start, target, e));
            if (p < 1) animFrame = requestAnimationFrame(frame);
        }
        animFrame = requestAnimationFrame(frame);
    }

    function paintDiagram(s, faded) {
        var lit = s && s.godLit;
        el('god').setAttribute('fill', lit ? GOLD : GREY);
        el('god-glow').setAttribute('opacity', lit ? '0.35' : '0');
        var linked = s && s.linked;
        el('link-a').setAttribute('stroke-dashoffset', linked ? '0' : '1');
        el('link-b').setAttribute('stroke-dashoffset', linked ? '0' : '1');
        var phrase = el('phrase');
        phrase.textContent = s ? s.phrase : '';
        phrase.setAttribute('fill', s ? s.phraseColor : '#6B6358');
        ['dot-a', 'dot-b', 'label-a', 'label-b', 'gap'].forEach(function (id) {
            el(id).setAttribute('opacity', faded ? '0.45' : '1');
        });
        el('tri-desc').textContent = s ? s.desc : 'God at the top and two people at the bottom, far apart.';
    }

    function setFocus(name) { pendingFocus = name; }
    function applyFocus() {
        if (!pendingFocus) return;
        var target = document.querySelector('[data-control="' + pendingFocus + '"]');
        pendingFocus = null;
        if (target) target.focus();
    }

    function button(label, control, cls, onClick) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = cls;
        b.setAttribute('data-control', control);
        b.textContent = label;
        b.addEventListener('click', onClick);
        return b;
    }

    function buildCard(s) {
        var vc = document.createElement('div');
        vc.className = 'verse-card';
        var bar = document.createElement('div');
        bar.className = 'verse-card-bar';
        bar.style.background = s.color;
        vc.appendChild(bar);
        var content = document.createElement('div');
        content.className = 'verse-card-content';
        var title = document.createElement('p');
        title.className = 'card-title';
        title.style.color = s.color === '#8C877C' ? '#5A4E3C' : s.color;
        title.textContent = s.title;
        content.appendChild(title);
        var text = document.createElement('p');
        text.className = 'card-text';
        text.textContent = s.text;
        content.appendChild(text);
        if (s.ref) {
            var ref = document.createElement('p');
            ref.className = 'card-ref';
            ref.textContent = s.ref;
            content.appendChild(ref);
        }
        vc.appendChild(content);
        return vc;
    }

    // Size every step's card to the tallest one so Back and Next never move.
    function fitCards() {
        var area = el('card-area');
        var m = document.createElement('div');
        m.id = 'measure';
        m.style.width = area.clientWidth + 'px';
        document.documentElement.style.setProperty('--card-h', '0px');
        var max = 0;
        steps.forEach(function (s) {
            var w = document.createElement('div');
            w.className = 'verse-card-wrapper';
            w.appendChild(buildCard(s));
            m.appendChild(w);
        });
        document.body.appendChild(m);
        m.querySelectorAll('.verse-card-content').forEach(function (c) { max = Math.max(max, c.offsetHeight); });
        document.body.removeChild(m);
        document.documentElement.style.setProperty('--card-h', Math.max(max, 112) + 'px');
    }

    function go(idx) {
        mode = 'guide';
        step = idx;
        resumeStep = idx;
        render();
    }

    function render() {
        var card = el('card-area');
        card.innerHTML = '';

        if (mode === 'overview') {
            var last = steps[steps.length - 1];
            paintDiagram(last, false);
            moveTo(last.t);
            var panel = document.createElement('div');
            panel.className = 'overview-panel';
            var cap = document.createElement('p');
            cap.className = 'overview-caption';
            cap.textContent = 'God came down to us first. As each person draws near to God, they draw near to each other.';
            panel.appendChild(cap);
            var onav = document.createElement('div');
            onav.className = 'nav-bar';
            onav.appendChild(button('Return to steps', 'return', 'nav-btn', function () {
                mode = 'guide'; step = resumeStep;
                setFocus(step === -1 ? 'begin' : 'next'); render();
            }));
            onav.appendChild(button('↻ Restart', 'restart', 'nav-btn primary', function () {
                resumeStep = -1; setFocus('begin'); go(-1);
            }));
            panel.appendChild(onav);
            card.appendChild(panel);
            el('status').textContent = 'Whole diagram shown.';
            applyFocus();
            return;
        }

        if (step === -1) {
            paintDiagram(null, true);
            moveTo(0);
            var wrap = document.createElement('div');
            wrap.className = 'begin-wrapper';
            var intro = document.createElement('p');
            intro.className = 'begin-text';
            intro.textContent = 'Two people, one faithful God. Tap Begin to see what draws them together.';
            wrap.appendChild(intro);
            wrap.appendChild(button('Begin →', 'begin', 'begin-btn', function () { setFocus('next'); go(0); }));
            wrap.appendChild(button('Show whole diagram', 'overview', 'overview-btn', function () {
                resumeStep = step; mode = 'overview'; setFocus('return'); render();
            }));
            card.appendChild(wrap);
            el('status').textContent = '';
            applyFocus();
            return;
        }

        var s = steps[step];
        paintDiagram(s, false);
        moveTo(s.t);

        var wrapper = document.createElement('div');
        wrapper.className = 'verse-card-wrapper';
        wrapper.appendChild(buildCard(s));

        var nav = document.createElement('div');
        nav.className = 'nav-bar';
        nav.appendChild(button('← Back', 'back', 'nav-btn', function () {
            setFocus(step === 0 ? 'begin' : 'back'); go(step - 1);
        }));
        var count = document.createElement('span');
        count.className = 'step-count';
        count.textContent = (step + 1) + ' of ' + steps.length;
        nav.appendChild(count);
        if (step < steps.length - 1) {
            nav.appendChild(button('Next →', 'next', 'nav-btn primary', function () { setFocus('next'); go(step + 1); }));
        } else {
            nav.appendChild(button('↻ Restart', 'restart', 'nav-btn primary', function () { setFocus('begin'); go(-1); }));
        }
        wrapper.appendChild(nav);
        card.appendChild(wrapper);
        el('status').textContent = 'Step ' + (step + 1) + ' of ' + steps.length + ': ' + s.title;
        applyFocus();
    }

    placeDots(0);
    fitCards();
    render();
    var resizeTimer = null;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(fitCards, 150);
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCards);
</script>
</body>
</html>
