<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Stones of a Life of Faith</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        :root {
            --charcoal: #2C2416;
            --marker: #2A2820;
            --ink: #2F2A21;
            --paper: #FFFFFF;
            --board: #FCFAF1;
            --cream: #FAF6EB;
            --border: #E7DECE;
            --muted: #766D60;
            --shadow: 0 10px 26px rgba(44, 36, 22, 0.10);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            background: #F8F6F1;
            color: var(--ink);
            font-family: 'Inter', 'Trebuchet MS', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .widget {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            overflow: hidden;
            background: var(--board);
        }

        @media (max-width: 559px) {
            .widget {
                width: min(100vw, 413px);
                max-width: min(100vw, 413px);
            }
        }

        @media (min-width: 560px) {
            body {
                padding: 16px;
            }

            .widget {
                border: 1px solid #E8DFD0;
                border-radius: 18px;
                box-shadow: var(--shadow);
            }
        }

        .title-bar {
            background: #211D14;
            padding: 7px 14px 8px;
            text-align: center;
        }

        .title-bar h1 {
            margin: 0;
            color: #FBF8F1;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.08em;
            line-height: 1.15;
        }

        .title-bar p {
            margin: 2px 0 0;
            color: #C9C0AC;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .scene-wrap {
            position: relative;
            overflow: hidden;
            height: 260px;
            background: var(--board);
            border-bottom: 1px solid #E5DCCB;
        }

        #scene {
            position: absolute;
            top: 0;
            left: 50%;
            width: 100%;
            height: 260px;
            transform: translateX(-50%);
            transform-origin: top center;
        }

        .scene-svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .intro-overlay {
            position: absolute;
            inset: 0;
            z-index: 12;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
            background: linear-gradient(180deg, rgba(252, 250, 241, 0.30), rgba(252, 250, 241, 0.88));
            pointer-events: none;
            text-align: center;
        }

        .intro-card {
            max-width: 320px;
            padding: 16px 18px 14px;
            border: 1px solid rgba(226, 217, 200, 0.9);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 14px 32px rgba(44, 36, 22, 0.10);
            backdrop-filter: blur(4px);
        }

        .intro-verse {
            margin: 0 0 6px;
            color: var(--charcoal);
            font-family: 'Inter', 'Trebuchet MS', sans-serif;
            font-size: 14.5px;
            font-weight: 600;
            line-height: 1.4;
        }

        .intro-ref {
            margin: 0;
            color: #B68A2E;
            font-size: 10.5px;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .card-area {
            background: var(--board);
            padding: 10px 12px 10px;
        }

        .verse-card {
            overflow: hidden;
            border: 1px solid #E8DFD0;
            border-radius: 14px;
            background: var(--paper);
            box-shadow: 0 7px 18px rgba(44, 36, 22, 0.07);
            animation: fadeSlide 0.3s ease both;
        }

        .verse-bar {
            height: 4px;
            background: var(--card-color, var(--marker));
        }

        .verse-content {
            height: 148px;
            overflow: hidden;
            padding: 11px 16px 13px;
        }

        .verse-title {
            margin: 0 0 5px;
            color: var(--card-color, var(--marker));
            font-family: 'Inter', 'Trebuchet MS', sans-serif;
            font-size: 15.5px;
            font-weight: 800;
            letter-spacing: 0.01em;
            line-height: 1.24;
        }

        .verse-text {
            margin: 0;
            color: #3E3529;
            font-family: Georgia, Cambria, serif;
            font-size: 13px;
            line-height: 1.4;
        }

        .verse-text b {
            color: var(--card-color, var(--marker));
            font-weight: 700;
        }

        .card-note {
            display: block;
            margin-top: 6px;
            color: #3E3529;
        }

        .verse-ref-inline {
            margin-left: 6px;
            color: var(--card-color, var(--marker));
            font-family: 'Inter', 'Trebuchet MS', sans-serif;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.05em;
            opacity: 0.75;
            vertical-align: middle;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
            padding: 0 2px;
        }

        .nav-btn {
            min-width: 76px;
            padding: 8px 13px;
            border: 1.5px solid rgba(44, 36, 22, 0.14);
            border-radius: 11px;
            background: #FFFFFF;
            color: var(--charcoal);
            cursor: pointer;
            font-size: 12px;
            font-weight: 800;
            transition: transform 0.18s ease, background 0.18s ease;
        }

        .nav-btn:active {
            transform: translateY(1px);
        }

        .nav-btn.primary {
            min-width: 98px;
            border-color: transparent;
            background: var(--card-color, var(--marker));
            color: #FFFFFF;
            box-shadow: 0 5px 13px rgba(44, 36, 22, 0.14);
        }

        .nav-btn.hidden {
            visibility: hidden;
        }

        .dots {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            padding: 0;
            border: 0;
            border-radius: 999px;
            background: rgba(44, 36, 22, 0.20);
            transition: width 0.25s ease, background 0.25s ease;
        }

        .dot.available {
            cursor: pointer;
        }

        .dot.current {
            width: 20px;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
<main class="widget" aria-label="A side view of a brick wall being built one category at a time, starting with the cornerstone Jesus at the bottom-left and extending up and to the right through family, church, community, and world">
    <header class="title-bar">
        <h1>Building From the Cornerstone</h1>
    </header>

    <section class="scene-wrap" aria-label="A brick wall built in running-bond masonry. The cornerstone of Jesus is at the bottom-left. Five categories of bricks build up and to the right: family, church, community, and world.">
        <div id="scene"></div>
    </section>

    <section class="card-area" id="cardArea" aria-live="polite"></section>
</main>

<script>
(function () {
    var NS = 'http://www.w3.org/2000/svg';
    var W = 460;
    var H = 260;
    var step = -1;
    var jesusDissolvePending = false;
    var baseColor = '#5A4E3C';
    var marker = '#2A2820';

    var stages = [
        {
            key: 'jesus',
            label: 'CORNERSTONE',
            name: 'Jesus',
            color: '#D4E2EE',
            stroke: '#9CB9D2',
            button: '#4A7CA8',
            title: 'Jesus',
            verse: '"<b>Christ Jesus himself being the cornerstone.</b>"',
            note: 'Jesus is not one block in the wall. He is the cornerstone. He sets the line, level, and direction for every relationship built above Him.',
            ref: 'Ephesians 2:20'
        },
        {
            key: 'family',
            label: 'FIRST NEIGHBORS',
            name: 'Family',
            color: '#F2DADA',
            stroke: '#D4B0B0',
            button: '#9D6868',
            title: 'Family',
            verse: '"<b>You shall love your neighbor as yourself.</b>"',
            note: 'Family members are often the closest neighbors God has given you. The love of Jesus should become visible first where you are most known.',
            ref: 'Mark 12:31'
        },
        {
            key: 'church',
            label: 'THIRD STONE',
            name: 'Church',
            color: '#DCEADA',
            stroke: '#A6C4A4',
            button: '#547F53',
            title: 'Church',
            verse: '"<b>By this all people will know that you are my disciples, if you have love for one another.</b>"',
            note: 'The same love that starts at home joins believers into a welcoming spiritual family. When the church loves well, the community starts to ask why.',
            ref: 'John 13:35'
        },
        {
            key: 'community',
            label: 'FOURTH STONE',
            name: 'Community',
            color: '#F4E8C0',
            stroke: '#D6BE7A',
            button: '#8D7423',
            title: 'Community',
            verse: '"<b>Let your light shine before others, so that they may see your good works and give glory to your Father.</b>"',
            note: 'The community sees the love of God in the streets, workplaces and schools when the church continues the ministry of Christ as His hands and feet.',
            ref: 'Matthew 5:16'
        },
        {
            key: 'world',
            label: 'FIFTH STONE',
            name: 'World',
            color: '#DFD7EA',
            stroke: '#B0A4C9',
            button: '#675791',
            title: 'World',
            verse: '"<b>Go therefore and make disciples of all nations.</b>"',
            note: 'The building points outward to the nations. We pray, send, give, and go because the love of Christ keeps moving beyond us.',
            ref: 'Matthew 28:19'
        }
    ];

    // Brick wall layout
    // Bottom row has exactly 5 bricks, one per category (Jesus, Family, Church, Community, World).
    // Running-bond pattern: even rows have 5 full bricks, odd rows have 4 full bricks + half bricks at edges.
    // Each brick is 80 wide × 40 tall (chunkier than the previous version).
    var brickW = 80;
    var brickH = 40;
    var halfW = brickW / 2;
    var wallLeft = 30;
    var wallBottom = 230;   // y of bottom edge of bottom row
    var wallTop = wallBottom - 5 * brickH;  // 5 rows total
    var wallRight = wallLeft + 5 * brickW;

    // Each brick: { x, y, w, h, stage (0..4) }
    // stage 0 = Jesus, 1 = Family, 2 = Church, 3 = Community, 4 = World
    var bricks = [];

    function makeRow(rowIdx, isOffset, assignments) {
        // rowIdx 0 = bottom, 4 = top
        var y = wallBottom - (rowIdx + 1) * brickH;
        if (isOffset) {
            // Half brick at left edge
            bricks.push({ x: wallLeft, y: y, w: halfW, h: brickH, stage: assignments[0] });
            // 4 full bricks
            for (var i = 0; i < 4; i++) {
                bricks.push({ x: wallLeft + halfW + i * brickW, y: y, w: brickW, h: brickH, stage: assignments[i + 1] });
            }
            // Half brick at right edge
            bricks.push({ x: wallLeft + halfW + 4 * brickW, y: y, w: halfW, h: brickH, stage: assignments[5] });
        } else {
            // 5 full bricks
            for (var j = 0; j < 5; j++) {
                bricks.push({ x: wallLeft + j * brickW, y: y, w: brickW, h: brickH, stage: assignments[j] });
            }
        }
    }

    // Stage assignments per brick, building diagonally from bottom-left up and right
    // 0 = Jesus, 1 = Family, 2 = Church, 3 = Community, 4 = World

    // Each color forms a continuous diagonal band rising from bottom-right toward
    // top-left. Each row up, every color's right edge shifts half a brick width to
    // the left, so the bands stay visually connected from row to row. World fills
    // everything to the right of Community and the entire top row.
    //   Jesus (0):    row 0 only
    //   Family (1):   rows 0-1
    //   Church (2):   rows 0-2
    //   Community (3):rows 0-3
    //   World (4):    all rows, plus the entire top row
    // Row 0 (bottom, even): one of each category
    makeRow(0, false, [0, 1, 2, 3, 4]);
    // Row 1 (offset): F-h F C Co W W-h
    makeRow(1, true, [1, 1, 2, 3, 4, 4]);
    // Row 2 (even): C C Co W W
    makeRow(2, false, [2, 2, 3, 4, 4]);
    // Row 3 (offset): Co-h Co Co W W W-h
    makeRow(3, true, [3, 3, 3, 4, 4, 4]);
    // Row 4 (top): all World
    makeRow(4, false, [4, 4, 4, 4, 4]);

    function svgEl(tag, attrs) {
        var el = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach(function (key) {
            el.setAttribute(key, attrs[key]);
        });
        return el;
    }

    function hexToRgba(hex, alpha) {
        var clean = hex.replace('#', '');
        var num = parseInt(clean, 16);
        var r = (num >> 16) & 255;
        var g = (num >> 8) & 255;
        var b = num & 255;
        return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
    }

    function currentColor() {
        return step === -1 ? baseColor : stages[step].color;
    }

    function currentButtonColor() {
        return step === -1 ? marker : stages[step].button;
    }

    function darkerColor() {
        return step === -1 ? marker : stages[step].stroke;
    }

    function buildBackdrop(svg) {
        // Soft ground line beneath the wall
        svg.appendChild(svgEl('line', {
            x1: wallLeft - 6,
            y1: wallBottom + 2,
            x2: wallRight + 6,
            y2: wallBottom + 2,
            stroke: marker,
            'stroke-width': 1.6,
            'stroke-linecap': 'round',
            opacity: 0.5
        }));
    }

    function drawBrick(svg, brick) {
        var revealed = brick.stage <= step;
        var stage = stages[brick.stage];
        var isCornerstone = brick.stage === 0;
        // A bottom-row brick is one whose top edge sits one brick-height above wallBottom
        var isBottomRow = brick.y === wallBottom - brickH && brick.w === brickW;

        if (!revealed) {
            // Unlaid bricks are hidden. Only laid stones show.
            return;
        }

        // Filled brick
        var isActiveStage = brick.stage === step;
        var fill = isActiveStage ? stage.color : hexToRgba(stage.color, 0.88);
        var strokeColor = stage.stroke;

        svg.appendChild(svgEl('rect', {
            x: brick.x + 0.5,
            y: brick.y + 0.5,
            width: brick.w - 1,
            height: brick.h - 1,
            rx: 2.5,
            fill: fill,
            stroke: strokeColor,
            'stroke-width': 1.3
        }));

        // Top-edge highlight
        svg.appendChild(svgEl('line', {
            x1: brick.x + 4,
            y1: brick.y + 2.5,
            x2: brick.x + brick.w - 4,
            y2: brick.y + 2.5,
            stroke: 'rgba(255, 255, 255, 0.32)',
            'stroke-width': 1
        }));
        // Bottom-edge shadow
        svg.appendChild(svgEl('line', {
            x1: brick.x + 4,
            y1: brick.y + brick.h - 2.5,
            x2: brick.x + brick.w - 4,
            y2: brick.y + brick.h - 2.5,
            stroke: 'rgba(0, 0, 0, 0.12)',
            'stroke-width': 1
        }));

        // Bottom-row bricks get the category name centered inside them, dark text
        if (isBottomRow) {
            var labelCx = brick.x + brick.w / 2;
            var labelCy = brick.y + brick.h / 2;
            // JESUS gets emphasis; the other bottom labels stay uniform.
            var labelSize, labelTracking;
            if (stage.name === 'Jesus') {
                labelSize = 14;
                labelTracking = '0.10em';
            } else {
                labelSize = 9.5;
                labelTracking = '0.05em';
            }
            var nameLabel = svgEl('text', {
                x: labelCx,
                y: labelCy + 4,
                'text-anchor': 'middle',
                'font-family': 'Inter, Trebuchet MS, sans-serif',
                'font-size': labelSize,
                'font-weight': 800,
                fill: '#2C2416',
                'letter-spacing': labelTracking
            });
            nameLabel.textContent = stage.name.toUpperCase();
            svg.appendChild(nameLabel);
        }
    }

    function buildWall(svg) {
        // Draw non-Jesus bricks normally
        bricks.forEach(function (b) {
            if (b.stage !== 0) drawBrick(svg, b);
        });
        // Draw Jesus bricks in a group so we can animate them as a unit
        var jesusGroup = svgEl('g', {});
        if (jesusDissolvePending) {
            jesusGroup.appendChild(svgEl('animateTransform', {
                attributeName: 'transform',
                type: 'translate',
                from: '-120 0',
                to: '0 0',
                dur: '0.55s',
                fill: 'freeze',
                calcMode: 'spline',
                keyTimes: '0;1',
                keySplines: '0.0 0.0 0.3 1.0'
            }));
        }
        bricks.forEach(function (b) {
            if (b.stage === 0) drawBrick(jesusGroup, b);
        });
        svg.appendChild(jesusGroup);
    }

    function buildLegend(svg) {
        // Legend strip beneath the wall, each swatch directly under its bottom-row brick
        var legendY = 256;
        var swatchH = 24;
        var labelY = 296;
        var swatchW = 64;
        var inset = (brickW - swatchW) / 2;  // center swatch under its 80-wide brick

        stages.forEach(function (s, idx) {
            var x = wallLeft + idx * brickW + inset;
            var revealed = idx <= step;
            var isActive = idx === step;

            // Swatch
            if (revealed) {
                svg.appendChild(svgEl('rect', {
                    x: x,
                    y: legendY,
                    width: swatchW,
                    height: swatchH,
                    rx: 4,
                    fill: isActive ? s.color : hexToRgba(s.color, 0.85),
                    stroke: s.stroke,
                    'stroke-width': isActive ? 2 : 1.3
                }));
                // Tiny highlight
                svg.appendChild(svgEl('line', {
                    x1: x + 4,
                    y1: legendY + 2.5,
                    x2: x + swatchW - 4,
                    y2: legendY + 2.5,
                    stroke: 'rgba(255, 255, 255, 0.32)',
                    'stroke-width': 1
                }));
            } else {
                svg.appendChild(svgEl('rect', {
                    x: x,
                    y: legendY,
                    width: swatchW,
                    height: swatchH,
                    rx: 4,
                    fill: 'rgba(255, 255, 255, 0.4)',
                    stroke: '#C9BFA9',
                    'stroke-width': 1.1,
                    'stroke-dasharray': '3,3'
                }));
            }

            // Active dashed halo
            if (isActive) {
                svg.appendChild(svgEl('rect', {
                    x: x - 4,
                    y: legendY - 4,
                    width: swatchW + 8,
                    height: swatchH + 8,
                    rx: 6,
                    fill: 'none',
                    stroke: hexToRgba(s.color, 0.5),
                    'stroke-width': 1.2,
                    'stroke-dasharray': '3,3'
                }));
            }

            // Label below swatch
            var labelEl = svgEl('text', {
                x: x + swatchW / 2,
                y: labelY,
                'text-anchor': 'middle',
                'font-family': 'Inter, Trebuchet MS, sans-serif',
                'font-size': 10.5,
                'font-weight': isActive ? 800 : 700,
                fill: revealed ? (isActive ? s.stroke : '#3E3529') : '#B5AC97',
                'letter-spacing': '0.06em'
            });
            labelEl.textContent = s.name.toUpperCase();
            svg.appendChild(labelEl);
        });
    }

    function buildIntro(container) {
        if (step !== -1) return;
        var overlay = document.createElement('div');
        overlay.className = 'intro-overlay';
        overlay.innerHTML =
            '<div class="intro-card">' +
                '<p class="intro-verse">"In him you also are being built together into a dwelling place for God by the Spirit."</p>' +
                '<p class="intro-ref">Ephesians 2:22</p>' +
            '</div>';
        container.appendChild(overlay);
    }

    function buildScene() {
        var sceneWrap = document.querySelector('.scene-wrap');
        var oldOverlay = sceneWrap.querySelector('.intro-overlay');
        if (oldOverlay) oldOverlay.remove();

        var scene = document.getElementById('scene');
        scene.innerHTML = '';

        var svg = svgEl('svg', {
            class: 'scene-svg',
            viewBox: '0 0 ' + W + ' ' + H,
            role: 'img',
            'aria-label': 'A side view of a brick wall being built. The cornerstone Jesus is at the bottom-left. Five colors of bricks cascade up and to the right: family, church, community, and world. A legend below the wall shows what each color means.'
        });

        buildBackdrop(svg);
        buildWall(svg);
        scene.appendChild(svg);
    }

    function buildCard() {
        var area = document.getElementById('cardArea');
        var color = currentButtonColor();
        area.innerHTML = '';
        area.style.setProperty('--card-color', color);

        var card = document.createElement('div');
        card.className = 'verse-card';

        if (step === -1) {
            card.innerHTML = '<div class="verse-bar"></div>';
        } else {
            card.innerHTML = '<div class="verse-bar"></div>';
        }

        var content = document.createElement('div');
        content.className = 'verse-content';

        if (step === -1) {
            var title = document.createElement('h2');
            title.className = 'verse-title';
            title.innerHTML = 'Building a Life From the Cornerstone <span class="verse-ref-inline">· Ephesians 2:21</span>';
            var text = document.createElement('p');
            text.className = 'verse-text';
            text.innerHTML = '"In Jesus, you also are being built together into a dwelling place for God by the Spirit."<span class="card-note">Jesus is the cornerstone. His love builds outward from your closest relationships to the ends of the earth.</span>';
            content.appendChild(title);
            content.appendChild(text);
        } else {
            var s = stages[step];
            var title = document.createElement('h2');
            title.className = 'verse-title';
            title.innerHTML = s.title + ' <span class="verse-ref-inline">\u00b7 ' + s.ref + '</span>';
            var text = document.createElement('p');
            text.className = 'verse-text';
            text.innerHTML = s.verse + '<span class="card-note">' + s.note + '</span>';
            content.appendChild(title);
            content.appendChild(text);
        }

        card.appendChild(content);
        area.appendChild(card);
        area.appendChild(buildNav());
    }

    function buildNav() {
        var nav = document.createElement('div');
        nav.className = 'nav';

        var back = document.createElement('button');
        back.type = 'button';
        back.className = 'nav-btn' + (step === -1 ? ' hidden' : '');
        back.innerHTML = '&larr; Back';
        back.addEventListener('click', function () {
            if (step > -1) {
                step -= 1;
                render();
            }
        });
        nav.appendChild(back);

        var dots = document.createElement('div');
        dots.className = 'dots';
        stages.forEach(function (s, idx) {
            var dot = document.createElement('button');
            dot.type = 'button';
            dot.className = 'dot';
            dot.setAttribute('aria-label', 'Go to ' + s.name);
            if (idx <= step) {
                dot.classList.add('available');
                dot.style.background = idx === step ? s.color : hexToRgba(s.color, 0.42);
                dot.addEventListener('click', function () {
                    step = idx;
                    render();
                });
            }
            if (idx === step) dot.classList.add('current');
            dots.appendChild(dot);
        });
        nav.appendChild(dots);

        var next = document.createElement('button');
        next.type = 'button';
        next.className = 'nav-btn primary';
        next.style.background = currentButtonColor();
        if (step === -1) {
            next.innerHTML = 'Begin &rarr;';
        } else if (step === stages.length - 1) {
            next.innerHTML = '&#8635; Restart';
        } else {
            next.innerHTML = 'Next &rarr;';
        }
        next.addEventListener('click', function () {
            if (step === -1) {
                jesusDissolvePending = true;
                step = 0;
                render();
                jesusDissolvePending = false;
            } else if (step === stages.length - 1) {
                step = -1;
                render();
            } else {
                step += 1;
                render();
            }
        });
        nav.appendChild(next);

        return nav;
    }

    function render() {
        document.documentElement.style.setProperty('--card-color', currentButtonColor());
        buildScene();
        buildCard();
    }

    render();
}());
</script>
</body>
</html>
