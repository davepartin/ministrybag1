<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross the Road</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Georgia', 'Cambria', serif;
            background: #F8F6F1;
            color: #2C2416;
            -webkit-font-smoothing: antialiased;
            padding: 0;
            margin: 0;
        }

        .widget-outer {
            background: #FFFFFF;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
            border: none;
            max-width: 100%;
            width: 100%;
            margin: 0;
            position: relative;
        }

        @media (min-width: 560px) {
            body { padding: 16px; background: #F8F6F1; }
            .widget-outer {
                border-radius: 12px;
                box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
                border: 1px solid #EBE5D9;
                max-width: 460px;
                margin: 0 auto;
            }
        }

        button { -webkit-tap-highlight-color: transparent; font-family: 'Trebuchet MS', sans-serif; }
        button:focus-visible { outline: 3px solid #2C2416; outline-offset: 2px; }

        .title-bar { background: #1D6B3F; padding: 10px 16px; text-align: center; }
        .title-bar h1 {
            font-size: 19px; font-weight: 700; color: #FFFFFF; margin: 0; line-height: 1.2;
            font-family: 'Trebuchet MS', 'Inter', sans-serif;
        }

        .diagram-wrapper { padding: 8px 8px 0; }
        svg#road { display: block; width: 100%; height: auto; max-height: 280px; }
        .label { font-family: 'Trebuchet MS', sans-serif; font-weight: 700; }
        .town { font-family: 'Georgia', serif; font-style: italic; }
        .phrase { font-family: 'Georgia', serif; font-size: 17px; font-style: italic; }

        .fade { transition: opacity 0.5s ease; }
        .draw { transition: stroke-dashoffset 0.8s ease, stroke 0.5s ease, opacity 0.5s ease; }
        @media (prefers-reduced-motion: reduce) { .fade, .draw { transition: none; } }

        #card-area { background-color: #F6F4EE; border-top: 1px solid #EBE5D9; padding-top: 8px; }
        .verse-card-wrapper { margin: 0 auto; padding: 0 12px 8px; max-width: 460px; }
        .verse-card { background: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 14px rgba(44,36,22,0.06); }
        .verse-card-bar { height: 4px; }
        .verse-card-content { padding: 10px 16px; min-height: var(--card-h, 112px); display: flex; flex-direction: column; justify-content: flex-start; }
        .card-title { font-family: 'Trebuchet MS', sans-serif; font-size: 16px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
        .card-text { font-size: 15px; line-height: 1.4; color: #3D3426; }
        .card-ref { font-family: 'Trebuchet MS', sans-serif; font-size: 13px; color: #6B6358; margin-top: 4px; }

        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 0 2px; gap: 8px; }
        .nav-btn {
            background: transparent; border: 1.5px solid #D4CFC4; border-radius: 10px;
            padding: 10px 16px; min-height: 44px; font-size: 14px; color: #5A4E3C; cursor: pointer; font-weight: 600;
        }
        .nav-bar .nav-btn { min-width: 112px; text-align: center; }
        .nav-btn.primary { color: #FFFFFF; border: none; background: #1D6B3F; }
        .step-count { font-family: 'Trebuchet MS', sans-serif; font-size: 13px; color: #6B6358; }

        .begin-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 16px 16px; }
        .begin-text { font-size: 16px; line-height: 1.4; text-align: center; color: #3D3426; max-width: 340px; }
        .begin-btn {
            background: #1D6B3F; color: #FFFFFF; border: none; border-radius: 10px;
            padding: 12px 28px; min-height: 44px; font-size: 16px; font-weight: 700; cursor: pointer;
        }
        .overview-btn {
            background: transparent; border: 1.5px solid #D4CFC4; border-radius: 10px;
            padding: 10px 16px; min-height: 44px; font-size: 14px; color: #5A4E3C; cursor: pointer; font-weight: 600;
        }
        .overview-panel { padding: 0 12px 12px; max-width: 460px; margin: 0 auto; }
        .overview-caption { font-size: 16px; line-height: 1.4; text-align: center; color: #3D3426; margin: 2px 0 6px; }
        #measure { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
</head>
<body>
<div class="widget-outer">
    <div class="title-bar"><h1>Cross the Road</h1></div>
    <div class="diagram-wrapper">
        <svg id="road" viewBox="0 0 360 200" role="img" aria-labelledby="road-desc">
            <desc id="road-desc">A road from Jerusalem to Jericho with a wounded man lying at the edge.</desc>
            <defs>
                <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A79D8C"/></marker>
                <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1D6B3F"/></marker>
                <marker id="arrow-gold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8892B"/></marker>
            </defs>

            <!-- the road -->
            <rect x="0" y="86" width="360" height="84" fill="#F1EADB"/>
            <line x1="0" y1="86" x2="360" y2="86" stroke="#D9CFBA" stroke-width="2"/>
            <line x1="0" y1="170" x2="360" y2="170" stroke="#D9CFBA" stroke-width="2"/>
            <line x1="0" y1="130" x2="360" y2="130" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14 12"/>
            <text class="town" x="6" y="190" font-size="12" fill="#6B6358">Jerusalem</text>
            <text class="town" x="354" y="190" font-size="12" fill="#6B6358" text-anchor="end">Jericho</text>

            <!-- the two who passed by -->
            <g id="passers" class="fade" opacity="0">
                <path id="p1" class="draw" d="M 0 98 L 296 98" fill="none" stroke="#A79D8C" stroke-width="3" stroke-linecap="round"/>
                <path id="p2" class="draw" d="M 0 110 L 296 110" fill="none" stroke="#A79D8C" stroke-width="3" stroke-linecap="round"/>
                <text class="label" x="304" y="102" font-size="12" fill="#6B6358">Priest</text>
                <text class="label" x="304" y="114" font-size="12" fill="#6B6358">Levite</text>
            </g>

            <!-- the one who crossed over -->
            <g id="sam" class="fade" opacity="0">
                <path id="p3" class="draw" d="M 0 122 L 110 122 C 150 122 160 152 184 152" fill="none" stroke="#1D6B3F" stroke-width="4" stroke-linecap="round"/>
                <text id="sam-label" class="label" x="8" y="150" font-size="14" fill="#1D6B3F">Samaritan</text>
            </g>

            <!-- the wounded man -->
            <g id="man">
                <circle cx="198" cy="153" r="7" fill="#8B7E6A"/>
                <rect x="207" y="148" width="34" height="11" rx="5.5" fill="#8B7E6A"/>
            </g>
            <text id="you-label" class="label fade" x="220" y="190" font-size="14" fill="#B8892B" text-anchor="middle" opacity="0">You</text>

            <!-- your crossing -->
            <g id="cross" class="fade" opacity="0">
                <path id="p4" class="draw" d="M 244 150 C 268 150 284 122 296 82" fill="none" stroke="#1D6B3F" stroke-width="4" stroke-linecap="round"/>
                <circle cx="304" cy="44" r="7" fill="#1D6B3F"/>
                <rect x="297" y="53" width="14" height="22" rx="6" fill="#1D6B3F"/>
                <text class="label" x="304" y="24" font-size="13" fill="#1D6B3F" text-anchor="middle">Your neighbor</text>
            </g>

            <text id="phrase" x="160" y="50" text-anchor="middle" class="phrase"></text>
        </svg>
    </div>
    <div id="card-area" aria-live="polite"></div>
    <p class="sr-only" id="status" aria-live="polite"></p>
</div>
<script>
    var GREEN = '#1D6B3F', GOLD = '#B8892B';
    // passers: 0 hidden, 1 shown, 2 faded. sam: 0 hidden, 1 Samaritan (green), 2 Jesus (gold).
    var steps = [
        { passers: 0, sam: 0, you: false, cross: false, phrase: 'Who is my neighbor?', color: GREEN,
          title: 'Who is my neighbor?', text: 'A law teacher wanted Jesus to draw a small circle, so he would know who he could leave out.', ref: '“And who is my neighbor?” (Luke 10:29)',
          desc: 'A road from Jerusalem to Jericho with a wounded man lying at the edge.' },
        { passers: 1, sam: 0, you: false, cross: false, phrase: '', color: GREEN,
          title: 'Two passed by.', text: 'A priest and a Levite saw the wounded man and kept to the far side of the road. Busy, religious, and unmoved.', ref: '“he passed by on the other side” (Luke 10:31)',
          desc: 'The priest and the Levite walk along the far side of the road and pass the wounded man.' },
        { passers: 2, sam: 1, you: false, cross: false, phrase: '', color: GREEN,
          title: 'One crossed over.', text: 'The Samaritan, the one everyone expected to be the villain, saw him, had compassion, and crossed the road to him.', ref: '“He went to him and bound up his wounds” (Luke 10:34)',
          desc: 'The Samaritan’s path crosses the road to the wounded man.' },
        { passers: 2, sam: 1, you: false, cross: false, phrase: 'Who will I move toward?', color: GREEN,
          title: 'The question flips.', text: 'Jesus did not ask who qualifies. He asked who proved to be a neighbor. Love does not sort people. It moves toward them.', ref: '“Which of these three … proved to be a neighbor?” (Luke 10:36)',
          desc: 'The question changes from who is my neighbor to who will I move toward.' },
        { passers: 2, sam: 2, you: true, cross: false, phrase: '', color: GOLD,
          title: 'Jesus crossed to you.', text: 'You were the one left on the side of the road. Jesus came all the way to you, and it cost Him His life.', ref: '“while we were still sinners, Christ died for us” (Romans 5:8)',
          desc: 'The crossing path turns gold and is labeled Jesus. The wounded man is labeled You.' },
        { passers: 2, sam: 2, you: true, cross: true, phrase: 'Go and do likewise.', color: GREEN,
          title: 'Now cross the road.', text: 'The one Jesus rescued becomes the one who crosses. Who is on the other side of your road this week?', ref: '“You go, and do likewise.” (Luke 10:37)',
          desc: 'A new path crosses from You to your neighbor on the other side of the road.' }
    ];

    var step = -1, mode = 'guide', resumeStep = -1, pendingFocus = null, markerTimers = [];
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function el(id) { return document.getElementById(id); }

    // Prepare each path so it can be drawn from start to end.
    var LENGTHS = {};
    ['p1', 'p2', 'p3', 'p4'].forEach(function (id) {
        var p = el(id), len = Math.ceil(p.getTotalLength()) + 2;
        LENGTHS[id] = len;
        p.style.strokeDasharray = len + ' ' + len;
        p.style.strokeDashoffset = len;
    });

    function setPath(id, shown, color, marker) {
        var p = el(id);
        p.setAttribute('stroke', color);
        if (!shown) {
            p.style.transition = 'none';
            p.style.strokeDashoffset = LENGTHS[id];
            p.removeAttribute('marker-end');
            void p.getBoundingClientRect();
            p.style.transition = '';
            return;
        }
        var wasDrawn = p.style.strokeDashoffset === '0' || p.style.strokeDashoffset === '0px';
        p.style.strokeDashoffset = 0;
        if (wasDrawn || reduceMotion) { p.setAttribute('marker-end', 'url(#' + marker + ')'); return; }
        p.removeAttribute('marker-end');
        markerTimers.push(setTimeout(function () { p.setAttribute('marker-end', 'url(#' + marker + ')'); }, 800));
    }

    function paint(s, faded) {
        markerTimers.forEach(clearTimeout); markerTimers = [];
        var passers = s ? s.passers : 0, sam = s ? s.sam : 0;
        el('passers').setAttribute('opacity', passers === 0 ? '0' : (passers === 1 ? '1' : '0.4'));
        setPath('p1', passers > 0, '#A79D8C', 'arrow-gray');
        setPath('p2', passers > 0, '#A79D8C', 'arrow-gray');

        var samColor = sam === 2 ? GOLD : GREEN;
        el('sam').setAttribute('opacity', sam === 0 ? '0' : '1');
        setPath('p3', sam > 0, samColor, sam === 2 ? 'arrow-gold' : 'arrow-green');
        var sl = el('sam-label');
        sl.textContent = sam === 2 ? 'Jesus' : 'Samaritan';
        sl.setAttribute('fill', samColor);

        el('you-label').setAttribute('opacity', s && s.you ? '1' : '0');
        var cross = !!(s && s.cross);
        el('cross').setAttribute('opacity', cross ? '1' : '0');
        setPath('p4', cross, GREEN, 'arrow-green');

        var ph = el('phrase'); ph.textContent = s ? s.phrase : ''; ph.setAttribute('fill', s && s.phrase === 'Who is my neighbor?' ? '#6B6358' : (s ? s.color : GREEN));
        el('road').style.opacity = faded ? '0.55' : '1';
        el('road-desc').textContent = s ? s.desc : 'A road from Jerusalem to Jericho with a wounded man lying at the edge.';
    }

    function setFocus(n) { pendingFocus = n; }
    function applyFocus() { if (!pendingFocus) return; var t = document.querySelector('[data-control="' + pendingFocus + '"]'); pendingFocus = null; if (t) t.focus(); }
    function button(label, control, cls, onClick) { var b = document.createElement('button'); b.type = 'button'; b.className = cls; b.setAttribute('data-control', control); b.textContent = label; b.addEventListener('click', onClick); return b; }
    function buildCard(s) {
        var vc = document.createElement('div'); vc.className = 'verse-card';
        var bar = document.createElement('div'); bar.className = 'verse-card-bar'; bar.style.background = s.color; vc.appendChild(bar);
        var c = document.createElement('div'); c.className = 'verse-card-content';
        var t = document.createElement('p'); t.className = 'card-title'; t.style.color = s.color; t.textContent = s.title; c.appendChild(t);
        var x = document.createElement('p'); x.className = 'card-text'; x.textContent = s.text; c.appendChild(x);
        if (s.ref) { var r = document.createElement('p'); r.className = 'card-ref'; r.textContent = s.ref; c.appendChild(r); }
        vc.appendChild(c); return vc;
    }
    function fitCards() {
        var area = el('card-area'), m = document.createElement('div'), max = 0;
        m.id = 'measure'; m.style.width = area.clientWidth + 'px';
        document.documentElement.style.setProperty('--card-h', '0px');
        steps.forEach(function (s) { var w = document.createElement('div'); w.className = 'verse-card-wrapper'; w.appendChild(buildCard(s)); m.appendChild(w); });
        document.body.appendChild(m);
        m.querySelectorAll('.verse-card-content').forEach(function (c) { max = Math.max(max, c.offsetHeight); });
        document.body.removeChild(m);
        document.documentElement.style.setProperty('--card-h', Math.max(max, 112) + 'px');
    }
    function go(i) { mode = 'guide'; step = i; resumeStep = i; render(); }
    function render() {
        var card = el('card-area'); card.innerHTML = '';
        if (mode === 'overview') {
            paint(steps[steps.length - 1], false);
            var panel = document.createElement('div'); panel.className = 'overview-panel';
            var cap = document.createElement('p'); cap.className = 'overview-caption';
            cap.textContent = 'Love does not ask who qualifies. Because Jesus crossed the road to you, you can cross the road to others.';
            panel.appendChild(cap);
            var onav = document.createElement('div'); onav.className = 'nav-bar';
            onav.appendChild(button('Return to steps', 'return', 'nav-btn', function () { mode = 'guide'; step = resumeStep; setFocus(step === -1 ? 'begin' : 'next'); render(); }));
            onav.appendChild(button('↻ Restart', 'restart', 'nav-btn primary', function () { resumeStep = -1; setFocus('begin'); go(-1); }));
            panel.appendChild(onav); card.appendChild(panel);
            el('status').textContent = 'Whole road shown.'; applyFocus(); return;
        }
        if (step === -1) {
            paint(null, true);
            var wrap = document.createElement('div'); wrap.className = 'begin-wrapper';
            var intro = document.createElement('p'); intro.className = 'begin-text';
            intro.textContent = 'Who counts as my neighbor? Tap Begin to walk the road from Jerusalem to Jericho.';
            wrap.appendChild(intro);
            wrap.appendChild(button('Begin →', 'begin', 'begin-btn', function () { setFocus('next'); go(0); }));
            wrap.appendChild(button('Show whole road', 'overview', 'overview-btn', function () { resumeStep = step; mode = 'overview'; setFocus('return'); render(); }));
            card.appendChild(wrap); el('status').textContent = ''; applyFocus(); return;
        }
        var s = steps[step]; paint(s, false);
        var wrapper = document.createElement('div'); wrapper.className = 'verse-card-wrapper';
        wrapper.appendChild(buildCard(s));
        var nav = document.createElement('div'); nav.className = 'nav-bar';
        nav.appendChild(button('← Back', 'back', 'nav-btn', function () { setFocus(step === 0 ? 'begin' : 'back'); go(step - 1); }));
        var count = document.createElement('span'); count.className = 'step-count'; count.textContent = (step + 1) + ' of ' + steps.length; nav.appendChild(count);
        if (step < steps.length - 1) nav.appendChild(button('Next →', 'next', 'nav-btn primary', function () { setFocus('next'); go(step + 1); }));
        else nav.appendChild(button('↻ Restart', 'restart', 'nav-btn primary', function () { setFocus('begin'); go(-1); }));
        wrapper.appendChild(nav); card.appendChild(wrapper);
        el('status').textContent = 'Step ' + (step + 1) + ' of ' + steps.length + ': ' + s.title; applyFocus();
    }
    fitCards(); render();
    var rt = null, lastWidth = window.innerWidth;
    // Refit only when the width changes. The page briefly resizes this frame's height to measure it,
    // and refitting on that would start a measure-resize loop that jolts the page while scrolling.
    window.addEventListener('resize', function () {
        if (window.innerWidth === lastWidth) return;
        lastWidth = window.innerWidth;
        clearTimeout(rt); rt = setTimeout(fitCards, 150);
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCards);
</script>
</body>
</html>
