<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust the Creator</title>
<style>
:root {
  --ink: #2C2416;
  --muted: #6E6559;
  --paper: #FDFCFB;
  --tray: #F6F4EE;
  --border: #EBE5D9;
  --step-color: #2C2416;
  --step-dark: #2C2416;
  --card-h: 108px;
}

.widget-outer[data-step="1"] {
  --step-color: #6B645A;
  --step-dark: #4F4941;
}

.widget-outer[data-step="2"] {
  --step-color: #5C554B;
  --step-dark: #3F3931;
}

.widget-outer[data-step="3"] {
  --step-color: #7D6B48;
  --step-dark: #5C4D30;
}

.widget-outer[data-step="4"] {
  --step-color: #8B3E2B;
  --step-dark: #6D2D1E;
}

.widget-outer[data-step="5"] {
  --step-color: #9A6B16;
  --step-dark: #754F0B;
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  padding: 0;
  margin: 0;
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.widget-outer {
  background: #FFFFFF;
  border-radius: 0;
  overflow: hidden;
  box-shadow: none;
  border: none;
  max-width: 100%;
  width: 100%;
  margin: 0;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
    border: 1px solid #EBE5D9;
    max-width: 460px;
    margin: 0 auto;
  }
}

.title-bar {
  background: var(--ink);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, sans-serif;
  color: #FAF8F3;
  margin: 0;
  letter-spacing: 0.2px;
  text-align: left;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, sans-serif;
  color: #E5DEC9;
  margin: 0;
  white-space: nowrap;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  flex-shrink: 0;
}

.stage {
  position: relative;
  aspect-ratio: 440 / 276;
  background: var(--paper);
  border-bottom: 1px solid #EEE9DF;
  overflow: hidden;
}

.stage svg {
  width: 100%;
  height: 100%;
  display: block;
}

.shard-wrap {
  opacity: 0;
}

.shard-wrap.is-shown {
  opacity: 1;
}

.shard-base {
  stroke: #2C2416;
  stroke-width: 2.3;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.shard-color {
  opacity: 0;
  stroke: #2C2416;
  stroke-width: 2.3;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.mosaic-svg.is-color .shard-color {
  opacity: 1;
}

.piece-poly {
  fill: #452A17;
  stroke: #C99A2E;
  stroke-width: 1.45;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.piece-crack {
  fill: none;
  stroke: #755138;
  stroke-width: 1.15;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.window-frame {
  fill: none;
  stroke: #2C2416;
  stroke-width: 3.2;
  vector-effect: non-scaling-stroke;
  opacity: 0;
}

.window-frame.is-shown {
  opacity: 1;
}

.cross-glow {
  opacity: 0;
  pointer-events: none;
  mix-blend-mode: screen;
}

.mosaic-svg.is-glow .cross-glow {
  opacity: 0.72;
}

.mosaic-svg.is-glow .piece-poly {
  stroke: #2C2416;
  stroke-width: 2.3;
}

@media (prefers-reduced-motion: no-preference) {
  .widget-outer:not(.is-instant) .shard-wrap {
    transition: opacity 420ms ease;
  }
  .widget-outer:not(.is-instant) .shard-base {
    transition: fill 480ms ease;
  }
  .widget-outer:not(.is-instant) .shard-color {
    transition: opacity 480ms ease var(--d, 0ms);
  }
  .widget-outer:not(.is-instant) .window-frame {
    transition: opacity 420ms ease;
  }
  .widget-outer:not(.is-instant) .cross-glow {
    transition: opacity 820ms ease;
  }
  .widget-outer:not(.is-instant) .piece-poly {
    transition: stroke 700ms ease, stroke-width 700ms ease;
  }
}

/* Step dots row */
.dot-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  background: #FAF8F4;
  border-bottom: 1px solid #EEE9DF;
}

.step-dot-btn {
  min-width: 44px;
  min-height: 44px;
  padding: 0;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 999px;
}

.step-dot-fill {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid var(--dot-color, #2C2416);
  background: #FFFFFF;
  transition: transform 180ms ease, background-color 180ms ease, border-color 180ms ease;
}

.step-dot-btn.is-passed .step-dot-fill {
  background: var(--dot-soft, #EAE6DF);
}

.step-dot-btn.is-active .step-dot-fill {
  background: var(--dot-color, #2C2416);
  transform: scale(1.22);
}

/* Card + Navigation */
.card-area {
  background: var(--tray);
  padding: 7px 12px 9px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #EBE5D9;
  box-shadow: 0 2px 12px rgba(44, 36, 22, 0.06);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
  transition: background-color 260ms ease;
}

.verse-card-content {
  padding: 8px 13px;
  min-height: var(--card-h, 108px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-heading {
  font: 700 14.5px/1.22 system-ui, -apple-system, sans-serif;
  color: var(--step-dark);
  margin: 0 0 3px;
  transition: color 250ms ease;
}

.card-heading[hidden] {
  display: none;
}

.card-verse {
  font: italic 12.5px/1.33 Georgia, Cambria, serif;
  color: #3D3426;
  margin: 0 0 4px;
}

.card-verse[hidden] {
  display: none;
}

.card-text {
  font: 13px/1.37 Georgia, Cambria, serif;
  color: #362E22;
  margin: 0;
}

.card-ref {
  font: 600 11px/1.2 system-ui, -apple-system, sans-serif;
  color: var(--muted);
  margin: 3px 0 0;
}

.card-ref[hidden] {
  display: none;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  min-height: 44px;
  min-width: 98px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: var(--ink);
  font: 700 13.5px/1 system-ui, -apple-system, sans-serif;
  cursor: pointer;
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FFFFFF;
  transition: background-color 250ms ease, border-color 250ms ease;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.step-count {
  font: 600 12px system-ui, -apple-system, sans-serif;
  color: var(--muted);
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .shard-wrap,
  .shard-base,
  .shard-color,
  .window-frame,
  .cross-glow,
  .step-dot-fill,
  .verse-card-bar,
  .card-heading,
  .nav-btn.primary {
    transition: none !important;
  }
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" data-step="0" aria-label="Trust the Creator: stained-glass mosaic from one dark shard to the cross and empty tomb">
  <header class="title-bar">
    <h1>Trust the Creator</h1>
    <span class="course-tag">202-05</span>
  </header>

  <div class="stage" id="stage"></div>

  <div class="dot-strip" id="dot-strip" role="group" aria-label="Mosaic steps"></div>

  <section class="card-area" id="card-area" aria-live="polite">
    <div class="verse-card">
      <div class="verse-card-bar" aria-hidden="true"></div>
      <div class="verse-card-content" id="card-content">
        <h2 class="card-heading" id="card-heading"></h2>
        <p class="card-verse" id="card-verse"></p>
        <p class="card-text" id="card-text"></p>
        <p class="card-ref" id="card-ref"></p>
      </div>
    </div>
    <div class="nav-bar">
      <button class="nav-btn" id="prev-btn" type="button">&larr; Back</button>
      <span class="step-count" id="step-count"></span>
      <button class="nav-btn primary" id="next-btn" type="button">Begin &rarr;</button>
    </div>
  </section>
</main>

    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
    var same = Math.abs(currentVB[0] - targetVB[0]) < 0.05 &&
               Math.abs(currentVB[1] - targetVB[1]) < 0.05 &&
               Math.abs(currentVB[2] - targetVB[2]) < 0.05 &&
               Math.abs(currentVB[3] - targetVB[3]) < 0.05;
    if (instant || same) {
      setViewBox(targetVB);
      return;
    }
    var startVB = currentVB.slice();
    var startTime = null;
    var duration = 900;

    function tick(now) {
      if (startTime === null) startTime = now;
      var elapsed = now - startTime;
      var t = Math.min(1, elapsed / duration);
      var e = easeOutCubic(t);
      setViewBox([
        startVB[0] + (targetVB[0] - startVB[0]) * e,
        startVB[1] + (targetVB[1] - startVB[1]) * e,
        startVB[2] + (targetVB[2] - startVB[2]) * e,
        startVB[3] + (targetVB[3] - startVB[3]) * e
      ]);
      if (t < 1) {
        rafId = requestAnimationFrame(tick);
      } else {
        rafId = null;
        setViewBox(targetVB);
      }
    }

    rafId = requestAnimationFrame(tick);
  }

  function applyCard(st) {
    if (st.heading) {
      headingEl.textContent = st.heading;
      headingEl.hidden = false;
    } else {
      headingEl.textContent = '';
      headingEl.hidden = true;
    }
    if (st.verse) {
      verseEl.textContent = st.verse;
      verseEl.hidden = false;
    } else {
      verseEl.textContent = '';
      verseEl.hidden = true;
    }
    textEl.textContent = st.text;
    if (st.ref) {
      refEl.textContent = st.ref;
      refEl.hidden = false;
    } else {
      refEl.textContent = '';
      refEl.hidden = true;
    }
  }

  function goTo(nextStep, forceInstant) {
    var target = Math.max(0, Math.min(STEPS.length - 1, nextStep));
    var isBack = target < currentStep;
    var instant = Boolean(forceInstant || isBack || prefersReduced());

    widgetEl.classList.toggle('is-instant', instant);
    if (instant) {
      void widgetEl.offsetWidth;
    }

    currentStep = target;
    var st = STEPS[currentStep];
    widgetEl.setAttribute('data-step', String(currentStep));

    var useSketchGrey = currentStep >= 3;
    shardRefs.forEach(function (ref) {
      var shown = ref.z <= Math.min(3, currentStep);
      ref.wrap.classList.toggle('is-shown', shown);
      ref.base.setAttribute('fill', useSketchGrey ? ref.gs : ref.ga);
    });

    windowFrame.classList.toggle('is-shown', currentStep >= 3);
    svg.classList.toggle('is-color', currentStep >= 4);
    svg.classList.toggle('is-glow', currentStep >= 5);

    animateViewBox(VIEWBOXES[currentStep], instant);

    svgTitleEl.textContent = st.svgTitle;
    svgDescEl.textContent = st.svgDesc;

    dotButtons.forEach(function (btn, idx) {
      btn.classList.toggle('is-active', idx === currentStep);
      btn.classList.toggle('is-passed', idx < currentStep);
      btn.setAttribute('aria-pressed', idx === currentStep ? 'true' : 'false');
    });

    applyCard(st);
    countEl.textContent = currentStep === 0 ? 'Ready' : ('Step ' + currentStep + ' of 5');

    prevBtn.disabled = currentStep === 0;
    if (currentStep === 0) {
      nextBtn.innerHTML = 'Begin &rarr;';
    } else if (currentStep === STEPS.length - 1) {
      nextBtn.innerHTML = '&#8635; Start Over';
    } else {
      nextBtn.innerHTML = 'Next &rarr;';
    }
  }

  prevBtn.addEventListener('click', function () {
    if (currentStep > 0) goTo(currentStep - 1);
  });

  nextBtn.addEventListener('click', function () {
    if (currentStep === STEPS.length - 1) {
      goTo(0);
    } else {
      goTo(currentStep + 1);
    }
  });

  var contentEl = document.getElementById('card-content');
  var lastWidth = window.innerWidth;
  var measuredAtWidth = 0;

  function fitCardHeight() {
    if (!contentEl || contentEl.clientWidth === measuredAtWidth) return;
    measuredAtWidth = contentEl.clientWidth;
    var tallest = 0;
    document.documentElement.style.setProperty('--card-h', '0px');
    STEPS.forEach(function (st) {
      applyCard(st);
      tallest = Math.max(tallest, contentEl.offsetHeight);
    });
    applyCard(STEPS[currentStep]);
    document.documentElement.style.setProperty('--card-h', Math.max(100, tallest) + 'px');
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastWidth) return;
    lastWidth = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCardHeight, 120);
  });

  goTo(0, true);
  fitCardHeight();
})();
</script>
</body>
</html>
