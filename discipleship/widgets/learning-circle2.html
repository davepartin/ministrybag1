<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Learning Circle</title>
<style>
:root {
  --ink: #2C2416;
  --muted: #6E6559;
  --tray: #F6F4EE;
  --border: #EBE5D9;
  --sage: #5A6B4F;
  --rust: #A0522D;
  --terra: #8C4B3B;
  --blue: #4A6B8B;
  --gold: #B8860B;
  --gold-dark: #946B06;
  --charcoal: #3A3834;
  --step-color: #2C2416;
  --step-dark: #2C2416;
  --card-h: 132px;
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  padding: 0;
  margin: 0;
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.widget-outer {
  background: #FFFFFF;
  border-radius: 0;
  overflow: hidden;
  box-shadow: none;
  border: none;
  max-width: 100%;
  width: 100%;
  margin: 0;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
    border: 1px solid var(--border);
    max-width: 460px;
    margin: 0 auto;
  }
}

.title-bar {
  background: #2C2416;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  margin: 0;
  text-align: left;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
  flex-shrink: 0;
}

.stage {
  background: #FFFFFF;
  padding: 4px 6px 2px;
  border-bottom: 1px solid var(--border);
}

svg#circle-svg {
  display: block;
  width: 100%;
  height: auto;
}

.svg-sans {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.svg-serif {
  font-family: Georgia, Cambria, serif;
}

.fade-part {
  opacity: 0;
}

.fade-part.is-on {
  opacity: 1;
}

@media (prefers-reduced-motion: no-preference) {
  .widget-outer:not(.is-instant) .fade-part {
    transition: opacity 0.4s ease var(--fade-delay, 0ms);
  }
  .widget-outer .step-dot-fill {
    transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
  }
  .widget-outer .nav-btn.primary,
  .widget-outer .verse-card-bar,
  .widget-outer .verse-card-title {
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease;
  }
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  padding: 6px 12px 5px;
  background: var(--tray);
  border-bottom: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  min-width: 28px;
  min-height: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
}

.step-dot-fill {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2.4px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 22%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.14);
}

#card-area {
  background: var(--tray);
  padding: 7px 12px 10px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(44, 36, 22, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 13px;
  min-height: var(--card-h, 132px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  --accent-color: var(--step-dark);
}

.verse-card-title {
  font: 700 15px/1.25 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 4px;
}

.verse-card-text {
  font: 13.5px/1.4 Georgia, Cambria, serif;
  color: #3D3426;
  margin: 0;
}

.verse-card-text b {
  color: var(--accent-color, var(--ink));
  font-weight: 700;
}

.verse-card-ref {
  font: 600 11.5px/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  margin: 5px 0 0;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  appearance: none;
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: var(--ink);
  font: 700 13.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  white-space: nowrap;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FFFFFF;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.nav-btn.single-begin {
  margin-left: auto;
}

.step-count {
  font: 600 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  text-align: center;
  white-space: nowrap;
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (max-width: 395px) {
  #card-area {
    padding: 6px 10px 8px;
  }
  .verse-card-content {
    padding: 8px 11px;
  }
  .verse-card-title {
    font-size: 14.5px;
  }
  .verse-card-text {
    font-size: 13px;
  }
  .nav-btn {
    min-width: 88px;
    padding: 10px 12px;
  }
}

#measure {
  position: fixed;
  left: -9999px;
  top: 0;
  visibility: hidden;
  pointer-events: none;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" role="region" aria-label="Interactive Learning Circle">
  <div class="title-bar">
    <h1>The Learning Circle</h1>
    <span class="course-tag">201-10</span>
  </div>

  <div class="stage">
    <svg id="circle-svg" viewBox="0 0 380 326" width="100%" role="img" aria-labelledby="lc-title lc-desc">
      <title id="lc-title">The Learning Circle</title>
      <desc id="lc-desc">A faint path of Jesus along the top with a ghost circle below waiting to unfold step by step.</desc>

      <!-- Soft Ghost Guide Underneath (keeps the completed shape lightly in memory) -->
      <g id="ghost-guide" fill="none" stroke="#DDD8CE" stroke-linecap="round" stroke-linejoin="round" opacity="0.34">
        <path d="M 24 56 L 94 56 C 130 56 152 108 184 123" stroke-width="4.5"/>
        <circle cx="190" cy="214" r="88" stroke-width="3.5"/>
        <path d="M 196 123 C 228 108 250 56 286 56 L 340 56" stroke-width="4.5"/>
      </g>

      <!-- Step 1: Unified Path of Jesus Corridor + Directional Line -->
      <g id="layer-path">
        <rect id="jesus-band" x="14" y="42" width="352" height="28" rx="14" fill="#5A6B4F" opacity="0"/>
        <line id="jesus-line" x1="24" y1="56" x2="340" y2="56" stroke="#5A6B4F" stroke-width="7.5" stroke-linecap="round"/>
        <polygon id="jesus-arrow" points="359,56 336,46.5 336,65.5" fill="#5A6B4F" opacity="0"/>
        <text id="lbl-jesus" class="fade-part svg-sans" x="190" y="24" text-anchor="middle" font-size="15.5" font-weight="700" letter-spacing="0.2" fill="#5A6B4F">The Path of Jesus</text>
      </g>

      <!-- Step 2: Drift Curve Starting ON The Path of Jesus -->
      <g id="layer-stray">
        <path id="drift-path" d="M 24 56 L 94 56 C 130 56 152 108 184 123" fill="none" stroke="#2C2416" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
        <polygon id="drift-arrow" class="fade-part" points="187,124.5 170,124 176.5,112" fill="#2C2416"/>
        <text id="lbl-away" class="fade-part svg-sans" x="22" y="90" text-anchor="start" font-size="12" font-weight="700" fill="#2C2416">We Turn Away</text>
      </g>

      <!-- Step 3: Conviction Turning Point above Circle Apex -->
      <g id="layer-turning">
        <line id="turning-tick" class="fade-part" x1="190" y1="91" x2="190" y2="117" stroke="#8E8476" stroke-width="2.2" stroke-linecap="round"/>
        <text id="lbl-conviction" class="fade-part svg-sans" x="190" y="84" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2C2416" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">Conviction</text>
      </g>

      <!-- Step 4: Right Half Circle (Repent: 1. Reflect / 2. Remorse) -->
      <g id="layer-repent">
        <line id="circle-divider" class="fade-part" x1="190" y1="138" x2="190" y2="290" stroke="#D5CDC0" stroke-width="1.5"/>
        <path id="repent-arc" d="M 190 126 A 88 88 0 0 1 190 302" fill="none" stroke="#2C2416" stroke-width="4.8" stroke-linecap="round"/>
        <polygon id="repent-arrow-side" class="fade-part" points="278,223 271.5,209 284.5,209" fill="#2C2416"/>
        <polygon id="repent-arrow-bot" class="fade-part" points="181,302 195,295.5 195,308.5" fill="#2C2416"/>
        <text id="lbl-repent" class="fade-part svg-sans" x="234" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#4A6B8B">Repent</text>
        <g id="lbl-reflect" class="fade-part">
          <text class="svg-sans" x="326" y="152" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4A6B8B">1. Reflect</text>
          <text class="svg-sans" x="326" y="166" text-anchor="middle" font-size="11" font-style="italic" font-weight="500" fill="#8C8375">mind</text>
        </g>
        <g id="lbl-remorse" class="fade-part">
          <text class="svg-sans" x="326" y="264" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4A6B8B">2. Remorse</text>
          <text class="svg-sans" x="326" y="278" text-anchor="middle" font-size="11" font-style="italic" font-weight="500" fill="#8C8375">heart</text>
        </g>
      </g>

      <!-- Step 5: Left Half Circle (Believe: 3. Plan / 4. Obey) -->
      <g id="layer-believe">
        <path id="believe-arc" d="M 190 302 A 88 88 0 0 1 190 126" fill="none" stroke="#2C2416" stroke-width="4.8" stroke-linecap="round"/>
        <polygon id="believe-arrow-side" class="fade-part" points="102,205 95.5,219 108.5,219" fill="#2C2416"/>
        <text id="lbl-believe" class="fade-part svg-sans" x="146" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#B8860B">Believe</text>
        <g id="lbl-plan" class="fade-part">
          <text class="svg-sans" x="54" y="264" text-anchor="middle" font-size="13.5" font-weight="800" fill="#B8860B">3. Plan</text>
          <text class="svg-sans" x="54" y="278" text-anchor="middle" font-size="11" font-style="italic" font-weight="500" fill="#8C8375">steps</text>
        </g>
        <g id="lbl-obey" class="fade-part">
          <text class="svg-sans" x="54" y="152" text-anchor="middle" font-size="13.5" font-weight="800" fill="#B8860B">4. Obey</text>
          <text class="svg-sans" x="54" y="166" text-anchor="middle" font-size="11" font-style="italic" font-weight="500" fill="#8C8375">act</text>
        </g>
      </g>

      <!-- Step 6: Return Smoothly Back ONTO The Path of Jesus -->
      <g id="layer-restored">
        <path id="return-path" d="M 196 123 C 228 108 250 56 286 56 L 340 56" fill="none" stroke="#2C2416" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
        <polygon id="return-arrow" class="fade-part" points="355,56 336,48.5 336,63.5" fill="#2C2416"/>
        <text id="lbl-back" class="fade-part svg-sans" x="358" y="90" text-anchor="end" font-size="12" font-weight="700" fill="#2C2416">Back on the Path</text>
      </g>

      <!-- Turning Point Node sits cleanly on top of curve joins -->
      <circle id="turning-node" class="fade-part" cx="190" cy="126" r="6" fill="#FFFFFF" stroke="#8E8476" stroke-width="1.8"/>

      <!-- Intro Overlay Verse inside quiet ghost circle -->
      <g id="intro-overlay" class="fade-part" text-anchor="middle">
        <text class="svg-serif" x="190" y="202" font-size="17" font-style="italic" fill="#2C2416" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">"Repent and Believe</text>
        <text class="svg-serif" x="190" y="226" font-size="17" font-style="italic" fill="#2C2416" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">in the gospel."</text>
        <text class="svg-sans" x="190" y="250" font-size="12" font-weight="600" fill="#8C8375">Mark 1:15</text>
      </g>
    </svg>
  </div>

  <div class="step-strip" id="step-strip" role="group" aria-label="Learning Circle steps"></div>
  <div id="card-area" aria-live="polite"></div>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
(function () {
  'use strict';

  var INK = '#2C2416';
  var INTRO = {
    color: INK,
    dark: INK,
    dotLabel: 'Start: Getting Back on the Path',
    cardTitle: 'Getting Back on the Path',
    verse: '<i>"Repent and believe in the gospel."</i> (Mark 1:15) Everyone wanders at times. Here is how the gospel turns you around: notice the drift, repent, believe, and follow Jesus again.',
    ref: '',
    desc: 'A faint path of Jesus along the top with a ghost circle below waiting to unfold step by step.'
  };

  var stops = [
    {
      id: 'path',
      dotLabel: 'Step 1: The Path of Jesus',
      cardTitle: 'The Path of Jesus',
      color: '#5A6B4F',
      dark: '#4A5940',
      ref: 'Mark 1:15',
      verse: '"The time is fulfilled, and the kingdom of God is at hand; <b>repent and believe</b> in the gospel."',
      desc: 'A green arrow marks The Path of Jesus moving steadily forward across the top.'
    },
    {
      id: 'stray',
      dotLabel: 'Step 2: We Turn Away',
      cardTitle: 'Following Your Own Way',
      color: '#A0522D',
      dark: '#864222',
      ref: 'Isaiah 53:6',
      verse: 'Sin is any thought, word, or action that goes against God. You drift when you leave His way and choose <b>your own path</b> instead.',
      desc: 'A dark curve drifts off The Path of Jesus down toward the top of the circle, labeled We Turn Away.'
    },
    {
      id: 'turning',
      dotLabel: 'Step 3: Conviction',
      cardTitle: 'Conviction: Exposing the Truth',
      color: '#8C4B3B',
      dark: '#753D30',
      ref: '',
      verse: 'Conviction is the Spirit bringing your sin into the light to guide you to freedom.<br><b>"Search me, O God, and know my heart!</b> Try me and know my thoughts! And see if there be any grievous way in me." <span style="white-space:nowrap;">Psalm&nbsp;139:23-24</span>',
      desc: 'Conviction marks the turning point node at the top of the circle where you wake up and turn back.'
    },
    {
      id: 'repent',
      dotLabel: 'Step 4: Repent',
      cardTitle: 'Repent',
      color: '#4A6B8B',
      dark: '#395570',
      ref: '',
      verse: '<b>1. Reflect</b> - "When I think on my ways, I turn my feet to your testimonies." <span style="white-space:nowrap;">Psalm&nbsp;119:59</span><br><b>2. Remorse</b> - "For godly grief produces a repentance that leads to salvation without regret." <span style="white-space:nowrap;">2&nbsp;Corinthians&nbsp;7:10</span>',
      desc: 'The right half of the circle sweeps downward around Repent with steps 1 Reflect (mind) and 2 Remorse (heart).'
    },
    {
      id: 'believe',
      dotLabel: 'Step 5: Believe',
      cardTitle: 'Believe',
      color: '#B8860B',
      dark: '#946B06',
      ref: '',
      verse: '<b>Trust</b> - Receive His forgiveness. "If we confess our sins, he is faithful and just to forgive us our sins." <span style="white-space:nowrap;">1&nbsp;John&nbsp;1:9</span><br><b>3. Plan</b> - Pray, set a step or two, and invite someone in for accountability.<br><b>4. Obey</b> - "Be doers of the word, and not hearers only, deceiving yourselves." <span style="white-space:nowrap;">James&nbsp;1:22</span>',
      desc: 'The left half sweeps upward around Believe with Trust, 3 Plan (steps), and 4 Obey (act), completing the circle.'
    },
    {
      id: 'restored',
      dotLabel: 'Step 6: Back on the Path',
      cardTitle: 'Back on the Path',
      color: '#3A3834',
      dark: '#2C2416',
      ref: '',
      verse: 'The same gospel that saves you keeps drawing you back to Jesus. Each time you turn, you come home a little further along. <b>Keep turning. Keep believing.</b>',
      desc: 'From the top of the circle, the path curves smoothly up and forward right back onto The Path of Jesus, labeled Back on the Path.'
    }
  ];

  var step = -1;
  var pendingFocus = null;
  var activeRaf = null;
  var reduceQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

  function el(id) { return document.getElementById(id); }

  var jesusLine = el('jesus-line');
  var jesusBand = el('jesus-band');
  var jesusArrow = el('jesus-arrow');
  var driftPath = el('drift-path');
  var repentArc = el('repent-arc');
  var believeArc = el('believe-arc');
  var returnPath = el('return-path');

  var LEN_JESUS = 316;
  var LEN_DRIFT = driftPath.getTotalLength();
  var LEN_ARC = Math.PI * 88;
  var LEN_RETURN = returnPath.getTotalLength();

  jesusLine.style.strokeDasharray = LEN_JESUS;
  driftPath.style.strokeDasharray = LEN_DRIFT;
  repentArc.style.strokeDasharray = LEN_ARC;
  believeArc.style.strokeDasharray = LEN_ARC;
  returnPath.style.strokeDasharray = LEN_RETURN;

  function setFade(id, on, delayMs) {
    var node = el(id);
    if (!node) return;
    node.style.setProperty('--fade-delay', (delayMs || 0) + 'ms');
    node.classList.toggle('is-on', !!on);
  }

  function stopAnim() {
    if (activeRaf) {
      cancelAnimationFrame(activeRaf);
      activeRaf = null;
    }
  }

  function runStroke(jobs, duration, instant, onProgress) {
    stopAnim();
    if (instant || reduceQuery.matches) {
      jobs.forEach(function (j) {
        j.node.style.strokeDashoffset = j.to;
      });
      if (onProgress) onProgress(1);
      return;
    }
    var t0 = null;
    function tick(ts) {
      if (t0 === null) t0 = ts;
      var k = Math.min((ts - t0) / duration, 1);
      var e = 1 - Math.pow(1 - k, 3);
      jobs.forEach(function (j) {
        j.node.style.strokeDashoffset = (j.from + (j.to - j.from) * e).toFixed(2);
      });
      if (onProgress) onProgress(k);
      if (k < 1) {
        activeRaf = requestAnimationFrame(tick);
      } else {
        activeRaf = null;
      }
    }
    activeRaf = requestAnimationFrame(tick);
  }

  function paintDiagram(targetStep, instant) {
    var isInst = !!(instant || reduceQuery.matches);
    el('widget').classList.toggle('is-instant', isInst);

    var isIntro = targetStep === -1;
    var pathOn = targetStep >= 0;
    var strayOn = targetStep >= 1;
    var turningOn = targetStep >= 2;
    var repentOn = targetStep >= 3;
    var believeOn = targetStep >= 4;
    var restoredOn = targetStep >= 5;

    setFade('intro-overlay', false, 0); // retired cover verse: the circle shows at once; Mark 1:15 is in the opening card
    setFade('lbl-jesus', pathOn, targetStep === 0 && !isInst ? 160 : 0);
    setFade('lbl-away', strayOn, targetStep === 1 && !isInst ? 220 : 0);
    setFade('turning-tick', turningOn, 0);
    setFade('lbl-conviction', turningOn, 0);
    setFade('turning-node', turningOn, 0);

    setFade('circle-divider', repentOn, targetStep === 3 && !isInst ? 260 : 0);
    setFade('lbl-repent', repentOn, targetStep === 3 && !isInst ? 180 : 0);
    setFade('lbl-reflect', repentOn, targetStep === 3 && !isInst ? 240 : 0);
    setFade('lbl-remorse', repentOn, targetStep === 3 && !isInst ? 340 : 0);
    setFade('repent-arrow-side', repentOn, targetStep === 3 && !isInst ? 420 : 0);
    setFade('repent-arrow-bot', repentOn, targetStep === 3 && !isInst ? 580 : 0);

    setFade('lbl-believe', believeOn, targetStep === 4 && !isInst ? 180 : 0);
    setFade('lbl-plan', believeOn, targetStep === 4 && !isInst ? 240 : 0);
    setFade('lbl-obey', believeOn, targetStep === 4 && !isInst ? 360 : 0);
    setFade('believe-arrow-side', believeOn, targetStep === 4 && !isInst ? 420 : 0);

    setFade('lbl-back', restoredOn, targetStep === 5 && !isInst ? 240 : 0);

    // Static baselines for already-completed segments
    jesusBand.setAttribute('opacity', pathOn ? '0.15' : '0');
    jesusLine.style.strokeDashoffset = pathOn ? 0 : LEN_JESUS;
    jesusArrow.setAttribute('opacity', pathOn ? '1' : '0');

    driftPath.style.strokeDashoffset = strayOn ? 0 : LEN_DRIFT;
    setFade('drift-arrow', strayOn, 0);

    repentArc.style.strokeDashoffset = repentOn ? 0 : LEN_ARC;
    believeArc.style.strokeDashoffset = believeOn ? 0 : LEN_ARC;
    returnPath.style.strokeDashoffset = restoredOn ? 0 : LEN_RETURN;
    setFade('return-arrow', restoredOn, 0);

    // Animate only the active step's new path cleanly
    stopAnim();
    if (!isInst) {
      if (targetStep === 0) {
        jesusArrow.setAttribute('opacity', '0');
        jesusBand.setAttribute('opacity', '0');
        runStroke([{ node: jesusLine, from: LEN_JESUS, to: 0 }], 760, false, function (k) {
          jesusBand.setAttribute('opacity', (0.15 * k).toFixed(3));
          if (k > 0.72) jesusArrow.setAttribute('opacity', Math.min((k - 0.72) / 0.28, 1).toFixed(2));
        });
      } else if (targetStep === 1) {
        setFade('drift-arrow', false, 0);
        runStroke([{ node: driftPath, from: LEN_DRIFT, to: 0 }], 740, false, function (k) {
          if (k > 0.8) setFade('drift-arrow', true, 0);
        });
      } else if (targetStep === 3) {
        runStroke([{ node: repentArc, from: LEN_ARC, to: 0 }], 780, false);
      } else if (targetStep === 4) {
        runStroke([{ node: believeArc, from: LEN_ARC, to: 0 }], 780, false);
      } else if (targetStep === 5) {
        setFade('return-arrow', false, 0);
        runStroke([{ node: returnPath, from: LEN_RETURN, to: 0 }], 820, false, function (k) {
          if (k > 0.82) setFade('return-arrow', true, 0);
        });
      }
    }

    var stateObj = isIntro ? INTRO : stops[targetStep];
    el('lc-desc').textContent = stateObj.desc;
  }

  function makeCard(spec) {
    var vc = document.createElement('div');
    vc.className = 'verse-card';
    var bar = document.createElement('div');
    bar.className = 'verse-card-bar';
    bar.style.background = spec.color;
    vc.appendChild(bar);

    var content = document.createElement('div');
    content.className = 'verse-card-content';
    content.style.setProperty('--accent-color', spec.dark || spec.color);

    var title = document.createElement('h2');
    title.className = 'verse-card-title';
    title.style.color = spec.dark || spec.color;
    title.textContent = spec.cardTitle;
    content.appendChild(title);

    var text = document.createElement('p');
    text.className = 'verse-card-text';
    text.innerHTML = spec.verse;
    content.appendChild(text);

    if (spec.ref) {
      var ref = document.createElement('p');
      ref.className = 'verse-card-ref';
      ref.textContent = spec.ref;
      content.appendChild(ref);
    }

    vc.appendChild(content);
    return vc;
  }

  function fitCards() {
    var area = el('card-area');
    var cs = getComputedStyle(area);
    var innerW = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var m = document.createElement('div');
    m.id = 'measure';
    m.style.width = Math.max(innerW, 240) + 'px';
    document.documentElement.style.setProperty('--card-h', '0px');
    var max = 0;
    [INTRO].concat(stops).forEach(function (spec) {
      m.appendChild(makeCard(spec));
    });
    document.body.appendChild(m);
    m.querySelectorAll('.verse-card-content').forEach(function (node) {
      max = Math.max(max, node.offsetHeight);
    });
    document.body.removeChild(m);
    document.documentElement.style.setProperty('--card-h', Math.max(max, 120) + 'px');
  }

  var strip = el('step-strip');
  var dots = [];

  function addDot(idx, label, color) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'step-dot';
    btn.style.setProperty('--dot-color', color);
    btn.setAttribute('aria-label', label);
    btn.setAttribute('aria-pressed', 'false');
    var fill = document.createElement('span');
    fill.className = 'step-dot-fill';
    btn.appendChild(fill);
    btn.addEventListener('click', function () {
      go(idx, false);
    });
    strip.appendChild(btn);
    dots.push({ btn: btn, step: idx });
  }

  addDot(-1, INTRO.dotLabel, INTRO.color);
  stops.forEach(function (s, i) {
    addDot(i, s.dotLabel, s.color);
  });

  function updateDots() {
    dots.forEach(function (d) {
      var isCurrent = d.step === step;
      var isPassed = d.step < step;
      d.btn.classList.toggle('active', isCurrent);
      d.btn.classList.toggle('passed', isPassed);
      d.btn.setAttribute('aria-pressed', isCurrent ? 'true' : 'false');
    });
  }

  function makeBtn(label, control, cls, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = cls;
    b.setAttribute('data-control', control);
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function applyFocus() {
    if (!pendingFocus) return;
    var target = document.querySelector('[data-control="' + pendingFocus + '"]');
    pendingFocus = null;
    if (target) target.focus();
  }

  function go(nextStep, instant, focusControl) {
    step = nextStep;
    pendingFocus = focusControl || null;

    var spec = step === -1 ? INTRO : stops[step];
    document.documentElement.style.setProperty('--step-color', spec.color);
    document.documentElement.style.setProperty('--step-dark', spec.dark || spec.color);

    paintDiagram(step, instant);

    var cardArea = el('card-area');
    cardArea.innerHTML = '';
    cardArea.appendChild(makeCard(spec));

    var nav = document.createElement('div');
    nav.className = 'nav-bar';

    if (step === -1) {
      var count0 = document.createElement('span');
      count0.className = 'step-count';
      count0.textContent = 'Ready';
      nav.appendChild(count0);
      nav.appendChild(makeBtn('Begin \u2192', 'begin', 'nav-btn primary begin-btn single-begin', function () {
        go(0, false, 'next');
      }));
      el('status').textContent = INTRO.cardTitle;
    } else {
      nav.appendChild(makeBtn('\u2190 Back', 'back', 'nav-btn', function () {
        go(step - 1, false, step === 0 ? 'begin' : 'back');
      }));
      var count = document.createElement('span');
      count.className = 'step-count';
      count.textContent = (step + 1) + ' of ' + stops.length;
      nav.appendChild(count);
      if (step < stops.length - 1) {
        nav.appendChild(makeBtn('Next \u2192', 'next', 'nav-btn primary', function () {
          go(step + 1, false, 'next');
        }));
      } else {
        nav.appendChild(makeBtn('\u21BB Start Over', 'restart', 'nav-btn primary', function () {
          go(-1, false, 'begin');
        }));
      }
      el('status').textContent = 'Step ' + (step + 1) + ' of ' + stops.length + ': ' + spec.cardTitle;
    }

    cardArea.appendChild(nav);
    updateDots();
    applyFocus();
  }

  go(-1, true, null);
  fitCards();

  var resizeTimer = null;
  var lastWidth = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastWidth) return;
    lastWidth = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCards, 150);
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitCards);
  }
})();
</script>
</body>
</html>
