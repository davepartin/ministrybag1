<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peaks and Valleys</title>
<style>
:root {
  --ink: #2C2416;
  --muted: #6E6559;
  --tray: #F6F4EE;
  --border: #EBE5D9;
  --gold: #A8760A;
  --gold-dark: #7D5604;
  --gold-wash: #FCF2D6;
  --green: #1F684A;
  --green-dark: #164E37;
  --green-wash: #E1F1E9;
  --blue: #2A5B7C;
  --blue-dark: #1E435C;
  --blue-wash: #E2EEF6;
  --plum: #5F4684;
  --plum-dark: #473366;
  --plum-wash: #EDE7F6;
  --crimson: #8B1A2B;
  --crimson-dark: #6D1422;
  --step-color: #2C2416;
  --step-dark: #2C2416;
  --card-h: 112px;
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  padding: 0;
  margin: 0;
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.widget-outer {
  background: #FFFFFF;
  border-radius: 0;
  overflow: hidden;
  box-shadow: none;
  border: none;
  max-width: 100%;
  width: 100%;
  margin: 0;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
    border: 1px solid #EBE5D9;
    max-width: 460px;
    margin: 0 auto;
  }
}

.title-bar {
  background: #2C2416;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  margin: 0;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  background: #FFFFFF;
  padding: 6px 8px 4px;
  border-bottom: 1px solid var(--border);
}

.pv-svg {
  display: block;
  width: 100%;
  height: auto;
}

.node-group {
  opacity: 0;
  pointer-events: none;
}

.node-group.is-visible {
  opacity: 1;
  pointer-events: auto;
  cursor: pointer;
}

.node-group.is-ghost {
  opacity: 0.22;
}

.node-age {
  font: 700 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.1px;
}

.node-label {
  font: 600 11px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  fill: #4A4238;
}

.star-age {
  font: 700 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  fill: var(--gold-dark);
}

.star-label {
  font: 700 11px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  fill: var(--gold-dark);
}

.axis-tag {
  font: 700 9.5px/1 system-ui, -apple-system, sans-serif;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  fill: #857B6D;
}

.star-halo,
.climax-badge,
.today-chevrons {
  opacity: 0;
  pointer-events: none;
}

.star-halo.is-visible,
.climax-badge.is-visible,
.today-chevrons.is-visible {
  opacity: 1;
}

.node-focus-ring {
  opacity: 0;
  pointer-events: none;
}

.node-group.is-selected .node-focus-ring,
.node-group:focus-visible .node-focus-ring {
  opacity: 1;
}

.curve-ghost {
  fill: none;
  stroke: #DFD8CA;
  stroke-width: 1.5;
  stroke-dasharray: 4 5;
  stroke-linecap: round;
  opacity: 0.75;
}

.curve-main {
  fill: none;
  stroke: var(--blue);
  stroke-width: 2.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.curve-climax {
  fill: none;
  stroke: #FADFA0;
  stroke-width: 8.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0;
}

.curve-climax.is-visible {
  opacity: 0.72;
}

.climax-contour {
  fill: none;
  stroke: var(--crimson);
  stroke-linecap: round;
  stroke-linejoin: round;
}

@media (prefers-reduced-motion: no-preference) {
  .widget-outer:not(.is-instant) .node-group,
  .widget-outer:not(.is-instant) .star-halo,
  .widget-outer:not(.is-instant) .climax-badge,
  .widget-outer:not(.is-instant) .today-chevrons,
  .widget-outer:not(.is-instant) .curve-climax {
    transition: opacity 0.42s ease var(--fade-delay, 0ms);
  }
  .widget-outer .step-dot-fill {
    transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
  }
  .widget-outer .nav-btn.primary,
  .widget-outer .verse-card-bar,
  .widget-outer .card-heading {
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease;
  }
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 5px;
  background: var(--tray);
  border-bottom: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  min-width: 28px;
  min-height: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
}

.step-dot-fill {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2.5px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 22%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.12);
}

.card-area {
  background: var(--tray);
  padding: 7px 12px 10px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #EBE5D9;
  box-shadow: 0 2px 10px rgba(44, 36, 22, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 13px;
  min-height: var(--card-h, 112px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-heading {
  font: 700 15px/1.22 system-ui, -apple-system, sans-serif;
  color: var(--step-dark);
  margin: 0 0 4px;
}

.card-verse {
  font: 13.5px/1.36 Georgia, Cambria, serif;
  color: #3D3426;
  margin: 0;
}

.verse-ref {
  font: 600 11.5px/1.2 system-ui, -apple-system, sans-serif;
  color: var(--muted);
  white-space: nowrap;
  margin-left: 4px;
}

.card-note {
  display: block;
  margin-top: 5px;
  font: 12.5px/1.34 system-ui, -apple-system, sans-serif;
  color: #4A4238;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: var(--ink);
  font: 700 13.5px/1 system-ui, -apple-system, sans-serif;
  cursor: pointer;
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FFFFFF;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.step-count {
  font: 600 12px system-ui, -apple-system, sans-serif;
  color: var(--muted);
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (max-width: 395px) {
  .card-area {
    padding: 6px 10px 8px;
  }
  .verse-card-content {
    padding: 8px 11px;
  }
  .card-heading {
    font-size: 14.5px;
  }
  .card-verse {
    font-size: 13px;
  }
}

@media (forced-colors: active) {
  .step-dot-fill {
    border-color: ButtonText;
    background: Canvas;
  }
  .step-dot.active .step-dot-fill {
    background: Highlight;
    border-color: Highlight;
  }
  .nav-btn.primary {
    border: 2px solid Highlight;
  }
}
</style>
</head>

  function el(tag, attrs, text) {
    var node = document.createElement(tag);

    }
    if (text !== undefined) node.textContent = text;
    return node;
  }

    }, 'Highs'));
    guides.appendChild(svgEl('text', {
      'class': 'axis-tag', x: '29', y: '160'
    }, 'Lows'));
    svg.appendChild(guides);

    // 2. Faint blueprint ghost of the curve (visible at Ready step)
    svg.appendChild(svgEl('path', {
      'class': 'curve-ghost',
      d: CURVE_D,
      'aria-hidden': 'true'
    }));

    // 3. Luminous translucent washes clipped above/below horizon and revealed left-to-right
    var washGroup = svgEl('g', { 'clip-path': 'url(#pv-clip-reveal)', 'aria-hidden': 'true' });

    var aboveWrap = svgEl('g', { 'clip-path': 'url(#pv-clip-above)' });
    aboveWrap.appendChild(svgEl('path', {
      d: AREA_D,
      fill: 'url(#pv-peak-wash)',
      opacity: '0.82'
    }));
    washGroup.appendChild(aboveWrap);

    var belowWrap = svgEl('g', { 'clip-path': 'url(#pv-clip-below)' });
    belowWrap.appendChild(svgEl('path', {
      d: AREA_D,
      fill: COLORS.plumWash,
      opacity: '0.82'
    }));
    washGroup.appendChild(belowWrap);

    svg.appendChild(washGroup);

    // 4. Climax golden ribbon sits behind the main curve at Step 5
    var curveClimax = svgEl('path', {
      'class': 'curve-climax',
      d: CURVE_D,
      'aria-hidden': 'true'
    });
    svg.appendChild(curveClimax);

    // 5. Main timeline curve (drawn smoothly via stroke-dashoffset)
    var curveMain = svgEl('path', {
      'class': 'curve-main',
      d: CURVE_D
    });
    svg.appendChild(curveMain);

    var starHalo = svgEl('g', { 'class': 'star-halo', 'aria-hidden': 'true' });
    var starOuterContour = svgEl('circle', {
      'class': 'climax-contour',
      cx: '178', cy: '134', r: '18',
      'stroke-width': '2.4'
    });
    var starInnerContour = svgEl('circle', {
      'class': 'climax-contour',
      cx: '178', cy: '134', r: '14.5',
      'stroke-width': '1',
      opacity: '0.45'
    });
    starHalo.appendChild(starInnerContour);
    starHalo.appendChild(starOuterContour);
    svg.appendChild(starHalo);

    // Delicate double-chevron forward watermarks at the Today rising tip
    var todayChevrons = svgEl('g', {
      'class': 'today-chevrons',
      transform: 'translate(406, 72) rotate(-66)',
      'aria-hidden': 'true'
    });
    todayChevrons.appendChild(svgEl('path', {
      d: 'M -1 -5 L 6 0 L -1 5',
      fill: 'none', stroke: COLORS.blue, 'stroke-width': '2.6',
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: '0.88'
    }));
    todayChevrons.appendChild(svgEl('path', {
      d: 'M -8 -4.5 L -2 0 L -8 4.5',
      fill: 'none', stroke: COLORS.blue, 'stroke-width': '2',
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: '0.35'
    }));
    svg.appendChild(todayChevrons);

    // 6. Climax studio caption badge anchored cleanly below horizon at Step 5
    var climaxBadge = svgEl('g', { 'class': 'climax-badge', 'aria-hidden': 'true' });
    climaxBadge.appendChild(svgEl('rect', {
      x: '122', y: '250', width: '196', height: '21', rx: '10.5',
      fill: COLORS.goldWash, stroke: COLORS.crimson, 'stroke-width': '1.2'
    }));
    climaxBadge.appendChild(svgEl('text', {
      x: '220', y: '264', 'text-anchor': 'middle',
      fill: COLORS.crimsonDark,
      style: 'font: 700 10.5px/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.25px;'
    }, 'God\'s hand across every season'));
    svg.appendChild(climaxBadge);

    // 7. Interactive peak, valley, and star nodes
    var nodeRefs = NODES.map(function (spec) {
      var g = svgEl('g', {
        'class': 'node-group',
        'data-node': spec.id,
        role: 'button',
        tabindex: '-1',
        'aria-label': spec.heading,
        'aria-pressed': 'false',
        'aria-hidden': 'true'
      });

      // Invisible generous touch hit area
      g.appendChild(svgEl('circle', {
        cx: String(spec.x), cy: String(spec.y), r: '18',
        fill: 'transparent'
      }));

      // Selection ring
      g.appendChild(svgEl('circle', {
        'class': 'node-focus-ring',
        cx: String(spec.x), cy: String(spec.y),
        r: spec.type === 'star' ? '15.5' : '9.5',
        fill: 'none', stroke: COLORS.ink, 'stroke-width': '2'
      }));

      if (spec.type === 'star') {
        g.appendChild(svgEl('circle', {
          cx: String(spec.x), cy: String(spec.y), r: '12',
          fill: COLORS.goldWash, stroke: COLORS.gold, 'stroke-width': '1.2', opacity: '0.85'
        }));
        g.appendChild(svgEl('path', {
          d: starPath(spec.x, spec.y, 9.5, 4.3),
          fill: COLORS.gold, stroke: COLORS.goldDark, 'stroke-width': '1.2', 'stroke-linejoin': 'round'
        }));

        // Crisp pill badge tucked inside the open arch right of the star
        g.appendChild(svgEl('rect', {
          x: '190', y: '119', width: '53', height: '27', rx: '7',
          fill: COLORS.goldWash, stroke: COLORS.gold, 'stroke-width': '1.2'
        }));
        g.appendChild(svgEl('text', {
          'class': 'star-age', x: '216.5', y: '130', 'text-anchor': 'middle'
        }, '17 · ★'));
        g.appendChild(svgEl('text', {
          'class': 'star-label', x: '216.5', y: '142', 'text-anchor': 'middle'
        }, 'Christ!'));
      } else {
        if (spec.type !== 'today') {
          g.appendChild(svgEl('circle', {
            cx: String(spec.x), cy: String(spec.y), r: '5.2',
            fill: '#FFFFFF', stroke: spec.color, 'stroke-width': '2.4'
          }));
        }

        // Subtle connector tick from point toward its label
        var tickY1 = spec.type === 'valley' ? spec.y + 7 : spec.y - 7;
        var tickY2 = spec.type === 'valley' ? spec.y + 13 : spec.y - 13;
        if (spec.type === 'today') {
          tickY1 = spec.y - 10;
          tickY2 = spec.y - 16;
        }
        g.appendChild(svgEl('line', {
          x1: String(spec.x), y1: String(tickY1),
          x2: String(spec.x), y2: String(tickY2),
          stroke: spec.color, 'stroke-width': '1.2', opacity: '0.45'
        }));

        g.appendChild(svgEl('text', {
          'class': 'node-age',
          x: String(spec.labelX),
          y: String(spec.labelY),
          'text-anchor': spec.anchor,
          fill: spec.color
        }, spec.age));
        g.appendChild(svgEl('text', {
          'class': 'node-label',
          x: String(spec.labelX),
          y: String(spec.labelY + 13),
          'text-anchor': spec.anchor
        }, spec.shortLine));
      }

      svg.appendChild(g);
      return { spec: spec, el: g };
    });

    return {
      svg: svg,
      svgDesc: svgDesc,
      revealRect: revealRect,
      curveMain: curveMain,
      curveClimax: curveClimax,
      starHalo: starHalo,
      starContours: [starOuterContour, starInnerContour],
      todayChevrons: todayChevrons,
      climaxBadge: climaxBadge,
      nodes: nodeRefs
    };
  }

  function findLengthForX(pathNode, targetX, totalLen) {
    if (targetX <= GEO.startX) return 0;
    if (targetX >= GEO.endX) return totalLen;
    var lo = 0;
    var hi = totalLen;
    for (var i = 0; i < 18; i++) {
      var mid = (lo + hi) / 2;
      var pt = pathNode.getPointAtLength(mid);
      if (pt.x < targetX) lo = mid;
      else hi = mid;
    }
    return (lo + hi) / 2;
  }

  function init() {
    var host = document.getElementById('widget');
    if (!host) return;
    host.innerHTML = '';

    var header = el('header', { 'class': 'title-bar' });
    header.appendChild(el('h1', null, 'Peaks and Valleys'));
    header.appendChild(el('span', { 'class': 'course-tag' }, 'Course 101'));
    host.appendChild(header);

    var stage = el('div', { 'class': 'stage', id: 'stage' });
    var bundle = buildSvg();
    stage.appendChild(bundle.svg);
    host.appendChild(stage);

    var strip = el('div', { 'class': 'step-strip', id: 'step-strip', role: 'group', 'aria-label': 'Timeline steps' });
    var dotButtons = STEPS.map(function (st, idx) {
      var btn = el('button', {
        'class': 'step-dot',
        type: 'button',
        'data-step': String(idx),
        'aria-label': st.pillLabel,
        'aria-pressed': 'false'
      });
      btn.style.setProperty('--dot-color', st.accent);
      btn.appendChild(el('span', { 'class': 'step-dot-fill', 'aria-hidden': 'true' }));
      btn.addEventListener('click', function () { goTo(idx); });
      strip.appendChild(btn);
      return btn;
    });
    host.appendChild(strip);

    var cardArea = el('section', { 'class': 'card-area', id: 'card-area', 'aria-live': 'polite' });
    var verseCard = el('div', { 'class': 'verse-card' });
    verseCard.appendChild(el('div', { 'class': 'verse-card-bar', 'aria-hidden': 'true' }));
    var contentEl = el('div', { 'class': 'verse-card-content', id: 'card-content' });
    var headingEl = el('h2', { 'class': 'card-heading', id: 'card-heading' });
    var verseWrap = el('p', { 'class': 'card-verse', id: 'card-verse' });
    var verseTextNode = el('span', { id: 'card-verse-text' });
    var refEl = el('span', { 'class': 'verse-ref', id: 'card-ref' });
    verseWrap.appendChild(verseTextNode);
    verseWrap.appendChild(refEl);
    var noteEl = el('span', { 'class': 'card-note', id: 'card-note' });
    contentEl.appendChild(headingEl);
    contentEl.appendChild(verseWrap);
    contentEl.appendChild(noteEl);
    verseCard.appendChild(contentEl);
    cardArea.appendChild(verseCard);

    var navBar = el('div', { 'class': 'nav-bar' });
    var prevBtn = el('button', { 'class': 'nav-btn', id: 'prev-btn', type: 'button' }, '\u2190 Back');
    var countEl = el('span', { 'class': 'step-count', id: 'step-count' });
    var nextBtn = el('button', { 'class': 'nav-btn primary', id: 'next-btn', type: 'button' }, 'Begin \u2192');
    navBar.appendChild(prevBtn);
    navBar.appendChild(countEl);
    navBar.appendChild(nextBtn);
    cardArea.appendChild(navBar);
    host.appendChild(cardArea);

    var totalLen = bundle.curveMain.getTotalLength();
    bundle.curveMain.style.strokeDasharray = String(totalLen + 4);
    bundle.curveMain.style.strokeDashoffset = String(totalLen + 4);

    bundle.curveClimax.style.strokeDasharray = String(totalLen + 4);
    bundle.curveClimax.style.strokeDashoffset = String(totalLen + 4);

    bundle.starContours.forEach(function (c) {
      var len = Math.ceil(c.getTotalLength()) + 4;
      c.dataset.len = String(len);
      c.style.strokeDasharray = String(len);
      c.style.strokeDashoffset = String(len);
    });

    var stepCurveLens = STEPS.map(function (st) {
      return findLengthForX(bundle.curveMain, st.xTarget, totalLen);
    });

    var reducedMotionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
    var currentStep = 0;
    var selectedNodeId = null;
    var activeRaf = null;
    var CURVE_PX_PER_SEC = 185;
    var CLIMAX_PX_PER_SEC = 280;

    function stopActiveAnim() {
      if (activeRaf) {
        cancelAnimationFrame(activeRaf);
        activeRaf = null;
      }
    }

    function applyRevealAtLength(lenVal) {
      var offset = Math.max(0, (totalLen + 4) - lenVal);
      bundle.curveMain.style.strokeDashoffset = String(offset);
      var revealW = lenVal <= 1 ? 0 : (lenVal >= totalLen - 1 ? GEO.W : bundle.curveMain.getPointAtLength(lenVal).x);
      bundle.revealRect.setAttribute('width', String(revealW));
    }

    function updateNodes(visibleUpToStep, animate) {
      bundle.nodes.forEach(function (ref) {
        var isVisible = ref.spec.stepIdx <= visibleUpToStep;
        ref.el.style.setProperty('--fade-delay', animate && ref.spec.stepIdx === visibleUpToStep ? '220ms' : '0ms');
        ref.el.classList.toggle('is-visible', isVisible);
        ref.el.classList.toggle('is-selected', ref.spec.id === selectedNodeId);
        ref.el.classList.toggle('is-ghost', !!selectedNodeId && ref.spec.id !== selectedNodeId);
        ref.el.setAttribute('tabindex', isVisible ? '0' : '-1');
        ref.el.setAttribute('aria-hidden', isVisible ? 'false' : 'true');
        ref.el.setAttribute('aria-pressed', ref.spec.id === selectedNodeId ? 'true' : 'false');
      });
    }

    function applyClimaxInstant(isOn) {
      bundle.curveClimax.classList.toggle('is-visible', isOn);
      bundle.curveClimax.style.strokeDashoffset = isOn ? '0' : String(totalLen + 4);
      bundle.starHalo.classList.toggle('is-visible', isOn);
      bundle.starContours.forEach(function (c) {
        c.style.strokeDashoffset = isOn ? '0' : c.dataset.len;
      });
      bundle.climaxBadge.classList.toggle('is-visible', isOn);
    }

    function applyCardContent(title, verse, refText, noteText, accent, accentDark) {
      document.documentElement.style.setProperty('--step-color', accent);
      document.documentElement.style.setProperty('--step-dark', accentDark);
      headingEl.textContent = title;
      verseTextNode.textContent = verse;
      refEl.textContent = refText;
      refEl.style.display = refText ? '' : 'none';
      noteEl.textContent = noteText;
    }

    function selectNode(nodeRef) {
      if (!nodeRef || nodeRef.spec.stepIdx > STEPS[currentStep].visibleUpToStep) return;
      selectedNodeId = selectedNodeId === nodeRef.spec.id ? null : nodeRef.spec.id;
      updateNodes(STEPS[currentStep].visibleUpToStep, false);
      if (selectedNodeId) {
        var sp = nodeRef.spec;
        applyCardContent(sp.heading, sp.verse, sp.ref, sp.note, sp.color, sp.color);
      } else {
        var st = STEPS[currentStep];
        applyCardContent(st.heading, st.verse, st.ref, st.note, st.accent, st.accentDark);
      }
    }

    bundle.nodes.forEach(function (ref) {
      ref.el.addEventListener('click', function () {
        selectNode(ref);
      });
      ref.el.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          selectNode(ref);
        }
      });
    });

    function goTo(nextIdx) {
      stopActiveAnim();
      selectedNodeId = null;
      var prevStepIdx = currentStep;
      var nextStep = STEPS[nextIdx];
      var goingForward = nextIdx > prevStepIdx;
      var instant = reducedMotionQuery.matches || !goingForward || nextIdx === 0;

      var startLen = stepCurveLens[prevStepIdx];
      var targetLen = stepCurveLens[nextIdx];

      if (instant) {
        host.dataset.stepDur = '0';
        host.classList.add('is-instant');
        applyRevealAtLength(targetLen);
        bundle.todayChevrons.classList.toggle('is-visible', nextStep.visibleUpToStep >= 4);
        applyClimaxInstant(nextStep.climax);
        updateNodes(nextStep.visibleUpToStep, false);
      } else {
        host.classList.remove('is-instant');
        applyRevealAtLength(startLen);
        bundle.todayChevrons.style.setProperty('--fade-delay', '360ms');
        bundle.todayChevrons.classList.toggle('is-visible', nextStep.visibleUpToStep >= 4);
        updateNodes(nextStep.visibleUpToStep, true);

        var curveDur = targetLen > startLen ? ((targetLen - startLen) / CURVE_PX_PER_SEC) * 1000 : 0;
        var climaxDur = (!STEPS[prevStepIdx].climax && nextStep.climax)
          ? Math.max((totalLen / CLIMAX_PX_PER_SEC) * 1000, 650)
          : 0;
        var totalDur = Math.max(curveDur, climaxDur);
        host.dataset.stepDur = String(Math.round(totalDur));

        if (!nextStep.climax) {
          applyClimaxInstant(false);
        } else if (climaxDur > 0) {
          bundle.curveClimax.classList.add('is-visible');
          bundle.starHalo.classList.add('is-visible');
          bundle.climaxBadge.style.setProperty('--fade-delay', '420ms');
          bundle.climaxBadge.classList.add('is-visible');
        }

        if (totalDur > 0) {
          var t0 = performance.now();
          var frame = function (now) {
            var elapsed = now - t0;
            if (curveDur > 0) {
              var cp = Math.min(1, elapsed / curveDur);
              var eased = 1 - Math.pow(1 - cp, 2);
              applyRevealAtLength(startLen + (targetLen - startLen) * eased);
            }
            if (climaxDur > 0) {
              var xp = Math.min(1, elapsed / climaxDur);
              bundle.curveClimax.style.strokeDashoffset = String((totalLen + 4) * (1 - xp));
              bundle.starContours.forEach(function (c) {
                var clen = Number(c.dataset.len);
                c.style.strokeDashoffset = String(clen * (1 - Math.min(1, xp * 1.45)));
              });
            }
            if (elapsed < totalDur) {
              activeRaf = requestAnimationFrame(frame);
            } else {
              applyRevealAtLength(targetLen);
              if (nextStep.climax) applyClimaxInstant(true);
              activeRaf = null;
            }
          };
          activeRaf = requestAnimationFrame(frame);
        }
      }

      currentStep = nextIdx;
      bundle.svgDesc.textContent = nextStep.desc;
      applyCardContent(nextStep.heading, nextStep.verse, nextStep.ref, nextStep.note, nextStep.accent, nextStep.accentDark);

      dotButtons.forEach(function (btn, idx) {
        btn.classList.toggle('active', idx === currentStep);
        btn.classList.toggle('passed', idx > 0 && idx < currentStep);
        btn.setAttribute('aria-pressed', idx === currentStep ? 'true' : 'false');
      });

      countEl.textContent = currentStep === 0 ? 'Ready' : ('Step ' + currentStep + ' of ' + (STEPS.length - 1));
      prevBtn.disabled = currentStep === 0;
      nextBtn.textContent = currentStep === 0 ? 'Begin \u2192' : (currentStep === STEPS.length - 1 ? '\u21BB Start Over' : 'Next \u2192');
    }

    prevBtn.addEventListener('click', function () {
      if (currentStep > 0) goTo(currentStep - 1);
    });
    nextBtn.addEventListener('click', function () {
      goTo(currentStep === STEPS.length - 1 ? 0 : currentStep + 1);
    });

    var lastWidth = window.innerWidth;
    var measuredWidth = 0;
    function fitCardHeight() {
      if (!contentEl || contentEl.clientWidth === measuredWidth) return;
      measuredWidth = contentEl.clientWidth;
      var keepH = headingEl.textContent;
      var keepV = verseTextNode.textContent;
      var keepR = refEl.textContent;
      var keepN = noteEl.textContent;
      var keepRDisp = refEl.style.display;
      var tallest = 0;
      document.documentElement.style.setProperty('--card-h', '0px');
      STEPS.forEach(function (st) {
        headingEl.textContent = st.heading;
        verseTextNode.textContent = st.verse;
        refEl.textContent = st.ref;
        refEl.style.display = st.ref ? '' : 'none';
        noteEl.textContent = st.note;
        tallest = Math.max(tallest, contentEl.offsetHeight);
      });
      NODES.forEach(function (sp) {
        headingEl.textContent = sp.heading;
        verseTextNode.textContent = sp.verse;
        refEl.textContent = sp.ref;
        refEl.style.display = sp.ref ? '' : 'none';
        noteEl.textContent = sp.note;
        tallest = Math.max(tallest, contentEl.offsetHeight);
      });
      headingEl.textContent = keepH;
      verseTextNode.textContent = keepV;
      refEl.textContent = keepR;
      refEl.style.display = keepRDisp;
      noteEl.textContent = keepN;
      document.documentElement.style.setProperty('--card-h', Math.max(112, tallest) + 'px');
    }

    var resizeTimer = null;
    window.addEventListener('resize', function () {
      if (window.innerWidth === lastWidth) return;
      lastWidth = window.innerWidth;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(fitCardHeight, 120);
    });

    goTo(0);
    fitCardHeight();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
