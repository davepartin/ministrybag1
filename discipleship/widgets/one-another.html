<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Another</title>
<style>
    :root {
        --ink: #2C2416;
        --muted: #6E6559;
        --linen: #F8F6F1;
        --tray: #F6F4EE;
        --border: #EBE5D9;
        --stage: #FFFFFF;

        --harbour: #2A5B7C;
        --harbour-dark: #1E435C;
        --harbour-wash: #E2EEF6;

        --gold: #A8760A;
        --gold-dark: #7D5604;
        --gold-wash: #FCF2D6;

        --crimson: #8B1A2B;
        --crimson-dark: #6D1422;
        --crimson-wash: #F8E8EC;

        --speed-flow: 0.55s;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: var(--linen);
        color: var(--ink);
        overflow-x: hidden;
    }

    .widget-outer {
        background: var(--stage);
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
        overflow: hidden;
    }

    @media (min-width: 560px) {
        body { padding: 14px; }
        .widget-outer {
            max-width: 460px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
        }
    }

    /* Studio Wash Header */
    .title-bar {
        background: var(--ink);
        padding: 10px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }

    .title-bar h1 {
        font: 600 17px/1.15 system-ui, -apple-system, sans-serif;
        color: #FAF8F3;
        letter-spacing: 0.2px;
        margin: 0;
        text-align: left;
    }

    .course-tag {
        font: 600 11px/1 system-ui, -apple-system, sans-serif;
        letter-spacing: 0.9px;
        text-transform: uppercase;
        color: #E5DEC9;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .inner { padding: 10px 10px 12px; }

    /* Anchor strip */
    .anchor {
        text-align: center;
        padding: 7px 10px;
        border-radius: 8px;
        background: var(--harbour-wash);
        border: 1px solid #C8DCE9;
        font-size: 12px;
        line-height: 1.35;
        color: var(--harbour-dark);
        margin-bottom: 8px;
    }

    .anchor strong {
        font-weight: 700;
        color: var(--harbour-dark);
    }

    /* Whiteboard Diagram: Christ First -> Family Table Loop */
    .diagram-box {
        background: var(--tray);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px;
        margin-bottom: 9px;
    }

    .table-svg {
        width: 100%;
        height: 122px;
        display: block;
    }

    .flow-arrow {
        stroke-dasharray: 120;
        stroke-dashoffset: 0;
        transition: stroke-dashoffset var(--speed-flow) ease-out, stroke 0.2s ease;
    }

    .table-seat {
        transition: r 0.18s ease, fill 0.18s ease, stroke 0.18s ease;
    }

    /* 8-Action Grid */
    .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        margin-bottom: 9px;
    }

    .ocard {
        appearance: none;
        font-family: inherit;
        background: var(--stage);
        border: 1.5px solid var(--border);
        border-radius: 8px;
        padding: 7px 4px;
        min-height: 44px;
        font-size: 11px;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.2;
        text-align: center;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }

    .ocard:hover {
        border-color: var(--harbour);
        background: #F4F9FC;
    }

    .ocard.active {
        border: 2px solid var(--harbour);
        background: var(--harbour-wash);
        color: var(--harbour-dark);
        font-weight: 700;
    }

    .ocard.picked {
        border-color: var(--gold);
        box-shadow: inset 0 0 0 1px var(--gold);
    }

    .ocard.picked.active {
        border-color: var(--crimson);
        box-shadow: inset 0 0 0 1px var(--crimson);
        color: var(--crimson-dark);
        background: var(--crimson-wash);
    }

    .ocard .check {
        color: var(--gold-dark);
        font-weight: 800;
        font-size: 11px;
    }

    .ocard.picked.active .check {
        color: var(--crimson-dark);
    }

    .ocard:focus-visible, .btn:focus-visible {
        outline: 2.5px solid var(--ink);
        outline-offset: 2px;
    }

    /* Teaching Study Card */
    .card-area {
        min-height: var(--card-h, 198px);
        display: flex;
        flex-direction: column;
    }

    .card {
        flex: 1;
        border: 1px solid var(--border);
        border-top: 4px solid var(--harbour);
        border-radius: 10px;
        background: var(--stage);
        padding: 11px 12px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .card.picked-card {
        border-top-color: var(--crimson);
    }

    .card.empty {
        justify-content: center;
        text-align: center;
        background: var(--tray);
        border-top-color: var(--gold);
        color: var(--muted);
        padding: 16px;
        font-size: 13.5px;
        line-height: 1.5;
    }

    .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }

    .card-title {
        font-size: 15.5px;
        font-weight: 700;
        color: var(--ink);
        line-height: 1.25;
    }

    .card-verse {
        font-size: 13px;
        color: var(--ink);
        line-height: 1.45;
        background: var(--tray);
        padding: 8px 10px;
        border-radius: 7px;
        border-left: 3px solid var(--harbour);
    }

    .card-ref {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        margin-left: 4px;
        white-space: nowrap;
    }

    .band {
        padding: 7px 10px;
        border-radius: 7px;
        font-size: 12.5px;
        line-height: 1.4;
    }

    .band-first {
        background: var(--gold-wash);
        color: var(--ink);
        border-left: 3px solid var(--gold);
    }

    .band-try {
        background: var(--harbour-wash);
        color: var(--ink);
        border-left: 3px solid var(--harbour);
    }

    .band-tag {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.45px;
        text-transform: uppercase;
        display: block;
        margin-bottom: 1px;
    }

    .band-first .band-tag { color: var(--gold-dark); }
    .band-try .band-tag { color: var(--harbour-dark); }

    .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-top: 4px;
        margin-top: auto;
    }

    .btn {
        appearance: none;
        font-family: inherit;
        min-height: 36px;
        border: 1.5px solid var(--border);
        background: var(--stage);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        cursor: pointer;
        transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn:hover {
        background: var(--tray);
        border-color: #CFC6B4;
    }

    .btn-pick {
        background: var(--harbour);
        border-color: var(--harbour);
        color: #FAF8F3;
    }

    .btn-pick:hover {
        background: var(--harbour-dark);
        border-color: var(--harbour-dark);
    }

    .btn-pick.picked {
        background: var(--crimson);
        border-color: var(--crimson);
        color: #FAF8F3;
    }

    .btn-pick.picked:hover {
        background: var(--crimson-dark);
        border-color: var(--crimson-dark);
    }

    .pick-status {
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
    }

    .pick-status.has-pick {
        color: var(--crimson-dark);
    }

    @media (max-width: 390px) {
        .ocard { font-size: 10.5px; padding: 6px 3px; }
        .table-svg { height: 116px; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            transition: none !important;
            animation: none !important;
        }
    }
</style>
</head>
<body>
<div class="widget-outer" id="widget-outer">
    <header class="title-bar">
        <h1>One Another</h1>
        <span class="course-tag">202-03</span>
    </header>

    <div class="inner">
        <div class="anchor">
            <strong>&ldquo;Love one another, just as I have loved you.&rdquo;</strong> John 13:34
        </div>

        <div class="diagram-box" aria-hidden="true">
            <svg class="table-svg" id="table-svg" viewBox="0 0 440 132" preserveAspectRatio="xMidYMid meet">
                <!-- Christ First hub on left -->
                <circle cx="62" cy="60" r="34" fill="#FCF2D6" stroke="#A8760A" stroke-width="1.4" />
                <!-- Deep Crimson double-hairline cross -->
                <path d="M 62 38 L 62 82 M 46 54 L 78 54" fill="none" stroke="#8B1A2B" stroke-width="3.5" stroke-linecap="round" />
                <path d="M 62 38 L 62 82 M 46 54 L 78 54" fill="none" stroke="#C9596B" stroke-width="1.1" stroke-linecap="round" />
                <text x="62" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.6" fill="#7D5604">CHRIST FIRST</text>

                <!-- Flow arrow from Cross -> Family Table -->
                <path class="flow-arrow" id="source-arrow" d="M 101 60 L 147 60" fill="none" stroke="#A8760A" stroke-width="2.4" stroke-linecap="round" />
                <polygon points="142,54 152,60 142,66" fill="#A8760A" />
                <text x="126" y="49" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#7D5604">AS HE LOVED</text>

                <!-- Family Table loop on right -->
                <ellipse cx="292" cy="62" rx="124" ry="42" fill="#FFFFFF" stroke="#2A5B7C" stroke-width="1.8" stroke-dasharray="6 4" />
                <ellipse cx="292" cy="62" rx="92" ry="26" fill="#E2EEF6" opacity="0.55" />

                <!-- Clockwise directional arrowheads on the loop -->
                <polygon points="290,16 298,20 290,24" fill="#2A5B7C" />
                <polygon points="294,100 286,104 294,108" fill="#2A5B7C" />

                <!-- Center focal label inside the table -->
                <text id="diagram-focus-label" x="292" y="59" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1E435C">ONE ANOTHER</text>
                <text id="diagram-focus-sub" x="292" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#6E6559">TAP AN ACTION</text>

                <!-- 8 Seat Dots around the Family Table -->
                <g id="seat-dots"></g>
            </svg>
        </div>

        <div class="grid" id="grid" role="group" aria-label="One-another commands"></div>
        <div class="card-area" id="card-area" aria-live="polite"></div>
    </div>
</div>

<script>
(function () {
    'use strict';

    var cards = [
        { name: 'Welcome', title: 'Welcome one another', verse: '\u201cwelcome one another as Christ has welcomed you\u201d', ref: 'Romans 15:7',
          first: 'Christ welcomed you when you were far off.', tryit: 'Sit by someone new on Sunday and learn their name.' },
        { name: 'Carry burdens', title: 'Bear one another\u2019s burdens', verse: '\u201cBear one another\u2019s burdens, and so fulfill the law of Christ.\u201d', ref: 'Galatians 6:2',
          first: 'Jesus carried your heaviest burden, your sin.', tryit: 'Ask someone what is heavy right now, and help carry it.' },
        { name: 'Forgive', title: 'Forgive one another', verse: '\u201cforgiving one another, as God in Christ forgave you\u201d', ref: 'Ephesians 4:32',
          first: 'God in Christ forgave you everything.', tryit: 'Let go of one grudge, or ask forgiveness for one thing.' },
        { name: 'Encourage', title: 'Encourage one another', verse: '\u201cencourage one another and build one another up\u201d', ref: '1 Thessalonians 5:11',
          first: 'Jesus speaks courage over you in His Word.', tryit: 'Send one specific note of thanks or encouragement.' },
        { name: 'Pray for', title: 'Pray for one another', verse: '\u201cpray for one another, that you may be healed\u201d', ref: 'James 5:16',
          first: 'Jesus is praying for you right now (Romans 8:34).', tryit: 'Ask how to pray for someone, then pray with them.' },
        { name: 'Serve', title: 'Serve one another', verse: '\u201cthrough love serve one another\u201d', ref: 'Galatians 5:13',
          first: 'Jesus came not to be served but to serve (Mark 10:45).', tryit: 'Do one quiet act of service no one asked for.' },
        { name: 'Open your home', title: 'Show hospitality', verse: '\u201cShow hospitality to one another without grumbling.\u201d', ref: '1 Peter 4:9',
          first: 'Jesus is preparing a place for you (John 14:2).', tryit: 'Invite someone from church for a meal or coffee.' },
        { name: 'Honor', title: 'Honor one another', verse: '\u201cOutdo one another in showing honor.\u201d', ref: 'Romans 12:10',
          first: 'Jesus calls you His friend (John 15:15).', tryit: 'Tell someone what you see God doing in them.' }
    ];

    // 8 seat coordinates placed evenly around the Family Table ellipse (cx=292, cy=62, rx=124, ry=42)
    var seatCoords = [
        { x: 168, y: 62 },
        { x: 204, y: 32 },
        { x: 292, y: 20 },
        { x: 380, y: 32 },
        { x: 416, y: 62 },
        { x: 380, y: 92 },
        { x: 292, y: 104 },
        { x: 204, y: 92 }
    ];

    var outer = document.getElementById('widget-outer');
    var grid = document.getElementById('grid');
    var area = document.getElementById('card-area');
    var seatDotsEl = document.getElementById('seat-dots');
    var focusLabelEl = document.getElementById('diagram-focus-label');
    var focusSubEl = document.getElementById('diagram-focus-sub');
    var sourceArrowEl = document.getElementById('source-arrow');

    var active = -1;
    var picked = -1;

    function isReducedMotion() {
        return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function buildGrid() {
        grid.innerHTML = cards.map(function (c, i) {
            return '<button type="button" class="ocard" data-card="' + i + '">' + esc(c.name) + '</button>';
        }).join('');

        grid.querySelectorAll('.ocard').forEach(function (b) {
            b.addEventListener('click', function () {
                selectCard(Number(b.dataset.card));
            });
        });
    }

    function buildSeats() {
        var ns = 'http://www.w3.org/2000/svg';
        seatDotsEl.innerHTML = '';
        seatCoords.forEach(function (pt, idx) {
            var g = document.createElementNS(ns, 'g');
            g.setAttribute('data-seat', String(idx));

            var halo = document.createElementNS(ns, 'circle');
            halo.setAttribute('cx', String(pt.x));
            halo.setAttribute('cy', String(pt.y));
            halo.setAttribute('r', '10');
            halo.setAttribute('fill', 'none');
            halo.setAttribute('stroke', 'none');
            halo.setAttribute('stroke-width', '1.5');
            halo.setAttribute('class', 'seat-halo');

            var dot = document.createElementNS(ns, 'circle');
            dot.setAttribute('cx', String(pt.x));
            dot.setAttribute('cy', String(pt.y));
            dot.setAttribute('r', '6');
            dot.setAttribute('fill', '#FFFFFF');
            dot.setAttribute('stroke', '#2A5B7C');
            dot.setAttribute('stroke-width', '2');
            dot.setAttribute('class', 'table-seat');

            g.appendChild(halo);
            g.appendChild(dot);
            seatDotsEl.appendChild(g);
        });
    }

    function pulseSourceArrow() {
        if (!sourceArrowEl || isReducedMotion()) return;
        sourceArrowEl.style.transition = 'none';
        sourceArrowEl.style.strokeDashoffset = '50';
        void sourceArrowEl.getBoundingClientRect();
        sourceArrowEl.style.transition = 'stroke-dashoffset 0.52s ease-out';
        sourceArrowEl.style.strokeDashoffset = '0';
    }

    function selectCard(i) {
        active = (active === i) ? -1 : i;
        render(true);
    }

    function cardHtml(i, pk) {
        if (i < 0) {
            return '<div class="card empty">' +
                '<div class="card-title" style="margin-bottom:4px;">Christ Loves First. We Pass It Around.</div>' +
                'Tap any action above to see what Jesus did first, then choose one to practice this week.' +
            '</div>';
        }
        var c = cards[i];
        var isP = pk === i;
        var st = pk >= 0 && pk !== i ? 'Picked: ' + esc(cards[pk].name) : '';
        return '<div class="card' + (isP ? ' picked-card' : '') + '">' +
            '<div class="card-top">' +
                '<div class="card-title">' + esc(c.title) + '</div>' +
                '<span class="pick-status' + (isP ? ' has-pick' : '') + '">' + st + '</span>' +
            '</div>' +
            '<div class="card-verse">' + esc(c.verse) + '<span class="card-ref">' + esc(c.ref) + '</span></div>' +
            '<div class="band band-first"><span class="band-tag">Jesus First</span>' + esc(c.first) + '</div>' +
            '<div class="band band-try"><span class="band-tag">Try This Week</span>' + esc(c.tryit) + '</div>' +
            '<div class="actions">' +
                '<button type="button" class="btn" data-control="clear">&larr; Clear</button>' +
                '<button type="button" class="btn btn-pick' + (isP ? ' picked' : '') + '" data-control="' + (isP ? 'picked' : 'pick') + '">' +
                    (isP ? '&#10003; Picked for this week' : 'Pick one for this week') +
                '</button>' +
            '</div>' +
        '</div>';
    }

    function updateDiagram() {
        var groups = seatDotsEl.querySelectorAll('g');
        for (var i = 0; i < groups.length; i++) {
            var halo = groups[i].querySelector('.seat-halo');
            var dot = groups[i].querySelector('.table-seat');
            var isAct = i === active;
            var isPick = i === picked;

            if (isPick) {
                halo.setAttribute('stroke', '#8B1A2B');
                halo.setAttribute('stroke-width', '1.4');
                halo.setAttribute('fill', '#F8E8EC');
                dot.setAttribute('r', isAct ? '8' : '7');
                dot.setAttribute('fill', '#8B1A2B');
                dot.setAttribute('stroke', '#A8760A');
                dot.setAttribute('stroke-width', '2');
            } else if (isAct) {
                halo.setAttribute('stroke', '#A8760A');
                halo.setAttribute('stroke-width', '1.4');
                halo.setAttribute('fill', '#FCF2D6');
                dot.setAttribute('r', '7.5');
                dot.setAttribute('fill', '#2A5B7C');
                dot.setAttribute('stroke', '#1E435C');
                dot.setAttribute('stroke-width', '2');
            } else {
                halo.setAttribute('stroke', 'none');
                halo.setAttribute('fill', 'none');
                dot.setAttribute('r', '5.5');
                dot.setAttribute('fill', '#FFFFFF');
                dot.setAttribute('stroke', '#2A5B7C');
                dot.setAttribute('stroke-width', '2');
            }
        }

        if (active >= 0) {
            focusLabelEl.textContent = cards[active].name.toUpperCase();
            focusLabelEl.setAttribute('fill', active === picked ? '#6D1422' : '#1E435C');
            focusSubEl.textContent = active === picked ? 'PICKED FOR THIS WEEK' : 'FAMILY TABLE ACTION';
        } else if (picked >= 0) {
            focusLabelEl.textContent = 'ONE ANOTHER';
            focusLabelEl.setAttribute('fill', '#1E435C');
            focusSubEl.textContent = 'WEEKLY PICK: ' + cards[picked].name.toUpperCase();
        } else {
            focusLabelEl.textContent = 'ONE ANOTHER';
            focusLabelEl.setAttribute('fill', '#1E435C');
            focusSubEl.textContent = 'TAP AN ACTION';
        }
    }

    function render(animate) {
        grid.querySelectorAll('.ocard').forEach(function (b, idx) {
            var isA = idx === active;
            var isP = idx === picked;
            b.classList.toggle('active', isA);
            b.classList.toggle('picked', isP);
            b.setAttribute('aria-pressed', isA ? 'true' : 'false');
            b.innerHTML = (isP ? '<span class="check" aria-hidden="true">&#10003;</span>' : '') + esc(cards[idx].name);
        });

        updateDiagram();
        if (animate && active >= 0) pulseSourceArrow();

        area.innerHTML = cardHtml(active, picked);

        var clearBtn = area.querySelector('[data-control="clear"]');
        if (clearBtn) {
            clearBtn.addEventListener('click', function () {
                active = -1;
                render(false);
            });
        }

        var pickBtn = area.querySelector('.btn-pick');
        if (pickBtn) {
            pickBtn.addEventListener('click', function () {
                picked = (picked === active) ? -1 : active;
                render(false);
            });
        }
    }

    function fitCards() {
        var width = area.clientWidth || outer.clientWidth || 360;
        var probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden;pointer-events:none;width:' + width + 'px;display:flex;flex-direction:column;';
        document.body.appendChild(probe);

        var maxH = 0;
        probe.innerHTML = cardHtml(-1, -1);
        maxH = Math.max(maxH, Math.ceil(probe.getBoundingClientRect().height));

        for (var i = 0; i < cards.length; i++) {
            probe.innerHTML = cardHtml(i, i);
            maxH = Math.max(maxH, Math.ceil(probe.getBoundingClientRect().height));
        }

        probe.remove();
        outer.style.setProperty('--card-h', maxH + 'px');
    }

    buildGrid();
    buildSeats();
    fitCards();
    render(false);

    var rt = null;
    var lastWidth = window.innerWidth;
    // Refit only when width changes so host iframe measurements never start a loop.
    window.addEventListener('resize', function () {
        if (window.innerWidth === lastWidth) return;
        lastWidth = window.innerWidth;
        clearTimeout(rt);
        rt = setTimeout(fitCards, 150);
    });
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(fitCards);
    }
})();
</script>
</body>
</html>
