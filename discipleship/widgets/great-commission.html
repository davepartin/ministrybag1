<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Commission</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --ink: #2C2416;
  --muted: #6E6559;
  --tray: #F6F4EE;
  --border: #EBE5D9;
  --paper: #FFFFFF;

  --gold: #A8760A;
  --gold-dark: #7D5604;
  --gold-wash: #FCF2D6;

  --sage: #1F684A;
  --sage-dark: #164E37;
  --sage-wash: #E1F1E9;

  --blue: #2A5B7C;
  --blue-dark: #1E435C;
  --blue-wash: #E2EEF6;

  --plum: #5F4684;
  --plum-dark: #473366;
  --plum-wash: #EDE7F6;

  --crimson: #8B1A2B;
  --crimson-dark: #6D1422;

  --step-color: #A8760A;
  --step-dark: #7D5604;
  --card-h: 118px;
}

body {
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  margin: 0;
  padding: 0;
}

.widget-outer {
  background: var(--paper);
  width: 100%;
  max-width: 100%;
  margin: 0;
  overflow: hidden;
  border: none;
  border-radius: 0;
  box-shadow: none;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    max-width: 460px;
    margin: 0 auto;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
  }
}

.title-bar {
  background: var(--ink);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  margin: 0;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  background: var(--paper);
  padding: 6px 8px 4px;
  border-bottom: 1px solid var(--border);
}

#gc-svg {
  display: block;
  width: 100%;
  height: auto;
}

.svg-sans {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.ring-halo {
  paint-order: stroke;
  stroke: rgba(255, 255, 255, 0.9);
  stroke-width: 3.4px;
  stroke-linejoin: round;
}

/* Layered reveal controls (compositor-friendly opacity & transform only) */
.gc-layer {
  opacity: 0;
  pointer-events: none;
}

.gc-layer.is-on {
  opacity: 1;
}

.gc-scale {
  transform-box: fill-box;
  transform-origin: center;
  transform: scale(0.94);
}

.gc-scale.is-on {
  transform: scale(1);
}

.gc-wash-outer {
  opacity: 0.42;
}

.gc-wash-mid {
  opacity: 0.62;
}

.gc-wash-center {
  opacity: 0.94;
}

/* Step 6: soften translucent washes so the globe continents breathe cleanly beneath */
#gc-svg.is-globe .gc-wash-outer {
  opacity: 0.16;
}

#gc-svg.is-globe .gc-wash-mid {
  opacity: 0.4;
}

#gc-svg.is-globe .gc-wash-center {
  opacity: 0.88;
}

#gc-graticule {
  opacity: 0;
}

#gc-svg.is-horizon #gc-graticule {
  opacity: 0.24;
}

#gc-svg.is-globe #gc-graticule {
  opacity: 0.36;
}

#gc-continents {
  opacity: 0;
}

#gc-svg.is-globe #gc-continents {
  opacity: 1;
}

#gc-ocean {
  opacity: 0;
}

#gc-svg.is-globe #gc-ocean {
  opacity: 0.82;
}

#gc-globe-rim {
  opacity: 0;
}

#gc-svg.is-globe #gc-globe-rim {
  opacity: 1;
}

@media (prefers-reduced-motion: no-preference) {
  .gc-layer,
  .gc-wash-outer,
  .gc-wash-mid,
  .gc-wash-center,
  #gc-graticule,
  #gc-continents,
  #gc-ocean,
  #gc-globe-rim {
    transition: opacity 0.46s ease, transform 0.46s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .step-dot-fill {
    transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
  }
  .nav-btn.primary,
  .verse-card-bar,
  .card-heading {
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease;
  }
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 5px;
  background: var(--tray);
  border-bottom: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  min-width: 28px;
  min-height: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
}

.step-dot-fill {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2.4px solid var(--dot-color, var(--ink));
  background: var(--paper);
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 22%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.14);
}

.card-area {
  background: var(--tray);
  padding: 7px 12px 10px;
}

.verse-card {
  background: var(--paper);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(44, 36, 22, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 13px;
  min-height: var(--card-h, 118px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-heading {
  font: 700 15px/1.22 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 4px;
}

.card-verse {
  font: 13.5px/1.38 Georgia, Cambria, serif;
  color: #3D3426;
  margin: 0;
}

.card-verse.is-empty {
  display: none;
}

.verse-ref {
  font: 600 11.5px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  white-space: nowrap;
  margin-left: 5px;
}

.card-note {
  display: block;
  margin-top: 5px;
  font: 12.5px/1.36 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #4A4238;
}

.card-note.is-lead {
  margin-top: 0;
  font: 13.5px/1.38 Georgia, Cambria, serif;
  color: #3D3426;
}

.card-subnote {
  display: block;
  margin-top: 5px;
  font: 12.5px/1.36 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #4A4238;
}

.card-subnote.is-empty {
  display: none;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  appearance: none;
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: var(--paper);
  color: var(--ink);
  font: 700 13.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FFFFFF;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.step-count {
  font: 600 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  text-align: center;
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (max-width: 395px) {
  .card-area {
    padding: 6px 10px 8px;
  }
  .verse-card-content {
    padding: 8px 11px;
  }
  .card-heading {
    font-size: 14.5px;
  }
  .card-verse {
    font-size: 13px;
  }
  .nav-btn {
    min-width: 88px;
    padding: 10px 12px;
  }
}

.visually-hidden {
  position: absolute;
  clip-path: inset(50%);
  overflow: hidden;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  white-space: nowrap;
}
</style>
</head>

        <!-- Lower-right outward path (+32 deg) -->
        <line x1="294.6" y1="185.6" x2="317.6" y2="200.0" stroke="#5F4684" stroke-width="1.6" stroke-linecap="round" opacity="0.72"/>
        <polyline points="312.2,202.4 319.4,201.2 317.4,194.2" fill="none" stroke="#5F4684" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
        <polyline points="305.4,198.1 312.6,196.9 310.6,189.9" fill="none" stroke="#5F4684" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.32"/>
      </g>

      <!-- ===================== STEP 5: BEYOND FAMILIAR BOUNDARIES (Gentle Outer Ripples) ===================== -->
      <g id="gc-beyond-paths" class="gc-layer" aria-hidden="true">
        <!-- Soft ripple arcs echoing outward beyond the familiar boundary on left & right wings -->
        <path d="M 86 93 A 138 138 0 0 0 86 185" fill="none" stroke="#5F4684" stroke-width="1.35" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.58"/>
        <path d="M 354 93 A 138 138 0 0 1 354 185" fill="none" stroke="#5F4684" stroke-width="1.35" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.58"/>
        <path d="M 73 109 A 151 151 0 0 0 73 169" fill="none" stroke="#5F4684" stroke-width="1.05" stroke-dasharray="2 5" stroke-linecap="round" opacity="0.34"/>
        <path d="M 367 109 A 151 151 0 0 1 367 169" fill="none" stroke="#5F4684" stroke-width="1.05" stroke-dasharray="2 5" stroke-linecap="round" opacity="0.34"/>

        <!-- Clean horizontal outward reach chevrons crossing left and right edges -->
        <line x1="132" y1="139" x2="97" y2="139" stroke="#5F4684" stroke-width="1.5" stroke-linecap="round" opacity="0.72"/>
        <polyline points="102,134.5 96,139 102,143.5" fill="none" stroke="#5F4684" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.76"/>
        <line x1="308" y1="139" x2="343" y2="139" stroke="#5F4684" stroke-width="1.5" stroke-linecap="round" opacity="0.72"/>
        <polyline points="338,134.5 344,139 338,143.5" fill="none" stroke="#5F4684" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.76"/>
      </g>

      <!-- ===================== RING 2: HOME & CHURCH (202 GROWING UP) ===================== -->
      <g id="gc-mid-ring" class="gc-layer gc-scale">
        <circle cx="220" cy="139" r="88" fill="#E2EEF6" class="gc-wash-mid"/>
        <circle cx="220" cy="139" r="88" fill="none" stroke="#2A5B7C" stroke-width="1.7"/>
        <text class="svg-sans ring-halo" x="220" y="72.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1E435C">Home &amp; Church</text>
        <text class="svg-sans ring-halo" x="220" y="84.5" text-anchor="middle" font-size="9.2" font-weight="600" fill="#2A5B7C">202 · Growing Up</text>
      </g>

      <!-- ===================== RING 1: CENTER GOD (201 GROWING DEEP) ===================== -->
      <g id="gc-center-ring" class="gc-layer gc-scale is-on">
        <circle cx="220" cy="139" r="48" fill="url(#gc-gold-grad)" class="gc-wash-center"/>
        <circle cx="220" cy="139" r="48" fill="none" stroke="#A8760A" stroke-width="2"/>
        <circle cx="220" cy="139" r="44.5" fill="none" stroke="#C48F10" stroke-width="0.8" opacity="0.42"/>
        <text class="svg-sans" x="220" y="135" text-anchor="middle" font-size="17" font-weight="700" fill="#7D5604">God</text>
        <text class="svg-sans" x="220" y="150.5" text-anchor="middle" font-size="8.3" font-weight="600" fill="#6E4E0A">201 · Growing Deep</text>
      </g>

      <!-- ===================== STEP 4: COMPACT DISCIPLE-MAKING ACTION PILL ===================== -->
      <g id="gc-action-pill" class="gc-layer">
        <rect x="157" y="232" width="126" height="19" rx="9.5" fill="#FFFFFF" fill-opacity="0.95" stroke="#1F684A" stroke-width="1.3"/>
        <text class="svg-sans" x="220" y="245" text-anchor="middle" font-size="9.6" font-weight="700" fill="#164E37">Baptize · Teach to obey</text>
      </g>

      <!-- ===================== STEP 6: STUDIO WASH DOUBLE-HAIRLINE GLOBE CONTOUR ===================== -->
      <g id="gc-globe-rim" aria-hidden="true">
        <circle cx="220" cy="139" r="126" fill="none" stroke="#8B1A2B" stroke-width="2.6"/>
        <circle cx="220" cy="139" r="122.8" fill="none" stroke="#8B1A2B" stroke-width="0.95" opacity="0.45"/>
      </g>
    </svg>
  </div>

  <div class="step-strip" id="step-strip" role="group" aria-label="Great Commission steps"></div>

  <section class="card-area" aria-label="Teaching note and navigation">
    <div class="verse-card">
      <div class="verse-card-bar" id="card-bar"></div>
      <div class="verse-card-content" id="card-content">
        <h2 class="card-heading" id="card-heading"></h2>
        <p class="card-verse" id="card-verse"><span id="verse-text"></span><span class="verse-ref" id="verse-ref"></span></p>
        <p class="card-note" id="card-note"></p>
        <p class="card-subnote is-empty" id="card-subnote"></p>
      </div>
    </div>

    <div class="nav-bar">
      <button type="button" class="nav-btn" id="prev-btn">&larr; Back</button>
      <span class="step-count" id="step-count"></span>
      <button type="button" class="nav-btn primary" id="next-btn">Next &rarr;</button>
    </div>
  </section>

  <p class="visually-hidden" id="status" aria-live="polite"></p>
</main>

<script>
(function () {
  'use strict';

  var STEPS = [
    {
      dotLabel: 'Step 1: Loved First, Growing Deep',
      heading: '1. Loved First: Growing Deep',
      verse: '"All authority in heaven and on earth has been given to me."',
      ref: 'Matthew 28:18',
      note: 'Before Jesus sends you, remember who sends you. Your ministry begins with Him.',
      subnote: '',
      accent: '#A8760A',
      accentDark: '#7D5604',
      state: {
        mid: false,
        outer: false,
        paths: false,
        action: false,
        beyond: false,
        horizon: false,
        globe: false
      },
      desc: 'Central sunlit gold circle labeled God and 201 Growing Deep.'
    },
    {
      dotLabel: 'Step 2: Love Beside You, Growing Up',
      heading: '2. Love Beside You: Growing Up',
      verse: '',
      ref: '',
      note: 'The love you receive from God shapes how you love the people closest to you.',
      subnote: 'Growing Up stays rooted in Growing Deep. God works in your home and church as one connected journey.',
      accent: '#2A5B7C',
      accentDark: '#1E435C',
      state: {
        mid: true,
        outer: false,
        paths: false,
        action: false,
        beyond: false,
        horizon: false,
        globe: false
      },
      desc: 'Harbour blue Home and Church circle labeled 202 Growing Up expands around the golden God center.'
    },
    {
      dotLabel: 'Step 3: Go and Make Disciples, Growing Out',
      heading: '3. Go and Make Disciples: Growing Out',
      verse: '"Go therefore and make disciples of all nations"',
      ref: 'Matthew 28:19',
      note: 'Jesus sends ordinary people to help others know and follow Him. Begin with the people already in your life.',
      subnote: '',
      accent: '#5F4684',
      accentDark: '#473366',
      state: {
        mid: true,
        outer: true,
        paths: true,
        action: false,
        beyond: false,
        horizon: false,
        globe: false
      },
      desc: 'Royal plum outer circle labeled 203 Growing Out appears with gentle outward paths reaching beyond the familiar circle.'
    },
    {
      dotLabel: 'Step 4: Help Them Follow Jesus',
      heading: '4. Help Them Follow Jesus',
      verse: '"...baptizing them in the name of the Father and of the Son and of the Holy Spirit, teaching them to observe all that I have commanded you."',
      ref: 'Matthew 28:19-20',
      note: 'Making disciples includes welcoming people into an openly identified life with Jesus and helping them practice what He taught.',
      subnote: '',
      accent: '#1F684A',
      accentDark: '#164E37',
      state: {
        mid: true,
        outer: true,
        paths: true,
        action: true,
        beyond: false,
        horizon: false,
        globe: false
      },
      desc: 'Same concentric circles with a compact Baptize and Teach to obey label along the lower outward movement.'
    },
    {
      dotLabel: 'Step 5: Beyond Your Familiar Circle',
      heading: '5. Beyond Your Familiar Circle',
      verse: '"...you will be my witnesses in Jerusalem and in all Judea and Samaria, and to the end of the earth."',
      ref: 'Acts 1:8',
      note: 'Matthew 28 gives the Great Commission; Acts 1:8 describes Spirit-empowered witness spreading where you are, beyond your familiar people, and around the world.',
      subnote: '',
      accent: '#5F4684',
      accentDark: '#473366',
      state: {
        mid: true,
        outer: true,
        paths: true,
        action: true,
        beyond: true,
        horizon: true,
        globe: false
      },
      desc: 'Outward ripples reach past the familiar circle edge as faint globe lines begin to appear.'
    },
    {
      dotLabel: 'Step 6: All Nations. Never Alone.',
      heading: '6. All Nations. Never Alone.',
      verse: '"And behold, I am with you always, to the end of the age."',
      ref: 'Matthew 28:20',
      note: 'Love Has Names: The mission reaches all nations. Your next step begins with one person. Jesus is with you.',
      subnote: '',
      accent: '#8B1A2B',
      accentDark: '#6D1422',
      state: {
        mid: true,
        outer: true,
        paths: true,
        action: true,
        beyond: true,
        horizon: true,
        globe: true
      },
      desc: 'The outer circle reveals a calm globe showing Europe, Africa, and Asia behind all three circles, with God still at the center.'
    }
  ];

  var current = 0;

  var svgEl = document.getElementById('gc-svg');
  var svgDesc = document.getElementById('gc-svg-desc');
  var midRing = document.getElementById('gc-mid-ring');
  var outerRing = document.getElementById('gc-outer-ring');
  var outwardPaths = document.getElementById('gc-outward-paths');
  var beyondPaths = document.getElementById('gc-beyond-paths');
  var actionPill = document.getElementById('gc-action-pill');

  var stripEl = document.getElementById('step-strip');
  var cardContent = document.getElementById('card-content');
  var headingEl = document.getElementById('card-heading');
  var verseWrap = document.getElementById('card-verse');
  var verseText = document.getElementById('verse-text');
  var verseRef = document.getElementById('verse-ref');
  var noteEl = document.getElementById('card-note');
  var subnoteEl = document.getElementById('card-subnote');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  var countEl = document.getElementById('step-count');
  var statusEl = document.getElementById('status');

  var dots = [];
  STEPS.forEach(function (st, idx) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'step-dot';
    btn.setAttribute('data-step', String(idx));
    btn.style.setProperty('--dot-color', st.accent);
    btn.setAttribute('aria-label', st.dotLabel);
    btn.setAttribute('aria-pressed', 'false');

    var fill = document.createElement('span');
    fill.className = 'step-dot-fill';
    btn.appendChild(fill);

    btn.addEventListener('click', function () {
      goTo(idx, true);
    });

    stripEl.appendChild(btn);
    dots.push(btn);
  });

  function applyCard(st) {
    headingEl.textContent = st.heading;
    if (st.verse) {
      verseWrap.classList.remove('is-empty');
      verseText.textContent = st.verse;
      verseRef.textContent = st.ref ? (' ' + st.ref) : '';
      noteEl.className = 'card-note';
    } else {
      verseWrap.classList.add('is-empty');
      verseText.textContent = '';
      verseRef.textContent = '';
      noteEl.className = 'card-note is-lead';
    }

    noteEl.textContent = '';
    if (st.note.indexOf('Love Has Names: ') === 0) {
      var strong = document.createElement('strong');
      strong.textContent = 'Love Has Names. ';
      noteEl.appendChild(strong);
      noteEl.appendChild(document.createTextNode(st.note.slice('Love Has Names: '.length)));
    } else {
      noteEl.textContent = st.note;
    }

    if (st.subnote) {
      subnoteEl.textContent = st.subnote;
      subnoteEl.classList.remove('is-empty');
    } else {
      subnoteEl.textContent = '';
      subnoteEl.classList.add('is-empty');
    }
  }

  function applyScene(st) {
    var s = st.state;
    midRing.classList.toggle('is-on', !!s.mid);
    outerRing.classList.toggle('is-on', !!s.outer);
    outwardPaths.classList.toggle('is-on', !!s.paths);
    actionPill.classList.toggle('is-on', !!s.action);
    beyondPaths.classList.toggle('is-on', !!s.beyond);
    svgEl.classList.toggle('is-horizon', !!s.horizon);
    svgEl.classList.toggle('is-globe', !!s.globe);
    svgDesc.textContent = st.desc;
  }

  function goTo(idx, announce) {
    current = Math.max(0, Math.min(STEPS.length - 1, idx));
    var st = STEPS[current];

    document.documentElement.style.setProperty('--step-color', st.accent);
    document.documentElement.style.setProperty('--step-dark', st.accentDark);

    applyScene(st);
    applyCard(st);

    dots.forEach(function (btn, i) {
      var isCurrent = i === current;
      btn.classList.toggle('active', isCurrent);
      btn.classList.toggle('passed', i < current);
      btn.setAttribute('aria-pressed', isCurrent ? 'true' : 'false');
    });

    prevBtn.disabled = current === 0;
    nextBtn.textContent = current === STEPS.length - 1 ? '\u21BB Start Over' : 'Next \u2192';
    countEl.textContent = 'Step ' + (current + 1) + ' of ' + STEPS.length;

    if (announce) {
      statusEl.textContent = 'Step ' + (current + 1) + ' of ' + STEPS.length + ': ' + st.heading;
    }
  }

  prevBtn.addEventListener('click', function () {
    if (current > 0) goTo(current - 1, true);
  });

  nextBtn.addEventListener('click', function () {
    goTo(current === STEPS.length - 1 ? 0 : current + 1, true);
  });

  var lastW = window.innerWidth;
  var measuredW = 0;

  function fitCardHeight() {
    if (!cardContent) return;
    var w = cardContent.clientWidth;
    if (w > 0 && w === measuredW) return;
    measuredW = w;

    var tallest = 0;
    document.documentElement.style.setProperty('--card-h', '0px');
    STEPS.forEach(function (st) {
      applyCard(st);
      tallest = Math.max(tallest, cardContent.offsetHeight);
    });
    applyCard(STEPS[current]);
    document.documentElement.style.setProperty('--card-h', Math.max(108, tallest) + 'px');
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCardHeight, 140);
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitCardHeight);
  }

  goTo(0, false);
  fitCardHeight();
})();
</script>
</body>
</html>
