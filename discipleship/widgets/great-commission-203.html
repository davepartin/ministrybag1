<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Commission</title>
<style>
:root {
  --ink: #2C2416;
  --muted: #6E6559;
  --tray: #F6F4EE;
  --border: #EBE5D9;
  --gold: #A8760A;
  --gold-dark: #7D5604;
  --gold-wash: #FCF2D6;
  --green: #1F684A;
  --blue: #2A5B7C;
  --blue-dark: #1E435C;
  --blue-wash: #E2EEF6;
  --purple: #5F4684;
  --purple-dark: #473366;
  --purple-wash: #EDE7F6;
  --crimson: #8B1A2B;
  --crimson-dark: #6D1422;
  --step-color: #2C2416;
  --step-dark: #2C2416;
  --card-h: 138px;
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  padding: 0;
  margin: 0;
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.widget-outer {
  background: #FFFFFF;
  border-radius: 0;
  overflow: hidden;
  box-shadow: none;
  border: none;
  max-width: 100%;
  width: 100%;
  margin: 0;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
    border: 1px solid #EBE5D9;
    max-width: 460px;
    margin: 0 auto;
  }
}

.title-bar {
  background: #2C2416;
  padding: 7px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  margin: 0;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  background: #FFFFFF;
  padding: 2px 10px 0;
  border-bottom: 1px solid var(--border);
}

.gc-svg {
  display: block;
  width: 100%;
  height: auto;
}

.fade-part {
  opacity: 0;
  pointer-events: none;
}

.fade-part.is-visible {
  opacity: 1;
}

.chev-group {
  opacity: 0;
  pointer-events: none;
}

.chev-group.is-active {
  opacity: 1;
}

.chev-group.is-soft {
  opacity: 0.45;
}

.ring-label {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: 0.1px;
  paint-order: stroke;
  stroke-linejoin: round;
  stroke-width: 3.2px;
}

.ring-label-center {
  font-size: 14.8px;
}

.ring-sub {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 8.8px;
  font-weight: 600;
  fill: #5C5347;
  paint-order: stroke;
  stroke-linejoin: round;
  stroke-width: 2.8px;
}

.course-caption {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 8.4px;
  font-weight: 600;
  letter-spacing: 0.3px;
  fill: #7B7366;
  paint-order: stroke;
  stroke-linejoin: round;
  stroke-width: 2.4px;
}

.course-caption-center {
  font-size: 7.6px;
  letter-spacing: 0.2px;
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 4px;
  background: var(--tray);
  border-bottom: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  min-width: 28px;
  min-height: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
}

.step-dot-fill {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2.5px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 22%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.12);
}

.card-area {
  background: var(--tray);
  padding: 5px 10px 7px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #EBE5D9;
  box-shadow: 0 2px 10px rgba(44, 36, 22, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 6px 11px;
  min-height: var(--card-h, 134px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-heading {
  font: 700 14.5px/1.18 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 2px;
}

.card-verse {
  font: 12.4px/1.3 Georgia, Cambria, serif;
  color: #3D3426;
  margin: 0;
}

.verse-ref {
  font: 600 11px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  white-space: nowrap;
  margin-left: 4px;
}

.card-note {
  display: block;
  margin: 3px 0 0;
  font: 11.8px/1.28 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #4A4238;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}

.nav-btn {
  appearance: none;
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: var(--ink);
  font: 700 13.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FFFFFF;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.step-count {
  font: 600 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (prefers-reduced-motion: no-preference) {
  .widget-outer:not(.is-instant) .fade-part {
    transition: opacity 0.44s ease;
  }
  .widget-outer:not(.is-instant) .globe-fade {
    transition: opacity 0.65s ease;
  }
  .widget-outer:not(.is-instant) .chev-group {
    transition: opacity 0.35s ease;
  }
  .widget-outer .step-dot-fill {
    transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
  }
  .widget-outer .nav-btn.primary,
  .widget-outer .verse-card-bar,
  .widget-outer .card-heading {
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease;
  }
}

#measure-host {
  position: absolute;
  left: -9999px;
  top: 0;
  visibility: hidden;
  pointer-events: none;
}
</style>

      <g id="contour-0" fill="none" stroke="#A8760A" stroke-width="2" stroke-linecap="round">
        <path id="arc-0-left" d="M220,120 A40,40 0 0,0 220,200" />
        <path id="arc-0-right" d="M220,120 A40,40 0 0,1 220,200" />
      </g>

      <!-- Gold dot marking Jerusalem under the center of the circles (Step 5 and Final) -->
      <g id="jerusalem-dot" class="fade-part globe-fade">
        <circle cx="220" cy="174.9" r="4.6" fill="#A8760A" fill-opacity="0.22" />
        <circle cx="220" cy="174.9" r="2.9" fill="#A8760A" stroke="#FFFDF8" stroke-width="1.1" />
      </g>

      <!-- Studio Wash outward double-chevron watermarks (left and right of active ring) -->
      <g id="chev-1" class="chev-group" fill="none" stroke="#2A5B7C" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="168,155 163,160 168,165" stroke-width="2.6" opacity="0.55" />
        <polyline points="174,156 169.5,160 174,164" stroke-width="2.1" opacity="0.26" />
        <polyline points="272,155 277,160 272,165" stroke-width="2.6" opacity="0.55" />
        <polyline points="266,156 270.5,160 266,164" stroke-width="2.1" opacity="0.26" />
      </g>
      <g id="chev-2" class="chev-group" fill="none" stroke="#5F4684" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="140,155 135,160 140,165" stroke-width="2.6" opacity="0.55" />
        <polyline points="146,156 141.5,160 146,164" stroke-width="2.1" opacity="0.26" />
        <polyline points="300,155 305,160 300,165" stroke-width="2.6" opacity="0.55" />
        <polyline points="294,156 298.5,160 294,164" stroke-width="2.1" opacity="0.26" />
      </g>
      <g id="chev-3" class="chev-group" fill="none" stroke="#5F4684" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="111,155 106,160 111,165" stroke-width="2.6" opacity="0.55" />
        <polyline points="117,156 112.5,160 117,164" stroke-width="2.1" opacity="0.26" />
        <polyline points="329,155 334,160 329,165" stroke-width="2.6" opacity="0.55" />
        <polyline points="323,156 327.5,160 323,164" stroke-width="2.1" opacity="0.26" />
      </g>
      <g id="chev-4" class="chev-group" fill="none" stroke="#5F4684" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="83,155 78,160 83,165" stroke-width="2.6" opacity="0.55" />
        <polyline points="89,156 84.5,160 89,164" stroke-width="2.1" opacity="0.26" />
        <polyline points="357,155 362,160 357,165" stroke-width="2.6" opacity="0.55" />
        <polyline points="351,156 355.5,160 351,164" stroke-width="2.1" opacity="0.26" />
      </g>

      <!-- Labels anchored cleanly inside the top of each ring -->
      <g id="lbl-0" class="fade-part" text-anchor="middle">
        <text class="ring-label ring-label-center" x="220" y="154" fill="#7D5604" stroke="#FCF2D6">You</text>
        <text class="ring-sub" x="220" y="164.5" stroke="#FCF2D6">loved by God</text>
        <text class="course-caption course-caption-center" x="220" y="185" stroke="#FCF2D6">Growing Deep</text>
      </g>

      <g id="lbl-1" class="fade-part" text-anchor="middle">
        <text class="ring-label" x="220" y="111" fill="#1E435C" stroke="#E8F1F8">Home and Church</text>
        <text class="course-caption" x="220" y="216" stroke="#E8F1F8">Growing Up</text>
      </g>

      <g id="lbl-2" class="fade-part" text-anchor="middle">
        <text class="ring-label" x="220" y="79" fill="#473366" stroke="#F1ECF8">Your Jerusalem</text>
        <text class="ring-sub" x="220" y="89.5" stroke="#F1ECF8">work, school, neighborhood</text>
        <text class="course-caption" x="220" y="244" stroke="#F1ECF8">Growing Out</text>
      </g>

      <g id="lbl-3" class="fade-part" text-anchor="middle">
        <text class="ring-label" x="220" y="50" fill="#473366" stroke="#F6F3FB">Judea and Samaria</text>
        <text class="ring-sub" x="220" y="60.5" stroke="#F6F3FB">your region, and people unlike you</text>
      </g>

      <g id="lbl-4" class="fade-part" text-anchor="middle">
        <text class="ring-label" x="220" y="22" fill="#473366" stroke="#FFFFFF">The End of the Earth</text>
        <text class="ring-sub" x="220" y="32" stroke="#FFFFFF">the nations</text>
      </g>

      <!-- Final step: crisp Deep Crimson double-hairline cross at the bullseye (no glow) -->
      <g id="final-cross" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path id="cross-outer" stroke="#8B1A2B" stroke-width="2"
          d="M218.3,126.5 L221.7,126.5 L221.7,130.5 L226.0,130.5 L226.0,133.6 L221.7,133.6 L221.7,140.8 L218.3,140.8 L218.3,133.6 L214.0,133.6 L214.0,130.5 L218.3,130.5 Z" />
        <path id="cross-inner" stroke="#8B1A2B" stroke-width="0.9" opacity="0.45"
          d="M219.2,127.5 L220.8,127.5 L220.8,131.4 L225.0,131.4 L225.0,132.7 L220.8,132.7 L220.8,139.8 L219.2,139.8 L219.2,132.7 L215.0,132.7 L215.0,131.4 L219.2,131.4 Z" />
      </g>
    </svg>
  </div>

  <div class="step-strip" role="group" aria-label="Mission steps">
    <button type="button" class="step-dot active" data-step="0" aria-label="Start: The Great Commission" aria-pressed="true" style="--dot-color: #2C2416;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="1" aria-label="Step 1: You, Loved by God" aria-pressed="false" style="--dot-color: #A8760A;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="2" aria-label="Step 2: Home and Church" aria-pressed="false" style="--dot-color: #2A5B7C;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="3" aria-label="Step 3: Your Jerusalem" aria-pressed="false" style="--dot-color: #5F4684;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="4" aria-label="Step 4: Judea and Samaria" aria-pressed="false" style="--dot-color: #5F4684;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="5" aria-label="Step 5: The End of the Earth" aria-pressed="false" style="--dot-color: #5F4684;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="6" aria-label="Step 6: Go and Make Disciples" aria-pressed="false" style="--dot-color: #8B1A2B;"><span class="step-dot-fill"></span></button>
  </div>

  <div class="card-area">
    <div class="verse-card">
      <div class="verse-card-bar"></div>
      <div class="verse-card-content" id="card-content" aria-live="polite" aria-atomic="true">
        <h2 class="card-heading" id="card-heading"></h2>
        <p class="card-verse"><span id="card-verse-text"></span><span class="verse-ref" id="card-ref"></span></p>
        <p class="card-note" id="card-note"></p>
      </div>
    </div>

    <div class="nav-bar">
      <button type="button" class="nav-btn secondary" id="prev-btn" disabled>&larr; Back</button>
      <span class="step-count" id="step-count">Ready</span>
      <button type="button" class="nav-btn primary" id="next-btn">Begin &rarr;</button>
    </div>
  </div>
</main>

<div id="measure-host" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  var STEPS = [
    {
      heading: 'The Great Commission',
      verse: '"All authority in heaven and on earth has been given to me."',
      ref: 'Matthew 28:18',
      note: 'Before Jesus returned to the Father, He gave His followers one mission and showed them where it would go.',
      accent: '#2C2416',
      accentDark: '#2C2416',
      countLabel: 'Ready',
      nextLabel: 'Begin \u2192',
      title: 'The Great Commission: Start',
      desc: 'Clean white stage ready for the concentric mission circles to unfold from the center outward.'
    },
    {
      heading: 'You, Loved by God',
      verse: '"We love because he first loved us."',
      ref: '1 John 4:19',
      note: 'Every circle starts here. Before you go anywhere, you are loved.',
      accent: '#A8760A',
      accentDark: '#7D5604',
      countLabel: 'Step 1 of 6',
      nextLabel: 'Next \u2192',
      title: 'Step 1: You, Loved by God',
      desc: 'A gold center circle with a thin green inner hairline labeled You, loved by God, and Growing Deep.'
    },
    {
      heading: 'Home and Church',
      verse: '"So then, as we have opportunity, let us do good to everyone, and especially to those who are of the household of faith."',
      ref: 'Galatians 6:10',
      note: 'Love reaches first to the people closest to you: your home and your church family.',
      accent: '#2A5B7C',
      accentDark: '#1E435C',
      countLabel: 'Step 2 of 6',
      nextLabel: 'Next \u2192',
      title: 'Step 2: Home and Church',
      desc: 'A blue ring grows around the gold center, labeled Home and Church and Growing Up, with outward chevrons.'
    },
    {
      heading: 'Your Jerusalem',
      verse: '"You will be my witnesses in Jerusalem"',
      ref: 'Acts 1:8',
      note: 'Jerusalem was the city where the disciples already lived. Your Jerusalem is the place you already are: work, school, and your neighborhood.',
      accent: '#5F4684',
      accentDark: '#473366',
      countLabel: 'Step 3 of 6',
      nextLabel: 'Next \u2192',
      title: 'Step 3: Your Jerusalem',
      desc: 'A purple ring grows around Home and Church, labeled Your Jerusalem (work, school, neighborhood) and Growing Out.'
    },
    {
      heading: 'Judea and Samaria',
      verse: '"and in all Judea and Samaria"',
      ref: 'Acts 1:8',
      note: 'Judea was the region around them. Samaria was full of people they had learned to avoid. Love keeps going, even across those lines.',
      accent: '#5F4684',
      accentDark: '#473366',
      countLabel: 'Step 4 of 6',
      nextLabel: 'Next \u2192',
      title: 'Step 4: Judea and Samaria',
      desc: 'A lighter purple ring expands outward, labeled Judea and Samaria: your region, and people unlike you.'
    },
    {
      heading: 'The End of the Earth',
      verse: '"and to the end of the earth."',
      ref: 'Acts 1:8',
      note: 'The same love reaches every nation. You can pray, give, and go.',
      accent: '#5F4684',
      accentDark: '#473366',
      countLabel: 'Step 5 of 6',
      nextLabel: 'Next \u2192',
      title: 'Step 5: The End of the Earth',
      desc: 'A dashed outer ring labeled The End of the Earth (the nations) opens as a faint globe of Europe, Africa, and Asia fades in behind it with a gold dot marking Jerusalem near the center.'
    },
    {
      heading: 'Go and Make Disciples',
      verse: '"Go therefore and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit, teaching them to observe all that I have commanded you. And behold, I am with you always, to the end of the age."',
      ref: 'Matthew 28:19-20',
      note: 'Love comes down, goes up, and reaches out, starting at your own front door.',
      accent: '#8B1A2B',
      accentDark: '#6D1422',
      countLabel: 'Step 6 of 6',
      nextLabel: 'Start Over',
      title: 'Step 6: Go and Make Disciples',
      desc: 'All concentric mission circles and the Eastern Hemisphere globe with Jerusalem marked in gold, crowned by a small crimson double-hairline cross at the center bullseye.'
    }
  ];

  var CONTOUR_SPEED = 185; // px per second per Studio Wash guide

  var widget = document.getElementById('widget');
  var svgTitle = document.getElementById('svg-title');
  var svgDesc = document.getElementById('svg-desc');
  var cardContent = document.getElementById('card-content');
  var cardHeading = document.getElementById('card-heading');
  var cardVerseText = document.getElementById('card-verse-text');
  var cardRef = document.getElementById('card-ref');
  var cardNote = document.getElementById('card-note');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  var stepCount = document.getElementById('step-count');
  var dotBtns = Array.prototype.slice.call(document.querySelectorAll('.step-dot'));
  var measureHost = document.getElementById('measure-host');

  var globeLayer = document.getElementById('globe-layer');
  var jerusalemDot = document.getElementById('jerusalem-dot');
  var crossOuter = document.getElementById('cross-outer');
  var crossInner = document.getElementById('cross-inner');

  var RINGS = [
    {
      step: 1,
      paths: [
        document.getElementById('arc-0-left'),
        document.getElementById('arc-0-right'),
        document.getElementById('arc-0g-left'),
        document.getElementById('arc-0g-right')
      ],
      wash: document.getElementById('wash-0'),
      label: document.getElementById('lbl-0'),
      chev: null
    },
    {
      step: 2,
      paths: [document.getElementById('arc-1-left'), document.getElementById('arc-1-right')],
      wash: document.getElementById('wash-1'),
      label: document.getElementById('lbl-1'),
      chev: document.getElementById('chev-1')
    },
    {
      step: 3,
      paths: [document.getElementById('arc-2-left'), document.getElementById('arc-2-right')],
      wash: document.getElementById('wash-2'),
      label: document.getElementById('lbl-2'),
      chev: document.getElementById('chev-2')
    },
    {
      step: 4,
      paths: [document.getElementById('arc-3-left'), document.getElementById('arc-3-right')],
      wash: document.getElementById('wash-3'),
      label: document.getElementById('lbl-3'),
      chev: document.getElementById('chev-3')
    },
    {
      step: 5,
      paths: [document.getElementById('mask-r4-left'), document.getElementById('mask-r4-right')],
      wash: document.getElementById('wash-4'),
      label: document.getElementById('lbl-4'),
      chev: document.getElementById('chev-4')
    }
  ];

  var CROSS_PATHS = [crossOuter, crossInner];

  function pathLen(el) {
    try {
      return Math.ceil(el.getTotalLength());
    } catch (e) {
      return 300;
    }
  }

  RINGS.forEach(function (ring) {
    ring.lens = ring.paths.map(pathLen);
    ring.maxLen = Math.max.apply(null, ring.lens);
  });
  var crossLens = CROSS_PATHS.map(pathLen);
  var crossMaxLen = Math.max.apply(null, crossLens);

  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) {
    widget.classList.add('is-instant');
  }

  var currentStep = 0;
  var activeRaf = 0;
  var lastMeasuredWidth = 0;

  function cancelAnim() {
    if (activeRaf) {
      cancelAnimationFrame(activeRaf);
      activeRaf = 0;
    }
  }

  function setPathProgress(el, len, progress) {
    var clamped = Math.max(0, Math.min(1, progress));
    if (clamped <= 0) {
      el.style.strokeDasharray = String(len);
      el.style.strokeDashoffset = String(len);
      el.style.opacity = '0';
    } else if (clamped >= 1) {
      el.style.strokeDasharray = 'none';
      el.style.strokeDashoffset = '0';
      el.style.opacity = '';
    } else {
      el.style.strokeDasharray = String(len);
      el.style.strokeDashoffset = String((1 - clamped) * len);
      el.style.opacity = '';
    }
  }

  function applyStaticParts(idx, animatingStep) {
    RINGS.forEach(function (ring) {
      var shown = idx >= ring.step;
      var isAnimating = animatingStep === ring.step;
      if (!isAnimating) {
        for (var i = 0; i < ring.paths.length; i++) {
          setPathProgress(ring.paths[i], ring.lens[i], shown ? 1 : 0);
        }
        ring.wash.classList.toggle('is-visible', shown);
        ring.label.classList.toggle('is-visible', shown);
      } else {
        for (var j = 0; j < ring.paths.length; j++) {
          setPathProgress(ring.paths[j], ring.lens[j], 0);
        }
        ring.wash.classList.remove('is-visible');
        ring.label.classList.remove('is-visible');
      }
      if (ring.chev) {
        var activeChev = (idx === ring.step && !isAnimating);
        var softChev = (idx === 6 && ring.step === 5);
        ring.chev.classList.toggle('is-active', activeChev);
        ring.chev.classList.toggle('is-soft', softChev);
      }
    });

    var showGlobe = idx >= 5 && animatingStep !== 5;
    globeLayer.classList.toggle('is-visible', showGlobe);
    jerusalemDot.classList.toggle('is-visible', showGlobe);

    var showCross = idx >= 6 && animatingStep !== 6;
    for (var c = 0; c < CROSS_PATHS.length; c++) {
      setPathProgress(CROSS_PATHS[c], crossLens[c], showCross ? 1 : 0);
    }
  }

  function animateStep(idx) {
    cancelAnim();
    if (idx >= 1 && idx <= 5) {
      var ring = RINGS[idx - 1];
      var drawMs = Math.max(420, Math.round((ring.maxLen / CONTOUR_SPEED) * 1000));
      var washTrigger = 0.65;
      widget.setAttribute('data-step-dur', String(drawMs));
      applyStaticParts(idx, idx);

      var startTime = 0;
      var washed = false;
      function frameRing(now) {
        if (!startTime) startTime = now;
        var t = Math.min(1, (now - startTime) / drawMs);
        var eased = 1 - Math.pow(1 - t, 1.5);
        for (var i = 0; i < ring.paths.length; i++) {
          setPathProgress(ring.paths[i], ring.lens[i], eased);
        }
        if (!washed && t >= washTrigger) {
          washed = true;
          ring.wash.classList.add('is-visible');
          ring.label.classList.add('is-visible');
          if (ring.chev) ring.chev.classList.add('is-active');
          if (idx === 5) {
            globeLayer.classList.add('is-visible');
            jerusalemDot.classList.add('is-visible');
          }
        }
        if (t < 1) {
          activeRaf = requestAnimationFrame(frameRing);
        } else {
          activeRaf = 0;
          for (var k = 0; k < ring.paths.length; k++) {
            setPathProgress(ring.paths[k], ring.lens[k], 1);
          }
        }
      }
      activeRaf = requestAnimationFrame(frameRing);
      return;
    }

    if (idx === 6) {
      var crossMs = Math.max(360, Math.round((crossMaxLen / CONTOUR_SPEED) * 1000));
      widget.setAttribute('data-step-dur', String(crossMs));
      applyStaticParts(6, 6);

      var t0 = 0;
      function frameCross(now) {
        if (!t0) t0 = now;
        var t = Math.min(1, (now - t0) / crossMs);
        for (var c = 0; c < CROSS_PATHS.length; c++) {
          setPathProgress(CROSS_PATHS[c], crossLens[c], t);
        }
        if (t < 1) {
          activeRaf = requestAnimationFrame(frameCross);
        } else {
          activeRaf = 0;
          for (var c2 = 0; c2 < CROSS_PATHS.length; c2++) {
            setPathProgress(CROSS_PATHS[c2], crossLens[c2], 1);
          }
        }
      }
      activeRaf = requestAnimationFrame(frameCross);
      return;
    }

    widget.setAttribute('data-step-dur', '0');
    applyStaticParts(idx, -1);
  }

  function updateCardAndChrome(idx) {
    var s = STEPS[idx];
    widget.setAttribute('data-step', String(idx));
    widget.style.setProperty('--step-color', s.accent);
    widget.style.setProperty('--step-dark', s.accentDark);

    cardHeading.textContent = s.heading;
    cardVerseText.textContent = s.verse;
    cardRef.textContent = s.ref;
    cardNote.textContent = s.note;

    svgTitle.textContent = s.title;
    svgDesc.textContent = s.desc;

    stepCount.textContent = s.countLabel;
    nextBtn.textContent = s.nextLabel;
    prevBtn.disabled = (idx === 0);

    dotBtns.forEach(function (btn, i) {
      btn.classList.toggle('active', i === idx);
      btn.classList.toggle('passed', i < idx);
      btn.setAttribute('aria-pressed', i === idx ? 'true' : 'false');
    });
  }

  function goToStep(idx, animateForward) {
    if (idx < 0 || idx >= STEPS.length) return;
    cancelAnim();
    currentStep = idx;
    updateCardAndChrome(idx);

    var instant = reducedMotion || !animateForward || idx === 0;
    if (instant) {
      widget.classList.add('is-instant');
      widget.setAttribute('data-step-dur', '0');
      applyStaticParts(idx, -1);
      if (!reducedMotion) {
        void widget.offsetWidth;
        widget.classList.remove('is-instant');
      }
    } else {
      widget.classList.remove('is-instant');
      animateStep(idx);
    }
  }

  function fitCardHeight() {
    var w = cardContent.clientWidth;
    if (!w) return;
    lastMeasuredWidth = w;
    var clone = cardContent.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('aria-live');
    clone.style.width = w + 'px';
    clone.style.minHeight = '0';
    clone.style.height = 'auto';

    var h = clone.querySelector('#card-heading');
    var v = clone.querySelector('#card-verse-text');
    var r = clone.querySelector('#card-ref');
    var n = clone.querySelector('#card-note');
    if (h) h.removeAttribute('id');
    if (v) v.removeAttribute('id');
    if (r) r.removeAttribute('id');
    if (n) n.removeAttribute('id');

    measureHost.innerHTML = '';
    measureHost.appendChild(clone);

    var maxH = 0;
    for (var i = 0; i < STEPS.length; i++) {
      if (h) h.textContent = STEPS[i].heading;
      if (v) v.textContent = STEPS[i].verse;
      if (r) r.textContent = STEPS[i].ref;
      if (n) n.textContent = STEPS[i].note;
      var measured = Math.ceil(clone.getBoundingClientRect().height);
      if (measured > maxH) maxH = measured;
    }
    measureHost.innerHTML = '';
    if (maxH > 0) {
      widget.style.setProperty('--card-h', maxH + 'px');
    }
  }

  nextBtn.addEventListener('click', function () {
    if (currentStep < STEPS.length - 1) {
      goToStep(currentStep + 1, true);
    } else {
      goToStep(0, false);
    }
  });

  prevBtn.addEventListener('click', function () {
    if (currentStep > 0) {
      goToStep(currentStep - 1, false);
    }
  });

  dotBtns.forEach(function (btn, i) {
    btn.addEventListener('click', function () {
      if (i === currentStep) return;
      var forwardOne = (i === currentStep + 1);
      goToStep(i, forwardOne);
    });
  });

  var lastWindowWidth = window.innerWidth;
  window.addEventListener('resize', function () {
    var w = window.innerWidth;
    if (w !== lastWindowWidth) {
      lastWindowWidth = w;
      if (cardContent.clientWidth !== lastMeasuredWidth) {
        fitCardHeight();
      }
    }
  });

  fitCardHeight();
  goToStep(0, false);
}());
</script>
</body>
