<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Commission</title>
<style>
:root {
  --ink: #2C2416;
  --muted: #6E6559;
  --tray: #F6F4EE;
  --border: #EBE5D9;
  --green: #1F684A;
  --green-dark: #164E37;
  --crimson: #8B1A2B;
  --crimson-dark: #6D1422;
  --step-color: #2C2416;
  --step-dark: #2C2416;
  --card-h: 134px;
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  padding: 0;
  margin: 0;
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.widget-outer {
  background: #FFFFFF;
  border-radius: 0;
  overflow: hidden;
  box-shadow: none;
  border: none;
  max-width: 100%;
  width: 100%;
  margin: 0;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
    border: 1px solid #EBE5D9;
    max-width: 460px;
    margin: 0 auto;
  }
}

.title-bar {
  background: #2C2416;
  padding: 7px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  margin: 0;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  background: #FFFFFF;
  padding: 2px 10px 0;
  border-bottom: 1px solid var(--border);
}

.gc-svg {
  display: block;
  width: 100%;
  height: auto;
}

.fade-part {
  opacity: 0;
  pointer-events: none;
}

.fade-part.is-visible {
  opacity: 1;
}

.gc-svg.globe-active #wash-1 { fill-opacity: 0.20; }
.gc-svg.globe-active #wash-2 { fill-opacity: 0.13; }
.gc-svg.globe-active #wash-3 { fill-opacity: 0.09; }
.gc-svg.globe-active #wash-4 { fill-opacity: 0.05; }
.gc-svg.globe-active .ring-label { stroke: #EAF5FC; stroke-opacity: 0.94; }

.mult-dot {
  fill: #1F684A;
  stroke: #FFFFFF;
  stroke-width: 1.15;
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  transform: scale(0);
  pointer-events: none;
}

.mult-ring.is-visible .mult-dot {
  opacity: 1;
  transform: scale(1);
}

.ring-label {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.1px;
  paint-order: stroke;
  stroke-linejoin: round;
  stroke-width: 3px;
}

.center-you {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 18px;
  font-weight: 700;
  fill: #FFFFFF;
  letter-spacing: 0.2px;
}

.center-sub {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 9.6px;
  font-weight: 500;
  fill: #E6F3EC;
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 4px;
  background: var(--tray);
  border-bottom: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  min-width: 28px;
  min-height: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
}

.step-dot-fill {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2.5px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 22%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.12);
}

.card-area {
  background: var(--tray);
  padding: 5px 10px 7px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #EBE5D9;
  box-shadow: 0 2px 10px rgba(44, 36, 22, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 6px 11px;
  min-height: var(--card-h, 134px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-heading {
  font: 700 14.5px/1.18 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 2px;
}

.card-verse {
  font: 12.4px/1.3 Georgia, Cambria, serif;
  color: #3D3426;
  margin: 0;
}

.verse-ref {
  font: 600 11px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  white-space: nowrap;
  margin-left: 4px;
}

.card-note {
  display: block;
  margin: 3px 0 0;
  font: 11.8px/1.28 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #4A4238;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}

.nav-btn {
  appearance: none;
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: var(--ink);
  font: 700 13.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FFFFFF;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.step-count {
  font: 600 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (prefers-reduced-motion: no-preference) {
  .widget-outer:not(.is-instant) .fade-part {
    transition: opacity 0.44s ease, fill-opacity 3s ease;
  }
  .widget-outer:not(.is-instant) .globe-fade {
    transition: opacity 3s ease;
  }
  .widget-outer:not(.is-instant) .ring-label {
    transition: stroke 1.8s ease;
  }
  .widget-outer:not(.is-instant) .mult-dot {
    transition: opacity 0.45s ease var(--d, 0ms), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1) var(--d, 0ms);
  }
  .widget-outer .step-dot-fill {
    transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
  }
  .widget-outer .nav-btn.primary,
  .widget-outer .verse-card-bar,
  .widget-outer .card-heading {
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease;
  }
}

#measure-host {
  position: absolute;
  left: -9999px;
  top: 0;
  visibility: hidden;
  pointer-events: none;
}
</style>
</head>

        <line id="arrow-right-shaft" x1="244" y1="134" x2="266" y2="112" stroke-width="2.2" />
        <polygon id="arrow-right-head" points="0,0 -3,10.5 -10.5,3" stroke="none" transform="translate(266,112)" />
      </g>

      <!-- Multiplying dark-green dots popping up organically (3-4 per circle) on the final step -->
      <g id="mult-ring-1" class="mult-ring">
        <circle class="mult-dot" cx="207.8" cy="109.0" r="5.0" style="--d:0ms" />
        <circle class="mult-dot" cx="270.5" cy="172.5" r="5.0" style="--d:240ms" />
        <circle class="mult-dot" cx="171.5" cy="173.8" r="5.0" style="--d:470ms" />
      </g>
      <g id="mult-ring-2" class="mult-ring">
        <circle class="mult-dot" cx="251.5" cy="87.2" r="4.8" style="--d:0ms" />
        <circle class="mult-dot" cx="143.0" cy="134.5" r="4.8" style="--d:220ms" />
        <circle class="mult-dot" cx="284.7" cy="201.6" r="4.8" style="--d:430ms" />
        <circle class="mult-dot" cx="148.5" cy="196.0" r="4.8" style="--d:610ms" />
      </g>
      <g id="mult-ring-3" class="mult-ring">
        <circle class="mult-dot" cx="180.3" cy="59.7" r="4.6" style="--d:0ms" />
        <circle class="mult-dot" cx="325.8" cy="131.6" r="4.6" style="--d:200ms" />
        <circle class="mult-dot" cx="115.6" cy="169.0" r="4.6" style="--d:420ms" />
        <circle class="mult-dot" cx="300.6" cy="230.6" r="4.6" style="--d:620ms" />
      </g>
      <g id="mult-ring-4" class="mult-ring">
        <circle class="mult-dot" cx="252.4" cy="28.0" r="4.5" style="--d:0ms" />
        <circle class="mult-dot" cx="115.1" cy="246.1" r="4.5" style="--d:210ms" />
        <circle class="mult-dot" cx="96.2" cy="108.0" r="4.5" style="--d:430ms" />
        <circle class="mult-dot" cx="349.3" cy="200.0" r="4.5" style="--d:620ms" />
      </g>

      <!-- Clean minimal labels at center and crisp black text stacked neatly toward the bottom of each ring -->
      <g id="lbl-0" class="fade-part" text-anchor="middle">
        <text class="center-you" x="220" y="156">You</text>
        <text class="center-sub" x="220" y="169">loved by God</text>
      </g>

      <g id="lbl-1" class="fade-part" text-anchor="middle">
        <text class="ring-label" x="220" y="212" fill="#141414" stroke="#BAD9C6">Home &amp; Church</text>
      </g>

      <g id="lbl-2" class="fade-part" text-anchor="middle">
        <text class="ring-label" x="220" y="240" fill="#141414" stroke="#D2E6DA">Work &amp; School</text>
      </g>

      <g id="lbl-3" class="fade-part" text-anchor="middle">
        <text class="ring-label" x="220" y="268" fill="#141414" stroke="#E4F1E9">Neighborhood &amp; City</text>
      </g>

      <g id="lbl-4" class="fade-part" text-anchor="middle">
        <text class="ring-label" x="220" y="296" fill="#141414" stroke="#F4FAF6">The World</text>
      </g>
    </svg>
  </div>

  <div class="step-strip" role="group" aria-label="Mission steps">
    <button type="button" class="step-dot active" data-step="0" aria-label="Start: The Great Commission" aria-pressed="true" style="--dot-color: #2C2416;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="1" aria-label="Step 1: You, Loved by God" aria-pressed="false" style="--dot-color: #1F684A;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="2" aria-label="Step 2: Home and Church" aria-pressed="false" style="--dot-color: #287053;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="3" aria-label="Step 3: Work and School" aria-pressed="false" style="--dot-color: #357E5F;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="4" aria-label="Step 4: Neighborhood and City" aria-pressed="false" style="--dot-color: #4A8E6F;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="5" aria-label="Step 5: The World" aria-pressed="false" style="--dot-color: #5E987D;"><span class="step-dot-fill"></span></button>
    <button type="button" class="step-dot" data-step="6" aria-label="Step 6: Go and Make Disciples" aria-pressed="false" style="--dot-color: #1F684A;"><span class="step-dot-fill"></span></button>
  </div>

  <div class="card-area">
    <div class="verse-card">
      <div class="verse-card-bar"></div>
      <div class="verse-card-content" id="card-content" aria-live="polite" aria-atomic="true">
        <h2 class="card-heading" id="card-heading"></h2>
        <p class="card-verse"><span id="card-verse-text"></span><span class="verse-ref" id="card-ref"></span></p>
        <p class="card-note" id="card-note"></p>
      </div>
    </div>

    <div class="nav-bar">
      <button type="button" class="nav-btn secondary" id="prev-btn" disabled>&larr; Back</button>
      <span class="step-count" id="step-count">Ready</span>
      <button type="button" class="nav-btn primary" id="next-btn">Begin &rarr;</button>
    </div>
  </div>
</main>

<div id="measure-host" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  var STEPS = [
    {
      heading: 'The Great Commission',
      verse: '"All authority in heaven and on earth has been given to me."',
      ref: 'Matthew 28:18',
      note: 'Before Jesus returned to the Father, He gave His followers one mission and showed how God\'s love moves outward.',
      accent: '#2C2416',
      accentDark: '#2C2416',
      countLabel: 'Ready',
      nextLabel: 'Begin \u2192',
      title: 'The Great Commission: Start',
      desc: 'Clean white stage ready for the concentric mission circles to unfold from the center outward.'
    },
    {
      heading: 'You, Loved by God',
      verse: '"We love because he first loved us."',
      ref: '1 John 4:19',
      note: 'Every circle starts here in 201 Course: Growing Deep. Before God sends you anywhere, He anchors you in His love.',
      accent: '#1F684A',
      accentDark: '#164E37',
      countLabel: 'Step 1 of 6',
      nextLabel: 'Next \u2192',
      title: 'Step 1: You, Loved by God',
      desc: 'A deep forest green center circle labeled You, loved by God.'
    },
    {
      heading: 'Home and Church',
      verse: '"So then, as we have opportunity, let us do good to everyone, and especially to those who are of the household of faith."',
      ref: 'Galatians 6:10',
      note: 'The 202 Course: Growing Up begins close to home. God shapes His love in your family and church first so it can overflow outward.',
      accent: '#287053',
      accentDark: '#164E37',
      countLabel: 'Step 2 of 6',
      nextLabel: 'Next \u2192',
      title: 'Step 2: Home and Church',
      desc: 'A sage green ring grows around the center labeled Home and Church at the bottom, with two arrows reaching upward and outward.'
    },
    {
      heading: 'Work and School',
      verse: '"You will be my witnesses in Jerusalem"',
      ref: 'Acts 1:8',
      note: 'This 203 Course: Growing Out starts in your Jerusalem: the coworkers, classmates, and friends right where God placed you each week.',
      accent: '#357E5F',
      accentDark: '#1A543C',
      countLabel: 'Step 3 of 6',
      nextLabel: 'Next \u2192',
      title: 'Step 3: Work and School',
      desc: 'A lighter sage ring expands outward labeled Work and School, with the two upward arrows extending to its edge.'
    },
    {
      heading: 'Neighborhood and City',
      verse: '"and in all Judea and Samaria"',
      ref: 'Acts 1:8',
      note: 'Like Judea and Samaria, God\'s plan pushes love into your neighborhood, your city, and often to people different than you.',
      accent: '#4A8E6F',
      accentDark: '#235942',
      countLabel: 'Step 4 of 6',
      nextLabel: 'Next \u2192',
      title: 'Step 4: Neighborhood and City',
      desc: 'A softer sage ring expands outward labeled Neighborhood and City, with the two upward arrows reaching further out.'
    },
    {
      heading: 'The World',
      verse: '"and to the end of the earth."',
      ref: 'Acts 1:8',
      note: 'God\'s heart reaches to the end of the earth. The same love that starts in you reaches to every nation as you pray, give, and go.',
      accent: '#5E987D',
      accentDark: '#2C5C47',
      countLabel: 'Step 5 of 6',
      nextLabel: 'Next \u2192',
      title: 'Step 5: The World',
      desc: 'A solid outer ring labeled The World opens, followed after a brief pause by a blue-ocean and green-land Earth slowly emerging behind the circles.'
    },
    {
      heading: 'Go and Make Disciples',
      verse: '"Go therefore and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit, teaching them to observe all that I have commanded you. And behold, I am with you always, to the end of the age."',
      ref: 'Matthew 28:19-20',
      note: '',
      accent: '#1F684A',
      accentDark: '#164E37',
      countLabel: 'Step 6 of 6',
      nextLabel: 'Start Over',
      title: 'Step 6: Go and Make Disciples',
      desc: 'Dark green dots matching the center multiply outward one circle at a time from Home and Church through Work and School and Neighborhood and City into The World over the Earth.'
    }
  ];

  var CONTOUR_SPEED = 185; // px per second
  var CX = 220;
  var CY = 158;
  var DIAG = Math.SQRT1_2;
  var ARROW_START_R = 34;
  var ARROW_RADII = [0, 0, 65, 93, 121, 149, 149];

  var widget = document.getElementById('widget');
  var stageSvg = document.getElementById('gc-svg');
  var svgTitle = document.getElementById('svg-title');
  var svgDesc = document.getElementById('svg-desc');
  var cardContent = document.getElementById('card-content');
  var cardHeading = document.getElementById('card-heading');
  var cardVerseText = document.getElementById('card-verse-text');
  var cardRef = document.getElementById('card-ref');
  var cardNote = document.getElementById('card-note');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  var stepCount = document.getElementById('step-count');
  var dotBtns = Array.prototype.slice.call(document.querySelectorAll('.step-dot'));
  var measureHost = document.getElementById('measure-host');

  var globeLayer = document.getElementById('globe-layer');
  var outwardArrows = document.getElementById('outward-arrows');
  var arrowLeftShaft = document.getElementById('arrow-left-shaft');
  var arrowLeftHead = document.getElementById('arrow-left-head');
  var arrowRightShaft = document.getElementById('arrow-right-shaft');
  var arrowRightHead = document.getElementById('arrow-right-head');
  var multRings = [
    document.getElementById('mult-ring-1'),
    document.getElementById('mult-ring-2'),
    document.getElementById('mult-ring-3'),
    document.getElementById('mult-ring-4')
  ];

  var RINGS = [
    {
      step: 1,
      paths: [document.getElementById('arc-0-left'), document.getElementById('arc-0-right')],
      wash: document.getElementById('wash-0'),
      label: document.getElementById('lbl-0')
    },
    {
      step: 2,
      paths: [document.getElementById('arc-1-left'), document.getElementById('arc-1-right')],
      wash: document.getElementById('wash-1'),
      label: document.getElementById('lbl-1')
    },
    {
      step: 3,
      paths: [document.getElementById('arc-2-left'), document.getElementById('arc-2-right')],
      wash: document.getElementById('wash-2'),
      label: document.getElementById('lbl-2')
    },
    {
      step: 4,
      paths: [document.getElementById('arc-3-left'), document.getElementById('arc-3-right')],
      wash: document.getElementById('wash-3'),
      label: document.getElementById('lbl-3')
    },
    {
      step: 5,
      paths: [document.getElementById('arc-4-left'), document.getElementById('arc-4-right')],
      wash: document.getElementById('wash-4'),
      label: document.getElementById('lbl-4')
    }
  ];

  function pathLen(el) {
    try {
      return Math.ceil(el.getTotalLength());
    } catch (e) {
      return 300;
    }
  }

  RINGS.forEach(function (ring) {
    ring.lens = ring.paths.map(pathLen);
    ring.maxLen = Math.max.apply(null, ring.lens);
  });

  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) {
    widget.classList.add('is-instant');
  }

  var currentStep = 0;
  var activeRaf = 0;
  var activeTimers = [];
  var lastMeasuredWidth = 0;

  function scheduleTimer(fn, ms) {
    var id = setTimeout(function () {
      var pos = activeTimers.indexOf(id);
      if (pos !== -1) activeTimers.splice(pos, 1);
      fn();
    }, ms);
    activeTimers.push(id);
    return id;
  }

  function cancelAnim() {
    if (activeRaf) {
      cancelAnimationFrame(activeRaf);
      activeRaf = 0;
    }
    while (activeTimers.length) {
      clearTimeout(activeTimers.pop());
    }
  }

  function setArrowsRadius(radius) {
    if (radius <= ARROW_START_R) {
      outwardArrows.classList.remove('is-visible');
      return;
    }
    var tipD = radius * DIAG;
    var shaftD = Math.max(ARROW_START_R, radius - 5) * DIAG;
    var lxTip = (CX - tipD).toFixed(1);
    var rxTip = (CX + tipD).toFixed(1);
    var yTip = (CY - tipD).toFixed(1);
    var lxShaft = (CX - shaftD).toFixed(1);
    var rxShaft = (CX + shaftD).toFixed(1);
    var yShaft = (CY - shaftD).toFixed(1);

    arrowLeftShaft.setAttribute('x2', lxShaft);
    arrowLeftShaft.setAttribute('y2', yShaft);
    arrowLeftHead.setAttribute('transform', 'translate(' + lxTip + ',' + yTip + ')');

    arrowRightShaft.setAttribute('x2', rxShaft);
    arrowRightShaft.setAttribute('y2', yShaft);
    arrowRightHead.setAttribute('transform', 'translate(' + rxTip + ',' + yTip + ')');

    outwardArrows.classList.add('is-visible');
  }

  function setPathProgress(el, len, progress) {
    var clamped = Math.max(0, Math.min(1, progress));
    if (clamped <= 0) {
      el.style.strokeDasharray = String(len);
      el.style.strokeDashoffset = String(len);
      el.style.opacity = '0';
    } else if (clamped >= 1) {
      el.style.strokeDasharray = 'none';
      el.style.strokeDashoffset = '0';
      el.style.opacity = '';
    } else {
      el.style.strokeDasharray = String(len);
      el.style.strokeDashoffset = String((1 - clamped) * len);
      el.style.opacity = '';
    }
  }

  function applyStaticParts(idx, animatingStep) {
    RINGS.forEach(function (ring) {
      var shown = idx >= ring.step;
      var isAnimating = animatingStep === ring.step;
      if (!isAnimating) {
        for (var i = 0; i < ring.paths.length; i++) {
          setPathProgress(ring.paths[i], ring.lens[i], shown ? 1 : 0);
        }
        ring.wash.classList.toggle('is-visible', shown);
        ring.label.classList.toggle('is-visible', shown);
      } else {
        for (var j = 0; j < ring.paths.length; j++) {
          setPathProgress(ring.paths[j], ring.lens[j], 0);
        }
        ring.wash.classList.remove('is-visible');
        ring.label.classList.remove('is-visible');
      }
    });

    if (animatingStep >= 2 && animatingStep <= 5) {
      setArrowsRadius(ARROW_RADII[animatingStep - 1]);
    } else {
      setArrowsRadius(ARROW_RADII[idx]);
    }

    var showGlobe = idx >= 5 && animatingStep !== 5;
    globeLayer.classList.toggle('is-visible', showGlobe);
    stageSvg.classList.toggle('globe-active', showGlobe);

    var showMult = idx >= 6 && animatingStep !== 6;
    for (var m = 0; m < multRings.length; m++) {
      multRings[m].classList.toggle('is-visible', showMult);
    }
  }

  function animateStep(idx) {
    cancelAnim();
    if (idx >= 1 && idx <= 5) {
      var ring = RINGS[idx - 1];
      var drawMs = Math.max(420, Math.round((ring.maxLen / CONTOUR_SPEED) * 1000));
      var washTrigger = 0.65;
      var fromArrowR = idx === 2 ? ARROW_START_R : ARROW_RADII[idx - 1];
      var toArrowR = ARROW_RADII[idx];
      var totalDur = idx === 5 ? (drawMs + 1000 + 3000) : drawMs;

      widget.setAttribute('data-step-dur', String(totalDur));
      applyStaticParts(idx, idx);

      var startTime = 0;
      var washed = false;
      function frameRing(now) {
        if (!startTime) startTime = now;
        var t = Math.min(1, (now - startTime) / drawMs);
        var eased = 1 - Math.pow(1 - t, 1.5);
        for (var i = 0; i < ring.paths.length; i++) {
          setPathProgress(ring.paths[i], ring.lens[i], eased);
        }
        if (idx >= 2) {
          setArrowsRadius(fromArrowR + (toArrowR - fromArrowR) * eased);
        }
        if (!washed && t >= washTrigger) {
          washed = true;
          ring.wash.classList.add('is-visible');
          ring.label.classList.add('is-visible');
        }
        if (t < 1) {
          activeRaf = requestAnimationFrame(frameRing);
        } else {
          activeRaf = 0;
          for (var k = 0; k < ring.paths.length; k++) {
            setPathProgress(ring.paths[k], ring.lens[k], 1);
          }
          if (idx >= 2) setArrowsRadius(toArrowR);
          if (idx === 5) {
            scheduleTimer(function () {
              globeLayer.classList.add('is-visible');
              stageSvg.classList.add('globe-active');
            }, 1000);
          }
        }
      }
      activeRaf = requestAnimationFrame(frameRing);
      return;
    }

    if (idx === 6) {
      widget.setAttribute('data-step-dur', '4300');
      applyStaticParts(6, 6);

      for (var w = 0; w < multRings.length; w++) {
        (function (waveIdx) {
          scheduleTimer(function () {
            multRings[waveIdx].classList.add('is-visible');
          }, 40 + waveIdx * 1000);
        })(w);
      }
      return;
    }

    widget.setAttribute('data-step-dur', '0');
    applyStaticParts(idx, -1);
  }

  function updateCardAndChrome(idx) {
    var s = STEPS[idx];
    widget.setAttribute('data-step', String(idx));
    widget.style.setProperty('--step-color', s.accent);
    widget.style.setProperty('--step-dark', s.accentDark);

    cardHeading.textContent = s.heading;
    cardVerseText.textContent = s.verse;
    cardRef.textContent = s.ref;
    cardNote.textContent = s.note;
    cardNote.hidden = !s.note;

    svgTitle.textContent = s.title;
    svgDesc.textContent = s.desc;

    stepCount.textContent = s.countLabel;
    nextBtn.textContent = s.nextLabel;
    prevBtn.disabled = (idx === 0);

    dotBtns.forEach(function (btn, i) {
      btn.classList.toggle('active', i === idx);
      btn.classList.toggle('passed', i < idx);
      btn.setAttribute('aria-pressed', i === idx ? 'true' : 'false');
    });
  }

  function goToStep(idx, animateForward) {
    if (idx < 0 || idx >= STEPS.length) return;
    cancelAnim();
    currentStep = idx;
    updateCardAndChrome(idx);

    var instant = reducedMotion || !animateForward || idx === 0;
    if (instant) {
      widget.classList.add('is-instant');
      widget.setAttribute('data-step-dur', '0');
      applyStaticParts(idx, -1);
      if (!reducedMotion) {
        void widget.offsetWidth;
        widget.classList.remove('is-instant');
      }
    } else {
      widget.classList.remove('is-instant');
      animateStep(idx);
    }
  }

  function fitCardHeight() {
    var w = cardContent.clientWidth;
    if (!w) return;
    lastMeasuredWidth = w;
    var clone = cardContent.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('aria-live');
    clone.style.width = w + 'px';
    clone.style.minHeight = '0';
    clone.style.height = 'auto';

    var h = clone.querySelector('#card-heading');
    var v = clone.querySelector('#card-verse-text');
    var r = clone.querySelector('#card-ref');
    var n = clone.querySelector('#card-note');
    if (h) h.removeAttribute('id');
    if (v) v.removeAttribute('id');
    if (r) r.removeAttribute('id');
    if (n) n.removeAttribute('id');

    measureHost.innerHTML = '';
    measureHost.appendChild(clone);

    var maxH = 0;
    for (var i = 0; i < STEPS.length; i++) {
      if (h) h.textContent = STEPS[i].heading;
      if (v) v.textContent = STEPS[i].verse;
      if (r) r.textContent = STEPS[i].ref;
      if (n) {
        n.textContent = STEPS[i].note;
        n.hidden = !STEPS[i].note;
      }
      var measured = Math.ceil(clone.getBoundingClientRect().height);
      if (measured > maxH) maxH = measured;
    }
    measureHost.innerHTML = '';
    if (maxH > 0) {
      widget.style.setProperty('--card-h', maxH + 'px');
    }
  }

  nextBtn.addEventListener('click', function () {
    if (currentStep < STEPS.length - 1) {
      goToStep(currentStep + 1, true);
    } else {
      goToStep(0, false);
    }
  });

  prevBtn.addEventListener('click', function () {
    if (currentStep > 0) {
      goToStep(currentStep - 1, false);
    }
  });

  dotBtns.forEach(function (btn, i) {
    btn.addEventListener('click', function () {
      if (i === currentStep) return;
      var forwardOne = (i === currentStep + 1);
      goToStep(i, forwardOne);
    });
  });

  var lastWindowWidth = window.innerWidth;
  window.addEventListener('resize', function () {
    var w = window.innerWidth;
    if (w !== lastWindowWidth) {
      lastWindowWidth = w;
      if (cardContent.clientWidth !== lastMeasuredWidth) {
        fitCardHeight();
      }
    }
  });

  fitCardHeight();
  goToStep(0, false);
}());
</script>
</body>
</html>
