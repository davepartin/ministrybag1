<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Romans Road</title>
    <style>
        :root {
            --blue: #1E6FA0;
            --ink: #2F2A21;
            --muted: #6B6358;
            --border: #E7DECE;
            --card-color: #1E6FA0;
            --card-h: 112px;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body { background: transparent; color: var(--ink); font-family: 'Inter', 'Trebuchet MS', sans-serif; -webkit-font-smoothing: antialiased; }
        button { font: inherit; font-family: 'Trebuchet MS', sans-serif; -webkit-tap-highlight-color: transparent; cursor: pointer; }
        .widget { width: 100%; max-width: 460px; margin: 0 auto; overflow: hidden; background: #FAF8F1; }
        @media (min-width: 560px) {
            body { padding: 16px; }
            .widget { border: 1px solid #E8DFD0; border-radius: 18px; box-shadow: 0 10px 26px rgba(44, 36, 22, 0.10); }
        }
        .title-bar { background: var(--blue); padding: 10px 16px; text-align: center; }
        .title-bar h1 { font-size: 19px; font-weight: 700; color: #FFFFFF; margin: 0; line-height: 1.2; font-family: 'Trebuchet MS', 'Inter', sans-serif; }

        .scene-wrap { position: relative; background: linear-gradient(180deg, #DCEAF7 0%, #F3EFE3 62%, #E7E0CC 100%); }
        .scene { display: block; width: 100%; height: auto; }
        .road-base { fill: none; stroke: #CBBE9C; stroke-width: 14; stroke-linecap: round; }
        .road-lit { fill: none; stroke: #8A6D3B; stroke-width: 14; stroke-linecap: round; stroke-dasharray: 1000; stroke-dashoffset: 1000; transition: stroke-dashoffset 900ms ease; }
        .road-line { fill: none; stroke: #FAF8F1; stroke-width: 2; stroke-dasharray: 8 10; stroke-linecap: round; opacity: 0.9; }
        .post { transition: opacity 400ms ease, transform 400ms ease; transform-box: fill-box; transform-origin: 50% 100%; }
        .post.dim { opacity: 0.38; }
        .post.current { transform: scale(1.06); }
        .post-letter { font-family: 'Trebuchet MS', sans-serif; font-weight: 700; font-size: 20px; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
        .post-word { font-family: 'Trebuchet MS', sans-serif; font-weight: 700; font-size: 12px; fill: #2F2A21; text-anchor: middle; letter-spacing: 0.3px; }
        .shoot { opacity: 0; transition: opacity 500ms ease 300ms; }
        .shoot.show { opacity: 1; }
        .hands { opacity: 0; transition: opacity 500ms ease; }
        .hands.show { opacity: 1; }
        .scene-caption { position: absolute; left: 12px; right: 12px; top: 10px; text-align: center; font-family: 'Trebuchet MS', sans-serif; font-size: 13px; font-weight: 700; color: #2F2A21; letter-spacing: 0.2px; pointer-events: none; }
        .scene-caption b { color: var(--card-color); }

        .card-area { background-color: #F6F4EE; border-top: 1px solid #EBE5D9; padding: 8px 12px 10px; }
        .verse-card { border-radius: 12px; background: #FFFFFF; box-shadow: 0 2px 14px rgba(44,36,22,0.06); overflow: hidden; border-top: 4px solid var(--card-color); }
        .verse-content { min-height: var(--card-h, 112px); padding: 10px 16px; }
        .verse-title { font-family: 'Trebuchet MS', sans-serif; font-size: 16px; font-weight: 700; line-height: 1.3; margin: 0 0 4px; color: var(--card-color); }
        .verse-text { font-family: Georgia, Cambria, serif; font-size: 15px; line-height: 1.4; color: #3D3426; margin: 0; }
        .verse-text b { color: #1F1A12; }
        .card-note { display: block; margin-top: 6px; font-family: 'Trebuchet MS', sans-serif; font-size: 13px; line-height: 1.35; color: #4A4238; }
        .card-note b { color: var(--card-color); }
        .verse-ref { font-family: 'Trebuchet MS', sans-serif; font-size: 13px; color: var(--muted); margin: 4px 0 0; }

        .nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
        .nav-btn { min-width: 108px; min-height: 44px; padding: 10px 12px; border: 1.5px solid #D4CFC4; border-radius: 10px; background: transparent; color: #5A4E3C; font-size: 14px; font-weight: 600; }
        .nav-btn.primary { background: var(--card-color); color: #FFFFFF; border: none; }
        .nav-btn.hidden { visibility: hidden; }
        .dots { display: flex; gap: 7px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; border: none; padding: 0; background: #D9D2C3; }
        .dot.current { transform: scale(1.3); }
        @media (prefers-reduced-motion: reduce) {
            .road-lit, .post, .shoot, .hands { transition: none; }
        }
    </style>
</head>
<body>
<main class="widget" aria-label="The Romans Road: four stops through Paul's letter to the Romans, Admit, Believe, Confess, and Saved">
    <header class="title-bar"><h1>The Romans Road</h1></header>
    <section class="scene-wrap" aria-hidden="true">
        <div class="scene-caption" id="caption"></div>
        <svg class="scene" id="scene" viewBox="0 0 390 230" width="100%" preserveAspectRatio="xMidYMid meet"></svg>
    </section>
    <section class="card-area" id="card-area" aria-live="polite"></section>
</main>
<script>
(function () {
    var NS = 'http://www.w3.org/2000/svg';
    var road = 'M 28 196 C 90 196, 120 150, 170 150 C 220 150, 240 108, 290 100 C 330 94, 340 84, 346 72';
    var stops = [
        { letter: 'A', word: 'Admit', color: '#8A4A3F', at: 0.17, x: 94, y: 180,
          title: 'A. Admit you need a Savior',
          verse: '"For <b>all have sinned</b> and fall short of the glory of God." "The wages of sin is death, but the <b>free gift of God</b> is eternal life in Christ Jesus our Lord."',
          note: '<b>Your part:</b> own it honestly. <b>God\'s part:</b> He already set a gift on the table.',
          ref: 'Romans 3:23; 6:23' },
        { letter: 'B', word: 'Believe', color: '#B58A2D', at: 0.50, x: 205, y: 128,
          title: 'B. Believe Jesus died for you',
          verse: '"God shows his love for us in that <b>while we were still sinners</b>, Christ died for us."',
          note: '<b>Your part:</b> trust Him. <b>God\'s part:</b> He loved you first and paid the whole cost.',
          ref: 'Romans 5:8' },
        { letter: 'C', word: 'Confess', color: '#1E6FA0', at: 0.80, x: 300, y: 78,
          title: 'C. Confess Jesus as Lord',
          verse: '"If you <b>confess with your mouth</b> that Jesus is Lord and <b>believe in your heart</b> that God raised him from the dead, you will be saved."',
          note: '<b>Your part:</b> say it out loud. <b>God\'s part:</b> He raised Jesus and He keeps His promise.',
          ref: 'Romans 10:9' },
        { letter: '✓', word: 'Saved', color: '#2F7A63', at: 1, x: 346, y: 58, final: true,
          title: 'Saved: new life begins',
          verse: '"<b>Everyone</b> who calls on the name of the Lord <b>will be saved</b>." "There is therefore now <b>no condemnation</b> for those who are in Christ Jesus."',
          note: 'Admit, believe, confess: none of it earns anything. <b>They are empty hands receiving a gift Jesus already paid for.</b>',
          ref: 'Romans 10:13; 8:1' }
    ];
    var step = -1;
    var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function el(tag, attrs, parent) {
        var e = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
        if (parent) parent.appendChild(e);
        return e;
    }
    function currentColor() { return step < 0 ? '#1E6FA0' : stops[step].color; }

    var roadLit = null, posts = [], shoot = null, hands = null, roadLen = 0;

    function buildSceneOnce() {
        var svg = document.getElementById('scene');
        // hills
        el('path', { d: 'M 0 230 L 0 170 C 60 150, 110 160, 160 140 C 220 118, 260 128, 310 98 C 340 80, 365 62, 390 50 L 390 230 Z', fill: '#E3DCC5' }, svg);
        el('path', { d: 'M 0 230 L 0 205 C 80 190, 150 200, 220 176 C 280 156, 330 150, 390 128 L 390 230 Z', fill: '#D6CDAE' }, svg);
        // sun at the top right
        el('circle', { cx: 334, cy: 44, r: 34, fill: '#FFF3C4', opacity: 0.9 }, svg);
        // road
        el('path', { d: road, 'class': 'road-base' }, svg);
        roadLit = el('path', { d: road, 'class': 'road-lit' }, svg);
        el('path', { d: road, 'class': 'road-line' }, svg);
        roadLen = roadLit.getTotalLength ? roadLit.getTotalLength() : 1000;
        roadLit.style.strokeDasharray = roadLen;
        roadLit.style.strokeDashoffset = roadLen;
        // open hands at the start of the road
        hands = el('g', { 'class': 'hands' }, svg);
        el('path', { d: 'M 14 212 C 10 200, 14 192, 24 194 L 38 196 L 40 206 C 36 214, 24 218, 14 212 Z', fill: '#F1D9C0', stroke: '#B58B6A', 'stroke-width': 1.5 }, hands);
        el('path', { d: 'M 44 212 C 48 200, 44 192, 34 194 L 24 196 L 22 206 C 26 214, 36 218, 44 212 Z', fill: '#F1D9C0', stroke: '#B58B6A', 'stroke-width': 1.5, opacity: 0.85 }, hands);
        // signposts
        stops.forEach(function (s, i) {
            var g = el('g', { 'class': 'post dim' }, svg);
            if (s.final) {
                // a gate at the top of the hill
                el('rect', { x: s.x - 20, y: s.y - 2, width: 40, height: 30, rx: 3, fill: '#FFFFFF', stroke: s.color, 'stroke-width': 2.5 }, g);
                el('path', { d: 'M ' + (s.x - 20) + ' ' + (s.y - 2) + ' L ' + s.x + ' ' + (s.y - 16) + ' L ' + (s.x + 20) + ' ' + (s.y - 2) + ' Z', fill: s.color }, g);
                el('text', { x: s.x, y: s.y + 13, 'class': 'post-letter', fill: s.color, style: 'fill:' + s.color }, g).textContent = s.letter;
            } else {
                el('line', { x1: s.x, y1: s.y, x2: s.x, y2: s.y + 22, stroke: '#7A5A3A', 'stroke-width': 3, 'stroke-linecap': 'round' }, g);
                el('circle', { cx: s.x, cy: s.y - 2, r: 17, fill: s.color, stroke: '#FFFFFF', 'stroke-width': 3 }, g);
                el('text', { x: s.x, y: s.y - 2, 'class': 'post-letter' }, g).textContent = s.letter;
            }
            el('text', { x: s.x, y: s.y + (s.final ? 44 : 38), 'class': 'post-word' }, g).textContent = s.word;
            posts.push(g);
        });
        // green shoot in a pot, the lesson's picture, appears at Saved
        shoot = el('g', { 'class': 'shoot' }, svg);
        el('path', { d: 'M 318 206 L 342 206 L 338 226 L 322 226 Z', fill: '#B8743F' }, shoot);
        el('rect', { x: 315, y: 201, width: 30, height: 6, rx: 2, fill: '#C98A52' }, shoot);
        el('path', { d: 'M 330 201 C 330 190, 331 182, 330 172', stroke: '#2F7A63', 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' }, shoot);
        el('path', { d: 'M 330 184 C 322 182, 317 176, 318 170 C 325 170, 330 176, 330 184 Z', fill: '#3C9A72' }, shoot);
        el('path', { d: 'M 330 178 C 338 176, 343 170, 342 164 C 335 164, 330 170, 330 178 Z', fill: '#3C9A72' }, shoot);
    }

    function updateScene() {
        var progress = step < 0 ? 0 : stops[step].at;
        roadLit.style.strokeDashoffset = roadLen * (1 - progress);
        posts.forEach(function (g, i) {
            g.setAttribute('class', 'post' + (i <= step ? '' : ' dim') + (i === step ? ' current' : ''));
        });
        shoot.setAttribute('class', 'shoot' + (step === stops.length - 1 ? ' show' : ''));
        hands.setAttribute('class', 'hands' + (step === -1 || step === stops.length - 1 ? ' show' : ''));
        var cap = document.getElementById('caption');
        if (step < 0) cap.innerHTML = 'Three stops. <b>One gift.</b>';
        else if (stops[step].final) cap.innerHTML = 'You did not earn the road. <b>You walked it with empty hands.</b>';
        else cap.innerHTML = 'Stop ' + (step + 1) + ' of 3: <b>' + stops[step].word + '</b>';
    }

    function buildCard() {
        var area = document.getElementById('card-area');
        area.innerHTML = '';
        var card = document.createElement('div');
        card.className = 'verse-card';
        var c = document.createElement('div');
        c.className = 'verse-content';
        if (step < 0) {
            c.innerHTML = '<h2 class="verse-title">The ABCs of Salvation</h2>' +
                '<p class="verse-text">Paul\'s letter to the Romans lays out the way to God so plainly that people call it the Romans Road. Walk its three stops, <b>Admit</b>, <b>Believe</b>, <b>Confess</b>, and watch who does the work.</p>';
        } else {
            var s = stops[step];
            c.innerHTML = '<h2 class="verse-title">' + s.title + '</h2>' +
                '<p class="verse-text">' + s.verse + '</p>' +
                '<span class="card-note">' + s.note + '</span>' +
                '<p class="verse-ref">' + s.ref + '</p>';
        }
        card.appendChild(c);
        area.appendChild(card);
        area.appendChild(buildNav());
    }

    function buildNav() {
        var nav = document.createElement('div');
        nav.className = 'nav';
        var back = document.createElement('button');
        back.type = 'button';
        back.className = 'nav-btn' + (step === -1 ? ' hidden' : '');
        back.innerHTML = '&larr; Back';
        back.addEventListener('click', function () { if (step > -1) { step -= 1; render(); } });
        nav.appendChild(back);
        var dots = document.createElement('div');
        dots.className = 'dots';
        stops.forEach(function (s, i) {
            var d = document.createElement('button');
            d.type = 'button';
            d.className = 'dot' + (i === step ? ' current' : '');
            d.setAttribute('aria-label', 'Go to ' + s.word);
            if (i <= step) {
                d.style.background = i === step ? s.color : s.color + '88';
                d.addEventListener('click', function () { step = i; render(); });
            }
            dots.appendChild(d);
        });
        nav.appendChild(dots);
        var next = document.createElement('button');
        next.type = 'button';
        next.className = 'nav-btn primary';
        next.innerHTML = step === -1 ? 'Begin &rarr;' : (step === stops.length - 1 ? '&#8635; Walk it again' : 'Next &rarr;');
        next.addEventListener('click', function () {
            step = step === -1 ? 0 : (step === stops.length - 1 ? -1 : step + 1);
            render();
        });
        nav.appendChild(next);
        return nav;
    }

    function render() {
        document.documentElement.style.setProperty('--card-color', currentColor());
        updateScene();
        buildCard();
    }

    buildSceneOnce();
    render();
    window.gtCards = [{ title: 'The ABCs of Salvation', text: 'Paul\'s letter to the Romans lays out the way to God so plainly that people call it the Romans Road. Walk its three stops, Admit, Believe, Confess, and watch who does the work.' }]
        .concat(stops.map(function (s) { return { title: s.title, text: s.verse + '<span class="card-note">' + s.note + '</span>', ref: s.ref }; }));
}());

// Size every card to the tallest step so the buttons never move (A-standard pattern).
function gtFitCards(items) {
    var area = document.querySelector('.card-area');
    if (!area || !area.clientWidth) return;
    var cs = getComputedStyle(area);
    var w = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var m = document.createElement('div'), max = 0;
    m.id = 'measure'; m.style.width = w + 'px';
    document.documentElement.style.setProperty('--card-h', '0px');
    items.forEach(function (it) {
        m.insertAdjacentHTML('beforeend', '<div class="verse-card"><div class="verse-content">' +
            '<h2 class="verse-title">' + (it.title || '') + '</h2>' +
            '<p class="verse-text">' + (it.text || '') + '</p>' +
            (it.ref ? '<p class="verse-ref">' + it.ref + '</p>' : '') + '</div></div>');
    });
    document.body.appendChild(m);
    m.querySelectorAll('.verse-content').forEach(function (c) { max = Math.max(max, c.offsetHeight); });
    document.body.removeChild(m);
    document.documentElement.style.setProperty('--card-h', Math.max(max, 112) + 'px');
}
// Refit only when the width changes. The page briefly resizes this frame's height to measure it,
// and refitting on that would start a measure-resize loop that jolts the page while scrolling.
function gtWatchWidth(fn) {
    var rt = null, lastWidth = window.innerWidth;
    window.addEventListener('resize', function () {
        if (window.innerWidth === lastWidth) return;
        lastWidth = window.innerWidth;
        clearTimeout(rt); rt = setTimeout(fn, 150);
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fn);
}
function gtFit() { gtFitCards(window.gtCards || []); }
gtFit(); gtWatchWidth(gtFit);
</script>
</body>
</html>
