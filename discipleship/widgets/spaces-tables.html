<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Make Space</title>
<style>
:root{--ink:#26231f;--green:#1d7a46;--brand:#1a5c38;--ghost:#b9b1a3;--paper:#fdfdfb}
*{box-sizing:border-box}
body{margin:0;background:#f8f6f1;color:var(--ink);font-family:Georgia,serif}
.app{max-width:560px;margin:auto;background:#fff;overflow:hidden}
@media(min-width:580px){body{padding:16px}.app{border:1px solid #ddd8ce;border-radius:12px}}
header{background:var(--brand);color:#fff;text-align:center;padding:12px 10px}
h1{font:700 19px/1.25 system-ui,sans-serif;margin:0}
.hint{font:12px system-ui,sans-serif;opacity:.9;margin:3px 0 0}
.stage{position:relative;aspect-ratio:460/290;background:var(--paper);border-bottom:1px solid #eee9df}
.stage svg{width:100%;height:100%;display:block}
.letters{display:flex;justify-content:center;gap:6px;padding:12px 10px 0}
.letters.hidden{visibility:hidden}
.letter{width:36px;height:38px;border:2px dashed #cfc8bb;border-radius:8px;font:700 21px/34px system-ui,sans-serif;text-align:center;color:transparent;transition:background .4s,color .4s,border-color .4s}
.letter.on{border:2px solid var(--green);color:var(--green)}
.letter.now{background:var(--green);color:#fff}
.caption{min-height:104px;padding:10px 17px 4px;text-align:center}
.caption h2{font:700 17px system-ui,sans-serif;color:var(--brand);margin:0 0 6px}
.caption p{font:15px/1.45 Georgia,serif;margin:0}
.caption strong{color:var(--brand)}
.progress{display:flex;gap:4px;padding:8px 14px}
.dot{flex:1;height:5px;background:#e6e3dc;border-radius:4px}
.dot.on{background:var(--brand)}
.controls{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:5px 14px 14px}
button{min-height:44px;border-radius:9px;border:1px solid #cfc8bb;background:#fff;color:var(--brand);padding:10px 16px;font:700 14px system-ui,sans-serif;cursor:pointer}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid #e0a526;outline-offset:2px}
.count{font:12px system-ui,sans-serif;color:#655f55}

/* Whiteboard drawing: black marker for everyone, green marker for people who have been discipled and now carry it on. */
svg .line{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
svg .solid{fill:#fff;stroke:var(--ink);stroke-linejoin:round;vector-effect:non-scaling-stroke}
svg .person{transition:transform 1s ease-in-out,opacity .7s ease;stroke:var(--ink)}
svg .person *{stroke:inherit}
svg .person .body{transition:stroke .7s ease}
svg .person.green .body{stroke:var(--green)}
svg .person .pack{fill:#dcefe3;opacity:0;transition:opacity .6s ease}
svg .person.packed .pack{opacity:1}
svg .person.ghost .body{stroke:var(--ghost);stroke-dasharray:5 5}
svg .world{transform-box:view-box;transform-origin:0 0;transition:transform 1.1s ease-in-out}
svg .prop{opacity:0;transition:opacity .6s ease}
svg .book-slide{transition:transform 1s ease-in-out .3s}
svg .book-slide.passed{transform:translate(34px,2px)}
svg .prop.show{opacity:1}
svg .head{transform-box:fill-box;transform-origin:50% 100%}
svg .nod .head{animation:nod 1.1s ease-in-out .3s 3}
svg .person .arm-thumb{display:none}
svg .person.thumb .arm-thumb{display:inline}
svg .person.thumb .arm-rest{display:none}
@keyframes nod{0%,100%{transform:rotate(0)}40%{transform:rotate(9deg)}}
@media(prefers-reduced-motion:reduce){
  svg .world,svg .person,svg .person .body,svg .prop,svg .person .pack,svg .book-slide,.letter{transition:none}
  svg .nod .head{animation:none}
}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Make Space</h1>
  </header>
  <div class="stage" id="stage" role="img" aria-label=""></div>
  <div class="letters hidden" id="letters" aria-hidden="true"></div>
  <section class="caption" aria-live="polite">
    <h2 id="title"></h2>
    <p id="description"></p>
  </section>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <div class="controls">
    <button id="prev" type="button">&larr; Back</button>
    <span class="count" id="count"></span>
    <button class="primary" id="next" type="button">Next &rarr;</button>
  </div>
</main>
<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Each slide: title, caption, letters filled (0 to 6), letters that are new on this slide, camera [centerX, centerY, width], picture description.
  var slides = [
    ['Making Space', 'Jesus calls His disciples to go and make disciples. May we make some space in our lives, put our "yes" on the table, and see what God will do through us.', 0, [], [0, -16, 270],
      'One person sits at a round table. The chair across from them is pulled out and empty, outlined with dashes.'],
    ['Study', 'When we open God\'s Word with someone else, we <strong>learn</strong> more than we would alone: who God is, what He asks of us, and how He has worked in the lives of others.', 1, [0], [0, -16, 290],
      'Two people sit at the table with an open Bible between them.'],
    ['Practice', 'Often the best way to grow is in a safe and loving environment. Practice <strong>talk</strong>ing about spiritual topics, praying, and sharing your faith journey.', 2, [1], [0, -26, 320],
      'The new friend is talking while the first person listens. The view is a little wider.'],
    ['Appropriate Challenge', 'Challenge them with hopeful eyes and say, "I see in you _______." And give them one step to <strong>do</strong> that will help them grow in faith, dependence on God, and personal development.', 4, [2, 3], [0, -18, 365],
      'The mentor slides the open Bible across the table to the friend. The view keeps widening.'],
    ['Encourage', 'Discipleship is not a one-time event. It is a process of sharing, learning, rethinking, praying, and trying new things, all while putting courage into them to <strong>keep on</strong>.', 5, [4], [0, -16, 440],
      'Both people nod. The mentor gives a thumbs-up and speaks words of encouragement. The new friend is now drawn in green. At the edges of the view, other empty tables appear.'],
    ['Send', 'The Kingdom of God is growing because we are regularly Making Space to Multiply Spaces. As we have been sent, so we send. <em>"<strong>Go</strong> therefore and make disciples..."</em> ~ Jesus', 6, [5], [150, -4, 650],
      'The new friend, now green and wearing a backpack, slides to the next table and sits with someone new. Someone new sits down with the first person. Two tables.'],
    ['Teach Others about Growing Together', '<em>"What you have heard from me in the presence of many witnesses entrust to faithful men, who will be able to teach others also."</em> (2 Timothy 2:2)', 6, [], [150, 96, 800],
      'The two newest people turn green, pick up backpacks, and move to two more tables. Four tables now have conversations.'],
    ['Growing Worship', 'We make space to disciple others so more people will <strong>hear the Word, accept it, bear fruit, and multiply</strong> (Mark 4:20). As spaces multiply, so does the worship of God.', 6, [], [150, 0, 1900],
      'The view zooms all the way out to a cafeteria full of round tables. At every table, someone in green sits with someone new.']
  ];
  var WORD = ['S', 'P', 'A', 'C', 'E', 'S'];

  // Tables: four that the story uses, then the rest of the room.
  var tables = [[0, 0], [300, 0], [0, 200], [300, 200]];
  for (var r = -2; r <= 2; r++) {
    for (var c = -2; c <= 3; c++) {
      var x = c * 300, y = r * 200;
      if (!tables.some(function (t) { return t[0] === x && t[1] === y; })) { tables.push([x, y]); }
    }
  }

  function el(name, attrs, parent) {
    var node = document.createElementNS(NS, name);
    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    if (parent) { parent.appendChild(node); }
    return node;
  }

  var svg = el('svg', { xmlns: NS, 'aria-hidden': 'true', preserveAspectRatio: 'xMidYMid meet', viewBox: '0 0 460 290' });
  el('rect', { x: 0, y: 0, width: 460, height: 290, fill: '#fdfdfb' }, svg);
  var world = el('g', { class: 'world' }, svg);
  var furnitureLayer = el('g', {}, world);
  var propLayer = el('g', {}, world);
  var peopleLayer = el('g', {}, world);

  var tableGroups = [];
  tables.forEach(function (t, ti) {
    var cx = t[0], cy = t[1];
    var furniture = el('g', { class: ti === 0 ? '' : 'prop' }, furnitureLayer);
    tableGroups.push(furniture);
    [-1, 1].forEach(function (s) {
      el('path', { class: 'line', 'stroke-width': 2.4, d: 'M' + (cx + s * 116) + ',' + (cy - 34) + ' L' + (cx + s * 116) + ',' + (cy + 64) + ' M' + (cx + s * 116) + ',' + (cy + 22) + ' L' + (cx + s * 74) + ',' + (cy + 22) + ' M' + (cx + s * 78) + ',' + (cy + 22) + ' L' + (cx + s * 78) + ',' + (cy + 64) }, furniture);
    });
    el('path', { class: 'line', 'stroke-width': 2.4, d: 'M' + cx + ',' + (cy + 14) + ' L' + cx + ',' + (cy + 62) }, furniture);
    el('ellipse', { class: 'solid', 'stroke-width': 2.4, cx: cx, cy: cy + 63, rx: 26, ry: 5 }, furniture);
    el('ellipse', { class: 'solid', 'stroke-width': 2.6, cx: cx, cy: cy, rx: 62, ry: 14 }, furniture);
  });

  // Props drawn at a table.
  function book(cx, cy, parent) {
    return el('path', { class: 'solid', 'stroke-width': 2.2, d: 'M' + (cx - 18) + ',' + (cy - 6) + ' Q' + (cx - 9) + ',' + (cy - 12) + ' ' + cx + ',' + (cy - 6) + ' Q' + (cx + 9) + ',' + (cy - 12) + ' ' + (cx + 18) + ',' + (cy - 6) + ' L' + (cx + 18) + ',' + (cy - 15) + ' Q' + (cx + 9) + ',' + (cy - 21) + ' ' + cx + ',' + (cy - 15) + ' Q' + (cx - 9) + ',' + (cy - 21) + ' ' + (cx - 18) + ',' + (cy - 15) + ' Z M' + cx + ',' + (cy - 15) + ' L' + cx + ',' + (cy - 6) }, parent);
  }
  var props = {};
  props.book = el('g', { class: 'prop' }, propLayer);
  book(0, 0, el('g', { class: 'book-slide' }, props.book));
  props.bubble = el('g', { class: 'prop' }, propLayer);
  el('path', { class: 'solid', 'stroke-width': 2.4, d: 'M16,-112 h58 q8,0 8,8 v16 q0,8 -8,8 h-12 l4,10 l-14,-10 h-36 q-8,0 -8,-8 v-16 q0,-8 8,-8 Z' }, props.bubble);
  el('path', { class: 'line', 'stroke-width': 2, d: 'M20,-103 h46 M20,-94 h30' }, props.bubble);
  props.cheer = el('g', { class: 'prop' }, propLayer);
  var cheer = el('g', { transform: 'scale(-1,1)' }, props.cheer);
  el('path', { class: 'solid', 'stroke-width': 2.4, d: 'M16,-112 h58 q8,0 8,8 v16 q0,8 -8,8 h-12 l4,10 l-14,-10 h-36 q-8,0 -8,-8 v-16 q0,-8 8,-8 Z' }, cheer);
  el('path', { class: 'line', 'stroke-width': 2, d: 'M20,-103 h46 M20,-94 h30' }, cheer);
  var books = tables.map(function (t, ti) { if (ti === 0) { return null; } var g = el('g', { class: 'prop' }, propLayer); book(t[0], t[1], g); return g; });

  // A seated person, drawn facing right with the hip at 0,0. Right-side seats are mirrored.
  function person(id) {
    var g = el('g', { class: 'person', 'data-id': id, style: 'opacity:0' }, peopleLayer);
    var body = el('g', { class: 'body' }, g);
    el('rect', { class: 'pack solid', 'stroke-width': 2.2, x: -31, y: -58, width: 17, height: 30, rx: 5 }, body);
    el('path', { class: 'solid', 'stroke-width': 2.6, d: 'M-12,0 L-12,-44 Q-12,-60 2,-60 Q16,-60 15,-44 L13,0 Z' }, body);
    el('path', { class: 'line', 'stroke-width': 2.6, d: 'M0,0 L30,0 L30,42 L38,42' }, body);
    el('path', { class: 'line arm-rest', 'stroke-width': 2.6, d: 'M4,-50 Q20,-36 40,-24' }, body);
    var thumb = el('g', { class: 'arm-thumb' }, body);
    el('path', { class: 'line', 'stroke-width': 2.6, d: 'M4,-50 L22,-38 L46,-42' }, thumb);
    el('rect', { class: 'solid', 'stroke-width': 2.2, x: 46, y: -48, width: 8, height: 11, rx: 2.5 }, thumb);
    el('path', { class: 'line', 'stroke-width': 2.6, d: 'M48,-48 L48,-52' }, thumb);
    var head = el('g', { class: 'head' }, body);
    el('circle', { class: 'solid', 'stroke-width': 2.6, cx: 3, cy: -76, r: 14 }, head);
    return g;
  }

  function seat(tableIndex, side) {
    var t = tables[tableIndex];
    return side === 'L' ? [t[0] - 92, t[1] + 20, 1] : [t[0] + 92, t[1] + 20, -1];
  }

  // People in the story. Everyone else fills the room on the last slide.
  var people = {};
  ['ghost', 'M', 'D', 'N1', 'N2', 'N3', 'N4', 'N5', 'N6'].forEach(function (id) { people[id] = person(id); });
  people.ghost.classList.add('ghost');
  var crowd = [];
  for (var i = 4; i < tables.length; i++) { crowd.push([person('L' + i), i, 'L'], [person('R' + i), i, 'R']); }

  // Where each story person sits on each slide: [table, side, green, backpack].
  function storyState(n) {
    var s = {
      ghost: n === 0 ? [0, 'R', false, false] : null,
      M: [0, 'L', true, true],
      D: n >= 1 ? [n >= 5 ? 1 : 0, n >= 5 ? 'L' : 'R', n >= 4, n >= 5] : null,
      N1: n >= 5 ? [n >= 6 ? 2 : 0, n >= 6 ? 'L' : 'R', n >= 6, n >= 6] : null,
      N2: n >= 5 ? [n >= 6 ? 3 : 1, n >= 6 ? 'L' : 'R', n >= 6, n >= 6] : null,
      N3: n >= 6 ? [0, 'R', false, false] : null,
      N4: n >= 6 ? [1, 'R', false, false] : null,
      N5: n >= 6 ? [2, 'R', false, false] : null,
      N6: n >= 6 ? [3, 'R', false, false] : null
    };
    return s;
  }

  function place(g, spot, show, green, pack, transition) {
    var p = seat(spot[0], spot[1]);
    var t = 'translate(' + p[0] + 'px,' + p[1] + 'px) scale(' + p[2] + ',1)';
    if (!g.getAttribute('data-spot')) {
      // First appearance: put them in their seat without sliding in from the corner.
      g.style.transition = 'none';
      g.style.transform = t;
      g.style.opacity = '0';
      g.getBoundingClientRect();
    }
    g.style.transition = reduceMotion ? 'none' : (transition || '');
    g.style.transform = t;
    g.setAttribute('data-spot', spot.join());
    g.style.opacity = show ? '1' : '0';
    g.classList.toggle('green', !!green);
    g.classList.toggle('packed', !!pack);
  }

  // Camera. The whole drawing moves with one CSS transition per tap, so the
  // lesson page sees a single change and never re-measures mid-animation.
  function setView(v) {
    var k = 460 / v[2];
    world.style.transform = 'translate(230px,145px) scale(' + k + ') translate(' + (-v[0]) + 'px,' + (-v[1]) + 'px)';
  }
  function moveCamera(target) { setView(target); }

  var stage = document.getElementById('stage');
  stage.appendChild(svg);
  world.style.transition = 'none';
  setView(slides[0][4]);
  world.getBoundingClientRect();
  world.style.transition = '';

  var letters = document.getElementById('letters');
  WORD.forEach(function (ch) { var d = document.createElement('div'); d.className = 'letter'; d.textContent = ch; letters.appendChild(d); });
  var progress = document.getElementById('progress');
  slides.forEach(function () { var d = document.createElement('div'); d.className = 'dot'; progress.appendChild(d); });

  var current = 0;
  function show(n) {
    current = (n + slides.length) % slides.length;
    var s = slides[current];
    var st = storyState(current);
    Object.keys(people).forEach(function (id) {
      var g = people[id], v = st[id];
      if (!v) {
        if (g.getAttribute('data-spot')) { g.style.transition = reduceMotion ? 'none' : 'opacity .4s ease'; g.style.opacity = '0'; }
        return;
      }
      var wasHidden = g.style.opacity !== '1';
      var moving = !wasHidden && g.getAttribute('data-spot') !== v[0] + ',' + v[1];
      // On Send and Two Become Four the color changes first, then people slide to new tables, then newcomers sit down.
      var tr = moving ? 'transform 1s ease-in-out .6s, opacity .5s ease' :
        (wasHidden && current >= 5 ? 'transform 0s, opacity .7s ease 1.5s' : 'transform 1s ease-in-out, opacity .6s ease');
      place(g, [v[0], v[1]], true, v[2], v[3], tr);
    });
    crowd.forEach(function (c, k) {
      var on = current === 7;
      place(c[0], [c[1], c[2]], on, c[2] === 'L', c[2] === 'L', on ? 'opacity .6s ease ' + (0.5 + (k % 14) * 0.07).toFixed(2) + 's' : 'opacity .3s ease');
    });
    props.book.classList.toggle('show', current >= 1);
    props.bubble.classList.toggle('show', current === 2);
    props.cheer.classList.toggle('show', current === 4);
    props.book.firstChild.classList.toggle('passed', current >= 3);
    tableGroups.forEach(function (g, ti) { if (ti > 0) { g.classList.toggle('show', current >= 4); } });
    books.forEach(function (g, ti) { if (g) { g.classList.toggle('show', (ti === 1 && current >= 5) || (ti <= 3 && current >= 6) || current === 7); } });
    people.M.classList.toggle('thumb', current === 4);
    people.M.classList.toggle('nod', current === 4);
    people.D.classList.toggle('nod', current === 4);
    moveCamera(s[4]);

    letters.classList.toggle('hidden', current === 0);
    Array.prototype.forEach.call(letters.children, function (d, j) {
      d.classList.toggle('on', j < s[2]);
      d.classList.toggle('now', s[3].indexOf(j) !== -1);
    });
    stage.setAttribute('aria-label', s[5]);
    document.getElementById('title').textContent = s[0];
    document.getElementById('description').innerHTML = s[1];
    document.getElementById('count').textContent = (current + 1) + ' / ' + slides.length;
    Array.prototype.forEach.call(progress.children, function (d, j) { d.classList.toggle('on', j <= current); });
    document.getElementById('prev').disabled = current === 0;
    document.getElementById('next').textContent = current === slides.length - 1 ? 'See it again' : 'Next →';
  }

  // Keep the widget the same height on every slide, so the lesson below never shifts.
  var caption = document.querySelector('.caption');
  var titleEl = document.getElementById('title'), descEl = document.getElementById('description');
  var sizedWidth = 0;
  function steadyCaption() {
    if (caption.clientWidth === sizedWidth) { return; }
    sizedWidth = caption.clientWidth;
    var keepTitle = titleEl.textContent, keepDesc = descEl.innerHTML, tallest = 0;
    caption.style.minHeight = '0px';
    slides.forEach(function (sl) {
      titleEl.textContent = sl[0];
      descEl.innerHTML = sl[1];
      tallest = Math.max(tallest, caption.offsetHeight);
    });
    titleEl.textContent = keepTitle;
    descEl.innerHTML = keepDesc;
    caption.style.minHeight = tallest + 'px';
  }
  window.addEventListener('resize', steadyCaption);

  document.getElementById('prev').addEventListener('click', function () { if (current > 0) { show(current - 1); } });
  document.getElementById('next').addEventListener('click', function () { show(current + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { show(current + 1); }
    if (e.key === 'ArrowLeft' && current > 0) { show(current - 1); }
  });
  show(0);
  steadyCaption();
})();
</script>
</body>
</html>
