<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Farmers, One Field</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700&display=swap');

        :root {
            --green: #1D6B3F;
            --charcoal: #2C2416;
            --marker: #2A2820;
            --ink: #2F2A21;
            --paper: #FFFFFF;
            --board: #FCFAF1;
            --cream: #FAF6EB;
            --border: #E7DECE;
            --muted: #766D60;
            --inactive: #C1B9A8;
            --shadow: 0 10px 26px rgba(44, 36, 22, 0.10);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            background: #F8F6F1;
            color: var(--ink);
            font-family: 'Inter', 'Trebuchet MS', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .widget {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            overflow: hidden;
            background: var(--board);
        }

        @media (max-width: 559px) {
            .widget {
                width: min(100vw, 413px);
                max-width: min(100vw, 413px);
            }
        }

        @media (min-width: 560px) {
            body {
                padding: 16px;
            }

            .widget {
                border: 1px solid #E8DFD0;
                border-radius: 18px;
                box-shadow: var(--shadow);
            }
        }

        .title-bar {
            background: #211D14;
            padding: 7px 14px 8px;
            text-align: center;
        }

        .title-bar h1 {
            margin: 0;
            color: #FBF8F1;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.09em;
            line-height: 1.15;
        }

        .title-bar p {
            margin: 2px 0 0;
            color: #C9C0AC;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .scene-wrap {
            position: relative;
            overflow: hidden;
            height: 290px;
            background: var(--board);
            border-bottom: 1px solid #E5DCCB;
        }

        #scene {
            position: absolute;
            top: 0;
            left: 50%;
            width: 100%;
            height: 290px;
            transform: translateX(-50%);
            transform-origin: top center;
        }

        .scene-svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .intro-overlay {
            position: absolute;
            inset: 0;
            z-index: 12;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
            background: linear-gradient(180deg, rgba(252, 250, 241, 0.30), rgba(252, 250, 241, 0.88));
            pointer-events: none;
            text-align: center;
        }

        .intro-card {
            max-width: 320px;
            padding: 16px 18px 14px;
            border: 1px solid rgba(226, 217, 200, 0.9);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 14px 32px rgba(44, 36, 22, 0.10);
            backdrop-filter: blur(4px);
        }

        .intro-verse {
            margin: 0 0 6px;
            color: var(--charcoal);
            font-family: 'Inter', 'Trebuchet MS', sans-serif;
            font-size: 14.5px;
            font-weight: 600;
            line-height: 1.4;
        }

        .intro-ref {
            margin: 0;
            color: var(--green);
            font-size: 10.5px;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .card-area {
            background: var(--board);
            padding: 10px 12px 10px;
        }

        .verse-card {
            overflow: hidden;
            border: 1px solid #E8DFD0;
            border-radius: 14px;
            background: var(--paper);
            box-shadow: 0 7px 18px rgba(44, 36, 22, 0.07);
            animation: fadeSlide 0.3s ease both;
        }

        .verse-bar {
            height: 4px;
            background: var(--card-color, var(--green));
        }

        .verse-content {
            min-height: 116px;
            padding: 11px 16px 13px;
        }

        .verse-title {
            margin: 0 0 5px;
            color: var(--card-color, var(--green));
            font-family: 'Inter', 'Trebuchet MS', sans-serif;
            font-size: 15.5px;
            font-weight: 800;
            letter-spacing: 0.01em;
            line-height: 1.24;
        }

        .verse-text {
            margin: 0;
            color: #3E3529;
            font-family: Georgia, Cambria, serif;
            font-size: 13px;
            line-height: 1.4;
        }

        .verse-text b {
            color: var(--card-color, var(--green));
            font-weight: 700;
        }

        .card-note {
            display: block;
            margin-top: 6px;
            color: #3E3529;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
            padding: 0 2px;
        }

        .nav-btn {
            min-width: 76px;
            padding: 8px 13px;
            border: 1.5px solid rgba(44, 36, 22, 0.14);
            border-radius: 11px;
            background: #FFFFFF;
            color: var(--charcoal);
            cursor: pointer;
            font-size: 12px;
            font-weight: 800;
            transition: transform 0.18s ease, background 0.18s ease;
        }

        .nav-btn:active {
            transform: translateY(1px);
        }

        .nav-btn.primary {
            min-width: 98px;
            border-color: transparent;
            background: var(--card-color, var(--green));
            color: #FFFFFF;
            box-shadow: 0 5px 13px rgba(44, 36, 22, 0.14);
        }

        .nav-btn.hidden {
            visibility: hidden;
        }

        .dots {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            padding: 0;
            border: 0;
            border-radius: 999px;
            background: rgba(44, 36, 22, 0.20);
            transition: width 0.25s ease, background 0.25s ease;
        }

        .dot.available {
            cursor: pointer;
        }

        .dot.current {
            width: 20px;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
<main class="widget" aria-label="A whiteboard-style diagram of five farmers in five columns, each mapped to an APEST gift, with a field below that fills with seeds and then plants as you progress">
    <header class="title-bar">
        <h1>FIVE FARMERS, ONE FIELD</h1>
        <p>A &middot; P &middot; E &middot; S &middot; T</p>
    </header>

    <section class="scene-wrap" aria-label="A whiteboard sketch of five farmers: Plower, Watcher, Planter, Waterer, Pruner, with a field below that gets plowed, watched, planted, watered, and pruned">
        <div id="scene"></div>
    </section>

    <section class="card-area" id="cardArea" aria-live="polite"></section>
</main>

<script>
(function () {
    var NS = 'http://www.w3.org/2000/svg';
    var W = 460;
    var H = 290;
    var step = -1;
    var baseColor = '#5A4E3C';
    var marker = '#2A2820';
    var faded = '#B6AC97';

    var gardeners = [
        {
            apest: 'Apostle',
            person: 'Plower',
            color: '#9C6F44',
            x: 58,
            title: 'The Plower &rarr; Apostle',
            verse: 'The Plower <b>breaks up hard ground</b> so something new can grow.',
            note: 'The <b>Apostle</b> is the sent one, a pioneer who pushes the church into new places and starts what has not yet begun.'
        },
        {
            apest: 'Prophet',
            person: 'Watcher',
            color: '#C9A23A',
            x: 148,
            title: 'The Watcher &rarr; Prophet',
            verse: 'The Watcher <b>reads the sky and the soil</b> to know the season, and watches for the enemy who wants to ruin the crop.',
            note: 'The <b>Prophet</b> listens to God for today, warns the church against the enemy, and calls people back to His heart.'
        },
        {
            apest: 'Evangelist',
            person: 'Planter',
            color: '#5C8A3C',
            x: 232,
            title: 'The Planter &rarr; Evangelist',
            verse: 'The Planter <b>scatters seed wide</b> across the prepared ground.',
            note: 'The <b>Evangelist</b> tells the good news of Jesus, draws people toward Christ, and grows the family of God.'
        },
        {
            apest: 'Shepherd',
            person: 'Waterer',
            color: '#4D88B8',
            x: 314,
            title: 'The Waterer &rarr; Shepherd',
            verse: 'The Waterer <b>keeps young plants alive</b> so they do not wither in the heat.',
            note: 'The <b>Shepherd</b> cares for the flock, protects the hurting, and walks with people so faith stays alive.'
        },
        {
            apest: 'Teacher',
            person: 'Pruner',
            color: '#C85A56',
            x: 400,
            title: 'The Pruner &rarr; Teacher',
            verse: 'The Pruner <b>cuts away deadwood</b> so the fruit grows strong.',
            note: 'The <b>Teacher</b> grounds the church in Scripture, explains truth plainly, and forms people in the Word.'
        }
    ];

    function svgEl(tag, attrs) {
        var el = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach(function (key) {
            el.setAttribute(key, attrs[key]);
        });
        return el;
    }

    function hexToRgba(hex, alpha) {
        var clean = hex.replace('#', '');
        var num = parseInt(clean, 16);
        var r = (num >> 16) & 255;
        var g = (num >> 8) & 255;
        var b = num & 255;
        return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
    }

    function currentColor() {
        return step === -1 ? baseColor : gardeners[step].color;
    }

    function colorForStage(stageIdx) {
        if (stageIdx === step) return gardeners[stageIdx].color;
        return marker;
    }

    // ---------- COLUMN HEADERS ----------

    function buildColumnHeaders(svg) {
        var apestY = 22;
        var personY = 44;

        gardeners.forEach(function (g, idx) {
            var active = idx === step;

            // APEST label (sans-serif uppercase, tracked; 30% bigger when active)
            var apest = svgEl('text', {
                x: g.x,
                y: apestY,
                'text-anchor': 'middle',
                'font-family': 'Inter, Trebuchet MS, sans-serif',
                'font-size': active ? 13.65 : 10.5,
                'font-weight': 800,
                fill: active ? g.color : faded,
                'letter-spacing': '0.14em'
            });
            apest.textContent = g.apest.toUpperCase();
            svg.appendChild(apest);

            // Person label (sans-serif, standard weight)
            var person = svgEl('text', {
                x: g.x,
                y: personY,
                'text-anchor': 'middle',
                'font-family': 'Inter, Trebuchet MS, sans-serif',
                'font-size': 13,
                'font-weight': 700,
                fill: active ? g.color : marker,
                opacity: active ? 1 : 0.75,
                'letter-spacing': '0.02em'
            });
            person.textContent = g.person;
            svg.appendChild(person);
        });
    }

    // ---------- ICONS ----------

    function drawPlowIcon(svg, cx, cy, color, active) {
        var s = active ? 2.4 : 2;
        var g = svgEl('g', {
            stroke: color, 'stroke-width': s,
            'stroke-linecap': 'round', 'stroke-linejoin': 'round',
            fill: 'none'
        });
        // Two handles going up-right from the blade
        g.appendChild(svgEl('line', { x1: cx - 12, y1: cy + 4, x2: cx + 10, y2: cy - 16 }));
        g.appendChild(svgEl('line', { x1: cx - 6, y1: cy + 4, x2: cx + 16, y2: cy - 16 }));
        // Hand grips
        g.appendChild(svgEl('line', { x1: cx + 10, y1: cy - 16, x2: cx + 14, y2: cy - 19 }));
        g.appendChild(svgEl('line', { x1: cx + 16, y1: cy - 16, x2: cx + 20, y2: cy - 19 }));
        // Square plow head
        g.appendChild(svgEl('rect', {
            x: cx - 14, y: cy + 4, width: 14, height: 14,
            fill: active ? color : 'none',
            stroke: color
        }));
        svg.appendChild(g);
    }

    function drawCloudIcon(svg, cx, cy, color, active) {
        // Partly sunny: sun peeking out from behind a cloud
        var s = active ? 2.4 : 2;
        var g = svgEl('g', {
            stroke: color, 'stroke-width': s,
            'stroke-linecap': 'round', 'stroke-linejoin': 'round',
            fill: 'none'
        });

        // Sun in upper right
        var sunCx = cx + 7, sunCy = cy - 12, sunR = 6;
        g.appendChild(svgEl('circle', {
            cx: sunCx, cy: sunCy, r: sunR,
            fill: active ? hexToRgba(color, 0.18) : 'none',
            stroke: color, 'stroke-width': s
        }));
        // Sun rays spreading around the visible portion of the sun
        // (cloud covers the lower-left, so rays span from upper-left through to lower-right)
        var rays = [-150, -120, -90, -60, -30, 0, 30];
        rays.forEach(function (ang) {
            var rad = (ang * Math.PI) / 180;
            var x1 = sunCx + Math.cos(rad) * (sunR + 2);
            var y1 = sunCy + Math.sin(rad) * (sunR + 2);
            var x2 = sunCx + Math.cos(rad) * (sunR + 7.5);
            var y2 = sunCy + Math.sin(rad) * (sunR + 7.5);
            g.appendChild(svgEl('line', {
                x1: x1, y1: y1, x2: x2, y2: y2,
                stroke: color, 'stroke-width': s, 'stroke-linecap': 'round'
            }));
        });

        // Cloud body in front of sun's lower-left
        g.appendChild(svgEl('path', {
            d: 'M ' + (cx - 16) + ' ' + (cy + 6) +
               ' C ' + (cx - 20) + ' ' + (cy + 3) + ', ' + (cx - 20) + ' ' + (cy - 6) + ', ' + (cx - 11) + ' ' + (cy - 5) +
               ' C ' + (cx - 9) + ' ' + (cy - 12) + ', ' + (cx + 4) + ' ' + (cy - 11) + ', ' + (cx + 7) + ' ' + (cy - 4) +
               ' C ' + (cx + 16) + ' ' + (cy - 4) + ', ' + (cx + 17) + ' ' + (cy + 6) + ', ' + (cx + 10) + ' ' + (cy + 6) +
               ' Z',
            fill: active ? hexToRgba(color, 0.85) : 'white',
            stroke: color, 'stroke-width': s
        }));
        svg.appendChild(g);
    }

    function drawSeedIcon(svg, cx, cy, color, active) {
        // Three seed teardrops
        var g = svgEl('g', {
            stroke: color, 'stroke-width': 1.5,
            'stroke-linecap': 'round', 'stroke-linejoin': 'round',
            fill: active ? color : 'none'
        });
        var seeds = [
            { x: cx - 10, y: cy + 3, rot: -28 },
            { x: cx, y: cy - 6, rot: -4 },
            { x: cx + 11, y: cy + 3, rot: 24 }
        ];
        seeds.forEach(function (s) {
            g.appendChild(svgEl('path', {
                d: 'M 0 -6 C 4.5 -6, 5 0, 0 6 C -5 0, -4.5 -6, 0 -6 Z',
                transform: 'translate(' + s.x + ',' + s.y + ') rotate(' + s.rot + ')',
                fill: active ? color : 'none',
                stroke: color
            }));
        });
        svg.appendChild(g);
    }

    function drawWaterIcon(svg, cx, cy, color, active) {
        // Line-art watering can with D-handle on top, thumb hook on the front (left),
        // and a long spout with a flared rosette tip. Tilted to pour out to the left.
        var s = active ? 2.4 : 2;
        var tilt = -22;
        var g = svgEl('g', {
            stroke: color, 'stroke-width': s,
            'stroke-linecap': 'round', 'stroke-linejoin': 'round',
            fill: 'none',
            transform: 'rotate(' + tilt + ' ' + cx + ' ' + cy + ')'
        });
        // Can body: rounded rectangle (outline only)
        g.appendChild(svgEl('rect', {
            x: cx - 12, y: cy - 9, width: 24, height: 20, rx: 3,
            fill: 'none', stroke: color, 'stroke-width': s
        }));
        // Main carrying handle: D-shape arc over the top
        g.appendChild(svgEl('path', {
            d: 'M ' + (cx - 7) + ' ' + (cy - 9) +
               ' C ' + (cx - 7) + ' ' + (cy - 19) + ', ' +
               (cx + 5) + ' ' + (cy - 19) + ', ' +
               (cx + 5) + ' ' + (cy - 9),
            fill: 'none', stroke: color, 'stroke-width': s
        }));
        // Small thumb hook on top-RIGHT (back, opposite side from the spout)
        g.appendChild(svgEl('path', {
            d: 'M ' + (cx + 12) + ' ' + (cy - 6) +
               ' C ' + (cx + 19) + ' ' + (cy - 9) + ', ' +
               (cx + 19) + ' ' + (cy - 1) + ', ' +
               (cx + 12) + ' ' + (cy - 1),
            fill: 'none', stroke: color, 'stroke-width': s
        }));
        // Long thin spout with flared rosette tip (single outlined shape)
        g.appendChild(svgEl('path', {
            d: 'M ' + (cx - 12) + ' ' + (cy + 3) +
               ' L ' + (cx - 22) + ' ' + (cy + 5) +
               ' L ' + (cx - 27) + ' ' + (cy + 1) +
               ' L ' + (cx - 27) + ' ' + (cy + 14) +
               ' L ' + (cx - 22) + ' ' + (cy + 12) +
               ' L ' + (cx - 12) + ' ' + (cy + 9) + ' Z',
            fill: 'none', stroke: color, 'stroke-width': s
        }));
        svg.appendChild(g);

        // Water drops streaming down from the rotated spout opening
        if (active) {
            // After -22 deg rotation, flared opening center (cx-27, cy+7.5) lands at:
            // x' = cx + (-27)*cos(22°) - (7.5)*sin(-22°) ≈ cx - 22
            // y' = cy + (-27)*sin(-22°) + (7.5)*cos(22°) ≈ cy + 17
            var tipX = cx - 22;
            var tipY = cy + 17;
            var drops = [
                { x: tipX - 1, y: tipY + 5 },
                { x: tipX - 3, y: tipY + 10 },
                { x: tipX + 1, y: tipY + 15 }
            ];
            drops.forEach(function (d) {
                svg.appendChild(svgEl('path', {
                    d: 'M ' + d.x + ' ' + d.y +
                       ' C ' + (d.x - 2) + ' ' + (d.y + 2) + ', ' +
                       (d.x - 2) + ' ' + (d.y + 5) + ', ' +
                       d.x + ' ' + (d.y + 5) +
                       ' C ' + (d.x + 2) + ' ' + (d.y + 5) + ', ' +
                       (d.x + 2) + ' ' + (d.y + 2) + ', ' +
                       d.x + ' ' + d.y + ' Z',
                    fill: color,
                    stroke: 'none',
                    opacity: 0.78
                }));
            });
        }
    }

    function drawShearsIcon(svg, cx, cy, color, active) {
        var s = active ? 2.4 : 2;
        var g = svgEl('g', {
            stroke: color, 'stroke-width': s,
            'stroke-linecap': 'round', 'stroke-linejoin': 'round',
            fill: 'none'
        });
        // Left blade: from right handle area through pivot up to top-left tip
        g.appendChild(svgEl('path', {
            d: 'M ' + (cx + 6) + ' ' + (cy + 4) +
               ' L ' + cx + ' ' + (cy - 1) +
               ' L ' + (cx - 11) + ' ' + (cy - 16)
        }));
        // Right blade
        g.appendChild(svgEl('path', {
            d: 'M ' + (cx - 6) + ' ' + (cy + 4) +
               ' L ' + cx + ' ' + (cy - 1) +
               ' L ' + (cx + 11) + ' ' + (cy - 16)
        }));
        // Pivot
        g.appendChild(svgEl('circle', {
            cx: cx, cy: cy - 1, r: 2,
            fill: color, stroke: color
        }));
        // Finger-hole handles (ovals)
        g.appendChild(svgEl('ellipse', {
            cx: cx - 9, cy: cy + 12, rx: 6, ry: 4,
            transform: 'rotate(-18 ' + (cx - 9) + ' ' + (cy + 12) + ')',
            fill: active ? hexToRgba(color, 0.15) : 'none',
            stroke: color
        }));
        g.appendChild(svgEl('ellipse', {
            cx: cx + 9, cy: cy + 12, rx: 6, ry: 4,
            transform: 'rotate(18 ' + (cx + 9) + ' ' + (cy + 12) + ')',
            fill: active ? hexToRgba(color, 0.15) : 'none',
            stroke: color
        }));
        svg.appendChild(g);
    }

    var iconDrawFns = [drawPlowIcon, drawCloudIcon, drawSeedIcon, drawWaterIcon, drawShearsIcon];

    function buildIcons(svg) {
        var iconY = 117;
        gardeners.forEach(function (g, idx) {
            if (idx > step) return;
            var color = colorForStage(idx);
            var active = idx === step;
            // Wrap each icon in a group scaled 1.3x around its own center
            var iconGroup = svgEl('g', {
                transform: 'translate(' + g.x + ' ' + iconY + ') scale(1.3) translate(' + (-g.x) + ' ' + (-iconY) + ')'
            });
            svg.appendChild(iconGroup);
            iconDrawFns[idx](iconGroup, g.x, iconY, color, active);
        });
    }

    // ---------- FIELD ----------

    function drawFieldLines(svg) {
        // Three closer-spaced hand-drawn field rows
        var lines = [
            'M 24 175 C 100 172, 220 178, 340 173 C 380 171, 420 174, 436 173',
            'M 22 210 C 96 213, 210 207, 322 211 C 370 213, 410 211, 438 212',
            'M 26 245 C 110 242, 230 248, 320 244 C 380 242, 418 245, 432 244'
        ];
        lines.forEach(function (d) {
            svg.appendChild(svgEl('path', {
                d: d,
                fill: 'none',
                stroke: marker,
                'stroke-width': 1.8,
                'stroke-linecap': 'round',
                opacity: 0.55
            }));
        });
    }

    // Plant/seed positions scattered across rows 2 and 3 of the field
    // (Row 1 is the top boundary; plants from rows 2 and 3 reach up between rows)
    var fieldPositions = [
        { x: 160, y: 210 },
        { x: 230, y: 210 },
        { x: 304, y: 210 },
        { x: 196, y: 245 },
        { x: 270, y: 245 },
        { x: 340, y: 245 }
    ];

    function drawSeedsInField(svg, color) {
        fieldPositions.forEach(function (p) {
            svg.appendChild(svgEl('ellipse', {
                cx: p.x, cy: p.y, rx: 3.6, ry: 2.6,
                fill: color, stroke: color, 'stroke-width': 1.4
            }));
        });
    }

    function drawPlantsInField(svg, color) {
        var strokeWidth = color === marker ? 1.8 : 2.2;
        fieldPositions.forEach(function (p) {
            var px = p.x, py = p.y;
            // Seed/bulb at base in soil
            svg.appendChild(svgEl('circle', {
                cx: px, cy: py + 4, r: 3,
                fill: color, stroke: color
            }));
            // Stem rising upward
            svg.appendChild(svgEl('path', {
                d: 'M ' + px + ' ' + (py + 2) +
                   ' C ' + (px + 1) + ' ' + (py - 5) + ', ' +
                   (px - 1) + ' ' + (py - 12) + ', ' +
                   px + ' ' + (py - 18),
                fill: 'none',
                stroke: color,
                'stroke-width': strokeWidth,
                'stroke-linecap': 'round'
            }));
            // Left leaf
            svg.appendChild(svgEl('path', {
                d: 'M ' + px + ' ' + (py - 11) +
                   ' C ' + (px - 7) + ' ' + (py - 13) + ', ' +
                   (px - 9) + ' ' + (py - 18) + ', ' +
                   (px - 3) + ' ' + (py - 18) +
                   ' C ' + (px - 2) + ' ' + (py - 14) + ', ' +
                   (px - 1) + ' ' + (py - 12) + ', ' +
                   px + ' ' + (py - 11) + ' Z',
                fill: 'none',
                stroke: color,
                'stroke-width': strokeWidth,
                'stroke-linecap': 'round',
                'stroke-linejoin': 'round'
            }));
            // Right leaf
            svg.appendChild(svgEl('path', {
                d: 'M ' + px + ' ' + (py - 15) +
                   ' C ' + (px + 7) + ' ' + (py - 17) + ', ' +
                   (px + 9) + ' ' + (py - 22) + ', ' +
                   (px + 3) + ' ' + (py - 22) +
                   ' C ' + (px + 2) + ' ' + (py - 18) + ', ' +
                   (px + 1) + ' ' + (py - 16) + ', ' +
                   px + ' ' + (py - 15) + ' Z',
                fill: 'none',
                stroke: color,
                'stroke-width': strokeWidth,
                'stroke-linecap': 'round',
                'stroke-linejoin': 'round'
            }));
        });
    }

    function buildField(svg) {
        drawFieldLines(svg);

        if (step === 2) {
            drawSeedsInField(svg, gardeners[2].color);
        }
        if (step >= 3) {
            drawPlantsInField(svg, step === 3 ? gardeners[3].color : marker);
        }
    }

    // ---------- BUILD ----------

    function buildDivider(svg) {
        svg.appendChild(svgEl('line', {
            x1: 28, y1: 138, x2: 432, y2: 138,
            stroke: '#D7CCB3',
            'stroke-width': 1.2,
            'stroke-dasharray': '3,4',
            'stroke-linecap': 'round'
        }));
    }

    function buildIntro(container) {
        if (step !== -1) return;
        var overlay = document.createElement('div');
        overlay.className = 'intro-overlay';
        overlay.innerHTML =
            '<div class="intro-card">' +
                '<p class="intro-verse">"He gave the apostles, the prophets, the evangelists, the shepherds and teachers, to equip the saints for the work of ministry."</p>' +
                '<p class="intro-ref">Ephesians 4:11-12</p>' +
            '</div>';
        container.appendChild(overlay);
    }

    function buildScene() {
        var sceneWrap = document.querySelector('.scene-wrap');
        var oldOverlay = sceneWrap.querySelector('.intro-overlay');
        if (oldOverlay) oldOverlay.remove();

        var scene = document.getElementById('scene');
        scene.innerHTML = '';

        var svg = svgEl('svg', {
            class: 'scene-svg',
            viewBox: '0 0 ' + W + ' ' + H,
            role: 'img',
            'aria-label': 'A whiteboard sketch of five farmers labeled with APEST gifts and a field below that grows seeds and then plants'
        });

        buildColumnHeaders(svg);
        buildIcons(svg);
        buildField(svg);
        scene.appendChild(svg);

        buildIntro(sceneWrap);
    }

    function buildCard() {
        var area = document.getElementById('cardArea');
        var color = currentColor();
        area.innerHTML = '';
        area.style.setProperty('--card-color', color);

        var card = document.createElement('div');
        card.className = 'verse-card';
        card.innerHTML = '<div class="verse-bar"></div>';

        var content = document.createElement('div');
        content.className = 'verse-content';

        var title = document.createElement('h2');
        title.className = 'verse-title';
        var text = document.createElement('p');
        text.className = 'verse-text';

        if (step === -1) {
            title.textContent = 'Five Farmers, One Field';
            text.innerHTML = 'Jesus gave His Church five kinds of gifts so the whole body could do the work of ministry. Step through five farmers: Plower, Watcher, Planter, Waterer, Pruner. Each one is a picture of one APEST gift.';
            content.appendChild(title);
            content.appendChild(text);
        } else {
            var g = gardeners[step];
            title.innerHTML = g.title;
            text.innerHTML = g.verse + '<span class="card-note">' + g.note + '</span>';
            content.appendChild(title);
            content.appendChild(text);
        }

        card.appendChild(content);
        area.appendChild(card);
        area.appendChild(buildNav());
    }

    function buildNav() {
        var nav = document.createElement('div');
        nav.className = 'nav';

        var back = document.createElement('button');
        back.type = 'button';
        back.className = 'nav-btn' + (step === -1 ? ' hidden' : '');
        back.innerHTML = '&larr; Back';
        back.addEventListener('click', function () {
            if (step > -1) {
                step -= 1;
                render();
            }
        });
        nav.appendChild(back);

        var dots = document.createElement('div');
        dots.className = 'dots';
        gardeners.forEach(function (g, idx) {
            var dot = document.createElement('button');
            dot.type = 'button';
            dot.className = 'dot';
            dot.setAttribute('aria-label', 'Go to ' + g.person);
            if (idx <= step) {
                dot.classList.add('available');
                dot.style.background = idx === step ? g.color : hexToRgba(g.color, 0.42);
                dot.addEventListener('click', function () {
                    step = idx;
                    render();
                });
            }
            if (idx === step) dot.classList.add('current');
            dots.appendChild(dot);
        });
        nav.appendChild(dots);

        var next = document.createElement('button');
        next.type = 'button';
        next.className = 'nav-btn primary';
        next.style.background = currentColor();
        if (step === -1) {
            next.innerHTML = 'Begin &rarr;';
        } else if (step === gardeners.length - 1) {
            next.innerHTML = '&#8635; Restart';
        } else {
            next.innerHTML = 'Next &rarr;';
        }
        next.addEventListener('click', function () {
            if (step === -1) {
                step = 0;
            } else if (step === gardeners.length - 1) {
                step = -1;
            } else {
                step += 1;
            }
            render();
        });
        nav.appendChild(next);

        return nav;
    }

    function render() {
        document.documentElement.style.setProperty('--card-color', currentColor());
        buildScene();
        buildCard();
    }

    render();
}());
</script>
</body>
</html>
