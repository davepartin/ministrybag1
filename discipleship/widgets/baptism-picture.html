<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Baptism Pictures</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --ink: #2C2416;
  --muted: #6E6557;
  --border: #EBE5D9;
  --tray: #F6F4EE;
  --bg: #F8F6F1;
  --rust: #9B3B2A;
  --rust-dark: #822F21;
  --slate: #4A6B8B;
  --slate-dark: #385570;
  --green: #1D6B3F;
  --green-dark: #165531;
  --gold: #946B06;
  --gold-dark: #7A5804;
  --water: #2A7FA8;
}

body {
  font-family: Georgia, Cambria, serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  margin: 0;
  padding: 0;
}

.widget-outer {
  background: #FFFFFF;
  width: 100%;
  max-width: 100%;
  margin: 0;
  overflow: hidden;
  border: none;
  border-radius: 0;
  box-shadow: none;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: var(--bg);
  }
  .widget-outer {
    max-width: 460px;
    margin: 0 auto;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
  }
}

.title-bar {
  background: var(--ink);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  text-align: left;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  background: #FFFFFF;
  padding: 6px 6px 2px;
}

#baptism-svg {
  display: block;
  width: 100%;
  height: auto;
}

.svg-sans {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.svg-serif {
  font-family: Georgia, Cambria, serif;
}

.fade-part {
  opacity: 0;
  transition: opacity 0.35s ease;
}

.fade-part.is-on {
  opacity: 1;
}

#new-bank-wash,
#cross-glow,
#tomb-glow,
#union-ray {
  transition: opacity 0.45s ease;
}

#you-fig {
  transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), color 0.35s ease;
}

#tomb-stone {
  transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
}

#baptizer-arms {
  transition: transform 0.45s ease;
}

@media (prefers-reduced-motion: reduce) {
  .fade-part,
  #new-bank-wash,
  #cross-glow,
  #tomb-glow,
  #union-ray,
  #you-fig,
  #tomb-stone,
  #baptizer-arms,
  .step-dot-fill,
  .nav-btn {
    transition: none;
  }
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 6px;
  background: var(--tray);
  border-top: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  border: 0;
  background: transparent;
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
}

.step-dot-fill {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2.4px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 22%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.14);
}

#card-area {
  background: var(--tray);
  padding: 6px 12px 10px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(44, 36, 22, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 13px;
  min-height: var(--card-h, 118px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  --accent-color: var(--step-dark);
}

.verse-card-title {
  font: 700 15px/1.25 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 4px;
}

.verse-card-text {
  font: 13.5px/1.42 Georgia, Cambria, serif;
  color: #3D3426;
  margin: 0;
}

.verse-card-text b {
  color: var(--accent-color, var(--ink));
  font-weight: 700;
}

.verse-card-ref {
  font: 600 11.5px/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  margin: 5px 0 0;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  appearance: none;
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: #4D4334;
  font: 600 13.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.nav-btn.primary {
  background: var(--step-color, var(--ink));
  border-color: var(--step-color, var(--ink));
  color: #FFFFFF;
}

.nav-btn.ghost {
  visibility: hidden;
  pointer-events: none;
}

.step-count {
  font: 600 12.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  text-align: center;
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (max-width: 395px) {
  #card-area {
    padding: 5px 10px 8px;
  }
  .verse-card-content {
    padding: 8px 11px;
  }
  .verse-card-title {
    font-size: 14.5px;
  }
  .verse-card-text {
    font-size: 13px;
  }
  .nav-btn {
    min-width: 88px;
    padding: 10px 12px;
  }
}

#measure {
  position: fixed;
  left: -9999px;
  top: 0;
  visibility: hidden;
  pointer-events: none;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" role="region" aria-label="Interactive Baptism Analogy">
  <div class="title-bar">
    <h1>What Baptism Pictures</h1>
    <span class="course-tag">202-10</span>
  </div>

  <div class="stage">
    <svg id="baptism-svg" viewBox="0 0 380 272" width="100%" role="img" aria-labelledby="bap-title bap-desc">
      <title id="bap-title">What Baptism Pictures</title>
      <desc id="bap-desc">Side-by-side scene showing a baptism pool on the left and Jesus' cross and stone tomb on the right.</desc>

      <defs>
        <radialGradient id="crossGlowGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#9B3B2A" stop-opacity="0.34"/>
          <stop offset="55%" stop-color="#E0A526" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#E0A526" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="tombGlowGrad" cx="50%" cy="55%" r="55%">
          <stop offset="0%" stop-color="#FAF0C8" stop-opacity="0.98"/>
          <stop offset="45%" stop-color="#F3D98B" stop-opacity="0.62"/>
          <stop offset="100%" stop-color="#E0A526" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="unionBeamGrad" x1="100%" y1="0%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#E0A526" stop-opacity="0.46"/>
          <stop offset="50%" stop-color="#F3D98B" stop-opacity="0.38"/>
          <stop offset="100%" stop-color="#E0A526" stop-opacity="0.16"/>
        </linearGradient>
        <clipPath id="tombStoneClip">
          <circle cx="0" cy="0" r="23"/>
        </clipPath>
      </defs>

      <!-- Top Parallel Column Headers + Center Union Badge -->
      <g id="column-headers">
        <rect x="26" y="7" width="136" height="23" rx="11.5" fill="#EBF4F9" stroke="#C5DFEC" stroke-width="1"/>
        <text class="svg-sans" x="94" y="22.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2A7FA8">Your Baptism</text>

        <rect x="218" y="7" width="136" height="23" rx="11.5" fill="#F5EFE3" stroke="#DFD4BE" stroke-width="1"/>
        <text class="svg-sans" x="286" y="22.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6F4C24">What Jesus Did</text>

        <line x1="190" y1="36" x2="190" y2="254" stroke="#E4DED2" stroke-width="1.4" stroke-dasharray="4 4"/>

        <g id="link-badge">
          <circle id="link-badge-bg" cx="190" cy="18.5" r="10.5" fill="#FFFFFF" stroke="#D4CFC4" stroke-width="1.5"/>
          <text id="link-badge-txt" class="svg-sans" x="190" y="22.5" text-anchor="middle" font-size="12" font-weight="800" fill="#6E6557">=</text>
        </g>
      </g>

      <!-- ===================== LEFT SIDE: FIXED BAPTISM SETTING ===================== -->
      <g id="baptism-side">
        <!-- Fixed water basin back fill -->
        <polygon points="46,178 142,178 130,224 58,224" fill="#DDF0F8"/>

        <!-- Fixed earth banks around the water pool -->
        <path d="M 10 148 L 46 178 L 58 224 L 130 224 L 142 178 L 178 148 L 178 242 L 10 242 Z" fill="#EDE6D7"/>
        <!-- Inner water carve restored above earth fill -->
        <polygon points="46,178 142,178 130,224 58,224" fill="#D5ECF6"/>

        <!-- Green bloom overlay on right bank for Resurrection / New Life -->
        <path id="new-bank-wash" d="M 130 224 L 142 178 L 178 148 L 178 242 L 130 242 Z" fill="#D6EAD9" opacity="0"/>

        <!-- Crisp bank contour line -->
        <path d="M 10 148 L 46 178 L 58 224 L 130 224 L 142 178 L 178 148" fill="none" stroke="#8C8375" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Tiny green sprout on the far right bank (New Life) -->
        <g id="new-sprout" class="fade-part" transform="translate(170,152)">
          <line x1="0" y1="2" x2="0" y2="-8" stroke="#1D6B3F" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M 0 -5 C -5 -9 -8 -5 -1 -2" fill="#5A9A6B"/>
          <path d="M 0 -7 C 5 -11 8 -7 1 -4" fill="#1D6B3F"/>
        </g>

        <!-- Dashed ghost mark on Old Life slope (Step 1) -->
        <g id="old-shadow" class="fade-part" transform="translate(22,158)" opacity="0">
          <circle cx="0" cy="-31" r="5" fill="none" stroke="#B6AEA0" stroke-width="1.4" stroke-dasharray="2.5 2"/>
          <line x1="0" y1="-25" x2="0" y2="-11" stroke="#B6AEA0" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="2.5 2"/>
          <line x1="0" y1="-11" x2="-4" y2="0" stroke="#B6AEA0" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="0" y1="-11" x2="4" y2="0" stroke="#B6AEA0" stroke-width="2.5" stroke-linecap="round"/>
        </g>

        <!-- Fixed Baptizer standing waist-deep in the water at x=116, y=220 -->
        <g id="baptizer" transform="translate(118,220)">
          <line x1="-4" y1="-18" x2="-5" y2="-2" stroke="#4A6B8B" stroke-width="4.2" stroke-linecap="round"/>
          <line x1="4" y1="-18" x2="5" y2="-2" stroke="#4A6B8B" stroke-width="4.2" stroke-linecap="round"/>
          <line x1="0" y1="-40" x2="0" y2="-18" stroke="#4A6B8B" stroke-width="5.5" stroke-linecap="round"/>
          <circle cx="0" cy="-48" r="6" fill="#4A6B8B"/>
          <g id="baptizer-arms" transform="translate(0,-34)">
            <line x1="0" y1="0" x2="-15" y2="-2" stroke="#4A6B8B" stroke-width="3.6" stroke-linecap="round"/>
            <line x1="0" y1="0" x2="-12" y2="6" stroke="#4A6B8B" stroke-width="3.6" stroke-linecap="round"/>
          </g>
        </g>

        <!-- Hero Person Being Baptized (color driven smoothly by CSS color/currentColor) -->
        <g id="you-fig" transform="translate(24,158)" style="color:#2C2416">
          <g stroke="#FFFFFF" stroke-width="2" paint-order="stroke" stroke-linejoin="round" stroke-linecap="round">
            <circle cx="0" cy="-35" r="6" fill="currentColor"/>
            <line x1="0" y1="-28" x2="0" y2="-13" stroke="currentColor" stroke-width="5.2"/>
            <line x1="0" y1="-24" x2="-7" y2="-16" stroke="currentColor" stroke-width="3.4"/>
            <line x1="0" y1="-24" x2="8" y2="-17" stroke="currentColor" stroke-width="3.4"/>
            <line x1="0" y1="-13" x2="-5" y2="0" stroke="currentColor" stroke-width="3.8"/>
            <line x1="0" y1="-13" x2="5" y2="0" stroke="currentColor" stroke-width="3.8"/>
          </g>
          <!-- Golden inner life motif ("Christ lives in me", shown on Step 4) -->
          <g id="inner-christ" class="fade-part" transform="translate(0,-22)">
            <circle cx="0" cy="0" r="5" fill="#F3D98B" opacity="0.9"/>
            <line x1="0" y1="-3" x2="0" y2="3" stroke="#7A5804" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="-2.2" y1="-0.8" x2="2.2" y2="-0.8" stroke="#7A5804" stroke-width="1.5" stroke-linecap="round"/>
          </g>
        </g>

        <!-- Translucent water overlay layered ON TOP of submerged bodies and baptizer legs -->
        <polygon points="46,178 142,178 130,224 58,224" fill="#A9D5EA" opacity="0.54"/>
        <!-- Crisp top water wave -->
        <path d="M 46 178 Q 70 175 94 178 Q 118 181 142 178" fill="none" stroke="#2A7FA8" stroke-width="2.4" stroke-linecap="round"/>

        <!-- Water surface ripples & burial arc (Step 2) -->
        <g id="water-ripples" class="fade-part" fill="none" stroke="#2A7FA8" stroke-linecap="round">
          <path d="M 62 172 Q 80 168 98 172" stroke-width="1.8"/>
          <path d="M 72 167 Q 86 164 100 167" stroke-width="1.4" opacity="0.7"/>
        </g>

        <!-- Rising splash droplets (Step 3) -->
        <g id="splash-drops" class="fade-part" stroke="#2A7FA8" stroke-width="1.8" stroke-linecap="round" fill="none">
          <path d="M 68 174 Q 62 162 56 158"/>
          <path d="M 96 174 Q 102 162 108 158"/>
          <circle cx="53" cy="154" r="1.4" fill="#2A7FA8" stroke="none"/>
          <circle cx="111" cy="154" r="1.4" fill="#2A7FA8" stroke="none"/>
        </g>

        <!-- Subtle surface ripples stay above translucent pool -->
      </g>

      <!-- ===================== GOLDEN UNION RAY (Step 4) ===================== -->
      <polygon id="union-ray" points="292,154 316,178 166,144 166,126" fill="url(#unionBeamGrad)" opacity="0"/>

      <!-- ===================== RIGHT SIDE: FIXED CROSS & TOMB ===================== -->
      <g id="jesus-side">
        <!-- Warm crimson-amber glow behind Cross (Step 1) -->
        <circle id="cross-glow" cx="242" cy="106" r="50" fill="url(#crossGlowGrad)" opacity="0"/>

        <!-- Golden sunrise glow behind Tomb doorway (Steps 3-4) -->
        <circle id="tomb-glow" cx="318" cy="190" r="62" fill="url(#tombGlowGrad)" opacity="0"/>

        <!-- Fixed Calvary hillside terrain -->
        <path d="M 198 222 Q 242 192 276 196 Q 324 200 368 222 L 368 242 L 198 242 Z" fill="#EAE2D2"/>
        <path d="M 198 222 Q 242 192 276 196 Q 324 200 368 222" fill="none" stroke="#8C8375" stroke-width="2" stroke-linecap="round"/>

        <!-- Fixed Cross on left crest (x=242) -->
        <g id="calvary-cross">
          <line x1="242" y1="74" x2="242" y2="196" stroke="#8A5A2B" stroke-width="9" stroke-linecap="round"/>
          <line x1="217" y1="103" x2="267" y2="103" stroke="#8A5A2B" stroke-width="8.5" stroke-linecap="round"/>
          <!-- Subtle inner warm wood bevel -->
          <line x1="242" y1="76" x2="242" y2="194" stroke="#A67442" stroke-width="2.6" stroke-linecap="round"/>
          <line x1="219" y1="103" x2="265" y2="103" stroke="#A67442" stroke-width="2.4" stroke-linecap="round"/>
        </g>

        <!-- Fixed Rock Tomb mound in hillside (x=276..358) -->
        <g id="tomb-mound">
          <path d="M 278 214 Q 318 150 358 214 Z" fill="#C9C0B0" stroke="#8C8375" stroke-width="1.8" stroke-linejoin="round"/>
          <!-- Tomb arched dark interior -->
          <path id="tomb-mouth" d="M 303 214 L 303 189 A 15 15 0 0 1 333 189 L 333 214 Z" fill="#2C2416"/>
          <!-- Sunrise light beams streaming from empty tomb (Steps 3-4) -->
          <g id="tomb-rays" class="fade-part">
            <path d="M 306 212 L 306 190 A 12 12 0 0 1 330 190 L 330 212 Z" fill="#F6DF98" opacity="0.88"/>
            <line x1="318" y1="168" x2="318" y2="152" stroke="#E0A526" stroke-width="2.2" stroke-linecap="round"/>
            <line x1="302" y1="173" x2="291" y2="161" stroke="#E0A526" stroke-width="2" stroke-linecap="round"/>
            <line x1="334" y1="173" x2="345" y2="161" stroke="#E0A526" stroke-width="2" stroke-linecap="round"/>
            <!-- Folded linen cloth glyph on tomb shelf -->
            <path d="M 311 206 Q 318 202 325 206 L 323 210 L 313 210 Z" fill="#FFFFFF" stroke="#B89B5E" stroke-width="1"/>
          </g>
        </g>

        <!-- Heavy Rolling Stone: sits beside tomb at x=352, or rolls shut over doorway x=318 -->
        <g id="tomb-stone" transform="translate(352,193)">
          <circle cx="0" cy="0" r="23" fill="#B5AC9C" stroke="#7A7162" stroke-width="2"/>
          <g clip-path="url(#tombStoneClip)">
            <path d="M -22 10 Q -2 22 20 8 L 24 24 L -24 24 Z" fill="#9A9181"/>
            <path d="M -16 -9 A 18 18 0 0 1 11 -16" fill="none" stroke="#CCC4B5" stroke-width="2" stroke-linecap="round"/>
          </g>
        </g>
      </g>

      <!-- ===================== BOTTOM PARALLEL STAGE CAPTIONS ===================== -->
      <text id="cap-left" class="svg-sans fade-part" x="94" y="261" text-anchor="middle" font-size="12" font-weight="700" fill="#2C2416"></text>
      <text id="cap-right" class="svg-sans fade-part" x="286" y="261" text-anchor="middle" font-size="12" font-weight="700" fill="#2C2416"></text>
    </svg>
  </div>

  <div class="step-strip" id="step-strip" role="group" aria-label="Baptism steps"></div>
  <div id="card-area" aria-live="polite"></div>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>

      cardTitle: '2. Burial: Buried with Him',
      color: '#4A6B8B',
      dark: '#385570',
      verse: 'Just as Jesus\' body was sealed in the tomb, going under the water pictures burying your old life: <b>"We were buried therefore with him by baptism into death."</b>',
      ref: 'Romans 6:4  |  Colossians 2:12',

    },
    {
      id: 'resurrection',
      dotLabel: 'Step 3: Resurrection - Raised with Christ',
      cardTitle: '3. Resurrection: Raised with Christ',
      color: '#1D6B3F',
      dark: '#165531',
      verse: 'God rolled the stone away and raised Jesus from the dead. Coming up out of the water pictures rising with Him so <b>"we too might walk in newness of life."</b>',
      ref: 'Romans 6:4  |  Colossians 3:1',
      capLeft: 'Raised to Life',
      capRight: 'Stone Rolled Away',
      desc: 'Left: you rise splashing up out of the water as the right bank blooms green. Right: the stone rolls away and golden dawn light pours from the empty tomb.'
    },
    {
      id: 'newlife',
      dotLabel: 'Step 4: New Life - Old Has Gone, New Has Come',
      cardTitle: '4. New Life: Old Has Gone, New Has Come',
      color: '#946B06',
      dark: '#7A5804',
      verse: '<b>"The old has passed away; behold, the new has come."</b> You no longer live for yourself, because <b>Christ lives in you</b>. Now you walk forward belonging to Jesus.',
      ref: '2 Corinthians 5:17  |  Galatians 2:20',
      capLeft: 'Walk in New Life',
      capRight: 'Christ Lives in You',
      desc: 'Right: light from the risen tomb reaches across into your chest as you walk up the green bank in new creation life.'
    }
  ];

  var step = -1;
  var pendingFocus = null;
  var reduceQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

  function el(id) { return document.getElementById(id); }

  function setClass(id, on) {
    var node = el(id);
    if (node) node.classList.toggle('is-on', !!on);
  }

  function applyScene(idx) {
    var data = idx < 0 ? INTRO : stops[idx];
    var fig = el('you-fig');
    var arms = el('baptizer-arms');
    var stone = el('tomb-stone');

    // Sync figure pose, color, baptizer arms, tomb stone, and glows cleanly in parallel
    if (idx < 0) {
      fig.setAttribute('transform', 'translate(24,158)');
      fig.style.color = INK;
      arms.setAttribute('transform', 'translate(0,-34)');
      stone.setAttribute('transform', 'translate(352,193) rotate(0)');
    } else if (idx === 0) {
      // 1. Death: stepping down the left bank toward water, cross glowing on right
      fig.setAttribute('transform', 'translate(42,174) rotate(9)');
      fig.style.color = '#9B3B2A';
      arms.setAttribute('transform', 'translate(0,-34) rotate(-5)');
      stone.setAttribute('transform', 'translate(352,193) rotate(0)');
    } else if (idx === 1) {
      // 2. Burial: reclined under water on left, stone rolled shut over tomb on right
      fig.setAttribute('transform', 'translate(58,202) rotate(78)');
      fig.style.color = '#385570';
      arms.setAttribute('transform', 'translate(0,-34) rotate(-22)');
      stone.setAttribute('transform', 'translate(318,194) rotate(-95)');
    } else if (idx === 2) {
      // 3. Resurrection: rising up out of water on left, stone rolled open & tomb blazing on right
      fig.setAttribute('transform', 'translate(82,192) rotate(0)');
      fig.style.color = '#1D6B3F';
      arms.setAttribute('transform', 'translate(0,-36) rotate(18)');
      stone.setAttribute('transform', 'translate(354,193) rotate(12)');
    } else {
      // 4. New Life: walking up blossoming far bank with Christ light within
      fig.setAttribute('transform', 'translate(160,154) rotate(0)');
      fig.style.color = '#1D6B3F';
      arms.setAttribute('transform', 'translate(0,-34) rotate(12)');
      stone.setAttribute('transform', 'translate(354,193) rotate(12)');
    }

    el('old-shadow').style.opacity = idx === 0 ? '1' : '0';
    setClass('water-ripples', idx === 1);
    setClass('splash-drops', idx === 2);
    setClass('inner-christ', idx === 3);
    setClass('new-sprout', idx >= 2);
    el('new-bank-wash').setAttribute('opacity', idx >= 2 ? '1' : '0');

    el('cross-glow').setAttribute('opacity', idx === 0 ? '1' : '0');
    el('tomb-glow').setAttribute('opacity', idx >= 2 ? '1' : '0');
    setClass('tomb-rays', idx >= 2);
    el('union-ray').setAttribute('opacity', idx === 3 ? '1' : '0');

    // Bottom parallel labels
    var capL = el('cap-left');
    var capR = el('cap-right');
    capL.textContent = data.capLeft;
    capR.textContent = data.capRight;
    capL.setAttribute('fill', data.dark);
    capR.setAttribute('fill', data.dark);
    setClass('cap-left', idx >= 0);
    setClass('cap-right', idx >= 0);

    // Center equality badge tint
    var badgeBg = el('link-badge-bg');
    var badgeTxt = el('link-badge-txt');
    if (idx < 0) {
      badgeBg.setAttribute('fill', '#FFFFFF');
      badgeBg.setAttribute('stroke', '#D4CFC4');
      badgeTxt.setAttribute('fill', '#6E6557');
    } else {
      badgeBg.setAttribute('fill', data.color);
      badgeBg.setAttribute('stroke', data.color);
      badgeTxt.setAttribute('fill', '#FFFFFF');
    }

    el('bap-desc').textContent = data.desc;
  }

  function renderDots() {
    var strip = el('step-strip');
    strip.innerHTML = '';

    var items = [{ color: INK, label: INTRO.dotLabel, idx: -1 }];
    for (var i = 0; i < stops.length; i++) {
      items.push({ color: stops[i].color, label: stops[i].dotLabel, idx: i });
    }

    for (var j = 0; j < items.length; j++) {
      var item = items[j];
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'step-dot';
      if (item.idx === step) btn.classList.add('active');
      else if (step >= 0 && item.idx >= 0 && item.idx < step) btn.classList.add('passed');
      btn.style.setProperty('--dot-color', item.color);
      btn.setAttribute('aria-label', item.label);
      btn.setAttribute('aria-pressed', item.idx === step ? 'true' : 'false');
      (function (targetIdx) {
        btn.addEventListener('click', function () { goTo(targetIdx); });
      })(item.idx);

      var fill = document.createElement('span');
      fill.className = 'step-dot-fill';
      fill.setAttribute('aria-hidden', 'true');
      btn.appendChild(fill);
      strip.appendChild(btn);
    }
  }

  function buildCardMarkup(d) {
    return '<div class="verse-card" style="--step-color:' + d.color + ';--step-dark:' + d.dark + '">'
      + '<div class="verse-card-bar"></div>'
      + '<div class="verse-card-content">'
      + '<p class="verse-card-title">' + d.cardTitle + '</p>'
      + '<p class="verse-card-text">' + d.verse + '</p>'
      + (d.ref ? '<p class="verse-card-ref">' + d.ref + '</p>' : '')
      + '</div></div>';
  }

  function renderCard() {
    var area = el('card-area');
    var data = step < 0 ? INTRO : stops[step];
    var isIntro = step < 0;
    var isLast = step === stops.length - 1;

    var backHtml = isIntro
      ? '<button type="button" class="nav-btn ghost" disabled aria-hidden="true" tabindex="-1">Back</button>'
      : '<button type="button" class="nav-btn" id="btn-back">&#8592; Back</button>';

    var countText = isIntro ? 'Ready' : (step + 1) + ' of ' + stops.length;

    var nextHtml = isIntro
      ? '<button type="button" class="nav-btn primary" id="btn-next" style="--step-color:' + data.color + '">Begin &#8594;</button>'
      : (isLast
          ? '<button type="button" class="nav-btn primary" id="btn-next" style="--step-color:' + data.color + '">&#8635; Start Over</button>'
          : '<button type="button" class="nav-btn primary" id="btn-next" style="--step-color:' + data.color + '">Next &#8594;</button>');

    area.innerHTML = buildCardMarkup(data)
      + '<div class="nav-bar">' + backHtml + '<span class="step-count">' + countText + '</span>' + nextHtml + '</div>';

    var backBtn = el('btn-back');
    if (backBtn) {
      backBtn.addEventListener('click', function () {
        pendingFocus = 'back';
        goTo(step - 1);
      });
    }

    var nextBtn = el('btn-next');
    nextBtn.addEventListener('click', function () {
      pendingFocus = 'next';
      if (isLast) goTo(-1);
      else goTo(step + 1);
    });

    if (pendingFocus) {
      var target = pendingFocus === 'back' ? backBtn : nextBtn;
      pendingFocus = null;
      if (target) target.focus();
    }

    el('status').textContent = (isIntro ? 'Intro: ' : 'Step ' + (step + 1) + ' of ' + stops.length + ': ') + data.cardTitle;
  }

  function fitCards() {
    var outer = el('widget');
    var measure = el('measure');
    if (!measure) {
      measure = document.createElement('div');
      measure.id = 'measure';
      document.body.appendChild(measure);
    }
    var width = Math.min(outer.clientWidth || 436, 460) - 24;
    if (width < 200) width = 320;
    measure.style.width = width + 'px';

    var all = [INTRO].concat(stops);
    var maxH = 0;
    for (var i = 0; i < all.length; i++) {
      measure.innerHTML = buildCardMarkup(all[i]).replace('min-height: var(--card-h, 118px)', 'min-height: 0');
      var content = measure.querySelector('.verse-card-content');
      if (content) content.style.minHeight = '0px';
      var h = content ? content.offsetHeight : 0;
      if (h > maxH) maxH = h;
    }
    if (maxH > 0) {
      document.documentElement.style.setProperty('--card-h', Math.ceil(maxH) + 'px');
    }
    measure.innerHTML = '';
  }

  function goTo(target) {
    step = target;
    applyScene(step);
    renderDots();
    renderCard();
  }

  var lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth !== lastW) {
      lastW = window.innerWidth;
      fitCards();
    }
  });

  if (reduceQuery && reduceQuery.matches) {
    document.documentElement.classList.add('reduced-motion');
  }

  fitCards();
  goTo(-1);
})();
</script>
</body>
</html>
