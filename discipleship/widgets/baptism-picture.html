<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Baptism Pictures</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --ink: #2C2416;
  --muted: #6E6557;
  --border: #EBE5D9;
  --tray: #F6F4EE;
  --bg: #F8F6F1;
  --rust: #9B3B2A;
  --rust-dark: #822F21;
  --slate: #4A6B8B;
  --slate-dark: #385570;
  --green: #1D6B3F;
  --green-dark: #165531;
  --gold: #946B06;
  --gold-dark: #7A5804;
  --water: #2A7FA8;
}

body {
  font-family: Georgia, Cambria, serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  margin: 0;
  padding: 0;
}

.widget-outer {
  background: #FFFFFF;
  width: 100%;
  max-width: 100%;
  margin: 0;
  overflow: hidden;
  border: none;
  border-radius: 0;
  box-shadow: none;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: var(--bg);
  }
  .widget-outer {
    max-width: 460px;
    margin: 0 auto;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
  }
}

.title-bar {
  background: var(--ink);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  text-align: left;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  background: #FFFFFF;
  padding: 6px 6px 2px;
}

#baptism-svg {
  display: block;
  width: 100%;
  height: auto;
}

.svg-sans {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.fade-part {
  opacity: 0;
  transition: opacity 0.35s ease;
}

.fade-part.is-on {
  opacity: 1;
}

#new-bank-wash,
#cross-glow,
#tomb-glow,
#union-ray {
  transition: opacity 0.45s ease;
}

#you-fig {
  transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
}

#tomb-stone {
  transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
}

#baptizer-arms {
  transition: transform 0.45s ease;
}

@media (prefers-reduced-motion: reduce) {
  .fade-part,
  #new-bank-wash,
  #cross-glow,
  #tomb-glow,
  #union-ray,
  #you-fig,
  #tomb-stone,
  #baptizer-arms,
  .step-dot-fill,
  .nav-btn {
    transition: none;
  }
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 6px;
  background: var(--tray);
  border-top: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  border: 0;
  background: transparent;
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
}

.step-dot-fill {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2.4px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 22%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.14);
}

#card-area {
  background: var(--tray);
  padding: 6px 12px 10px;
}

.verse-card {
  background: #FFFFFF;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(44, 36, 22, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 13px;
  min-height: var(--card-h, 118px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  --accent-color: var(--step-dark);
}

.verse-card-title {
  font: 700 15px/1.25 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 4px;
}

.verse-card-text {
  font: 13.5px/1.42 Georgia, Cambria, serif;
  color: #3D3426;
  margin: 0;
}

.verse-card-text b {
  color: var(--accent-color, var(--ink));
  font-weight: 700;
}

.verse-card-ref {
  font: 600 11.5px/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  margin: 5px 0 0;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  appearance: none;
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: #FFFFFF;
  color: #4D4334;
  font: 600 13.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.nav-btn.primary {
  background: var(--step-color, var(--ink));
  border-color: var(--step-color, var(--ink));
  color: #FFFFFF;
}

.nav-btn.ghost {
  visibility: hidden;
  pointer-events: none;
}

.step-count {
  font: 600 12.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  text-align: center;
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (max-width: 395px) {
  #card-area {
    padding: 5px 10px 8px;
  }
  .verse-card-content {
    padding: 8px 11px;
  }
  .verse-card-title {
    font-size: 14.5px;
  }
  .verse-card-text {
    font-size: 13px;
  }
  .nav-btn {
    min-width: 88px;
    padding: 10px 12px;
  }
}

#measure {
  position: fixed;
  left: -9999px;
  top: 0;
  visibility: hidden;
  pointer-events: none;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" role="region" aria-label="Interactive Baptism Analogy">
  <div class="title-bar">
    <h1>What Baptism Pictures</h1>
    <span class="course-tag">202-10</span>
  </div>

  <div class="stage">
    <svg id="baptism-svg" viewBox="0 0 380 272" width="100%" role="img" aria-labelledby="bap-title bap-desc">
      <title id="bap-title">What Baptism Pictures</title>
      <desc id="bap-desc">Side-by-side scene showing your baptism pool on the left and Jesus' tomb and cross on the right.</desc>

      <defs>
        <radialGradient id="crossGlowGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#9B3B2A" stop-opacity="0.34"/>
          <stop offset="55%" stop-color="#E0A526" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#E0A526" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="tombGlowGrad" cx="50%" cy="55%" r="55%">
          <stop offset="0%" stop-color="#FAF0C8" stop-opacity="0.98"/>
          <stop offset="45%" stop-color="#F3D98B" stop-opacity="0.62"/>
          <stop offset="100%" stop-color="#E0A526" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="jesusHaloGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFF5D1" stop-opacity="0.95"/>
          <stop offset="55%" stop-color="#F3D98B" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#E0A526" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="unionBeamGrad" x1="100%" y1="0%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#F3D98B" stop-opacity="0.52"/>
          <stop offset="100%" stop-color="#E0A526" stop-opacity="0.12"/>
        </linearGradient>
        <clipPath id="tombStoneClip">
          <circle cx="0" cy="0" r="20"/>
        </clipPath>
      </defs>

      <!-- Top Parallel Column Headers + Center Union Badge -->
      <g id="column-headers">
        <rect x="26" y="7" width="136" height="23" rx="11.5" fill="#EBF4F9" stroke="#C5DFEC" stroke-width="1"/>
        <text class="svg-sans" x="94" y="22.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2A7FA8">Your Baptism</text>

        <rect x="218" y="7" width="136" height="23" rx="11.5" fill="#F5EFE3" stroke="#DFD4BE" stroke-width="1"/>
        <text class="svg-sans" x="286" y="22.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6F4C24">What Jesus Did</text>

        <line x1="190" y1="36" x2="190" y2="246" stroke="#DFD9CD" stroke-width="1.5" stroke-dasharray="4 4"/>

        <g id="link-badge">
          <circle id="link-badge-bg" cx="190" cy="18.5" r="10.5" fill="#FFFFFF" stroke="#D4CFC4" stroke-width="1.5"/>
          <text id="link-badge-txt" class="svg-sans" x="190" y="22.5" text-anchor="middle" font-size="12" font-weight="800" fill="#6E6557">=</text>
        </g>
      </g>

      <!-- ===================== LEFT SIDE: COMPACT RIVERBANK & WAIST-HIGH POOL ===================== -->
      <g id="baptism-side">
        <!-- Fixed shallow water basin back fill (y=194..218) -->
        <polygon points="34,194 120,194 112,218 42,218" fill="#DDF0F8"/>

        <!-- Fixed earth banks sloping down into shallow water and rising cleanly toward Jesus' higher ground -->
        <path d="M 8 176 L 34 194 L 42 218 L 112 218 L 120 194 L 144 172 L 188 170 L 188 238 L 8 238 Z" fill="#EDE6D7"/>
        <polygon points="34,194 120,194 112,218 42,218" fill="#D5ECF6"/>

        <!-- Green bloom overlay on right terrace for Resurrection & New Life -->
        <path id="new-bank-wash" d="M 112 218 L 120 194 L 144 172 L 188 170 L 188 238 L 112 238 Z" fill="#D8ECDC" opacity="0"/>

        <!-- Crisp continuous bank contour -->
        <path d="M 8 176 L 34 194 L 42 218 L 112 218 L 120 194 L 144 172 L 188 170" fill="none" stroke="#8C8375" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Tiny green sprout on the bank behind the kneeling figure (Steps 3-4) -->
        <g id="new-sprout" class="fade-part" transform="translate(178,170)">
          <line x1="0" y1="2" x2="0" y2="-7" stroke="#1D6B3F" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M 0 -4 C -4 -8 -7 -4 -1 -2" fill="#5A9A6B"/>
          <path d="M 0 -6 C 4 -10 7 -6 1 -3" fill="#1D6B3F"/>
        </g>

        <!-- Fixed Pastor / Baptizer standing waist-deep in shallow water at x=98, y=216 -->
        <g id="baptizer" transform="translate(98,216)">
          <line x1="-3.5" y1="-15" x2="-4" y2="-1" stroke="#4A6B8B" stroke-width="3.8" stroke-linecap="round"/>
          <line x1="3.5" y1="-15" x2="4" y2="-1" stroke="#4A6B8B" stroke-width="3.8" stroke-linecap="round"/>
          <line x1="0" y1="-34" x2="0" y2="-15" stroke="#4A6B8B" stroke-width="4.8" stroke-linecap="round"/>
          <circle cx="0" cy="-41" r="5.3" fill="#4A6B8B"/>
          <g id="baptizer-arms" transform="translate(0,-29)">
            <line x1="0" y1="0" x2="-13" y2="-2" stroke="#4A6B8B" stroke-width="3.2" stroke-linecap="round"/>
            <line x1="0" y1="0" x2="-11" y2="5" stroke="#4A6B8B" stroke-width="3.2" stroke-linecap="round"/>
          </g>
        </g>

        <!-- Hero Person Being Baptized: upright/bending pose (CONSTANT color #1D6B3F across every slide) -->
        <g id="you-fig" transform="translate(20,174)">
          <g stroke="#FFFFFF" stroke-width="1.8" paint-order="stroke" stroke-linejoin="round" stroke-linecap="round">
            <circle cx="0" cy="-37" r="5.4" fill="#1D6B3F"/>
            <line x1="0" y1="-31" x2="0" y2="-15" stroke="#1D6B3F" stroke-width="4.8"/>
            <line x1="0" y1="-27" x2="-6" y2="-18" stroke="#1D6B3F" stroke-width="3.2"/>
            <line x1="0" y1="-27" x2="7" y2="-19" stroke="#1D6B3F" stroke-width="3.2"/>
            <line x1="0" y1="-15" x2="-4.5" y2="-1" stroke="#1D6B3F" stroke-width="3.5"/>
            <line x1="0" y1="-15" x2="4.5" y2="-1" stroke="#1D6B3F" stroke-width="3.5"/>
          </g>
        </g>

        <!-- Same Baptized Person KNEELING on right bank facing risen Jesus (Slide 4, constant color #1D6B3F) -->
        <g id="you-kneel" class="fade-part" transform="translate(158,171)">
          <g stroke="#FFFFFF" stroke-width="1.8" paint-order="stroke" stroke-linejoin="round" stroke-linecap="round">
            <!-- Lower shin & foot resting behind on the bank -->
            <line x1="-13" y1="-1" x2="-1" y2="-1" stroke="#1D6B3F" stroke-width="3.6"/>
            <!-- Thigh rising up to hip -->
            <line x1="-1" y1="-1" x2="-7" y2="-11" stroke="#1D6B3F" stroke-width="3.8"/>
            <!-- Torso leaning reverently forward toward Jesus on right -->
            <line x1="-7" y1="-11" x2="-2" y2="-23" stroke="#1D6B3F" stroke-width="4.8"/>
            <!-- Head bowed slightly up toward Jesus -->
            <circle cx="1.5" cy="-29.5" r="5.2" fill="#1D6B3F"/>
            <!-- Arms extended/folded forward toward Jesus -->
            <line x1="-3" y1="-20" x2="7" y2="-16" stroke="#1D6B3F" stroke-width="3.2"/>
            <line x1="-3" y1="-20" x2="5" y2="-13" stroke="#1D6B3F" stroke-width="3.2"/>
          </g>
        </g>

        <!-- Translucent water overlay layered ON TOP of waist-deep / submerged bodies -->
        <polygon points="34,194 120,194 112,218 42,218" fill="#A9D5EA" opacity="0.55"/>
        <path d="M 34 194 Q 56 191.5 77 194 Q 98 196.5 120 194" fill="none" stroke="#2A7FA8" stroke-width="2.2" stroke-linecap="round"/>

        <!-- Burial surface ripples (Slide 2) -->
        <g id="water-ripples" class="fade-part" fill="none" stroke="#2A7FA8" stroke-linecap="round">
          <path d="M 46 189 Q 64 185 82 189" stroke-width="1.7"/>
          <path d="M 54 184 Q 70 181 84 184" stroke-width="1.3" opacity="0.72"/>
        </g>

        <!-- Rising water droplets around candidate stepping out (Slide 3) -->
        <g id="splash-drops" class="fade-part" stroke="#2A7FA8" stroke-width="1.6" stroke-linecap="round" fill="none">
          <path d="M 116 176 Q 111 167 106 163"/>
          <path d="M 136 172 Q 141 163 147 160"/>
          <circle cx="104" cy="159" r="1.3" fill="#2A7FA8" stroke="none"/>
          <circle cx="150" cy="157" r="1.3" fill="#2A7FA8" stroke="none"/>
        </g>
      </g>

      <!-- ===================== GOLDEN UNION RAY (Slide 4: Higher Risen Jesus -> Kneeling Believer) ===================== -->
      <polygon id="union-ray" points="212,118 212,154 156,158 156,138" fill="url(#unionBeamGrad)" opacity="0"/>

      <!-- ===================== RIGHT SIDE: HIGHER GROUND (TOMB LEFT 242, CROSS RIGHT 328) ===================== -->
      <g id="jesus-side">
        <!-- Warm crimson-amber glow behind Cross on RIGHT (Slide 1) -->
        <circle id="cross-glow" cx="328" cy="76" r="46" fill="url(#crossGlowGrad)" opacity="0"/>

        <!-- Golden sunrise glow behind Tomb doorway on LEFT of Jesus side (Slides 3-4) -->
        <circle id="tomb-glow" cx="242" cy="136" r="54" fill="url(#tombGlowGrad)" opacity="0"/>

        <!-- Higher land stepping smoothly up from left bank (170 -> 158) toward tomb plateau & Calvary hill -->
        <path d="M 192 170 Q 204 158 220 158 L 284 156 Q 326 140 372 168 L 372 238 L 192 238 Z" fill="#EAE2D2"/>
        <path d="M 192 170 Q 204 158 220 158 L 284 156 Q 326 140 372 168" fill="none" stroke="#8C8375" stroke-width="2" stroke-linecap="round"/>

        <!-- Stone Tomb on LEFT of Jesus' higher hillside (x=212..274, base y=158) -->
        <g id="tomb-mound">
          <path d="M 212 158 Q 242 104 274 158 Z" fill="#C9C0B0" stroke="#8C8375" stroke-width="1.8" stroke-linejoin="round"/>
          <!-- Dark arched tomb doorway -->
          <path id="tomb-mouth" d="M 229 158 L 229 135 A 13 13 0 0 1 255 135 L 255 158 Z" fill="#2C2416"/>
          <!-- Golden light streaming from empty tomb (Slides 3-4) -->
          <g id="tomb-rays" class="fade-part">
            <path d="M 231 156 L 231 136 A 11 11 0 0 1 253 136 L 253 156 Z" fill="#F6DF98" opacity="0.9"/>
            <line x1="242" y1="117" x2="242" y2="103" stroke="#E0A526" stroke-width="2" stroke-linecap="round"/>
            <line x1="228" y1="121" x2="218" y2="110" stroke="#E0A526" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="256" y1="121" x2="266" y2="110" stroke="#E0A526" stroke-width="1.8" stroke-linecap="round"/>
          </g>
        </g>

        <!-- Rolling Stone: parked beside tomb at x=274, rolls left over tomb at x=242 on Slide 2 -->
        <g id="tomb-stone" transform="translate(274,139)">
          <circle cx="0" cy="0" r="20" fill="#B5AC9C" stroke="#7A7162" stroke-width="1.9"/>
          <g clip-path="url(#tombStoneClip)">
            <path d="M -20 9 Q -2 19 18 7 L 21 21 L -21 21 Z" fill="#9A9181"/>
            <path d="M -14 -8 A 16 16 0 0 1 10 -14" fill="none" stroke="#CCC4B5" stroke-width="1.8" stroke-linecap="round"/>
          </g>
        </g>

        <!-- White-Robed Risen Jesus standing higher up outside the open tomb JUST right of center line (Slides 3-4) -->
        <g id="jesus-risen" class="fade-part" transform="translate(214,158)">
          <circle cx="0" cy="-38" r="23" fill="url(#jesusHaloGrad)"/>
          <circle cx="0" cy="-42" r="7.5" fill="none" stroke="#E0A526" stroke-width="1.5" opacity="0.85"/>
          <!-- Open welcoming arms beneath robe sleeves -->
          <line x1="0" y1="-30" x2="-12" y2="-23" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round"/>
          <line x1="0" y1="-30" x2="-12" y2="-23" stroke="#7A7060" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
          <line x1="0" y1="-30" x2="11" y2="-24" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round"/>
          <!-- Flowing white robe -->
          <path d="M -5.5 -34 L 5.5 -34 L 9.5 0 L -9.5 0 Z" fill="#FFFFFF" stroke="#7A7060" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M -4 -33 L 5 -16 L 1 0" fill="none" stroke="#DDD6C7" stroke-width="1.5" stroke-linecap="round"/>
          <!-- Head -->
          <circle cx="0" cy="-42" r="5.3" fill="#6F4C24" stroke="#FFFFFF" stroke-width="1.2" paint-order="stroke"/>
        </g>

        <!-- Calvary Cross on RIGHT side of Jesus' higher hillside (x=328, base y=148) -->
        <g id="calvary-cross">
          <line x1="328" y1="44" x2="328" y2="148" stroke="#8A5A2B" stroke-width="8.5" stroke-linecap="round"/>
          <line x1="305" y1="71" x2="351" y2="71" stroke="#8A5A2B" stroke-width="8" stroke-linecap="round"/>
          <line x1="328" y1="46" x2="328" y2="146" stroke="#A67442" stroke-width="2.4" stroke-linecap="round"/>
          <line x1="307" y1="71" x2="349" y2="71" stroke="#A67442" stroke-width="2.2" stroke-linecap="round"/>
        </g>

        <!-- Jesus on the Cross (Slide 1: Death) -->
        <g id="jesus-cross" class="fade-part">
          <circle cx="328" cy="62" r="9" fill="#F3D98B" opacity="0.55"/>
          <line x1="311" y1="72" x2="345" y2="72" stroke="#F4EFE6" stroke-width="4.2" stroke-linecap="round"/>
          <path d="M 324.5 71 L 331.5 71 L 331 105 L 325 105 Z" fill="#F4EFE6" stroke="#7A5835" stroke-width="1.1"/>
          <path d="M 324 91 L 332 89 L 331.5 98 L 324.5 98 Z" fill="#FFFFFF"/>
          <circle cx="328" cy="62" r="4.8" fill="#5D3D22" stroke="#F4EFE6" stroke-width="1.2" paint-order="stroke"/>
        </g>
      </g>

      <!-- ===================== BOTTOM PARALLEL STAGE CAPTIONS ===================== -->
      <text id="cap-left" class="svg-sans fade-part" x="94" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#2C2416"></text>
      <text id="cap-right" class="svg-sans fade-part" x="286" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#2C2416"></text>
    </svg>
  </div>

  <div class="step-strip" id="step-strip" role="group" aria-label="Baptism steps"></div>
  <div id="card-area" aria-live="polite"></div>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
(function () {
  'use strict';

  var INK = '#2C2416';
  var INTRO = {
    color: INK,
    dark: INK,
    dotLabel: 'Start: Identifying with Jesus',
    cardTitle: 'Identifying with Jesus',
    verse: 'Baptism does not save you. It is the outward picture of an inner reality: choosing to identify with Jesus in His death, burial, and resurrection.',
    ref: '',
    capLeft: '',
    capRight: '',
    desc: 'Side-by-side scene showing your baptism pool on the left and Jesus\' tomb and cross on higher ground on the right.'
  };

  var stops = [
    {
      id: 'death',
      dotLabel: 'Step 1: Death - Crucified with Christ',
      cardTitle: '1. Death: Crucified with Christ',
      color: '#9B3B2A',
      dark: '#822F21',
      verse: 'Jesus died on the cross for your sin. Standing in the water declares your old life ended with Him: <b>"I have been crucified with Christ."</b>',
      ref: 'Galatians 2:20  |  Romans 6:6',
      capLeft: 'Old Self Dies in Water',
      capRight: 'Christ Died on the Cross',
      desc: 'Left: you stand waist-deep in the water beside the pastor. Right: Jesus hangs on the cross on the right hill.'
    },
    {
      id: 'burial',
      dotLabel: 'Step 2: Burial - Buried with Him',
      cardTitle: '2. Burial: Buried with Him',
      color: '#4A6B8B',
      dark: '#385570',
      verse: 'Just as Jesus\' body was sealed in the tomb, bending back under the water pictures burying your old life: <b>"We were buried therefore with him by baptism into death."</b>',
      ref: 'Romans 6:4  |  Colossians 2:12',
      capLeft: 'Lowered Under Water',
      capRight: 'Buried in the Tomb',
      desc: 'Left: you bend backward beneath the water with the pastor supporting you. Right: the cross is empty and the stone rolls shut across the tomb.'
    },
    {
      id: 'resurrection',
      dotLabel: 'Step 3: Resurrection - Raised with Christ',
      cardTitle: '3. Resurrection: Raised with Christ',
      color: '#1D6B3F',
      dark: '#165531',
      verse: 'God rolled the stone away and raised Jesus from the dead. Rising out of the water pictures rising with Him so <b>"we too might walk in newness of life."</b>',
      ref: 'Romans 6:4  |  Colossians 3:1',
      capLeft: 'Raised Out of Water',
      capRight: 'Jesus Raised to Life',
      desc: 'Left: you rise from the water onto the bank. Right: the stone rolls open and white-robed Jesus rises from the tomb on higher ground.'
    },
    {
      id: 'newlife',
      dotLabel: 'Step 4: New Life - Old Has Gone, New Has Come',
      cardTitle: '4. New Life: Old Has Gone, New Has Come',
      color: '#946B06',
      dark: '#7A5804',
      verse: '<b>"The old has passed away; behold, the new has come."</b> You bow before the risen Savior: you no longer live for yourself, because <b>Christ lives in you</b>.',
      ref: '2 Corinthians 5:17  |  Galatians 2:20',
      capLeft: 'Kneeling Before Jesus',
      capRight: 'Risen Savior & New Life',
      desc: 'Left: you kneel on the green bank right of the pool, facing across the line toward the white-robed risen Jesus standing outside the open tomb.'
    }
  ];

  var step = -1;
  var pendingFocus = null;
  var reduceQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

  function el(id) { return document.getElementById(id); }

  function setClass(id, on) {
    var node = el(id);
    if (node) node.classList.toggle('is-on', !!on);
  }

  function applyScene(idx) {
    var data = idx < 0 ? INTRO : stops[idx];
    var fig = el('you-fig');
    var arms = el('baptizer-arms');
    var stone = el('tomb-stone');

    // Baptized person keeps ONE consistent green color across all steps
    if (idx < 0) {
      fig.style.opacity = '1';
      fig.setAttribute('transform', 'translate(20,176) rotate(0)');
      arms.setAttribute('transform', 'translate(0,-29) rotate(0)');
      stone.setAttribute('transform', 'translate(274,139) rotate(0)');
    } else if (idx === 0) {
      // 1. Death: standing waist-deep in water (y=216 -> water line y=194 cuts waist), Jesus on Cross
      fig.style.opacity = '1';
      fig.setAttribute('transform', 'translate(68,216) rotate(0)');
      arms.setAttribute('transform', 'translate(0,-29) rotate(-8)');
      stone.setAttribute('transform', 'translate(274,139) rotate(0)');
    } else if (idx === 1) {
      // 2. Burial: bending backwards under water with pastor helping; stone rolled over tomb
      fig.style.opacity = '1';
      fig.setAttribute('transform', 'translate(79,213) rotate(-74)');
      arms.setAttribute('transform', 'translate(0,-29) rotate(-24)');
      stone.setAttribute('transform', 'translate(242,139) rotate(-95)');
    } else if (idx === 2) {
      // 3. Resurrection: rising up onto bank out of pool; stone open & white-robed Jesus risen outside tomb
      fig.style.opacity = '1';
      fig.setAttribute('transform', 'translate(126,188) rotate(4)');
      arms.setAttribute('transform', 'translate(0,-30) rotate(14)');
      stone.setAttribute('transform', 'translate(274,139) rotate(12)');
    } else {
      // 4. New Life: upright figure swapped smoothly to kneeling pose on bank facing higher risen Jesus
      fig.style.opacity = '0';
      fig.setAttribute('transform', 'translate(154,171) rotate(0)');
      arms.setAttribute('transform', 'translate(0,-29) rotate(10)');
      stone.setAttribute('transform', 'translate(274,139) rotate(12)');
    }

    setClass('you-kneel', idx === 3);
    setClass('water-ripples', idx === 1);
    setClass('splash-drops', idx === 2);
    setClass('new-sprout', idx >= 2);
    el('new-bank-wash').setAttribute('opacity', idx >= 2 ? '1' : '0');

    el('cross-glow').setAttribute('opacity', idx === 0 ? '1' : '0');
    setClass('jesus-cross', idx === 0);
    el('tomb-glow').setAttribute('opacity', idx >= 2 ? '1' : '0');
    setClass('tomb-rays', idx >= 2);
    setClass('jesus-risen', idx >= 2);
    el('union-ray').setAttribute('opacity', idx === 3 ? '1' : '0');

    // Bottom parallel captions
    var capL = el('cap-left');
    var capR = el('cap-right');
    capL.textContent = data.capLeft;
    capR.textContent = data.capRight;
    capL.setAttribute('fill', data.dark);
    capR.setAttribute('fill', data.dark);
    setClass('cap-left', idx >= 0);
    setClass('cap-right', idx >= 0);

    // Center equality badge
    var badgeBg = el('link-badge-bg');
    var badgeTxt = el('link-badge-txt');
    if (idx < 0) {
      badgeBg.setAttribute('fill', '#FFFFFF');
      badgeBg.setAttribute('stroke', '#D4CFC4');
      badgeTxt.setAttribute('fill', '#6E6557');
    } else {
      badgeBg.setAttribute('fill', data.color);
      badgeBg.setAttribute('stroke', data.color);
      badgeTxt.setAttribute('fill', '#FFFFFF');
    }

    el('bap-desc').textContent = data.desc;
  }

  function renderDots() {
    var strip = el('step-strip');
    strip.innerHTML = '';

    var items = [{ color: INK, label: INTRO.dotLabel, idx: -1 }];
    for (var i = 0; i < stops.length; i++) {
      items.push({ color: stops[i].color, label: stops[i].dotLabel, idx: i });
    }

    for (var j = 0; j < items.length; j++) {
      var item = items[j];
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'step-dot';
      if (item.idx === step) btn.classList.add('active');
      else if (step >= 0 && item.idx >= 0 && item.idx < step) btn.classList.add('passed');
      btn.style.setProperty('--dot-color', item.color);
      btn.setAttribute('aria-label', item.label);
      btn.setAttribute('aria-pressed', item.idx === step ? 'true' : 'false');
      (function (targetIdx) {
        btn.addEventListener('click', function () { goTo(targetIdx); });
      })(item.idx);

      var fill = document.createElement('span');
      fill.className = 'step-dot-fill';
      fill.setAttribute('aria-hidden', 'true');
      btn.appendChild(fill);
      strip.appendChild(btn);
    }
  }

  function buildCardMarkup(d) {
    return '<div class="verse-card" style="--step-color:' + d.color + ';--step-dark:' + d.dark + '">'
      + '<div class="verse-card-bar"></div>'
      + '<div class="verse-card-content">'
      + '<p class="verse-card-title">' + d.cardTitle + '</p>'
      + '<p class="verse-card-text">' + d.verse + '</p>'
      + (d.ref ? '<p class="verse-card-ref">' + d.ref + '</p>' : '')
      + '</div></div>';
  }

  function renderCard() {
    var area = el('card-area');
    var data = step < 0 ? INTRO : stops[step];
    var isIntro = step < 0;
    var isLast = step === stops.length - 1;

    var backHtml = isIntro
      ? '<button type="button" class="nav-btn ghost" disabled aria-hidden="true" tabindex="-1">Back</button>'
      : '<button type="button" class="nav-btn" id="btn-back">&#8592; Back</button>';

    var countText = isIntro ? 'Ready' : (step + 1) + ' of ' + stops.length;

    var nextHtml = isIntro
      ? '<button type="button" class="nav-btn primary" id="btn-next" style="--step-color:' + data.color + '">Begin &#8594;</button>'
      : (isLast
          ? '<button type="button" class="nav-btn primary" id="btn-next" style="--step-color:' + data.color + '">&#8635; Start Over</button>'
          : '<button type="button" class="nav-btn primary" id="btn-next" style="--step-color:' + data.color + '">Next &#8594;</button>');

    area.innerHTML = buildCardMarkup(data)
      + '<div class="nav-bar">' + backHtml + '<span class="step-count">' + countText + '</span>' + nextHtml + '</div>';

    var backBtn = el('btn-back');
    if (backBtn) {
      backBtn.addEventListener('click', function () {
        pendingFocus = 'back';
        goTo(step - 1);
      });
    }

    var nextBtn = el('btn-next');
    nextBtn.addEventListener('click', function () {
      pendingFocus = 'next';
      if (isLast) goTo(-1);
      else goTo(step + 1);
    });

    if (pendingFocus) {
      var target = pendingFocus === 'back' ? backBtn : nextBtn;
      pendingFocus = null;
      if (target) target.focus();
    }

    el('status').textContent = (isIntro ? 'Intro: ' : 'Step ' + (step + 1) + ' of ' + stops.length + ': ') + data.cardTitle;
  }

  function fitCards() {
    var outer = el('widget');
    var measure = el('measure');
    if (!measure) {
      measure = document.createElement('div');
      measure.id = 'measure';
      document.body.appendChild(measure);
    }
    var width = Math.min(outer.clientWidth || 436, 460) - 24;
    if (width < 200) width = 320;
    measure.style.width = width + 'px';

    var all = [INTRO].concat(stops);
    var maxH = 0;
    for (var i = 0; i < all.length; i++) {
      measure.innerHTML = buildCardMarkup(all[i]).replace('min-height: var(--card-h, 118px)', 'min-height: 0');
      var content = measure.querySelector('.verse-card-content');
      if (content) content.style.minHeight = '0px';
      var h = content ? content.offsetHeight : 0;
      if (h > maxH) maxH = h;
    }
    if (maxH > 0) {
      document.documentElement.style.setProperty('--card-h', Math.ceil(maxH) + 'px');
    }
    measure.innerHTML = '';
  }

  function goTo(target) {
    step = target;
    applyScene(step);
    renderDots();
    renderCard();
  }

  var lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth !== lastW) {
      lastW = window.innerWidth;
      fitCards();
    }
  });

  if (reduceQuery && reduceQuery.matches) {
    document.documentElement.classList.add('reduced-motion');
  }

  fitCards();
  goTo(-1);
})();
</script>
</body>
</html>
