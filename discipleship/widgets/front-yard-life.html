<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Front Yard Life</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --ink: #2C2416;
  --muted: #6E6559;
  --tray: #F6F4EE;
  --border: #EBE5D9;
  --paper: #FFFFFF;

  --gold: #A8760A;
  --gold-dark: #7D5604;
  --gold-wash: #FCF2D6;

  --sage: #1F684A;
  --sage-dark: #164E37;
  --sage-wash: #E1F1E9;

  --blue: #2A5B7C;
  --blue-dark: #1E435C;
  --blue-wash: #E2EEF6;

  --plum: #5F4684;
  --plum-dark: #473366;
  --plum-wash: #EDE7F6;

  --crimson: #8B1A2B;
  --crimson-dark: #6D1422;

  --step-color: #A8760A;
  --step-dark: #7D5604;
  --card-h: 118px;
}

body {
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  margin: 0;
  padding: 0;
}

.widget-outer {
  background: var(--paper);
  width: 100%;
  max-width: 100%;
  margin: 0;
  overflow: hidden;
  border: none;
  border-radius: 0;
  box-shadow: none;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    max-width: 460px;
    margin: 0 auto;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
  }
}

.title-bar {
  background: var(--ink);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  margin: 0;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  background: var(--paper);
  padding: 6px 8px 4px;
  border-bottom: 1px solid var(--border);
}

#fy-svg {
  display: block;
  width: 100%;
  height: auto;
}

.svg-sans {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* Compositor-only state reveals */
.fy-layer {
  opacity: 0;
  pointer-events: none;
}

.fy-layer.is-on {
  opacity: 1;
}

.fy-rise {
  transform: translateY(5px);
}

.fy-rise.is-on {
  transform: translateY(0);
}

#garage-door {
  transform: translateY(0);
}

#fy-svg.is-open #garage-door {
  transform: translateY(-44px);
}

#front-dark-veil {
  opacity: 0.22;
}

#fy-svg.is-open #front-dark-veil {
  opacity: 0;
}

#gate-closed {
  opacity: 1;
}

#fy-svg.is-moved #gate-closed {
  opacity: 0;
}

#gate-open {
  opacity: 0;
}

#fy-svg.is-moved #gate-open {
  opacity: 1;
}

#backyard-movable {
  opacity: 1;
}

#fy-svg.is-moved #backyard-movable {
  opacity: 0;
}

@media (prefers-reduced-motion: no-preference) {
  .fy-layer,
  #garage-door,
  #front-dark-veil,
  #gate-closed,
  #gate-open,
  #backyard-movable {
    transition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #finish-night-sky,
  #finish-night-ambient {
    transition: opacity 0.45s ease;
  }
  #porch-night-beam,
  #porch-bulb-lit {
    transition: opacity 0.25s ease 0s;
  }
  #porch-night-beam.is-on,
  #porch-bulb-lit.is-on {
    transition: opacity 1.5s ease-in-out 0.95s;
  }
  .step-dot-fill {
    transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
  }
  .nav-btn.primary,
  .verse-card-bar,
  .card-heading {
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease;
  }
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 5px;
  background: var(--tray);
  border-bottom: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  min-width: 28px;
  min-height: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
}

.step-dot-fill {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2.4px solid var(--dot-color, var(--ink));
  background: var(--paper);
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 22%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.14);
}

.card-area {
  background: var(--tray);
  padding: 7px 12px 10px;
}

.verse-card {
  background: var(--paper);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(44, 36, 22, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 13px;
  min-height: var(--card-h, 118px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-heading {
  font: 700 15px/1.22 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 4px;
}

.card-verse {
  font: 13.5px/1.36 Georgia, Cambria, serif;
  color: #3D3426;
  margin: 0;
}

.card-verse.is-empty {
  display: none;
}

.verse-ref {
  font: 600 11.5px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  white-space: nowrap;
}

.card-note {
  display: block;
  margin-top: 5px;
  font: 12.5px/1.36 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #4A4238;
}

.card-note.is-lead {
  margin-top: 0;
  font: 13.5px/1.36 Georgia, Cambria, serif;
  color: #3D3426;
}

.card-subnote {
  display: block;
  margin-top: 5px;
  font: italic 12px/1.34 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #5C5347;
}

.card-subnote.is-empty {
  display: none;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  appearance: none;
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: var(--paper);
  color: var(--ink);
  font: 700 13.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FFFFFF;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.step-count {
  font: 600 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  text-align: center;
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (max-width: 395px) {
  .card-area {
    padding: 6px 10px 8px;
  }
  .verse-card-content {
    padding: 8px 11px;
  }
  .card-heading {
    font-size: 14.5px;
  }
  .card-verse {
    font-size: 13px;
  }
  .nav-btn {
    min-width: 88px;
    padding: 10px 12px;
  }
}

.visually-hidden {
  position: absolute;
  clip-path: inset(50%);
  overflow: hidden;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" aria-label="Interactive Front Yard Life hospitality diagram for 203-03">
  <header class="title-bar">
    <h1>Front Yard Life</h1>
    <span class="course-tag">203-03</span>
  </header>

  <div class="stage">
    <svg id="fy-svg" viewBox="0 38 440 218" width="100%" role="img" aria-labelledby="fy-svg-title fy-svg-desc">
      <title id="fy-svg-title">Front Yard Life</title>
      <desc id="fy-svg-desc">Wide side view of a house in the center with equal backyard on the left and front yard on the right.</desc>

      <defs>
        <linearGradient id="night-sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#1E2D40"/>
          <stop offset="100%" stop-color="#3C5470"/>
        </linearGradient>
        <radialGradient id="porch-glow" cx="50%" cy="12%" r="85%">
          <stop offset="0%" stop-color="#FCE8AE" stop-opacity="0.72"/>
          <stop offset="100%" stop-color="#FCE8AE" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="porch-night-glow" cx="42%" cy="8%" r="92%">
          <stop offset="0%" stop-color="#FFE48A" stop-opacity="0.92"/>
          <stop offset="48%" stop-color="#FAD470" stop-opacity="0.42"/>
          <stop offset="100%" stop-color="#FAD470" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="fire-glow" cx="50%" cy="62%" r="60%">
          <stop offset="0%" stop-color="#FAD48B" stop-opacity="0.58"/>
          <stop offset="100%" stop-color="#FAD48B" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="fire-night-glow" cx="50%" cy="60%" r="58%">
          <stop offset="0%" stop-color="#FFD479" stop-opacity="0.76"/>
          <stop offset="55%" stop-color="#F2A944" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#F2A944" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="garage-opening-clip">
          <rect x="214" y="156" width="40" height="54" rx="1"/>
        </clipPath>
        <clipPath id="sky-area-clip">
          <path d="M 24 44 H 416 Q 424 44 424 52 V 210 H 16 V 52 Q 16 44 24 44 Z"/>
        </clipPath>
      </defs>

      <!-- ===================== STEP 5: EVENING NIGHT SKY & WARM GLOWS (BEHIND FIGURES, CLIPPED ABOVE GROUND) ===================== -->
      <g id="finish-night-sky" class="fy-layer" aria-hidden="true">
        <path d="M 24 44 H 416 Q 424 44 424 52 V 210 H 16 V 52 Q 16 44 24 44 Z" fill="url(#night-sky-grad)"/>
        <!-- Quiet crescent moon & four soft stars -->
        <path d="M 56 64 A 9 9 0 1 0 65 76 A 7 7 0 1 1 56 64 Z" fill="#FDF3D0" opacity="0.9"/>
        <circle cx="116" cy="64" r="1.2" fill="#FDF3D0" opacity="0.75"/>
        <circle cx="158" cy="76" r="1" fill="#FDF3D0" opacity="0.6"/>
        <circle cx="312" cy="66" r="1.3" fill="#FDF3D0" opacity="0.8"/>
        <circle cx="378" cy="80" r="1.1" fill="#FDF3D0" opacity="0.65"/>
      </g>

      <g id="finish-night-ambient" class="fy-layer" clip-path="url(#sky-area-clip)" aria-hidden="true">
        <!-- Cozy evening firelight halo backlighting the front-yard circle -->
        <circle cx="330" cy="194" r="48" fill="url(#fire-night-glow)"/>
        <!-- Soft warm glows behind the 4 backyard string lights -->
        <circle cx="48" cy="141" r="8" fill="#FCE59C" opacity="0.45"/>
        <circle cx="84" cy="144" r="8" fill="#FCE59C" opacity="0.45"/>
        <circle cx="122" cy="141" r="8" fill="#FCE59C" opacity="0.45"/>
        <circle cx="156" cy="134" r="7.5" fill="#FCE59C" opacity="0.42"/>
      </g>

      <!-- Step 5 delayed porch light beam (waits 0.5s after dark arrives, then warms up over 1.5s) -->
      <g id="porch-night-beam" class="fy-layer" clip-path="url(#sky-area-clip)" aria-hidden="true">
        <polygon points="268,153 262,210 318,210 278,153" fill="url(#porch-night-glow)"/>
        <circle cx="272" cy="155" r="7.5" fill="#FFE89C" opacity="0.78"/>
      </g>

      <!-- ===================== EQUAL GROUND BANDS: BACKYARD (160) | HOME (88) | FRONT YARD (160) ===================== -->
      <rect x="16" y="210" width="160" height="15" rx="2" fill="#E6F1EA"/>
      <rect x="264" y="210" width="118" height="15" rx="2" fill="#EFECE6"/>
      <rect x="382" y="210" width="42" height="15" rx="2" fill="#DFDDD7"/>
      <line x1="16" y1="210" x2="424" y2="210" stroke="#7A7164" stroke-width="1.3"/>

      <!-- ===================== BACKYARD (LEFT: x=16..176, 160px wide) ===================== -->
      <g id="backyard-permanent">
        <!-- Minimalist privacy fence (always remains) -->
        <rect x="20" y="148" width="140" height="62" fill="#F2ECE0" stroke="#9B8D77" stroke-width="1.2"/>
        <g stroke="#D8CEBC" stroke-width="0.9">
          <line x1="55" y1="149" x2="55" y2="209"/>
          <line x1="90" y1="149" x2="90" y2="209"/>
          <line x1="125" y1="149" x2="125" y2="209"/>
        </g>
        <line x1="20" y1="132" x2="20" y2="210" stroke="#7A6C56" stroke-width="2.4" stroke-linecap="round"/>

        <!-- Side gate (latched at Start, opens Step 1+) -->
        <g id="gate-closed">
          <rect x="160" y="150" width="16" height="60" fill="#E7DEC9" stroke="#8C7E68" stroke-width="1.2"/>
          <circle cx="170" cy="182" r="1.8" fill="#2C2416"/>
        </g>
        <g id="gate-open">
          <path d="M 160 150 L 170 144 L 170 204 L 160 210 Z" fill="#DED4BF" stroke="#8C7E68" stroke-width="1.1"/>
        </g>

        <!-- Clean string lights (stay lit across every step) -->
        <path d="M 20 135 Q 98 151 176 128" fill="none" stroke="#6E6559" stroke-width="1"/>
        <g aria-hidden="true">
          <circle cx="48" cy="141" r="3" fill="#F2B830"/>
          <circle cx="84" cy="144" r="3" fill="#F2B830"/>
          <circle cx="122" cy="141" r="3" fill="#F2B830"/>
          <circle cx="156" cy="134" r="2.8" fill="#F2B830"/>
        </g>

        <!-- Simple backyard patio table (always remains) -->
        <line x1="68" y1="192" x2="108" y2="192" stroke="#8C7B63" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="75" y1="193" x2="74" y2="210" stroke="#8C7B63" stroke-width="1.7" stroke-linecap="round"/>
        <line x1="101" y1="193" x2="102" y2="210" stroke="#8C7B63" stroke-width="1.7" stroke-linecap="round"/>
      </g>

      <!-- Backyard friends, chairs, and fire pit (Step 0 only; move out front on Step 1) -->
      <g id="backyard-movable">
        <circle cx="132" cy="199" r="16" fill="url(#fire-glow)"/>
        <path d="M 123 210 L 125 202 L 139 202 L 141 210 Z" fill="#5A5349"/>
        <path d="M 128.5 202 C 128.5 196 131 193.5 132 190.5 C 133.5 193.5 135.5 196 135.5 202 Z" fill="#E89A25"/>

        <!-- Blue chair + friend -->
        <g id="by-friend-1">
          <path d="M 46 189 L 49 200 L 59 200 M 50 200 L 48 210 M 57 200 L 59 210" fill="none" stroke="#2A5B7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="55" cy="179" r="4.3" fill="#D4A373"/>
          <rect x="50" y="185" width="9" height="14" rx="4" fill="#2A5B7C"/>
        </g>

        <!-- Sage chair + friend -->
        <g id="by-friend-2">
          <path d="M 114 189 L 111 200 L 101 200 M 110 200 L 112 210 M 103 200 L 101 210" fill="none" stroke="#1F684A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="105" cy="179" r="4.3" fill="#C68E63"/>
          <rect x="101" y="185" width="9" height="14" rx="4" fill="#1F684A"/>
        </g>
      </g>

      <!-- ===================== CENTER: HOUSE DEAD-CENTER (x=176..264, peak at x=220) ===================== -->
      <g id="house-structure">
        <!-- Clean house body & centered pitched roof -->
        <rect x="176" y="122" width="88" height="88" fill="#FAF7F0" stroke="#2C2416" stroke-width="1.4"/>
        <polygon points="169,123 220,84 271,123" fill="#524B42" stroke="#2C2416" stroke-width="1.4" stroke-linejoin="round"/>

        <!-- Simple warm window -->
        <rect x="186" y="144" width="18" height="20" rx="2" fill="#FCF0CA" stroke="#8C806D" stroke-width="1"/>

        <!-- Garage opening & smooth rolling door -->
        <g clip-path="url(#garage-opening-clip)">
          <rect x="214" y="156" width="40" height="54" fill="#FBF2DC"/>
          <rect x="214" y="156" width="40" height="44" fill="url(#porch-glow)"/>

          <g id="garage-door">
            <rect x="214" y="156" width="40" height="54" fill="#EAE5DB" stroke="#2C2416" stroke-width="1.1"/>
            <line x1="215" y1="174" x2="253" y2="174" stroke="#C4BCB0" stroke-width="1"/>
            <line x1="215" y1="192" x2="253" y2="192" stroke="#C4BCB0" stroke-width="1"/>
          </g>
        </g>
        <rect x="214" y="156" width="40" height="54" fill="none" stroke="#2C2416" stroke-width="1.3"/>

        <!-- Simple open front porch overhang & porch bulb (stays unlit until Step 5 evening) -->
        <path d="M 264 146 L 284 151" fill="none" stroke="#524B42" stroke-width="3.6" stroke-linecap="round"/>
        <line x1="281" y1="152" x2="281" y2="210" stroke="#2C2416" stroke-width="1.4"/>
        <circle id="porch-bulb" cx="272" cy="153" r="2.6" fill="#B5B0A6"/>
        <circle id="porch-bulb-lit" class="fy-layer" cx="272" cy="153" r="2.9" fill="#FFF2B2"/>

        <!-- Dusk shadow inside closed garage & unlit porch (lifts at Step 2) -->
        <g id="front-dark-veil" pointer-events="none">
          <rect x="214" y="156" width="40" height="54" fill="#2A3B4C"/>
          <polygon points="264,148 281,152 281,210 264,210" fill="#2A3B4C"/>
        </g>
      </g>

      <!-- ===================== STEP 1: SYMMETRIC OUTWARD ARC OVER CENTERED HOUSE ===================== -->
      <g id="move-arc" class="fy-layer" aria-hidden="true">
        <path d="M 110 116 C 165 54 275 54 330 116" fill="none" stroke="#5F4684" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round" opacity="0.72"/>
        <polyline points="323,116 332,118 331,109" fill="none" stroke="#5F4684" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.82"/>
      </g>

      <!-- ===================== FRONT YARD (RIGHT: x=264..424, 160px wide) ===================== -->
      <!-- Step 1+: Same chairs & fire pit out front -->
      <g id="front-setup" class="fy-layer fy-rise">
        <circle cx="330" cy="197" r="22" fill="url(#fire-glow)"/>
        <path d="M 320 210 L 322 202 L 338 202 L 340 210 Z" fill="#5A5349"/>
        <path d="M 326 202 C 326 195.5 328.8 192 330 188.5 C 331.5 192 334 195.5 334 202 Z" fill="#E89A25"/>

        <!-- Same Blue chair + Friend 1 -->
        <g id="fy-friend-1">
          <path d="M 294 189 L 297 200 L 307 200 M 298 200 L 296 210 M 305 200 L 307 210" fill="none" stroke="#2A5B7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="303" cy="179" r="4.3" fill="#D4A373"/>
          <rect x="298" y="185" width="9" height="14" rx="4" fill="#2A5B7C"/>
        </g>

        <!-- Same Sage chair + Friend 2 -->
        <g id="fy-friend-2">
          <path d="M 313 187 L 315 197 L 324 197 M 316 197 L 314 207 M 322 197 L 324 207" fill="none" stroke="#1F684A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="319" cy="177" r="4" fill="#C68E63"/>
          <rect x="315" y="183" width="8.5" height="13" rx="3.8" fill="#1F684A"/>
        </g>

        <!-- Open Gold chair left ready for a neighbor -->
        <g id="open-chair">
          <path d="M 362 189 L 359 200 L 349 200 M 358 200 L 360 210 M 351 200 L 349 210" fill="none" stroke="#A8760A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Step 3: Neighbors pop by along the right edge -->
      <g id="neighbors-pop-by" class="fy-layer fy-rise">
        <!-- Minimalist dog walker + pup -->
        <g id="dog-walker" transform="translate(3 0)">
          <circle cx="381" cy="175" r="4.2" fill="#E0B18A"/>
          <rect x="377" y="181" width="8.5" height="15" rx="3.8" fill="#A8760A"/>
          <line x1="379" y1="196" x2="378" y2="210" stroke="#5A5349" stroke-width="1.9" stroke-linecap="round"/>
          <line x1="383" y1="196" x2="385" y2="210" stroke="#5A5349" stroke-width="1.9" stroke-linecap="round"/>
          <line x1="377" y1="185" x2="370" y2="179" stroke="#A8760A" stroke-width="1.9" stroke-linecap="round"/>
          <line x1="385" y1="189" x2="392" y2="203" stroke="#8C8375" stroke-width="0.9"/>
          <!-- Simple 2-shape friendly dog -->
          <rect x="390" y="203" width="10" height="5.5" rx="2.7" fill="#8D6E53"/>
          <circle cx="391" cy="202" r="2.6" fill="#8D6E53"/>
        </g>

        <!-- Minimalist kid on bike -->
        <g id="kid-bike">
          <circle cx="406" cy="204" r="5.2" fill="none" stroke="#857C70" stroke-width="1.5"/>
          <circle cx="420" cy="204" r="5.2" fill="none" stroke="#857C70" stroke-width="1.5"/>
          <path d="M 406 204 L 413 197 L 420 204" fill="none" stroke="#4D88B0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="413" cy="183" r="3.6" fill="#D4A373"/>
          <rect x="409.5" y="188" width="7" height="9.5" rx="3.2" fill="#8B1A2B"/>
        </g>
      </g>

      <!-- Step 4: Neighbor pulls up a chair + hot dogs -->
      <g id="pull-up-chair" class="fy-layer fy-rise">
        <circle cx="353" cy="179" r="4.3" fill="#C9946B"/>
        <rect x="349" y="185" width="9" height="14" rx="4" fill="#8B1A2B"/>

        <!-- Simple roasting sticks & hot dogs -->
        <line x1="307" y1="190" x2="326" y2="194" stroke="#8C7355" stroke-width="1.2" stroke-linecap="round"/>
        <rect x="323.5" y="192.5" width="5" height="2.6" rx="1.3" fill="#A6462A"/>
        <line x1="349" y1="190" x2="333" y2="194" stroke="#8C7355" stroke-width="1.2" stroke-linecap="round"/>
        <rect x="331" y="192.5" width="5" height="2.6" rx="1.3" fill="#A6462A"/>
      </g>

      <!-- ===================== THREE BALANCED ZONE LABELS ===================== -->
      <g class="svg-sans" font-size="9.5" font-weight="700" fill="#6E6559" letter-spacing="0.7">
        <text x="96" y="242" text-anchor="middle">BACKYARD</text>
        <text x="220" y="242" text-anchor="middle">HOME</text>
        <text x="344" y="242" text-anchor="middle">FRONT YARD</text>
      </g>
    </svg>
  </div>

  <div class="step-strip" id="step-strip" role="group" aria-label="Front Yard Life steps"></div>

  <section class="card-area" aria-label="Teaching note and navigation">
    <div class="verse-card">
      <div class="verse-card-bar" id="card-bar"></div>
      <div class="verse-card-content" id="card-content">
        <h2 class="card-heading" id="card-heading"></h2>
        <p class="card-verse" id="card-verse"><span id="verse-text"></span><span class="verse-ref" id="verse-ref"></span></p>
        <p class="card-note" id="card-note"></p>
        <p class="card-subnote is-empty" id="card-subnote"></p>
      </div>
    </div>

    <div class="nav-bar">
      <button type="button" class="nav-btn" id="prev-btn">&larr; Back</button>
      <span class="step-count" id="step-count"></span>
      <button type="button" class="nav-btn primary" id="next-btn">Next &rarr;</button>
    </div>
  </section>

  <p class="visually-hidden" id="status" aria-live="polite"></p>
</main>

<script>
(function () {
  'use strict';

  var STEPS = [
    {
      dotLabel: 'Start: Backyard Life',
      heading: 'Backyard Life',
      verse: '"...breaking bread in their homes... with glad and generous hearts"',
      ref: 'Acts 2:46',
      note: 'Close fellowship with Christian friends is a real gift, yet hospitality begins when we stop keeping all our warmth behind a closed gate.',
      subnote: '',
      accent: '#A8760A',
      accentDark: '#7D5604',
      state: {
        moved: false,
        arc: false,
        frontSetup: false,
        open: false,
        popBy: false,
        seated: false,
        finish: false
      },
      desc: 'Friends sit around a patio table and fire pit in a fenced backyard while the gate is latched, the garage is closed, and the front yard is empty.'
    },
    {
      dotLabel: 'Step 1: Move Into the Neighborhood',
      heading: 'Move Into the Neighborhood',
      verse: '"The Word became flesh and blood, and moved into the neighborhood."',
      ref: 'John 1:14 (MSG)',
      note: 'Jesus did not stay behind heaven\'s fence; live a visible, approachable life right where God has placed you.',
      subnote: 'No front yard? Yours is anywhere people pass by: apartment steps, a break room, or a dorm lounge.',
      accent: '#5F4684',
      accentDark: '#473366',
      state: {
        moved: true,
        arc: true,
        frontSetup: true,
        open: true,
        popBy: false,
        seated: false,
        finish: false
      },
      desc: 'The side gate opens, the garage door rolls up, and the same chairs and fire pit move into the front yard while the backyard remains.'
    },
    {
      dotLabel: 'Step 2: Be Quick to Listen',
      heading: 'Be Quick to Listen',
      verse: '"Let every person be quick to hear, slow to speak..."',
      ref: 'James 1:19',
      note: 'Put the spotlight on the person in front of you instead of yourself; slow down, ask open questions, and listen until they feel truly known.',
      subnote: '',
      accent: '#1F684A',
      accentDark: '#164E37',
      state: {
        moved: true,
        arc: false,
        frontSetup: true,
        open: true,
        popBy: true,
        seated: false,
        finish: false
      },
      desc: 'A neighbor walking a dog slows down and a kid on a bicycle stops by the front yard, waving.'
    },
    {
      dotLabel: 'Step 3: Make Room at the Table',
      heading: 'Make Room at the Table',
      verse: '"...seek to show hospitality."',
      ref: 'Romans 12:13',
      note: 'Hospitality is love of strangers, not entertaining to impress; share a simple meal gladly and leave an open seat for someone who cannot pay you back.',
      subnote: '',
      accent: '#A8760A',
      accentDark: '#7D5604',
      state: {
        moved: true,
        arc: false,
        frontSetup: true,
        open: true,
        popBy: true,
        seated: true,
        finish: false
      },
      desc: 'A neighbor sits in the open chair beside the fire as friends roast hot dogs together.'
    },
    {
      dotLabel: 'Step 4: Front Yard Life',
      heading: 'Front Yard Life',
      verse: '"Stay with us, for it is toward evening..."',
      ref: 'Luke 24:29',
      note: 'Welcomed people welcome others; unhurried time around an open table gives people space to feel safe, loved, and open to meeting Jesus.',
      subnote: '',
      accent: '#8B1A2B',
      accentDark: '#6D1422',
      state: {
        moved: true,
        arc: false,
        frontSetup: true,
        open: true,
        popBy: true,
        seated: true,
        finish: true
      },
      desc: 'Evening sky darkens with a crescent moon and stars, pauses briefly, and then the porch light brightens warmly over friends and neighbors gathered around the fire.'
    }
  ];

  var current = 0;

  var svgEl = document.getElementById('fy-svg');
  var svgDesc = document.getElementById('fy-svg-desc');
  var moveArc = document.getElementById('move-arc');
  var frontSetup = document.getElementById('front-setup');
  var neighborsPop = document.getElementById('neighbors-pop-by');
  var pullUp = document.getElementById('pull-up-chair');
  var finishNightSky = document.getElementById('finish-night-sky');
  var finishNightAmbient = document.getElementById('finish-night-ambient');
  var porchNightBeam = document.getElementById('porch-night-beam');
  var porchBulbLit = document.getElementById('porch-bulb-lit');

  var stripEl = document.getElementById('step-strip');
  var cardContent = document.getElementById('card-content');
  var headingEl = document.getElementById('card-heading');
  var verseWrap = document.getElementById('card-verse');
  var verseText = document.getElementById('verse-text');
  var verseRef = document.getElementById('verse-ref');
  var noteEl = document.getElementById('card-note');
  var subnoteEl = document.getElementById('card-subnote');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  var countEl = document.getElementById('step-count');
  var statusEl = document.getElementById('status');

  var dots = [];
  STEPS.forEach(function (st, idx) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'step-dot';
    btn.setAttribute('data-step', String(idx));
    btn.style.setProperty('--dot-color', st.accent);
    btn.setAttribute('aria-label', st.dotLabel);
    btn.setAttribute('aria-pressed', 'false');

    var fill = document.createElement('span');
    fill.className = 'step-dot-fill';
    btn.appendChild(fill);

    btn.addEventListener('click', function () {
      goTo(idx, true);
    });

    stripEl.appendChild(btn);
    dots.push(btn);
  });

  function applyCard(st) {
    headingEl.textContent = st.heading;
    if (st.verse) {
      verseWrap.classList.remove('is-empty');
      verseText.textContent = st.verse + (st.ref ? ' ' : '');
      verseRef.textContent = st.ref || '';
      noteEl.className = 'card-note';
    } else {
      verseWrap.classList.add('is-empty');
      verseText.textContent = '';
      verseRef.textContent = '';
      noteEl.className = 'card-note is-lead';
    }

    noteEl.textContent = st.note;

    if (st.subnote) {
      subnoteEl.textContent = st.subnote;
      subnoteEl.classList.remove('is-empty');
    } else {
      subnoteEl.textContent = '';
      subnoteEl.classList.add('is-empty');
    }
  }

  function applyScene(st) {
    var s = st.state;
    svgEl.classList.toggle('is-moved', !!s.moved);
    svgEl.classList.toggle('is-open', !!s.open);

    moveArc.classList.toggle('is-on', !!s.arc);
    frontSetup.classList.toggle('is-on', !!s.frontSetup);
    neighborsPop.classList.toggle('is-on', !!s.popBy);
    pullUp.classList.toggle('is-on', !!s.seated);
    finishNightSky.classList.toggle('is-on', !!s.finish);
    finishNightAmbient.classList.toggle('is-on', !!s.finish);
    porchNightBeam.classList.toggle('is-on', !!s.finish);
    porchBulbLit.classList.toggle('is-on', !!s.finish);

    svgDesc.textContent = st.desc;
  }

  function goTo(idx, announce) {
    current = Math.max(0, Math.min(STEPS.length - 1, idx));
    var st = STEPS[current];

    document.documentElement.style.setProperty('--step-color', st.accent);
    document.documentElement.style.setProperty('--step-dark', st.accentDark);

    applyScene(st);
    applyCard(st);

    dots.forEach(function (btn, i) {
      var isCurrent = i === current;
      btn.classList.toggle('active', isCurrent);
      btn.classList.toggle('passed', i < current);
      btn.setAttribute('aria-pressed', isCurrent ? 'true' : 'false');
    });

    prevBtn.disabled = current === 0;
    nextBtn.textContent = current === 0
      ? 'Begin \u2192'
      : (current === STEPS.length - 1 ? '\u21BB Start Over' : 'Next \u2192');
    countEl.textContent = current === 0 ? 'Start' : ('Step ' + current + ' of ' + (STEPS.length - 1));

    if (announce) {
      statusEl.textContent = (current === 0 ? 'Start' : ('Step ' + current + ' of ' + (STEPS.length - 1))) + ': ' + st.heading;
    }
  }

  prevBtn.addEventListener('click', function () {
    if (current > 0) goTo(current - 1, true);
  });

  nextBtn.addEventListener('click', function () {
    goTo(current === STEPS.length - 1 ? 0 : current + 1, true);
  });

  var lastW = window.innerWidth;
  var measuredW = 0;

  function fitCardHeight() {
    if (!cardContent) return;
    var w = cardContent.clientWidth;
    if (w > 0 && w === measuredW) return;
    measuredW = w;

    var tallest = 0;
    document.documentElement.style.setProperty('--card-h', '0px');
    STEPS.forEach(function (st) {
      applyCard(st);
      tallest = Math.max(tallest, cardContent.offsetHeight);
    });
    applyCard(STEPS[current]);
    document.documentElement.style.setProperty('--card-h', Math.max(112, tallest) + 'px');
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCardHeight, 140);
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitCardHeight);
  }

  goTo(0, false);
  fitCardHeight();
})();
</script>
</body>
</html>
