<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Front Yard Life</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --ink: #2C2416;
  --muted: #6E6559;
  --tray: #F6F4EE;
  --border: #EBE5D9;
  --paper: #FFFFFF;

  --gold: #A8760A;
  --gold-dark: #7D5604;
  --gold-wash: #FCF2D6;

  --sage: #1F684A;
  --sage-dark: #164E37;
  --sage-wash: #E1F1E9;

  --blue: #2A5B7C;
  --blue-dark: #1E435C;
  --blue-wash: #E2EEF6;

  --plum: #5F4684;
  --plum-dark: #473366;
  --plum-wash: #EDE7F6;

  --crimson: #8B1A2B;
  --crimson-dark: #6D1422;

  --step-color: #A8760A;
  --step-dark: #7D5604;
  --card-h: 118px;
}

body {
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  margin: 0;
  padding: 0;
}

.widget-outer {
  background: var(--paper);
  width: 100%;
  max-width: 100%;
  margin: 0;
  overflow: hidden;
  border: none;
  border-radius: 0;
  box-shadow: none;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    max-width: 460px;
    margin: 0 auto;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
  }
}

.title-bar {
  background: var(--ink);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  margin: 0;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  background: var(--paper);
  padding: 6px 8px 4px;
  border-bottom: 1px solid var(--border);
}

#fy-svg {
  display: block;
  width: 100%;
  height: auto;
}

.svg-sans {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* Compositor-only state reveals */
.fy-layer {
  opacity: 0;
  pointer-events: none;
}

.fy-layer.is-on {
  opacity: 1;
}

.fy-rise {
  transform: translateY(5px);
}

.fy-rise.is-on {
  transform: translateY(0);
}

#garage-door {
  transform: translateY(0);
}

#fy-svg.is-open #garage-door {
  transform: translateY(-44px);
}

#front-dark-veil {
  opacity: 0.22;
}

#fy-svg.is-open #front-dark-veil {
  opacity: 0;
}

#gate-closed {
  opacity: 1;
}

#fy-svg.is-moved #gate-closed {
  opacity: 0;
}

#gate-open {
  opacity: 0;
}

#fy-svg.is-moved #gate-open {
  opacity: 1;
}

#backyard-movable {
  opacity: 1;
}

#fy-svg.is-moved #backyard-movable {
  opacity: 0;
}

@media (prefers-reduced-motion: no-preference) {
  .fy-layer,
  #garage-door,
  #front-dark-veil,
  #gate-closed,
  #gate-open,
  #backyard-movable {
    transition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .step-dot-fill {
    transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
  }
  .nav-btn.primary,
  .verse-card-bar,
  .card-heading {
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease;
  }
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 5px;
  background: var(--tray);
  border-bottom: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  min-width: 28px;
  min-height: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
}

.step-dot-fill {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2.4px solid var(--dot-color, var(--ink));
  background: var(--paper);
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 22%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.14);
}

.card-area {
  background: var(--tray);
  padding: 7px 12px 10px;
}

.verse-card {
  background: var(--paper);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(44, 36, 22, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 13px;
  min-height: var(--card-h, 118px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-heading {
  font: 700 15px/1.22 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 4px;
}

.card-verse {
  font: 13.5px/1.36 Georgia, Cambria, serif;
  color: #3D3426;
  margin: 0;
}

.card-verse.is-empty {
  display: none;
}

.verse-ref {
  font: 600 11.5px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  white-space: nowrap;
  margin-left: 5px;
}

.card-note {
  display: block;
  margin-top: 5px;
  font: 12.5px/1.36 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #4A4238;
}

.card-note.is-lead {
  margin-top: 0;
  font: 13.5px/1.36 Georgia, Cambria, serif;
  color: #3D3426;
}

.card-subnote {
  display: block;
  margin-top: 5px;
  font: italic 12px/1.34 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #5C5347;
}

.card-subnote.is-empty {
  display: none;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  appearance: none;
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: var(--paper);
  color: var(--ink);
  font: 700 13.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FFFFFF;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.step-count {
  font: 600 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  text-align: center;
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (max-width: 395px) {
  .card-area {
    padding: 6px 10px 8px;
  }
  .verse-card-content {
    padding: 8px 11px;
  }
  .card-heading {
    font-size: 14.5px;
  }
  .card-verse {
    font-size: 13px;
  }
  .nav-btn {
    min-width: 88px;
    padding: 10px 12px;
  }
}

.visually-hidden {
  position: absolute;
  clip-path: inset(50%);
  overflow: hidden;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" aria-label="Interactive Front Yard Life hospitality diagram for 203-03">
  <header class="title-bar">
    <h1>Front Yard Life</h1>
    <span class="course-tag">203-03</span>
  </header>

  <div class="stage">
    <svg id="fy-svg" viewBox="0 12 440 246" width="100%" role="img" aria-labelledby="fy-svg-title fy-svg-desc">
      <title id="fy-svg-title">Front Yard Life: Same Chairs, Bigger Circle</title>
      <desc id="fy-svg-desc">Wide side view of a neighborhood house showing a warm backyard behind a latched privacy fence and a dark front yard on the right.</desc>

      <defs>
        <radialGradient id="porch-glow" cx="50%" cy="12%" r="85%">
          <stop offset="0%" stop-color="#FCE8AE" stop-opacity="0.72"/>
          <stop offset="100%" stop-color="#FCE8AE" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="fire-glow" cx="50%" cy="62%" r="60%">
          <stop offset="0%" stop-color="#FAD48B" stop-opacity="0.58"/>
          <stop offset="100%" stop-color="#FAD48B" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="garage-opening-clip">
          <rect x="194" y="156" width="44" height="54" rx="1"/>
        </clipPath>
      </defs>

      <!-- ===================== CLEAN GROUND BAND ===================== -->
      <rect x="14" y="210" width="136" height="16" rx="2" fill="#E6F1EA"/>
      <rect x="260" y="210" width="116" height="16" rx="2" fill="#EFECE6"/>
      <rect x="376" y="210" width="50" height="16" rx="2" fill="#DFDDD7"/>
      <line x1="14" y1="210" x2="426" y2="210" stroke="#7A7164" stroke-width="1.3"/>

      <!-- ===================== BACKYARD (LEFT): SIMPLE FENCE, STRING LIGHTS, TABLE ===================== -->
      <g id="backyard-permanent">
        <!-- Minimalist privacy fence (always remains) -->
        <rect x="20" y="148" width="116" height="62" fill="#F2ECE0" stroke="#9B8D77" stroke-width="1.2"/>
        <g stroke="#D8CEBC" stroke-width="0.9">
          <line x1="49" y1="149" x2="49" y2="209"/>
          <line x1="78" y1="149" x2="78" y2="209"/>
          <line x1="107" y1="149" x2="107" y2="209"/>
        </g>
        <line x1="20" y1="132" x2="20" y2="210" stroke="#7A6C56" stroke-width="2.4" stroke-linecap="round"/>

        <!-- Side gate (latched at Start, opens Step 1+) -->
        <g id="gate-closed">
          <rect x="136" y="150" width="14" height="60" fill="#E7DEC9" stroke="#8C7E68" stroke-width="1.2"/>
          <circle cx="145" cy="182" r="1.8" fill="#2C2416"/>
        </g>
        <g id="gate-open">
          <path d="M 136 150 L 145 144 L 145 204 L 136 210 Z" fill="#DED4BF" stroke="#8C7E68" stroke-width="1.1"/>
        </g>

        <!-- Clean string lights (stay lit across every step) -->
        <path d="M 20 135 Q 85 150 150 128" fill="none" stroke="#6E6559" stroke-width="1"/>
        <g aria-hidden="true">
          <circle cx="44" cy="141" r="3" fill="#F2B830"/>
          <circle cx="76" cy="143" r="3" fill="#F2B830"/>
          <circle cx="108" cy="140" r="3" fill="#F2B830"/>
          <circle cx="136" cy="133" r="2.8" fill="#F2B830"/>
        </g>

        <!-- Simple backyard patio table (always remains) -->
        <line x1="56" y1="192" x2="94" y2="192" stroke="#8C7B63" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="63" y1="193" x2="62" y2="210" stroke="#8C7B63" stroke-width="1.7" stroke-linecap="round"/>
        <line x1="87" y1="193" x2="88" y2="210" stroke="#8C7B63" stroke-width="1.7" stroke-linecap="round"/>
      </g>

      <!-- Backyard friends, chairs, and fire pit (Step 0 only; move out front on Step 1) -->
      <g id="backyard-movable">
        <circle cx="115" cy="199" r="16" fill="url(#fire-glow)"/>
        <path d="M 106 210 L 108 202 L 122 202 L 124 210 Z" fill="#5A5349"/>
        <path d="M 111.5 202 C 111.5 196 114 193.5 115 190.5 C 116.5 193.5 118.5 196 118.5 202 Z" fill="#E89A25"/>

        <!-- Blue chair + friend -->
        <g id="by-friend-1">
          <path d="M 36 189 L 39 200 L 49 200 M 40 200 L 38 210 M 47 200 L 49 210" fill="none" stroke="#2A5B7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="45" cy="179" r="4.3" fill="#D4A373"/>
          <rect x="40" y="185" width="9" height="14" rx="4" fill="#2A5B7C"/>
        </g>

        <!-- Sage chair + friend -->
        <g id="by-friend-2">
          <path d="M 99 189 L 96 200 L 86 200 M 95 200 L 97 210 M 88 200 L 86 210" fill="none" stroke="#1F684A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="90" cy="179" r="4.3" fill="#C68E63"/>
          <rect x="86" y="185" width="9" height="14" rx="4" fill="#1F684A"/>
        </g>
      </g>

      <!-- ===================== CENTER: SIMPLE HOUSE, GARAGE, AND FRONT PORCH ===================== -->
      <g id="house-structure">
        <!-- Clean house body & pitched roof -->
        <rect x="150" y="122" width="96" height="88" fill="#FAF7F0" stroke="#2C2416" stroke-width="1.4"/>
        <polygon points="143,123 198,84 253,123" fill="#524B42" stroke="#2C2416" stroke-width="1.4" stroke-linejoin="round"/>

        <!-- Simple warm window (no mullions) -->
        <rect x="162" y="144" width="20" height="20" rx="2" fill="#FCF0CA" stroke="#8C806D" stroke-width="1"/>

        <!-- Garage opening & smooth rolling door -->
        <g clip-path="url(#garage-opening-clip)">
          <rect x="194" y="156" width="44" height="54" fill="#FBF2DC"/>
          <rect x="194" y="156" width="44" height="44" fill="url(#porch-glow)"/>

          <g id="garage-door">
            <rect x="194" y="156" width="44" height="54" fill="#EAE5DB" stroke="#2C2416" stroke-width="1.1"/>
            <line x1="195" y1="174" x2="237" y2="174" stroke="#C4BCB0" stroke-width="1"/>
            <line x1="195" y1="192" x2="237" y2="192" stroke="#C4BCB0" stroke-width="1"/>
          </g>
        </g>
        <rect x="194" y="156" width="44" height="54" fill="none" stroke="#2C2416" stroke-width="1.3"/>

        <!-- Simple front porch overhang, column & swing -->
        <path d="M 246 144 L 280 151" fill="none" stroke="#524B42" stroke-width="4" stroke-linecap="round"/>
        <line x1="275" y1="152" x2="275" y2="210" stroke="#2C2416" stroke-width="1.5"/>

        <!-- Porch light warm wash (ON at Step 2) -->
        <g id="porch-light-wash" class="fy-layer">
          <polygon points="256,154 246,210 282,210 264,154" fill="url(#porch-glow)"/>
        </g>
        <circle id="porch-bulb" cx="259" cy="154" r="2.6" fill="#B5B0A6"/>

        <!-- Minimal porch swing -->
        <line x1="254" y1="150" x2="254" y2="191" stroke="#8C8375" stroke-width="0.9"/>
        <line x1="268" y1="152" x2="268" y2="191" stroke="#8C8375" stroke-width="0.9"/>
        <line x1="251" y1="191" x2="271" y2="191" stroke="#7D5E3F" stroke-width="2.2" stroke-linecap="round"/>

        <!-- Porch swing sitter (Step 2) -->
        <g id="porch-sitter" class="fy-layer fy-rise">
          <circle cx="260" cy="175" r="4" fill="#D9A87E"/>
          <rect x="256" y="180" width="8" height="11" rx="3.5" fill="#5F4684"/>
          <line x1="264" y1="184" x2="271" y2="179" stroke="#5F4684" stroke-width="2" stroke-linecap="round"/>
        </g>

        <!-- Dusk shadow inside closed garage & dark porch (lifts at Step 2) -->
        <g id="front-dark-veil" pointer-events="none">
          <rect x="194" y="156" width="44" height="54" fill="#2A3B4C"/>
          <polygon points="246,147 275,152 275,210 246,210" fill="#2A3B4C"/>
        </g>
      </g>

      <!-- ===================== STEP 1: SINGLE CLEAN OUTWARD ARC ===================== -->
      <g id="move-arc" class="fy-layer" aria-hidden="true">
        <path d="M 106 112 C 156 54 256 54 310 116" fill="none" stroke="#5F4684" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round" opacity="0.72"/>
        <polyline points="303,116 312,118 311,109" fill="none" stroke="#5F4684" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.82"/>
      </g>

      <!-- ===================== STEP 1+: SAME CHAIRS & FIRE PIT OUT FRONT ===================== -->
      <g id="front-setup" class="fy-layer fy-rise">
        <circle cx="320" cy="197" r="22" fill="url(#fire-glow)"/>
        <path d="M 310 210 L 312 202 L 328 202 L 330 210 Z" fill="#5A5349"/>
        <path d="M 316 202 C 316 195.5 318.8 192 320 188.5 C 321.5 192 324 195.5 324 202 Z" fill="#E89A25"/>

        <!-- Same Blue chair + Friend 1 -->
        <g id="fy-friend-1">
          <path d="M 284 189 L 287 200 L 297 200 M 288 200 L 286 210 M 295 200 L 297 210" fill="none" stroke="#2A5B7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="293" cy="179" r="4.3" fill="#D4A373"/>
          <rect x="288" y="185" width="9" height="14" rx="4" fill="#2A5B7C"/>
        </g>

        <!-- Same Sage chair + Friend 2 -->
        <g id="fy-friend-2">
          <path d="M 303 187 L 305 197 L 314 197 M 306 197 L 304 207 M 312 197 L 314 207" fill="none" stroke="#1F684A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="309" cy="177" r="4" fill="#C68E63"/>
          <rect x="305" y="183" width="8.5" height="13" rx="3.8" fill="#1F684A"/>
        </g>

        <!-- Open Gold chair left ready for a neighbor -->
        <g id="open-chair">
          <path d="M 352 189 L 349 200 L 339 200 M 348 200 L 350 210 M 341 200 L 339 210" fill="none" stroke="#A8760A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- ===================== STEP 3: NEIGHBORS POP BY ===================== -->
      <g id="neighbors-pop-by" class="fy-layer fy-rise">
        <!-- Minimalist dog walker + pup -->
        <g id="dog-walker">
          <circle cx="374" cy="175" r="4.2" fill="#E0B18A"/>
          <rect x="370" y="181" width="8.5" height="15" rx="3.8" fill="#A8760A"/>
          <line x1="372" y1="196" x2="371" y2="210" stroke="#5A5349" stroke-width="1.9" stroke-linecap="round"/>
          <line x1="376" y1="196" x2="378" y2="210" stroke="#5A5349" stroke-width="1.9" stroke-linecap="round"/>
          <line x1="370" y1="185" x2="363" y2="179" stroke="#A8760A" stroke-width="1.9" stroke-linecap="round"/>
          <line x1="378" y1="189" x2="385" y2="203" stroke="#8C8375" stroke-width="0.9"/>
          <!-- Simple 2-shape friendly dog -->
          <rect x="383" y="203" width="10" height="5.5" rx="2.7" fill="#8D6E53"/>
          <circle cx="384" cy="202" r="2.6" fill="#8D6E53"/>
        </g>

        <!-- Minimalist kid on bike -->
        <g id="kid-bike">
          <circle cx="404" cy="204" r="5.5" fill="none" stroke="#4A443C" stroke-width="1.4"/>
          <circle cx="420" cy="204" r="5.5" fill="none" stroke="#4A443C" stroke-width="1.4"/>
          <path d="M 404 204 L 412 197 L 420 204" fill="none" stroke="#2A5B7C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="412" cy="182" r="3.7" fill="#D4A373"/>
          <rect x="408.5" y="187" width="7" height="10" rx="3.2" fill="#8B1A2B"/>
        </g>
      </g>

      <!-- ===================== STEP 4: NEIGHBOR PULLS UP A CHAIR + HOT DOGS ===================== -->
      <g id="pull-up-chair" class="fy-layer fy-rise">
        <circle cx="343" cy="179" r="4.3" fill="#C9946B"/>
        <rect x="339" y="185" width="9" height="14" rx="4" fill="#8B1A2B"/>

        <!-- Simple roasting sticks & hot dogs -->
        <line x1="297" y1="190" x2="316" y2="194" stroke="#8C7355" stroke-width="1.2" stroke-linecap="round"/>
        <rect x="313.5" y="192.5" width="5" height="2.6" rx="1.3" fill="#A6462A"/>
        <line x1="339" y1="190" x2="323" y2="194" stroke="#8C7355" stroke-width="1.2" stroke-linecap="round"/>
        <rect x="321" y="192.5" width="5" height="2.6" rx="1.3" fill="#A6462A"/>
      </g>

      <!-- ===================== STEP 5 (FINISH): ONE BIGGER CIRCLE & SPARK BANNER ===================== -->
      <g id="finish-circle" class="fy-layer">
        <ellipse cx="320" cy="193" rx="42" ry="25" fill="none" stroke="#8B1A2B" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.72"/>

        <rect x="250" y="18" width="172" height="25" rx="12.5" fill="#FFFFFF" stroke="#8B1A2B" stroke-width="1.5"/>
        <text class="svg-sans" x="336" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#6D1422">Same chairs. Bigger circle.</text>
      </g>

      <!-- ===================== CLEAN LOT ZONE LABELS ===================== -->
      <g class="svg-sans" font-size="9.2" font-weight="700" fill="#6E6559" letter-spacing="0.65">
        <text x="82" y="246" text-anchor="middle">BACKYARD</text>
        <text x="206" y="246" text-anchor="middle">HOME</text>
        <text x="320" y="246" text-anchor="middle">FRONT YARD</text>
        <text x="400" y="246" text-anchor="middle">STREET</text>
      </g>
    </svg>
  </div>

  <div class="step-strip" id="step-strip" role="group" aria-label="Front Yard Life steps"></div>

  <section class="card-area" aria-label="Teaching note and navigation">
    <div class="verse-card">
      <div class="verse-card-bar" id="card-bar"></div>
      <div class="verse-card-content" id="card-content">
        <h2 class="card-heading" id="card-heading"></h2>
        <p class="card-verse" id="card-verse"><span id="verse-text"></span><span class="verse-ref" id="verse-ref"></span></p>
        <p class="card-note" id="card-note"></p>
        <p class="card-subnote is-empty" id="card-subnote"></p>
      </div>
    </div>

    <div class="nav-bar">
      <button type="button" class="nav-btn" id="prev-btn">&larr; Back</button>
      <span class="step-count" id="step-count"></span>
      <button type="button" class="nav-btn primary" id="next-btn">Next &rarr;</button>
    </div>
  </section>

  <p class="visually-hidden" id="status" aria-live="polite"></p>
</main>

<script>
(function () {
  'use strict';

  var STEPS = [
    {
      dotLabel: 'Start: Backyard Life',
      heading: 'Backyard Life',
      verse: '"...breaking bread in their homes, they received their food with glad and generous hearts"',
      ref: 'Acts 2:46',
      note: 'Close friendship around your own table is a gift. Yet behind a latched gate, nobody on the street can see it.',
      subnote: '',
      accent: '#A8760A',
      accentDark: '#7D5604',
      state: {
        moved: false,
        arc: false,
        frontSetup: false,
        open: false,
        popBy: false,
        seated: false,
        finish: false
      },
      desc: 'Friends sit around a patio table and fire pit in a fenced backyard under string lights while the gate is latched and the front of the house is dark.'
    },
    {
      dotLabel: 'Step 1: Carry Your Chairs Out Front',
      heading: '1. Carry Your Chairs Out Front',
      verse: '"Welcome one another as Christ has welcomed you, for the glory of God."',
      ref: 'Romans 15:7',
      note: "Same chairs, same fire pit, same friends, moved onto the driveway. Jesus did not stay behind heaven's fence; He came and dwelt among us (John 1:14).",
      subnote: '',
      accent: '#5F4684',
      accentDark: '#473366',
      state: {
        moved: true,
        arc: true,
        frontSetup: true,
        open: false,
        popBy: false,
        seated: false,
        finish: false
      },
      desc: 'The side gate opens and the same lawn chairs and fire pit move around the house onto the front driveway while the backyard fence and string lights remain.'
    },
    {
      dotLabel: 'Step 2: Open Up',
      heading: '2. Open Up',
      verse: '',
      ref: '',
      note: 'Roll up the garage door, turn on the porch light, and take a seat on the swing. Being seen is half of hospitality.',
      subnote: 'No porch? Your front yard is wherever people can see you and stop by: the apartment steps, the break room, the dorm lounge.',
      accent: '#2A5B7C',
      accentDark: '#1E435C',
      state: {
        moved: true,
        arc: false,
        frontSetup: true,
        open: true,
        popBy: false,
        seated: false,
        finish: false
      },
      desc: 'The garage door rolls up, the porch light turns on with a warm golden glow, and someone waves from the porch swing.'
    },
    {
      dotLabel: 'Step 3: People Pop By',
      heading: '3. People Pop By',
      verse: '',
      ref: '',
      note: 'A dog walker slows down, a kid on a bike stops, and neighbors wave. Nobody needed a formal invite. Practice the Listen rhythm: ask, ask again, remember.',
      subnote: '',
      accent: '#1F684A',
      accentDark: '#164E37',
      state: {
        moved: true,
        arc: false,
        frontSetup: true,
        open: true,
        popBy: true,
        seated: false,
        finish: false
      },
      desc: 'A neighbor walking a dog slows down on the sidewalk and a kid on a bicycle stops by the curb, waving toward the front yard.'
    },
    {
      dotLabel: 'Step 4: Pull Up a Chair',
      heading: '4. Pull Up a Chair',
      verse: '"Contribute to the needs of the saints and seek to show hospitality."',
      ref: 'Romans 12:13',
      note: 'Leave one chair open by the fire and bring out simple food like hot dogs. Paul uses a word that means love of strangers.',
      subnote: '',
      accent: '#A8760A',
      accentDark: '#7D5604',
      state: {
        moved: true,
        arc: false,
        frontSetup: true,
        open: true,
        popBy: true,
        seated: true,
        finish: false
      },
      desc: 'A neighbor sits in the open chair beside the fire as friends roast hot dogs together.'
    },
    {
      dotLabel: 'Step 5: Front Yard Life',
      heading: '5. Front Yard Life',
      verse: '"Stay with us, for it is toward evening and the day is now far spent."',
      ref: 'Luke 24:29',
      note: 'Same chairs. Bigger circle. Two friends on the road to Emmaus asked a stranger to stay, and at their table it turned out to be Jesus.',
      subnote: '',
      accent: '#8B1A2B',
      accentDark: '#6D1422',
      state: {
        moved: true,
        arc: false,
        frontSetup: true,
        open: true,
        popBy: true,
        seated: true,
        finish: true
      },
      desc: 'Backyard friends and new neighbors sit in one circle around one fire in the lit front yard, crowned by the line Same chairs. Bigger circle.'
    }
  ];

  var current = 0;

  var svgEl = document.getElementById('fy-svg');
  var svgDesc = document.getElementById('fy-svg-desc');
  var moveArc = document.getElementById('move-arc');
  var frontSetup = document.getElementById('front-setup');
  var porchGlow = document.getElementById('porch-light-wash');
  var porchBulb = document.getElementById('porch-bulb');
  var porchSitter = document.getElementById('porch-sitter');
  var neighborsPop = document.getElementById('neighbors-pop-by');
  var pullUp = document.getElementById('pull-up-chair');
  var finishCircle = document.getElementById('finish-circle');

  var stripEl = document.getElementById('step-strip');
  var cardContent = document.getElementById('card-content');
  var headingEl = document.getElementById('card-heading');
  var verseWrap = document.getElementById('card-verse');
  var verseText = document.getElementById('verse-text');
  var verseRef = document.getElementById('verse-ref');
  var noteEl = document.getElementById('card-note');
  var subnoteEl = document.getElementById('card-subnote');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  var countEl = document.getElementById('step-count');
  var statusEl = document.getElementById('status');

  var dots = [];
  STEPS.forEach(function (st, idx) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'step-dot';
    btn.setAttribute('data-step', String(idx));
    btn.style.setProperty('--dot-color', st.accent);
    btn.setAttribute('aria-label', st.dotLabel);
    btn.setAttribute('aria-pressed', 'false');

    var fill = document.createElement('span');
    fill.className = 'step-dot-fill';
    btn.appendChild(fill);

    btn.addEventListener('click', function () {
      goTo(idx, true);
    });

    stripEl.appendChild(btn);
    dots.push(btn);
  });

  function applyCard(st) {
    headingEl.textContent = st.heading;
    if (st.verse) {
      verseWrap.classList.remove('is-empty');
      verseText.textContent = st.verse;
      verseRef.textContent = st.ref ? (' ' + st.ref) : '';
      noteEl.className = 'card-note';
    } else {
      verseWrap.classList.add('is-empty');
      verseText.textContent = '';
      verseRef.textContent = '';
      noteEl.className = 'card-note is-lead';
    }

    noteEl.textContent = '';
    if (st.note.indexOf('Same chairs. Bigger circle. ') === 0) {
      var strong = document.createElement('strong');
      strong.textContent = 'Same chairs. Bigger circle. ';
      noteEl.appendChild(strong);
      noteEl.appendChild(document.createTextNode(st.note.slice('Same chairs. Bigger circle. '.length)));
    } else {
      noteEl.textContent = st.note;
    }

    if (st.subnote) {
      subnoteEl.textContent = st.subnote;
      subnoteEl.classList.remove('is-empty');
    } else {
      subnoteEl.textContent = '';
      subnoteEl.classList.add('is-empty');
    }
  }

  function applyScene(st) {
    var s = st.state;
    svgEl.classList.toggle('is-moved', !!s.moved);
    svgEl.classList.toggle('is-open', !!s.open);

    moveArc.classList.toggle('is-on', !!s.arc);
    frontSetup.classList.toggle('is-on', !!s.frontSetup);
    porchGlow.classList.toggle('is-on', !!s.open);
    porchSitter.classList.toggle('is-on', !!s.open);
    porchBulb.setAttribute('fill', s.open ? '#F5C242' : '#B5B0A6');
    neighborsPop.classList.toggle('is-on', !!s.popBy);
    pullUp.classList.toggle('is-on', !!s.seated);
    finishCircle.classList.toggle('is-on', !!s.finish);

    svgDesc.textContent = st.desc;
  }

  function goTo(idx, announce) {
    current = Math.max(0, Math.min(STEPS.length - 1, idx));
    var st = STEPS[current];

    document.documentElement.style.setProperty('--step-color', st.accent);
    document.documentElement.style.setProperty('--step-dark', st.accentDark);

    applyScene(st);
    applyCard(st);

    dots.forEach(function (btn, i) {
      var isCurrent = i === current;
      btn.classList.toggle('active', isCurrent);
      btn.classList.toggle('passed', i < current);
      btn.setAttribute('aria-pressed', isCurrent ? 'true' : 'false');
    });

    prevBtn.disabled = current === 0;
    nextBtn.textContent = current === 0
      ? 'Begin \u2192'
      : (current === STEPS.length - 1 ? '\u21BB Start Over' : 'Next \u2192');
    countEl.textContent = current === 0 ? 'Start' : ('Step ' + current + ' of ' + (STEPS.length - 1));

    if (announce) {
      statusEl.textContent = (current === 0 ? 'Start' : ('Step ' + current + ' of ' + (STEPS.length - 1))) + ': ' + st.heading;
    }
  }

  prevBtn.addEventListener('click', function () {
    if (current > 0) goTo(current - 1, true);
  });

  nextBtn.addEventListener('click', function () {
    goTo(current === STEPS.length - 1 ? 0 : current + 1, true);
  });

  var lastW = window.innerWidth;
  var measuredW = 0;

  function fitCardHeight() {
    if (!cardContent) return;
    var w = cardContent.clientWidth;
    if (w > 0 && w === measuredW) return;
    measuredW = w;

    var tallest = 0;
    document.documentElement.style.setProperty('--card-h', '0px');
    STEPS.forEach(function (st) {
      applyCard(st);
      tallest = Math.max(tallest, cardContent.offsetHeight);
    });
    applyCard(STEPS[current]);
    document.documentElement.style.setProperty('--card-h', Math.max(112, tallest) + 'px');
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCardHeight, 140);
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitCardHeight);
  }

  goTo(0, false);
  fitCardHeight();
})();
</script>
</body>
</html>
