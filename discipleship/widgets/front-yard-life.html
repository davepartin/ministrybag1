<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Front Yard Life</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --ink: #2C2416;
  --muted: #6E6559;
  --tray: #F6F4EE;
  --border: #EBE5D9;
  --paper: #FFFFFF;

  --gold: #A8760A;
  --gold-dark: #7D5604;
  --gold-wash: #FCF2D6;

  --sage: #1F684A;
  --sage-dark: #164E37;
  --sage-wash: #E1F1E9;

  --blue: #2A5B7C;
  --blue-dark: #1E435C;
  --blue-wash: #E2EEF6;

  --plum: #5F4684;
  --plum-dark: #473366;
  --plum-wash: #EDE7F6;

  --crimson: #8B1A2B;
  --crimson-dark: #6D1422;

  --step-color: #A8760A;
  --step-dark: #7D5604;
  --card-h: 118px;
}

body {
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  margin: 0;
  padding: 0;
}

.widget-outer {
  background: var(--paper);
  width: 100%;
  max-width: 100%;
  margin: 0;
  overflow: hidden;
  border: none;
  border-radius: 0;
  box-shadow: none;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    max-width: 460px;
    margin: 0 auto;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
  }
}

.title-bar {
  background: var(--ink);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  margin: 0;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  background: var(--paper);
  padding: 6px 8px 4px;
  border-bottom: 1px solid var(--border);
}

#fy-svg {
  display: block;
  width: 100%;
  height: auto;
}

.svg-sans {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* Compositor-only state reveals */
.fy-layer {
  opacity: 0;
  pointer-events: none;
}

.fy-layer.is-on {
  opacity: 1;
}

.fy-rise {
  transform: translateY(5px);
}

.fy-rise.is-on {
  transform: translateY(0);
}

#garage-door {
  transform: translateY(0);
}

#fy-svg.is-open #garage-door {
  transform: translateY(-48px);
}

#front-dark-veil {
  opacity: 0.24;
}

#fy-svg.is-open #front-dark-veil {
  opacity: 0;
}

#gate-closed {
  opacity: 1;
}

#fy-svg.is-moved #gate-closed {
  opacity: 0;
}

#gate-open {
  opacity: 0;
}

#fy-svg.is-moved #gate-open {
  opacity: 1;
}

#backyard-movable {
  opacity: 1;
}

#fy-svg.is-moved #backyard-movable {
  opacity: 0;
}

@media (prefers-reduced-motion: no-preference) {
  .fy-layer,
  #garage-door,
  #front-dark-veil,
  #gate-closed,
  #gate-open,
  #backyard-movable {
    transition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .step-dot-fill {
    transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
  }
  .nav-btn.primary,
  .verse-card-bar,
  .card-heading {
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease;
  }
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 5px;
  background: var(--tray);
  border-bottom: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  min-width: 28px;
  min-height: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
}

.step-dot-fill {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2.4px solid var(--dot-color, var(--ink));
  background: var(--paper);
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 22%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.14);
}

.card-area {
  background: var(--tray);
  padding: 7px 12px 10px;
}

.verse-card {
  background: var(--paper);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(44, 36, 22, 0.05);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 13px;
  min-height: var(--card-h, 118px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-heading {
  font: 700 15px/1.22 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-dark);
  margin: 0 0 4px;
}

.card-verse {
  font: 13.5px/1.36 Georgia, Cambria, serif;
  color: #3D3426;
  margin: 0;
}

.card-verse.is-empty {
  display: none;
}

.verse-ref {
  font: 600 11.5px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  white-space: nowrap;
  margin-left: 5px;
}

.card-note {
  display: block;
  margin-top: 5px;
  font: 12.5px/1.36 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #4A4238;
}

.card-note.is-lead {
  margin-top: 0;
  font: 13.5px/1.36 Georgia, Cambria, serif;
  color: #3D3426;
}

.card-subnote {
  display: block;
  margin-top: 5px;
  font: italic 12px/1.34 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #5C5347;
}

.card-subnote.is-empty {
  display: none;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
}

.nav-btn {
  appearance: none;
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #D4CFC4;
  background: var(--paper);
  color: var(--ink);
  font: 700 13.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FFFFFF;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.step-count {
  font: 600 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  text-align: center;
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (max-width: 395px) {
  .card-area {
    padding: 6px 10px 8px;
  }
  .verse-card-content {
    padding: 8px 11px;
  }
  .card-heading {
    font-size: 14.5px;
  }
  .card-verse {
    font-size: 13px;
  }
  .nav-btn {
    min-width: 88px;
    padding: 10px 12px;
  }
}

.visually-hidden {
  position: absolute;
  clip-path: inset(50%);
  overflow: hidden;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" aria-label="Interactive Front Yard Life hospitality diagram for 203-03">
  <header class="title-bar">
    <h1>Front Yard Life</h1>
    <span class="course-tag">203-03</span>
  </header>

  <div class="stage">
    <svg id="fy-svg" viewBox="0 0 440 278" width="100%" role="img" aria-labelledby="fy-svg-title fy-svg-desc">
      <title id="fy-svg-title">Front Yard Life: Same Chairs, Bigger Circle</title>
      <desc id="fy-svg-desc">Wide side view of a neighborhood house showing a warm backyard behind a latched privacy fence and a dark front yard on the right.</desc>

      <defs>
        <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#EEF3F8"/>
          <stop offset="100%" stop-color="#FAF9F6"/>
        </linearGradient>
        <radialGradient id="porch-glow" cx="50%" cy="15%" r="82%">
          <stop offset="0%" stop-color="#FCE8AE" stop-opacity="0.72"/>
          <stop offset="100%" stop-color="#FCE8AE" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="fire-glow" cx="50%" cy="62%" r="60%">
          <stop offset="0%" stop-color="#FAD48B" stop-opacity="0.65"/>
          <stop offset="100%" stop-color="#FAD48B" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="garage-opening-clip">
          <rect x="195" y="158" width="44" height="58" rx="1"/>
        </clipPath>
      </defs>

      <!-- Quiet Studio Wash twilight backdrop -->
      <rect x="8" y="8" width="424" height="232" rx="8" fill="url(#sky-grad)" stroke="#EBE5D9" stroke-width="1"/>

      <!-- Soft background neighborhood trees (subtle context) -->
      <g aria-hidden="true" opacity="0.34">
        <circle cx="38" cy="116" r="22" fill="#D5E5DA"/>
        <circle cx="56" cy="126" r="18" fill="#C4DACB"/>
        <circle cx="408" cy="128" r="21" fill="#D5E5DA"/>
        <rect x="405" y="148" width="5" height="72" fill="#B5AB9A"/>
      </g>

      <!-- ===================== GROUND BAND: BACKYARD | HOUSE | DRIVEWAY | SIDEWALK | STREET ===================== -->
      <!-- Backyard grass & stone patio -->
      <rect x="8" y="216" width="144" height="24" fill="#E3F0E7"/>
      <rect x="24" y="215" width="106" height="8" rx="2" fill="#E7E1D5" stroke="#C8C0B1" stroke-width="0.9"/>

      <!-- Front yard lawn, concrete driveway, sidewalk, and street -->
      <rect x="266" y="216" width="22" height="24" fill="#E3F0E7"/>
      <rect x="286" y="216" width="76" height="24" fill="#ECEAE4"/>
      <rect x="362" y="216" width="24" height="24" fill="#F4F2EC"/>
      <rect x="386" y="218" width="46" height="22" fill="#DFDDD7"/>
      <!-- Street curb & subtle lane dash -->
      <line x1="386" y1="216" x2="386" y2="240" stroke="#B7B1A6" stroke-width="1.4"/>
      <line x1="362" y1="216" x2="362" y2="240" stroke="#C9C3B7" stroke-width="1"/>
      <line x1="400" y1="229" x2="418" y2="229" stroke="#FFFFFF" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.85"/>
      <!-- Crisp continuous ground baseline -->
      <line x1="8" y1="216" x2="432" y2="216" stroke="#8C8375" stroke-width="1.2"/>

      <!-- ===================== BACKYARD (LEFT): PRIVACY FENCE, STRING LIGHTS, PATIO ===================== -->
      <g id="backyard-permanent">
        <!-- Tall privacy fence along back & left edge (always remains!) -->
        <rect x="16" y="146" width="122" height="70" fill="#EFE8DA" stroke="#8E7E66" stroke-width="1.2"/>
        <!-- Fence vertical boards -->
        <g stroke="#C6B9A3" stroke-width="0.9">
          <line x1="28" y1="146" x2="28" y2="216"/>
          <line x1="40" y1="146" x2="40" y2="216"/>
          <line x1="52" y1="146" x2="52" y2="216"/>
          <line x1="64" y1="146" x2="64" y2="216"/>
          <line x1="76" y1="146" x2="76" y2="216"/>
          <line x1="88" y1="146" x2="88" y2="216"/>
          <line x1="100" y1="146" x2="100" y2="216"/>
          <line x1="112" y1="146" x2="112" y2="216"/>
          <line x1="124" y1="146" x2="124" y2="216"/>
        </g>
        <!-- Horizontal fence rails -->
        <line x1="16" y1="160" x2="138" y2="160" stroke="#A6977F" stroke-width="1.1"/>

        <!-- Tall fence corner post for string lights -->
        <rect x="14" y="132" width="5" height="84" rx="1" fill="#A69378" stroke="#5E5242" stroke-width="1"/>

        <!-- Side yard gate connecting backyard to front (latched initially, opens Step 1+) -->
        <g id="gate-closed">

        <!-- Warm backyard string lights (stay lit across every step: backyard is a gift, never erased) -->
        <path d="M 18 135 Q 84 152 152 126" fill="none" stroke="#5A5144" stroke-width="1"/>
        <g aria-hidden="true">

        <!-- Quiet backyard patio table (always remains on the patio) -->
        <line x1="56" y1="196" x2="96" y2="196" stroke="#7D6B53" stroke-width="2.6" stroke-linecap="round"/>
        <line x1="63" y1="197" x2="61" y2="215" stroke="#7D6B53" stroke-width="1.8" stroke-linecap="round"/>

      </g>

      <!-- Backyard friends, chairs, and small fire pit (Step 0 only; same items move out front on Step 1!) -->
      <g id="backyard-movable">
        <!-- Backyard fire glow & pit -->
        <circle cx="115" cy="204" r="18" fill="url(#fire-glow)"/>
        <path d="M 105 215 L 107 207 L 123 207 L 125 215 Z" fill="#5A5349" stroke="#2C2416" stroke-width="1.1"/>

        <path d="M 113 207 C 113 203 114.5 201 115 199 C 116 201 117 203 117 207 Z" fill="#FAD76B"/>

        <!-- Left backyard lawn chair (Blue) + friend -->
        <g id="by-friend-1">
          <path d="M 35 193 L 38 205 L 49 205 M 39 205 L 36 215 M 47 205 L 49 215" fill="none" stroke="#2A5B7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="44" cy="183" r="4.5" fill="#D4A373" stroke="#2C2416" stroke-width="1"/>
          <path d="M 39 189 C 41 188 47 188 49 193 L 50 203 L 40 203 Z" fill="#2A5B7C"/>
          <line x1="48" y1="194" x2="58" y2="195" stroke="#2A5B7C" stroke-width="2.2" stroke-linecap="round"/>
        </g>

        <!-- Right backyard lawn chair (Sage) + friend -->
        <g id="by-friend-2">
          <path d="M 101 193 L 98 205 L 87 205 M 97 205 L 100 215 M 89 205 L 87 215" fill="none" stroke="#1F684A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="92" cy="183" r="4.5" fill="#C68E63" stroke="#2C2416" stroke-width="1"/>
          <path d="M 87 193 C 89 188 95 188 97 189 L 96 203 L 86 203 Z" fill="#1F684A"/>
          <line x1="88" y1="194" x2="78" y2="195" stroke="#1F684A" stroke-width="2.2" stroke-linecap="round"/>
        </g>

        <!-- Two mugs on backyard table -->
        <rect x="67" y="191" width="4" height="4" rx="0.6" fill="#FAF8F3" stroke="#2C2416" stroke-width="0.8"/>
        <rect x="78" y="191" width="4" height="4" rx="0.6" fill="#FAF8F3" stroke="#2C2416" stroke-width="0.8"/>
      </g>

      <!-- ===================== CENTER: THE HOUSE, GARAGE, AND FRONT PORCH ===================== -->
      <g id="house-structure">
        <!-- Main house body -->
        <rect x="152" y="124" width="96" height="92" fill="#FAF6ED" stroke="#2C2416" stroke-width="1.5"/>
        <!-- Subtle clapboard siding lines -->

        <!-- Pitched neighborhood roof & chimney -->

          <rect x="211" y="175" width="7" height="5" rx="1" fill="#BFA482"/>

            <rect x="195" y="158" width="44" height="58" fill="#E8E3D8" stroke="#2C2416" stroke-width="1.2"/>
            <line x1="196" y1="172" x2="238" y2="172" stroke="#BDB5A6" stroke-width="1"/>

            <!-- Small top garage windows -->

          </g>
        </g>
        <!-- Crisp garage frame -->
        <rect x="195" y="158" width="44" height="58" fill="none" stroke="#2C2416" stroke-width="1.4"/>

        <!-- Front Porch overhang, column, deck & steps -->
        <polygon points="248,144 284,152 284,156 248,150" fill="#524B42" stroke="#2C2416" stroke-width="1.3" stroke-linejoin="round"/>
        <rect x="276" y="155" width="4" height="56" fill="#FAF6ED" stroke="#2C2416" stroke-width="1.1"/>
        <rect x="248" y="210" width="34" height="6" fill="#DCD4C5" stroke="#2C2416" stroke-width="1.1"/>
        <rect x="282" y="213" width="6" height="3" fill="#DCD4C5" stroke="#2C2416" stroke-width="0.9"/>

        <!-- Porch light fixture (OFF initially, warm golden wash ON at Step 2) -->
        <g id="porch-light-wash" class="fy-layer">
          <polygon points="256,156 244,214 288,214 264,156" fill="url(#porch-glow)"/>
          <circle cx="258" cy="158" r="7" fill="#FAD76B" opacity="0.65"/>
        </g>
        <rect x="255" y="154" width="6" height="6" rx="1" fill="#4A443C" stroke="#2C2416" stroke-width="0.9"/>
        <circle id="porch-bulb" cx="258" cy="158" r="2" fill="#B5B0A6"/>

        <!-- Porch swing hanging from porch ceiling -->
        <line x1="255" y1="152" x2="255" y2="195" stroke="#7A7266" stroke-width="0.9"/>
        <line x1="270" y1="154" x2="270" y2="195" stroke="#7A7266" stroke-width="0.9"/>
        <path d="M 252 187 L 252 197 L 273 197 L 273 194" fill="none" stroke="#7D5E3F" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Porch swing sitter (appears on Step 2: Open Up!) -->
        <g id="porch-sitter" class="fy-layer fy-rise">
          <circle cx="261" cy="179" r="4.2" fill="#D9A87E" stroke="#2C2416" stroke-width="0.9"/>
          <path d="M 256 184 C 258 183 263 183 265 188 L 266 196 L 256 196 Z" fill="#5F4684"/>
          <!-- Friendly waving arm toward the street -->
          <path d="M 264 188 L 272 183" fill="none" stroke="#5F4684" stroke-width="2" stroke-linecap="round"/>
        </g>

        <!-- Dusk shadow strictly inside closed garage & dark porch (lifts cleanly on Step 2!) -->
        <g id="front-dark-veil" pointer-events="none">
          <rect x="195" y="158" width="44" height="58" fill="#2A3B4C"/>
          <polygon points="248,150 280,155 280,210 248,210" fill="#2A3B4C"/>
        </g>
      </g>

      <!-- ===================== STEP 1: OUTWARD MOVE ARC (BACKYARD -> FRONT YARD) ===================== -->
      <g id="move-arc" class="fy-layer" aria-hidden="true">
        <path d="M 108 112 C 156 54 256 54 308 118" fill="none" stroke="#5F4684" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round" opacity="0.68"/>
        <polyline points="301,118 310,120 309,111" fill="none" stroke="#5F4684" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
        <polyline points="295,112 304,114 303,105" fill="none" stroke="#5F4684" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.38"/>
      </g>

      <!-- ===================== STEP 1+: SAME CHAIRS & FIRE PIT OUT FRONT ===================== -->
      <g id="front-setup" class="fy-layer fy-rise">
        <!-- Warm fire glow on the front driveway -->
        <circle cx="322" cy="202" r="24" fill="url(#fire-glow)"/>

        <!-- Same round fire pit -->
        <path d="M 311 216 L 313 207 L 331 207 L 333 216 Z" fill="#5A5349" stroke="#2C2416" stroke-width="1.2"/>
        <path d="M 317 207 C 317 200 320.5 196 322 192 C 324.5 196 327 200 327 207 Z" fill="#E08B1F"/>
        <path d="M 319.5 207 C 319.5 202.5 321 200 322 197.5 C 323.5 200 324.5 202.5 324.5 207 Z" fill="#FAD76B"/>

        <!-- Same Blue lawn chair + Friend 1 (left of fire) -->
        <g id="fy-friend-1">
          <path d="M 285 193 L 288 205 L 299 205 M 289 205 L 286 216 M 297 205 L 299 216" fill="none" stroke="#2A5B7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="294" cy="183" r="4.5" fill="#D4A373" stroke="#2C2416" stroke-width="1"/>
          <path d="M 289 189 C 291 188 297 188 299 193 L 300 203 L 290 203 Z" fill="#2A5B7C"/>
        </g>

        <!-- Same Sage lawn chair + Friend 2 (just behind/beside fire) -->
        <g id="fy-friend-2">
          <path d="M 304 191 L 306 202 L 315 202 M 307 202 L 305 212 M 313 202 L 315 212" fill="none" stroke="#1F684A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="310" cy="181" r="4.1" fill="#C68E63" stroke="#2C2416" stroke-width="0.95"/>
          <path d="M 306 187 C 308 186 313 186 315 191 L 315 200 L 306 200 Z" fill="#1F684A"/>
        </g>

        <!-- Open Street-Side Chair left intentionally ready for a neighbor! -->
        <g id="open-chair">
          <path d="M 353 193 L 350 205 L 339 205 M 349 205 L 352 216 M 341 205 L 339 216" fill="none" stroke="#A8760A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- ===================== STEP 3: NEIGHBORS POP BY ON SIDEWALK & STREET ===================== -->
      <g id="neighbors-pop-by" class="fy-layer fy-rise">
        <!-- Dog walker slowing down on sidewalk -->
        <g id="dog-walker" transform="translate(4 0)">
          <circle cx="372" cy="179" r="4.4" fill="#E0B18A" stroke="#2C2416" stroke-width="0.95"/>
          <path d="M 368 185 L 376 185 L 377 202 L 367 202 Z" fill="#A8760A"/>
          <line x1="370" y1="202" x2="369" y2="216" stroke="#4A443C" stroke-width="2" stroke-linecap="round"/>
          <line x1="374" y1="202" x2="376" y2="216" stroke="#4A443C" stroke-width="2" stroke-linecap="round"/>
          <!-- Waving hand toward yard + leash to friendly pup -->
          <line x1="368" y1="189" x2="361" y2="183" stroke="#A8760A" stroke-width="1.9" stroke-linecap="round"/>
          <path d="M 376 193 Q 380 202 383 207" fill="none" stroke="#6E6559" stroke-width="0.9"/>
          <!-- Happy little neighborhood dog -->
          <ellipse cx="386" cy="210" rx="5" ry="3" fill="#8D6E53" stroke="#2C2416" stroke-width="0.85"/>
          <circle cx="382" cy="207.5" r="2.5" fill="#8D6E53" stroke="#2C2416" stroke-width="0.8"/>
          <line x1="383" y1="212" x2="383" y2="216" stroke="#5C4430" stroke-width="1.2"/>
          <line x1="389" y1="212" x2="389" y2="216" stroke="#5C4430" stroke-width="1.2"/>
          <line x1="391" y1="209" x2="393" y2="206" stroke="#8D6E53" stroke-width="1.2" stroke-linecap="round"/>
        </g>

        <!-- Kid on bicycle pausing near street edge -->
        <g id="kid-bike">
          <circle cx="405" cy="211" r="6" fill="none" stroke="#2C2416" stroke-width="1.3"/>
          <circle cx="422" cy="211" r="6" fill="none" stroke="#2C2416" stroke-width="1.3"/>
          <path d="M 405 211 L 413 203 L 420 203 L 422 211 M 413 203 L 415 211 L 422 211 M 411 199 L 415 199" fill="none" stroke="#2A5B7C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="414" cy="187" r="3.8" fill="#D4A373" stroke="#2C2416" stroke-width="0.9"/>
          <path d="M 411 192 L 417 192 L 418 202 L 410 202 Z" fill="#8B1A2B"/>
          <line x1="411" y1="195" x2="406" y2="198" stroke="#8B1A2B" stroke-width="1.7" stroke-linecap="round"/>
        </g>
      </g>

      <!-- ===================== STEP 4: NEIGHBOR PULLS UP A CHAIR + HOT DOGS OVER THE FIRE ===================== -->
      <g id="pull-up-chair" class="fy-layer fy-rise">
        <!-- Neighbor sitting warmly in the open chair facing the fire -->
        <circle cx="344" cy="183" r="4.5" fill="#C9946B" stroke="#2C2416" stroke-width="1"/>
        <path d="M 339 193 C 341 188 347 188 349 189 L 348 203 L 338 203 Z" fill="#8B1A2B"/>

        <!-- Simple roasting sticks & hot dogs over the fire (Eat half!) -->
        <line x1="298" y1="194" x2="318" y2="198" stroke="#7A5C38" stroke-width="1.2" stroke-linecap="round"/>
        <rect x="315" y="196.2" width="5.5" height="2.8" rx="1.4" fill="#A6462A" stroke="#6D2814" stroke-width="0.6"/>
        <line x1="340" y1="194" x2="325" y2="198" stroke="#7A5C38" stroke-width="1.2" stroke-linecap="round"/>
        <rect x="323" y="196.2" width="5.5" height="2.8" rx="1.4" fill="#A6462A" stroke="#6D2814" stroke-width="0.6"/>
      </g>

      <!-- ===================== STEP 5 (FINISH): ONE BIGGER CIRCLE & SPARK BANNER ===================== -->
      <g id="finish-circle" class="fy-layer">
        <!-- Warm Studio Wash hospitality arc uniting backyard friends and new neighbors around one fire -->
        <ellipse cx="320" cy="198" rx="43" ry="26" fill="none" stroke="#8B1A2B" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.68"/>
        <ellipse cx="320" cy="198" rx="46.5" ry="29.5" fill="none" stroke="#A8760A" stroke-width="0.95" opacity="0.38"/>

        <!-- Crisp spark banner pill in upper right sky with generous side padding -->
        <rect x="250" y="21" width="172" height="25" rx="12.5" fill="#FFFFFF" fill-opacity="0.96" stroke="#8B1A2B" stroke-width="1.5"/>
        <text class="svg-sans" x="336" y="37" text-anchor="middle" font-size="11" font-weight="700" fill="#6D1422">Same chairs. Bigger circle.</text>
      </g>

      <!-- ===================== CLEAN LOT ZONE LABELS (LEFT TO RIGHT) ===================== -->
      <g class="svg-sans" font-size="9.2" font-weight="700" fill="#6E6559" letter-spacing="0.65">
        <text x="76" y="259" text-anchor="middle">BACKYARD</text>
        <text x="208" y="259" text-anchor="middle">HOME</text>
        <text x="322" y="259" text-anchor="middle">FRONT YARD</text>
        <text x="400" y="259" text-anchor="middle">STREET</text>
      </g>
    </svg>
  </div>

  <div class="step-strip" id="step-strip" role="group" aria-label="Front Yard Life steps"></div>

  <section class="card-area" aria-label="Teaching note and navigation">
    <div class="verse-card">
      <div class="verse-card-bar" id="card-bar"></div>
      <div class="verse-card-content" id="card-content">
        <h2 class="card-heading" id="card-heading"></h2>
        <p class="card-verse" id="card-verse"><span id="verse-text"></span><span class="verse-ref" id="verse-ref"></span></p>
        <p class="card-note" id="card-note"></p>
        <p class="card-subnote is-empty" id="card-subnote"></p>
      </div>
    </div>

    <div class="nav-bar">
      <button type="button" class="nav-btn" id="prev-btn">&larr; Back</button>
      <span class="step-count" id="step-count"></span>
      <button type="button" class="nav-btn primary" id="next-btn">Next &rarr;</button>
    </div>
  </section>

  <p class="visually-hidden" id="status" aria-live="polite"></p>
</main>

<script>
(function () {
  'use strict';

  var STEPS = [
    {
      dotLabel: 'Start: Backyard Life',
      heading: 'Backyard Life',
      verse: '"...breaking bread in their homes, they received their food with glad and generous hearts"',
      ref: 'Acts 2:46',
      note: 'Close friendship around your own table is a gift. Yet behind a latched gate, nobody on the street can see it.',
      subnote: '',
      accent: '#A8760A',
      accentDark: '#7D5604',
      state: {
        moved: false,
        arc: false,
        frontSetup: false,
        open: false,
        popBy: false,
        seated: false,
        finish: false
      },
      desc: 'Friends sit around a patio table and fire pit in a fenced backyard under string lights while the gate is latched and the front of the house is dark.'
    },
    {
      dotLabel: 'Step 1: Carry Your Chairs Out Front',
      heading: '1. Carry Your Chairs Out Front',
      verse: '"Welcome one another as Christ has welcomed you, for the glory of God."',
      ref: 'Romans 15:7',
      note: "Same chairs, same fire pit, same friends, moved onto the driveway. Jesus did not stay behind heaven's fence; He came and dwelt among us (John 1:14).",
      subnote: '',
      accent: '#5F4684',
      accentDark: '#473366',
      state: {
        moved: true,
        arc: true,
        frontSetup: true,
        open: false,
        popBy: false,
        seated: false,
        finish: false
      },
      desc: 'The side gate opens and the same lawn chairs and fire pit move around the house onto the front driveway while the backyard fence and string lights remain.'
    },
    {
      dotLabel: 'Step 2: Open Up',
      heading: '2. Open Up',
      verse: '',
      ref: '',
      note: 'Roll up the garage door, turn on the porch light, and take a seat on the swing. Being seen is half of hospitality.',
      subnote: 'No porch? Your front yard is wherever people can see you and stop by: the apartment steps, the break room, the dorm lounge.',
      accent: '#2A5B7C',
      accentDark: '#1E435C',
      state: {
        moved: true,
        arc: false,
        frontSetup: true,
        open: true,
        popBy: false,
        seated: false,
        finish: false
      },
      desc: 'The garage door rolls up, the porch light turns on with a warm golden glow, and someone waves from the porch swing.'
    },
    {
      dotLabel: 'Step 3: People Pop By',
      heading: '3. People Pop By',
      verse: '',
      ref: '',
      note: 'A dog walker slows down, a kid on a bike stops, and neighbors wave. Nobody needed a formal invite. Practice the Listen rhythm: ask, ask again, remember.',
      subnote: '',
      accent: '#1F684A',
      accentDark: '#164E37',
      state: {
        moved: true,
        arc: false,
        frontSetup: true,
        open: true,
        popBy: true,
        seated: false,
        finish: false
      },
      desc: 'A neighbor walking a dog slows down on the sidewalk and a kid on a bicycle stops by the curb, waving toward the front yard.'
    },
    {
      dotLabel: 'Step 4: Pull Up a Chair',
      heading: '4. Pull Up a Chair',
      verse: '"Contribute to the needs of the saints and seek to show hospitality."',
      ref: 'Romans 12:13',
      note: 'Leave one chair open by the fire and bring out simple food like hot dogs. Paul uses a word that means love of strangers.',
      subnote: '',
      accent: '#A8760A',
      accentDark: '#7D5604',
      state: {
        moved: true,
        arc: false,
        frontSetup: true,
        open: true,
        popBy: true,
        seated: true,
        finish: false
      },
      desc: 'A neighbor sits in the open chair beside the fire as friends roast hot dogs together.'
    },
    {
      dotLabel: 'Step 5: Front Yard Life',
      heading: '5. Front Yard Life',
      verse: '"Stay with us, for it is toward evening and the day is now far spent."',
      ref: 'Luke 24:29',
      note: 'Same chairs. Bigger circle. Two friends on the road to Emmaus asked a stranger to stay, and at their table it turned out to be Jesus.',
      subnote: '',
      accent: '#8B1A2B',
      accentDark: '#6D1422',
      state: {
        moved: true,
        arc: false,
        frontSetup: true,
        open: true,
        popBy: true,
        seated: true,
        finish: true
      },
      desc: 'Backyard friends and new neighbors sit in one circle around one fire in the lit front yard, crowned by the line Same chairs. Bigger circle.'
    }
  ];

  var current = 0;

  var svgEl = document.getElementById('fy-svg');
  var svgDesc = document.getElementById('fy-svg-desc');
  var moveArc = document.getElementById('move-arc');
  var frontSetup = document.getElementById('front-setup');
  var porchGlow = document.getElementById('porch-light-wash');
  var porchBulb = document.getElementById('porch-bulb');
  var porchSitter = document.getElementById('porch-sitter');
  var neighborsPop = document.getElementById('neighbors-pop-by');
  var pullUp = document.getElementById('pull-up-chair');
  var finishCircle = document.getElementById('finish-circle');

  var stripEl = document.getElementById('step-strip');
  var cardContent = document.getElementById('card-content');
  var headingEl = document.getElementById('card-heading');
  var verseWrap = document.getElementById('card-verse');
  var verseText = document.getElementById('verse-text');
  var verseRef = document.getElementById('verse-ref');
  var noteEl = document.getElementById('card-note');
  var subnoteEl = document.getElementById('card-subnote');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  var countEl = document.getElementById('step-count');
  var statusEl = document.getElementById('status');

  var dots = [];
  STEPS.forEach(function (st, idx) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'step-dot';
    btn.setAttribute('data-step', String(idx));
    btn.style.setProperty('--dot-color', st.accent);
    btn.setAttribute('aria-label', st.dotLabel);
    btn.setAttribute('aria-pressed', 'false');

    var fill = document.createElement('span');
    fill.className = 'step-dot-fill';
    btn.appendChild(fill);

    btn.addEventListener('click', function () {
      goTo(idx, true);
    });

    stripEl.appendChild(btn);
    dots.push(btn);
  });

  function applyCard(st) {
    headingEl.textContent = st.heading;
    if (st.verse) {
      verseWrap.classList.remove('is-empty');
      verseText.textContent = st.verse;
      verseRef.textContent = st.ref ? (' ' + st.ref) : '';
      noteEl.className = 'card-note';
    } else {
      verseWrap.classList.add('is-empty');
      verseText.textContent = '';
      verseRef.textContent = '';
      noteEl.className = 'card-note is-lead';
    }

    noteEl.textContent = '';
    if (st.note.indexOf('Same chairs. Bigger circle. ') === 0) {
      var strong = document.createElement('strong');
      strong.textContent = 'Same chairs. Bigger circle. ';
      noteEl.appendChild(strong);
      noteEl.appendChild(document.createTextNode(st.note.slice('Same chairs. Bigger circle. '.length)));
    } else {
      noteEl.textContent = st.note;
    }

    if (st.subnote) {
      subnoteEl.textContent = st.subnote;
      subnoteEl.classList.remove('is-empty');
    } else {
      subnoteEl.textContent = '';
      subnoteEl.classList.add('is-empty');
    }
  }

  function applyScene(st) {
    var s = st.state;
    svgEl.classList.toggle('is-moved', !!s.moved);
    svgEl.classList.toggle('is-open', !!s.open);

    moveArc.classList.toggle('is-on', !!s.arc);
    frontSetup.classList.toggle('is-on', !!s.frontSetup);
    porchGlow.classList.toggle('is-on', !!s.open);
    porchSitter.classList.toggle('is-on', !!s.open);
    porchBulb.setAttribute('fill', s.open ? '#F5C242' : '#B5B0A6');
    neighborsPop.classList.toggle('is-on', !!s.popBy);
    pullUp.classList.toggle('is-on', !!s.seated);
    finishCircle.classList.toggle('is-on', !!s.finish);

    svgDesc.textContent = st.desc;
  }

  function goTo(idx, announce) {
    current = Math.max(0, Math.min(STEPS.length - 1, idx));
    var st = STEPS[current];

    document.documentElement.style.setProperty('--step-color', st.accent);
    document.documentElement.style.setProperty('--step-dark', st.accentDark);

    applyScene(st);
    applyCard(st);

    dots.forEach(function (btn, i) {
      var isCurrent = i === current;
      btn.classList.toggle('active', isCurrent);
      btn.classList.toggle('passed', i < current);
      btn.setAttribute('aria-pressed', isCurrent ? 'true' : 'false');
    });

    prevBtn.disabled = current === 0;
    nextBtn.textContent = current === 0
      ? 'Begin \u2192'
      : (current === STEPS.length - 1 ? '\u21BB Start Over' : 'Next \u2192');
    countEl.textContent = current === 0 ? 'Start' : ('Step ' + current + ' of ' + (STEPS.length - 1));

    if (announce) {
      statusEl.textContent = (current === 0 ? 'Start' : ('Step ' + current + ' of ' + (STEPS.length - 1))) + ': ' + st.heading;
    }
  }

  prevBtn.addEventListener('click', function () {
    if (current > 0) goTo(current - 1, true);
  });

  nextBtn.addEventListener('click', function () {
    goTo(current === STEPS.length - 1 ? 0 : current + 1, true);
  });

  var lastW = window.innerWidth;
  var measuredW = 0;

  function fitCardHeight() {
    if (!cardContent) return;
    var w = cardContent.clientWidth;
    if (w > 0 && w === measuredW) return;
    measuredW = w;

    var tallest = 0;
    document.documentElement.style.setProperty('--card-h', '0px');
    STEPS.forEach(function (st) {
      applyCard(st);
      tallest = Math.max(tallest, cardContent.offsetHeight);
    });
    applyCard(STEPS[current]);
    document.documentElement.style.setProperty('--card-h', Math.max(112, tallest) + 'px');
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCardHeight, 140);
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitCardHeight);
  }

  goTo(0, false);
  fitCardHeight();
})();
</script>
</body>
</html>
