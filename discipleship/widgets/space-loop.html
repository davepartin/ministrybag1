<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make SPACE to Disciple Someone</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f6f1;color:#282521;font-family:Georgia,serif}.app{max-width:560px;margin:auto;background:#fff;overflow:hidden}@media(min-width:580px){body{padding:16px}.app{border:1px solid #ddd8ce;border-radius:12px}}header{background:#1a5c38;color:#fff;text-align:center;padding:12px 10px}h1{font:700 19px/1.25 system-ui,sans-serif;margin:0}.hint{font:12px system-ui,sans-serif;opacity:.9;margin:3px 0 0}.stage{position:relative;aspect-ratio:460/280;background:#fff;overflow:hidden}.frame{position:absolute;inset:0;opacity:0;transition:opacity .55s ease;pointer-events:none}.frame.active{opacity:1}.frame svg{width:100%;height:100%;display:block}.caption{min-height:92px;padding:12px 17px 5px;text-align:center}.caption h2{font:700 17px system-ui,sans-serif;color:#1a5c38;margin:0 0 6px}.caption p{font:15px/1.4 Georgia,serif;margin:0}.progress{display:flex;gap:4px;padding:9px 14px}.dot{flex:1;height:5px;background:#e6e3dc;border-radius:4px}.dot.on{background:#1a5c38}.controls{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:5px 14px 16px}button{min-height:44px;border-radius:9px;border:1px solid #cfc8bb;background:#fff;color:#1a5c38;padding:10px 16px;font:700 14px system-ui,sans-serif;cursor:pointer}button.primary{background:#1a5c38;border-color:#1a5c38;color:white}button:disabled{opacity:.35}.count{font:12px system-ui,sans-serif;color:#655f55}.foot{text-align:center;font:italic 13px Georgia,serif;padding:0 15px 13px;color:#625a50}@media(prefers-reduced-motion:reduce){.frame{transition:none}}
</style></head><body><main class="app"><header><h1>Make SPACE to Disciple Someone</h1><p class="hint">A simple story of disciples making disciples</p></header><div id="stage" class="stage" role="img" aria-label="Ten illustrated scenes showing a disciple becoming a disciple-maker"></div><div class="progress" id="progress" aria-hidden="true"></div><section class="caption" aria-live="polite"><h2 id="title"></h2><p id="description"></p></section><div class="controls"><button id="prev">← Back</button><span class="count" id="count"></span><button class="primary" id="next">Next →</button></div><div class="foot">The student becomes the mentor. The cycle begins again.</div></main>
<script>
const ink='#242424',stroke='stroke="'+ink+'" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"';
function person(x,y,{bag=false,pose='stand',flip=false,scale=1}={}){const arm=pose==='high'?'M0 53 L22 22 L35 -5':pose==='talk'?'M0 53 L23 47 L40 32':pose==='read'?'M0 53 L25 66 L42 76':'M0 53 L24 75';const far=pose==='high'?'M0 53 L-19 68':'M0 53 L-25 74';const legs=pose==='walk'?'M0 113 L-21 151 M0 113 L24 147':'M0 113 L-17 151 M0 113 L18 151';return '<g transform="translate('+x+' '+y+') scale('+(flip?-scale:scale)+' '+scale+')" '+stroke+'><circle cx="0" cy="0" r="17"/><path d="M0 18 L0 113 '+legs+' '+arm+' '+far+'"/>'+(bag?'<path d="M-12 42 Q-38 30 -35 61 L-31 90 Q-14 104 -8 82 M-13 44 Q-30 53 -23 80" stroke-width="3"/>':'')+'</g>'}
function table(){return '<g '+stroke+'><ellipse cx="230" cy="161" rx="73" ry="10"/><path d="M230 171 V239 M208 241 H252"/><path d="M202 152 L227 147 L250 152 L228 158 Z M228 158 V148" stroke-width="2.5"/><path d="M143 201 H170 M157 201 V245 M143 245 H170 M291 201 H318 M305 201 V245 M291 245 H318" stroke-width="3"/></g>'}
function room(){return '<path d="M0 250 H460" stroke="#999" stroke-width="2" stroke-dasharray="15 8"/>'}
function sparks(x=230){return '<g stroke="#333" stroke-width="3" stroke-linecap="round"><path d="M'+x+' 49v-16 M'+(x-16)+' 54l-9-10 M'+(x+16)+' 54l9-10"/></g>'}
function book(){return '<g '+stroke+'><path d="M191 159 Q211 148 230 158 Q250 148 269 159 L269 180 Q249 169 230 178 Q211 169 191 180 Z M230 158 V178" stroke-width="2.5"/></g>'}
function scene(n){let content=room();switch(n){
case 0:content+=person(165,83,{bag:true,pose:'high'})+person(300,83,{pose:'high',flip:true})+sparks(232);break;
case 1:content+=table()+person(104,79,{bag:true,pose:'walk'})+person(333,77,{pose:'talk',flip:true});break;
case 2:content+=table()+book()+person(151,74,{bag:true,pose:'read'})+person(312,74,{pose:'read',flip:true});break;
case 3:content+=person(144,81,{bag:true,pose:'talk'})+person(300,81,{pose:'talk',flip:true})+'<path d="M226 82q20-20 37 0" '+stroke+' stroke-dasharray="5 8"/>';break;
case 4:content+=person(151,83,{bag:true,pose:'talk'})+person(306,83,{pose:'talk',flip:true})+'<g '+stroke+'><path d="M214 155l16-7 18 7-17 8z"/></g>';break;
case 5:content+=person(165,83,{bag:true,pose:'high'})+person(300,83,{pose:'high',flip:true})+sparks(232);break;
case 6:content+=person(116,84,{pose:'stand'})+person(327,84,{bag:true,pose:'walk'})+'<path d="M370 110h54m-12-10 12 10-12 10" '+stroke+' stroke-width="2.5"/>';break;
case 7:content+=person(153,83,{bag:true,pose:'high'})+person(300,83,{pose:'high',flip:true})+sparks(232);break;
case 8:content+=table()+book()+person(151,74,{bag:true,pose:'read'})+person(312,74,{pose:'read',flip:true});break;
case 9:content+=person(151,83,{bag:true,pose:'talk'})+person(306,83,{pose:'talk',flip:true})+'<path d="M215 88l18-11 17 11" '+stroke+' stroke-width="2.5"/>';break;
}return '<svg viewBox="0 0 460 280" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="460" height="280" fill="white"/>'+content+'</svg>'}
const slides=[
['Encourage','A mentor celebrates a step of faith.'],
['Invite','The mentor meets someone new at a high-top table.'],
['Study','They open God’s Word and study together.'],
['Practice','The mentor models, then invites the student to try.'],
['Practice','The student practices leading while the mentor helps.'],
['Appropriate Challenge','The mentor encourages the student to disciple someone else.'],
['Go','The student steps out with the backpack, ready to lead.'],
['Invite Again','Now the student becomes the mentor and welcomes someone new.'],
['Study Again','A new pair opens God’s Word together.'],
['Encourage and Repeat','The new mentor helps the next person practice and grow.']
];let current=0;const stage=document.getElementById('stage'),progress=document.getElementById('progress');slides.forEach((s,i)=>{let f=document.createElement('div');f.className='frame';f.innerHTML=scene(i);stage.appendChild(f);let dot=document.createElement('div');dot.className='dot';progress.appendChild(dot)});function show(i){current=(i+slides.length)%slides.length;document.querySelectorAll('.frame').forEach((e,j)=>e.classList.toggle('active',j===current));document.querySelectorAll('.dot').forEach((e,j)=>e.classList.toggle('on',j<=current));document.getElementById('title').textContent=slides[current][0];document.getElementById('description').textContent=slides[current][1];document.getElementById('count').textContent=(current+1)+' / 10';document.getElementById('prev').disabled=current===0;document.getElementById('next').textContent=current===9?'Begin Again ↻':'Next →'}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);show(0);
</script></body></html>
