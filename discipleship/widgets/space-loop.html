<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make SPACE to Disciple Someone</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f6f1;color:#2c2416;font-family:Georgia,serif}.wrap{max-width:520px;margin:auto;background:white;overflow:hidden}@media(min-width:560px){body{padding:16px}.wrap{border:1px solid #e5dfd3;border-radius:14px;box-shadow:0 5px 20px #2c241615}}
header{background:#1a5c38;color:white;text-align:center;padding:13px 10px}h1{font:700 19px/1.25 system-ui,sans-serif;margin:0}.sub{font:12px system-ui,sans-serif;opacity:.88;margin-top:4px}.scene{position:relative;overflow:hidden;background:#faf8f2}.scene svg{display:block;width:100%;height:auto}.world{transition:transform .55s ease,opacity .35s ease}.person{transition:transform .55s ease,opacity .35s ease}.arm{transition:transform .45s ease;transform-box:fill-box;transform-origin:top center}.caption{padding:14px 18px 4px;min-height:105px;text-align:center}.caption h2{font:700 17px system-ui,sans-serif;color:#1a5c38;margin:0 0 6px}.caption p{font:15px/1.5 Georgia,serif;margin:0}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:10px 10px 5px}.step{min-height:46px;border:1px solid #d7d0c2;border-radius:8px;background:white;color:#4a4338;font:700 11px/1.15 system-ui,sans-serif;cursor:pointer;padding:5px 2px}.step[aria-current="step"]{background:#1a5c38;color:white;border-color:#1a5c38}.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 16px;gap:8px}.nav button{font:700 14px system-ui,sans-serif;padding:10px 15px;min-height:44px;border-radius:9px;border:1px solid #c9c1b2;background:white;color:#1a5c38;cursor:pointer}.nav button.primary{background:#1a5c38;color:white;border-color:#1a5c38}.nav button:disabled{opacity:.35}.counter{font:12px system-ui,sans-serif;color:#6c6254;text-align:center}.note{text-align:center;padding:0 14px 13px;font:italic 13px Georgia,serif;color:#665b4a}button:focus-visible{outline:3px solid #bd8d37;outline-offset:2px}@media(prefers-reduced-motion:reduce){.world,.person,.arm{transition:none}}
</style></head><body><main class="wrap"><header><h1>Make SPACE to Disciple Someone</h1><div class="sub">Watch a disciple become a disciple-maker</div></header>
<div class="scene"><svg viewBox="0 0 460 275" role="img" aria-labelledby="sceneTitle sceneDesc"><title id="sceneTitle">A disciple-making relationship</title><desc id="sceneDesc">Two people study, practice, take an appropriate challenge, and encourage one another. Then the learner becomes a mentor to someone new.</desc>
<defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9L9 0" stroke="#dfd9ce" stroke-width=".65"/></pattern></defs>
<rect width="460" height="275" fill="#f7f4ed"/><g id="world" class="world">
<path d="M0 211H460M0 220H460" stroke="#c3b8a5" stroke-width="2"/><rect x="17" y="24" width="112" height="128" rx="3" fill="#fff" stroke="#b6aa98" stroke-width="3"/><path d="M72 25V152M18 88H128" stroke="#b6aa98" stroke-width="2"/><path d="M30 139Q60 108 82 137T117 126" fill="none" stroke="#a7bba6" stroke-width="6"/><rect x="337" y="30" width="92" height="142" fill="url(#hatch)" stroke="#c6b9a5" stroke-width="2"/><path d="M349 169V60H417V169" fill="none" stroke="#ab9d87" stroke-width="3"/>
</g>
<g id="table"><path d="M156 174H306" stroke="#80684c" stroke-width="8" stroke-linecap="round"/><path d="M179 178L169 240M282 178L291 240" stroke="#80684c" stroke-width="6"/><path d="M201 167l29 -7 29 7 -29 5z" fill="#fff" stroke="#1a5c38" stroke-width="2"/><path d="M230 160v12" stroke="#1a5c38" stroke-width="1.5"/></g>
<g id="mentor" class="person"><circle cx="140" cy="103" r="22" fill="#f4d4ae" stroke="#4a4237" stroke-width="2.5"/><path d="M119 100Q123 75 144 80Q164 82 162 100" fill="#66513f"/><path d="M121 135Q141 121 162 135L173 211H111z" fill="#1a5c38" stroke="#4a4237" stroke-width="2"/><path d="M125 211L121 246M156 211L164 246" stroke="#4a4237" stroke-width="9" stroke-linecap="round"/><g id="mentorArm" class="arm"><path d="M163 148Q181 157 197 170" stroke="#f4d4ae" stroke-width="11" stroke-linecap="round"/></g></g>
<g id="learner" class="person"><circle cx="321" cy="103" r="22" fill="#edc79f" stroke="#4a4237" stroke-width="2.5"/><path d="M301 95Q309 76 328 82Q339 85 341 96" fill="#4d3c32"/><path d="M299 136Q320 123 343 136L350 211H291z" fill="#b8892b" stroke="#4a4237" stroke-width="2"/><path d="M306 211L300 246M336 211L343 246" stroke="#4a4237" stroke-width="9" stroke-linecap="round"/><g id="learnerArm" class="arm"><path d="M300 148Q284 159 267 170" stroke="#edc79f" stroke-width="11" stroke-linecap="round"/></g></g>
<g id="third" class="person" opacity="0"><circle cx="390" cy="102" r="21" fill="#f0caa8" stroke="#4a4237" stroke-width="2.5"/><path d="M370 98Q373 76 397 83L409 98" fill="#453c34"/><path d="M370 135Q392 124 412 135L420 211H362z" fill="#6f8794" stroke="#4a4237" stroke-width="2"/><path d="M380 211L375 246M406 211L412 246" stroke="#4a4237" stroke-width="9" stroke-linecap="round"/></g>
<g id="spark" opacity="0" stroke="#b8892b" stroke-width="3" stroke-linecap="round"><path d="M230 73V57M214 80L204 71M246 80L256 71M230 89V95"/></g>
<text id="stageLabel" x="230" y="26" text-anchor="middle" fill="#1a5c38" font-family="system-ui" font-size="13" font-weight="700">STUDY</text>
</svg></div>
<div class="steps" aria-label="SPACE steps"><button class="step" data-step="0">Study</button><button class="step" data-step="1">Practice</button><button class="step" data-step="2">Appropriate<br>Challenge</button><button class="step" data-step="3">Encourage</button></div>
<section class="caption" aria-live="polite"><h2 id="heading">Study</h2><p id="copy">“Would you like to study God's Word with me?”</p></section>
<div class="nav"><button id="back">Back</button><span class="counter" id="count">1 of 4</span><button id="next" class="primary">Next →</button></div><p class="note" id="note">The learner becomes the mentor. The process begins again.</p></main>
<script>
const stages=[
{title:'Study',copy:'“Would you like to study God’s Word with me?”',label:'STUDY'},
{title:'Practice',copy:'“Let’s practice. You lead this part, and I’ll help.”',label:'PRACTICE'},
{title:'Appropriate Challenge',copy:'“I think you’re ready to invite someone to study with you.”',label:'APPROPRIATE CHALLENGE'},
{title:'Encourage',copy:'“How did it go? I’m proud of you for taking that step.”',label:'ENCOURAGE'}
];let index=0,cycle=0;const el=id=>document.getElementById(id);
function render(){const s=stages[index];el('heading').textContent=s.title;el('copy').textContent=s.copy;el('stageLabel').textContent=s.label;el('count').textContent=(index+1)+' of 4';document.querySelectorAll('.step').forEach((b,i)=>{if(i===index)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});el('back').disabled=index===0;el('next').textContent=index===3?'Begin again ↻':'Next →';
el('world').style.transform='translateX('+(-index*11)+'px)';el('table').style.opacity=index===2?'0.45':'1';el('mentorArm').style.transform=index===1?'rotate(-26deg)':index===2?'rotate(-42deg)':'rotate(0deg)';el('learnerArm').style.transform=index===1?'rotate(25deg)':index===2?'rotate(42deg)':'rotate(0deg)';el('spark').setAttribute('opacity',index===2||index===3?'1':'0');el('third').setAttribute('opacity',index===2?'1':'0');el('mentor').style.opacity=index===2?'.45':'1';el('learner').style.transform=index===2?'translateX(-46px)':'translateX(0)';
el('note').textContent=cycle>0?'The former learner now helps someone else. Make SPACE again.':'The learner becomes the mentor. The process begins again.';}
el('next').addEventListener('click',()=>{if(index===3){index=0;cycle++;el('mentor').style.transition='none';el('learner').style.transition='none';}else index++;render()});el('back').addEventListener('click',()=>{if(index>0){index--;render()}});document.querySelectorAll('.step').forEach(b=>b.addEventListener('click',()=>{index=Number(b.dataset.step);render()}));render();
</script></body></html>
