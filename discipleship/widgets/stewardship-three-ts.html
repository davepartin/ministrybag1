<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time, Talents, Treasure</title>
<style>
:root {
  --ink: #26231f;
  --muted: #655f55;
  --ghost: #c7bfb0;
  --line-soft: #e3ddd1;
  --paper: #fdfdfb;
  --pop: #1d7a46;
  --pop-dark: #1a5c38;
  --pop-soft: #dcefe3;
  --card-h: 92px;
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  padding: 0;
  margin: 0;
  font-family: Georgia, Cambria, serif;
  background: #f8f6f1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.widget-outer {
  background: #ffffff;
  border-radius: 0;
  overflow: hidden;
  box-shadow: none;
  border: none;
  max-width: 100%;
  width: 100%;
  margin: 0;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #f8f6f1;
  }
  .widget-outer {
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
    border: 1px solid #ebe5d9;
    max-width: 460px;
    margin: 0 auto;
  }
}

.title-bar {
  background: var(--ink);
  padding: 9px 14px;
  text-align: center;
  transition: background-color 0.35s ease;
}

.widget-outer.is-whole .title-bar {
  background: var(--pop-dark);
}

.title-bar h1 {
  font: 700 18px/1.2 system-ui, -apple-system, sans-serif;
  color: #faf8f3;
  margin: 0;
  letter-spacing: 0.2px;
}

/* Whiteboard stage */
.stage {
  position: relative;
  aspect-ratio: 360 / 236;
  background: var(--paper);
  border-bottom: 1px solid #eee9df;
}

.stage svg {
  width: 100%;
  height: 100%;
  display: block;
}

svg .guide-tri {
  fill: none;
  stroke: var(--ghost);
  stroke-width: 1.6;
  stroke-dasharray: 4 5;
  stroke-linecap: round;
  transition: opacity 0.3s ease;
}

svg .seat-fill {
  fill: #f0eadc;
  fill-opacity: 0;
  transition: fill 0.4s ease, fill-opacity 0.4s ease;
}

.widget-outer.has-seat svg .seat-fill {
  fill: #f0eadc;
  fill-opacity: 0.6;
}

.widget-outer.is-whole svg .seat-fill {
  fill: var(--pop-soft);
  fill-opacity: 0.9;
}

svg .foot-shadow {
  fill: #e3ddd0;
  opacity: 0;
  transition: opacity 0.35s ease;
}

svg .t-piece.visible .foot-shadow {
  opacity: 1;
}

svg .t-stroke {
  fill: none;
  stroke: var(--ink);
  stroke-width: 5.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0;
  transition: stroke 0.3s ease, stroke-dashoffset 0.45s ease-out, opacity 0.15s ease;
}

svg .t-stem {
  stroke-width: 5.2;
  transition-delay: 0.14s, 0.14s, 0.14s;
}

svg .t-piece.visible .t-stroke {
  opacity: 1;
  stroke-dashoffset: 0 !important;
}

svg .t-piece.current .t-stroke {
  stroke: var(--pop);
}

.widget-outer.is-whole svg .t-piece.visible .t-stroke {
  stroke: var(--pop-dark);
}

svg .t-joint {
  fill: var(--ink);
  opacity: 0;
  transition: fill 0.3s ease, opacity 0.25s ease 0.12s;
}

svg .t-piece.visible .t-joint {
  opacity: 1;
}

svg .t-piece.current .t-joint {
  fill: var(--pop);
}

.widget-outer.is-whole svg .t-piece.visible .t-joint {
  fill: var(--pop-dark);
}

svg .t-pointer {
  fill: none;
  stroke: var(--ghost);
  stroke-width: 1.5;
  stroke-dasharray: 2 3;
  opacity: 0;
  transition: opacity 0.25s ease 0.15s;
}

svg .t-piece.visible .t-pointer {
  opacity: 1;
}

/* Word labels for each T and final whole banner (no CSS transform overriding SVG translate!) */
svg .t-label-anim {
  opacity: 0;
  transition: opacity 0.28s ease 0.16s;
}

svg .t-piece.visible .t-label-anim {
  opacity: 1;
}

svg .pill-box {
  fill: #ffffff;
  stroke: var(--ink);
  stroke-width: 1.8;
  transition: fill 0.25s ease, stroke 0.25s ease;
}

svg .pill-text {
  font: 700 12px system-ui, -apple-system, sans-serif;
  fill: var(--ink);
  text-anchor: middle;
  dominant-baseline: central;
  transition: fill 0.25s ease;
}

svg .t-piece.current .pill-box {
  fill: var(--pop);
  stroke: var(--pop);
}

svg .t-piece.current .pill-text {
  fill: #ffffff;
}

.widget-outer.is-whole svg .t-piece.visible .pill-box {
  fill: var(--pop-soft);
  stroke: var(--pop);
}

.widget-outer.is-whole svg .t-piece.visible .pill-text {
  fill: var(--pop-dark);
}

svg .whole-banner-anim {
  opacity: 0;
  transition: opacity 0.3s ease;
}

.widget-outer.is-whole svg .whole-banner-anim {
  opacity: 1;
}

svg .whole-box {
  fill: var(--pop);
  stroke: var(--pop);
  stroke-width: 1.8;
}

svg .whole-text {
  font: 800 11.5px system-ui, -apple-system, sans-serif;
  fill: #ffffff;
  letter-spacing: 0.4px;
  text-anchor: middle;
  dominant-baseline: central;
}

svg .stage-hint {
  font: 600 12px system-ui, -apple-system, sans-serif;
  fill: var(--muted);
  text-anchor: middle;
  dominant-baseline: central;
  transition: opacity 0.25s ease;
}

/* Single-row compact step toolbar + Show whole picture action */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 6px 12px;
  background: #f8f6f1;
  border-bottom: 1px solid #eee9df;
}

.step-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
}

.step-tab {
  min-width: 30px;
  min-height: 30px;
  padding: 4px 8px;
  border-radius: 999px;
  border: 1.5px solid #d4cfc4;
  background: #ffffff;
  color: var(--ink);
  font: 700 11.5px/1 system-ui, -apple-system, sans-serif;
  cursor: pointer;
  transition: background-color 0.2s, border-color 0.2s, color 0.2s;
}

.step-tab.done {
  border-color: var(--ink);
}

.step-tab.active {
  background: var(--ink);
  border-color: var(--ink);
  color: #ffffff;
}

.widget-outer.is-whole .step-tab.active,
.step-tab.whole-tab.active {
  background: var(--pop);
  border-color: var(--pop);
  color: #ffffff;
}

.whole-btn {
  min-height: 30px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1.5px solid var(--pop);
  background: #ffffff;
  color: var(--pop-dark);
  font: 700 11.5px/1 system-ui, -apple-system, sans-serif;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 0.2s, color 0.2s;
}

.whole-btn:hover {
  background: var(--pop-soft);
}

.whole-btn:disabled {
  background: var(--pop-soft);
  color: var(--pop-dark);
  border-color: #9ecbb0;
  cursor: default;
}

/* Bottom card + navigation area matching widget.md proportions */
.card-area {
  background: #f6f4ee;
  padding: 8px 12px 10px;
}

.verse-card {
  background: #ffffff;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #ebe5d9;
  box-shadow: 0 2px 12px rgba(44, 36, 22, 0.06);
}

.verse-card-bar {
  height: 4px;
  background: var(--ink);
  transition: background-color 0.3s ease;
}

.widget-outer.is-active .verse-card-bar,
.widget-outer.is-whole .verse-card-bar {
  background: var(--pop);
}

.verse-card-content {
  padding: 10px 14px;
  min-height: var(--card-h, 92px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
}

.card-heading {
  font: 700 16px/1.25 system-ui, -apple-system, sans-serif;
  color: var(--ink);
  margin: 0 0 4px;
}

.widget-outer.is-whole .card-heading {
  color: var(--pop-dark);
}

.card-body {
  font: 14.5px/1.45 Georgia, Cambria, serif;
  color: #3d3426;
  margin: 0;
}

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.nav-btn {
  min-height: 44px;
  min-width: 96px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #d4cfc4;
  background: #ffffff;
  color: var(--ink);
  font: 700 13.5px/1 system-ui, -apple-system, sans-serif;
  cursor: pointer;
}

.nav-btn.primary {
  background: var(--ink);
  border-color: var(--ink);
  color: #ffffff;
}

.widget-outer.is-whole .nav-btn.primary {
  background: var(--pop-dark);
  border-color: var(--pop-dark);
}

.nav-btn:disabled {
  opacity: 0.38;
  cursor: default;
}

.step-count {
  font: 600 12px system-ui, -apple-system, sans-serif;
  color: var(--muted);
}

button:focus-visible {
  outline: 3px solid #e0a526;
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .title-bar,
  svg .guide-tri,
  svg .seat-fill,
  svg .foot-shadow,
  svg .t-stroke,
  svg .t-joint,
  svg .t-pointer,
  svg .t-label-anim,
  svg .pill-box,
  svg .pill-text,
  svg .whole-banner-anim,
  svg .stage-hint,
  .step-tab,
  .whole-btn,
  .verse-card-bar {
    transition: none !important;
    transition-delay: 0s !important;
  }
}
</style>
</head>
<body>
<main class="widget-outer" id="widget" aria-label="Time, Talents, Treasure: three Ts forming a three-legged stool">
  <header class="title-bar">
    <h1>Time, Talents, Treasure</h1>
  </header>

  <div class="stage" id="stage" role="img" aria-label=""></div>

  <div class="toolbar">
    <div class="step-tabs" id="step-tabs" role="group" aria-label="Stool drawing steps"></div>
    <button class="whole-btn" id="whole-btn" type="button">Show whole picture</button>
  </div>

  <section class="card-area" id="card-area" aria-live="polite">
    <div class="verse-card">
      <div class="verse-card-bar" aria-hidden="true"></div>
      <div class="verse-card-content" id="card-content">
        <h2 class="card-heading" id="card-heading"></h2>
        <p class="card-body" id="card-body"></p>
      </div>
    </div>
    <div class="nav-bar">
      <button class="nav-btn" id="prev-btn" type="button">&larr; Previous</button>
      <span class="step-count" id="step-count"></span>
      <button class="nav-btn primary" id="next-btn" type="button">Begin &rarr;</button>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';

  var states = [
    {
      tab: 'Start',
      ariaTab: 'Start',
      heading: 'God owns it all.',
      body: 'Draw three capital T\'s one at a time. Together, their top bars make a triangular seat and their stems form three legs.',
      aria: 'Empty whiteboard guide showing a faint dashed triangle ready to draw three capital T letters forming a stool.'
    },
    {
      tab: '1',
      ariaTab: 'Step 1: Time',
      heading: 'Time (First T)',
      body: 'Your hours and attention, used with care and shared in love.',
      aria: 'First capital T drawn on the left edge and labeled Time, forming the first edge of the seat and the back-left leg.'
    },
    {
      tab: '2',
      ariaTab: 'Step 2: Talents',
      heading: 'Talents (Second T)',
      body: 'Your abilities, put to use for someone else\'s good.',
      aria: 'First T labeled Time remains, and a second capital T labeled Talents is drawn on the right edge.'
    },
    {
      tab: '3',
      ariaTab: 'Step 3: Treasure',
      heading: 'Treasure (Third T)',
      body: 'Your money and possessions, cared for and shared faithfully.',
      aria: 'A third capital T labeled Treasure closes the front edge of the triangle and drops the third leg, completing the stool.'
    },
    {
      tab: 'All',
      ariaTab: 'Whole life stool',
      heading: 'God owns it all.',
      body: 'Time, talents, treasure: one life entrusted to God.',
      aria: 'Completed three-legged stool made from three capital T letters labeled Time, Talents, and Treasure, topped with God owns it all.'
    }
  ];

  function el(name, attrs, parent) {
    var node = document.createElementNS(NS, name);
    Object.keys(attrs || {}).forEach(function (k) {
      node.setAttribute(k, attrs[k]);
    });
    if (parent) parent.appendChild(node);
    return node;
  }

  // Foreshortened 3/4 perspective triangle seat in 360x236 whiteboard viewBox:
  // Shallow top tilt makes the seat read horizontally as a stool top (not a steep roof),
  // while slight 3/4 asymmetry clearly separates all 3 vertical T stems in depth.
  var A = { x: 164, y: 58 };
  var B = { x: 88, y: 92 };
  var C = { x: 272, y: 100 };
  var M1 = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 }; // (126, 75)
  var M2 = { x: (A.x + C.x) / 2, y: (A.y + C.y) / 2 }; // (218, 79)
  var M3 = { x: (B.x + C.x) / 2, y: (B.y + C.y) / 2 }; // (180, 96)
  var LEG_LEN = 95;

  var svg = el('svg', {
    xmlns: NS,
    'aria-hidden': 'true',
    viewBox: '0 0 360 236',
    preserveAspectRatio: 'xMidYMid meet'
  });

  // Whiteboard surface
  el('rect', { x: 0, y: 0, width: 360, height: 236, fill: '#fdfdfb' }, svg);

  // Faint dashed construction triangle visible on Begin (State 0)
  var guideTri = el('polygon', {
    points: A.x + ',' + A.y + ' ' + B.x + ',' + B.y + ' ' + C.x + ',' + C.y,
    class: 'guide-tri'
  }, svg);
  var beginHint = el('text', {
    x: 180,
    y: 128,
    class: 'stage-hint'
  }, svg);
  beginHint.textContent = '3 T\'s \u2192 1 Three-Legged Stool';

  // Soft seat surface behind the T strokes (revealed once 3rd T closes triangle)
  el('polygon', {
    points: A.x + ',' + A.y + ' ' + B.x + ',' + B.y + ' ' + C.x + ',' + C.y,
    class: 'seat-fill'
  }, svg);

  // Helper to build one capital T (crossbar + midpoint vertical stem + foot shadow + pill label)
  function buildTPiece(opts) {
    var g = el('g', { class: 't-piece' }, svg);
    el('ellipse', {
      cx: opts.mx,
      cy: opts.my + LEG_LEN + 2,
      rx: 10,
      ry: 3,
      class: 'foot-shadow'
    }, g);

    var dx = opts.x2 - opts.x1;
    var dy = opts.y2 - opts.y1;
    var barLen = Math.ceil(Math.sqrt(dx * dx + dy * dy)) + 2;

    el('line', {
      x1: opts.x1,
      y1: opts.y1,
      x2: opts.x2,
      y2: opts.y2,
      class: 't-stroke t-bar',
      'stroke-dasharray': barLen,
      'stroke-dashoffset': barLen
    }, g);

    el('line', {
      x1: opts.mx,
      y1: opts.my,
      x2: opts.mx,
      y2: opts.my + LEG_LEN,
      class: 't-stroke t-stem',
      'stroke-dasharray': LEG_LEN + 2,
      'stroke-dashoffset': LEG_LEN + 2
    }, g);

    // Marker anchor dot at T stem-crossbar midpoint
    el('circle', {
      cx: opts.mx,
      cy: opts.my,
      r: 3.4,
      class: 't-joint'
    }, g);

    // Short leader line to word pill if desired
    if (opts.px != null) {
      el('line', {
        x1: opts.px,
        y1: opts.py,
        x2: opts.tx,
        y2: opts.ty,
        class: 't-pointer'
      }, g);
    }

    // Outer static translation group + inner animated opacity group (never mix CSS transform with SVG translate!)
    var lgPos = el('g', { transform: 'translate(' + opts.lx + ',' + opts.ly + ')' }, g);
    var lgAnim = el('g', { class: 't-label-anim' }, lgPos);
    el('rect', {
      x: -opts.lw / 2,
      y: -12,
      width: opts.lw,
      height: 24,
      rx: 7,
      class: 'pill-box'
    }, lgAnim);
    var txt = el('text', { x: 0, y: 0, class: 'pill-text' }, lgAnim);
    txt.textContent = opts.label;

    return { g: g };
  }

  var tPieces = [
    // 1. Time (left T)
    buildTPiece({
      x1: B.x, y1: B.y, x2: A.x, y2: A.y,
      mx: M1.x, my: M1.y,
      lx: 50, ly: 66, lw: 68,
      px: 84, py: 68, tx: M1.x - 10, ty: M1.y - 3,
      label: 'Time'
    }),
    // 2. Talents (right T)
    buildTPiece({
      x1: A.x, y1: A.y, x2: C.x, y2: C.y,
      mx: M2.x, my: M2.y,
      lx: 306, ly: 68, lw: 78,
      px: 267, py: 70, tx: M2.x + 12, ty: M2.y - 2,
      label: 'Talents'
    }),
    // 3. Treasure (front upright T closing the triangle)
    buildTPiece({
      x1: B.x, y1: B.y, x2: C.x, y2: C.y,
      mx: M3.x, my: M3.y,
      lx: 180, ly: 218, lw: 86,
      label: 'Treasure'
    })
  ];

  // Top summary banner shown on Whole life (State 4)
  var wholeBannerPos = el('g', { transform: 'translate(180, 24)' }, svg);
  var wholeBannerAnim = el('g', { class: 'whole-banner-anim' }, wholeBannerPos);
  el('rect', { x: -76, y: -12, width: 152, height: 24, rx: 12, class: 'whole-box' }, wholeBannerAnim);
  el('text', { x: 0, y: 0, class: 'whole-text' }, wholeBannerAnim).textContent = 'GOD OWNS IT ALL';

  document.getElementById('stage').appendChild(svg);

  // Build step tabs
  var tabsWrap = document.getElementById('step-tabs');
  var tabButtons = states.map(function (st, idx) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'step-tab' + (idx === 4 ? ' whole-tab' : '');
    btn.textContent = st.tab;
    btn.setAttribute('aria-label', st.ariaTab);
    btn.addEventListener('click', function () {
      goTo(idx);
    });
    tabsWrap.appendChild(btn);
    return btn;
  });

  var widgetEl = document.getElementById('widget');
  var stageEl = document.getElementById('stage');
  var wholeBtn = document.getElementById('whole-btn');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  var headingEl = document.getElementById('card-heading');
  var bodyEl = document.getElementById('card-body');
  var countEl = document.getElementById('step-count');

  var step = 0;

  function goTo(nextStep) {
    step = Math.max(0, Math.min(states.length - 1, nextStep));
    var st = states[step];

    widgetEl.classList.toggle('has-seat', step >= 3);
    widgetEl.classList.toggle('is-active', step >= 1 && step <= 3);
    widgetEl.classList.toggle('is-whole', step === 4);

    guideTri.style.opacity = step === 0 ? '1' : '0.28';
    beginHint.style.opacity = step === 0 ? '1' : '0';

    tPieces.forEach(function (piece, idx) {
      var pieceStep = idx + 1;
      piece.g.classList.toggle('visible', step >= pieceStep);
      piece.g.classList.toggle('current', step === pieceStep);
    });

    tabButtons.forEach(function (btn, idx) {
      btn.classList.toggle('active', idx === step);
      btn.classList.toggle('done', idx > 0 && idx < step);
      btn.setAttribute('aria-pressed', idx === step ? 'true' : 'false');
    });

    wholeBtn.disabled = step === 4;
    wholeBtn.setAttribute('aria-pressed', step === 4 ? 'true' : 'false');
    wholeBtn.textContent = step === 4 ? '\u2713 Whole picture' : 'Show whole picture';

    stageEl.setAttribute('aria-label', st.aria);
    headingEl.textContent = st.heading;
    bodyEl.textContent = st.body;
    countEl.textContent = (step + 1) + ' / ' + states.length;

    prevBtn.disabled = step === 0;
    if (step === 0) {
      nextBtn.innerHTML = 'Begin &rarr;';
    } else if (step === states.length - 1) {
      nextBtn.innerHTML = '&#8635; Restart';
    } else {
      nextBtn.innerHTML = 'Next &rarr;';
    }
  }

  prevBtn.addEventListener('click', function () {
    if (step > 0) goTo(step - 1);
  });

  nextBtn.addEventListener('click', function () {
    if (step === states.length - 1) {
      goTo(0);
    } else {
      goTo(step + 1);
    }
  });

  wholeBtn.addEventListener('click', function () {
    goTo(4);
  });

  // Measure tallest card text once at load and only on width changes (never on height-only resize).
  var contentEl = document.getElementById('card-content');
  var lastWidth = window.innerWidth;
  var measuredAtWidth = 0;

  function fitCardHeight() {
    if (!contentEl || contentEl.clientWidth === measuredAtWidth) return;
    measuredAtWidth = contentEl.clientWidth;
    var keepH = headingEl.textContent;
    var keepB = bodyEl.textContent;
    var tallest = 0;
    document.documentElement.style.setProperty('--card-h', '0px');
    states.forEach(function (st) {
      headingEl.textContent = st.heading;
      bodyEl.textContent = st.body;
      tallest = Math.max(tallest, contentEl.offsetHeight);
    });
    headingEl.textContent = keepH;
    bodyEl.textContent = keepB;
    document.documentElement.style.setProperty('--card-h', Math.max(88, tallest) + 'px');
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastWidth) return;
    lastWidth = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCardHeight, 120);
  });

  goTo(0);
  fitCardHeight();
})();
</script>
</body>
</html>
