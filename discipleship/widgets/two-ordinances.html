<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Doorway and the Table</title>
<style>
  :root {
    --green: #1D6B3F;
    --green-soft: #D1EDD9;
    --water: #2A7FA8;
    --water-soft: #E3F0F7;
    --wine: #9C4A38;
    --wine-soft: #F6E8E3;
    --ink: #2d2a26;
    --ink-soft: #6b655c;
    --card: #fdfbf7;
    --border: #e3ddd0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: transparent;
    color: var(--ink);
    padding: 8px 4px 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .title {
    text-align: center;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--green);
  }
  .subtitle {
    text-align: center;
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin: 4px 0 14px;
  }
  .facets {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-bottom: 14px;
  }
  .facet {
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.25s, color 0.25s, border-color 0.25s;
  }
  .facet[aria-pressed="true"] {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .facet.visited:not([aria-pressed="true"]) {
    border-color: var(--green-soft);
    color: var(--green);
  }
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 14px 12px 16px;
    text-align: center;
    border-top: 4px solid var(--border);
  }
  .card.baptism { border-top-color: var(--water); }
  .card.supper { border-top-color: var(--wine); }
  .icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .baptism .icon { background: var(--water-soft); }
  .supper .icon { background: var(--wine-soft); }
  .card h2 { font-size: 0.95rem; margin-bottom: 2px; }
  .baptism h2 { color: var(--water); }
  .supper h2 { color: var(--wine); }
  .card .tagline {
    font-size: 0.72rem;
    font-style: italic;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .card .answer {
    font-size: 0.84rem;
    line-height: 1.5;
    min-height: 96px;
    transition: opacity 0.3s;
  }
  .card .answer.fade { opacity: 0; }
  .footer {
    margin-top: 14px;
    text-align: center;
    font-size: 0.84rem;
    color: var(--ink-soft);
  }
  .footer .reveal {
    display: none;
    background: var(--green-soft);
    color: var(--green);
    border-radius: 12px;
    padding: 12px 14px;
    font-weight: 600;
    line-height: 1.5;
  }
  .footer .reveal.show { display: block; animation: rise 0.5s ease; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card .answer, .facet { transition: none; }
    .footer .reveal.show { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">The Doorway and the Table</div>
  <div class="subtitle">Two gifts Jesus gave His church. Tap each question to compare.</div>

  <div class="facets" role="group" aria-label="Questions to compare the two ordinances">
    <button class="facet" data-i="0" aria-pressed="true">What is it?</button>
    <button class="facet" data-i="1" aria-pressed="false">What does it picture?</button>
    <button class="facet" data-i="2" aria-pressed="false">How often?</button>
    <button class="facet" data-i="3" aria-pressed="false">What does it say?</button>
    <button class="facet" data-i="4" aria-pressed="false">Where does it point?</button>
  </div>

  <div class="cards">
    <div class="card baptism">
      <div class="icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M12 3.5c2.6 3.2 5 6.1 5 9a5 5 0 0 1-10 0c0-2.9 2.4-5.8 5-9z" stroke="#2A7FA8" stroke-width="1.8" fill="#E3F0F7"/>
          <path d="M9.5 13.2a2.5 2.5 0 0 0 2.5 2.3" stroke="#2A7FA8" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <h2>Baptism</h2>
      <div class="tagline">The doorway</div>
      <div class="answer" id="answer-b" aria-live="polite"></div>
    </div>
    <div class="card supper">
      <div class="icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M5 8h8c0 2.5-1.8 4.5-4 4.5S5 10.5 5 8z" stroke="#9C4A38" stroke-width="1.7" fill="#F6E8E3"/>
          <path d="M9 12.5V19M6.5 19h5" stroke="#9C4A38" stroke-width="1.7" stroke-linecap="round"/>
          <ellipse cx="17.5" cy="16.5" rx="3.5" ry="2.4" stroke="#9C4A38" stroke-width="1.7" fill="#F6E8E3"/>
        </svg>
      </div>
      <h2>The Lord's Supper</h2>
      <div class="tagline">The table</div>
      <div class="answer" id="answer-s" aria-live="polite"></div>
    </div>
  </div>

  <div class="footer">
    <div class="hint" id="hint">1 of 5 questions explored</div>
    <div class="reveal" id="reveal">One doorway. One table. The same gospel, given because Jesus longs to share it with you.</div>
  </div>
</div>

<script>
  var content = [
    {
      b: "Going under the water and rising again in the name of the Father, the Son, and the Holy Spirit, after you trust in Jesus.",
      s: "Eating the bread and drinking the cup with God's family, the meal Jesus began on the night before the cross."
    },
    {
      b: "Your old life buried with Christ, your new life raised with Him, your sin washed clean.",
      s: "His body given for you and His blood poured out for you. Grace you can taste."
    },
    {
      b: "Once. It marks the doorway into life with Jesus and His church.",
      s: "Again and again for the rest of your life. The table keeps feeding you."
    },
    {
      b: "\"I belong to Jesus now.\" Said once, out loud, with your whole body.",
      s: "\"Jesus died for me, and He is coming back.\" Proclaimed every time you eat and drink."
    },
    {
      b: "Back to the cross and the empty tomb, and forward to your own resurrection.",
      s: "Back to the cross, and forward to the wedding feast when you see Him face to face."
    }
  ];

  var answerB = document.getElementById('answer-b');
  var answerS = document.getElementById('answer-s');
  var hint = document.getElementById('hint');
  var reveal = document.getElementById('reveal');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.facet'));
  var visited = {};
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function show(i) {
    buttons.forEach(function(btn) {
      var active = Number(btn.dataset.i) === i;
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      if (visited[btn.dataset.i]) btn.classList.add('visited');
    });
    visited[i] = true;
    var count = Object.keys(visited).length;

    function swap() {
      answerB.textContent = content[i].b;
      answerS.textContent = content[i].s;
      answerB.classList.remove('fade');
      answerS.classList.remove('fade');
    }
    if (reduced) {
      swap();
    } else {
      answerB.classList.add('fade');
      answerS.classList.add('fade');
      setTimeout(swap, 250);
    }

    if (count >= content.length) {
      hint.style.display = 'none';
      reveal.classList.add('show');
    } else {
      hint.textContent = count + ' of 5 questions explored';
    }
  }

  buttons.forEach(function(btn) {
    btn.addEventListener('click', function() { show(Number(btn.dataset.i)); });
  });

  show(0);
</script>
</body>
</html>
