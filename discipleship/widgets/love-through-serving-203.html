<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Through Serving</title>
<style>
:root {
  --ink: #2C2416;
  --muted: #6E6559;
  --tray: #F6F4EE;
  --border: #EBE5D9;
  --green: #1F684A;
  --green-dark: #164E37;
  --gold: #A8760A;
  --gold-dark: #7D5604;
  --blue: #2A5B7C;
  --step-color: #2C2416;
  --step-dark: #1E1910;
  --card-h: 120px;
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  padding: 0;
  margin: 0;
  font-family: Georgia, Cambria, serif;
  background: #F8F6F1;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.widget-outer {
  background: #FFFFFF;
  border-radius: 0;
  overflow: hidden;
  box-shadow: none;
  border: none;
  max-width: 100%;
  width: 100%;
  margin: 0;
  position: relative;
}

@media (min-width: 560px) {
  body {
    padding: 16px;
    background: #F8F6F1;
  }
  .widget-outer {
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(44, 36, 22, 0.08);
    border: 1px solid var(--border);
    max-width: 460px;
    margin: 0 auto;
  }
}

.title-bar {
  background: #2C2416;
  padding: 7px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title-bar h1 {
  font: 600 17px/1.15 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #FAF8F3;
  letter-spacing: 0.2px;
  margin: 0;
}

.course-tag {
  font: 600 11px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: #E5DEC9;
  white-space: nowrap;
}

.stage {
  position: relative;
  background: #FFFFFF;
  border-bottom: 1px solid var(--border);
}

.opening-cue {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  padding: 18px;
  pointer-events: none;
  opacity: 1;
}

.opening-cue p {
  margin: 0;
  max-width: 300px;
  padding: 16px 22px;
  border: 1px solid #E6DECF;
  border-radius: 14px;
  background: #FFFFFF;
  box-shadow: 0 10px 28px rgba(44, 36, 22, 0.10);
  color: var(--ink);
  text-align: center;
  font: 600 17.5px/1.3 Georgia, Cambria, serif;
}

.opening-cue.is-hidden {
  opacity: 0;
}

.scene-svg {
  display: block;
  width: 100%;
  height: auto;
}

.scene-layer {
  opacity: 0;
  pointer-events: none;
}

.scene-layer.is-visible {
  opacity: 1;
}

.scene-layer.is-memory {
  opacity: 0.28;
}

.step-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  padding: 5px 12px 4px;
  background: var(--tray);
  border-bottom: 1px solid var(--border);
}

.step-dot {
  appearance: none;
  min-width: 28px;
  min-height: 28px;
  padding: 4px;
  border: none;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
}

.step-dot-fill {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2.5px solid var(--dot-color, var(--ink));
  background: #FFFFFF;
  display: block;
}

.step-dot.passed .step-dot-fill {
  background: color-mix(in srgb, var(--dot-color, var(--ink)) 24%, #FFFFFF);
}

.step-dot.active .step-dot-fill {
  background: var(--dot-color, var(--ink));
  transform: scale(1.12);
}

.card-area {
  padding: 7px 12px 9px;
  background: var(--tray);
}

.verse-card {
  background: #FFFFFF;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(44, 36, 22, 0.04);
}

.verse-card-bar {
  height: 4px;
  background: var(--step-color);
}

.verse-card-content {
  padding: 9px 13px;
  height: var(--card-h);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  overflow: hidden;
}

.card-heading {
  font: 700 15px/1.22 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--step-color);
  margin: 0 0 4px;
}

.card-quote {
  font: 400 12.8px/1.4 Georgia, Cambria, serif;
  color: var(--ink);
  margin: 0 0 5px;
}

.card-ref {
  font: 600 11.4px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
  margin-left: 5px;
  white-space: nowrap;
}

.card-note {
  font: 400 12.3px/1.38 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #463E32;
  margin: 0;
}

.nav-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 8px;
}

.nav-btn {
  appearance: none;
  min-height: 44px;
  min-width: 96px;
  padding: 0 15px;
  border-radius: 10px;
  border: 1px solid #DCD4C6;
  background: #FFFFFF;
  color: var(--ink);
  font: 600 13.5px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.nav-btn.primary {
  background: var(--step-color);
  border-color: var(--step-color);
  color: #FAF8F3;
}

.nav-btn.primary:hover:not(:disabled) {
  background: var(--step-dark);
  border-color: var(--step-dark);
}

.nav-btn:hover:not(:disabled):not(.primary) {
  background: #F4EFE5;
}

.nav-btn:disabled {
  opacity: 0.36;
  cursor: default;
}

.step-count {
  font: 600 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--muted);
}

button:focus-visible {
  outline: 3px solid #E0A526;
  outline-offset: 2px;
}

@media (prefers-reduced-motion: no-preference) {
  .widget-outer:not(.is-instant) .opening-cue {
    transition: opacity 0.36s ease;
  }
  .widget-outer:not(.is-instant) .scene-layer {
    transition: opacity 0.52s ease;
  }
  .widget-outer .step-dot-fill {
    transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s ease;
  }
  .widget-outer .nav-btn.primary,
  .widget-outer .verse-card-bar,
  .widget-outer .card-heading {
    transition: background-color 0.24s ease, border-color 0.24s ease, color 0.24s ease;
  }
}

@media (max-width: 395px) {
  .card-area {
    padding: 6px 10px 8px;
  }
  .verse-card-content {
    padding: 8px 11px;
  }
  .card-heading {
    font-size: 14.5px;
  }
  .card-quote {
    font-size: 12.2px;
  }
  .card-note {
    font-size: 11.8px;
  }
}

@media (forced-colors: active) {
  .step-dot-fill {
    border-color: ButtonText;
    background: Canvas;
  }
  .step-dot.active .step-dot-fill {
    background: Highlight;
    border-color: Highlight;
  }
  .nav-btn.primary {
    border: 2px solid Highlight;
  }
}
</style>
</head>
<body>
<main class="widget-outer" id="scene-root" aria-label="Love Through Serving"></main>

<script>
(function () {

  var SVG_NS = 'http://www.w3.org/2000/svg';

  var COLORS = {

  var STEPS = [

      color: COLORS.blue,
      dark: COLORS.blueDark,
      heading: 'Climb Down',
      quote: '"Then he poured water into a basin and began to wash the disciples\' feet..."',
      ref: 'John 13:5',
      note: 'The Lord takes the servant\'s place. No one is beneath His love.',
      desc: 'With His outer garment still resting on the stool behind Him, Jesus kneels low beside a seated disciple with a water basin between them and His woven towel draped across His hands.'

    {

      dotLabel: 'Step 4: Lift Someone Up',

    }
  ];

  function el(tag, attrs, parent) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'text') node.textContent = attrs[k];
        else if (k === 'class') node.className = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    if (parent) parent.appendChild(node);
    return node;
  }

  function svgEl(tag, attrs, parent) {
    var node = document.createElementNS(SVG_NS, tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'text') node.textContent = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    if (parent) parent.appendChild(node);
    return node;
  }

  function addLinearGrad(defs, id, x1, y1, x2, y2, stops) {
    var g = svgEl('linearGradient', { id: id, x1: x1, y1: y1, x2: x2, y2: y2 }, defs);
    stops.forEach(function (s) {
      var a = { offset: s[0], 'stop-color': s[1] };
      if (s[2] !== undefined) a['stop-opacity'] = String(s[2]);
      svgEl('stop', a, g);
    });
    return g;
  }

  function addRadialGrad(defs, id, cx, cy, r, stops) {
    var g = svgEl('radialGradient', { id: id, cx: cx, cy: cy, r: r }, defs);
    stops.forEach(function (s) {
      var a = { offset: s[0], 'stop-color': s[1] };

  function init() {
    var host = document.getElementById('scene-root');
    if (!host) return;

    var bar = el('div', { class: 'title-bar' }, host);
    el('h1', { text: 'Love Through Serving' }, bar);
    el('span', { class: 'course-tag', text: '203-04' }, bar);

    var bundle = buildStage(host);

    var strip = el('div', { class: 'step-strip', role: 'group', 'aria-label': 'Love Through Serving steps' }, host);
    var dotButtons = STEPS.map(function (st, idx) {
      var btn = el('button', {
        type: 'button',
        class: 'step-dot',
        'data-step': String(idx),
        'aria-label': st.dotLabel,
        'aria-pressed': 'false'
      }, strip);
      btn.style.setProperty('--dot-color', st.color);
      el('span', { class: 'step-dot-fill' }, btn);
      return btn;

    var cardArea = el('div', { class: 'card-area' }, host);
    var cardBox = el('div', { class: 'verse-card' }, cardArea);
    el('div', { class: 'verse-card-bar' }, cardBox);

      id: 'card-content',
      class: 'verse-card-content',
      'aria-live': 'polite'
    }, cardBox);
    var headingEl = el('h2', { class: 'card-heading' }, contentEl);
    var quoteWrap = el('p', { class: 'card-quote' }, contentEl);
    var quoteTextEl = el('span', {}, quoteWrap);
    var refEl = el('span', { class: 'card-ref' }, quoteWrap);
    var noteEl = el('p', { class: 'card-note' }, contentEl);

    var navBar = el('div', { class: 'nav-bar' }, cardArea);
    var prevBtn = el('button', { id: 'prev-btn', type: 'button', class: 'nav-btn', text: '\u2190 Back' }, navBar);
    var countEl = el('span', { class: 'step-count', text: 'Ready' }, navBar);
    var nextBtn = el('button', { id: 'next-btn', type: 'button', class: 'nav-btn primary', text: 'Begin \u2192' }, navBar);

    var currentStep = 0;
    var activeRaf = null;
    var reducedMotionQuery = window.matchMedia
      ? window.matchMedia('(prefers-reduced-motion: reduce)')
      : { matches: false };

    function stopAnim() {
      if (activeRaf !== null) {
        cancelAnimationFrame(activeRaf);
        activeRaf = null;
      }
    }

    function applyStaticLayers(stepIdx) {
      bundle.cue.classList.toggle('is-hidden', stepIdx > 0);
      bundle.floorBase.classList.toggle('is-visible', stepIdx > 0);
      bundle.step1Layer.classList.toggle('is-visible', stepIdx === 1);
      bundle.step2Layer.classList.toggle('is-visible', stepIdx === 2);
      bundle.step3Layer.classList.toggle('is-visible', stepIdx === 3);
      bundle.step4Layer.classList.toggle('is-visible', stepIdx === 4);
    }

    function snapStroke(pathEl) {
      if (!pathEl) return;
      pathEl.style.strokeDasharray = '';
      pathEl.style.strokeDashoffset = '';
    }

    function snapFinalMotion() {
      snapStroke(bundle.towelGreen);
      snapStroke(bundle.towelGold);
    }

    function animateStep(stepIdx) {
      if (stepIdx !== 4) {
        host.setAttribute('data-step-dur', '0');
        snapFinalMotion();
        return;
      }

      // Step 4 spark: trace Jesus' woven towel threads smoothly from left to right
      var paths = [bundle.towelGreen, bundle.towelGold].filter(Boolean);
      var lengths = paths.map(function (p) { return p.getTotalLength(); });
      var dur = 820;
      host.setAttribute('data-step-dur', String(dur));
      paths.forEach(function (p, i) {
        p.style.strokeDasharray = String(lengths[i]);
        p.style.strokeDashoffset = String(lengths[i]);
      });

      var t0 = performance.now();
      var frame = function (now) {
        var p = Math.min(1, (now - t0) / dur);
        var eased = 1 - Math.pow(1 - p, 2);
        paths.forEach(function (pathEl, i) {
          pathEl.style.strokeDashoffset = String((lengths[i] * (1 - eased)).toFixed(2));
        });
        if (p < 1) {
          activeRaf = requestAnimationFrame(frame);
        } else {
          snapFinalMotion();
          activeRaf = null;
        }
      };
      activeRaf = requestAnimationFrame(frame);
    }

    function goTo(nextIdx) {
      stopAnim();
      var prevIdx = currentStep;
      var goingForwardOne = nextIdx === prevIdx + 1;
      var instant = reducedMotionQuery.matches || !goingForwardOne || nextIdx === 0;

      host.classList.toggle('is-instant', instant);
      applyStaticLayers(nextIdx);

      if (instant) {
        host.setAttribute('data-step-dur', '0');
        snapFinalMotion();
      } else {
        animateStep(nextIdx);
      }

      currentStep = nextIdx;
      var step = STEPS[currentStep];
      host.setAttribute('data-step', String(currentStep));
      host.style.setProperty('--step-color', step.color);
      host.style.setProperty('--step-dark', step.dark);
      bundle.svgDesc.textContent = step.desc;

      headingEl.textContent = step.heading;
      quoteTextEl.textContent = step.quote;
      refEl.textContent = '(' + step.ref + ')';
      noteEl.textContent = step.note;

      dotButtons.forEach(function (btn, idx) {
        btn.classList.toggle('active', idx === currentStep);
        btn.classList.toggle('passed', idx < currentStep);
        btn.setAttribute('aria-pressed', idx === currentStep ? 'true' : 'false');
      });

      countEl.textContent = currentStep === 0 ? 'Ready' : ('Step ' + currentStep + ' of ' + (STEPS.length - 1));
      prevBtn.disabled = currentStep === 0;
      if (currentStep === 0) {
        nextBtn.textContent = 'Begin \u2192';
      } else if (currentStep === STEPS.length - 1) {
        nextBtn.textContent = '\u21BB Start Over';
      } else {
        nextBtn.textContent = 'Next \u2192';
      }
    }

    dotButtons.forEach(function (btn, idx) {
      btn.addEventListener('click', function () {
        goTo(idx);
      });
    });

    prevBtn.addEventListener('click', function () {
      if (currentStep > 0) goTo(currentStep - 1);
    });
    nextBtn.addEventListener('click', function () {
      goTo(currentStep === STEPS.length - 1 ? 0 : currentStep + 1);
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowRight' && currentStep < STEPS.length - 1) {
        goTo(currentStep + 1);
      } else if (event.key === 'ArrowLeft' && currentStep > 0) {
        goTo(currentStep - 1);
      }
    });

    var lastWidth = window.innerWidth;
    var measuredWidth = 0;
    function fitCardHeight() {
      if (!contentEl || contentEl.clientWidth === measuredWidth) return;
      measuredWidth = contentEl.clientWidth;
      var keepH = headingEl.textContent;
      var keepQ = quoteTextEl.textContent;
      var keepR = refEl.textContent;
      var keepN = noteEl.textContent;
      var tallest = 0;
      document.documentElement.style.setProperty('--card-h', 'auto');
      STEPS.forEach(function (st) {
        headingEl.textContent = st.heading;
        quoteTextEl.textContent = st.quote;
        refEl.textContent = '(' + st.ref + ')';
        noteEl.textContent = st.note;
        tallest = Math.max(tallest, contentEl.offsetHeight);
      });
      headingEl.textContent = keepH;
      quoteTextEl.textContent = keepQ;
      refEl.textContent = keepR;
      noteEl.textContent = keepN;
      document.documentElement.style.setProperty('--card-h', Math.max(100, Math.ceil(tallest)) + 'px');
    }

    var resizeTimer = null;
    window.addEventListener('resize', function () {
      if (window.innerWidth === lastWidth) return;
      lastWidth = window.innerWidth;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(fitCardHeight, 120);
    });

    goTo(0);
    fitCardHeight();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
