<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fleet Dice</title>
  <meta
    name="description"
    content="Build a fleet of dice, chase straights, and break the enemy flagship."
  />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta property="og:title" content="Fleet Dice" />
  <meta
    property="og:description"
    content="Build a fleet of dice, chase straights, and break the enemy flagship."
  />
  <meta
    property="og:image"
    content="https://ministrybag.com/fleetdice/fleet-dice-key-art.png"
  />
  <meta property="og:url" content="https://ministrybag.com/fleetdice/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --ink: #eef3ff;
      --dim: #9aacc8;
      --blue: #45b6ff;
      --red: #ff5b7a;
      --gold: #ffe81f;
      --bg: #080c18;
      --line: #24324d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background:
        radial-gradient(1200px 700px at 70% 10%, #16305a55, transparent 60%),
        radial-gradient(900px 600px at 15% 90%, #4a173655, transparent 55%),
        linear-gradient(180deg, #0a1020 0%, var(--bg) 55%, #060912 100%);
    }

    .page {
      width: min(720px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 calc(36px + env(safe-area-inset-bottom, 0px));
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--blue) 40%, transparent);
    }

    .brand span {
      font-family: "Space Grotesk", sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .back {
      color: var(--dim);
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover {
      color: var(--ink);
    }

    .hero {
      position: relative;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--blue) 35%, var(--line));
      border-radius: 24px;
      box-shadow:
        0 30px 70px -40px #000,
        0 0 48px -24px #45b6ff66;
      animation: rise 0.7s ease both;
    }

    .hero-art {
      display: block;
      width: 100%;
      height: auto;
      vertical-align: middle;
    }

    .hero-scrim {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      padding: clamp(22px, 5vw, 34px) clamp(18px, 4vw, 28px) clamp(20px, 4vw, 30px);
      background:
        linear-gradient(
          90deg,
          #060a14 0%,
          #060a14 44%,
          rgba(6, 10, 20, 0.82) 60%,
          rgba(6, 10, 20, 0.08) 82%
        ),
        linear-gradient(
          0deg,
          rgba(6, 10, 20, 0.9) 0%,
          rgba(6, 10, 20, 0.34) 52%,
          transparent 100%
        );
    }

    .kicker {
      margin-bottom: 8px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .hero h1 {
      max-width: 12ch;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(42px, 10vw, 64px);
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 0.95;
      animation: rise 0.8s 0.08s ease both;
    }

    .hero h1 span {
      display: block;
      background: linear-gradient(100deg, #ff7b93, #ffc857);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lead {
      max-width: 34ch;
      margin-top: 12px;
      color: #c5d2ea;
      font-size: clamp(15px, 2.4vw, 18px);
      line-height: 1.45;
      animation: rise 0.8s 0.16s ease both;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 54px;
      margin-top: 20px;
      padding: 0 22px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #2f8dff, #45b6ff 55%, #78d0ff);
      color: #07101f;
      font-family: "Space Grotesk", sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-decoration: none;
      box-shadow: 0 14px 30px -16px #45b6ffaa;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      animation: rise 0.85s 0.24s ease both;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px -14px #45b6ffcc;
    }

    .cta:active {
      transform: translateY(0);
    }

    .cta span[aria-hidden="true"] {
      font-size: 1.1em;
      transition: transform 0.18s ease;
    }

    .cta:hover span[aria-hidden="true"] {
      transform: translateX(3px);
    }

    .footnote {
      margin-top: 18px;
      color: #7f90b0;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 520px) {
      .page {
        width: calc(100% - 20px);
        padding-top: 12px;
      }

      .hero {
        border-radius: 18px;
      }

      .hero-scrim {
        position: relative;
        inset: auto;
        padding: 22px 16px 18px;
        background: linear-gradient(180deg, #0b1325, #070c18);
      }

      .cta {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand-row">
      <a class="brand" href="/fleetdice/">
        <img src="apple-touch-icon.png" alt="" width="42" height="42" />
        <span>Fleet Dice</span>
      </a>
      <a class="back" href="/">MinistryBag</a>
    </div>

    <section class="hero" aria-labelledby="title">
      <img
        class="hero-art"
        src="fleet-dice-key-art.png"
        alt="Fleet Dice ships and dice crossing a battlefield in space."
        width="1024"
        height="640"
      />
      <div class="hero-scrim">
        <p class="kicker">Dice-building space combat</p>
        <h1 id="title">
          Fleet Dice
          <span>Break the flagship.</span>
        </h1>
        <p class="lead">
          Every die is a ship. Roll, upgrade, and hunt the straight that ends the war.
        </p>
        <a
          class="cta"
          href="https://davepartin.github.io/spacetribe-dice/"
        >
          Play Fleet Dice
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </section>

    <p class="footnote">Opens the live game in your browser. Nothing to install.</p>
  </main>
</body>
</html>
