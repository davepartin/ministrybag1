<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SendKC Planter Lunch — RSVP</title>
<meta name="description" content="RSVP for the SendKC Planter Lunch">
<link rel="icon" type="image/svg+xml" href="/ministrybagsatchel1.svg">
<meta property="og:title" content="SendKC Planter Lunch — RSVP" />
<meta property="og:description" content="Tap to RSVP for the SendKC Planter Lunch." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://ministrybag.com/lunch-rsvp/" />
<meta property="og:image" content="https://ministrybag.com/lunch-rsvp/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://ministrybag.com/lunch-rsvp/og-image.png" />
<style>
  :root {
    /* Send Network brand palette (NAMB design guidelines) */
    --navy: #10294C;      /* SN primary navy */
    --blue: #18AEE1;      /* SN primary blue */
    --green: #50B849;     /* SN green */
    --green-soft: #99CC67;
    --amber: #FBAC33;     /* SN amber */
    --steel: #3C7CA0;     /* SN tertiary blue */
    --gray-light: #EBECED;
    --gray-mid: #ADB3B8;
    --slate: #5C6670;
    --red: #D0453E;       /* not in SN palette; used only for the No button */
    --ink: #10294C;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, var(--navy) 0%, #163662 60%, #1d4478 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; color: var(--ink);
  }
  .card {
    background: #fff; width: 100%; max-width: 460px;
    border-radius: var(--radius); overflow: hidden;
    box-shadow: 0 18px 50px rgba(6, 18, 38, .45);
  }
  .head { background: var(--navy); padding: 24px 26px 20px; }
  .head img.logo { width: 200px; max-width: 60%; display: block; }
  .head .kicker { margin-top: 16px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--blue); font-weight: 800; }
  .head h1 { font-size: 26px; margin-top: 4px; line-height: 1.2; color: #fff; }
  .details { background: var(--gray-light); padding: 16px 26px; font-size: 15px; line-height: 1.65; border-bottom: 3px solid var(--blue); }
  .details b { color: var(--navy); }
  .details a { color: var(--steel); }
  .body { padding: 22px 26px 28px; }
  .q { font-size: 16px; font-weight: 800; color: var(--navy); margin-bottom: 10px; }
  .choice { display: flex; gap: 8px; margin-bottom: 18px; }
  .choice button {
    flex: 1; padding: 14px 4px; cursor: pointer; border-radius: 12px;
    border: 2px solid var(--gray-mid); background: #fff; transition: all .15s;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .choice .mark { font-size: 24px; font-weight: 900; line-height: 1; }
  .choice .word { font-size: 15px; font-weight: 800; }
  .choice .yes   { color: var(--green); border-color: var(--green); }
  .choice .maybe { color: #C77F0A; border-color: var(--amber); }
  .choice .no    { color: var(--red); border-color: var(--red); }
  .choice .yes.sel   { background: var(--green); color: #fff; }
  .choice .maybe.sel { background: var(--amber); color: var(--navy); }
  .choice .no.sel    { background: var(--red); color: #fff; }
  label { display: block; font-size: 13px; font-weight: 800; color: var(--navy); margin: 14px 0 5px; letter-spacing: .03em; text-transform: uppercase; }
  input[type=text] {
    width: 100%; padding: 12px 14px; font-size: 16px; border: 2px solid var(--gray-mid);
    border-radius: 10px; outline: none; background: #fbfcfd; color: var(--ink);
  }
  input:focus { border-color: var(--blue); background: #fff; }
  #totalBox {
    display: none; margin-top: 16px; padding: 14px 16px 16px;
    background: #f3faf1; border: 2px solid var(--green); border-radius: 12px;
  }
  #totalBox .tb-label { font-size: 14px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: .03em; }
  #totalBox .tb-sub { font-size: 13px; color: var(--slate); margin: 2px 0 10px; }
  .stepper { display: flex; align-items: center; gap: 16px; }
  .stepper button {
    width: 50px; height: 50px; font-size: 26px; font-weight: 800; cursor: pointer;
    border-radius: 50%; border: 2px solid var(--green); background: #fff; color: var(--green);
  }
  .stepper button:active { background: var(--gray-light); }
  .stepper .num { font-size: 32px; font-weight: 900; min-width: 46px; text-align: center; color: var(--navy); }
  .submit {
    width: 100%; margin-top: 22px; padding: 16px; font-size: 17px; font-weight: 800;
    background: var(--navy); color: #fff; border: none; border-radius: var(--radius); cursor: pointer;
    letter-spacing: .02em;
  }
  .submit:hover { background: #0b1f3a; }
  .submit:disabled { background: var(--gray-mid); cursor: default; }
  .err { color: var(--red); font-size: 14px; margin-top: 10px; display: none; font-weight: 600; }
  .done { text-align: center; padding: 46px 30px 50px; display: none; }
  .done .big { font-size: 52px; }
  .done h2 { color: var(--navy); font-size: 24px; margin: 12px 0 8px; }
  .done p { color: var(--slate); font-size: 15px; line-height: 1.6; }
  .done .cal {
    display: inline-block; margin-top: 18px; padding: 12px 22px; border-radius: 10px;
    background: var(--gray-light); color: var(--navy); font-weight: 800; text-decoration: none; font-size: 15px;
    border: 1px solid var(--gray-mid);
  }
  .foot { text-align: center; font-size: 12.5px; color: var(--slate); padding: 0 26px 22px; }
  /* Compact layout on phones: goal is Yes/Maybe/No, name, and Send all above the fold */
  @media (max-width: 480px) {
    body { padding: 8px; align-items: flex-start; }
    .head { padding: 12px 18px 10px; }
    .head img.logo { width: 140px; }
    .head .kicker { margin-top: 8px; font-size: 11px; }
    .head h1 { font-size: 20px; margin-top: 2px; }
    .details { padding: 9px 18px; font-size: 13.5px; line-height: 1.5; }
    .body { padding: 12px 18px 16px; }
    .q { font-size: 15px; margin-bottom: 8px; }
    .choice { margin-bottom: 10px; gap: 6px; }
    .choice button { padding: 8px 4px; border-radius: 10px; }
    .choice .mark { font-size: 19px; }
    .choice .word { font-size: 14px; }
    label { margin: 8px 0 4px; font-size: 12px; }
    input[type=text] { padding: 10px 12px; font-size: 16px; }
    #totalBox { margin-top: 10px; padding: 10px 14px 12px; }
    #totalBox .tb-sub { margin: 2px 0 8px; font-size: 12px; }
    .stepper button { width: 42px; height: 42px; font-size: 22px; }
    .stepper .num { font-size: 26px; }
    .submit { margin-top: 12px; padding: 13px; font-size: 16px; }
    .foot { padding: 0 18px 12px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <img class="logo" src="sn-logo-white.png" alt="Send Network">
    <div class="kicker">SendKC</div>
    <h1 id="evTitle">SendKC Planter Lunch</h1>
  </div>
  <div class="details" id="evDetails"></div>

  <div class="body" id="form">
    <div class="q">Are you coming?</div>
    <div class="choice">
      <button type="button" class="yes" id="btnYes"><span class="mark">&#10003;</span><span class="word">Yes</span></button>
      <button type="button" class="maybe" id="btnMaybe"><span class="mark">?</span><span class="word">Maybe</span></button>
      <button type="button" class="no" id="btnNo"><span class="mark">&#10005;</span><span class="word">No</span></button>
    </div>
    <label for="name">Your name</label>
    <input type="text" id="name" autocomplete="name" placeholder="First and last name">
    <div id="totalBox">
      <div class="tb-label">Total number coming</div>
      <div class="tb-sub">Count everyone, including you. Spouses welcome!</div>
      <div class="stepper">
        <button type="button" id="minus">&minus;</button>
        <div class="num" id="count">1</div>
        <button type="button" id="plus">+</button>
      </div>
    </div>
    <button class="submit" id="submit">Send my RSVP</button>
    <div class="err" id="err"></div>
  </div>

  <div class="done" id="done">
    <div class="big" id="doneEmoji">&#127881;</div>
    <h2 id="doneTitle">You're on the list!</h2>
    <p id="doneMsg"></p>
    <a class="cal" id="calLink" target="_blank" rel="noopener">&#128197; Add to calendar</a>
  </div>

  <div class="foot">Questions? Text Dave Partin at (913) 901-7581.</div>
</div>

<script>
/* ============================================================
   MONTHLY SETUP — edit this block for each lunch, then
   commit + push to GitHub (goes live at ministrybag.com/lunch-rsvp).
   ============================================================ */
const EVENT = {
  id: "planter-lunch-2026-07",
  title: "SendKC Planter Lunch — July",
  dateText: "Thursday, July 23, 2026",
  timeText: "11:30 AM – 1:00 PM",
  place: "Neighborhood Church",
  address: "8600 W 91st Terrace, Overland Park, KS 66212",
  rsvpBy: "Tuesday, July 21",
  // Google Calendar template times: YYYYMMDDTHHMMSS local (Central)
  gcalStart: "20260723T113000",
  gcalEnd: "20260723T130000",
};
const ENDPOINT = "https://script.google.com/macros/s/AKfycby1tzgv6ANAHWlNt6JCxsknP11hmu9vT9aijgXX3jjLrshhBZjXIVFQo5v97wWTeczE/exec";
/* ============================================================ */

const $ = id => document.getElementById(id);
$("evTitle").textContent = EVENT.title;
$("evDetails").innerHTML =
  `<b>&#128197; ${EVENT.dateText}</b> &middot; ${EVENT.timeText}<br>` +
  `&#128205; <b>${EVENT.place}</b> &middot; <a href="https://maps.google.com/?q=${encodeURIComponent(EVENT.address)}" target="_blank" rel="noopener">${EVENT.address}</a><br>` +
  `Please RSVP by <b>${EVENT.rsvpBy}</b> so we can plan the food well.`;

let choice = null, count = 1;
const buttons = { YES: $("btnYes"), MAYBE: $("btnMaybe"), NO: $("btnNo") };

function pick(val) {
  choice = val;
  for (const [k, btn] of Object.entries(buttons)) btn.classList.toggle("sel", k === val);
  $("totalBox").style.display = (val === "YES") ? "block" : "none";
}
$("btnYes").addEventListener("click", () => pick("YES"));
$("btnMaybe").addEventListener("click", () => pick("MAYBE"));
$("btnNo").addEventListener("click", () => pick("NO"));
$("plus").addEventListener("click", () => { count = Math.min(10, count + 1); $("count").textContent = count; });
$("minus").addEventListener("click", () => { count = Math.max(1, count - 1); $("count").textContent = count; });

$("submit").addEventListener("click", async () => {
  const name = $("name").value.trim();
  const err = $("err");
  err.style.display = "none";
  if (!choice) { err.textContent = "Please tap Yes, Maybe, or No first."; err.style.display = "block"; return; }
  if (name.length < 2) { err.textContent = "Please add your name so Dave knows it's you."; err.style.display = "block"; return; }
  $("submit").disabled = true;
  $("submit").textContent = "Sending…";
  const payload = {
    event: EVENT.id,
    name: name,
    coming: choice,
    count: choice === "YES" ? count : 0,
    phone: "",
    note: "",
  };
  try {
    await fetch(ENDPOINT, { method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload) });
    showDone(name);
  } catch (e) {
    $("submit").disabled = false;
    $("submit").textContent = "Send my RSVP";
    err.textContent = "Hmm, that didn't go through. Try again, or just text Dave: (913) 901-7581.";
    err.style.display = "block";
  }
});

function calUrl() {
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(EVENT.title)
    + "&dates=" + EVENT.gcalStart + "/" + EVENT.gcalEnd
    + "&location=" + encodeURIComponent(EVENT.place + ", " + EVENT.address)
    + "&details=" + encodeURIComponent("SendKC Planter Lunch. Questions? Dave Partin (913) 901-7581");
}

function showDone(name) {
  $("form").style.display = "none";
  const first = name.split(" ")[0];
  if (choice === "YES") {
    $("doneEmoji").innerHTML = "&#127881;";
    $("doneTitle").textContent = "You're on the list, " + first + "!";
    $("doneMsg").textContent = `${EVENT.dateText}, ${EVENT.timeText} at ${EVENT.place}. Lunch is on us — see you there.`;
    $("calLink").href = calUrl();
    $("calLink").style.display = "inline-block";
  } else if (choice === "MAYBE") {
    $("doneEmoji").innerHTML = "&#128591;";
    $("doneTitle").textContent = "Thanks, " + first + " — we'd love to have you.";
    $("doneMsg").textContent = "If your plans firm up, come back and tap Yes, or just come — there will be a seat for you.";
    $("calLink").href = calUrl();
    $("calLink").style.display = "inline-block";
  } else {
    $("doneEmoji").innerHTML = "&#128591;";
    $("doneTitle").textContent = "Thanks for letting us know, " + first + ".";
    $("doneMsg").textContent = "You'll be missed! We'll see you at the next one.";
    $("calLink").style.display = "none";
  }
  $("done").style.display = "block";
}
</script>
</body>
</html>
